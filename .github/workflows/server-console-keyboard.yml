name: Validate server console keyboard focus
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/server-console-keyboard.yml']
permissions:
  contents: write
concurrency:
  group: server-console-keyboard-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch focus handshake only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def replace(p,sha,old,new):
              p=Path(p)
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha
              text=p.read_text()
              assert text.count(old)==1,str(p)
              updated=text.replace(old,new,1)
              assert updated.replace(new,old,1)==text
              p.write_text(updated)
          replace('app/src/main/assets/terminal/server-console.js','67f7d4efee8fe7533fabf7fff06a7947aed18878',
              '        term.focus(); follow = true; dirty = true; schedule(); return true;',
              '''        var state = editor && editor.snapshot();
                  if (!state || !state.enabled || state.pending || state.disposed) return false;
                  var textarea = term.textarea;
                  if (!textarea || textarea.disabled || textarea.readOnly) return false;
                  term.focus();
                  if (document.activeElement !== textarea) return false;
                  return true;''')
          p='app/src/main/java/iecxiv/meshfabric/ui/management/ServerConsoleTerminal.kt'
          old='''    fun focusInput() {
                  if(destroyed || broken || !ready || !view.isAttachedToWindow || !canSend()) return
                  view.requestFocus()
                  view.evaluateJavascript("window.serverConsoleFocus && window.serverConsoleFocus()") { value->
                      if(value=="true") view.post {
                          if(!destroyed && !broken && ready && view.isAttachedToWindow && canSend()) {
                              (view.context.getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager)?.showSoftInput(view,0)
                          }
                      }
                  }
              }
          '''
          new='''    private fun inputFocusAllowed() = !destroyed && !broken && ready && view.isAttachedToWindow && view.hasWindowFocus() && canSend()
              fun focusInput() {
                  if(!inputFocusAllowed() || !view.requestFocusFromTouch()) return
                  view.evaluateJavascript("window.serverConsoleSetInputEnabled && window.serverConsoleSetInputEnabled(true) && window.serverConsoleFocus && window.serverConsoleFocus()") { value->
                      if(value!="true" || !inputFocusAllowed()) return@evaluateJavascript
                      view.postDelayed({
                          if(inputFocusAllowed() && view.hasFocus()) {
                              view.evaluateJavascript("window.serverConsoleFocus && window.serverConsoleFocus()") { focused->
                                  if(focused=="true" && inputFocusAllowed() && view.hasFocus()) {
                                      val ime=view.context.getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                                      ime?.restartInput(view)
                                      view.post {
                                          if(inputFocusAllowed() && view.hasFocus()) ime?.showSoftInput(view,InputMethodManager.SHOW_IMPLICIT)
                                      }
                                  }
                              }
                          }
                      },100L)
                  }
              }
          '''
          replace(p,'ff614b0f7defa0e324648b37bf45b8ae58acd516',old,new)
      - name: Check JavaScript syntax and focus regression cases
        shell: bash
        run: |
          git diff --check
          node --check app/src/main/assets/terminal/server-console.js
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const text=fs.readFileSync('app/src/main/assets/terminal/server-console.js','utf8');
          const fn=text.match(/window\.serverConsoleFocus = function \(\) \{[\s\S]*?\n    \};/)[0];
          function run(overrides={}) {
            const document={activeElement:null};
            let calls=0;
            const textarea={disabled:false,readOnly:false};
            const ctx={window:{serverConsoleFailed:false},disposed:false,interactive:true,available:true,document,
              editor:{snapshot:()=>({enabled:true,pending:false,disposed:false})},
              term:{textarea,focus:()=>{calls++;document.activeElement=textarea;}},...overrides};
            vm.runInNewContext(fn,ctx);
            return {result:ctx.window.serverConsoleFocus(),calls};
          }
          assert.deepEqual(run(),{result:true,calls:1});
          for(const overrides of [{disposed:true},{interactive:false},{available:false},{window:{serverConsoleFailed:true}},
            {editor:{snapshot:()=>({enabled:false})}},{editor:{snapshot:()=>({enabled:true,pending:true})}},
            {editor:{snapshot:()=>({enabled:true,disposed:true})}},
            {term:{textarea:null}},{term:{textarea:{disabled:true}}},{term:{textarea:{readOnly:true}}}]) {
            assert.equal(run(overrides).result,false);
          }
          assert.equal(run({term:{textarea:{},focus:()=>{}}}).result,false);
          JS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-console-keyboard-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated patch and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/server-console-keyboard.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/ServerConsoleTerminal.kt','app/src/main/assets/terminal/server-console.js',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(server-console): verify editor focus before requesting keyboard'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
