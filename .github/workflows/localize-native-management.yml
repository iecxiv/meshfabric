          clipboard_channel|Canal: ${clipboard.transport}|Channel: %1$s
          clipboard_session_warning|No se abre un escritorio ni se simula Ctrl+V. La disponibilidad depende también de las políticas del servidor y de la sesión gráfica remota.|No desktop is opened and Ctrl+V is not simulated. Availability also depends on server policies and the remote graphical session.
          command_waiting|Esperando respuesta del agente…|Waiting for the agent response…
          output_truncated|Salida recibida (limitada a 64000 caracteres)|Output received (limited to 64000 characters)
          output_empty|El agente devolvió una salida vacía|The agent returned empty output
          output_received|Salida recibida del agente|Output received from the agent
          command_accepted|Solicitud aceptada; esperando la salida…|Request accepted; waiting for output…
          clipboard_waiting|Texto enviado; esperando verificación…|Text sent; waiting for verification…
          clipboard_accepted|El agente aceptó la petición; falta verificar el contenido.|The agent accepted the request; the content still needs to be verified.
          clipboard_rejected|El agente ha rechazado la actualización del portapapeles.|The agent rejected the clipboard update.
          clipboard_verified|El agente devuelve el texto enviado. Esto no garantiza que otra sesión gráfica comparta ese portapapeles.|The agent returned the text that was sent. This does not guarantee that another graphical session shares that clipboard.
          clipboard_mismatch|El agente devuelve un contenido diferente; verificando…|The agent returned different content; verifying…
          clipboard_mismatch_timeout|El agente sigue devolviendo un contenido diferente. No se confirma la actualización del portapapeles.|The agent continues to return different content. The clipboard update is not confirmed.
          clipboard_unverified|El agente aceptó el envío, pero no se pudo verificar la lectura del portapapeles.|The agent accepted the text, but reading the clipboard back could not be verified.
          clipboard_no_confirmation|No se ha recibido confirmación. Revisa permisos ClipboardSet/ClipboardGet y la sesión gráfica del equipo remoto.|No confirmation was received. Check ClipboardSet/ClipboardGet permissions and the remote device graphical session.
          command_send_failed|No se pudo enviar el comando.|Could not send the command.
          command_timeout|Sin salida confirmada tras 60 segundos. El comando puede seguir ejecutándose; no se ha reenviado.|No confirmed output after 60 seconds. The command may still be running; it has not been resent.
          agent_transport|Agente (canal de control)|Agent (control channel)
          desktop_transport|Escritorio nativo ya conectado|Already connected native desktop
          clipboard_send_failed|No se pudo enviar el texto.|Could not send the text.
          command_interrupted|Conexión interrumpida. Resultado desconocido; no se repetirá el comando.|Connection interrupted. Result unknown; the command will not be repeated.
          clipboard_interrupted|Conexión interrumpida. No se ha confirmado la actualización del portapapeles.|Connection interrupted. The clipboard update has not been confirmed.
          unknown_device|Equipo no identificado|Unidentified device
          server|Servidor|Server
          unknown_source|Origen no identificado|Unidentified source
          notification_title|Título: ${j.str("title").take(160)}|Title: %1$s
          command_description|Comando remoto; su salida se consulta en la ventana de resultado.|Remote command; its output is available in the result window.
          url_hidden|URL enviada (parámetros ocultos)|URL sent (parameters hidden)
          request_send_failed|No se pudo enviar la solicitud.|Could not send the request.
          notification_unconfirmed|Enviada al servidor; visualización en el equipo no confirmada.|Sent to the server; display on the device is unconfirmed.
          execution_unconfirmed|Enviada al servidor; ejecución en el equipo sin confirmar.|Sent to the server; execution on the device is unconfirmed.
          request_rejected|Solicitud rechazada|Request rejected
          output_received_sentence|Salida recibida del agente.|Output received from the agent.
          server_accepted|Aceptada por el servidor; ejecución todavía sin confirmar.|Accepted by the server; execution is still unconfirmed.
          uninterpreted_reply|Respuesta recibida, resultado no interpretado: ${result.take(300)}|Response received, result not interpreted: %1$s
          device_connected|Equipo conectado|Device connected
          device_disconnected|Equipo desconectado|Device disconnected
          device_updated|Datos del equipo actualizados|Device details updated
          device_removed|Equipo eliminado|Device removed
          group_updated|Grupo actualizado|Group updated
          account_updated|Cuenta actualizada|Account updated
          server_event|Evento del servidor|Server event
          no_event_description|El servidor no incluyó una descripción adicional.|The server did not include an additional description.
          unmatched_message|Mensaje sin operación vinculada|Message not linked to an operation
          no_execution_confirmation|No hay confirmación de ejecución. Comprueba el equipo antes de repetir la acción.|Execution is not confirmed. Check the device before repeating the action.
          request_interrupted|Conexión interrumpida; resultado desconocido. No se repetirá la solicitud.|Connection interrupted; result unknown. The request will not be repeated.
          status_sent|Solicitud enviada|Request sent
          status_accepted|Aceptada|Accepted
          status_output|Salida recibida|Output received
          status_confirmed|Confirmada|Confirmed
          status_error|Rechazada / error|Rejected / error
          status_unknown|Sin confirmación|Unconfirmed
          status_event|Evento|Event
          all_devices|Todos los dispositivos|All devices
          all|Todos|All
          my_actions|Mis acciones|My actions
          errors|Errores|Errors
          activity_empty|No hay actividad que coincida con los filtros.|No activity matches the filters.
          received_prefix|Recibido |Received 
          actor|Por ${entry.actor}|By %1$s
          view_output|Ver salida|View output
          hide|Ocultar|Hide
          details|Detalles|Details
          device_id|ID del equipo: ${entry.nodeId}|Device ID: %1$s
          request_id|Petición: ${entry.requestId}|Request: %1$s
          action_type|Tipo técnico: ${entry.action}|Technical type: %1$s
          updated_at|Última actualización: ${DateFormat.getDateTimeInstance().format(Date(entry.updated))}|Last updated: %1$s
          output_expired|La salida ya no se conserva en esta sesión.|The output is no longer retained in this session.
          devices|Equipos|Devices
          activity|Actividad|Activity
          reconnect_activity|Reconectar actividad|Reconnect activity
          search_activity|Buscar en actividad…|Search activity…
          file_editing|Editando: ${editingFilePath?.substringAfterLast('/')}|Editing: %1$s
          download_notifications|Notificaciones de descarga activadas|Download notifications enabled
          back|Atrás|Back
          search|Buscar|Search
          go_to_path|Ir a Ruta|Go to path
          refresh|Refrescar|Refresh
          disconnect_files|Desconectar Archivos|Disconnect Files
          new_folder|Nueva Carpeta|New Folder
          new_text_file|Nuevo Archivo de Texto|New Text File
          creation_options|Opciones de creación|Creation options
          navigate_up|Subir carpeta|Go to parent folder
          cancel_clipboard|Cancelar portapapeles|Cancel clipboard
          cancel_read|Cancelar lectura de archivo|Cancel file reading
          cancel_transfer|Cancelar transferencia|Cancel transfer
          options|Opciones|Options'''
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape
          base = Path('app/src/main')
          java = base / 'java/iecxiv/meshfabric'
          helper = java / 'NativeStrings.kt'
          if helper.exists():
              raise SystemExit('NativeStrings.kt already exists; refusing to overwrite')
          def expression_end(s, i):
              depth = 1
              while i < len(s):
                  if s.startswith('//', i):
                      j = s.find('\n', i); i = len(s) if j < 0 else j; continue
                  if s.startswith('/*', i):
                      j = s.find('*/', i + 2)
                      if j < 0: raise ValueError('Unclosed comment')
                      i = j + 2; continue
                  if s[i] == '"':
                      i = string_end(s, i); continue
                  if s[i] == "'":
                      i += 1
                      while i < len(s):
                          if s[i] == '\\': i += 2
                          elif s[i] == "'": i += 1; break
                          else: i += 1
                      continue
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0: return i + 1
                  i += 1
              raise ValueError('Unclosed interpolation')
          def string_end(s, start):
              if s.startswith('"""', start):
                  end = s.find('"""', start + 3)
                  if end < 0: raise ValueError('Unclosed raw string')
                  return end + 3
              i = start + 1
              while i < len(s):
                  if s[i] == '\\': i += 2
                  elif s.startswith('${', i): i = expression_end(s, i + 2)
                  elif s[i] == '"': return i + 1
                  else: i += 1
              raise ValueError('Unclosed string')
          def tokens(s):
              i = 0
              while i < len(s):
                  if s.startswith('//', i):
                      end = s.find('\n', i); i = len(s) if end < 0 else end; continue
                  if s.startswith('/*', i):
                      end = s.find('*/', i + 2)
                      if end < 0: raise ValueError('Unclosed comment')
                      i = end + 2; continue
                  if s[i] == "'":
                      i += 1
                      while i < len(s):
                          if s[i] == '\\': i += 2
                          elif s[i] == "'": i += 1; break
                          else: i += 1
                      continue
                  if s[i] == '"':
                      end = string_end(s, i)
                      if not s.startswith('"""', i): yield i, end, s[i + 1:end - 1]
                      i = end
                  else: i += 1
          pattern = re.compile(r'\$\{([^}]*)\}|\$([A-Za-z_][A-Za-z_0-9]*)')
          def template(text):
              args = []
              def replace(match):
                  args.append(match.group(1) if match.group(1) is not None else match.group(2))
                  return '%' + str(len(args)) + '$s'
              return pattern.sub(replace, text), args
          def decoded(text):
              return (text or '').replace("\\'", "'").replace('\\"', '"').replace('\\n', '\n')
          resources = {}
          for directory in ('values', 'values-es', 'values-en'):
              path = base / 'res' / directory / 'strings.xml'
              source = path.read_text()
              tree = ET.fromstring(source)
              resources[directory] = (path, source, {e.attrib['name']: decoded(e.text) for e in tree.findall('string')})
          existing = {}
          for name, value in resources['values'][2].items():
              if name in resources['values-en'][2]: existing.setdefault(value, name)
          translations = {}
          for row in data.splitlines():
              key, spanish, english = row.split('|', 2)
              spanish = spanish.replace('\\"', '"')
              formatted, args = template(spanish)
              if sorted(re.findall(r'%\d+\$s', formatted)) != sorted(re.findall(r'%\d+\$s', english)):
                  raise ValueError('Placeholder mismatch: ' + key)
              resource = existing.get(formatted, 'native_' + key)
              translations[spanish] = (resource, formatted, english, args)
          used = set()
          changed = []
          for path in sorted(java.rglob('*.kt')):
              source = path.read_text()
              edits = []
              for start, end, literal in tokens(source):
                  if literal in translations:
                      resource, spanish, english, args = translations[literal]
                      call = 'appText(R.string.' + resource
                      for arg in args: call += ', (' + arg + ')'
                      call += ')'
                      edits.append((start, end, call))
                      used.add(literal)
              if not edits: continue
              for start, end, call in reversed(edits): source = source[:start] + call + source[end:]
              for statement in ('import iecxiv.meshfabric.R', 'import iecxiv.meshfabric.appText'):
                  if statement not in source.splitlines():
                      end = source.index('\n')
                      source = source[:end + 1] + '\n' + statement + '\n' + source[end + 1:]
              if path.name == 'ActivityTimeline.kt':
                  source = source.replace('val rejected=error.isNotBlank()', 'val rejected=j.opt("result")==false || error.isNotBlank()', 1)
              path.write_text(source)
              changed.append(str(path))
          if not changed:
              raise SystemExit('No reviewed literals found; refusing an empty change')
          helper.write_text('package iecxiv.meshfabric\n\nimport androidx.annotation.StringRes\n\n/** Resource-backed messages for UI callbacks and background management code. */\ninternal fun appText(@StringRes id: Int, vararg args: Any?): String =\n    MeshFabricApp.instance.getString(id, *args)\n')
          def android_xml(text):
              text = text.replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"').replace('\n', '\\n')
              return '"' + escape(text) + '"'
          added = 0
          for directory, (path, source, known) in resources.items():
              additions = []
              for literal in sorted(used, key=lambda value: translations[value][0]):
                  name, spanish, english, args = translations[literal]
                  if name in known: continue
                  text = english if directory == 'values-en' else spanish
                  additions.append('    <string name="' + name + '">' + android_xml(text) + '</string>')
              if additions:
                  closing = source.rfind('</resources>')
                  assert closing >= 0
                  source = source[:closing] + '\n    <!-- Native management, activity and notes -->\n' + '\n'.join(additions) + '\n' + source[closing:]
                  path.write_text(source)
                  if directory == 'values': added = len(additions)
          for path, _, _ in resources.values():
              nodes = ET.parse(path).getroot().findall('string')
              names = [node.attrib['name'] for node in nodes]
              if len(names) != len(set(names)): raise SystemExit('Duplicate resource names: ' + str(path))
          for key in used:
              name = translations[key][0]
              for path, _, _ in resources.values():
                  assert name in {node.attrib['name'] for node in ET.parse(path).getroot().findall('string')}
          for path in sorted((java / 'ui/management').glob('*.kt')) + [java / 'ui/components/MeshFabricAppBar.kt']:
              for _, _, literal in tokens(path.read_text()):
                  if literal in translations: raise SystemExit('Unreplaced UI text in ' + str(path))
                  if re.search(r'[áéíóúñ¿¡]', literal):
                      raise SystemExit('Unreviewed accented UI text in ' + str(path) + ': ' + literal)
          print('Replaced', len(used), 'distinct reviewed texts in', len(changed), 'Kotlin files; added', added, 'resource keys per locale')
          PY
          git diff --check
      - name: Check Android resources and Kotlin compilation
        run: bash ./gradlew :app:processDebugResources :app:compileDebugKotlin --no-daemon
      - name: Publish localization and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/localize-native-management.yml
          git add app/src/main/java app/src/main/res
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'i18n: extract native UI messages and add English translations'
          git push origin HEAD:refs/heads/feat/native-management
