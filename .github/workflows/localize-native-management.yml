name: Localize native management (one shot)
on:
  push:
    branches: [feat/native-management]
    paths: [.github/workflows/localize-native-management.yml]
permissions:
  contents: write
jobs:
  localize:
    if: github.ref == 'refs/heads/feat/native-management'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract reviewed strings and add English translations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '42f2ce6e1b3bdd98fd14fc9f65a29adb19b17612'
          python3 - <<'PY'
          data = r'''actions_disconnected|Sin conexión de acciones|Actions disconnected
          actions_connecting|Conectando acciones…|Connecting actions…
          actions_connected|Acciones conectadas|Actions connected
          actions_paused|Acciones desconectadas; las sesiones remotas no se han cerrado|Actions disconnected; remote sessions have not been closed
          notes_server_rejected|El servidor ha rechazado el guardado: $error|The server rejected the save: %1$s
          notes_connection_draft|Sin conexión. El borrador local se conserva; el guardado no está confirmado.|Disconnected. The local draft is preserved; the save is not confirmed.
