name: Verify terminal key bar and history controls
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-keys.yml]
permissions:
  contents: write
concurrency:
  group: terminal-keys
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 5552a114510a90aa2ca558db0727080e3545909f HEAD
          git diff --exit-code 5552a114510a90aa2ca558db0727080e3545909f HEAD -- . ':(exclude).github/workflows/terminal-keys.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed key and history patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from xml.sax.saxutils import escape
          p = 'app/src/main/java/iecxiv/meshfabric/ui/terminal/'
          native = r'''    fun sendSpecialKey(id: String) {
                  checkMainThread()
                  if (isDestroyed || !ready || !isAttached || !resumed || failure.value != null || !session.connectionState.value) return
                  webView.evaluateJavascript("window.sendTerminalKey(${gson.toJson(id)});", null)
              }
              fun scrollToLatest() {
                  checkMainThread()
                  if (isDestroyed || !ready || !isAttached || !resumed || failure.value != null) return
                  webView.evaluateJavascript("window.scrollTerminalToLatest();") { result ->
                      if (result == "false" && !isDestroyed && isAttached && resumed) android.widget.Toast.makeText(
                          appContext, iecxiv.meshfabric.R.string.terminal_history_unavailable, android.widget.Toast.LENGTH_SHORT
                      ).show()
                  }
              }

          '''
          runtime_add = r'''  window.sendTerminalKey = function (name) {
              if (!term || !readySent || failed || disposed || !window.MeshTerminalKeys || typeof term.input !== 'function') return false;
              var data = window.MeshTerminalKeys.encode(name, !!(term.modes && term.modes.applicationCursorKeysMode));
              if (data === null) return false;
              term.input(data, true);
              return true;
            };
            window.scrollTerminalToLatest = function () {
              if (!term || !readySent || failed || disposed || term.buffer.active.type !== 'normal') return false;
              term.scrollToBottom();
              return true;
            };
          '''
          controls = r'''            if (controls) {
                          fun evaluate(script: String): String {
                              val latch = CountDownLatch(1)
                              var result = ""
                              scenario.onActivity { webView!!.evaluateJavascript(script) { result = it; latch.countDown() } }
                              assertTrue(latch.await(10, TimeUnit.SECONDS))
                              return result
                          }
                          fun write(token: String, data: String) {
                              assertEquals("true", evaluate("window.writeTerminalBatch(${gson.toJson(token)},${gson.toJson(data)});"))
                              assertEquals(token, bridge.acknowledgements.poll(10, TimeUnit.SECONDS))
                          }
                          fun key(name: String, expectedKey: String) {
                              assertEquals("true", evaluate("window.sendTerminalKey(${gson.toJson(name)});"))
                              assertEquals(expectedKey, bridge.inputs.poll(10, TimeUnit.SECONDS))
                              assertNull(bridge.inputs.poll(50, TimeUnit.MILLISECONDS))
                          }
                          val esc = 27.toChar().toString()
                          mapOf("enter" to 13, "backspace" to 8, "tab" to 9, "esc" to 27).forEach { (name, code) -> key(name, code.toChar().toString()) }
                          ('a'..'z').forEach { key("ctrl-" + it, (it.code - 96).toChar().toString()) }
                          mapOf("insert" to "2", "delete" to "3", "pageup" to "5", "pagedown" to "6").forEach { (name, number) -> key(name, esc + "[" + number + "~") }
                          val cursor = mapOf("up" to "A", "down" to "B", "right" to "C", "left" to "D", "home" to "H", "end" to "F")
                          cursor.forEach { (name, suffix) -> key(name, esc + "[" + suffix) }
                          write("cursor-on", esc + "[?1h")
                          cursor.forEach { (name, suffix) -> key(name, esc + "O" + suffix) }
                          write("cursor-off", esc + "[?1l")
                          assertEquals("false", evaluate("window.sendTerminalKey('__proto__');"))
                          assertNull(bridge.inputs.poll(100, TimeUnit.MILLISECONDS))
                          write("history-rows", (0..399).joinToString(13.toChar().toString() + 10.toChar()) { "row$it" })
                          assertEquals("true", evaluate("window.__echoTerm.scrollToTop(); window.__echoTerm.buffer.active.viewportY < window.__echoTerm.buffer.active.baseY;"))
                          assertEquals("true", evaluate("window.scrollTerminalToLatest(); window.__echoTerm.buffer.active.viewportY === window.__echoTerm.buffer.active.baseY;"))
                          assertNull("Local history must not send input", bridge.inputs.poll(100, TimeUnit.MILLISECONDS))
                          write("history-alt", esc + "[?1049h")
                          assertEquals("false", evaluate("window.scrollTerminalToLatest();"))
                          assertNull(bridge.inputs.poll(100, TimeUnit.MILLISECONDS))
                          write("history-normal", esc + "[?1049l")
                      }
          '''
          edits = {
              p + 'TerminalScreen.kt': [
                  ('    var keyboardRequest by remember(renderer) { mutableStateOf(0) }', '    var keyMenuOpen by remember(renderer) { mutableStateOf(false) }\n    var keyboardRequest by remember(renderer) { mutableStateOf(0) }'),
                  ('showCommandDialog || showRecoveryDialog', 'showCommandDialog || showRecoveryDialog || keyMenuOpen')
              ],
              p + 'TerminalRenderSession.kt': [('    fun toggleKeyboard() {', native + '    fun toggleKeyboard() {')],
              'app/src/main/assets/terminal/terminal-runtime.js': [('  window.clearTerminal = function ()', runtime_add + '  window.clearTerminal = function ()')],
              'app/src/main/assets/terminal/terminal.html': [('  <script defer src="terminal-runtime.js"></script>', '  <script defer src="terminal-keys.js"></script>\n  <script defer src="terminal-runtime.js"></script>')],
              'app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt': [
                  ('    @Test fun pasteSingleLineAddsNoEnter()', '    @Test fun specialKeysAndLocalHistory() { verify("ready", true, controls = true) }\n\n    @Test fun pasteSingleLineAddsNoEnter()'),
                  ('pasteAccepted: Boolean = true) {', 'pasteAccepted: Boolean = true, controls: Boolean = false) {'),
                  ('            if (paste != null) {', controls + '            if (paste != null) {'),
                  ('<script src="terminal-selection.js"></script>', '<script src="terminal-selection.js"></script><script src="terminal-keys.js"></script>')
              ]
          }
          newfiles = {}
          newfiles['app/src/main/assets/terminal/terminal-keys.js'] = r'''(function (root, factory) {
            if (typeof module === 'object' && module.exports) module.exports = factory();
            else root.MeshTerminalKeys = factory();
          }(typeof globalThis !== 'undefined' ? globalThis : this, function () {
            'use strict';
            var ESC = String.fromCharCode(27);
            var simple = { enter: 13, backspace: 8, tab: 9, esc: 27 };
            var cursor = { up: 'A', down: 'B', right: 'C', left: 'D', home: 'H', end: 'F' };
            var tilde = { insert: '2', delete: '3', pageup: '5', pagedown: '6' };
            function owns(object, key) { return Object.prototype.hasOwnProperty.call(object, key); }
            function encode(name, application) {
              if (typeof name !== 'string') return null;
              if (owns(simple, name)) return String.fromCharCode(simple[name]);
              if (owns(cursor, name)) return ESC + (application === true ? 'O' : '[') + cursor[name];
              if (owns(tilde, name)) return ESC + '[' + tilde[name] + '~';
              if (name.length === 6 && name.slice(0, 5) === 'ctrl-') {
                var code = name.charCodeAt(5);
                if (code >= 97 && code <= 122) return String.fromCharCode(code - 96);
              }
              return null;
            }
            return { encode: encode };
          }));
          '''
          newfiles['app/src/test/js/terminal-keys.test.js'] = r''''use strict';
          const assert = require('node:assert/strict');
          const {encode} = require('../../main/assets/terminal/terminal-keys.js');
          const ESC = String.fromCharCode(27);
          let checks = 0;
          function equal(a,b) { assert.equal(a,b); checks++; }
          for (const [key,code] of Object.entries({enter:13,backspace:8,tab:9,esc:27})) equal(encode(key),String.fromCharCode(code));
          for (const [key,suffix] of Object.entries({up:'A',down:'B',right:'C',left:'D',home:'H',end:'F'})) {
            equal(encode(key,false),ESC+'['+suffix);
            equal(encode(key,true),ESC+'O'+suffix);
          }
          for (const [key,n] of Object.entries({insert:'2',delete:'3',pageup:'5',pagedown:'6'})) equal(encode(key,true),ESC+'['+n+'~');
          for (let code=97;code<=122;code++) equal(encode('ctrl-'+String.fromCharCode(code)),String.fromCharCode(code-96));
          for (const bad of [null,undefined,{},'', '__proto__','constructor','ctrl-aa','ctrl-A','ctrl-1','up;alert(1)']) equal(encode(bad),null);
          console.log(checks+' special-key encoding checks passed');
          '''
          newfiles[p + 'TerminalKeyBar.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.semantics.contentDescription
          import androidx.compose.ui.semantics.semantics
          import androidx.compose.ui.unit.dp
          import iecxiv.meshfabric.R

          private data class TerminalBarKey(val id: String, val label: Int, val description: Int = label)
          private val primaryKeys = listOf(
              TerminalBarKey("esc", R.string.terminal_key_esc), TerminalBarKey("tab", R.string.terminal_key_tab),
              TerminalBarKey("ctrl-c", R.string.terminal_key_ctrl_c),
              TerminalBarKey("enter", R.string.terminal_key_enter_glyph, R.string.terminal_key_enter),
              TerminalBarKey("backspace", R.string.terminal_key_backspace_glyph, R.string.terminal_key_backspace)
          )
          private val navigationKeys = listOf(
              TerminalBarKey("left", R.string.terminal_key_left_glyph, R.string.terminal_key_left),
              TerminalBarKey("down", R.string.terminal_key_down_glyph, R.string.terminal_key_down),
              TerminalBarKey("up", R.string.terminal_key_up_glyph, R.string.terminal_key_up),
              TerminalBarKey("right", R.string.terminal_key_right_glyph, R.string.terminal_key_right),
              TerminalBarKey("home", R.string.terminal_key_home), TerminalBarKey("end", R.string.terminal_key_end),
              TerminalBarKey("insert", R.string.terminal_key_insert), TerminalBarKey("delete", R.string.terminal_key_delete),
              TerminalBarKey("pageup", R.string.terminal_key_pageup), TerminalBarKey("pagedown", R.string.terminal_key_pagedown)
          )

          @Composable
          private fun BarButton(label: String, description: String, enabled: Boolean, onClick: () -> Unit) {
              OutlinedButton(onClick = onClick, enabled = enabled,
                  modifier = Modifier.heightIn(min = 48.dp).widthIn(min = 48.dp).semantics { contentDescription = description },
                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp)
              ) { Text(label, maxLines = 1) }
          }
          @Composable
          private fun KeyButton(key: TerminalBarKey, enabled: Boolean, onKey: (String) -> Unit) {
              BarButton(stringResource(key.label), stringResource(key.description), enabled) { onKey(key.id) }
          }

          @Composable
          internal fun TerminalKeyBar(
              enabled: Boolean, historyEnabled: Boolean, onKey: (String) -> Unit,
              onLatest: () -> Unit, onPopup: (Boolean) -> Unit
          ) {
              var expanded by remember { mutableStateOf(false) }
              var ctrlMenu by remember { mutableStateOf(false) }
              LaunchedEffect(ctrlMenu) { onPopup(ctrlMenu) }
              LaunchedEffect(enabled) { if (!enabled) ctrlMenu = false }
              DisposableEffect(Unit) { onDispose { onPopup(false) } }
              Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                      Row(Modifier.weight(1f).horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          primaryKeys.forEach { KeyButton(it, enabled, onKey) }
                      }
                      BarButton(
                          stringResource(if (expanded) R.string.terminal_keys_less_glyph else R.string.terminal_keys_more_glyph),
                          stringResource(if (expanded) R.string.terminal_keys_less else R.string.terminal_keys_more), true
                      ) { expanded = !expanded; ctrlMenu = false }
                  }
                  if (expanded) {
                      Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          navigationKeys.forEach { KeyButton(it, enabled, onKey) }
                      }
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          Box {
                              BarButton(stringResource(R.string.terminal_ctrl_more_label), stringResource(R.string.terminal_ctrl_more), enabled) { ctrlMenu = true }
                              DropdownMenu(expanded = ctrlMenu, onDismissRequest = { ctrlMenu = false }, modifier = Modifier.heightIn(max = 280.dp)) {
                                  ('A'..'Z').forEach { letter ->
                                      DropdownMenuItem(text = { Text(stringResource(R.string.terminal_ctrl_shortcut, letter.toString())) },
                                          onClick = { ctrlMenu = false; onPopup(false); onKey("ctrl-" + letter.lowercaseChar()) })
                                  }
                              }
                          }
                          Row(Modifier.weight(1f).horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                              listOf('Z', 'X', 'O', 'W').forEach { letter ->
                                  val label = stringResource(R.string.terminal_ctrl_shortcut, letter.toString())
                                  BarButton(label, label, enabled) { onKey("ctrl-" + letter.lowercaseChar()) }
                              }
                          }
                          BarButton(stringResource(R.string.terminal_latest_glyph), stringResource(R.string.terminal_latest), historyEnabled, onLatest)
                      }
                  }
              }
          }
          '''
          newfiles['app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBarTest.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.compose.ui.unit.dp
          import androidx.test.platform.app.InstrumentationRegistry
          import iecxiv.meshfabric.R
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test

          class TerminalKeyBarTest {
              @get:Rule val compose = createComposeRule()
              private val context get() = InstrumentationRegistry.getInstrumentation().targetContext
              @Test fun compactBarExpandsAndSendsOnce() {
                  val sent = mutableListOf<String>()
                  var latest = 0
                  compose.setContent { MaterialTheme { TerminalKeyBar(true, true, { sent.add(it) }, { latest++ }, {}) } }
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_key_enter))
                      .assertHeightIsAtLeast(48.dp).assertWidthIsAtLeast(48.dp).performClick()
                  compose.runOnIdle { assertEquals(listOf("enter"), sent) }
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_key_left)).assertDoesNotExist()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_keys_more)).performClick()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_key_left)).assertExists()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_ctrl_more)).performClick()
                  compose.onNodeWithText(context.getString(R.string.terminal_ctrl_shortcut, "A")).performClick()
                  compose.runOnIdle { assertEquals(listOf("enter", "ctrl-a"), sent) }
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_latest)).performClick()
                  compose.runOnIdle { assertEquals(1, latest); assertEquals(2, sent.size) }
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_keys_less)).performClick()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_key_left)).assertDoesNotExist()
              }
              @Test fun disconnectedKeysDisabledButHistoryAvailable() {
                  compose.setContent { MaterialTheme { TerminalKeyBar(false, true, {}, {}, {}) } }
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_key_enter)).assertIsNotEnabled()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_keys_more)).performClick()
                  compose.onNodeWithContentDescription(context.getString(R.string.terminal_latest)).assertIsEnabled()
              }
          }
          '''
          newfiles['docs/terminal-special-keys.md'] = r'''# Special keys and history comfort

          Default row: Esc, Tab, Ctrl+C, Enter, Backspace. Expand navigation/editing keys, Ctrl picker A..Z, Ctrl+Z/X/O/W and fixed latest-output control. Buttons reserve at least 48dp per dimension; rows scroll horizontally. Ctrl picker sends one chosen shortcut, not a sticky IME modifier. Offline input is disabled, but healthy retained history remains available.

          Use bundled xterm public input API and existing onData/native bridge. Arrow/Home/End honor applicationCursorKeysMode. Preserve Backspace byte 8 and Enter CR. No hold-repeat or retries. PgUp/PgDn/Home/End are remote keys. Latest output is local scrollToBottom in the normal buffer only, with zero input; alternate buffer gets localized feedback. Popup focus uses the established overlay gate; deliberate shortcut dispatch is allowed while it closes. No scroll CSS, physics, sensitivity, output-follow policy, focus-machine, IME flags, command-editor or version changes (1.1.1/code 1).

          CI: encoding checks, Compose size/expand/disabled/single-dispatch tests, real bundled-xterm normal/application sequences and input-free history tests; existing focus, echo, copy, paste, touch regressions. Device checks remain for font scaling, landscape/IME space, remote editors and perceived layout. Dispatch is not a remote execution receipt.
          '''
          strings = {
              'terminal_key_esc': ('Esc', 'Esc'), 'terminal_key_tab': ('Tab', 'Tab'), 'terminal_key_ctrl_c': ('Ctrl+C', 'Ctrl+C'),
              'terminal_key_enter_glyph': ('↵', '↵'), 'terminal_key_enter': ('Enter', 'Intro'),
              'terminal_key_backspace_glyph': ('⌫', '⌫'), 'terminal_key_backspace': ('Backspace', 'Retroceso'),
              'terminal_key_left_glyph': ('←', '←'), 'terminal_key_left': ('Left arrow', 'Flecha izquierda'),
              'terminal_key_down_glyph': ('↓', '↓'), 'terminal_key_down': ('Down arrow', 'Flecha abajo'),
              'terminal_key_up_glyph': ('↑', '↑'), 'terminal_key_up': ('Up arrow', 'Flecha arriba'),
              'terminal_key_right_glyph': ('→', '→'), 'terminal_key_right': ('Right arrow', 'Flecha derecha'),
              'terminal_key_home': ('Home', 'Inicio'), 'terminal_key_end': ('End', 'Fin'),
              'terminal_key_insert': ('Ins', 'Ins'), 'terminal_key_delete': ('Del', 'Supr'),
              'terminal_key_pageup': ('PgUp', 'RePág'), 'terminal_key_pagedown': ('PgDn', 'AvPág'),
              'terminal_keys_more_glyph': ('⋯', '⋯'), 'terminal_keys_less_glyph': ('−', '−'),
              'terminal_keys_more': ('More keys', 'Más teclas'), 'terminal_keys_less': ('Fewer keys', 'Menos teclas'),
              'terminal_ctrl_more_label': ('Ctrl…', 'Ctrl…'), 'terminal_ctrl_more': ('Choose a Ctrl shortcut', 'Elegir un atajo Ctrl'),
              'terminal_ctrl_shortcut': ('Ctrl+%1$s', 'Ctrl+%1$s'),
              'terminal_latest_glyph': ('⇣', '⇣'), 'terminal_latest': ('Latest output, without sending keys', 'Última salida, sin enviar teclas'),
              'terminal_history_unavailable': ('History is unavailable in this remote application screen.', 'El historial no está disponible en esta pantalla de la aplicación remota.')
          }
          for directory, index in [('values', 0), ('values-en', 0), ('values-es', 1)]:
              newfiles['app/src/main/res/' + directory + '/terminal_keys.xml'] = '<?xml version="1.0" encoding="utf-8"?>' + chr(10) + '<resources>' + chr(10) + ''.join('    <string name="' + key + '">' + escape(values[index]) + '</string>' + chr(10) for key, values in strings.items()) + '</resources>' + chr(10)
          bar_start = '            Surface(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .imePadding(),\n'
          bar_end = '\n        }\n\n        if (showRecoveryDialog)'
          bar_replacement = r'''            Surface(
                          modifier = Modifier.fillMaxWidth().imePadding(),
                          color = MaterialTheme.colorScheme.surface,
                          shadowElevation = 4.dp
                      ) {
                          key(renderer) {
                              TerminalKeyBar(
                                  enabled = rendererError == null && connectionStatus == TerminalConnectionStatus.CONNECTED,
                                  historyEnabled = rendererError == null,
                                  onKey = { renderer.sendSpecialKey(it) },
                                  onLatest = { renderer.scrollToLatest() },
                                  onPopup = { keyMenuOpen = it }
                              )
                          }
                      }
          '''
          prepared = {}
          for name, replacements in edits.items():
              text = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  text = text.replace(old, new, 1)
              if name.endswith('/TerminalScreen.kt'):
                  if text.count(bar_start) != 1:
                      raise RuntimeError('Legacy key surface mismatch')
                  begin = text.index(bar_start)
                  finish = text.index(bar_end, begin)
                  legacy = text[begin:finish]
                  if legacy.count('Surface(') != 1 or 'viewModel.sendControlKey' not in legacy or 'Enter' not in legacy:
                      raise RuntimeError('Unexpected legacy key section')
                  text = text[:begin] + bar_replacement + text[finish:]
              prepared[name] = text
          for name, text in newfiles.items():
              if Path(name).exists():
                  raise RuntimeError('New target already exists: ' + name)
              prepared[name] = text
          for text in prepared.values():
              text.encode('utf-8')
          for name, text in prepared.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          for name in prepared:
              if name.endswith('.js'):
                  subprocess.run(['node', '--check', name], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Key encoding and existing JavaScript tests
        run: |
          node app/src/test/js/terminal-keys.test.js
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose and real WebView regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalFocusWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalKeyBarTest --no-daemon --stacktrace
      - name: Publish verified key comfort
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-keys.yml
          git add -- app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalRenderSession.kt app/src/main/assets/terminal/terminal-runtime.js app/src/main/assets/terminal/terminal.html app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt app/src/main/assets/terminal/terminal-keys.js app/src/test/js/terminal-keys.test.js app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBar.kt app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBarTest.kt app/src/main/res/values/terminal_keys.xml app/src/main/res/values-en/terminal_keys.xml app/src/main/res/values-es/terminal_keys.xml docs/terminal-special-keys.md .github/workflows/terminal-keys.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: improve terminal special keys and history navigation'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-keys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
