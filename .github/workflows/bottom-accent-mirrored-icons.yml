name: Validate persistent bottom accent and mirrored icons
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/bottom-accent-mirrored-icons.yml']
permissions:
  contents: write
concurrency:
  group: bottom-accent-mirrored-icons-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check all embedded Python syntax
        shell: python
        run: |
          import ast,textwrap
          from pathlib import Path
          lines=Path('.github/workflows/bottom-accent-mirrored-icons.yml').read_text().splitlines();checked=0
          for i,line in enumerate(lines):
              if line!='        run: |': continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '): break
                  body.append(following)
              ast.parse(textwrap.dedent('\n'.join(body))+'\n');checked+=1
          assert checked==4,checked
      - name: Prepare only bottom presentation and four icon corrections
        shell: python
        run: |
          import re,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='f7db1d0555a7086182e42ca0d93bd9270eff7df3','Base advanced; review required'
          menu=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt')
          text=menu.read_text()
          text,count=re.subn(r'\bIcons\.Default\.(Label|LiveHelp|LabelOff)\b',lambda m:'Icons.AutoMirrored.Filled.'+m.group(1),text)
          assert count==4,('Expected exactly four icon corrections',count)
          anchor='import androidx.compose.material.icons.automirrored.filled.Sort'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\nimport androidx.compose.material.icons.automirrored.filled.Label\nimport androidx.compose.material.icons.automirrored.filled.LiveHelp\nimport androidx.compose.material.icons.automirrored.filled.LabelOff',1)
          menu.write_text(text)
          loading=Path('app/src/main/java/iecxiv/meshfabric/ui/components/BottomViewLoading.kt')
          text=loading.read_text()
          def replace_once(old,new):
              global text
              assert text.count(old)==1,(old,text.count(old))
              text=text.replace(old,new,1)
          replace_once('import androidx.compose.foundation.layout.*','import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.background\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.ui.graphics.Color')
          anchor='@Composable internal fun BottomViewLoadingBar() {\n    val owner=LocalBottomLoadingState.current'
          replace_once(anchor,anchor+'\n    val barColor=MaterialTheme.colorScheme.primary')
          replace_once('Box(Modifier.fillMaxWidth().height(4.dp).testTag("bottom_loading_slot")) {','Box(Modifier.fillMaxWidth().height(4.dp).background(barColor.copy(alpha=0.40f)).testTag("bottom_loading_slot")) {')
          replace_once('if(owner?.loading==true) LinearProgressIndicator(Modifier.fillMaxSize().testTag("bottom_loading_indicator"))','if(owner?.loading==true) LinearProgressIndicator(Modifier.fillMaxSize().testTag("bottom_loading_indicator"),color=barColor,trackColor=Color.Transparent)')
          loading.write_text(text)
          expected={str(menu),str(loading)}
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==expected,(actual,expected)
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests execute unit tests and lint
        shell: bash
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/bottom-accent-build.log"
      - name: Verify obsolete icon references and related warnings are gone
        shell: python
        run: |
          import os,re
          from pathlib import Path
          text=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt').read_text()
          assert not re.search(r'\bIcons\.Default\.(Label|LiveHelp|LabelOff)\b',text)
          log=Path(os.environ['RUNNER_TEMP'],'bottom-accent-build.log').read_text()
          warnings=[line for line in log.splitlines() if 'DeviceListHeaderMenus.kt:' in line and 'deprecated' in line]
          assert not warnings,'\n'.join(warnings)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bottom-accent-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/bottom-accent-build.log
          if-no-files-found: ignore
      - name: Apply validated changes only to dev and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt','app/src/main/java/iecxiv/meshfabric/ui/components/BottomViewLoading.kt']
          workflow='.github/workflows/bottom-accent-mirrored-icons.yml'
          Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui: keep bottom accent visible and use mirrored menu icons'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
