name: Persistent filter and centered logout
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/persist-filter-center-logout.yml']
permissions:
  contents: write
concurrency:
  group: persist-filter-center-logout
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded preference and layout changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric')
          expected = {'data/local/SessionManager.kt': 'f45f49358348ce9b370bc965675ab5bd96b21405', 'ui/settings/SettingsScreen.kt': 'f48c22c6ab3ec89b20e03cd194c00e9b28fb004d', 'ui/devices/DeviceListScreen.kt': '8608ccd6c0178dc1e72c6a9a5b4b79dc82ed5a81'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(root/path)],text=True).strip() == sha, 'Source changed: ' + path
          def once(s, old, new):
              assert s.count(old) == 1, old
              return s.replace(old,new,1)
          p = root/'ui/settings/SettingsScreen.kt'
          s = p.read_text()
          s = once(s, 'modifier = Modifier.fillMaxWidth().clickable { showLogout = true },', 'modifier = Modifier.align(Alignment.CenterHorizontally).clickable { showLogout = true },')
          s = once(s, 'Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {', 'Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {')
          p.write_text(s)
          p = root/'data/local/SessionManager.kt'
          s = p.read_text()
          addition = '\n'.join([
              '    private val _onlyOnlineDevicesFlow = MutableStateFlow(prefs.getBoolean("only_online_devices", false))',
              '    val onlyOnlineDevicesFlow: StateFlow<Boolean> = _onlyOnlineDevicesFlow.asStateFlow()',
              '',
              '    fun saveOnlyOnlineDevices(enabled: Boolean) {',
              '        prefs.edit().putBoolean("only_online_devices", enabled).apply()',
              '        _onlyOnlineDevicesFlow.value = enabled',
              '    }', '', ''])
          s = once(s, '    private fun getSavedThemeMode(): AppThemeMode {', addition + '    private fun getSavedThemeMode(): AppThemeMode {')
          s = once(s, '        val keepTerminalBuffers = isSaveTerminalBuffersEnabled()', '        val keepTerminalBuffers = isSaveTerminalBuffersEnabled()\n        val keepOnlineFilter = _onlyOnlineDevicesFlow.value')
          s = once(s, 'prefs.edit().putBoolean(KEY_SAVE_TERMINAL_BUFFERS, keepTerminalBuffers).apply()', 'prefs.edit().putBoolean(KEY_SAVE_TERMINAL_BUFFERS, keepTerminalBuffers)\n            .putBoolean("only_online_devices", keepOnlineFilter).apply()')
          p.write_text(s)
          p = root/'ui/devices/DeviceListScreen.kt'
          s = p.read_text()
          new = '\n'.join([
              '    val fallbackOnlineFilter = remember { MutableStateFlow(false) }',
              '    val onlyOnline by (viewModel.sessionManager?.onlyOnlineDevicesFlow ?: fallbackOnlineFilter).collectAsState()'])
          s = once(s, '    var onlyOnline by androidx.compose.runtime.saveable.rememberSaveable { mutableStateOf(false) }', new)
          s = once(s, 'onCheckedChange={ onlyOnline=it }', 'onCheckedChange={ enabled ->\n                val manager = viewModel.sessionManager\n                if (manager != null) manager.saveOnlyOnlineDevices(enabled) else fallbackOnlineFilter.value = enabled\n            }')
          p.write_text(s)
          PY
          git diff --check
      - name: Compile and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified changes
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/local/SessionManager.kt app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt
          git rm .github/workflows/persist-filter-center-logout.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: center compact logout card and persist online devices filter'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-filter-centered-logout-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
