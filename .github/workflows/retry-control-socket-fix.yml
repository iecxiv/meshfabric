name: Retry control socket fix after whitespace normalization

on:
  push:
    branches: [reconnection-tests]
    paths: [.github/workflows/retry-control-socket-fix.yml]
permissions:
  contents: write
jobs:
  retry:
    if: github.ref == 'refs/heads/reconnection-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply original verified script with whitespace correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import textwrap
          workflow=Path('.github/workflows/apply-control-socket-fix.yml')
          data=workflow.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if sha!='816d2c47dc7a4b8695a36f55a74c100b47781967':
              raise SystemExit('Original workflow changed; refusing to execute: '+sha)
          source=data.decode('utf-8')
          marker="          python3 - <<'PY'\n"
          if source.count(marker)!=1:
              raise SystemExit('Unexpected original script layout')
          start=source.index(marker)+len(marker)
          end=source.index('\n          PY\n',start)
          script=textwrap.dedent(source[start:end])
          if script.count('path.write_text(s)')!=1:
              raise SystemExit('Unexpected source write count')
          script=script.replace('path.write_text(s)',"s = '\\n'.join(line.rstrip() for line in s.splitlines()) + '\\n'\npath.write_text(s)",1)
          exec(compile(script,'apply_control_socket_fix','exec'),{'__name__':'__main__'})
          PY
          git diff -- app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/ControlRetry.kt app/src/test/java/iecxiv/meshfabric/data/remote/ControlRetryTest.kt > control-socket-fix.diff
          git diff --check
      - name: Verify patched debug build and unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-control-socket-fix.yml .github/workflows/retry-control-socket-fix.yml
          git add app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/ControlRetry.kt app/src/test/java/iecxiv/meshfabric/data/remote/ControlRetryTest.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fence control callbacks and serialize reconnect attempts'
          git push origin HEAD:refs/heads/reconnection-tests
      - name: Upload patch, debug APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: control-fix-retry-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control-socket-fix.diff
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
