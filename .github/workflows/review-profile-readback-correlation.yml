name: Extract pinned users and meshes readback correlation reference
on:
  push:
    branches: [dev]
    paths: [.github/workflows/review-profile-readback-correlation.yml]
permissions:
  contents: write
concurrency:
  group: review-profile-readback-correlation-dev
  cancel-in-progress: false
jobs:
  extract-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download pinned source as data only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 'https://raw.githubusercontent.com/Ylianst/MeshCentral/f436143527458d56da0336ea3047c006703fb4e4/meshuser.js' -o "$RUNNER_TEMP/profile-readback-meshuser.js"
      - name: Verify hash and extract every matching context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,shutil
          data=(Path(os.environ['RUNNER_TEMP'])/'profile-readback-meshuser.js').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          expected='ed6473b39a26bdd4686e71c9d34576dcbdcde54a1b28e0c8ffe8f77429a4e671'
          if digest!=expected:raise RuntimeError('Pinned source hash mismatch')
          root=Path('docs/reference/meshcentral-1.3.1-readback')
          if root.exists():raise RuntimeError('Reference destination already exists')
          lines=data.decode('utf-8-sig').splitlines()
          contexts={}
          for action in ('users','meshes'):
              literal=re.compile(r'''['"]'''+action+r'''['"]''')
              hits=[i for i,line in enumerate(lines) if literal.search(line)]
              mode='quoted-literal'
              if not hits:
                  word=re.compile(r'\b'+re.escape(action)+r'\b')
                  hits=[i for i,line in enumerate(lines) if word.search(line)]
                  mode='word-fallback'
              if not hits:raise RuntimeError('No source occurrences: '+action)
              ranges=[]
              for hit in hits:
                  start=max(0,hit-60);end=min(len(lines),hit+61)
                  if ranges and start<=ranges[-1][1]:ranges[-1][1]=max(ranges[-1][1],end)
                  else:ranges.append([start,end])
              contexts[action]=(hits,mode,ranges)
          root.mkdir(parents=True)
          manifest={'repository':'Ylianst/MeshCentral','version':'1.3.1','commit':'f436143527458d56da0336ea3047c006703fb4e4','source':'meshuser.js','source_sha256':digest,'contexts':{},'scope':'Static context extraction, not a parser. Windows may not contain complete handlers. Source is never executed. Manual inspection is required; occurrences of tag/responseid do not establish correlation support.'}
          summary={}
          for action,(hits,mode,ranges) in contexts.items():
              parts=[]
              for window,(start,end) in enumerate(ranges,1):
                  for part,offset in enumerate(range(start,end,50),1):
                      last=min(offset+50,end)
                      filename=f'{action}-context-{window:02d}-{part:02d}.txt'
                      text=f'MeshCentral 1.3.1 | Apache-2.0 | Ylian Saint-Hilaire and contributors\nSource: meshuser.js @ {manifest["commit"]}\nSource SHA-256: {digest}\nContext: {action} | lines {offset+1}-{last} | window {window} part {part} | not necessarily a complete handler\n\n'
                      text+='\n'.join(f'{i+1}: {lines[i]}' for i in range(offset,last))+'\n'
                      (root/filename).write_text(text)
                      parts.append({'file':filename,'first_line':offset+1,'last_line':last,'sha256':hashlib.sha256(text.encode()).hexdigest()})
              manifest['contexts'][action]={'match_mode':mode,'hits':[{'line':i+1,'text':lines[i]} for i in hits],'windows':[{'first_line':a+1,'last_line':b} for a,b in ranges],'parts':parts,'correlation_mentions':[{'line':i+1,'text':lines[i]} for a,b in ranges for i in range(a,b) if re.search(r'\b(?:tag|responseid)\b',lines[i])]}
              summary[action]={'matches':len(hits),'mode':mode,'windows':len(ranges),'parts':len(parts)}
          (root/'index.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'README.md').write_text('# MeshCentral 1.3.1 readback correlation contexts\n\nRead index.json and every ordered context part. Context windows are not guaranteed to contain complete handlers. No unique case-label assumption is made. Manual source review is required before changing correlation logic. No upstream code execution, Android changes, account changes or server operations. Apache-2.0; see LICENSE.\n')
          shutil.copyfile('docs/reference/meshcentral-1.3.1-device-groups/LICENSE',root/'LICENSE')
          print(json.dumps({'source_sha256':digest,'extracted':summary},indent=2))
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-readback-reference-${{ github.run_id }}
          path: docs/reference/meshcentral-1.3.1-readback/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish static reference only if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- docs/reference/meshcentral-1.3.1-readback/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): extract pinned users and meshes correlation contexts'
          git push origin HEAD:dev
