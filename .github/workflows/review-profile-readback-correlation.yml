name: Extract pinned users and meshes readback correlation reference
on:
  push:
    branches: [dev]
    paths: [.github/workflows/review-profile-readback-correlation.yml]
permissions:
  contents: write
concurrency:
  group: review-profile-readback-correlation-dev
  cancel-in-progress: false
jobs:
  extract-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download pinned source as data only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 'https://raw.githubusercontent.com/Ylianst/MeshCentral/f436143527458d56da0336ea3047c006703fb4e4/meshuser.js' -o "$RUNNER_TEMP/profile-readback-meshuser.js"
      - name: Verify hash and extract complete same-level case blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,shutil
          source=Path(os.environ['RUNNER_TEMP'])/'profile-readback-meshuser.js'
          data=source.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          expected='ed6473b39a26bdd4686e71c9d34576dcbdcde54a1b28e0c8ffe8f77429a4e671'
          if digest!=expected:raise RuntimeError('Pinned source hash mismatch')
          root=Path('docs/reference/meshcentral-1.3.1-readback')
          if root.exists():raise RuntimeError('Reference destination already exists')
          lines=data.decode('utf-8-sig').splitlines()
          blocks={}
          for action in ('users','meshes'):
              pattern=re.compile(r'''^([ \t]*)case\s+['"]'''+action+r'''['"]\s*:''')
              matches=[(i,pattern.match(line)) for i,line in enumerate(lines) if pattern.match(line)]
              if len(matches)!=1:raise RuntimeError('Missing/nonunique case: '+action)
              start,match=matches[0]
              boundary=re.compile('^'+re.escape(match.group(1))+r'(?:case\s|default\s*:)')
              end=next((i for i in range(start+1,len(lines)) if boundary.match(lines[i])),None)
              if end is None or end-start>2000:raise RuntimeError('Cannot bound complete case: '+action)
              blocks[action]=(start,end)
          root.mkdir(parents=True)
          manifest={'repository':'Ylianst/MeshCentral','version':'1.3.1','commit':'f436143527458d56da0336ea3047c006703fb4e4','source':'meshuser.js','source_sha256':digest,'handlers':{},'scope':'Static source extraction only. Source code is never executed. Manual review required; matching tag/responseid words alone does not prove correlation support.'}
          for action,(start,end) in blocks.items():
              parts=[]
              for number,offset in enumerate(range(start,end,50),1):
                  last=min(offset+50,end)
                  filename=f'{action}-{number:02d}.txt'
                  text=f'MeshCentral 1.3.1 | Apache-2.0 | Ylian Saint-Hilaire and contributors\nSource: meshuser.js @ {manifest["commit"]}\nSource SHA-256: {digest}\nHandler: {action} | lines {offset+1}-{last} | part {number}\n\n'
                  text+='\n'.join(f'{i+1}: {lines[i]}' for i in range(offset,last))+'\n'
                  (root/filename).write_text(text)
                  parts.append({'file':filename,'first_line':offset+1,'last_line':last,'sha256':hashlib.sha256(text.encode()).hexdigest()})
              manifest['handlers'][action]={'first_line':start+1,'last_line':end,'parts':parts,'correlation_mentions':[{'line':i+1,'text':lines[i]} for i in range(start,end) if re.search(r'\b(?:tag|responseid)\b',lines[i])]}
          (root/'index.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'README.md').write_text('# MeshCentral 1.3.1 readback correlation reference\n\nRead index.json and every ordered part for users and meshes. Extraction does not establish support for request correlation and does not validate revocation. No upstream code execution, Android changes, account changes or server operations. Apache-2.0; see LICENSE.\n')
          shutil.copyfile('docs/reference/meshcentral-1.3.1-device-groups/LICENSE',root/'LICENSE')
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-readback-reference-${{ github.run_id }}
          path: docs/reference/meshcentral-1.3.1-readback/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish static reference only if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- docs/reference/meshcentral-1.3.1-readback/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): extract pinned users and meshes correlation handlers'
          git push origin HEAD:dev
