name: Validate desktop pan after pinch
on:
  push:
    branches: [dev]
    paths: [.github/workflows/fix-desktop-pinch-pan.yml]
permissions:
  contents: write
concurrency:
  group: desktop-pinch-pan-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          screen=Path('app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt')
          s=screen.read_text()
          pat=re.compile(r'\} else event\.changes\.forEach \{ it\.consume\(\) \}')
          if len(pat.findall(s))!=1: raise SystemExit('Anchor changed: post-pinch branch')
          new='''} else {
                                                    val remaining = event.changes.firstOrNull { it.pressed }
                                                    if (remaining != null) {
                                                        val remainingPan = remaining.positionChange()
                                                        val remainingMaxX = (drawWidth * (scale - 1f) / 2f).coerceAtLeast(0f)
                                                        val remainingMaxY = (drawHeight * (scale - 1f) / 2f).coerceAtLeast(0f)
                                                        offsetX = (offsetX + remainingPan.x).coerceIn(-remainingMaxX, remainingMaxX)
                                                        offsetY = (offsetY + remainingPan.y).coerceIn(-remainingMaxY, remainingMaxY)
                                                    }
                                                    event.changes.forEach { it.consume() }
                                                }'''
          screen.write_text(pat.sub(lambda m: new, s, count=1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt"
      - name: Build, compile instrumentation, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute permanent emulator regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 .github/scripts/run-emulator-regressions.py
      - name: Show failing instrumentation tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files=glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          print('result files:', files)
          for f in files:
              try:
                  root=ET.parse(f).getroot()
              except Exception as e:
                  print('unreadable', f, e)
                  continue
              for tc in root.iter('testcase'):
                  for kind in ('failure','error'):
                      for n in tc.findall(kind):
                          print('FAILED', tc.get('classname'), tc.get('name'))
                          print((n.get('message') or '')[:800])
                          print((n.text or '')[:2000])
          PY
      - name: Publish validated candidate only on unchanged dev
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git diff --name-only)" = "app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt"
          test -z "$(git ls-files --others --exclude-standard)"
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(desktop): keep panning with one finger after pinch zoom"
          git push origin HEAD:refs/heads/dev
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pinch-pan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ${{ runner.temp }}/resume-regressions/
          if-no-files-found: warn
          retention-days: 14
