name: Validate user group member addition policy without enabling writes
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-user-group-member-add-policy.yml]
permissions:
  contents: write
concurrency:
  group: publish-user-group-member-add-policy-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply policy and tests only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          subprocess.run(['git','merge-base','--is-ancestor','202427d098f601219a9f360c525322930d1582e0','HEAD'],check=True)
          hashes={'.github/patches/user-group-member-add-policy/UserGroupMemberAddPolicy.kt.txt': 'ac21cee48999255cc8d371a4426d291796d04420cb3a1ee419bd328cb2ee2275', '.github/patches/user-group-member-add-policy/UserGroupMemberAddPolicyTest.kt.txt': '9fb73022816ec3a858f46755c002a6f5211ef31bee9d132384a4421eff8dc484', '.github/patches/user-group-member-add-policy/UserGroupMemberAddRequestTest.kt.txt': 'dcf88436316bed51a0512dd517dce24ebdb9cad37ab316538bca04235526c3c2'}
          targets={'.github/patches/user-group-member-add-policy/UserGroupMemberAddPolicy.kt.txt': 'app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddPolicy.kt', '.github/patches/user-group-member-add-policy/UserGroupMemberAddPolicyTest.kt.txt': 'app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddPolicyTest.kt', '.github/patches/user-group-member-add-policy/UserGroupMemberAddRequestTest.kt.txt': 'app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddRequestTest.kt'}
          updates={}
          for name,dest in targets.items():
              data=Path(name).read_bytes();path=Path(dest)
              if hashlib.sha256(data).hexdigest()!=hashes[name]:raise RuntimeError('Template changed: '+name)
              if path.exists():raise RuntimeError('New file already exists: '+dest)
              updates[path]=data.decode()
          for path,text in updates.items():
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          PY
          git diff --check
      - name: Build, compile Android tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-add-policy-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish policy only without enabling UI or transport
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddPolicy.kt app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddPolicyTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserGroupMemberAddRequestTest.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(user-groups): add conservative member addition policy without enabling writes'
          git push origin HEAD:dev
