name: Publish physical vertical desktop wheel
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-vertical-wheel.yml]
permissions:
  contents: write
concurrency:
  group: publish-desktop-vertical-wheel-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 7cdddda7513b216fa742874b2b17e19ba058b2e3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply vertical wheel support without rewriting touch gestures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          payload = ''
          source = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(source).hexdigest() == '0735d92664ec2902cebad7ea0baaed2c42c2af77b9b2a501119bd0b2bcd690e1'
          exec(compile(source, 'approved_vertical_wheel', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Build APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified wheel support and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopMouseWheel.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopWheelMath.kt app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopVerticalWheelTest.kt docs/desktop-vertical-wheel.md
          git rm .github/workflows/publish-desktop-vertical-wheel.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): forward physical vertical mouse wheel'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-vertical-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
