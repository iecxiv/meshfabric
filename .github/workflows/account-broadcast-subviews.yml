name: Validate account subviews and direct Broadcast
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/account-broadcast-subviews.yml']
permissions:
  contents: write
concurrency:
  group: account-broadcast-subviews-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate views and compact key choices without changing account transport
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='c56a58f44ae1ac418ec9de5ed7043606d8d0b744','Base changed; re-review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management');changed=set()
          def edit(name,old,new):
              p=root/name;text=p.read_text();assert old and text.count(old)==1,(name,old,text.count(old))
              p.write_text(text.replace(old,new,1));changed.add(str(p))
          edit('UserAdministration.kt','modifier=if(editing) Modifier.widthIn(max=640.dp).fillMaxWidth(0.94f) else Modifier,properties=DialogProperties(securePolicy=SecureFlagPolicy.SecureOn,usePlatformDefaultWidth=!editing)','modifier=if(editing || creating) Modifier.widthIn(max=640.dp).fillMaxWidth(0.94f) else Modifier,properties=DialogProperties(securePolicy=SecureFlagPolicy.SecureOn,usePlatformDefaultWidth=!(editing || creating))')
          p=root/'NoticeCenterScreen.kt';text=p.read_text()
          start='            NoticeSection.BROADCAST->if(broadcast) {';end='            NoticeSection.MESSAGES->'
          assert text.count(start)==1 and text.count(end)==1
          a=text.index(start);b=text.index(end,a)
          text=text[:a]+'''            NoticeSection.BROADCAST->Column(Modifier.weight(1f).fillMaxWidth()) {
                          ProfileManagementConnectionStatus(state,Modifier.padding(horizontal=16.dp),session::start)
                          ProfileBroadcastPane(session,state,Modifier.weight(1f).fillMaxWidth(),embedded=true) {}
                          Box(Modifier.fillMaxWidth().padding(horizontal=16.dp)) {NoticeSubmissionStatus(state.notice,es)}
                      }
          '''+text[b:]
          for old,new in [
              ('    var broadcast by remember {mutableStateOf(false)}\n',''),
              ('LaunchedEffect(state.ready) {if(!state.ready) {broadcast=false;recipient=null}}','LaunchedEffect(state.ready) {if(!state.ready) recipient=null}'),
              ('    BackHandler(enabled=broadcast && section==NoticeSection.BROADCAST) {broadcast=false}\n',''),
              ('broadcast=false;recipient=null;searchState=searchState.cleared();section=it','recipient=null;searchState=searchState.cleared();section=it')]:
              assert text.count(old)==1,old;text=text.replace(old,new,1)
          assert 'Compose Broadcast' not in text and 'Redactar Broadcast' not in text
          p.write_text(text);changed.add(str(p))
          edit('ProfileBroadcastDialog.kt','modifier:Modifier=Modifier,onDismiss:()->Unit)','modifier:Modifier=Modifier,embedded:Boolean=false,onDismiss:()->Unit)')
          edit('ProfileBroadcastDialog.kt','    var feedback by remember(s.id) { mutableStateOf("") }','    var feedback by remember(s.id) { mutableStateOf("") }\n    var submitted by remember(s.id) {mutableStateOf(false)}')
          edit('ProfileBroadcastDialog.kt','val canSend=packet!=null && profileBroadcastAllowed(s,packet,server)','val canSend=!submitted && packet!=null && profileBroadcastAllowed(s,packet,server)')
          edit('ProfileBroadcastDialog.kt','else t("Difusión","Broadcast"))},text=','else t("Difusión a sesiones conectadas","Broadcast to connected sessions"))},text=')
          edit('ProfileBroadcastDialog.kt','Row(verticalAlignment=Alignment.CenterVertically) { Checkbox(approved,','if(!submitted) Row(verticalAlignment=Alignment.CenterVertically) { Checkbox(approved,')
          edit('ProfileBroadcastDialog.kt','if(!scopeAllowed) Text(','if(!scopeAllowed && !submitted) Text(')
          edit('ProfileBroadcastDialog.kt','else scopeAllowed && profileBroadcastMessageValid(message),onClick=','else !submitted && scopeAllowed && profileBroadcastMessageValid(message),onClick=')
          edit('ProfileBroadcastDialog.kt','else if(packet!=null && session.submit(packet)) onDismiss() else feedback=','else if(packet!=null && session.submit(packet)) {if(embedded) {submitted=true;approved=false} else onDismiss()} else feedback=')
          edit('ProfileBroadcastDialog.kt','if(review) TextButton(onClick={review=false;approved=false})','if(review && !submitted) TextButton(onClick={review=false;approved=false})')
          edit('ProfileBroadcastDialog.kt','TextButton(onClick=onDismiss){Text(t("Cancelar","Cancel"))}','if(embedded) TextButton(enabled=!s.busy,onClick={message="";review=false;approved=false;feedback="";submitted=false}) {Text(if(submitted) t("Nueva difusión","New Broadcast") else t("Limpiar","Clear"))} else TextButton(onClick=onDismiss){Text(t("Cancelar","Cancel"))}')
          edit('ProfileBroadcastDialog.kt','Column(modifier.imePadding().padding(16.dp),verticalArrangement=Arrangement.spacedBy(12.dp))','Column(modifier.imePadding().padding(managementConnectionContentPadding),verticalArrangement=Arrangement.spacedBy(10.dp))')
          edit('ProfileBroadcastDialog.kt','ProvideTextStyle(MaterialTheme.typography.headlineSmall)','ProvideTextStyle(MaterialTheme.typography.titleMedium)')
          p=root/'NativeAccount.kt';original=p.read_text();text=original
          ui='@Composable internal fun NativeAccountPane('
          assert text.count(ui)==1
          transport=text.split(ui,1)[0]
          helpers='\ninternal fun fidoPhaseStatus('
          assert text.count(helpers)==1
          modeStart='mode?.let { selected->key(selected) {\n'
          assert text.count(modeStart)==1
          a=text.index(modeStart);tail=text.index(helpers,a)
          blockEnd=text.rfind('\n} }',a,tail)+len('\n} }')
          assert blockEnd>a and text[blockEnd:tail].strip()=='}'
          renderer=text[a:blockEnd]
          old='ManagementDialog(onDismissRequest={ if(!state.busy) { wire.clearResult(); mode=null } },properties='
          assert renderer.count(old)==1
          renderer=renderer.replace(old,'AccountOptionSurface(inline=accountInlineOption(selected),onDismissRequest=::closeAccountOption,properties=',1)
          old='onClick={ wire.clearResult(); mode=null }'
          assert renderer.count(old)==1
          renderer=renderer.replace(old,'onClick=::closeAccountOption',1)
          old='Column(Modifier.fillMaxWidth().heightIn(max=440.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp))'
          assert renderer.count(old)==1
          renderer=renderer.replace(old,'Column(Modifier.fillMaxWidth().heightIn(max=if(accountInlineOption(selected)) LocalConfiguration.current.screenHeightDp.dp else 440.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp))',1)
          text=text[:a]+'if(mode==8) RenderAccountOption()\n'+text[blockEnd:]
          anchor='Column(modifier) {\nManagementConnectionStatus('
          assert text.count(anchor)==1
          declarations='''val accountMainScroll=rememberScrollState()
          fun closeAccountOption() {
              if(!state.busy) {
                  wire.clearResult()
                  mode=accountOptionParents.lastOrNull()
                  accountOptionParents=accountOptionParents.dropLast(1)
              }
          }
          @Composable fun RenderAccountOption() {
          '''+renderer+'''
          }
          '''
          text=text.replace(anchor,declarations+anchor,1)
          old='var mode by remember(wire) { mutableStateOf<Int?>(null) }'
          assert text.count(old)==1
          text=text.replace(old,old+'\nvar accountOptionParents by remember(wire) {mutableStateOf<List<Int>>(emptyList())}',1)
          old='wire.clearResult(); mode=index'
          assert text.count(old)==1
          text=text.replace(old,'if(mode!=null && mode!=index) accountOptionParents=(accountOptionParents+requireNotNull(mode)).takeLast(8)\nwire.clearResult(); mode=index',1)
          old='LaunchedEffect(state.ready) { if(!state.ready) mode=null }'
          assert text.count(old)==1
          text=text.replace(old,'LaunchedEffect(state.ready) { if(!state.ready) {mode=null;accountOptionParents=emptyList()} }',1)
          old='Column(Modifier.weight(1f).fillMaxWidth().verticalScroll(rememberScrollState()).padding(managementConnectionContentPadding),verticalArrangement=Arrangement.spacedBy(10.dp)) {'
          assert text.count(old)==1
          text=text.replace(old,'if(mode?.let(::accountInlineOption)==true) Box(Modifier.weight(1f).fillMaxWidth()) {RenderAccountOption()} else Column(Modifier.weight(1f).fillMaxWidth().verticalScroll(accountMainScroll).padding(managementConnectionContentPadding),verticalArrangement=Arrangement.spacedBy(10.dp)) {',1)
          assert text.split(ui,1)[0]==transport
          assert original[original.index(helpers):]==text[text.index(helpers):]
          assert 'ProfileOwnAccountLaunch(pendingAction,actor,source.serverUrl,state.ready,state.busy,onOpen={openAction(it)},onConsumed=onActionConsumed)' in text
          p.write_text(text);changed.add(str(p))
          edit('AccountSecurityKeyRemoval.kt','''            else->choices.forEach {item->
                          OutlinedButton(enabled=enabled && !submitted,onClick={review=item},modifier=Modifier.fillMaxWidth().testTag("account_security_key_"+item.id)) {
                              Column(Modifier.fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(2.dp)) {
                                  Text(name(item),style=MaterialTheme.typography.titleSmall)
                                  Text("ID: "+item.id,style=MaterialTheme.typography.bodySmall)
                                  Text(t("Seleccionar para eliminar…","Select to remove…"),style=MaterialTheme.typography.labelSmall)
                              }
                          }
                      }''','''            else->Box(Modifier.fillMaxWidth(),contentAlignment=androidx.compose.ui.Alignment.TopCenter) {
                          Column(Modifier.width(IntrinsicSize.Max),verticalArrangement=Arrangement.spacedBy(8.dp),horizontalAlignment=androidx.compose.ui.Alignment.CenterHorizontally) {
                              choices.forEach {item->
                                  OutlinedButton(enabled=enabled && !submitted,onClick={review=item},modifier=Modifier.fillMaxWidth().testTag("account_security_key_"+item.id)) {
                                      Column(Modifier.fillMaxWidth(),horizontalAlignment=androidx.compose.ui.Alignment.CenterHorizontally,verticalArrangement=Arrangement.spacedBy(2.dp)) {
                                          Text(name(item),modifier=Modifier.fillMaxWidth(),textAlign=androidx.compose.ui.text.style.TextAlign.Center,style=MaterialTheme.typography.titleSmall)
                                          Text("ID: "+item.id,modifier=Modifier.fillMaxWidth(),textAlign=androidx.compose.ui.text.style.TextAlign.Center,style=MaterialTheme.typography.bodySmall)
                                          Text(t("Seleccionar para eliminar…","Select to remove…"),modifier=Modifier.fillMaxWidth(),textAlign=androidx.compose.ui.text.style.TextAlign.Center,style=MaterialTheme.typography.labelSmall)
                                      }
                                  }
                              }
                          }
                      }''')
          p=root/'AccountOptionSurface.kt';assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          import androidx.activity.compose.BackHandler
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.DialogProperties
          internal fun accountInlineOption(mode:Int)=mode in 0..10 && mode!=8
          @Composable internal fun AccountOptionSurface(inline:Boolean,onDismissRequest:()->Unit,properties:DialogProperties,title:@Composable ()->Unit,text:@Composable ()->Unit,confirmButton:@Composable ()->Unit) {
              if(!inline) {ManagementDialog(onDismissRequest=onDismissRequest,properties=properties,title=title,text=text,confirmButton=confirmButton);return}
              val context=LocalContext.current
              val window=remember(context) {
                  var owner:android.content.Context=context
                  while(owner is android.content.ContextWrapper && owner !is android.app.Activity) owner=owner.baseContext
                  requireNotNull((owner as? android.app.Activity)?.window)
              }
              DisposableEffect(window) {
                  val flag=android.view.WindowManager.LayoutParams.FLAG_SECURE
                  val previouslySecure=window.attributes.flags and flag!=0
                  window.addFlags(flag)
                  onDispose {if(!previouslySecure) window.clearFlags(flag)}
              }
              BackHandler(onBack=onDismissRequest)
              Column(Modifier.fillMaxSize().imePadding().padding(managementConnectionContentPadding),verticalArrangement=Arrangement.spacedBy(10.dp)) {
                  ProvideTextStyle(MaterialTheme.typography.titleMedium) {title()}
                  Box(Modifier.weight(1f).fillMaxWidth()) {text()}
                  Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.End) {confirmButton()}
              }
          }
          ''');changed.add(str(p))
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/management/AccountInlineOptionTest.kt');assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''package iecxiv.meshfabric.ui.management
          import org.junit.Assert.*
          import org.junit.Test
          class AccountInlineOptionTest {
              @Test fun passwordAndMfaRemainDirectDestinations() {
                  assertEquals(7,profileOwnAccountMode(ProfileOwnAccountRequest("user//a","server","password"),"user//a","server"))
                  assertEquals(10,profileOwnAccountMode(ProfileOwnAccountRequest("user//a","server","mfa"),"user//a","server"))
                  assertTrue(accountInlineOption(7));assertTrue(accountInlineOption(10))
              }
              @Test fun deletionRemainsModalAndInvalidModesAreNotInline() {
                  assertFalse(accountInlineOption(8));assertFalse(accountInlineOption(-1));assertFalse(accountInlineOption(11))
                  assertNull(profileOwnAccountMode(ProfileOwnAccountRequest("user//a","server","mfa"),"user//b","server"))
                  assertNull(profileOwnAccountMode(ProfileOwnAccountRequest("user//a","server","password"),"user//a","other"))
              }
          }
          ''');changed.add(str(p))
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==changed
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-broadcast-subviews-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated account and Broadcast changes and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/account-broadcast-subviews.yml';Path(workflow).unlink()
          root='app/src/main/java/iecxiv/meshfabric/ui/management/'
          paths=[root+n for n in ['UserAdministration.kt','NoticeCenterScreen.kt','ProfileBroadcastDialog.kt','NativeAccount.kt','AccountSecurityKeyRemoval.kt','AccountOptionSurface.kt']]+['app/src/test/java/iecxiv/meshfabric/ui/management/AccountInlineOptionTest.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(account): integrate account options direct Broadcast and centered FIDO keys'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
