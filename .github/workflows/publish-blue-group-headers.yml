name: Validate and publish blue group headers
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-blue-group-headers.yml', 'tools/ui/blue-group-headers/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-blue-group-headers-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply only group header exception and regression tests
        run: |
          set -euo pipefail
          python3 tools/ui/blue-group-headers/apply.py
          git diff --cached --check
          git diff --cached > validation/group-headers.diff
      - name: Install SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, all unit tests, instrumentation compilation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute entire Android test suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify actual test execution
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          report = {}; errors = []
          for root in ['app/build/test-results', 'app/build/outputs/androidTest-results']:
              cases = [c for p in Path(root).rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              failed = [c.get('classname', '') + '.' + c.get('name', '') for c in cases if c.find('failure') is not None or c.find('error') is not None]
              new = [c for c in cases if c.get('classname', '').endswith('.GroupHeaderAppearanceUiTest')]
              report[root] = {'count': len(cases), 'failures': failed, 'new_tests': len(new)}
              if not cases or failed: errors.append(root)
              if 'androidTest' in root and (len(new) != 6 or any(c.find('skipped') is not None for c in new)): errors.append('Missing or skipped group tests')
          Path('validation').mkdir(exist_ok=True)
          Path('validation/test-evidence.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          assert not errors, errors
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-group-headers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish validated code only if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          python3 - <<'PY'
          import subprocess
          allowed = {'app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt', 'app/src/androidTest/java/iecxiv/meshfabric/ui/theme/GroupHeaderAppearanceUiTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()) == allowed
          assert not subprocess.check_output(['git','diff','--name-only'], text=True).strip()
          extra = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          assert not [p for p in extra if not p.startswith('validation/')]
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): retain themed blue group headers without recoloring devices'
          git push origin HEAD:dev
