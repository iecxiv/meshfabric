name: Update dev READMEs for search and validation
on:
  push:
    branches: [dev]
    paths: [.github/workflows/update-dev-readmes.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-readme-publication
  cancel-in-progress: false
jobs:
  docs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Read complete files and apply only reviewed substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          hashes={'README.md':'2290f91870f5ea4db85c01ffbed4276c2b4e9287','README_ES.md':'c648856c9a757d6c7e10e133fd0a3806a9388cd3'}
          additions={'README.md':'''### Management search and local preferences
          
          - Directory search opens and closes from the header and accepts up to 256 characters.
          - Device search inside a group is scoped to that group's devices. Each group retains its own query across trips back to the directory, whose filter is preserved separately.
          - Group search is hidden on Access and Summary; returning to Devices restores its query. Back first closes an open group device search; another Back returns to the directory.
          - Signing out preserves local application preferences; it does not preserve an authenticated session.
          
          Full-screen search integration tests cover section changes, Back navigation and input limits, including a font scale of 1.8. The permanent regression suite includes eleven instrumentation classes, and the maintainer reports both CI jobs passing for the search correction. Controlled session data does not validate live-server permissions or delivery.
          
          The maintainer confirms manual sign-in, Sharing and return from the background to remote desktop and terminal in the tested environment. Restricted-role permissions, event reception and inventory updates still require live-server checks. These reports do not cover every server/device, file-manager resume or process-death recovery. See [Management and validation scope](docs/profile.md).
          
          ''','README_ES.md':'''### Búsqueda en Gestión y preferencias locales
          
          - La búsqueda del directorio se abre y cierra desde la cabecera y admite hasta 256 caracteres.
          - La búsqueda dentro de un grupo filtra únicamente sus dispositivos. Cada grupo conserva su consulta al volver al directorio, cuyo filtro se mantiene por separado.
          - La búsqueda del grupo se oculta en Accesos y Resumen; regresar a Dispositivos recupera su consulta. Atrás primero cierra la búsqueda de dispositivos del grupo abierta; otra pulsación vuelve al directorio.
          - Cerrar sesión conserva las preferencias locales de la aplicación, no una sesión autenticada.
          
          Las pruebas de integración de pantalla completa cubren cambios de sección, navegación con Atrás y límites de entrada, también con escala de fuente de 1,8. La suite permanente incluye once clases instrumentadas y el mantenedor confirma ambos jobs de CI en verde para la corrección de búsqueda. Los datos de sesión controlados no validan permisos ni entrega contra un servidor real.
          
          El mantenedor confirma manualmente el inicio de sesión, Compartir y el retorno desde segundo plano al escritorio remoto y al terminal en el entorno probado. Los permisos con roles restringidos, la recepción de eventos y la actualización de inventarios siguen pendientes de comprobación contra el servidor real. Estas confirmaciones no cubren todos los servidores/dispositivos, el retorno al gestor de archivos ni la recuperación tras morir el proceso. Consulta [Gestión y alcance de validación](docs/es/profile.md).
          
          '''}
          sharing={
              'README.md':('- Device sharing is hidden while its implementation is incomplete.','- Device sharing is available subject to server capabilities and account permissions. Manual use is confirmed in the maintainer\'s tested environment; restricted-role scenarios remain to be checked.'),
              'README_ES.md':('- Compartir permanece oculto mientras su implementación está incompleta.','- Compartir está disponible según las capacidades del servidor y los permisos de la cuenta. El mantenedor confirma su uso manual en el entorno probado; siguen pendientes los escenarios con roles restringidos.')
          }
          updates={}
          for name,sha in hashes.items():
              p=Path(name);raw=p.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual!=sha: raise SystemExit(name+' changed; review required')
              text=raw.decode('utf-8')
              marker='### Security keys (FIDO2/WebAuthn)' if name=='README.md' else '### Llaves de seguridad (FIDO2/WebAuthn)'
              old,new=sharing[name]
              if text.count(marker)!=1 or text.count(old)!=1: raise SystemExit(name+': section or sharing anchor changed')
              updated=text.replace(marker,additions[name]+marker,1).replace(old,new,1)
              restored=updated.replace(additions[name]+marker,marker,1).replace(new,old,1)
              if restored.encode('utf-8')!=raw: raise SystemExit(name+': unexpected content change')
              for target in re.findall(r'\]\(([^)]+)\)',updated):
                  if '://' in target or target.startswith('#'): continue
                  target=target.split('#',1)[0]
                  if target and not (p.parent/target).exists(): raise SystemExit('Broken link: '+target)
              updates[p]=updated.encode('utf-8')
              print(name+': complete input verified; only reviewed additions and sharing sentence changed')
          for p,raw in updates.items(): p.write_bytes(raw)
          PY
          git diff --check
          git diff -- README.md README_ES.md
      - name: Publish README files only on unchanged dev
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'README.md','README_ES.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if changed!=allowed: raise SystemExit('Unexpected files: '+repr(changed))
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: align EN and ES READMEs with management search and validation"
          git push origin HEAD:refs/heads/dev
