name: Update dev READMEs for notice continuity
on:
  push:
    branches: [dev]
    paths: [.github/workflows/update-dev-readmes.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-readme-publication
  cancel-in-progress: false
jobs:
  docs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Update only the reviewed README content
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          hashes={'README.md':'0ca4880cd1e91654b4ffef1988f3383bc13e2f3e','README_ES.md':'30c81f6b661277cacb7bcc9361a73ecbb674225f'}
          additions={'README.md':'''### Connection status and dialog stability
          
          - Shared management-channel indicators keep the same bounds across connecting, connected and disconnected states at the same available width and font scale. Reconnect is integrated into the disconnected text rather than added as a separate side button. Hidden state labels are excluded from accessibility semantics.
          - Broadcast and Messages use the shared status/content spacing rather than adding a separate vertical inset around the status.
          - Management no longer inserts a temporary previous-data banner above its section tabs. Connection state remains in the existing indicator, and actions remain blocked when current data or authorization is unavailable.
          - Device-group details load automatically once per open group and real connection generation after the required state is available. Completing that load does not start another load; Refresh remains an explicit action.
          - Continuity is not unlimited restoration: changing identity, permissions, inventory or selection can invalidate context. Sensitive confirmations keep their own safety rules, and dialog state is not restored after process death.
          
          ''','README_ES.md':'''### Estado de conexión y estabilidad de diálogos
          
          - Los indicadores compartidos del canal de gestión conservan las mismas dimensiones entre conectando, conectado y desconectado para un mismo ancho disponible y escala de fuente. Reconectar se integra en el texto desconectado, sin añadir un botón lateral. Los textos de estados ocultos quedan fuera de la semántica de accesibilidad.
          - Broadcast y Mensajes utilizan el espaciado compartido entre estado y contenido, sin añadir un margen vertical propio alrededor del indicador.
          - Gestión ya no inserta un aviso temporal de datos anteriores por encima de sus pestañas. El estado se muestra en el indicador existente y las acciones permanecen bloqueadas si faltan datos actuales o autorización.
          - La ficha de grupo de dispositivos realiza una carga automática por grupo abierto y generación real de conexión, cuando están disponibles los datos necesarios. Terminar esa carga no dispara otra; Actualizar sigue siendo una acción explícita.
          - La continuidad no es restauración ilimitada: cambios de identidad, permisos, inventario o selección pueden invalidar el contexto. Las confirmaciones sensibles mantienen sus reglas y los diálogos no se restauran tras morir el proceso.
          
          '''}
          activity={
              'README.md':('- The activity journal retains up to 200 entries in memory. It is a session-level view, not a persistent or complete server audit-log archive.','- The activity journal retains up to 200 entries in memory. It is a session-level view, not a persistent or complete server audit-log archive.\n- A control-channel interruption preserves received entries and marks pending action results unknown without automatic resending. Logout, owner destruction or process death can clear this journal; persistent received notices belong to the separate Notices inbox.'),
              'README_ES.md':('- Hasta 200 entradas en memoria: es una vista de la sesión, no un archivo persistente ni completo de auditoría del servidor.','- Hasta 200 entradas en memoria: es una vista de la sesión, no un archivo persistente ni completo de auditoría del servidor.\n- Una interrupción del canal conserva las entradas recibidas y marca resultados pendientes como desconocidos, sin reenviar automáticamente. Cerrar sesión, destruir su propietario o terminar el proceso puede borrar este diario; los avisos recibidos persistentes pertenecen a la bandeja independiente de Avisos.')
          }
          acceptance={
              'README.md':'\nThe Notices and dialog-continuity acceptance checklist remains a manual device/server check: verify saved unread/read state after reopening, account/server isolation, Android-alert dismissal, deletion persistence, background/resume navigation and stable status transitions. Automated success is not proof of these physical-device or delivery scenarios.\n',
              'README_ES.md':'\nLa aceptación de Avisos y continuidad de diálogos sigue requiriendo comprobación manual en dispositivo/servidor: lectura y no leídos al reabrir, separación de cuentas/servidores, descarte de alertas Android, persistencia del borrado, navegación al volver de segundo plano y transiciones de estado sin desplazamientos. El éxito automatizado no demuestra esos escenarios físicos ni la entrega.\n'
          }
          for name,sha in hashes.items():
              p=Path(name);raw=p.read_bytes()
              if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=sha: raise SystemExit(name+' changed; review required')
              text=raw.decode()
              marker='### Agent installation and invitations' if name=='README.md' else '### Instalación de agentes e invitaciones'
              if text.count(marker)!=1: raise SystemExit('Section anchor changed')
              text=text.replace(marker,additions[name]+marker,1)
              old,new=activity[name]
              if text.count(old)!=1: raise SystemExit('Activity anchor changed')
              text=text.replace(old,new,1)
              marker='## Technology' if name=='README.md' else '## Tecnología'
              if text.count(marker)!=1: raise SystemExit('Verification anchor changed')
              text=text.replace(marker,acceptance[name]+'\n'+marker,1)
              for target in re.findall(r'\]\(([^)]+)\)',text):
                  if '://' in target or target.startswith('#'): continue
                  target=target.split('#',1)[0]
                  if target and not (p.parent/target).exists(): raise SystemExit('Broken link: '+target)
              p.write_text(text)
          PY
          git diff --check
      - name: Publish README files only on unchanged dev
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'README.md','README_ES.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if changed!=allowed: raise SystemExit('Unexpected files: '+repr(changed))
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update EN and ES READMEs for stable connection status and dialog continuity"
          git push origin HEAD:refs/heads/dev
