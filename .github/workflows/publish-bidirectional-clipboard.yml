name: Publish bidirectional automatic clipboard
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-bidirectional-clipboard.yml]
permissions:
  contents: write
concurrency:
  group: publish-bidirectional-clipboard-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = fed67ce00c2265fa5c03e973824da64f14fb6240
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply scoped automatic clipboard changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          payload = ''
          source = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(source).hexdigest() == '8fc7ca1c7178dc126c063dbd06c6efcc4bfa495483c7fff0130f9f19b1fd5929'
          exec(compile(source, 'approved_bidirectional_clipboard', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Build APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopAutoClipboard.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopClipboardAutoPolicy.kt app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopClipboardAutoPolicyTest.kt docs/desktop-auto-clipboard.md
          git rm .github/workflows/publish-bidirectional-clipboard.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): synchronize foreground clipboard in both directions'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bidirectional-clipboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
