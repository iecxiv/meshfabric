name: Validate and publish user group access presentation
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-user-group-access-presentation.yml]
permissions:
  contents: write
concurrency:
  group: user-group-access-presentation-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate guarded group access presentation and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          p=main/'UserAdministration.kt';test=tests/'UserDetailPresentationTest.kt'
          for path,sha in [(p,'a508f594ce6ba7f6c49512dc3d924419790f2481'),(test,'3ade040eb9e38615a2318c83b4971212c14a1321'),(main/'ProfileReceivedLinkPresentation.kt','3802865dba95b8cb306e3305adc459a00e26e6fc')]:
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==sha,'Source changed: '+str(path)
          def replace(s,old,new):
              assert s.count(old)==1,'Missing/nonunique anchor: '+old[:100]
              return s.replace(old,new,1)
          original=p.read_text();s=original
          s=replace(s,'TextButton(enabled=contactReady && !s.detailsBusy,onClick={directGrant=true;session.refresh()}) {Text(t("Conceder acceso directo","Grant direct access"))}','ProfileGroupActionButton(t("Conceder acceso directo","Grant direct access"),Icons.Default.Security,contactReady && !s.detailsBusy,onClick={directGrant=true;session.refresh()})')
          old='''for(g in directGroups) ManagementCard {
          Text(g.optString("name").ifBlank {t("Grupo sin nombre","Unnamed group")},style=MaterialTheme.typography.titleSmall)
          TextButton(enabled=contactReady && !s.detailsBusy,onClick={directMesh=g.optString("_id");session.refresh()}) {Text(t("Revisar acceso directo","Review direct access"))}
          TextButton(enabled=contactReady && !s.detailsBusy,onClick={directEdit=g.optString("_id")}) {Text(t("Editar derechos directos","Edit direct rights"))}
          }'''
          new='''for(g in directGroups) ManagementCard {
          val presentation=profileReceivedLinkPresentation(s,user,g.optString("_id"),es)
          Text(presentation.label,style=MaterialTheme.typography.titleSmall)
          ProfileGroupActionButton(t("Revisar acceso directo","Review direct access"),Icons.Default.Security,presentation.usable && contactReady && !s.detailsBusy,onClick={directMesh=g.optString("_id");session.refresh()})
          ProfileGroupActionButton(t("Editar derechos directos","Edit direct rights"),Icons.Default.Edit,presentation.usable && contactReady && !s.detailsBusy,onClick={directEdit=g.optString("_id")})
          if(!presentation.usable) Text(t("Ficha incompleta o ambigua. Actualiza antes de abrir acciones para este grupo.","Incomplete or ambiguous entry. Refresh before opening actions for this group."),style=MaterialTheme.typography.bodySmall)
          }'''
          s=replace(s,old,new)
          old='for(group in common) ManagementCard { ManagementInfoRow(group.optString("name"),userRights(userAccess(s,user,group.optString("_id")),es,true)); TextButton(enabled=contactReady,onClick={onOpenGroup(group.optString("_id"))}) {Text(t("Abrir grupo","Open group"))} }'
          new='''for(group in common) ManagementCard {
          val presentation=profileReceivedLinkPresentation(s,user,group.optString("_id"),es)
          ManagementInfoRow(presentation.label,userRights(userAccess(s,user,group.optString("_id")),es,true))
          ProfileGroupActionButton(t("Abrir grupo","Open group"),Icons.Default.Computer,presentation.usable && contactReady,onClick={onOpenGroup(group.optString("_id"))})
          if(!presentation.usable) Text(t("Ficha incompleta o ambigua. Actualiza antes de abrir este grupo.","Incomplete or ambiguous entry. Refresh before opening this group."),style=MaterialTheme.typography.bodySmall)
          }'''
          s=replace(s,old,new)
          marker='@Composable internal fun UserAdministrationDialog('
          assert s.split(marker)[0]==original.split(marker)[0],'Permission and access helpers must remain unchanged'
          marker='},confirmButton={ if(mode!="history")'
          assert s.split(marker)[1]==original.split(marker)[1],'Submission and dismissal must remain unchanged'
          start='mode=="device"->{';end='mode=="history"->{'
          assert s[s.index(start):s.index(end)]==original[original.index(start):original.index(end)],'Device selector must remain unchanged'
          p.write_text(s)
          s=test.read_text()
          s=replace(s,'private inner class Fixture:AutoCloseable {','private inner class Fixture(val groupMode:String=""):AutoCloseable {\n        var openedGroup:String?=null')
          s=replace(s,'val mesh=JSONObject().put("_id",mid).put("name","Oficina")','val mesh=JSONObject().put("_id",mid).put("name",if(groupMode=="missing") "" else "Oficina")')
          s=replace(s,'groups=listOf(mesh),nodes=listOf(node)','groups=if(groupMode=="ambiguous") listOf(mesh,JSONObject(mesh.toString()).put("_id","mesh//other")) else listOf(mesh),nodes=listOf(node)')
          s=replace(s,'ProfileForm(true,"edit",uid,"Alicia","alice@example.invalid"),onDismiss={})','ProfileForm(true,"edit",uid,"Alicia","alice@example.invalid"),onOpenGroup={openedGroup=it},onDismiss={})')
          marker='    @Test fun mainAndSecurityActionsHaveIconsWithoutChangingTheirText()'
          extra='''    @Test fun directGroupsUseContextAndSharedActionIcons() {Fixture().use {f->
                  compose.onNodeWithText("Accesos directos a grupos de dispositivos").performScrollTo().performClick()
                  compose.onNodeWithText("Grupo de dispositivos: Oficina · Madrid").assertExists()
                  compose.onNodeWithText("Revisar acceso directo").assertIsEnabled()
                  compose.onNodeWithText("Editar derechos directos").assertIsEnabled()
                  compose.onAllNodesWithTag("profile-group-action-icon",useUnmergedTree=true).assertCountEquals(5)
                  f.assertNoIds()
              }}
              @Test fun commonGroupsKeepInternalNavigationAndReadableContext() {Fixture().use {f->
                  compose.onNodeWithText("Grupos de dispositivos en común").performScrollTo().performClick()
                  compose.onNodeWithText("Grupo de dispositivos: Oficina · Madrid").assertExists()
                  compose.onNodeWithText("Abrir grupo").performScrollTo().performClick()
                  assertEquals(mid,f.openedGroup)
                  f.assertNoIds()
              }}
              @Test fun ambiguousDirectGroupBlocksBothActions()=assertDirectGroupBlocked("ambiguous")
              @Test fun unnamedDirectGroupBlocksBothActions()=assertDirectGroupBlocked("missing")
              private fun assertDirectGroupBlocked(mode:String) {Fixture(mode).use {f->
                  compose.onNodeWithText("Accesos directos a grupos de dispositivos").performScrollTo().performClick()
                  if(mode=="missing") compose.onNodeWithText("Grupo de dispositivos: nombre no disponible").assertExists()
                  else compose.onNodeWithText("Grupo de dispositivos: Oficina · Madrid").assertExists()
                  compose.onNodeWithText("Revisar acceso directo").assertIsNotEnabled()
                  compose.onNodeWithText("Editar derechos directos").assertIsNotEnabled()
                  compose.onNodeWithText("Ficha incompleta o ambigua.",substring=true).assertExists()
                  f.assertNoIds()
              }}
              @Test fun ambiguousCommonGroupBlocksNavigation()=assertCommonGroupBlocked("ambiguous")
              @Test fun unnamedCommonGroupBlocksNavigation()=assertCommonGroupBlocked("missing")
              private fun assertCommonGroupBlocked(mode:String) {Fixture(mode).use {f->
                  compose.onNodeWithText("Grupos de dispositivos en común").performScrollTo().performClick()
                  if(mode=="missing") compose.onNodeWithText("Grupo de dispositivos: nombre no disponible").assertExists()
                  else compose.onNodeWithText("Grupo de dispositivos: Oficina · Madrid").assertExists()
                  compose.onNodeWithText("Abrir grupo").assertIsNotEnabled()
                  assertNull(f.openedGroup)
                  f.assertNoIds()
              }}
          '''
          s=replace(s,marker,extra+marker)
          test.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute offline group access, navigation and editor regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.UserDetailPresentationTest,iecxiv.meshfabric.ui.management.ProfileAccessAssignmentNavigationTest,iecxiv.meshfabric.ui.management.ProfileAccessUserNavigationTest,iecxiv.meshfabric.ui.management.ProfileUserMembershipGroupLinksTest,iecxiv.meshfabric.ui.management.UserMeshAssignmentReviewTest,iecxiv.meshfabric.ui.management.UserMeshEditDialogTest,iecxiv.meshfabric.ui.management.UserMeshGrantDialogTest,iecxiv.meshfabric.ui.management.ReadableAssignmentReviewsTest,iecxiv.meshfabric.ui.management.ReadableGrantDialogsTest,iecxiv.meshfabric.ui.management.ReadableUserEditorsTest,iecxiv.meshfabric.ui.management.DeviceGroupAdvancedUiTest,iecxiv.meshfabric.ui.management.DeviceGroupDetailPresentationTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest --no-daemon --stacktrace
      - name: Show concrete Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in sorted(Path('app/build/outputs/androidTest-results').rglob('*.xml')):
              try:
                  root=ET.parse(report).getroot()
              except ET.ParseError as error:
                  print(str(report)+': '+str(error))
                  continue
              for case in root.iter('testcase'):
                  failure=case.find('failure')
                  if failure is None:
                      failure=case.find('error')
                  if failure is not None:
                      print('\nFAILED: '+case.get('classname','')+'.'+case.get('name',''))
                      print(failure.get('message','')[:2000])
                      print((failure.text or '')[:10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-group-access-presentation-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only validated sources if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserDetailPresentationTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserDetailPresentationTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected,'Unexpected staged changes'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): contextual group access cards and guarded navigation'
          git push origin HEAD:dev
