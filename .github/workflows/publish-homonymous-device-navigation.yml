name: Validate exact-ID navigation for homonymous devices
on:
  push:
    branches: [work/fix-group-grant-navigation]
    paths: [.github/workflows/publish-homonymous-device-navigation.yml]
permissions:
  contents: write
concurrency:
  group: fix-group-grant-navigation-work
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate scoped correction and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserDetailPresentationTest.kt')
          for p,sha in [(source,'6a1c0abbee9ba16a35761a4fd57c04a8ca8d6a8c'),(tests,'307852eef95a21f26888e98115bdf30446937d55')]:
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha,'Source changed: '+str(p)
          def change(s,a,b):
              assert s.count(a)==1,'Missing or nonunique anchor: '+a[:80]
              return s.replace(a,b,1)
          original=source.read_text();s=original
          s=change(s,'val deviceCanOpen=nodePresentation.usable && onOpenDevice!=null && canOpenDevice(node.optString("_id"))','''val deviceIdentityReady=s.nodes.count {it.optString("_id")==node.optString("_id")}==1 && profileDeviceIdsMatch(s.id,node.optString("_id"),node.optString("meshid"),node.optString("meshid"))
          val deviceCanOpen=deviceIdentityReady && onOpenDevice!=null && canOpenDevice(node.optString("_id"))''')
          s=change(s,'if(!deviceCanOpen) Text(if(!nodePresentation.usable)','if(!deviceCanOpen) Text(if(!deviceIdentityReady)')
          marker='},confirmButton={ if(mode!="history")'
          assert s.split(marker)[1]==original.split(marker)[1]
          source.write_text(s)
          s=tests.read_text()
          s=change(s,'val ambiguousDevice:Boolean=false):AutoCloseable','val ambiguousDevice:Boolean=false,val duplicateDeviceId:Boolean=false):AutoCloseable')
          s=change(s,'nodes=if(ambiguousDevice) listOf(node,JSONObject(node.toString()).put("_id","node//other")) else listOf(node)','nodes=if(duplicateDeviceId) listOf(node,JSONObject(node.toString())) else if(ambiguousDevice) listOf(node,JSONObject(node.toString()).put("_id","node//other")) else listOf(node)')
          s=change(s,'canOpenDevice={deviceCanOpen && it==nid}','canOpenDevice={deviceCanOpen && (it==nid || (ambiguousDevice && it=="node//other"))}')
          start=s.index('    @Test fun ambiguousCommonDevicesCannotBypassIdentityGuard()')
          end=s.index('    @Test fun commonDevicesUseNamesAndParentGroupContext()',start)
          s=s[:start]+'''    @Test fun homonymousCommonDevicesOpenTheirOwnExactIds() {Fixture(deviceCanOpen=true,ambiguousDevice=true).use {f->
                  compose.onNodeWithText("Dispositivos en común").performScrollTo().performClick()
                  val buttons=compose.onAllNodesWithText("Abrir ficha")
                  buttons.assertCountEquals(2)
                  buttons[0].performScrollTo().assertIsEnabled().performClick()
                  assertEquals(nid,f.openedDevice)
                  buttons[1].performScrollTo().assertIsEnabled().performClick()
                  assertEquals("node//other",f.openedDevice)
                  compose.onAllNodesWithText("Ficha no disponible:",substring=true).assertCountEquals(0)
                  f.assertNoIds()
              }}
              @Test fun duplicateExactDeviceIdStillBlocksBothEntries() {Fixture(deviceCanOpen=true,duplicateDeviceId=true).use {f->
                  compose.onNodeWithText("Dispositivos en común").performScrollTo().performClick()
                  val buttons=compose.onAllNodesWithText("Abrir ficha")
                  buttons.assertCountEquals(2)
                  buttons[0].assertIsNotEnabled();buttons[1].assertIsNotEnabled()
                  compose.onAllNodesWithText("Ficha no disponible: identificación incompleta o ambigua.").assertCountEquals(2)
                  assertNull(f.openedDevice);f.assertNoIds()
              }}
          '''+s[end:]
          tests.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute Android and Compose regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.UserDetailPresentationTest,iecxiv.meshfabric.ui.management.ProfileReceivedDeviceNavigationTest,iecxiv.meshfabric.ui.management.ReadableGrantDialogsTest,iecxiv.meshfabric.ui.management.ProfileAccessUserNavigationTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homonymous-navigation-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish validated sources only to work branch
        run: |
          set -euo pipefail
          BRANCH=work/fix-group-grant-navigation
          test "${{ github.ref_name }}" = "$BRANCH"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "${{ github.sha }}" || { echo 'Work branch moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserDetailPresentationTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserDetailPresentationTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): navigate homonymous devices by exact ID'
          git push origin "HEAD:$BRANCH"
