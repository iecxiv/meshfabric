name: Fit device action menu to available window height
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-device-menu-window-height.yml']
permissions:
  contents: write
concurrency:
  group: fix-device-menu-window-height
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove orientation-only menu height restriction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == 'd8f5233a57fc5a7bc3bf1bbffad0dc8e0528ef48', 'Management UI changed; review required'
          s = p.read_text()
          old = '    val menuMaxHeight=if(configuration.orientation==Configuration.ORIENTATION_LANDSCAPE)\n        minOf(280.dp,availableMenuHeight) else availableMenuHeight'
          assert s.count(old) == 1
          s = s.replace(old,'    val menuMaxHeight=availableMenuHeight',1)
          assert s.count('import android.content.res.Configuration\n') == 1
          s = s.replace('import android.content.res.Configuration\n','',1)
          assert 'Configuration.ORIENTATION_LANDSCAPE' not in s, 'Orientation cap remains'
          assert 'val configuration=LocalConfiguration.current' in s, 'Window configuration must be retained'
          p.write_text(s)
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated device menu fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt
          git rm .github/workflows/fix-device-menu-window-height.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: let device action menu use available window height on large screens'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-menu-window-height-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
