name: Publish clipboard toast cleanup
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-clipboard-toast-cleanup.yml]
permissions:
  contents: write
concurrency:
  group: publish-clipboard-toast-cleanup-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 196aa99cb94ce2c5734f76cb9ba26c90dd81ae2b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove only the redundant request toast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt')
          data = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == '11f7a8f489ad65d99b89843abf4c60f9579da416', 'Desktop source changed; refusing to overwrite'
          needle = b'                                    Toast.makeText(context, "Solicitando del remoto...", Toast.LENGTH_SHORT).show()\n'
          assert data.count(needle) == 1, 'Unexpected request toast count'
          assert b'Toast.makeText(context, "Enviado al portapapeles remoto"' not in data, 'Send toast unexpectedly present'
          result = data.replace(needle, b'', 1)
          assert result.count(b'clipboardManager.setText') == data.count(b'clipboardManager.setText')
          assert result.count(b'DesktopClipboardStatus(') == data.count(b'DesktopClipboardStatus(')
          path.write_bytes(result)
          PY
          git diff --check
      - name: Build and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Commit verified cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt
          git rm .github/workflows/publish-clipboard-toast-cleanup.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): remove redundant clipboard request toast'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-toast-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
