name: Device OS identification
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-device-os-identification.yml']
permissions:
  contents: write
concurrency:
  group: device-os-identification
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add explicit agent platform identification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric')
          screen = root/'ui/devices/DeviceListScreen.kt'
          assert subprocess.check_output(['git','hash-object',str(screen)],text=True).strip() == 'f08aec1c3dcab3831a06ca78e5150688fe034019', 'Device UI changed; review required'
          helper = root/'data/model/DevicePlatform.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.data.model
          
          import java.util.Locale
          
          enum class DevicePlatform(val label: String) {
              WINDOWS("Windows"), LINUX("Linux"), ANDROID("Android"), MACOS("macOS"),
              FREEBSD("FreeBSD"), OPENBSD("OpenBSD"), CHROMEOS("ChromeOS"), UNKNOWN("")
          }
          
          // Explicit identifiers from Ylianst/MeshCentral agenttypes.js.
          // Unknown IDs are not treated as Linux, and icons/names are not OS evidence.
          internal fun identifyDevicePlatform(agentId: Int?, osDescription: String?): DevicePlatform {
              val known = when (agentId) {
                  1, 2, 3, 4, 21, 22, 34, 42, 43, 10003, 10004, 10006, 11000, 11001, 11002 -> DevicePlatform.WINDOWS
                  12, 14 -> DevicePlatform.ANDROID
                  11, 16, 29, 10005 -> DevicePlatform.MACOS
                  17 -> DevicePlatform.CHROMEOS
                  30 -> DevicePlatform.FREEBSD
                  37 -> DevicePlatform.OPENBSD
                  5, 6, 7, 8, 9, 10, 13, 15, 18, 19, 20, 24, 25, 26, 27, 28, 32, 33, 35, 36, 40, 41, 45 -> DevicePlatform.LINUX
                  else -> DevicePlatform.UNKNOWN
              }
              if (known != DevicePlatform.UNKNOWN) return known
              val text = osDescription.orEmpty().lowercase(Locale.ROOT)
              return when {
                  "android" in text -> DevicePlatform.ANDROID
                  "windows" in text -> DevicePlatform.WINDOWS
                  "chromeos" in text || "chrome os" in text -> DevicePlatform.CHROMEOS
                  "macos" in text || "mac os" in text || "darwin" in text -> DevicePlatform.MACOS
                  "freebsd" in text -> DevicePlatform.FREEBSD
                  "openbsd" in text -> DevicePlatform.OPENBSD
                  "linux" in text || "ubuntu" in text || "debian" in text || "fedora" in text || "centos" in text || "rocky linux" in text -> DevicePlatform.LINUX
                  else -> DevicePlatform.UNKNOWN
              }
          }
          
          val MeshNode.platform: DevicePlatform
              get() = identifyDevicePlatform(agent?.id, osdesc)
          
          val MeshNode.osDisplayName: String
              get() = osdesc?.trim()?.takeIf { it.isNotEmpty() } ?: platform.label
          ''')
          s = screen.read_text()
          def once(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old,new,1)
          once('val os=node.osdesc.orEmpty()', 'val os=node.osDisplayName.ifEmpty { stringResource(R.string.device_os_unknown) }')
          once('os.contains("Windows",true)->Icons.Default.DesktopWindows', 'node.platform==DevicePlatform.WINDOWS->Icons.Default.DesktopWindows')
          once('os.contains("Android",true)->Icons.Default.Android', 'node.platform==DevicePlatform.ANDROID->Icons.Default.Android')
          screen.write_text(s)
          import xml.etree.ElementTree as ET
          for folder, label in [('values','SO desconocido'),('values-es','SO desconocido'),('values-en','Unknown OS')]:
              directory = Path('app/src/main/res')/folder
              directory.mkdir(parents=True,exist_ok=True)
              for xml in directory.glob('*.xml'):
                  assert 'name="device_os_unknown"' not in xml.read_text()
              target = directory/'device_os_identification.xml'
              assert not target.exists()
              resources = ET.Element('resources')
              ET.SubElement(resources,'string',name='device_os_unknown').text = label
              ET.ElementTree(resources).write(target,encoding='utf-8',xml_declaration=True)
              with target.open('a') as out: out.write('\n')
          test = Path('app/src/test/java/iecxiv/meshfabric/data/model/DevicePlatformTest.kt')
          assert not test.exists()
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.data.model
          
          import com.google.gson.Gson
          import org.junit.Assert.*
          import org.junit.Test
          
          class DevicePlatformTest {
              @Test fun identifiesPlatformsWithoutDescription() {
                  val expected = mapOf(3 to DevicePlatform.WINDOWS, 43 to DevicePlatform.WINDOWS,
                      6 to DevicePlatform.LINUX, 32 to DevicePlatform.LINUX, 45 to DevicePlatform.LINUX,
                      12 to DevicePlatform.ANDROID, 14 to DevicePlatform.ANDROID,
                      11 to DevicePlatform.MACOS, 16 to DevicePlatform.MACOS, 29 to DevicePlatform.MACOS,
                      10005 to DevicePlatform.MACOS, 17 to DevicePlatform.CHROMEOS,
                      30 to DevicePlatform.FREEBSD, 37 to DevicePlatform.OPENBSD)
                  expected.forEach { (id, platform) ->
                      val node = MeshNode(agent=AgentInfo(id=id))
                      assertEquals(platform,node.platform)
                      assertEquals(platform.label,node.osDisplayName)
                  }
              }
              @Test fun preservesDetailedDescription() {
                  val node = MeshNode(agent=AgentInfo(id=4),osdesc="  Windows 11 Pro  ")
                  assertEquals("Windows 11 Pro",node.osDisplayName)
              }
              @Test fun fallsBackForWhitespaceDescription() {
                  assertEquals("Android",MeshNode(agent=AgentInfo(id=14),osdesc="  ").osDisplayName)
              }
              @Test fun parsesAgentFromServerJson() {
                  val node = Gson().fromJson("{\"_id\":\"node//test\",\"agent\":{\"id\":14}}",MeshNode::class.java)
                  assertEquals(DevicePlatform.ANDROID,node.platform)
                  assertEquals("Android",node.osDisplayName)
              }
              @Test fun unknownDoesNotMeanLinux() {
                  assertEquals(DevicePlatform.UNKNOWN,MeshNode(name="Windows PC",agent=AgentInfo(id=99999),icon=1).platform)
                  assertEquals("",MeshNode().osDisplayName)
                  assertEquals(DevicePlatform.UNKNOWN,MeshNode(agent=AgentInfo(id=23)).platform)
              }
              @Test fun usesDescriptionWhenAgentUnknown() {
                  assertEquals(DevicePlatform.ANDROID,MeshNode(osdesc="Android 12 Linux").platform)
                  assertEquals(DevicePlatform.LINUX,MeshNode(osdesc="Debian GNU/Linux 12").platform)
                  assertEquals(DevicePlatform.WINDOWS,MeshNode(osdesc="Microsoft Windows 11").platform)
              }
              @Test fun knownAgentTypeTakesPriorityForPlatform() {
                  assertEquals(DevicePlatform.ANDROID,MeshNode(agent=AgentInfo(id=14),osdesc="Linux").platform)
              }
          }
          ''')
          PY
          git diff --check
      - name: Compile and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified OS identification
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/model/DevicePlatform.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt app/src/main/res/values/device_os_identification.xml app/src/main/res/values-es/device_os_identification.xml app/src/main/res/values-en/device_os_identification.xml app/src/test/java/iecxiv/meshfabric/data/model/DevicePlatformTest.kt
          git rm .github/workflows/fix-device-os-identification.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: identify device OS from agent type when description is missing'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-os-identification-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
