name: Reproduce and validate node snapshot error rejection
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/validate-node-snapshot-errors.yml']
permissions:
  contents: write
concurrency:
  group: node-snapshot-errors-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Add regressions without changing production code
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='41348601f4bf344c1912ce77463700a168f1e7aa','Base advanced'
          expected={'app/src/main/java/iecxiv/meshfabric/data/remote/NodeSnapshotProtocol.kt':'23986191b0c91ddcdb6ee0b170f88b3cfdc8acd8','app/src/test/java/iecxiv/meshfabric/data/remote/NodeSnapshotProtocolTest.kt':'19d9fb0bd3ede6e142a6ff21fbcd702ab3011624','app/src/androidTest/java/iecxiv/meshfabric/data/remote/NodeSnapshotControlTest.kt':'0fef3f6b6be3e1a96005da18b3417fec1feb8285'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          additions={}
          additions['app/src/test/java/iecxiv/meshfabric/data/remote/NodeSnapshotProtocolTest.kt']=r'''
              @Test fun errorFieldAlwaysRejectsInventoryReplies() {
                  val requests=NodeSnapshotRequests()
                  val packets=listOf(requests.request(),com.google.gson.JsonObject().apply {addProperty("action","nodes")},com.google.gson.JsonObject().apply {addProperty("action","nodes");addProperty("responseid","external")})
                  for(value in listOf("\"denied\"","null","false","0","{}","[]")) for(packet in packets) {
                      packet.add("error",gson.fromJson(value,JsonElement::class.java))
                      assertEquals(NodeSnapshotRequests.Mode.IGNORE,requests.mode(packet))
                  }
              }
              @Test fun errorFieldOverridesSuccessfulResult() {
                  val requests=NodeSnapshotRequests();val packet=requests.request().apply {
                      addProperty("result","OK");addProperty("error","denied")
                  }
                  assertEquals(NodeSnapshotRequests.Mode.IGNORE,requests.mode(packet))
              }
              @Test fun errorRepliesDoNotAdvanceAcceptedSequence() {
                  val requests=NodeSnapshotRequests();val earlier=requests.request()
                  val failed=requests.request().apply {addProperty("error","denied")}
                  requests.accept(failed)
                  assertEquals(NodeSnapshotRequests.Mode.COMPLETE,requests.mode(earlier))
              }
          '''
          additions['app/src/androidTest/java/iecxiv/meshfabric/data/remote/NodeSnapshotControlTest.kt']=r'''
              @Test fun errorFieldCannotClearExistingInventory() = withClient {client ->
                  val original=nodes(client)
                  for(value in listOf("\"denied\"","null","false","0","{}","[]")) {
                      val packet=requests(client).request().apply {add("error",gson.fromJson(value,JsonElement::class.java))}
                      reply(client,packet,"{}")
                      assertEquals(original,nodes(client))
                  }
              }
              @Test fun errorCannotPartiallyReplaceInventoryEvenWithSuccessfulResult() = withClient {client ->
                  val original=nodes(client)
                  val packet=requests(client).request().apply {addProperty("result","OK");addProperty("error","denied")}
                  val payload="""{"mesh//g":[{"_id":"node//b","name":"Changed","conn":0}]}"""
                  reply(client,packet,payload)
                  assertEquals(original,nodes(client))
                  reply(client,requests(client).request(),payload)
                  assertEquals(setOf("node//b"),nodes(client).keys)
                  assertEquals("Changed",nodes(client).getValue("node//b").name)
              }
          '''
          for path,addition in additions.items():
              p=Path(path);source=p.read_text();assert source.rstrip().endswith('}')
              p.write_text(source.rstrip()[:-1]+addition+'}\n')
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(additions)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Require regression failures before applying the guard
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          import xml.etree.ElementTree as ET
          name='iecxiv.meshfabric.data.remote.NodeSnapshotProtocolTest'
          methods={'errorFieldAlwaysRejectsInventoryReplies','errorFieldOverridesSuccessfulResult','errorRepliesDoNotAdvanceAcceptedSequence'}
          command=['bash','./gradlew',':app:testDebugUnitTest']
          for method in sorted(methods): command+=['--tests',name+'.'+method]
          command+=['--rerun-tasks','--no-daemon','--stacktrace']
          result=subprocess.run(command)
          destination=Path(os.environ['RUNNER_TEMP'])/'node-snapshot-errors/red'
          destination.mkdir(parents=True,exist_ok=True)
          cases=[]
          for path in Path('app/build/test-results/testDebugUnitTest').glob('*.xml'):
              shutil.copy2(path,destination/path.name)
              cases.extend(ET.parse(path).getroot().iter('testcase'))
          assert result.returncode!=0,'Regressions unexpectedly passed before correction'
          assert {(case.get('classname'),case.get('name')) for case in cases}=={(name,method) for method in methods},'Unexpected or missing red tests'
          assert all(case.find('failure') is not None and case.find('error') is None and case.find('skipped') is None for case in cases),'Not assertion failures'
          (destination/'receipt.json').write_text(json.dumps({'exit_code':result.returncode,'assertion_failures':sorted(methods)},indent=2))
          path='app/src/main/java/iecxiv/meshfabric/data/remote/NodeSnapshotProtocol.kt'
          assert subprocess.check_output(['git','hash-object',path],text=True).strip()=='23986191b0c91ddcdb6ee0b170f88b3cfdc8acd8'
          p=Path(path);source=p.read_text();anchor='    @Synchronized fun mode(packet:JsonObject):Mode {\n'
          assert source.count(anchor)==1
          p.write_text(source.replace(anchor,anchor+'        if(packet.has("error")) return Mode.IGNORE\n',1))
          allowed={path,'app/src/test/java/iecxiv/meshfabric/data/remote/NodeSnapshotProtocolTest.kt','app/src/androidTest/java/iecxiv/meshfabric/data/remote/NodeSnapshotControlTest.kt'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          (destination.parent/'candidate.json').write_text(json.dumps({path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in allowed}))
      - run: git diff --check
      - name: Build app and tests and run full unit suite and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Require fifteen snapshot unit tests to pass
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[case for path in Path('app/build/test-results/testDebugUnitTest').glob('*.xml') for case in ET.parse(path).getroot().iter('testcase') if case.get('classname')=='iecxiv.meshfabric.data.remote.NodeSnapshotProtocolTest']
          assert len({case.get('name') for case in cases})==15
          assert {'errorFieldAlwaysRejectsInventoryReplies','errorFieldOverridesSuccessfulResult','errorRepliesDoNotAdvanceAcceptedSequence'}<={case.get('name') for case in cases}
          assert all(case.find(key) is None for case in cases for key in ('failure','error','skipped'))
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify all eight selected regression classes individually
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 .github/scripts/run-emulator-regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-snapshot-errors-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/node-snapshot-errors/
            ${{ runner.temp }}/resume-regressions/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish only tested candidates on unchanged dev and retire this workflow
        shell: python
        run: |
          from pathlib import Path
          import ast, hashlib, json, os, subprocess
          root=Path(os.environ['RUNNER_TEMP'])
          summary=json.loads((root/'resume-regressions/summary.json').read_text())
          tree=ast.parse(Path('.github/scripts/run-emulator-regressions.py').read_text())
          classes=next(ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='classes' for target in node.targets))
          assert len(classes)==8 and set(summary)==set(classes)
          assert summary['iecxiv.meshfabric.data.remote.NodeSnapshotControlTest']['expected']==10
          assert all(value['passed']>=value['expected']>0 for value in summary.values())
          hashes=json.loads((root/'node-snapshot-errors/candidate.json').read_text())
          assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==value for path,value in hashes.items())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no publication'
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==set(hashes)
          temporary='.github/workflows/validate-node-snapshot-errors.yml'
          Path(temporary).unlink();allowed=set(hashes)|{temporary}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: preserve node inventory when snapshot replies contain errors'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
