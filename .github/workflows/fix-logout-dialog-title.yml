name: Match logout dialog title size
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-logout-dialog-title.yml']
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Adjust only logout title typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt')
          s = p.read_text()
          old = 'title = { Text(stringResource(R.string.confirm_logout_title), fontWeight = FontWeight.Bold) },'
          new = 'title = { Text(stringResource(R.string.confirm_logout_title), fontWeight = FontWeight.Bold, fontSize = 18.sp) },'
          assert s.count(old) == 1, 'Logout title changed; review required'
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified title fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt
          git rm .github/workflows/fix-logout-dialog-title.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: match logout dialog title to other confirmation dialogs'
          git push origin HEAD:dev
