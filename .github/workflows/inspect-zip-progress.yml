name: Inspect ZIP progress
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/inspect-zip-progress.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Extract ZIP functions in small readable files
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/zip-context-base"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric')
          out = Path('docs/zip-progress-context')
          assert not out.exists()
          out.mkdir(parents=True)
          p = root / 'data/remote/FileRelayClient.kt'
          lines = p.read_text().splitlines()
          pattern = re.compile(r'^    (?:(?:private|internal|public|suspend|override|inline|tailrec)\s+)*fun\s+(\w+)\s*\(')
          functions = [(i, pattern.match(line).group(1)) for i, line in enumerate(lines) if pattern.match(line)]
          selected = []
          for n, (start, name) in enumerate(functions):
              if not re.search('zip|compress', name, re.I):
                  continue
              end = functions[n+1][0] if n+1 < len(functions) else len(lines)
              selected.append(name)
              for part, a in enumerate(range(start, end, 100), 1):
                  b = min(a+100, end)
                  text = '\n'.join(f'{i+1}: {lines[i]}'.rstrip() for i in range(a, b))
                  (out / f'{name}-{part:02}.txt').write_text(str(p) + '\n' + text + '\n')
          assert selected
          matches = [i for i, line in enumerate(lines) if 'TransferType.COMPRESS' in line or 'bytesCompressed' in line]
          context = sorted({j for i in matches for j in range(max(0, i-8), min(len(lines), i+9))})
          for part, a in enumerate(range(0, len(context), 100), 1):
              text = '\n'.join(f'{i+1}: {lines[i]}'.rstrip() for i in context[a:a+100])
              (out / f'progress-references-{part:02}.txt').write_text(text + '\n')
          (out / 'index.txt').write_text('Source commit: ' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\nFunctions:\n' + '\n'.join(selected) + '\nFiles:\n' + '\n'.join(sorted(p.name for p in out.iterdir())) + '\n')
          PY
      - name: Publish diagnostic context only
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/zip-context-base")"
          git add docs/zip-progress-context/
          git rm .github/workflows/inspect-zip-progress.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: extract ZIP progress context for diagnosis'
          git push origin HEAD:dev
