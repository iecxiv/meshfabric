name: Restore stable city selector width
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/restore-city-width.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-city-width-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore only city width and update regression test
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='49d0bf2803475dcb0f0596df067af1f8d368f6a2'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/restore-city-width.yml'
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/theme/AppearancePickers.kt')
          assert git('hash-object',str(p))=='ddddd758abbc9ab524c1716d843b1e5973902fb4'
          s=p.read_text()
          clock=s[s.index('@OptIn(ExperimentalMaterial3Api::class,ExperimentalLayoutApi::class)'):]
          start=s.index('    val measurer=rememberTextMeasurer()')
          end=s.index('    val cities=solarCities.filter',start)
          s=s[:start]+'    val menuWidth=maximumWidth\n'+s[end:]
          old='Modifier.widthIn(max=maximumWidth).testTag("appearance_city_selector")'
          assert s.count(old)==1
          s=s.replace(old,'Modifier.width(maximumWidth).testTag("appearance_city_selector")',1)
          for old in ['import androidx.compose.ui.platform.LocalDensity\n','import androidx.compose.ui.text.AnnotatedString\n','import androidx.compose.ui.text.rememberTextMeasurer\n']:
              assert s.count(old)==1
              s=s.replace(old,'',1)
          assert s[s.index('@OptIn(ExperimentalMaterial3Api::class,ExperimentalLayoutApi::class)'):]==clock
          p.write_text(s)
          test=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearancePickersTest.kt')
          assert git('hash-object',str(test))=='739c3774d02aa17821a20614cc17b921cbfa9ec0'
          s=test.read_text()
          replacements={
              'fun cityAnchorGrowsWithName()':'fun cityAnchorKeepsStableWidth()',
              'assertTrue(large>small)':'assertEquals(small,large,1f)',
              '        assertTrue(large<compose.onNodeWithTag("picker_host").fetchSemanticsNode().boundsInRoot.width)':'        assertTrue(large<compose.onNodeWithTag("picker_host").fetchSemanticsNode().boundsInRoot.width)\n        compose.onNodeWithTag("appearance_city_selector").performClick()\n        val menu=compose.onNodeWithTag("appearance_city_menu").fetchSemanticsNode().boundsInRoot.width\n        assertEquals(large,menu,1f)'
          }
          for old,new in replacements.items():
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          test.write_text(s)
          assert set(git('diff','--name-only').splitlines())=={str(p),str(test)}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build compile UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-city-width-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated width and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert Path('app/build.gradle.kts').read_text()==subprocess.check_output(['git','show','HEAD:app/build.gradle.kts'],text=True)
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow=Path('.github/workflows/restore-city-width.yml');workflow.unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/theme/AppearancePickers.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearancePickersTest.kt',str(workflow)]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(settings): restore stable city selector width and preserve analog clock'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
