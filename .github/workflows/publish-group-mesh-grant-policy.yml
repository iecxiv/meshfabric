name: Validate initial group assignment grants without enabling writes
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-group-mesh-grant-policy.yml]
permissions:
  contents: write
concurrency:
  group: publish-group-mesh-grant-policy-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply grant validation and tests only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          subprocess.run(['git','merge-base','--is-ancestor','e19f2efaf11d94db09f295349a57e348b8c639fd','HEAD'],check=True)
          hashes={'.github/patches/group-mesh-grant-policy/GroupMeshGrantPolicy.kt.txt': 'e5add8905c9f907e8815ec6a6e266a897bcffee146ffc357e42557149ea36afd', '.github/patches/group-mesh-grant-policy/GroupMeshGrantPolicyTest.kt.txt': '3c68efe3653a3298f74cb2882eb46561c6157aa2b8be2bda3381231668ebd61b', '.github/patches/group-mesh-grant-policy/GroupMeshGrantRequestTest.kt.txt': '6f6ee35046037fb20070fcfa2f9b724a9a11a7b6ae34bb8863e123cd32561c82'}
          targets={'.github/patches/group-mesh-grant-policy/GroupMeshGrantPolicy.kt.txt': 'app/src/main/java/iecxiv/meshfabric/ui/management/GroupMeshGrantPolicy.kt', '.github/patches/group-mesh-grant-policy/GroupMeshGrantPolicyTest.kt.txt': 'app/src/test/java/iecxiv/meshfabric/ui/management/GroupMeshGrantPolicyTest.kt', '.github/patches/group-mesh-grant-policy/GroupMeshGrantRequestTest.kt.txt': 'app/src/androidTest/java/iecxiv/meshfabric/ui/management/GroupMeshGrantRequestTest.kt'}
          updates={}
          for name,dest in targets.items():
              data=Path(name).read_bytes();target=Path(dest)
              if hashlib.sha256(data).hexdigest()!=hashes[name]:raise RuntimeError('Template changed: '+name)
              if target.exists():raise RuntimeError('New file already exists: '+dest)
              updates[target]=data.decode()
          for target,content in updates.items():
              target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content)
          PY
          git diff --check
      - name: Build, compile Android tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-mesh-grant-policy-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish policy only without enabling grant transport
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/GroupMeshGrantPolicy.kt app/src/test/java/iecxiv/meshfabric/ui/management/GroupMeshGrantPolicyTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/GroupMeshGrantRequestTest.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(profile): validate new user group device assignments without enabling writes'
          git push origin HEAD:dev
