name: Fix Windows drive selector creation menus
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/windows-creation-menu.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply creation policy to every menu entry
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/windows-create-base"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '64de23f83be8bf0cf749563969f96fe9896564da', 'Source changed; review required'
          s = p.read_text()
          assert 'LocalFileCreationAllowed' not in s
          marker = 'LocalAndroidFiles provides android,'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '\n        LocalFileCreationAllowed provides fileCreationAllowed(android, viewModel.isWindowsFiles(nodeId), path),', 1)
          marker = '    val context = LocalContext.current'
          assert marker in s
          s = s.replace(marker, marker + '\n    val canCreateFiles = LocalFileCreationAllowed.current', 1)
          def call_end(start):
              depth, quoted, escaped = 0, False, False
              for i in range(s.index('(', start), len(s)):
                  c = s[i]
                  if quoted:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == '"': quoted = False
                  elif c == '"': quoted = True
                  elif c == '(': depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0: return i + 1
              raise AssertionError('Unbalanced menu call')
          changes = []
          counts = {'folder': 0, 'file': 0}
          for m in re.finditer(r'\b(?:DropdownMenuItem|Button|TextButton|OutlinedButton)\s*\(', s):
              end = call_end(m.start())
              block = s[m.start():end]
              folder = bool(re.search(r'showCreateFolderDialog\s*=\s*true', block))
              file = bool(re.search(r'showCreateFileDialog\s*=\s*true', block))
              if not folder and not file: continue
              counts['folder'] += int(folder)
              counts['file'] += int(file)
              enabled = re.search(r'\benabled\s*=\s*([^,\n]+)', block)
              if enabled:
                  a, b = enabled.span(1)
                  block = block[:a] + '(' + enabled.group(1) + ') && LocalFileCreationAllowed.current' + block[b:]
              else:
                  pos = block.index('(') + 1
                  block = block[:pos] + '\n enabled = LocalFileCreationAllowed.current,' + block[pos:]
              changes.append((m.start(), end, block))
          assert counts['folder'] >= 2 and counts['file'] >= 2, counts
          for a, b, replacement in reversed(changes): s = s[:a] + replacement + s[b:]
          s = re.sub(r'showCreateFolderDialog\s*=\s*true', 'if (canCreateFiles) showCreateFolderDialog = true', s)
          s = re.sub(r'showCreateFileDialog\s*=\s*true', 'if (canCreateFiles) showCreateFileDialog = true', s)
          s += '''
          private val LocalFileCreationAllowed = staticCompositionLocalOf { true }

          internal fun fileCreationAllowed(android: Boolean, windows: Boolean, path: String): Boolean =
              !android && !(windows && iecxiv.meshfabric.data.remote.WindowsDriveSupport.selector(path))
          '''
          p.write_text(s)
          t = Path('app/src/test/java/iecxiv/meshfabric/ui/files/FileCreationPolicyTest.kt')
          assert not t.exists()
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package iecxiv.meshfabric.ui.files
          import org.junit.Assert.*
          import org.junit.Test
          class FileCreationPolicyTest {
              @Test fun windowsDriveListCannotCreate() {
                  listOf("", "/").forEach { assertFalse(fileCreationAllowed(false, true, it)) }
              }
              @Test fun windowsDirectoriesCanCreate() {
                  listOf("C:/", "C:/Documents", "D:/", "C:\\\\").forEach {
                      assertTrue(fileCreationAllowed(false, true, it))
                  }
              }
              @Test fun androidNeverCreates() {
                  listOf("/", "Audio", "Images", "Videos", "Sdcard", "Sdcard/Download").forEach {
                      assertFalse(fileCreationAllowed(true, false, it))
                  }
              }
              @Test fun otherSystemsUnchanged() {
                  assertTrue(fileCreationAllowed(false, false, "/"))
              }
          }
          ''')
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated creation menus
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/windows-create-base")"
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt app/src/test/java/iecxiv/meshfabric/ui/files/FileCreationPolicyTest.kt
          git rm .github/workflows/windows-creation-menu.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: disable all creation menu entries in Windows drive selector'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-creation-menu-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
