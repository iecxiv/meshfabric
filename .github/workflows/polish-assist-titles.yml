name: Polish desktop assist and batch titles
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/polish-assist-titles.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polish-assist-titles-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply guarded presentation changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('app/src/main/java/iecxiv/meshfabric/ui')
          def change(s,a,b):
              assert s.count(a)==1, 'Unexpected source: '+a
              return s.replace(a,b,1)
          p=base/'desktop/RemoteDesktopScreen.kt'
          s=p.read_text()
          s=change(s,'                        DesktopRightClickAssistHeader(rightClickAssist)\n','')
          anchor='                            FilterChip(selected = selectedMode == MouseMode.SCROLL, onClick = {'
          s=change(s,anchor,'                            DesktopRightClickAssistToolbar(rightClickAssist)\n'+anchor)
          assert s.index('DesktopRightClickAssistToolbar(rightClickAssist)')<s.index(anchor)
          p.write_text(s)
          p=base/'desktop/DesktopRightClickAssist.kt'
          s=p.read_text()
          s=change(s,'fun DesktopRightClickAssistHeader(state:', 'fun DesktopRightClickAssistToolbar(state:')
          s=change(s,'IconButton(onClick = state::toggleVisible, modifier = Modifier.size(38.dp).semantics { selected = state.latch.visible }) {','OutlinedButton(onClick = state::toggleVisible,\n        modifier = Modifier.size(32.dp).semantics { selected = state.latch.visible },\n        shape = MaterialTheme.shapes.small,\n        contentPadding = androidx.compose.foundation.layout.PaddingValues(0.dp),\n        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline),\n        colors = ButtonDefaults.outlinedButtonColors(contentColor = LocalContentColor.current)) {')
          p.write_text(s)
          root=base/'devices'
          helper=root/'DeviceBatchDialogTitle.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.ui.devices

          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          @Composable internal fun DeviceBatchDialogTitle(text: String) {
              Text(text = text, fontWeight = FontWeight.Bold, fontSize = 18.sp)
          }
          ''')
          names=['AgentUpdate','Move','Notifications','Power','Run','Tags','Upload']
          files=[root/('DeviceListBatch'+name+'.kt') for name in names]+[root/'DeviceListManagedBatchActions.kt']
          for p in files:
              s=p.read_text()
              s,n=re.subn(r'(\btitle\s*=\s*\{\s*)Text\(',r'\1DeviceBatchDialogTitle(',s)
              assert n>=1, 'No title found: '+str(p)
              p.write_text(s)
          assert 'DesktopRightClickAssistHeader(rightClickAssist)' not in (base/'desktop/RemoteDesktopScreen.kt').read_text()
          PY
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, compile UI tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assist-title-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated changes and retire workflow
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          rm .github/workflows/polish-assist-titles.yml
          git add app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopRightClickAssist.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListBatch*.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListManagedBatchActions.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceBatchDialogTitle.kt .github/workflows/polish-assist-titles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): relocate right-click assist and align batch dialog titles'
          git push origin HEAD:dev
