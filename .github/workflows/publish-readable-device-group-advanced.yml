name: Validate and publish readable advanced group identities
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-readable-device-group-advanced.yml]
permissions:
  contents: write
concurrency:
  group: readable-device-group-advanced-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate guarded group identity changes and frozen review regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          p=main/'DeviceGroupAdvancedEditor.kt';test=tests/'DeviceGroupAdvancedUiTest.kt'
          for path,sha in [(p,'bd13119fdada839ba9924748d4ec45640043858b'),(test,'bc3b3d5e8b579bc4623ba341458a9e36b30f069b'),(main/'ProfileReviewIdentity.kt','11e45797363c7b51e7b488882a5a60639b4dfa1e')]:
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==sha,'Source changed: '+str(path)
          def replace(s,old,new):
              assert s.count(old)==1,'Missing/nonunique anchor: '+old[:100]
              return s.replace(old,new,1)
          original=p.read_text();s=original
          anchor='    val initial=remember {'
          setup='    val actorRecord=remember {s.user?.let {JSONObject(it.toString())}}\n    val actorIdentity=profileReviewIdentity(actorRecord,listOfNotNull(s.user)+s.users.filter {it.optString("_id")!=s.id},es)\n    val groupIdentity=profileReviewIdentity(baseline,s.groups,es)\n    val identityReady=actorIdentity.usable && groupIdentity.usable\n'
          s=replace(s,anchor,setup+anchor)
          s=replace(s,'val draft=if(bound && initial!=null)','val draft=if(bound && identityReady && initial!=null)')
          s=replace(s,'val current=bound && !invalidated &&','val current=bound && identityReady && !invalidated &&')
          s=replace(s,'Text(t("Actor: ","Actor: ")+actor,style=MaterialTheme.typography.bodySmall)','Text(t("Actor: ","Actor: ")+actorIdentity.label,style=MaterialTheme.typography.bodySmall)')
          s=replace(s,'Text(baseline?.optString("name").orEmpty(),style=MaterialTheme.typography.titleSmall)','Text(groupIdentity.label,style=MaterialTheme.typography.titleSmall)')
          s=replace(s,'            Text(id,style=MaterialTheme.typography.bodySmall)','            if(!identityReady && !submitted) Text(t("El actor o el grupo no se identifican inequívocamente. Cierra, actualiza y vuelve a abrir antes de revisar.","The actor or group cannot be uniquely identified. Close, refresh and reopen before reviewing."),color=MaterialTheme.colorScheme.error)')
          assert s.count('enabled=s.canWrite && !s.detailsBusy && bound &&')==3
          s=s.replace('enabled=s.canWrite && !s.detailsBusy && bound &&','enabled=identityReady && s.canWrite && !s.detailsBusy && bound &&')
          marker='@Composable internal fun DeviceGroupAdvancedEditor('
          assert s.split(marker)[0]==original.split(marker)[0],'Draft and policy helpers must remain unchanged'
          marker='val packet=review?.let'
          assert s[s.index(marker):s.index('    ManagementDialog(')]==original[original.index(marker):original.index('    ManagementDialog(')],'Packet construction and observed result must remain unchanged'
          marker='},confirmButton='
          assert s.split(marker)[1]==original.split(marker)[1],'Submission and dismissal must remain unchanged'
          p.write_text(s)
          s=test.read_text()
          s=replace(s,'JSONObject().put("_id",mid).put("mtype",2)','JSONObject().put("_id",mid).put("name","Oficina").put("desc","Madrid").put("mtype",2)')
          s=replace(s,'user=JSONObject().put("_id",actor).put("siteadmin",0)','user=JSONObject().put("_id",actor).put("name","Administración").put("siteadmin",0)')
          s=replace(s,'    @Test fun reviewRequiresSeparateConfirmationAndStaysInvalidAfterRestoration() {','''    @Test fun reviewRequiresSeparateConfirmationAndStaysInvalidAfterRestoration()=assertReviewInvalidates {state(5)}
              @Test fun ambiguousGroupPermanentlyInvalidatesReview()=assertReviewInvalidates {state().copy(groups=listOf(mesh(),mesh().put("_id","mesh//other")))}
              @Test fun renamedGroupPermanentlyInvalidatesReview()=assertReviewInvalidates {state().copy(groups=listOf(mesh().put("name","Otra oficina")))}
              @Test fun missingGroupNamePermanentlyInvalidatesReview()=assertReviewInvalidates {state().copy(groups=listOf(mesh().put("name","")))}
              @Test fun renamedActorPermanentlyInvalidatesReview()=assertReviewInvalidates {state().let {it.copy(user=JSONObject(requireNotNull(it.user).toString()).put("name","Otro administrador"))}}
              @Test fun authorityLossPermanentlyInvalidatesReview()=assertReviewInvalidates {state().copy(ready=false)}
              private fun assertReviewInvalidates(replacement:()->ProfileState) {''')
          anchor='            compose.onNodeWithTag("advanced-days").performScrollTo().performTextReplacement("30")'
          assertions='''            compose.onAllNodesWithText(actor,substring=true).assertCountEquals(0)
                      compose.onAllNodesWithText(mid,substring=true).assertCountEquals(0)
                      compose.onNodeWithText("Oficina · Madrid").assertExists()
                      compose.onNodeWithText("Actor: Administración").assertExists()
          '''
          s=replace(s,anchor,assertions+anchor)
          s=replace(s,'compose.runOnIdle {current.value=state(5)}','compose.runOnIdle {current.value=replacement()}')
          anchor='            assertNull(field(session,"socket").get(session));assertNull(field(client,"webSocket").get(client))'
          s=replace(s,anchor,'            compose.onAllNodesWithText(actor,substring=true).assertCountEquals(0)\n            compose.onAllNodesWithText(mid,substring=true).assertCountEquals(0)\n'+anchor)
          test.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute advanced group policy, transport and UI regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.DeviceGroupAdvancedUiTest,iecxiv.meshfabric.ui.management.DeviceGroupAdvancedRequestTest,iecxiv.meshfabric.ui.management.DeviceGroupAdvancedSessionTest,iecxiv.meshfabric.ui.management.DeviceGroupDetailPresentationTest,iecxiv.meshfabric.ui.management.ReadableUserEditorsTest,iecxiv.meshfabric.ui.management.UserDetailPresentationTest,iecxiv.meshfabric.ui.management.UserAdvancedRequestTest,iecxiv.meshfabric.ui.management.UserContactRequestTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest --no-daemon --stacktrace
      - name: Show concrete Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in sorted(Path('app/build/outputs/androidTest-results').rglob('*.xml')):
              try:
                  root=ET.parse(report).getroot()
              except ET.ParseError as error:
                  print(str(report)+': '+str(error))
                  continue
              for case in root.iter('testcase'):
                  failure=case.find('failure')
                  if failure is None:
                      failure=case.find('error')
                  if failure is not None:
                      print('\nFAILED: '+case.get('classname','')+'.'+case.get('name',''))
                      print(failure.get('message','')[:2000])
                      print((failure.text or '')[:10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-device-group-advanced-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only validated sources if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/DeviceGroupAdvancedEditor.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/DeviceGroupAdvancedUiTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/DeviceGroupAdvancedEditor.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/DeviceGroupAdvancedUiTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected,'Unexpected staged changes'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): readable advanced group identities and frozen review guards'
          git push origin HEAD:dev
