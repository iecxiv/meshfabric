m && to < data.length &&\n            Character.isHighSurrogate(data[to - 1]) && Character.isLowSurrogate(data[to])) to--\n        return TerminalOutputSlice(epoch, position, start + to, data.substring(from, to), false)\n    }\n}\n', 'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalOutputDelivery.kt': 'package iecxiv.meshfabric.ui.terminal\n\nimport iecxiv.meshfabric.data.remote.TerminalOutputCursor\nimport iecxiv.meshfabric.data.remote.TerminalOutputSlice\n\ninternal data class TerminalOutputBatch(val token: String, val text: String)\n\n/** Main-thread delivery state; only a matching parser ACK advances the cursor. */\ninternal class TerminalOutputDelivery {\n    private var page: Long? = null\n    private var serial = 0L\n    private var pending: Pair<String, TerminalOutputCursor>? = null\n    var cursor: TerminalOutputCursor? = null\n        private set\n    val hasPending: Boolean get() = pending != null\n\n    fun attach(generation: Long) {\n        page = generation\n        cursor = null\n        pending = null\n    }\n    fun invalidate() {\n        page = null\n        pending = null\n        cursor = null\n    }\n    fun prepare(generation: Long, slice: TerminalOutputSlice): TerminalOutputBatch? {\n        if (page != generation || pending != null || slice.gap || slice.text.isEmpty()) return null\n        val token = "$generation-${++serial}"\n        pending = token to TerminalOutputCursor(slice.epoch, slice.end)\n        return TerminalOutputBatch(token, slice.text)\n    }\n    fun acknowledge(generation: Long, token: String): Boolean {\n        val sent = pending ?: return false\n        if (page != generation || sent.first != token) return false\n        cursor = sent.second\n        pending = null\n        return true\n    }\n}\n', 'app/src/test/java/iecxiv/meshfabric/data/remote/TerminalOutputPipelineTest.kt': 'package iecxiv.meshfabric.data.remote\n\nimport iecxiv.meshfabric.ui.terminal.TerminalOutputDelivery\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass TerminalOutputPipelineTest {\n    @Test fun startupAndLiveOutputHaveNoOverlap() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        delivery.attach(1)\n        journal.append("history")\n        val first = delivery.prepare(1, journal.read(delivery.cursor))!!\n        journal.append("live")\n        assertNull(delivery.cursor)\n        assertTrue(delivery.acknowledge(1, first.token))\n        val second = delivery.prepare(1, journal.read(delivery.cursor))!!\n        assertEquals("history", first.text)\n        assertEquals("live", second.text)\n    }\n    @Test fun manyConflatedWakeupsStillReadAllPendingText() {\n        val journal = TerminalOutputJournal()\n        journal.append("a"); journal.append("b"); journal.append("c")\n        assertEquals("abc", journal.read(null).text)\n    }\n    @Test fun onlyOneBatchCanBePending() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        journal.append("abc"); delivery.attach(1)\n        assertNotNull(delivery.prepare(1, journal.read(null)))\n        assertNull(delivery.prepare(1, journal.read(null)))\n    }\n    @Test fun wrongAckCannotAdvanceCursor() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        journal.append("abc"); delivery.attach(1)\n        delivery.prepare(1, journal.read(null))!!\n        assertFalse(delivery.acknowledge(1, "wrong"))\n        assertNull(delivery.cursor)\n        assertTrue(delivery.hasPending)\n    }\n    @Test fun repeatedAckIsIgnored() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        journal.append("abc"); delivery.attach(1)\n        val batch = delivery.prepare(1, journal.read(null))!!\n        assertTrue(delivery.acknowledge(1, batch.token))\n        assertFalse(delivery.acknowledge(1, batch.token))\n    }\n    @Test fun replacedViewRejectsOldAck() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        journal.append("abc"); delivery.attach(1)\n        val old = delivery.prepare(1, journal.read(null))!!\n        delivery.attach(2)\n        val current = delivery.prepare(2, journal.read(null))!!\n        assertFalse(delivery.acknowledge(1, old.token))\n        assertNull(delivery.cursor)\n        assertTrue(delivery.acknowledge(2, current.token))\n    }\n    @Test fun disposalRejectsPendingAck() {\n        val journal = TerminalOutputJournal()\n        val delivery = TerminalOutputDelivery()\n        journal.append("abc"); delivery.attach(1)\n        val batch = delivery.prepare(1, journal.read(null))!!\n        delivery.invalidate()\n        assertFalse(delivery.acknowledge(1, batch.token))\n    }\n    @Test fun boundedJournalReportsGapInsteadOfSkipping() {\n        val journal = TerminalOutputJournal(4)\n        journal.append("abcdef")\n        assertTrue(journal.read(TerminalOutputCursor(0, 0)).gap)\n        assertTrue(journal.read(null).gap)\n        assertEquals("cdef", journal.read(TerminalOutputCursor(0, 2)).text)\n    }\n    @Test fun futureCursorIsRejected() {\n        val journal = TerminalOutputJournal()\n        journal.append("abc")\n        assertTrue(journal.read(TerminalOutputCursor(0, 4)).gap)\n    }\n    @Test fun clearingHistoryInvalidatesOldCursor() {\n        val journal = TerminalOutputJournal()\n        journal.append("old")\n        val old = journal.read(null)\n        journal.clear(); journal.append("new")\n        assertTrue(journal.read(TerminalOutputCursor(old.epoch, old.end)).gap)\n        assertEquals("new", journal.read(null).text)\n    }\n    @Test fun utf16PairIsNotSplitBetweenBatches() {\n        val journal = TerminalOutputJournal()\n        journal.append("a😀b")\n        val first = journal.read(null, 2)\n        val second = journal.read(TerminalOutputCursor(first.epoch, first.end), 2)\n        val third = journal.read(TerminalOutputCursor(second.epoch, second.end), 2)\n        assertEquals("a", first.text)\n        assertEquals("😀", second.text)\n        assertEquals("b", third.text)\n    }\n    @Test fun independentSessionsDoNotMixOutput() {\n        val first = TerminalOutputJournal()\n        val second = TerminalOutputJournal()\n        first.append("one"); second.append("two")\n        assertEquals("one", first.read(null).text)\n        assertEquals("two", second.read(null).text)\n    }\n    @Test fun emptyJournalDoesNotCreatePendingBatch() {\n        val delivery = TerminalOutputDelivery()\n        delivery.attach(1)\n        assertNull(delivery.prepare(1, TerminalOutputJournal().read(null)))\n        assertFalse(delivery.hasPending)\n    }\n    @Test fun journalGapAfterSlowAckIsDetected() {\n        val journal = TerminalOutputJournal(4)\n        val delivery = TerminalOutputDelivery()\n        delivery.attach(1); journal.append("ab")\n        val batch = delivery.prepare(1, journal.read(null))!!\n        journal.append("cdefgh")\n        assertTrue(delivery.acknowledge(1, batch.token))\n        assertTrue(journal.read(delivery.cursor).gap)\n    }\n}\n', 'docs/terminal-output-step.md': '# Terminal output delivery after 32a5aaf\n\n## Scope\n\nNo changes to resize scheduling, PTY size messages, handshake, input encoding, keyboard shortcuts or WebView retention. This is a delivery step on top of the validated phase 1 and readiness gate.\n\nA per-session journal holds at most 1,048,576 UTF-16 code units (roughly 2 MiB of character storage plus runtime overhead). Each read has a stream epoch and absolute cursor. StateFlow revisions only wake the reader; conflating notifications cannot itself skip stored output. Legacy SharedFlow remains for API compatibility, but the terminal view no longer consumes it.\n\nA WebView sends at most one 16,384-code-unit batch until its token is acknowledged by the callback of xterm.write. evaluateJavascript completion is not treated as parser completion. Old-view, wrong and duplicate acknowledgements do not advance the cursor. UTF-16 surrogate pairs are not split by journal reads.\n\nIf the bounded journal no longer contains a required range, or history has been cleared, delivery stops visibly. It does not silently fast-forward or disconnect/restart a remote shell. The error asks the user to disconnect and create a new session if continuity cannot be restored. This is bounded delivery with gap detection, not unlimited or network-level backpressure.\n\n## Still pending\n\n- Retaining the emulator/WebView across navigation and configuration changes.\n- Accurate VT screen snapshots: disk history remains the existing raw ANSI format and may already be truncated. This change does not make replay at a different geometry correct.\n- Renderer-process recovery and a foreground-aware ACK timeout. A missing ACK currently leaves one batch pending; the journal stays bounded and a future resume may detect a gap.\n- Incremental UTF-8 transport decoding and protocol changes remain deliberately excluded after the previous regression.\n\n## Verification\n\n14 new Kotlin/JUnit pipeline cases, six existing readiness cases, and 21 JavaScript cases (14 existing plus seven new). GitHub Actions must run Node tests, assembleDebug and testDebugUnitTest successfully before publishing the functional commit. This does not replace physical-device tests.\n\nDevice checks: history followed by continuous output while opening, rapid away/back navigation, multiple sessions, fast output, nano keyboard open/close, rotation, font size, scrollback and shortcuts. Do not claim lossless delivery after process death or a remote PTY reconnect.\n'}
          node_tests = "\ntest('batch ACK waits for parser completion', () => {\n  const h = runtimeHarness(), acks = [];\n  h.window.AndroidTerminal.onOutputConsumed = token => acks.push(token);\n  assert.equal(h.window.writeTerminalBatch('one', 'abc'), true);\n  assert.deepEqual(acks, []);\n  h.terminal.complete();\n  assert.deepEqual(acks, ['one']);\n});\ntest('batch ACKs preserve processing order', () => {\n  const h = runtimeHarness(), acks = [];\n  h.window.AndroidTerminal.onOutputConsumed = token => acks.push(token);\n  h.window.writeTerminalBatch('one', 'a');\n  h.window.writeTerminalBatch('two', 'b');\n  h.terminal.complete();\n  assert.deepEqual(acks, ['one']);\n  h.terminal.complete();\n  assert.deepEqual(acks, ['one', 'two']);\n});\ntest('legacy writes remain supported without ACK', () => {\n  const h = runtimeHarness(), acks = [];\n  h.window.AndroidTerminal.onOutputConsumed = token => acks.push(token);\n  h.window.writeTerminalData('legacy'); h.terminal.complete();\n  assert.deepEqual(acks, []);\n  assert.deepEqual(h.terminal.writes, ['legacy']);\n});\ntest('invalid batch token is rejected', () => {\n  const h = runtimeHarness();\n  assert.equal(h.window.writeTerminalBatch(null, 'text'), false);\n  assert.equal(h.terminal.writes.length, 0);\n});\ntest('native gap stops the renderer with a visible error', () => {\n  const h = runtimeHarness();\n  h.window.showTerminalDeliveryError();\n  assert.equal(h.panel.hidden, false);\n  assert.equal(h.window.writeTerminalBatch('later', 'text'), false);\n});\ntest('missing ACK bridge is an explicit error', () => {\n  const h = runtimeHarness();\n  h.window.writeTerminalBatch('one', 'abc'); h.terminal.complete();\n  assert.equal(h.panel.hidden, false);\n});\ntest('overflowed batch is rejected without ACK', () => {\n  const h = runtimeHarness(), acks = [];\n  h.window.AndroidTerminal.onOutputConsumed = token => acks.push(token);\n  assert.equal(h.window.writeTerminalBatch('huge', 'x'.repeat(2 * 1024 * 1024 + 1)), false);\n  assert.deepEqual(acks, []);\n  assert.equal(h.panel.hidden, false);\n});\n"
