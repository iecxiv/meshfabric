name: Verify and publish terminal output delivery
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-output-delivery.yml]
permissions:
  contents: write
concurrency:
  group: terminal-output-delivery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reviewed base
        shell: bash
