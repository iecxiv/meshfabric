          test "${GITHUB_REF}" = "refs/heads/terminal-improve"
          git merge-base --is-ancestor 32a5aaf9a8894214b3075c98c7cf502959803216 HEAD
          git diff --exit-code 32a5aaf9a8894214b3075c98c7cf502959803216 HEAD -- . ':(exclude).github/workflows/terminal-output-delivery.yml'
