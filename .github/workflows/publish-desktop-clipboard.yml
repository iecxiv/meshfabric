name: Publish verified desktop clipboard fix
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-clipboard.yml]
permissions:
  contents: write
concurrency:
  group: publish-desktop-clipboard-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = e0b2f75bff2815faa074d42ff09a924518b68c9e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          payload = ""
          source = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(source).hexdigest() == "fddb9dcbb4c3d1347ea5167ac1217fe16bdc99adb155fab67253f9e76a4e0231"
          exec(compile(source, 'approved_clipboard_candidate', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --binary > desktop-clipboard.patch
      - name: Build APK and run JVM tests before committing
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Commit verified fix and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/data/remote/ClipboardControlProtocol.kt app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRelayClient.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/res/values/desktop_clipboard_transfer.xml app/src/main/res/values-es/desktop_clipboard_transfer.xml app/src/main/res/values-en/desktop_clipboard_transfer.xml app/src/test/java/iecxiv/meshfabric/data/remote/ClipboardControlProtocolTest.kt docs/desktop-clipboard-control.md
          git rm .github/workflows/publish-desktop-clipboard.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): restore directed remote clipboard transfers'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK, patch and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-clipboard-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop-clipboard.patch
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
