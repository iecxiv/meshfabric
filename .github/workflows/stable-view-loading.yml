name: Validate history message width and bottom loading
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/stable-view-loading.yml']
permissions:
  contents: write
concurrency:
  group: stable-view-loading-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover immutable candidate and validate both Python blocks before preparation
        shell: python
        run: |
          import ast,hashlib,os,subprocess,textwrap
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          workflow='.github/workflows/stable-view-loading.yml'
          source=git('show','43c062be32b8db06f7ad22d5111086f85bf3d611:'+workflow)
          lines=source.splitlines()
          blocks=[]
          for i,line in enumerate(lines):
              if line!='        run: |':
                  continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '):
                      break
                  body.append(following)
              blocks.append(textwrap.dedent('\n'.join(body))+'\n')
          assert len(blocks)==2,'Unexpected historical workflow structure'
          old="assert git('rev-parse','HEAD^')=='987ddfa9b0da2149f1b3d2f090d6cfa5e1dc4b92','Base changed; re-review required'"
          guard="base='987ddfa9b0da2149f1b3d2f090d6cfa5e1dc4b92'\nsubprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)\nassert set(git('diff','--name-only',base,'HEAD').splitlines()) <= {'.github/workflows/stable-view-loading.yml'},'Functional base changed; re-review required'"
          assert blocks[0].count(old)==1,'Preparation guard changed'
          blocks[0]=blocks[0].replace(old,guard,1)
          assert blocks[1].count(' && ')==1,'Unexpected publication guard'
          blocks[1]=blocks[1].replace(' && ',' and ',1)
          directory=Path(os.environ['RUNNER_TEMP'])
          for name,body in zip(['stable-view-loading-prepare.py','stable-view-loading-publish.py'],blocks):
              ast.parse(body,filename=name)
              compile(body,name,'exec')
              (directory/name).write_text(body)
              print(name,hashlib.sha256(body.encode()).hexdigest())
          exec(compile(blocks[0],'stable-view-loading-prepare.py','exec'))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-view-loading-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/stable-view-loading-paths.json
            ${{ runner.temp }}/stable-view-loading-routing.json
            ${{ runner.temp }}/stable-view-loading-prepare.py
            ${{ runner.temp }}/stable-view-loading-publish.py
          if-no-files-found: ignore
      - name: Publish validated fixes and retire workflow
        run: python "$RUNNER_TEMP/stable-view-loading-publish.py"
