name: Validate group to device group revocation policy without enabling writes
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-group-mesh-revoke-policy.yml]
permissions:
  contents: write
concurrency:
  group: publish-group-mesh-revoke-policy-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply revocation policy and tests only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          subprocess.run(['git','merge-base','--is-ancestor','942c223a11caab9d34996146cb7d0cefb4ca9d42','HEAD'],check=True)
          hashes={'.github/patches/group-mesh-revoke-policy/GroupMeshRevokePolicy.kt.txt': 'bc5eb06a8bba6cc2bde1d24e53951824ae4b1fd5f0ae02f3cd53ab0ba30ae473', '.github/patches/group-mesh-revoke-policy/GroupMeshRevokePolicyTest.kt.txt': '385d308874912a79d89cba6ebadf3e3fa1ed53f9612703eefd5379eb585fb94f', '.github/patches/group-mesh-revoke-policy/GroupMeshRevokeRequestTest.kt.txt': '6c7e05f020b090343bfa1cc80f24bb42891d881382f3d98f57e793083c124913'}
          targets={'.github/patches/group-mesh-revoke-policy/GroupMeshRevokePolicy.kt.txt': 'app/src/main/java/iecxiv/meshfabric/ui/management/GroupMeshRevokePolicy.kt', '.github/patches/group-mesh-revoke-policy/GroupMeshRevokePolicyTest.kt.txt': 'app/src/test/java/iecxiv/meshfabric/ui/management/GroupMeshRevokePolicyTest.kt', '.github/patches/group-mesh-revoke-policy/GroupMeshRevokeRequestTest.kt.txt': 'app/src/androidTest/java/iecxiv/meshfabric/ui/management/GroupMeshRevokeRequestTest.kt'}
          updates={}
          for name,dest in targets.items():
              data=Path(name).read_bytes();path=Path(dest)
              if hashlib.sha256(data).hexdigest()!=hashes[name]:raise RuntimeError('Template changed: '+name)
              if path.exists():raise RuntimeError('New file already exists: '+dest)
              updates[path]=data.decode()
          for path,text in updates.items():
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          PY
          git diff --check
      - name: Build, compile Android tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-mesh-revoke-policy-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish policy only without enabling UI or transport
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/GroupMeshRevokePolicy.kt app/src/test/java/iecxiv/meshfabric/ui/management/GroupMeshRevokePolicyTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/GroupMeshRevokeRequestTest.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(user-groups): validate device group assignment revocation without enabling writes'
          git push origin HEAD:dev
