name: Validate FIDO support
on:
  push:
    branches: [fido-support]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/validate-fido-support.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-fido-support
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fido-support'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Update SDK command-line tools and record preview packages
        run: |
          set -euo pipefail
          mkdir -p validation
          sdkmanager --sdk_root="$ANDROID_HOME" 'cmdline-tools;latest'
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version | tee validation/sdkmanager-version.txt
          "$manager" --sdk_root="$ANDROID_HOME" --list --channel=3 > validation/sdk-packages.txt
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Discover and verify an official API 37 platform
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, subprocess, urllib.request
          import xml.etree.ElementTree as ET
          out=Path('validation')
          url='https://dl.google.com/android/repository/repository2-3.xml'
          with urllib.request.urlopen(url,timeout=60) as response:
              data=response.read(20000001)
          assert len(data)<=20000000,'Repository metadata too large'
          (out/'android-repository.xml').write_bytes(data)
          root=ET.fromstring(data)
          candidates=[]
          inventory=[]
          for package in root.findall('.//{*}remotePackage'):
              path=package.get('path','')
              if not path.startswith('platforms;'): continue
              api=package.find('.//{*}api-level')
              code=package.find('.//{*}codename')
              level=int(api.text) if api is not None and api.text else -1
              codename=(code.text or '') if code is not None else ''
              inventory.append({'path':path,'api':level,'codename':codename})
              if level!=37: continue
              if path!='platforms;android-37' and not codename: continue
              if not re.fullmatch(r'platforms;android-[A-Za-z0-9]+',path): continue
              if codename and not re.fullmatch(r'[A-Za-z][A-Za-z0-9]*',codename): continue
              revision=package.find('{*}revision')
              numbers=tuple(int(revision.findtext('{*}'+part,'0')) for part in ['major','minor','micro']) if revision is not None else (0,0,0)
              candidates.append((path=='platforms;android-37',numbers,path,codename))
          (out/'platform-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          assert candidates,'No official API 37 platform advertised; stopping without bypass or fabricated SDK'
          _,_,path,codename=max(candidates)
          listing=(out/'sdk-packages.txt').read_text()
          assert any(line.split('|',1)[0].strip()==path for line in listing.splitlines()),'Selected platform not advertised by sdkmanager'
          sdk=Path(os.environ['ANDROID_HOME'])
          manager=str(sdk/'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager,'--sdk_root='+str(sdk),'--channel=3','--licenses'],input='y\n'*100,text=True,stdout=subprocess.DEVNULL,check=True)
          subprocess.run([manager,'--sdk_root='+str(sdk),'--channel=3',path,'platforms;android-35','build-tools;36.0.0','build-tools;35.0.0','platform-tools'],check=True)
          installed=sdk/'platforms'/path.split(';',1)[1]/'source.properties'
          properties=dict(line.split('=',1) for line in installed.read_text().splitlines() if '=' in line and not line.startswith('#'))
          assert properties.get('AndroidVersion.ApiLevel','').strip()=='37','Installed platform is not API 37'
          assert (installed.parent/'android.jar').is_file(),'Platform android.jar missing'
          preview=codename if codename and codename!='REL' else ''
          if preview:
              assert properties.get('AndroidVersion.CodeName','').strip()==preview,'Installed preview codename mismatch'
          evidence={'metadata':url,'package':path,'preview':preview,'properties':properties}
          (out/'selected-sdk.json').write_text(json.dumps(evidence,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('ORG_GRADLE_PROJECT_fidoCompileSdkPreview='+preview+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## FIDO SDK selection\nPackage: `'+path+'`\n\nPreview: `'+(preview or 'none')+'`\n\nTarget SDK remains 35. Dependency metadata and all tests must still pass.\n')
      - name: Check dependency SDK requirements without bypasses
        run: |
          set -euo pipefail
          bash ./gradlew :app:checkDebugAarMetadata --no-daemon --stacktrace 2>&1 | tee validation/aar-metadata-check.txt
      - name: Build, all unit tests, instrumented compilation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Entire instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify test evidence
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in ['app/build/test-results','app/build/outputs/androidTest-results']:
              cases=[c for p in Path(root).rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              assert cases,root
              assert not any(c.find(t) is not None for c in cases for t in ['failure','error','skipped']),root
              if root=='app/build/test-results':
                  for name in ['FidoRegistrationContractTest','FidoRegistrationSessionTest','FidoWebOriginPolicyTest']:
                      assert len([c for c in cases if c.get('classname','').endswith('.'+name)])==10,name
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fido-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 14
