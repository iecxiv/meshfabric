name: Validate FIDO support
on:
  push:
    branches: [fido-support]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/validate-fido-support.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-fido-support
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fido-support'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build, all unit tests, instrumented compilation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Entire instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify test evidence
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in ['app/build/test-results','app/build/outputs/androidTest-results']:
              cases=[c for p in Path(root).rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              assert cases,root
              assert not any(c.find(t) is not None for c in cases for t in ['failure','error','skipped']),root
              if root=='app/build/test-results':
                  assert len([c for c in cases if c.get('classname','').endswith('.FidoRegistrationContractTest')])==10
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fido-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 14
