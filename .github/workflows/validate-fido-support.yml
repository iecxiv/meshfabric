name: Validate FIDO support
on:
  push:
    branches: [fido-support]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/validate-fido-support.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-fido-support
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fido-support'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned official SDK with explicit tools path
        run: |
          set -euo pipefail
          mkdir -p validation
          manager="$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version | tee validation/sdkmanager-version.txt
          grep -Fx '23.0' validation/sdkmanager-version.txt
          "$manager" --sdk_root="$ANDROID_HOME" --list --channel=0 > validation/sdk-packages.txt
          "$manager" --sdk_root="$ANDROID_HOME" --channel=0 'platforms;android-37.2' 'platforms;android-35' 'build-tools;37.0.0' 'platform-tools'
          echo "$ANDROID_HOME/cmdline-tools/23.0/bin" >> "$GITHUB_PATH"
      - name: Verify installed SDK identity
        shell: python
        run: |
          from pathlib import Path
          import json, os
          import xml.etree.ElementTree as ET
          sdk=Path(os.environ['ANDROID_HOME'])
          platform=sdk/'platforms/android-37.2'
          root=ET.parse(platform/'package.xml').getroot()
          package=root.find('.//{*}localPackage')
          assert package is not None and package.get('path')=='platforms;android-37.2','Unexpected installed platform'
          assert (platform/'android.jar').is_file(),'Missing platform android.jar'
          properties=dict((k.strip(),v.strip()) for line in (platform/'source.properties').read_text().splitlines() if '=' in line and not line.startswith('#') for k,v in [line.split('=',1)])
          assert properties.get('AndroidVersion.ApiLevel','').split('.')[0]=='37','Unexpected API major'
          assert (sdk/'build-tools/37.0.0/aapt2').is_file(),'Missing pinned build tools'
          toolProperties=(sdk/'cmdline-tools/23.0/source.properties').read_text()
          Path('validation/commandline-source.properties').write_text(toolProperties)
          evidence={'package':'platforms;android-37.2','compileApi':37,'compileMinor':2,'buildTools':'37.0.0','commandLineTools':'23.0','targetSdk':35,'minSdk':26,'properties':properties}
          Path('validation/selected-sdk.json').write_text(json.dumps(evidence,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## FIDO SDK configuration\nPinned platform: `platforms;android-37.2`. Build Tools: `37.0.0`. Command-line Tools: `23.0`.\n\nNo preview selection or synthetic SDK. Dependency checks and all tests must still pass.\n')
      - name: Check dependency SDK requirements without bypasses
        run: |
          set -euo pipefail
          bash ./gradlew :app:checkDebugAarMetadata --no-daemon --stacktrace 2>&1 | tee validation/aar-metadata-check.txt
      - name: Build, all unit tests, instrumented compilation and lint
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace 2>&1 | tee validation/build-and-tests.txt
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Entire instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify test evidence
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in ['app/build/test-results','app/build/outputs/androidTest-results']:
              cases=[c for p in Path(root).rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              assert cases,root
              assert not any(c.find(t) is not None for c in cases for t in ['failure','error','skipped']),root
              if root=='app/build/test-results':
                  for name in ['FidoRegistrationContractTest','FidoRegistrationSessionTest','FidoWebOriginPolicyTest']:
                      assert len([c for c in cases if c.get('classname','').endswith('.'+name)])==10,name
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fido-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 14
