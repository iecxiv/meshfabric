name: Validate complete Log integration
on:
  push:
    branches: [work/registro-server-events]
    paths: [.github/workflows/publish-log-complete.yml]
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate complete integration on guarded base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1209be13c9a14d23e4bd67e28d91fb06e706eb67
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          root=Path('app/src/main/java/iecxiv/meshfabric')
          changed=[]
          def patch(name,sha,edits):
              p=root/name
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha,name
              text=p.read_text()
              for old,new in edits:
                  assert text.count(old)==1,(name,old)
                  text=text.replace(old,new,1)
              p.write_text(text);changed.append(str(p))
          patch('ui/management/CompactBottomNavigation.kt','6f97b411b7c5307d213e17a80ea7a470be4b62d0',[('stringResource(R.string.my_server_activity)','stringResource(R.string.registro_title)')])
          patch('ui/management/MeshFabricHome.kt','da53546d6ddd2ee0f696a472a68e634a8362b1a6',[('import iecxiv.meshfabric.ui.components.MeshFabricActivityScreen\n',''),('else MeshFabricActivityScreen(viewModel=','else LogScreen(viewModel=')])
          patch('ui/components/MeshFabricAppBar.kt','2d1473bfab1a9b84c981b9aaa09c621e64b3ead2',[('import androidx.compose.runtime.*','import androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable'),('onReconnect:()->Unit,onOpenSettings:()->Unit) {','onReconnect:()->Unit,onOpenSettings:()->Unit,header:@Composable ()->Unit={}) {'),('var showSearch by remember {','var showSearch by rememberSaveable {'),('var search by remember {','var search by rememberSaveable {'),('        AnimatedVisibility(showSearch) {','        header()\n        AnimatedVisibility(showSearch) {')])
          patch('ui/management/ActivityTimeline.kt','17e27e9eb174fc4da160d6687f2b8722059b1926',[('import androidx.compose.runtime.*','import androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable'),('var filter by remember {','var filter by rememberSaveable {'),('var device by remember {','var device by rememberSaveable {')])
          translations={
          'log_loading':('Loading server events…','Consultando eventos del servidor…'),
          'log_idle':('Load server events.','Consulta los eventos del servidor.'),
          'log_empty':('No visible events were returned.','No se han devuelto eventos visibles.'),
          'log_denied':('The server explicitly denied the request.','El servidor ha denegado explícitamente la consulta.'),
          'log_error':('The query failed. No empty history is assumed.','La consulta ha fallado. No se interpreta como un historial vacío.'),
          'log_invalid':('Invalid or oversized server response.','Respuesta del servidor no válida o demasiado grande.'),
          'log_timeout':('No response within the time limit. Check connection and permissions.','Sin respuesta dentro del plazo. Comprueba conexión y permisos.'),
          'log_invalidated':('Data cleared after a connection, account or access change. Refresh to query again.','Datos retirados tras un cambio de conexión, cuenta o acceso. Actualiza para consultar de nuevo.'),
          'log_scope':('Up to 200 recent events visible to this account; not a complete server audit log.','Hasta 200 eventos recientes visibles para esta cuenta; no es una auditoría completa del servidor.'),
          'log_refresh':('Refresh','Actualizar'),
          'log_search':('Search received events','Buscar en los eventos recibidos'),
