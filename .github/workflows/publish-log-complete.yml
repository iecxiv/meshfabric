          'docs/log.md':'''# Registro / Log

The former Activity destination is labelled Registro in Spanish and Log in English. It contains Activity and Events tabs using the Management/Server tab component. Resource files are named log.xml; resource identifiers remain compatible.

Activity retains its journal, filters and command feedback. Search and filter state are saveable across switching between the two tabs.

Events performs a read-only query on a separate authenticated control channel, after checking the exact actor. Requests use action=events, a unique tag and a fixed limit of 200. Only matching responses are accepted. No event deletion, unbounded query, automatic retry or claim of complete server audit coverage is provided. Search filters the received records locally. Reopening Events or resuming the screen requests a fresh bounded snapshot; Refresh is manual while the screen remains active.

Timeout, malformed data, explicit denial and empty returned history are distinct states. Channel failure, lifecycle pause, observed access changes and account/connection changes clear the snapshot. Server-side authorization remains authoritative, and there is no transactional guarantee against concurrent access changes. Live events are not appended to the historical snapshot and do not confirm remote action execution.

Validation: execute JVM tests, lint, debug and Android-test compilation, then the scoped RegistroSectionTabsTest, LogScreenTest and ManagementNavigationLabelTest classes. Run the complete suite before final integration into dev. Automated Compose checks do not replace a physical-device visual review or live-server compatibility verification.
          '''}
          for name,content in files.items():
              p=Path(name);assert not p.exists(),name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content);changed.append(name)
          assert len(changed)==15
          assert not list(Path('app/src/main/res').glob('values*/registro.xml'))
          Path('validation/expected.json').write_text(json.dumps(sorted(changed)))
          Path('validation/scope.txt').write_text('Complete visible Log integration; scoped Android tests selected before execution. Full suite still required before final dev integration. No live-server or physical-device visual validation claimed.\n')
          subprocess.run(['git','add','--',*changed],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(changed)
          PY
          git diff --cached --check
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build execute JVM tests compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute affected Compose and navigation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.RegistroSectionTabsTest,iecxiv.meshfabric.ui.management.LogScreenTest,iecxiv.meshfabric.ui.management.ManagementNavigationLabelTest --no-daemon --stacktrace
      - name: Verify execution evidence and exact change scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          totals={}
          for kind,folder,required in [('jvm','app/build/test-results/testDebugUnitTest',{'LogEventsReaderTest':4,'ServerEventsReadPolicyTest':9}),('android','app/build/outputs/androidTest-results/connected',{'LogScreenTest':4,'RegistroSectionTabsTest':2,'ManagementNavigationLabelTest':2})]:
              cases=[]
              for p in Path(folder).rglob('*.xml'):cases.extend(ET.parse(p).getroot().iter('testcase'))
              assert cases,kind
              assert all(all(c.find(tag) is None for tag in ('failure','error','skipped')) for c in cases),kind
              for name,count in required.items():assert sum(c.get('classname','').split('.')[-1]==name for c in cases)==count,(kind,name)
              totals[kind]=len(cases)
          Path('validation/tests.json').write_text(json.dumps(totals,indent=2))
          expected=json.loads(Path('validation/expected.json').read_text())
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git diff --cached > validation/log.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-integration-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish all Log changes together only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(log): integrate Activity and server Events with scoped regressions'
          git push origin HEAD:work/registro-server-events
