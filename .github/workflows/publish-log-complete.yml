name: Validate complete Log integration
on:
  push:
    branches: [work/registro-server-events]
    paths: [.github/workflows/publish-log-complete.yml]
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate YAML and recover pinned generator without YAML-embedded documents
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3eaac8d494f1a8780f27c364e9a15a8f60d2bebf
          mkdir -p validation
          python3 -m venv /tmp/log-yaml-check
          /tmp/log-yaml-check/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/log-yaml-check/bin/python - <<'PY'
          from pathlib import Path
          import ast,subprocess,yaml
          path='.github/workflows/publish-log-complete.yml'
          workflow=yaml.safe_load(Path(path).read_text())
          assert isinstance(workflow,dict) and 'validate' in workflow['jobs']
          ref='3eaac8d494f1a8780f27c364e9a15a8f60d2bebf:'+path
          assert subprocess.check_output(['git','rev-parse',ref],text=True).strip()=='b29021c5e3e7a7ada4c1909247f92d74e8cf6e29'
          original=subprocess.check_output(['git','show',ref],text=True)
          chunks=original.split("          python3 - <<'PY'\n")
          assert len(chunks)==3
          def extract(chunk):
              body=chunk.split('\n          PY\n',1)[0]
              return '\n'.join(line[10:] if line.startswith(' '*10) else line for line in body.splitlines())+'\n'
          generator=extract(chunks[1])
          anchor=":'''package iecxiv.meshfabric"
          assert generator.count(anchor)==4
          generator=generator.replace(anchor,":r'''package iecxiv.meshfabric")
          old="['git','diff','--cached','--name-only']"
          new="['git','diff','--cached','--name-only','--no-renames']"
          assert generator.count(old)==1
          generator=generator.replace(old,new)
          verifier=extract(chunks[2])
          assert verifier.count(old)==1
          verifier=verifier.replace(old,new)
          for name,code in [('log-generator.py',generator),('log-verifier.py',verifier)]:
              ast.parse(code,filename=name)
              Path('validation',name).write_text(code)
          Path('validation/workflow-syntax.txt').write_text('Current YAML parsed. Pinned generator and verifier parsed as Python. Four Kotlin literals preserve backslash escapes. Rename checks explicitly include deleted and added paths.\n')
          PY
      - name: Generate complete Log integration and verify exact source scope
        run: |
          set -euo pipefail
          python3 validation/log-generator.py
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          expected=json.loads(Path('validation/expected.json').read_text())
          assert len(expected)==15
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','--no-renames'],text=True).splitlines())
          assert actual==set(expected),(actual,set(expected))
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          tables={}
          for directory in ('values','values-en','values-es'):
              old=Path('app/src/main/res')/directory/'registro.xml'
              new=old.with_name('log.xml')
              assert not old.exists() and new.exists()
              entries=ET.parse(new).getroot().findall('string')
              table={entry.attrib['name']:entry.text for entry in entries}
              assert len(entries)==len(table)==18
              tables[directory]=table
          assert tables['values']==tables['values-en']
          assert set(tables['values'])==set(tables['values-es'])
          assert tables['values']['registro_title']=='Log'
          assert tables['values-es']['registro_title']=='Registro'
          Path('validation/translations.json').write_text(json.dumps(tables,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --cached --check
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build execute JVM tests compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute affected Compose and navigation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.RegistroSectionTabsTest,iecxiv.meshfabric.ui.management.LogScreenTest,iecxiv.meshfabric.ui.management.ManagementNavigationLabelTest --no-daemon --stacktrace
      - name: Verify executed JVM Compose and navigation evidence
        run: |
          set -euo pipefail
          python3 validation/log-verifier.py
          git diff --cached --check
          git diff --cached > validation/log.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-integration-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/intermediates/lint_intermediate_text_report/
          retention-days: 7
          if-no-files-found: error
      - name: Publish all Log changes together only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          expected=json.loads(Path('validation/expected.json').read_text())
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','--no-renames'],text=True).splitlines())
          assert len(expected)==15 and actual==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(log): integrate Activity and server Events with scoped regressions'
          git push origin HEAD:work/registro-server-events
