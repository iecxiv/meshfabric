name: Publish validated lint fix and compact shortcut UI
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-lint-key-routing.yml]
permissions:
  contents: write
concurrency:
  group: publish-lint-key-routing-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved preparation parent
        run: test "$(git rev-parse HEAD^)" = d44784445d8bf2e3fe7dc355afbded7d89b37e71
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved app changes without editing workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == 'c8bf0bef3bae2a18572c2083d9736f179b3ef79222f91fd2cb0c0d84428ef701'
          exec(compile(source, 'approved_lint_and_compact_ui', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --exit-code -- .github/workflows app/build.gradle.kts
      - name: Compile APKs, run JVM tests and require lint success
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --continue --no-daemon --stacktrace
      - name: Show complete lint report even if validation fails
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d app/build ]; then
            find app/build -type f -name 'lint-results-debug.txt' -print -exec cat {} \;
          fi
      - name: Publish app code only after successful validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows app/build.gradle.kts
          git add -- app/src/main/java/iecxiv/meshfabric/MainActivity.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopMouseWindowCallback.kt app/src/androidTest/java/iecxiv/meshfabric/ui/desktop/DesktopMouseWindowCallbackTest.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopShortcutSections.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt docs/android-lint-input-routing.md
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Refusing to publish workflow changes with the Actions token'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(android): publish validated public key routing and compact shortcut UI'
          git push origin HEAD:refs/heads/dev
      - name: Upload validation reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-shortcuts-1.2.8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/**/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
