name: Verify and publish public window key routing lint fix
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-lint-key-routing.yml]
permissions:
  contents: write
concurrency:
  group: publish-lint-key-routing-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 1af609e817e7d4f34ab60224921895d59a02e637
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved input-routing and CI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == '6d6cd0e400ed310f6892c7576c2514a9310b6c9aac095b05b19dc824191b3477'
          exec(compile(source, 'approved_lint_key_routing', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Build and test with the same mandatory lint gate as main
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --continue --no-daemon --stacktrace
      - name: Show complete lint text report even on failure
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d app/build ]; then
            find app/build -type f -name 'lint-results-debug.txt' -print -exec cat {} \;
          fi
      - name: Publish only after all validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/build.gradle.kts
          git add -- app/src/main/java/iecxiv/meshfabric/MainActivity.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopMouseWindowCallback.kt app/src/androidTest/java/iecxiv/meshfabric/ui/desktop/DesktopMouseWindowCallbackTest.kt .github/workflows/android-ci.yml docs/android-lint-input-routing.md
          git rm .github/workflows/publish-lint-key-routing.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(android): use public window key callback and gate dev with lint'
          git push origin HEAD:refs/heads/dev
      - name: Upload full validation reports and APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-key-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/**/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
