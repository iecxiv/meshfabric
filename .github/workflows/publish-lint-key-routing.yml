name: Publish centered single-row shortcut editor
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-lint-key-routing.yml]
permissions:
  contents: write
concurrency:
  group: publish-lint-key-routing-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved preparation parent
        run: test "$(git rev-parse HEAD^)" = ceafffcbe95aaa609e446ae9c39d1a7a2f443acb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved shortcut alignment and single-row changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == '90d9dbff3dd8912be22fd2fba40fe8c50ae9723ac6af43e78c69b86714d71636'
          exec(compile(source, 'approved_single_row_shortcuts', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --exit-code -- .github/workflows app/build.gradle.kts
      - name: Compile APKs, run JVM tests and require lint success
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --continue --no-daemon --stacktrace
      - name: Show full lint report even if validation fails
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d app/build ]; then
            find app/build -type f -name 'lint-results-debug.txt' -print -exec cat {} \;
          fi
      - name: Publish only validated app and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows app/build.gradle.kts
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopShortcutSections.kt docs/android-lint-input-routing.md
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Refusing workflow changes with the Actions token'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): center shortcut labels and keep key picker beside Win'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: centered-shortcuts-1.2.8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/**/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
