name: Validate explicit node connectivity events
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/validate-node-connectivity.yml']
permissions:
  contents: write
concurrency:
  group: node-connectivity-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare scoped connectivity event corrections
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='419c9d58558aacc1bb5058f1a9576dc8671e95f5','Base advanced'
          expected={'app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt':'1243110f41ac79018d33c6905991659e632fc2fb','.github/scripts/run-emulator-regressions.py':'cd78cdb2a478afb2848a4df049ef285f1d3bcb98'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          p=Path('app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt');s=p.read_text()
          anchor='    private fun handleControlMessage(text: String) {'
          assert s.count(anchor)==1
          method='''    private fun applyNodeConnectivityEvent(event: JsonObject) {
                  val nodeId=NodeEventConnectivity.nodeId(event) ?: return
                  val connection=NodeEventConnectivity.connection(event) ?: return
                  val existing=NodeEventConnectivity.keys(nodeId).firstNotNullOfOrNull { nodesMap[it] } ?: return
                  if (existing.conn != connection) {
                      nodesMap[existing.id]=existing.copy(conn=connection)
                      updateGroupedDevices()
                  }
                  if (NodeEventConnectivity.becameReachable(existing.conn,connection,NodeEventConnectivity.action(event)))
                      onNodeConnectedListener?.invoke(existing.id)
              }

          '''
          s=s.replace(anchor,method+anchor,1)
          a=s.index('                "nodeconnect" -> {')
          b=s.index('                "getnetworkinfo" -> {',a)
          branches='''                "nodeconnect", "nodedisconnect", "changenode" -> {
                              applyNodeConnectivityEvent(json)
                              launchControlWork { webSocket ->
                                  delay(100)
                                  webSocket?.send("""{"action":"nodes"}""")
                              }
                          }
                          "event" -> {
                              val eventObj=json.get("event")?.takeIf { it.isJsonObject }?.asJsonObject
                              if (eventObj != null) {
                                  val eventAction=NodeEventConnectivity.action(eventObj)
                                  val nodeId=NodeEventConnectivity.nodeId(eventObj).orEmpty()
                                  if (nodeId.isNotEmpty() || eventAction.contains("node",ignoreCase=true)) {
                                      iecxiv.meshfabric.diagnostics.AppDiagnostics.trace(3,"MeshCentralClient","MeshCentralClient.kt:node-event") { "Node event received: $eventAction for $nodeId" }
                                      applyNodeConnectivityEvent(eventObj)
                                      launchControlWork { webSocket ->
                                          delay(100)
                                          webSocket?.send("""{"action":"nodes"}""")
                                      }
                                  }
                              }
                          }
          '''
          s=s[:a]+branches+s[b:];p.write_text(s)
          p=Path('.github/scripts/run-emulator-regressions.py');s=p.read_text()
          assert s.count('classes=[')==1
          s=s.replace('classes=[',"classes=['iecxiv.meshfabric.data.remote.NodeConnectivityControlTest',",1);p.write_text(s)
          files={}
          files['app/src/main/java/iecxiv/meshfabric/data/remote/NodeEventConnectivity.kt']=r'''package iecxiv.meshfabric.data.remote
          import com.google.gson.JsonObject
          internal object NodeEventConnectivity {
              private fun text(json: JsonObject, key: String): String? = json.get(key)
                  ?.takeIf { it.isJsonPrimitive && it.asJsonPrimitive.isString }?.asString?.takeIf { it.isNotBlank() }
              fun action(json: JsonObject): String = text(json,"action").orEmpty()
              fun nodeId(json: JsonObject): String? {
                  val node=json.get("node")
                  return text(json,"nodeid") ?: node?.takeIf { it.isJsonObject }?.asJsonObject?.let { text(it,"_id") }
                      ?: text(json,"node")
              }
              fun keys(id: String): List<String> {
                  val raw=id.trim()
                  val clean=when {
                      raw.startsWith("node//") -> raw.removePrefix("node//")
                      raw.startsWith("node/") -> raw.removePrefix("node/")
                      else -> raw
                  }
                  return listOf(raw,clean,"node//$clean","node/$clean").distinct()
              }
              fun connection(json: JsonObject): Int? {
                  val action=action(json)
                  if (action !in setOf("nodeconnect","nodedisconnect","changenode")) return null
                  val nested=json.get("node")?.takeIf { it.isJsonObject }?.asJsonObject
                  val value=if(json.has("conn")) json.get("conn") else nested?.get("conn")
                  if(value==null) return if(action=="nodedisconnect") 0 else null
                  if(!value.isJsonPrimitive || !value.asJsonPrimitive.isNumber) return null
                  return value.asString.toIntOrNull()?.takeIf { it>=0 }
              }
              fun becameReachable(before: Int, after: Int, action: String): Boolean =
                  action!="nodedisconnect" && after>0 && (before==0 || ((before and 1)==0 && (after and 1)!=0))
          }
          '''
          files['app/src/test/java/iecxiv/meshfabric/data/remote/NodeEventConnectivityTest.kt']=r'''package iecxiv.meshfabric.data.remote
          import com.google.gson.Gson
          import com.google.gson.JsonObject
          import org.junit.Assert.*
          import org.junit.Test
          class NodeEventConnectivityTest {
              private fun packet(text:String)=Gson().fromJson(text,JsonObject::class.java)
              @Test fun unrelatedEventsCannotChangeConnectivity() {
                  assertNull(NodeEventConnectivity.connection(packet("""{"action":"agentconsole","nodeid":"node//a","conn":1}""")))
              }
              @Test fun explicitZeroIsNotConvertedToConnected() {
                  assertEquals(0,NodeEventConnectivity.connection(packet("""{"action":"nodeconnect","conn":0}""")))
              }
              @Test fun missingConnectionDoesNotInventConnectivity() {
                  assertNull(NodeEventConnectivity.connection(packet("""{"action":"nodeconnect","nodeid":"node//a"}""")))
                  assertNull(NodeEventConnectivity.connection(packet("""{"action":"changenode","node":{"_id":"node//a","name":"Changed"}}""")))
              }
              @Test fun malformedConnectionDoesNotOverwriteState() {
                  listOf("null","true","-1","1.5","2147483648","\"1\"").forEach {
                      assertNull(NodeEventConnectivity.connection(packet("""{"action":"nodeconnect","conn":$it}""")))
                  }
              }
              @Test fun disconnectWithoutMaskDefaultsToOffline() {
                  assertEquals(0,NodeEventConnectivity.connection(packet("""{"action":"nodedisconnect"}""")))
              }
              @Test fun disconnectPreservesExplicitRemainingTransports() {
                  assertEquals(2,NodeEventConnectivity.connection(packet("""{"action":"nodedisconnect","conn":2}""")))
              }
              @Test fun nestedNodeConnectionAndIdAreReadSafely() {
                  val p=packet("""{"action":"changenode","node":{"_id":"node//a","conn":3}}""")
                  assertEquals("node//a",NodeEventConnectivity.nodeId(p)); assertEquals(3,NodeEventConnectivity.connection(p))
              }
              @Test fun explicitOuterMaskTakesPriority() {
                  assertEquals(0,NodeEventConnectivity.connection(packet("""{"action":"nodeconnect","conn":0,"node":{"_id":"node//a","conn":1}}""")))
              }
              @Test fun primitiveAndMissingNodeIdsAreHandled() {
                  assertEquals("node//a",NodeEventConnectivity.nodeId(packet("""{"node":"node//a"}""")))
                  assertNull(NodeEventConnectivity.nodeId(packet("""{"node":7}""")))
                  assertNull(NodeEventConnectivity.nodeId(packet("""{"node":{}}""")))
              }
              @Test fun aliasesPreserveDomainAndStripOnlyOnePrefix() {
                  assertTrue(NodeEventConnectivity.keys("domain/a").contains("node/domain/a"))
                  assertTrue(NodeEventConnectivity.keys("a").contains("node//a"))
                  assertTrue(NodeEventConnectivity.keys("node//node/a").contains("node/a"))
                  assertFalse(NodeEventConnectivity.keys("node//node/a").contains("a"))
              }
              @Test fun notifyOnlyForOfflineRecoveryOrNewAgentTransport() {
                  assertTrue(NodeEventConnectivity.becameReachable(0,1,"nodeconnect"))
                  assertTrue(NodeEventConnectivity.becameReachable(2,3,"nodeconnect"))
                  assertFalse(NodeEventConnectivity.becameReachable(1,1,"nodeconnect"))
                  assertFalse(NodeEventConnectivity.becameReachable(1,3,"changenode"))
                  assertFalse(NodeEventConnectivity.becameReachable(1,0,"nodeconnect"))
                  assertFalse(NodeEventConnectivity.becameReachable(0,2,"nodedisconnect"))
              }
          }
          '''
          files['app/src/androidTest/java/iecxiv/meshfabric/data/remote/NodeConnectivityControlTest.kt']=r'''package iecxiv.meshfabric.data.remote
          import org.junit.Assert.*
          import org.junit.Test
          class NodeConnectivityControlTest {
              private fun ingest(client:MeshCentralClient,text:String) {
                  val method=MeshCentralClient::class.java.getDeclaredMethod("handleControlMessage",String::class.java)
                  method.isAccessible=true; method.invoke(client,text)
              }
              private fun withClient(conn:Int,body:(MeshCentralClient,MutableList<String>)->Unit) {
                  val client=MeshCentralClient(); val notices=mutableListOf<String>()
                  try {
                      ingest(client,"""{"action":"meshes","meshes":[{"_id":"mesh//g","name":"Group"}]}""")
                      ingest(client,"""{"action":"nodes","nodes":{"mesh//g":[{"_id":"node//a","name":"Device","conn":$conn}]}}""")
                      client.onNodeConnectedListener={notices.add(it)}
                      body(client,notices)
                  } finally {client.disconnect()}
              }
              private fun node(client:MeshCentralClient)=client.groupedDevices.value.flatMap {it.second}.single()
              @Test fun unrelatedNodeEventCannotBringOfflineDeviceOnline() = withClient(0) {client,notices ->
                  ingest(client,"""{"action":"event","event":{"action":"agentconsole","nodeid":"node//a","conn":1}}""")
                  assertEquals(0,node(client).conn); assertTrue(notices.isEmpty())
              }
              @Test fun nestedZeroConnectionRemainsDisconnected() = withClient(1) {client,notices ->
                  ingest(client,"""{"action":"event","event":{"action":"nodeconnect","nodeid":"node//a","conn":0}}""")
                  assertEquals(0,node(client).conn); assertTrue(notices.isEmpty())
              }
              @Test fun repeatedPrimitiveNodeConnectNotifiesOnlyOnce() = withClient(0) {client,notices ->
                  repeat(2) {ingest(client,"""{"action":"nodeconnect","node":"node//a","conn":1}""")}
                  assertEquals(1,node(client).conn); assertEquals(listOf("node//a"),notices)
              }
              @Test fun partialChangeDoesNotEraseExistingDeviceState() = withClient(1) {client,notices ->
                  ingest(client,"""{"action":"changenode","node":{"_id":"node//a","name":"Changed"}}""")
                  assertEquals(1,node(client).conn); assertEquals("Device",node(client).name); assertTrue(notices.isEmpty())
              }
              @Test fun cleanedNodeIdUpdatesCanonicalDevice() = withClient(0) {client,notices ->
                  ingest(client,"""{"action":"event","event":{"action":"nodeconnect","nodeid":"a","conn":1}}""")
                  assertEquals(1,node(client).conn); assertEquals(listOf("node//a"),notices)
              }
              @Test fun agentRecoveryAndRemainingTransportAreDistinguished() = withClient(2) {client,notices ->
                  ingest(client,"""{"action":"nodeconnect","nodeid":"node//a","conn":3}""")
                  ingest(client,"""{"action":"event","event":{"action":"nodedisconnect","node":{"_id":"node//a"},"conn":2}}""")
                  assertEquals(2,node(client).conn); assertEquals(listOf("node//a"),notices)
              }
          }
          '''
          for path,content in files.items():
              p=Path(path);assert not p.exists(),path
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert modified==set(expected) and added==set(files)
          Path(os.environ['RUNNER_TEMP'],'node-event-candidate.json').write_text(json.dumps({path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in modified|added}))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run full unit suite and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Require eleven new unit tests to execute and pass
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[case for path in Path('app/build/test-results/testDebugUnitTest').glob('*.xml') for case in ET.parse(path).getroot().iter('testcase') if case.get('classname')=='iecxiv.meshfabric.data.remote.NodeEventConnectivityTest']
          assert len({case.get('name') for case in cases})==11,'Missing new unit tests'
          assert all(case.find(key) is None for case in cases for key in ('failure','error','skipped'))
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify new control event tests and all previous selected regressions individually
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 .github/scripts/run-emulator-regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-connectivity-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/resume-regressions/
            ${{ runner.temp }}/node-event-candidate.json
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish only tested candidates on unchanged dev and retire this workflow
        shell: python
        run: |
          from pathlib import Path
          import ast, hashlib, json, os, subprocess
          root=Path(os.environ['RUNNER_TEMP'])
          summary=json.loads((root/'resume-regressions/summary.json').read_text())
          tree=ast.parse(Path('.github/scripts/run-emulator-regressions.py').read_text())
          classes=next(ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='classes' for target in node.targets))
          assert len(classes)==7 and set(summary)==set(classes)
          assert summary['iecxiv.meshfabric.data.remote.NodeConnectivityControlTest']['expected']==6
          assert all(value['passed']>=value['expected']>0 for value in summary.values())
          hashes=json.loads((root/'node-event-candidate.json').read_text())
          assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==value for path,value in hashes.items()),'Candidate changed after preparation'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no publication'
          changed=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==set(hashes)
          temporary='.github/workflows/validate-node-connectivity.yml'
          Path(temporary).unlink()
          allowed=set(hashes)|{temporary}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: honor explicit node connectivity and ignore unrelated event reconnections'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
