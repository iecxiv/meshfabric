name: Verify terminal End typography and version 1.1.3
on:
  push:
    branches: [dev]
    paths: [.github/workflows/dev-end-version.yml]
permissions:
  contents: write
concurrency:
  group: dev-end-version
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed dev base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          git merge-base --is-ancestor 5482d0b23e06153bbf384c9c6d99dfb7074ceae3 HEAD
          git diff --exit-code 5482d0b23e06153bbf384c9c6d99dfb7074ceae3 HEAD -- . ':(exclude).github/workflows/dev-end-version.yml'
      - name: Match End to Home and update version name only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          comparison = '''        val homeLayouts = mutableListOf<androidx.compose.ui.text.TextLayoutResult>()
                  val endLayouts = mutableListOf<androidx.compose.ui.text.TextLayoutResult>()
                  compose.onNodeWithText(context.getString(R.string.terminal_key_home), useUnmergedTree = true)
                      .performSemanticsAction(androidx.compose.ui.semantics.SemanticsActions.GetTextLayoutResult) { action -> action(homeLayouts) }
                  compose.onNodeWithText(context.getString(R.string.terminal_key_end), useUnmergedTree = true)
                      .performSemanticsAction(androidx.compose.ui.semantics.SemanticsActions.GetTextLayoutResult) { action -> action(endLayouts) }
                  val homeStyle = homeLayouts.single().layoutInput.style
                  val endStyle = endLayouts.single().layoutInput.style
                  assertEquals(homeStyle.fontSize, endStyle.fontSize)
                  assertEquals(homeStyle.lineHeight, endStyle.lineHeight)
                  assertEquals(homeStyle.fontWeight, endStyle.fontWeight)
                  assertFalse(endLayouts.single().didOverflowHeight)'''
          edits = {
              'app/build.gradle.kts': [('versionName = "1.1.2"', 'versionName = "1.1.3"')],
              'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBar.kt': [
                  ('largeLabel = key.id == "enter" || key.id == "end", arrowRotation = arrow,', 'largeLabel = key.id == "enter", arrowRotation = arrow,')
              ],
              'app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBarTest.kt': [
                  ('        assertLargeText(R.string.terminal_key_end)', comparison)
              ]
          }
          config = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          if config.count('versionCode = 1' + chr(10)) != 1:
              raise RuntimeError('versionCode must remain 1')
          prepared = {}
          for name, replacements in edits.items():
              content = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if content.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  content = content.replace(old, new, 1)
              content.encode('utf-8')
              prepared[name] = content
          if prepared['app/build.gradle.kts'].count('versionCode = 1' + chr(10)) != 1:
              raise RuntimeError('versionCode changed unexpectedly')
          for name, content in prepared.items():
              Path(name).write_text(content, encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing JavaScript regressions
        run: |
          node app/src/test/js/terminal-keys.test.js
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End typography desktop keyboard and terminal regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.desktop.DesktopKeyboardInputTest,iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalFocusWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalKeyBarTest --no-daemon --stacktrace
      - name: Publish verified End and version update on dev only
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/dev | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/dev-end-version.yml
          git add -- app/build.gradle.kts app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBar.kt app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBarTest.kt .github/workflows/dev-end-version.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: match terminal End to Home and set version 1.1.3'
          git push origin HEAD:refs/heads/dev
      - name: Upload reports and version 1.1.3 APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-end-version-1.1.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
