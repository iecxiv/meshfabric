name: Validate integrated user profile navigation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/profile-inline-navigation.yml']
permissions:
  contents: write
concurrency:
  group: profile-inline-navigation-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate main user profile and preserve existing action handlers
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          def read(name,sha):
              p=root/name
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha,name
              return p,p.read_text()
          p,original=read('ProfileScreen.kt','f26728627eb8babfe6e7ec2ee5091903a299343f')
          text=original
          start='form?.let { selected->\n'
          end='\nuserGroupDetails?.let {gid->'
          assert text.count(start)==1 and text.count(end)==1
          a=text.index(start);b=text.index(end,a)
          renderer=text[a:b]
          text=text[:a]+'if(!inlineUser) RenderProfileForm()\n'+text[b:]
          anchor='Column(modifier) {\n'
          assert text.count(anchor)==1
          declarations='''val inlineUser=tab!=0 && form?.let {it.users && it.operation=="edit"}==true
          @Composable fun RenderProfileForm() {
          '''+renderer+'''
          }
          LaunchedEffect(inlineUser) {if(inlineUser) {directoryFocus.clearFocus(force=true);directoryKeyboard?.hide()}}
          '''
          text=text.replace(anchor,declarations+anchor,1)
          old='val directoryListState=androidx.compose.foundation.lazy.rememberLazyListState()'
          new='val usersListState=key(agentIdentity) {androidx.compose.foundation.lazy.rememberLazyListState()}\nval deviceGroupsListState=key(agentIdentity) {androidx.compose.foundation.lazy.rememberLazyListState()}'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          assert text.count('state=directoryListState,')==1
          text=text.replace('state=directoryListState,','state=if(users) usersListState else deviceGroupsListState,',1)
          begin='if(tab==0) NativeAccountPane('
          finish='\n}\ngroupDetails?.takeIf'
          assert text.count(begin)==1 and text.count(finish)==1
          a=text.index(begin);b=text.index(finish,a)
          body=text[a:b]
          replacement='''Box(Modifier.weight(1f).fillMaxWidth()) {
          Column(Modifier.fillMaxSize().then(if(inlineUser) Modifier.clearAndSetSemantics {} else Modifier)) {
          '''+body+'''
          }
          if(inlineUser) Column(Modifier.fillMaxSize()) {
              CompositionLocalProvider(LocalProfileUserInline provides true) {RenderProfileForm()}
          }
          }
          '''
          text=text[:a]+replacement+text[b:]
          importAnchor='import androidx.compose.ui.Modifier\n'
          assert text.count(importAnchor)==1
          text=text.replace(importAnchor,importAnchor+'import androidx.compose.ui.semantics.clearAndSetSemantics\n',1)
          assert renderer in text
          assert original[original.index('val closeProfileDialog:()->Unit='):original.index('DisposableEffect(session)')]==text[text.index('val closeProfileDialog:()->Unit='):text.index('DisposableEffect(session)')]
          p.write_text(text)
          p,text=read('UserAdministration.kt','92fdb3aba6c40929e7b567e41be19f579dfbdb4a')
          changes=[
              ('var mode by remember { mutableStateOf("profile") }','var mode by remember { mutableStateOf("profile") }\nval mainProfileScroll=rememberScrollState()\nval secondaryProfileScroll=rememberScrollState()'),
              ('ManagementDialog(onDismissRequest=onDismiss,modifier=if(editing)',
               'ProfileUserDetailSurface(inline=LocalProfileUserInline.current && editing && mode=="profile",onDismissRequest=onDismiss,modifier=if(editing)'),
              ('Column(Modifier.fillMaxWidth().heightIn(max=if(editing) (LocalConfiguration.current.screenHeightDp*0.68f).dp else 440.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(10.dp))',
               'Column(Modifier.fillMaxWidth().heightIn(max=if(LocalProfileUserInline.current && editing && mode=="profile") LocalConfiguration.current.screenHeightDp.dp else if(editing) (LocalConfiguration.current.screenHeightDp*0.68f).dp else 440.dp).verticalScroll(if(mode=="profile") mainProfileScroll else secondaryProfileScroll),verticalArrangement=Arrangement.spacedBy(10.dp))')
          ]
          original=text;undo=[]
          for old,new in changes:
              assert text.count(old)==1,old
              pos=text.index(old);undo.append((pos,old,new));text=text[:pos]+new+text[pos+len(old):]
          restored=text
          for pos,old,new in reversed(undo):
              assert restored[pos:pos+len(new)]==new
              restored=restored[:pos]+old+restored[pos+len(new):]
          assert restored==original
          p.write_text(text)
          p=root/'ProfileUserDetailSurface.kt'
          assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          
          import androidx.activity.compose.BackHandler
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.input.pointer.PointerEventPass
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.DialogProperties
          
          internal val LocalProfileUserInline=staticCompositionLocalOf {false}
          
          @Composable internal fun ProfileUserDetailSurface(inline:Boolean,onDismissRequest:()->Unit,modifier:Modifier=Modifier,properties:DialogProperties=DialogProperties(),title:@Composable ()->Unit,text:@Composable ()->Unit,confirmButton:@Composable ()->Unit,dismissButton:@Composable ()->Unit) {
              if(!inline) {
                  ManagementDialog(onDismissRequest=onDismissRequest,modifier=modifier,properties=properties,title=title,text=text,confirmButton=confirmButton,dismissButton=dismissButton)
                  return
              }
              val context=LocalContext.current
              val window=remember(context) {
                  var owner:android.content.Context=context
                  while(owner is android.content.ContextWrapper && owner !is android.app.Activity) owner=owner.baseContext
                  requireNotNull((owner as? android.app.Activity)?.window)
              }
              DisposableEffect(window) {
                  val flag=android.view.WindowManager.LayoutParams.FLAG_SECURE
                  val previouslySecure=window.attributes.flags and flag!=0
                  window.addFlags(flag)
                  onDispose {if(!previouslySecure) window.clearFlags(flag)}
              }
              BackHandler(onBack=onDismissRequest)
              val es=LocalConfiguration.current.locales[0].language=="es"
              Surface(modifier=Modifier.fillMaxSize().pointerInput(Unit) {
                  awaitPointerEventScope {
                      while(true) awaitPointerEvent(PointerEventPass.Final).changes.forEach {it.consume()}
                  }
              },color=MaterialTheme.colorScheme.surface) {
                  Column(Modifier.fillMaxSize().imePadding().padding(16.dp),verticalArrangement=Arrangement.spacedBy(12.dp)) {
                      Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                          TextButton(onClick=onDismissRequest,modifier=Modifier.heightIn(min=48.dp)) {Text(if(es) "Volver" else "Back")}
                          Box(Modifier.weight(1f)) {title()}
                      }
                      Box(Modifier.weight(1f).fillMaxWidth()) {text()}
                      FlowRow(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(8.dp,Alignment.End),verticalArrangement=Arrangement.spacedBy(4.dp)) {
                          dismissButton()
                          confirmButton()
                      }
                  }
              }
          }
          ''')
          expected={str(root/name) for name in ['ProfileScreen.kt','UserAdministration.kt','ProfileUserDetailSurface.kt']}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed|untracked==expected
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-inline-navigation-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated profile navigation and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/profile-inline-navigation.yml'
          Path(workflow).unlink()
          root='app/src/main/java/iecxiv/meshfabric/ui/management/'
          paths=[root+name for name in ['ProfileScreen.kt','UserAdministration.kt','ProfileUserDetailSurface.kt']]+[workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(management): integrate main user profile and preserve directory positions'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
