name: Validate permanent audit CI regressions
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/audit-ci-regressions.yml']
permissions:
  contents: write
concurrency:
  group: audit-ci-regressions-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare only permanent CI configuration
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('.github/workflows/android-ci.yml')
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='73270d42e4a8c4ce66a8ba970564a91a7a10c3fd','Base advanced; review required'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='7716572f7443dcc0a135849230ca482ad0802456','CI changed; review required'
          s=p.read_text()
          def edit(old,new):
              global s
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          edit("      - '.github/workflows/android-ci.yml'\n",'')
          edit('    # The publishing workflow validates these workflow-only preparation commits.\n    # Code changes and PRs targeting main still run the complete Android checks.','    # Keep the isolated historical publisher excluded. CI changes are validated.\n    # Code changes and PRs targeting main run build, unit, lint and UI regressions.')
          edit('          packages: platform-tools',"          cmdline-tools-version: '16111833'\n          packages: platform-tools")
          edit('sdkmanager "platforms;android-35" "build-tools;35.0.0"','sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"')
          assert '  ui-regressions:' not in s
          s+=r'''
            ui-regressions:
              name: Emulator UI and storage regressions
              needs: build-and-test
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '21'
                - uses: android-actions/setup-android@v3
                  with:
                    cmdline-tools-version: '16111833'
                    packages: platform-tools
                    log-accepted-android-sdk-licenses: false
                - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    cache-read-only: ${{ github.event_name == 'pull_request' }}
                - name: Enable emulator acceleration
                  run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm
                - name: Execute selected regressions
                  uses: reactivecircus/android-emulator-runner@v2
                  with:
                    api-level: 35
                    target: google_apis
                    arch: x86_64
                    profile: pixel_2
                    disable-animations: true
                    emulator-boot-timeout: 900
                    script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.data.local.SessionStorageSafetyTest,iecxiv.meshfabric.ui.management.DeviceGroupSearchTest,iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest,iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest --no-daemon --stacktrace
                - name: Verify all selected test classes executed successfully
                  shell: python
                  run: |
                    from pathlib import Path
                    import xml.etree.ElementTree as ET
                    expected={'iecxiv.meshfabric.data.local.SessionStorageSafetyTest','iecxiv.meshfabric.ui.management.DeviceGroupSearchTest','iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest','iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest'}
                    reports=list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
                    assert reports,'No instrumentation reports'
                    cases=[case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
                    assert expected <= {case.get('classname') for case in cases},'Missing expected test classes'
                    assert all(case.find('failure') is None and case.find('error') is None and case.find('skipped') is None for case in cases),'Failed or skipped instrumentation tests'
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: ui-regression-reports-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                      app/build/outputs/androidTest-results/
                      app/build/reports/androidTests/
                    if-no-files-found: error
                    retention-days: 14
          '''
          p.write_text(s)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==[str(p)]
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute selected regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.data.local.SessionStorageSafetyTest,iecxiv.meshfabric.ui.management.DeviceGroupSearchTest,iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest,iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest --no-daemon --stacktrace
      - name: Verify all selected test classes executed successfully
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={'iecxiv.meshfabric.data.local.SessionStorageSafetyTest','iecxiv.meshfabric.ui.management.DeviceGroupSearchTest','iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest','iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest'}
          reports=list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          assert reports,'No instrumentation reports'
          cases=[case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
          assert expected <= {case.get('classname') for case in cases},'Missing expected test classes'
          assert all(case.find('failure') is None and case.find('error') is None and case.find('skipped') is None for case in cases),'Failed or skipped instrumentation tests'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-ci-validation-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish validated CI and retire temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          assert git('diff','--name-only')=='.github/workflows/android-ci.yml'
          assert not git('ls-files','--others','--exclude-standard')
          workflow='.github/workflows/audit-ci-regressions.yml'
          Path(workflow).unlink()
          allowed={'.github/workflows/android-ci.yml',workflow}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ci: align existing SDK tooling and execute permanent emulator regressions'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
