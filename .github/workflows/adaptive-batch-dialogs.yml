name: Adaptive batch dialogs and Compose test v2
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/adaptive-batch-dialogs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adaptive-batch-dialogs-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare guarded layout and warning fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess,re
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='ab05672e9b04e7d19606a11215bad8347e2f87cc'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/adaptive-batch-dialogs.yml'
          changed=[]
          def save(p,s): p.write_text(s);changed.append(str(p))
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearanceSelectorLayoutTest.kt')
          assert git('hash-object',str(p))=='9248dcf8593a8a77f9d2f256e4b747ed96b3b20a'
          s=p.read_text()
          old='import androidx.compose.ui.test.junit4.createComposeRule'
          assert s.count(old)==1
          s=s.replace(old,'import androidx.compose.ui.test.junit4.v2.createComposeRule',1)
          old='        }\n    }\n    private fun choose'
          assert s.count(old)==1
          s=s.replace(old,'        }\n        compose.waitForIdle()\n    }\n    private fun choose',1)
          save(p,s)
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/devices')
          for name in ['Power','Tags','Notifications','Run','Move','AgentUpdate','Upload','Managed']:
              p=root/('DeviceListManagedBatchActions.kt' if name=='Managed' else 'DeviceListBatch'+name+'.kt')
              s=p.read_text()
              s,n=re.subn(r'\.heightIn\(max\s*=\s*(?:320|360|400|420|440)\.dp\)','',s)
              assert n==1,str(p)+': unexpected height caps'
              old='.verticalScroll(rememberScrollState())'
              assert s.count(old)==1,str(p)+': unexpected scroll containers'
              s=s.replace(old,'',1)
              if name=='Power':
                  old='Modifier.weight(1f, fill = false)'
                  assert s.count(old)==1
                  s=s.replace(old,'Modifier',1)
              s=s.replace('import androidx.compose.foundation.rememberScrollState\n','').replace('import androidx.compose.foundation.verticalScroll\n','')
              save(p,s)
          p=root/'DeviceBatchDialogAppearance.kt'
          assert git('hash-object',str(p))=='39b4f827558876b063f3a6e3333ce53bf627653e'
          s=p.read_text()
          start=s.index('@Composable internal fun DeviceBatchAlertDialog(')
          end=s.index('@Composable internal fun DeviceBatchNotice(',start)
          replacement='''@OptIn(ExperimentalLayoutApi::class)
          @Composable internal fun DeviceBatchAlertDialog(onDismissRequest:()->Unit,title:@Composable ()->Unit,
              text:@Composable ()->Unit,confirmButton:@Composable ()->Unit,dismissButton:@Composable ()->Unit) {
              Dialog(onDismissRequest=onDismissRequest,properties=DialogProperties(usePlatformDefaultWidth=false,decorFitsSystemWindows=false)) {
                  BoxWithConstraints(Modifier.fillMaxWidth().safeDrawingPadding().imePadding().padding(horizontal=12.dp,vertical=12.dp),contentAlignment=Alignment.Center) {
                      AppDialogSurface(modifier=Modifier.width(deviceBatchDialogWidth(maxWidth.value).dp).heightIn(max=maxHeight).testTag("device_batch_dialog")) {
                          Column(Modifier.padding(20.dp),verticalArrangement=Arrangement.spacedBy(16.dp)) {
                              Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Default.Devices,contentDescription=null,tint=MaterialTheme.colorScheme.primary,modifier=Modifier.size(22.dp))
                                  Box(Modifier.weight(1f)) { title() }
                              }
                              Box(Modifier.weight(1f,fill=false).fillMaxWidth().testTag("device_batch_dialog_body").verticalScroll(rememberScrollState())) {
                                  CompositionLocalProvider(LocalContentColor provides MaterialTheme.colorScheme.onSurface) {
                                      ProvideTextStyle(MaterialTheme.typography.bodyMedium) { text() }
                                  }
                              }
                              FlowRow(Modifier.fillMaxWidth().testTag("device_batch_dialog_actions"),horizontalArrangement=Arrangement.spacedBy(8.dp,Alignment.End),verticalArrangement=Arrangement.spacedBy(4.dp)) {
                                  dismissButton()
                                  confirmButton()
                              }
                          }
                      }
                  }
              }
          }
          '''
          s=s[:start]+replacement+s[end:]
          s=s.replace('import iecxiv.meshfabric.ui.components.AppAlertDialog','import iecxiv.meshfabric.ui.components.AppDialogSurface',1)
          s=s.replace('import androidx.compose.runtime.Composable','import androidx.compose.runtime.*',1)
          imports='''import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          '''
          s=s.replace('package iecxiv.meshfabric.ui.devices\n','package iecxiv.meshfabric.ui.devices\n'+imports,1)
          save(p,s)
          p=root/'DeviceBatchDialogSizing.kt'
          assert not p.exists()
          save(p,'''package iecxiv.meshfabric.ui.devices
          internal fun deviceBatchDialogWidth(available:Float):Float = when {
              available==Float.POSITIVE_INFINITY -> 640f
              !available.isFinite() -> 0f
              else -> available.coerceIn(0f,640f)
          }
          ''')
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/devices/DeviceBatchDialogSizingTest.kt')
          assert not p.exists()
          save(p,'''package iecxiv.meshfabric.ui.devices
          import org.junit.Assert.*
          import org.junit.Test
          class DeviceBatchDialogSizingTest {
              @Test fun phoneUsesAvailableWidth() { assertEquals(320f,deviceBatchDialogWidth(320f),0f) }
              @Test fun tabletIsCapped() { assertEquals(640f,deviceBatchDialogWidth(1000f),0f) }
              @Test fun narrowWindowDoesNotOverflow() { assertEquals(120f,deviceBatchDialogWidth(120f),0f) }
              @Test fun zeroIsSafe() { assertEquals(0f,deviceBatchDialogWidth(0f),0f) }
              @Test fun negativeIsSafe() { assertEquals(0f,deviceBatchDialogWidth(-20f),0f) }
              @Test fun nanIsSafe() { assertEquals(0f,deviceBatchDialogWidth(Float.NaN),0f) }
              @Test fun unboundedWidthHasLimit() { assertEquals(640f,deviceBatchDialogWidth(Float.POSITIVE_INFINITY),0f) }
              @Test fun negativeInfinityIsSafe() { assertEquals(0f,deviceBatchDialogWidth(Float.NEGATIVE_INFINITY),0f) }
          }
          ''')
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceBatchResponsiveDialogTest.kt')
          assert not p.exists()
          p.parent.mkdir(parents=True,exist_ok=True)
          save(p,'''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.semantics.SemanticsProperties
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.unit.dp
          import androidx.test.platform.app.InstrumentationRegistry
          import org.junit.Rule
          import org.junit.Test
          import org.junit.Assert.*
          class DeviceBatchResponsiveDialogTest {
              @get:Rule val compose=createComposeRule()
              private fun render(rows:()->Int) {
                  compose.setContent {
                      MaterialTheme {
                          Box(Modifier.fillMaxSize().testTag("batch_test_host")) {
                              DeviceBatchAlertDialog(onDismissRequest={},title={DeviceBatchDialogTitle("Test")},
                                  text={Column(Modifier.fillMaxWidth()) { repeat(rows()) { index -> Text("Row $index",Modifier.padding(vertical=6.dp).testTag("batch_row_$index")) } }},
                                  confirmButton={TextButton(onClick={},modifier=Modifier.testTag("batch_test_confirm")) {Text("Confirm")}},
                                  dismissButton={TextButton(onClick={},modifier=Modifier.testTag("batch_test_close")) {Text("Close")}})
                          }
                      }
                  }
                  compose.waitForIdle()
              }
              private fun scrollLimit():Float = compose.onNodeWithTag("device_batch_dialog_body",useUnmergedTree=true).fetchSemanticsNode().config[SemanticsProperties.VerticalScrollAxisRange].maxValue()
              @Test fun shortContentDoesNotNeedScroll() {
                  render { 1 }
                  assertEquals(0f,scrollLimit(),1f)
                  compose.onNodeWithTag("batch_test_confirm").assertIsDisplayed()
                  compose.onNodeWithTag("batch_test_close").assertIsDisplayed()
              }
              @Test fun longContentScrollsButButtonsStayVisible() {
                  render { 80 }
                  assertTrue(scrollLimit()>0f)
                  compose.onNodeWithTag("batch_test_confirm").assertIsDisplayed()
                  compose.onNodeWithTag("batch_row_79").performScrollTo().assertIsDisplayed()
                  compose.onNodeWithTag("batch_test_close").assertIsDisplayed()
                  compose.onNodeWithTag("batch_test_confirm").assertIsDisplayed()
              }
              @Test fun heightGrowsWithContent() {
                  var count by mutableIntStateOf(1)
                  render { count }
                  val short=compose.onNodeWithTag("device_batch_dialog").fetchSemanticsNode().boundsInRoot.height
                  compose.runOnIdle { count=3 };compose.waitForIdle()
                  val taller=compose.onNodeWithTag("device_batch_dialog").fetchSemanticsNode().boundsInRoot.height
                  assertTrue(taller>short)
              }
              @Test fun widthRespectsScreenAndTabletLimit() {
                  render { 1 }
                  val host=compose.onNodeWithTag("batch_test_host").fetchSemanticsNode().boundsInRoot.width
                  val width=compose.onNodeWithTag("device_batch_dialog").fetchSemanticsNode().boundsInRoot.width
                  val density=InstrumentationRegistry.getInstrumentation().targetContext.resources.displayMetrics.density
                  assertTrue(width<=640f*density+1f)
                  assertTrue(width<=host-24f*density+1f)
              }
          }
          ''')
          Path('/tmp/adaptive-dialog-paths.txt').write_text('\n'.join(changed))
          assert set(git('diff','--name-only').splitlines())==set(changed[:10])
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build, compile UI tests, run unit tests and lint
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/adaptive-dialog-build.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-dialog-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/adaptive-dialog-build.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Verify and publish; retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,os
          import xml.etree.ElementTree as ET
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          log=(Path(os.environ['RUNNER_TEMP'])/'adaptive-dialog-build.txt').read_text()
          assert not any('AppearanceSelectorLayoutTest.kt' in line and 'deprecated' in line.lower() for line in log.splitlines())
          cases=[c for p in Path('app/build/test-results').rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase') if c.get('classname')=='iecxiv.meshfabric.ui.devices.DeviceBatchDialogSizingTest']
          assert len(cases)==8 and not any(c.find(x) is not None for c in cases for x in ['failure','error','skipped'])
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow=Path('.github/workflows/adaptive-batch-dialogs.yml');workflow.unlink()
          paths=Path('/tmp/adaptive-dialog-paths.txt').read_text().splitlines()+[str(workflow)]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(ui): migrate appearance tests to v2 and adapt batch dialogs to content'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
