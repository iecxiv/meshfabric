name: Validate explicit View activity navigation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/view-activity-navigation.yml']
permissions:
  contents: write
concurrency:
  group: view-activity-navigation-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare navigation-only correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          home=root/'MeshFabricHome.kt'
          log=root/'LogScreen.kt'
          assert git('hash-object',str(home))=='4649aac79301252ebdff71b698b6ab2f5f1cdcd9'
          assert git('hash-object',str(log))=='546870db83284cda80112c8026059f0450c70f27'
          def apply(path,pairs):
              original=path.read_text()
              text=original
              for old,new in pairs:
                  assert text.count(old)==1,(str(path),old)
                  text=text.replace(old,new,1)
              path.write_text(text)
          apply(home,[
              ('    var page by rememberSaveable { mutableIntStateOf(0) }','    var page by rememberSaveable { mutableIntStateOf(0) }\n    var openActivity by rememberSaveable { mutableStateOf(false) }'),
              ('actionsReady=state.ready,actionsStatus=state.status,onReconnect=management::connect,onOpenSettings=onOpenSettings)','actionsReady=state.ready,actionsStatus=state.status,onReconnect=management::connect,onOpenSettings=onOpenSettings,openActivity=openActivity,onActivityOpened={openActivity=false})'),
              ('if(result==SnackbarResult.ActionPerformed) page=1','if(result==SnackbarResult.ActionPerformed) {openActivity=true;page=1}')
          ])
          apply(log,[
              ('onReconnect:()->Unit,onOpenSettings:()->Unit) {','onReconnect:()->Unit,onOpenSettings:()->Unit,openActivity:Boolean=false,onActivityOpened:()->Unit={}) {'),
              ('    var tab by rememberSaveable {mutableIntStateOf(1)}','    var tab by rememberSaveable {mutableIntStateOf(if(openActivity) 0 else 1)}\n    LaunchedEffect(openActivity) {if(openActivity) {tab=0;onActivityOpened()}}')
          ])
          assert set(git('diff','--name-only').splitlines())=={str(home),str(log)}
          assert 'if(selected==0) MeshFabricActivityScreen' in log.read_text()
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: view-activity-navigation-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated navigation fix and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/view-activity-navigation.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt','app/src/main/java/iecxiv/meshfabric/ui/management/LogScreen.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(log): open Activity explicitly from action feedback link'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
