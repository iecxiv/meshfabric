name: Integrate appearance and toolbar on dev
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/integrate-appearance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-appearance-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare guarded candidate
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          from xml.sax.saxutils import escape
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='47986d8dc1ddc1a7e992be215eca15bcf3252dd1'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/integrate-appearance.yml'
          root=Path('app/src/main/java/iecxiv/meshfabric')
          def replace(path,old,new):
              text=path.read_text()
              assert text.count(old)==1, str(path)+': unexpected source'
              path.write_text(text.replace(old,new,1))
          replace(root/'ui/theme/Theme.kt','val darkTheme = resolveAppDarkTheme(themeMode, isSystemInDarkTheme())','val systemDark = isSystemInDarkTheme()\n    val darkTheme = automaticAppearanceDark(resolveAppDarkTheme(themeMode, systemDark), systemDark)')
          p=root/'ui/settings/SettingsScreen.kt'
          s=p.read_text()
          start=s.index('                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        CompactThemeOption(')
          end=s.index('\n                }\n            }\n\n            // Section 4:',start)
          assert s[start:end].count('CompactThemeOption(')==3
          s=s[:start]+'                    iecxiv.meshfabric.ui.theme.AppearanceModeSettings(themeMode, viewModel::setThemeMode)'+s[end:]
          p.write_text(s.replace('R.string.settings_app_theme_title','R.string.appearance_mode'))
          p=root/'ui/desktop/DesktopRightClickAssist.kt'
          s=p.read_text()
          start=s.index('    OutlinedButton(onClick = state::toggleVisible,')
          end=s.index('        DesktopRightClickHeaderGlyph(state.latch.visible, label, iconSize = 20.dp)',start)
          p.write_text(s[:start]+'    IconButton(onClick = state::toggleVisible, modifier = Modifier.size(32.dp).semantics { selected = state.latch.visible }) {\n'+s[end:])
          p=root/'ui/desktop/RemoteDesktopScreen.kt'
          replace(p,'                            DesktopRightClickAssistToolbar(rightClickAssist)\n','')
          anchor='                            Surface(modifier = Modifier.size(controlsSlot), shape = RoundedCornerShape(10.dp), color = Color.Transparent) {'
          replace(p,anchor,'                            DesktopRightClickAssistToolbar(rightClickAssist)\n'+anchor)
          replace(p,'Icon(Icons.Default.Info, contentDescription = stringResource(R.string.desktop_gestures_title), modifier = Modifier.size(18.dp), tint = Color(0xFF9E9E9E))','Icon(Icons.Default.Info, contentDescription = stringResource(R.string.desktop_gestures_title), modifier = Modifier.size(24.dp), tint = Color(0xFF9E9E9E))')
          assert 'Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(0.dp))' in p.read_text()
          p=root/'ui/theme/AutomaticAppearance.kt'
          assert not p.exists()
          p.write_text(r'''package iecxiv.meshfabric.ui.theme

          import android.app.TimePickerDialog
          import android.content.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import androidx.lifecycle.repeatOnLifecycle
          import iecxiv.meshfabric.R
          import iecxiv.meshfabric.ui.components.AppAlertDialog
          import kotlinx.coroutines.delay
          import java.text.Normalizer
          import java.time.*
          import java.time.format.DateTimeFormatter
          import java.util.Locale
          import kotlin.math.*

          internal data class SolarCity(val id:String,val name:String,val latitude:Double,val longitude:Double,val zone:String)
          internal val solarCities = """madrid|Madrid|40.4168|-3.7038|Europe/Madrid
          barcelona|Barcelona|41.3874|2.1686|Europe/Madrid
          canarias|Las Palmas de Gran Canaria|28.1235|-15.4363|Atlantic/Canary
          lisbon|Lisboa|38.7223|-9.1393|Europe/Lisbon
          london|London|51.5074|-0.1278|Europe/London
          paris|Paris|48.8566|2.3522|Europe/Paris
          berlin|Berlin|52.52|13.405|Europe/Berlin
          rome|Roma|41.9028|12.4964|Europe/Rome
          helsinki|Helsinki|60.1699|24.9384|Europe/Helsinki
          tromso|Tromso|69.6492|18.9553|Europe/Oslo
          newyork|New York|40.7128|-74.006|America/New_York
          losangeles|Los Angeles|34.0522|-118.2437|America/Los_Angeles
          mexico|Ciudad de Mexico|19.4326|-99.1332|America/Mexico_City
          bogota|Bogota|4.711|-74.0721|America/Bogota
          lima|Lima|-12.0464|-77.0428|America/Lima
          santiago|Santiago|-33.4489|-70.6693|America/Santiago
          buenosaires|Buenos Aires|-34.6037|-58.3816|America/Argentina/Buenos_Aires
          saopaulo|Sao Paulo|-23.5505|-46.6333|America/Sao_Paulo
          tokyo|Tokyo|35.6762|139.6503|Asia/Tokyo
          delhi|New Delhi|28.6139|77.209|Asia/Kolkata
          singapore|Singapore|1.3521|103.8198|Asia/Singapore
          sydney|Sydney|-33.8688|151.2093|Australia/Sydney
          auckland|Auckland|-36.8485|174.7633|Pacific/Auckland
          capetown|Cape Town|-33.9249|18.4241|Africa/Johannesburg""".lines().map { line ->
              val v=line.trim().split('|'); SolarCity(v[0],v[1],v[2].toDouble(),v[3].toDouble(),v[4])
          }
          internal fun scheduledAppearanceDark(minute:Int,light:Int,dark:Int):Boolean? {
              if(minute !in 0..1439 || light !in 0..1439 || dark !in 0..1439 || light==dark) return null
              return !(if(light<dark) minute>=light && minute<dark else minute>=light || minute<dark)
          }
          internal data class SolarWindow(val sunrise:Instant,val sunset:Instant)
          // NOAA solar equations, standard apparent horizon of 90.833 degrees.
          // https://gml.noaa.gov/grad/solcalc/calcdetails.html
          internal fun solarWindow(date:LocalDate,city:SolarCity):SolarWindow? {
              if(!city.latitude.isFinite() || !city.longitude.isFinite() || city.latitude !in -90.0..90.0 || city.longitude !in -180.0..180.0) return null
              fun rad(v:Double)=Math.toRadians(v)
              fun deg(v:Double)=Math.toDegrees(v)
              val midnight=date.atStartOfDay(ZoneOffset.UTC).toInstant()
              val jd=midnight.epochSecond/86400.0+2440587.5
              fun position(minutes:Double):Pair<Double,Double> {
                  val t=(jd+minutes/1440.0-2451545.0)/36525.0
                  val l=((280.46646+t*(36000.76983+t*0.0003032))%360+360)%360
                  val m=357.52911+t*(35999.05029-0.0001537*t)
                  val e=0.016708634-t*(0.000042037+0.0000001267*t)
                  val c=sin(rad(m))*(1.914602-t*(0.004817+0.000014*t))+sin(rad(2*m))*(0.019993-0.000101*t)+sin(rad(3*m))*0.000289
                  val omega=125.04-1934.136*t
                  val lambda=l+c-0.00569-0.00478*sin(rad(omega))
                  val epsilon=23.0+(26.0+(21.448-t*(46.815+t*(0.00059-t*0.001813)))/60.0)/60.0+0.00256*cos(rad(omega))
                  val dec=asin(sin(rad(epsilon))*sin(rad(lambda)))
                  val y=tan(rad(epsilon)/2).pow(2)
                  val eq=4*deg(y*sin(2*rad(l))-2*e*sin(rad(m))+4*e*y*sin(rad(m))*cos(2*rad(l))-0.5*y*y*sin(4*rad(l))-1.25*e*e*sin(2*rad(m)))
                  return eq to dec
              }
              fun event(rise:Boolean):Double? {
                  var minutes=720-4*city.longitude
                  repeat(3) {
                      val (eq,dec)=position(minutes)
                      val cosine=(cos(rad(90.833))-sin(rad(city.latitude))*sin(dec))/(cos(rad(city.latitude))*cos(dec))
                      if(!cosine.isFinite() || cosine !in -1.0..1.0) return null
                      minutes=720-4*city.longitude-eq+(if(rise) -4 else 4)*deg(acos(cosine))
                  }
                  return minutes
              }
              val rise=event(true) ?: return null
              val set=event(false) ?: return null
              return SolarWindow(midnight.plusMillis((rise*60000).roundToLong()),midnight.plusMillis((set*60000).roundToLong()))
          }
          internal fun solarAppearanceDark(now:Instant,city:SolarCity):Boolean? {
              val zone=runCatching { ZoneId.of(city.zone) }.getOrNull() ?: return null
              val window=solarWindow(now.atZone(zone).toLocalDate(),city) ?: return null
              return now<window.sunrise || now>=window.sunset
          }
          internal data class AppearanceOptions(val mode:String="",val light:Int=420,val dark:Int=1200,val cityId:String="")
          private fun appearancePrefs(context:Context)=context.applicationContext.getSharedPreferences("automatic_appearance",Context.MODE_PRIVATE)
          private fun readAppearance(p:SharedPreferences)=AppearanceOptions(p.getString("mode","").orEmpty(),p.getInt("light",420),p.getInt("dark",1200),p.getString("city","").orEmpty())
          @Composable private fun rememberAppearanceOptions():AppearanceOptions {
              val context=LocalContext.current
              val prefs=remember(context) { appearancePrefs(context) }
              var options by remember(prefs) { mutableStateOf(readAppearance(prefs)) }
              DisposableEffect(prefs) {
                  val listener=SharedPreferences.OnSharedPreferenceChangeListener { _,_ -> options=readAppearance(prefs) }
                  prefs.registerOnSharedPreferenceChangeListener(listener); options=readAppearance(prefs)
                  onDispose { prefs.unregisterOnSharedPreferenceChangeListener(listener) }
              }
              return options
          }
          @Composable private fun rememberAppearanceNow():Instant {
              val context=LocalContext.current
              val owner=LocalLifecycleOwner.current
              var millis by remember { mutableLongStateOf(System.currentTimeMillis()) }
              DisposableEffect(context) {
                  val receiver=object:BroadcastReceiver() {
                      override fun onReceive(context:Context?,intent:Intent?) { millis=System.currentTimeMillis() }
                  }
                  val filter=IntentFilter().apply { addAction(Intent.ACTION_TIME_CHANGED);addAction(Intent.ACTION_TIMEZONE_CHANGED);addAction(Intent.ACTION_DATE_CHANGED) }
                  ContextCompat.registerReceiver(context,receiver,filter,ContextCompat.RECEIVER_NOT_EXPORTED)
                  onDispose { context.unregisterReceiver(receiver) }
              }
              LaunchedEffect(owner) {
                  owner.lifecycle.repeatOnLifecycle(Lifecycle.State.STARTED) {
                      while(true) { millis=System.currentTimeMillis();delay((60000L-millis%60000L).coerceAtLeast(1L)) }
                  }
              }
              return Instant.ofEpochMilli(millis)
          }
          @Composable internal fun automaticAppearanceDark(manualDark:Boolean,systemDark:Boolean):Boolean {
              val options=rememberAppearanceOptions()
              if(options.mode!="scheduled" && options.mode!="solar") return manualDark
              val now=rememberAppearanceNow()
              return if(options.mode=="scheduled") {
                  val local=now.atZone(ZoneId.systemDefault())
                  scheduledAppearanceDark(local.hour*60+local.minute,options.light,options.dark) ?: systemDark
              } else solarCities.firstOrNull { it.id==options.cityId }?.let { solarAppearanceDark(now,it) } ?: systemDark
          }
          private fun appearanceSearch(value:String)=Normalizer.normalize(value,Normalizer.Form.NFD).replace(Regex("\\p{M}+"),"").lowercase(Locale.ROOT)
          @Composable internal fun AppearanceModeSettings(mode:AppThemeMode,onMode:(AppThemeMode)->Unit) {
              val context=LocalContext.current
              val prefs=remember(context) { appearancePrefs(context) }
              val options=rememberAppearanceOptions()
              val now=rememberAppearanceNow()
              var expanded by remember { mutableStateOf(false) }
              var choosingCity by remember { mutableStateOf(false) }
              var query by remember { mutableStateOf("") }
              val labels=listOf(stringResource(R.string.theme_system),stringResource(R.string.theme_light),stringResource(R.string.theme_dark),stringResource(R.string.appearance_scheduled),stringResource(R.string.appearance_solar))
              val selected=when(options.mode) { "scheduled"->3;"solar"->4;else->when(mode) { AppThemeMode.SYSTEM->0;AppThemeMode.LIGHT->1;AppThemeMode.DARK->2 } }
              Box {
                  OutlinedButton(onClick={expanded=true},modifier=Modifier.fillMaxWidth()) { Text(labels[selected]) }
                  DropdownMenu(expanded=expanded,onDismissRequest={expanded=false}) {
                      labels.forEachIndexed { index,label ->
                          DropdownMenuItem(text={Text(label)},trailingIcon={RadioButton(selected==index,onClick=null)},onClick={
                              if(index<3) onMode(listOf(AppThemeMode.SYSTEM,AppThemeMode.LIGHT,AppThemeMode.DARK)[index])
                              prefs.edit().putString("mode",when(index) {3->"scheduled";4->"solar";else->""}).apply();expanded=false
                          })
                      }
                  }
              }
              if(selected==3) {
                  for(isLight in listOf(true,false)) {
                      val minutes=(if(isLight) options.light else options.dark).coerceIn(0,1439)
                      val label=stringResource(if(isLight) R.string.appearance_light_at else R.string.appearance_dark_at)
                      OutlinedButton(onClick={
                          TimePickerDialog(context,{_,hour,minute->
                              val value=hour*60+minute
                              if(value!=(if(isLight) options.dark else options.light)) prefs.edit().putInt(if(isLight) "light" else "dark",value).apply()
                          },minutes/60,minutes%60,android.text.format.DateFormat.is24HourFormat(context)).show()
                      },modifier=Modifier.fillMaxWidth()) { Text(label+": "+String.format(Locale.ROOT,"%02d:%02d",minutes/60,minutes%60)) }
                  }
                  Text(stringResource(R.string.appearance_schedule_note),style=MaterialTheme.typography.bodySmall)
              }
              if(selected==4) {
                  val city=solarCities.firstOrNull { it.id==options.cityId }
                  OutlinedButton(onClick={query="";choosingCity=true},modifier=Modifier.fillMaxWidth()) { Text(city?.name ?: stringResource(R.string.appearance_choose_city)) }
                  Text(stringResource(R.string.appearance_solar_note),style=MaterialTheme.typography.bodySmall)
                  if(city==null) Text(stringResource(R.string.appearance_missing_city),style=MaterialTheme.typography.bodySmall)
                  else {
                      val zone=ZoneId.of(city.zone)
                      val window=solarWindow(now.atZone(zone).toLocalDate(),city)
                      if(window==null) Text(stringResource(R.string.appearance_no_sun),style=MaterialTheme.typography.bodySmall)
                      else {
                          val fmt=DateTimeFormatter.ofPattern("HH:mm").withZone(zone)
                          Text(stringResource(R.string.appearance_solar_times,fmt.format(window.sunrise),fmt.format(window.sunset),city.zone),style=MaterialTheme.typography.bodySmall)
                      }
                  }
              }
              if(choosingCity) AppAlertDialog(onDismissRequest={choosingCity=false},
                  title={Text(stringResource(R.string.appearance_choose_city),fontWeight=FontWeight.Bold,fontSize=18.sp)},
                  text={Column(verticalArrangement=Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(query,{query=it},singleLine=true,label={Text(stringResource(R.string.appearance_city_search))},modifier=Modifier.fillMaxWidth())
                      val cities=solarCities.filter { appearanceSearch(it.name).contains(appearanceSearch(query)) }
                      if(cities.isEmpty()) Text(stringResource(R.string.appearance_no_cities))
                      LazyColumn(Modifier.fillMaxWidth().heightIn(max=280.dp)) {
                          items(cities,key={it.id}) { city -> TextButton(onClick={prefs.edit().putString("city",city.id).apply();choosingCity=false},modifier=Modifier.fillMaxWidth()) { Text(city.name) } }
                      }
                  }},confirmButton={TextButton(onClick={choosingCity=false}) {Text(stringResource(R.string.close))}})
          }
          ''')
          rows='''appearance_mode|Appearance mode|Modo de apariencia
          appearance_scheduled|Scheduled|Programado
          appearance_solar|Automatic solar|Automático solar
          appearance_light_at|Activate light mode at|Activar modo claro a las
          appearance_dark_at|Activate dark mode at|Activar modo oscuro a las
          appearance_schedule_note|Uses device local time. Times must differ; an identical time is not saved.|Usa la hora local del dispositivo. Las horas deben ser distintas; una hora idéntica no se guarda.
          appearance_choose_city|Choose reference city|Elegir ciudad de referencia
          appearance_city_search|Search available cities|Buscar ciudades disponibles
          appearance_no_cities|No matching city in the local catalogue.|Ninguna ciudad coincide en el catálogo local.
          appearance_solar_note|Light at sunrise, dark at sunset. Manual city, no GPS or location permissions. Change city when travelling. Approximate times.|Claro al amanecer y oscuro al anochecer. Ciudad manual, sin GPS ni permisos de ubicación. Cambia la ciudad si viajas. Horarios aproximados.
          appearance_missing_city|Choose a city. Until then, system mode is used.|Elige una ciudad. Mientras tanto se usa el modo del sistema.
          appearance_no_sun|No sunrise or sunset today for this city. Using system mode for now.|Hoy no hay amanecer o anochecer para esta ciudad. Por ahora se usa el modo del sistema.
          appearance_solar_times|Today: sunrise %1$s · sunset %2$s (%3$s).|Hoy: amanecer %1$s · anochecer %2$s (%3$s).'''
          for directory,index in [('values',1),('values-en',1),('values-es',2)]:
              p=Path('app/src/main/res')/directory/'automatic_appearance.xml'
              assert not p.exists()
              strings=[line.split('|') for line in rows.splitlines()]
              p.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'+''.join('    <string name="'+v[0]+'">'+escape(v[index])+'</string>\n' for v in strings)+'</resources>\n')
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/theme/AutomaticAppearancePolicyTest.kt')
          assert not p.exists()
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''package iecxiv.meshfabric.ui.theme
          import java.time.*
          import org.junit.Assert.*
          import org.junit.Test
          class AutomaticAppearancePolicyTest {
              @Test fun dayBoundaries() {
                  assertEquals(false,scheduledAppearanceDark(420,420,1200));assertEquals(true,scheduledAppearanceDark(1200,420,1200));assertEquals(true,scheduledAppearanceDark(419,420,1200))
              }
              @Test fun overnightInterval() {
                  assertEquals(false,scheduledAppearanceDark(60,1200,420));assertEquals(true,scheduledAppearanceDark(600,1200,420))
              }
              @Test fun invalidSchedulesFallback() {
                  assertNull(scheduledAppearanceDark(0,420,420));assertNull(scheduledAppearanceDark(0,-1,1200));assertNull(scheduledAppearanceDark(1440,420,1200))
              }
              @Test fun madridSummerReference() {
                  val city=solarCities.first { it.id=="madrid" }
                  val w=solarWindow(LocalDate.of(2026,6,21),city)!!
                  val zone=ZoneId.of(city.zone)
                  assertEquals(6,w.sunrise.atZone(zone).hour);assertTrue(w.sunrise.atZone(zone).minute in 35..55)
                  assertEquals(21,w.sunset.atZone(zone).hour);assertTrue(w.sunset.atZone(zone).minute in 35..59)
                  assertEquals(false,solarAppearanceDark(Instant.parse("2026-06-21T12:00:00Z"),city))
                  assertEquals(true,solarAppearanceDark(Instant.parse("2026-06-21T00:00:00Z"),city))
              }
              @Test fun polarFallback() {
                  val city=solarCities.first { it.id=="tromso" }
                  assertNull(solarWindow(LocalDate.of(2026,6,21),city));assertNull(solarWindow(LocalDate.of(2026,12,21),city))
              }
              @Test fun internationalDatesAndBoundaries() {
                  for(city in solarCities) {
                      val date=LocalDate.of(2026,3,20);val w=solarWindow(date,city)!!;val zone=ZoneId.of(city.zone)
                      assertEquals(date,w.sunrise.atZone(zone).toLocalDate());assertEquals(date,w.sunset.atZone(zone).toLocalDate())
                      assertTrue(Duration.between(w.sunrise,w.sunset).toHours() in 10L..14L)
                      assertEquals(false,solarAppearanceDark(w.sunrise,city));assertEquals(true,solarAppearanceDark(w.sunset,city))
                  }
              }
              @Test fun invalidCityFallback() {
                  val city=solarCities.first()
                  assertNull(solarWindow(LocalDate.of(2026,1,1),city.copy(latitude=Double.NaN)))
                  assertNull(solarAppearanceDark(Instant.EPOCH,city.copy(zone="invalid")))
              }
              @Test fun catalogueIntegrity() {
                  assertEquals(24,solarCities.size);assertEquals(solarCities.size,solarCities.map {it.id}.toSet().size)
                  for(city in solarCities) assertNotNull(ZoneId.of(city.zone))
              }
          }
          ''')
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build, compile UI tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated candidate and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          cases=[c for p in Path('app/build/test-results').rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase') if c.get('classname')=='iecxiv.meshfabric.ui.theme.AutomaticAppearancePolicyTest']
          assert len(cases)==8 and not any(c.find(x) is not None for c in cases for x in ['failure','error','skipped'])
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow=Path('.github/workflows/integrate-appearance.yml');workflow.unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/theme/AutomaticAppearance.kt','app/src/main/java/iecxiv/meshfabric/ui/theme/Theme.kt','app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopRightClickAssist.kt','app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt','app/src/test/java/iecxiv/meshfabric/ui/theme/AutomaticAppearancePolicyTest.kt']+[f'app/src/main/res/{d}/automatic_appearance.xml' for d in ['values','values-en','values-es']]+[str(workflow)]
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(settings): add scheduled solar appearance and refine desktop toolbar'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
