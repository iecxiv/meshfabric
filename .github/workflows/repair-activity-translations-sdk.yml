name: Repair SDK and validate activity translations
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/repair-activity-translations-sdk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: activity-translations-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK and command-line tools
        uses: android-actions/setup-android@v3
      - name: Verify sdkmanager and install SDK packages
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Apply unchanged translation preparation with repair-base guard
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='5fde6ca89e4316ba997cfdf3fc9050ceeaa676b1', 'Repair base changed; review required'
          path=Path('.github/workflows/publish-activity-translations.yml')
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()=='041819b33d22f6f97fc1ce20699d5030c3a4afc2', 'Original translation preparation changed'
          source=path.read_text()
          section=source.split('      - name: Prepare localized source and translation inventory\n',1)[1]
          section=section.split('        run: |\n',1)[1].split('      - name: Install SDK\n',1)[0]
          code=textwrap.dedent(section)
          lines=code.splitlines(keepends=True)
          guards=[line for line in lines if line.startswith('assert subprocess.check_output(') and 'Preparation base changed' in line]
          assert len(guards)==1, 'Expected exactly one original preparation-base guard'
          code=code.replace(guards[0],'',1)
          exec(compile(code,'approved-translation-preparation','exec'),{'__name__':'__main__'})
      - name: Build, all unit tests, instrumented compilation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Entire instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify complete evidence
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in ['app/build/test-results','app/build/outputs/androidTest-results']:
              cases=[c for p in Path(root).rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              assert cases,root
              assert not any(c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None for c in cases),root
              if 'androidTest' in root:
                  assert {c.get('name') for c in cases if c.get('classname','').endswith('.ActivityTranslationUiTest')}=={'englishLight','englishDark','spanishLight','spanishDark'}
      - name: Summarize test failures without requiring full logs
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          lines=[]
          for root in ['app/build/test-results','app/build/outputs/androidTest-results']:
              for p in Path(root).rglob('*.xml'):
                  for case in ET.parse(p).getroot().iter('testcase'):
                      for tag in ['failure','error']:
                          failure=case.find(tag)
                          if failure is not None:
                              lines.append(case.get('classname','')+'.'+case.get('name','')+'\n'+failure.get('message','')+'\n'+(failure.text or '')[:6000])
          Path('validation').mkdir(exist_ok=True)
          body='\n\n'.join(lines) or 'No failing test XML found. This does not establish that all validation steps ran or passed.'
          Path('validation/test-failures.txt').write_text(body)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Test failure details\n\n```text\n'+body[:40000]+'\n```\n')
      - name: Upload reports and translation inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-translations-sdk-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish only validated changes to unchanged dev
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev advanced; refusing publication'; exit 1; }
          python3 - <<'PY'
          import json,subprocess
          expected=set(json.load(open('validation/changed-files.json')))
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): localize activity and related action feedback in English and Spanish'
          git push origin HEAD:dev
