name: Validate logout preferences and permanent CI
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/validate-logout-preferences.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: logout-preferences-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare regressions and stage correction outside the working tree
        shell: python
        run: |
          from pathlib import Path
          import os, re, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='6a2a561597f88901509e6088be96aa9fa9ce3017','Base advanced'
          source='app/src/main/java/iecxiv/meshfabric/data/local/SessionManager.kt'
          tests='app/src/androidTest/java/iecxiv/meshfabric/data/local/SessionStorageSafetyTest.kt'
          for path,sha in {source:'f33eca062fe4daf6c7b4f642b8253fc2ebc96e73',tests:'af955c81df270c0e528380463047f1c51c8bec15','.github/workflows/android-ci.yml':'f5336560753e4981b371cea817825426cb84f421'}.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          root=Path(os.environ['RUNNER_TEMP'])/'logout-preferences';root.mkdir(exist_ok=True)
          p=Path(source);original=p.read_text();a=original.index('    fun clearSession() {');b=original.index('    fun saveDesktopSettings(',a)
          replacement='''    fun clearSession() {
                  val desktop = getDesktopSettings()
                  val barCollapsed = isDesktopBarCollapsed()
                  val keepTerminalBuffers = isSaveTerminalBuffersEnabled()
                  val editor = prefs.edit().clear()
                      .putBoolean(KEY_SAVE_TERMINAL_BUFFERS, keepTerminalBuffers)
                      .putBoolean("only_online_devices", _onlyOnlineDevicesFlow.value)
                      .putBoolean("hide_device_network_info", _hideDeviceNetworkInfoFlow.value)
                      .putString(KEY_CUSTOM_APP_NAME, _appNameFlow.value)
                      .putString(KEY_THEME_MODE, _themeModeFlow.value.name)
                      .putBoolean(KEY_HIDE_SETTINGS_ICON, _hideSettingsIconFlow.value)
                      .putInt(KEY_DESKTOP_QUALITY, desktop.quality)
                      .putInt(KEY_DESKTOP_SCALE, desktop.scale)
                      .putString(KEY_DESKTOP_FPS, desktop.frameRate.name)
                      .putString(KEY_DESKTOP_ENCODING, desktop.encoding.name)
                      .putBoolean(KEY_DESKTOP_SWAP_MOUSE, desktop.swapMouseButtons)
                      .putBoolean(KEY_DESKTOP_REVERSE_WHEEL, desktop.reverseMouseWheel)
                      .putBoolean(KEY_DESKTOP_REMOTE_KBD, desktop.useRemoteKeyboardMap)
                      .putBoolean(KEY_DESKTOP_AUTO_CLIPBOARD, false)
                      .putBoolean(KEY_DESKTOP_LOCK_DISCONNECT, desktop.lockOnDisconnect)
                      .putBoolean(KEY_DESKTOP_BAR_COLLAPSED, barCollapsed)
                  _customIconPathFlow.value?.let { editor.putString(KEY_CUSTOM_ICON_PATH, it) }
                  editor.apply()
              }

          '''
          (root/'SessionManager.kt').write_text(original[:a]+replacement+original[b:])
          p=Path(tests);text=p.read_text();assert len(re.findall(r'@Test\b',text))==3
          anchor='import iecxiv.meshfabric.R\n';assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'import iecxiv.meshfabric.data.remote.DesktopEncoding\nimport iecxiv.meshfabric.data.remote.FrameRateOption\nimport iecxiv.meshfabric.ui.theme.AppThemeMode\n',1)
          addition=r'''
              private fun withStorage(body:(SessionManager,android.content.SharedPreferences)->Unit) {
                  val manager=SessionManager(context)
                  val field=SessionManager::class.java.getDeclaredField("prefs");field.isAccessible=true
                  val prefs=field.get(manager) as android.content.SharedPreferences
                  val saved=prefs.all.mapValues {(_,value)->if(value is Set<*>) value.toSet() else value}
                  try {body(manager,prefs)} finally {
                      val editor=prefs.edit().clear()
                      for((key,value) in saved) when(value) {
                          is String -> editor.putString(key,value)
                          is Boolean -> editor.putBoolean(key,value)
                          is Int -> editor.putInt(key,value)
                          is Long -> editor.putLong(key,value)
                          is Float -> editor.putFloat(key,value)
                          is Set<*> -> editor.putStringSet(key,value.map {it as String}.toSet())
                          null -> editor.remove(key)
                          else -> error("Unsupported preference type")
                      }
                      assertTrue(editor.commit())
                  }
              }
              @Test fun logoutPreservesDesktopSettingsExceptAutomaticClipboard() = withStorage {manager,_ ->
                  val settings=manager.getDesktopSettings().copy(quality=76,scale=1536,frameRate=FrameRateOption.SLOW,encoding=DesktopEncoding.PNG,swapMouseButtons=true,reverseMouseWheel=true,useRemoteKeyboardMap=true,autoClipboard=true,lockOnDisconnect=true)
                  manager.saveDesktopSettings(settings);manager.saveDesktopBarCollapsed(true);manager.clearSession()
                  val expected=settings.copy(autoClipboard=false)
                  assertEquals(expected,manager.getDesktopSettings());assertTrue(manager.isDesktopBarCollapsed())
                  val restarted=SessionManager(context)
                  assertEquals(expected,restarted.getDesktopSettings());assertTrue(restarted.isDesktopBarCollapsed())
              }
              @Test fun logoutClearsAccountDataAndPreservesGeneralPreferences() = withStorage {manager,prefs ->
                  manager.saveCustomAppName("Logout regression");manager.saveThemeMode(AppThemeMode.values().last())
                  manager.saveHideSettingsIcon(true);manager.saveOnlyOnlineDevices(true);manager.saveHideDeviceNetworkInfo(true);manager.saveTerminalBuffersSetting(true)
                  manager.saveCollapsedGroups(setOf("mesh//private"));manager.saveAllGroupsExpandedState(false)
                  prefs.edit().putString("server_url","https://example.invalid").putString("username","fixture-user").putString("auth_cookie","fixture-cookie").putBoolean("ignore_ssl",true).putBoolean("is_remembered",true).putString("unknown_account_state","fixture").apply()
                  assertTrue(prefs.contains("auth_cookie"));manager.clearSession()
                  assertTrue(prefs.all.keys.none {it in setOf("server_url","username","auth_cookie","ignore_ssl","is_remembered","collapsed_groups","all_groups_expanded","unknown_account_state")})
                  val restarted=SessionManager(context)
                  assertNull(manager.getSession());assertNull(restarted.getSession());assertTrue(restarted.getCollapsedGroups().isEmpty());assertTrue(restarted.isAllGroupsExpanded())
                  for(current in listOf(manager,restarted)) {
                      assertEquals("Logout regression",current.appNameFlow.value);assertEquals(AppThemeMode.values().last(),current.themeModeFlow.value)
                      assertTrue(current.hideSettingsIconFlow.value);assertTrue(current.onlyOnlineDevicesFlow.value);assertTrue(current.hideDeviceNetworkInfoFlow.value)
                      assertTrue(current.saveTerminalBuffersFlow.value);assertTrue(current.isSaveTerminalBuffersEnabled())
                      assertEquals(manager.customIconPathFlow.value,current.customIconPathFlow.value)
                  }
              }
              @Test fun repeatedLogoutKeepsDesktopPreferencesAndClipboardDisabled() = withStorage {manager,_ ->
                  manager.saveDesktopSettings(manager.getDesktopSettings().copy(quality=79,autoClipboard=true))
                  manager.saveDesktopBarCollapsed(true);manager.clearSession();manager.clearSession()
                  assertEquals(79,manager.getDesktopSettings().quality);assertFalse(manager.getDesktopSettings().autoClipboard);assertTrue(manager.isDesktopBarCollapsed())
                  val restarted=SessionManager(context);assertEquals(79,restarted.getDesktopSettings().quality);assertTrue(restarted.isDesktopBarCollapsed());assertFalse(restarted.getDesktopSettings().autoClipboard)
              }
              @Test fun logoutNormalizesCorruptEnumsWithoutLosingDesktopQuality() = withStorage {manager,prefs ->
                  prefs.edit().putInt("desktop_quality",88).putString("desktop_fps","invalid").putString("desktop_encoding","invalid").apply()
                  manager.clearSession()
                  val restored=SessionManager(context).getDesktopSettings()
                  assertEquals(88,restored.quality);assertEquals(FrameRateOption.FAST,restored.frameRate);assertEquals(DesktopEncoding.JPEG,restored.encoding);assertFalse(restored.autoClipboard)
              }
          '''
          p.write_text(text.rstrip()[:-1]+addition+'}\n')
          assert len(re.findall(r'@Test\b',p.read_text()))==7
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={tests}
          script=r'''from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          import xml.etree.ElementTree as ET
          root=Path(os.environ['RUNNER_TEMP'])/'logout-preferences'
          name='iecxiv.meshfabric.data.local.SessionStorageSafetyTest'
          methods={'logoutPreservesDesktopSettingsExceptAutomaticClipboard','repeatedLogoutKeepsDesktopPreferencesAndClipboardDisabled','logoutNormalizesCorruptEnumsWithoutLosingDesktopQuality'}
          results=Path('app/build/outputs/androidTest-results')
          if results.exists(): shutil.rmtree(results)
          selection=','.join(name+'#'+method for method in sorted(methods))
          result=subprocess.run(['bash','./gradlew',':app:connectedDebugAndroidTest','-Pandroid.testInstrumentationRunnerArguments.class='+selection,'--rerun-tasks','--no-daemon','--stacktrace'])
          red=root/'red';red.mkdir(exist_ok=True);cases=[]
          for index,path in enumerate(sorted(results.rglob('*.xml'))):
              shutil.copy2(path,red/(str(index)+'.xml'));cases.extend(ET.parse(path).getroot().iter('testcase'))
          assert result.returncode!=0,'Regressions unexpectedly passed before correction'
          assert {(case.get('classname'),case.get('name')) for case in cases}=={(name,method) for method in methods}
          assert all(case.find('failure') is not None and case.find('failure').get('type') in ('java.lang.AssertionError','org.junit.ComparisonFailure','junit.framework.AssertionFailedError') and case.find('error') is None and case.find('skipped') is None for case in cases)
          (red/'receipt.json').write_text(json.dumps({'exit_code':result.returncode,'assertion_failures':sorted(methods)},indent=2))
          source='app/src/main/java/iecxiv/meshfabric/data/local/SessionManager.kt'
          assert subprocess.check_output(['git','hash-object',source],text=True).strip()=='f33eca062fe4daf6c7b4f642b8253fc2ebc96e73'
          Path(source).write_text((root/'SessionManager.kt').read_text())
          allowed={source,'app/src/androidTest/java/iecxiv/meshfabric/data/local/SessionStorageSafetyTest.kt'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          (root/'candidate.json').write_text(json.dumps({path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in allowed}))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['bash','./gradlew',':app:assembleDebug',':app:compileDebugAndroidTestKotlin',':app:testDebugUnitTest',':app:lintDebug','--rerun-tasks','--continue','--no-daemon','--stacktrace'],check=True)
          subprocess.run(['python3','.github/scripts/run-emulator-regressions.py'],check=True)
          '''
          (root/'validate.py').write_text(script)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile baseline and new instrumentation regressions
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce three failures then validate correction and all selected regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 "${RUNNER_TEMP}/logout-preferences/validate.py"
      - name: Require permanent Android CI success for this preparation commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import json, os, time, urllib.request
          url='https://api.github.com/repos/iecxiv/meshfabric/actions/workflows/android-ci.yml/runs?branch=dev&event=push&per_page=30'
          deadline=time.monotonic()+900
          path=Path(os.environ['RUNNER_TEMP'])/'logout-preferences/permanent-ci.json'
          while True:
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
              runs=[run for run in data['workflow_runs'] if run['head_sha']==os.environ['GITHUB_SHA'] and run['event']=='push']
              run=max(runs,key=lambda item:item['id']) if runs else None
              receipt={key:run.get(key) for key in ('id','head_sha','status','conclusion','html_url','event')} if run else {'head_sha':os.environ['GITHUB_SHA'],'status':'not_found'}
              path.write_text(json.dumps(receipt,indent=2))
              if run and run['status']=='completed':
                  assert run['conclusion']=='success',receipt
                  print(json.dumps(receipt));break
              assert time.monotonic()<deadline,'Permanent CI did not complete successfully within 15 minutes'
              time.sleep(30)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logout-preferences-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logout-preferences/
            ${{ runner.temp }}/resume-regressions/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish tested correction on unchanged dev and retire this workflow
        shell: python
        run: |
          from pathlib import Path
          import ast, hashlib, json, os, subprocess
          root=Path(os.environ['RUNNER_TEMP']);summary=json.loads((root/'resume-regressions/summary.json').read_text())
          tree=ast.parse(Path('.github/scripts/run-emulator-regressions.py').read_text())
          classes=next(ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='classes' for target in node.targets))
          assert len(classes)==9 and set(summary)==set(classes)
          assert summary['iecxiv.meshfabric.data.local.SessionStorageSafetyTest']['expected']==7
          assert all(value['passed']>=value['expected']>0 for value in summary.values())
          hashes=json.loads((root/'logout-preferences/candidate.json').read_text())
          assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==value for path,value in hashes.items())
          ci=json.loads((root/'logout-preferences/permanent-ci.json').read_text())
          assert ci['head_sha']==os.environ['GITHUB_SHA'] and ci['status']=='completed' and ci['conclusion']=='success'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no publication'
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==set(hashes)
          temporary='.github/workflows/validate-logout-preferences.yml';Path(temporary).unlink();allowed=set(hashes)|{temporary}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          body='Permanent Android CI passed for preparation '+ci['head_sha']+'; run '+str(ci['id'])+'.'
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: preserve local desktop preferences on logout','-m',body],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
