name: Repair maintenance CSV and preserve ONLINE OFFLINE
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/repair-maintenance-i18n.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maintenance-docs-i18n-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover reviewed maintenance and repair report generation
        shell: python
        run: |
          from pathlib import Path
          import subprocess,textwrap
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          failed=Path('.github/workflows/maintenance-docs-i18n.yml')
          repair='.github/workflows/repair-maintenance-i18n.yml'
          assert git('rev-parse','HEAD^')=='eb1d02d38a4588f5a3a3d5ed7b6c5579523caba1'
          assert git('diff','--name-only','HEAD^','HEAD')==repair
          assert git('hash-object',str(failed))=='0d6380d98c053394b3482ddc9f217c77551321a5'
          source=failed.read_text()
          marker='      - name: Prepare guarded maintenance changes\n        shell: python\n        run: |\n'
          ending='      - name: Audit resource parity formats and source candidates\n'
          assert source.count(marker)==source.count(ending)==1
          program=textwrap.dedent(source.split(marker,1)[1].split(ending,1)[0])
          replacements={
              "assert git('rev-parse','HEAD^')=='c37937c8a836a2e761aaedb34036f7dfcc50e2c3'":"assert git('rev-parse','HEAD^')=='eb1d02d38a4588f5a3a3d5ed7b6c5579523caba1'",
              "assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/maintenance-docs-i18n.yml'":"assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/repair-maintenance-i18n.yml'",
              "('values-es','EN LÍNEA','DESCONECTADO')":"('values-es','ONLINE','OFFLINE')"
          }
          for before,after in replacements.items():
              assert program.count(before)==1,before
              program=program.replace(before,after,1)
          exec(compile(program,str(failed)+' (corrected candidate)','exec'))
          audit=Path('tools/i18n/audit.py')
          code=audit.read_text()
          old="writer=csv.writer(stream);writer.writerow(['path','line','kind','literal','context']);writer.writerows(candidates)"
          assert code.count(old)==1
          code=code.replace(old,'write_candidates(stream,candidates)',1)
          helper=r'''def write_candidates(stream,rows):
              writer=csv.writer(stream,lineterminator="\n",quoting=csv.QUOTE_ALL)
              writer.writerow(['path','line','kind','literal','context'])
              writer.writerows([[str(cell).replace("\r","\\r").replace("\n","\\n") for cell in row] for row in rows])
          '''
          assert code.count('def main():')==1
          code=code.replace('def main():',helper+'\ndef main():',1)
          anchor="        assert signature('%1$d')!=signature('%1$s')"
          assert code.count(anchor)==1
          regression=r'''
                  import io
                  sample=io.StringIO(newline='')
                  write_candidates(sample,[['file.kt',1,'candidate','line\nnext','context\r\nwith trailing spaces  ']])
                  serialized=sample.getvalue()
                  assert '\r' not in serialized
                  assert len(serialized.splitlines())==2
                  assert not any(line.endswith((' ','\t')) for line in serialized.splitlines())
                  decoded=list(csv.reader(io.StringIO(serialized)))
                  assert len(decoded)==2 and len(decoded[1])==5
                  assert decoded[1][3]=='line\\nnext'
                  assert decoded[1][4]=='context\\r\\nwith trailing spaces  '
          '''
          code=code.replace(anchor,anchor+regression,1)
          compile(code,str(audit),'exec');audit.write_text(code)
          for name,paragraph in [
              ('docs/i18n/README.md','ONLINE and OFFLINE are intentional shared labels in both languages. They are not missing translations. CSV reports use LF line endings, quote every field and display embedded CR/LF as escape sequences.'),
              ('docs/es/i18n/README.md','ONLINE y OFFLINE son etiquetas intencionadamente comunes en ambos idiomas, no traducciones pendientes. El CSV usa finales LF, entrecomilla todos los campos y representa los CR/LF internos mediante secuencias de escape.')]:
              p=Path(name);p.write_text(p.read_text().rstrip()+'\n\n'+paragraph+'\n')
      - name: Re-run audit and check actual CSV bytes
        run: |
          set -euo pipefail
          python3 tools/i18n/audit.py --self-test
          python3 tools/i18n/audit.py
          python3 - <<'PY'
          from pathlib import Path
          import csv,io,json
          p=Path('docs/i18n/candidates.csv');raw=p.read_bytes()
          assert b'\r' not in raw
          assert not any(line.endswith((b' ',b'\t')) for line in raw.splitlines())
          rows=list(csv.reader(io.StringIO(raw.decode())))
          summary=json.loads(Path('docs/i18n/summary.json').read_text())
          assert len(rows)==summary['literal_candidates']+1
          assert all(len(row)==5 for row in rows)
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build compile UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-maintenance-audit-${{ github.run_id }}
          path: |
            docs/i18n/summary.json
            docs/i18n/resource-issues.json
            docs/i18n/candidates.csv
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated maintenance and retire both workflows
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json
          import xml.etree.ElementTree as ET
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          baseline=subprocess.check_output(['git','show','HEAD:app/build.gradle.kts'],text=True)
          assert Path('app/build.gradle.kts').read_text()==baseline.replace('versionName = "1.4.0"','versionName = "1.4.1"',1)
          for folder in ['values','values-en','values-es']:
              values={node.get('name'):node.text for node in ET.parse(Path('app/src/main/res')/folder/'device_connection_labels.xml').getroot()}
              assert values=={'device_card_connection_online':'ONLINE','device_card_connection_offline':'OFFLINE'}
          report=Path('docs/i18n/summary.json');summary=json.loads(report.read_text());assert summary['resource_issues']==0
          summary['intentional_shared_labels']=['ONLINE','OFFLINE']
          summary['candidate_control_characters']='Embedded CR/LF are displayed as escape sequences; record terminators are LF.'
          summary['validation']={'build':'passed','jvm_tests':'passed','lint':'passed','android_tests':'compiled_not_executed','manual_language_review':'pending'}
          report.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflows=['.github/workflows/maintenance-docs-i18n.yml','.github/workflows/repair-maintenance-i18n.yml']
          for name in workflows: Path(name).unlink()
          paths=['app/build.gradle.kts','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt','README.md','README_ES.md','docs/device-controls.md','docs/es/device-controls.md','docs/i18n/README.md','docs/es/i18n/README.md','docs/i18n/summary.json','docs/i18n/resource-issues.json','docs/i18n/candidates.csv','tools/i18n/audit.py']+workflows+['app/src/main/res/'+folder+'/device_connection_labels.xml' for folder in ['values','values-en','values-es']]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())<=set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','chore(app): update version docs and audit while preserving ONLINE OFFLINE'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
