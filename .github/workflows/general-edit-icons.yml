name: Validate compact General edit icons
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/general-edit-icons.yml']
permissions:
  contents: write
concurrency:
  group: general-edit-icons-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 2 only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceGeneralFieldDialog.kt')
          sha=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert sha=='2dfe391e1c6f4ce5051c9422906c3c64fddc55ee'
          s=p.read_text()
          old='Icon(Icons.Default.Edit,editLabel)'
          new='Icon(Icons.Default.Edit,editLabel,modifier=Modifier.size(18.dp))'
          assert s.count(old)==1
          updated=s.replace(old,new,1)
          assert updated.replace(new,old,1)==s
          p.write_text(updated)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed==[str(p)]
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-edit-icons-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 2 and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/general-edit-icons.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceGeneralFieldDialog.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(devices): reduce General edit glyphs to 18dp'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
