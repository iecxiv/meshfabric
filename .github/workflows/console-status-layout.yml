name: Validate console warning and stable status layout
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/console-status-layout.yml']
permissions:
  contents: write
concurrency:
  group: console-status-layout-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply two targeted console corrections
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root=Path('app/src/main/java/iecxiv/meshfabric/ui')
          server=root/'management/ServerConsoleTerminal.kt'
          original=server.read_text()
          old='ime?.showSoftInput(view,InputMethodManager.SHOW_IMPLICIT)'
          new='ime?.showSoftInput(view,0)'
          assert original.count(old)==1
          updated=original.replace(old,new,1)
          assert updated.replace(new,old,1)==original
          server.write_text(updated)
          agent=root/'devices/DeviceAgentConsoleScreen.kt'
          assert subprocess.check_output(['git','hash-object',str(agent)],text=True).strip()=='0322e9db20ee4021ceba199940f05617bd0d2cf2'
          original=agent.read_text()
          updated=original
          changes=[
              ('import androidx.compose.ui.draw.clip\n','import androidx.compose.ui.draw.clip\nimport androidx.compose.ui.draw.alpha\nimport androidx.compose.ui.semantics.clearAndSetSemantics\n'),
              ('Row(Modifier.fillMaxWidth(),verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {','Row(Modifier.fillMaxWidth().heightIn(min=48.dp).testTag("agent_console_status_row"),verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {'),
              ('if(state.phase=="closed") TextButton(enabled=connected,onClick={session.connect()},modifier=Modifier.testTag("agent_console_reconnect")) {Text(t("Reconectar","Reconnect"))}',
               'TextButton(enabled=connected && state.phase=="closed",onClick={if(state.phase=="closed") session.connect()},modifier=if(state.phase=="closed") Modifier.testTag("agent_console_reconnect") else Modifier.alpha(0f).clearAndSetSemantics {}) {Text(t("Reconectar","Reconnect"))}')
          ]
          for old,new in changes:
              assert updated.count(old)==1,old
              updated=updated.replace(old,new,1)
          restored=updated
          for old,new in reversed(changes): restored=restored.replace(new,old,1)
          assert restored==original
          agent.write_text(updated)
          paths={str(server),str(agent)}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==paths
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/console-validation.log"
          if grep -E 'SHOW_IMPLICIT.*deprecated' "$RUNNER_TEMP/console-validation.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-status-layout-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/console-validation.log
          if-no-files-found: ignore
      - name: Publish validated corrections and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/console-status-layout.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/ServerConsoleTerminal.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentConsoleScreen.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(console): remove deprecated IME flag and retain status row space'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
