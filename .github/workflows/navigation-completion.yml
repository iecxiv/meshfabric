name: Validate navigation completion and agent Core
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/navigation-completion.yml']
permissions:
  contents: write
concurrency:
  group: navigation-completion-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Complete navigation without replacing send policies
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='fe534b28215045d13ee61cea73abb872d66eada4','Base changed; re-review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui');changed=set()
          def put(name,text):
              p=root/name;p.write_text(text);changed.add(str(p))
          def edit(name,old,new,count=1):
              p=root/name;t=p.read_text();assert old and t.count(old)==count,(name,old,t.count(old));put(name,t.replace(old,new,count))
          def create(name,text):
              assert not (root/name).exists();put(name,text)
          edit('management/UserAdministration.kt','LocalProfileUserInline.current && editing && mode=="profile"','LocalProfileUserInline.current && (editing || creating) && mode=="profile"',2)
          n='management/ProfileScreen.kt';t=(root/n).read_text()
          old='val inlineUser=tab!=0 && form?.let {it.users && it.operation=="edit"}==true'
          assert t.count(old)==1
          t=t.replace(old,'val inlineUser=tab!=0 && form?.let {it.operation=="create" || (it.users && it.operation=="edit")}==true\nval inlineGroup=tab!=0 && groupDetails!=null && form==null && userGroupDetails==null\nval groupDetailsHolder=key(agentIdentity) {androidx.compose.runtime.saveable.rememberSaveableStateHolder()}',1)
          groupLines=[line for line in t.splitlines() if line.startswith('groupDetails?.takeIf')]
          assert len(groupLines)==1
          line=groupLines[0];assert 'id->key(id) {' in line
          groupRenderer=line.replace('id->key(id) {','id->groupDetailsHolder.SaveableStateProvider(id) {',1)
          t=t.replace(line,'if(!inlineGroup) RenderDeviceGroup()',1)
          anchor='LaunchedEffect(inlineUser) {if(inlineUser) {directoryFocus.clearFocus(force=true);directoryKeyboard?.hide()}}'
          assert t.count(anchor)==1
          t=t.replace(anchor,'@Composable fun RenderDeviceGroup() {\n'+groupRenderer+'\n}\nLaunchedEffect(inlineUser,inlineGroup) {if(inlineUser || inlineGroup) {directoryFocus.clearFocus(force=true);directoryKeyboard?.hide()}}',1)
          old='CompositionLocalProvider(LocalProfileUserInline provides true) {RenderProfileForm()}\n}\n}'
          assert t.count(old)==1
          t=t.replace(old,'CompositionLocalProvider(LocalProfileUserInline provides true) {RenderProfileForm()}\n}\nif(inlineGroup) Column(Modifier.fillMaxSize()) {CompositionLocalProvider(LocalDeviceGroupInline provides true) {RenderDeviceGroup()}}\n}',1)
          old='.then(if(inlineUser) Modifier.clearAndSetSemantics';assert t.count(old)==1
          t=t.replace(old,'.then(if(inlineUser || inlineGroup) Modifier.clearAndSetSemantics',1)
          old='ManagementDialog(onDismissRequest={ form=null },modifier=';assert t.count(old)==1
          t=t.replace(old,'ProfileUserDetailSurface(inline=LocalProfileUserInline.current && creating,onDismissRequest={ form=null },modifier=',1)
          put(n,t)
          edit('management/CompactProfileGroups.kt','    ManagementDialog(onDismissRequest=onDismiss,modifier=','    ProfileUserDetailSurface(inline=LocalDeviceGroupInline.current,onDismissRequest=onDismiss,modifier=')
          edit('management/UserGroupCreateDialog.kt','    ManagementDialog(onDismissRequest=onDismiss,modifier=','    ProfileUserDetailSurface(inline=true,onDismissRequest=onDismiss,modifier=')
          n='management/UserGroupsDirectoryPane.kt';t=(root/n).read_text()
          originalCreate='if(creating && editing==null) UserGroupCreateDialog(session,s) {creating=false}'
          assert t.count(originalCreate)==1;t=t.replace(originalCreate,'',1)
          old='    LazyColumn(modifier,contentPadding=';assert t.count(old)==1
          t=t.replace(old,'    Box(modifier) {\n    LazyColumn(Modifier.fillMaxSize().blockCoveredNavigation(creating && editing==null),contentPadding=',1)
          anchor='\ngrantingMesh?.let {';assert t.count(anchor)==1
          t=t.replace(anchor,'\nif(creating && editing==null) Column(Modifier.fillMaxSize()) {UserGroupCreateDialog(session,s) {creating=false}}\n}\ngrantingMesh?.let {',1)
          put(n,t)
          edit('management/UserMessageDialog.kt','    ManagementDialog(onDismissRequest=onDismiss,modifier=','    ProfileUserDetailSurface(inline=LocalNoticeComposeInline.current,onDismissRequest=onDismiss,modifier=')
          n='management/NoticeCenterScreen.kt';t=(root/n).read_text()
          old='onDeviceMessage:(MeshNode)->Unit,header:@Composable (@Composable ()->Unit)->Unit)'
          assert t.count(old)==2
          public='onDeviceMessage:(MeshNode)->Unit,deviceComposeOpen:Boolean=false,deviceComposer:@Composable ()->Unit={},onCloseDeviceComposer:()->Unit={},header:@Composable (@Composable ()->Unit)->Unit)'
          t=t.replace(old,public,1)
          private='onDeviceMessage:(MeshNode)->Unit,deviceComposeOpen:Boolean,deviceComposer:@Composable ()->Unit,onCloseDeviceComposer:()->Unit,header:@Composable (@Composable ()->Unit)->Unit)'
          t=t.replace(old,private,1)
          old='NoticeCenterContent(source,inbox,actionsReady,nodes,modifier,onDeviceMessage,header)';assert t.count(old)==1
          t=t.replace(old,'NoticeCenterContent(source,inbox,actionsReady,nodes,modifier,onDeviceMessage,deviceComposeOpen,deviceComposer,onCloseDeviceComposer,header)',1)
          old='recipient=null;searchState=searchState.cleared();section=it';assert t.count(old)==1
          t=t.replace(old,'onCloseDeviceComposer();recipient=null;searchState=searchState.cleared();section=it',1)
          anchor='    var devices by remember {mutableStateOf(false)}';assert t.count(anchor)==1
          t=t.replace(anchor,anchor+'\n    val userGridState=androidx.compose.foundation.lazy.grid.rememberLazyGridState()\n    val deviceGridState=androidx.compose.foundation.lazy.grid.rememberLazyGridState()',1)
          start='            NoticeSection.MESSAGES->';end='\n        }\n    }\n    recipient?.takeIf'
          assert t.count(start)==1 and t.count(end)==1
          a=t.index(start);b=t.index(end,a)
          arm='''            NoticeSection.MESSAGES->NoticeManagementBody(state,session::start,Modifier.weight(1f).fillMaxWidth()) {
                          val selectedRecipient=recipient
                          if(deviceComposeOpen) deviceComposer()
                          else if(selectedRecipient!=null && !devices) key(selectedRecipient) {
                              CompositionLocalProvider(LocalNoticeComposeInline provides true) {UserMessageDialog(session,state,selectedRecipient) {recipient=null}}
                          } else {
                              Text(t("Mensaje individual a usuario o dispositivo","Individual message to a user or device"),style=MaterialTheme.typography.titleMedium)
                              Text(t("Elige un usuario o dispositivo para enviarle un mensaje.","Choose a user or device to send a message."),style=MaterialTheme.typography.bodySmall)
                              Row(horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                                  FilterChip(selected=!devices,onClick={devices=false;recipient=null;searchState=searchState.cleared()},label={Text(t("Usuarios","Users"))})
                                  FilterChip(selected=devices,onClick={devices=true;recipient=null;searchState=searchState.cleared()},label={Text(t("Dispositivos","Devices"))})
                              }
                              Text(if(devices) t("Notificación a un agente conectado; el servidor valida los permisos.","Notification to a connected agent; the server validates permissions.") else t("Notificación individual; no es chat ni hay confirmación de lectura.","Individual notification; not chat and no read confirmation."),style=MaterialTheme.typography.bodySmall)
                              NoticeSearchField(searchState,{searchState=searchState.edit(it)})
                              NoticeSubmissionStatus(state.notice,es)
                              val choices=if(devices) nodes.filter {it.conn and 1!=0 && noticeDeviceRecipientLabel(it.name,groupNames[it.id].orEmpty(),es).contains(search,true)}.distinctBy {it.id}.map {NoticeNavigationChoice(it.id,noticeDeviceRecipientLabel(it.name,groupNames[it.id].orEmpty(),es),true)}
                                  else state.users.filter {it.optString("_id")!=state.id && canAdministerUser(state,it) && noticeUserRecipientLabel(it.optString("name"),es).contains(search,true)}.map {NoticeNavigationChoice(it.optString("_id"),noticeUserRecipientLabel(it.optString("name"),es),false)}
                              if(choices.isEmpty()) Text(t("No hay destinatarios disponibles que coincidan.","No matching recipients available."),style=MaterialTheme.typography.bodySmall)
                              NoticeNavigationGrid(choices,if(devices) deviceGridState else userGridState,if(devices) actionsReady && !source.isUserLogout else state.canWrite,Modifier.weight(1f).fillMaxWidth()) {choice->
                                  if(choice.device) nodes.singleOrNull {it.id==choice.id && it.conn and 1!=0}?.let(onDeviceMessage) else recipient=choice.id
                              }
                          }
                      }'''
          t=t[:a]+arm+t[b:]
          old='    recipient?.takeIf {section==NoticeSection.MESSAGES && !devices}?.let {id->key(id) {UserMessageDialog(session,state,id) {recipient=null}}}\n'
          assert t.count(old)==1;t=t.replace(old,'',1)
          assert 'Redactar notificación' not in t and 'Compose notification' not in t
          put(n,t)
          n='management/MeshFabricHome.kt';original=(root/n).read_text();t=original
          ui='@Composable fun MeshFabricHome(';assert t.count(ui)==1;transport=t.split(ui,1)[0]
          start='    operation?.let { op->key(op.title,operationNode) {\n';end='\n@Composable private fun DeviceActionMenu('
          assert t.count(start)==1 and t.count(end)==1
          a=t.index(start);tail=t.index(end,a);b=t.rfind('\n    } }',a,tail)+len('\n    } }')
          assert b>a and t[b:tail].strip()=='}'
          renderer=t[a:b]
          old='expanded=expandedMessage,onConfirm=';assert renderer.count(old)==1
          renderer=renderer.replace(old,'expanded=expandedMessage,inline=noticeCompose,onConfirm=',1)
          t=t[:a]+'    if(!noticeCompose) RenderOperation()\n'+t[b:]
          anchor='    Scaffold(contentWindowInsets=WindowInsets(0,0,0,0),';assert t.count(anchor)==1
          t=t.replace(anchor,'    @Composable fun RenderOperation() {\n'+renderer+'\n    }\n    LaunchedEffect(page) {if(page!=4 && noticeCompose) {operation=null;noticeCompose=false}}\n'+anchor,1)
          old='    var operation by remember { mutableStateOf<Operation?>(null) }';assert t.count(old)==1
          t=t.replace(old,old+'\n    var noticeCompose by remember {mutableStateOf(false)}',1)
          old='onSelect={ op->operationNode=node.id; operation=';assert t.count(old)==1
          t=t.replace(old,'onSelect={ op->noticeCompose=false;operationNode=node.id; operation=',1)
          old='NoticeCenterScreen(viewModel.meshClient,management.inbox,state.ready,nodes,Modifier.fillMaxSize(),header=';assert t.count(old)==1
          t=t.replace(old,'NoticeCenterScreen(viewModel.meshClient,management.inbox,state.ready,nodes,Modifier.fillMaxSize(),deviceComposeOpen=noticeCompose && operation!=null,deviceComposer={RenderOperation()},onCloseDeviceComposer={operation=null;noticeCompose=false},header=',1)
          old='onDeviceMessage={node->\n                    operationNode=node.id';assert t.count(old)==1
          t=t.replace(old,'onDeviceMessage={node->\n                    noticeCompose=true\n                    operationNode=node.id',1)
          assert t.split(ui,1)[0]==transport
          put(n,t)
          edit('management/OperationFormDialog.kt','onConfirm:()->Unit,expanded:Boolean=false,content:@Composable ()->Unit)','onConfirm:()->Unit,expanded:Boolean=false,inline:Boolean=false,content:@Composable ()->Unit)')
          edit('management/OperationFormDialog.kt','    if(!form && dangerous) {','''    if(inline && form && !dangerous) {
                  ProfileUserDetailSurface(inline=true,onDismissRequest=onDismiss,title={Text(title)},text={Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp)) {content()}},confirmButton={Button(enabled=enabled,onClick=onConfirm) {Text(confirm)}},dismissButton={TextButton(onClick=onDismiss) {Text(stringResource(R.string.cancel))}})
                  return
              }
              if(!form && dangerous) {''')
          edit('devices/DeviceAgentConsoleScreen.kt','readAgentConsoleVersion(source,nodeId,agentVersion)','readAgentCoreInventoryVersion(source,nodeId)')
          edit('devices/DeviceAgentConsoleScreen.kt','(reportedVersion ?: agentVersion ?: if(queryingVersion','(reportedVersion ?: if(queryingVersion')
          edit('devices/DeviceAgentConsoleScreen.kt','''            if(actions) {
                          AgentConsoleAction.values().forEach''','''            if(actions) {
                          DropdownMenuItem(text={Text(t("Volver","Back"))},leadingIcon={Icon(Icons.AutoMirrored.Filled.ArrowBack,null)},onClick={actions=false},modifier=Modifier.testTag("agent_console_actions_back"))
                          AgentConsoleAction.values().forEach''')
          create('devices/AgentCoreInventoryVersion.kt','''package iecxiv.meshfabric.ui.devices
          import iecxiv.meshfabric.data.remote.DeviceInventoryState
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import iecxiv.meshfabric.data.remote.deviceInventory
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.withTimeoutOrNull
          internal fun agentCoreInventoryValue(state:DeviceInventoryState):String? = inventorySections(state).filter {it.key=="agent"}.flatMap {it.rows}.filter {it.path.split(" / ").last().equals("core",true)}.map {it.value}.distinct().singleOrNull()
          internal suspend fun readAgentCoreInventoryVersion(source:MeshCentralClient,nodeId:String):String? = withTimeoutOrNull(26_000L) {
              agentCoreInventoryValue(deviceInventory(source,nodeId).first {"getsysinfo" !in it.pending})
          }
          ''')
          create('management/NavigationCompletionComponents.kt','''package iecxiv.meshfabric.ui.management
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Computer
          import androidx.compose.material.icons.filled.Person
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.input.pointer.PointerEventPass
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.semantics.clearAndSetSemantics
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          internal val LocalDeviceGroupInline=staticCompositionLocalOf {false}
          internal val LocalNoticeComposeInline=staticCompositionLocalOf {false}
          internal fun Modifier.blockCoveredNavigation(covered:Boolean):Modifier=if(!covered) this else this.clearAndSetSemantics {}.pointerInput(Unit) {awaitPointerEventScope {while(true) awaitPointerEvent(PointerEventPass.Initial).changes.forEach {it.consume()}}}
          internal data class NoticeNavigationChoice(val id:String,val label:String,val device:Boolean)
          @Composable internal fun NoticeNavigationGrid(choices:List<NoticeNavigationChoice>,state:LazyGridState,enabled:Boolean,modifier:Modifier,onSelect:(NoticeNavigationChoice)->Unit) {
              LazyVerticalGrid(columns=GridCells.Adaptive(220.dp),state=state,modifier=modifier,horizontalArrangement=Arrangement.spacedBy(12.dp),verticalArrangement=Arrangement.spacedBy(12.dp)) {
                  items(choices,key={it.id}) {choice->
                      Box(Modifier.fillMaxWidth(),contentAlignment=Alignment.TopCenter) {
                          OutlinedCard(onClick={onSelect(choice)},enabled=enabled,modifier=Modifier.widthIn(max=320.dp).fillMaxWidth(),shape=MaterialTheme.shapes.medium,border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {
                              Column(Modifier.fillMaxWidth().padding(16.dp),horizontalAlignment=Alignment.CenterHorizontally,verticalArrangement=Arrangement.spacedBy(8.dp)) {
                                  Icon(if(choice.device) Icons.Default.Computer else Icons.Default.Person,null,Modifier.size(24.dp),tint=MaterialTheme.colorScheme.primary)
                                  Text(choice.label,Modifier.fillMaxWidth(),textAlign=TextAlign.Center,style=MaterialTheme.typography.titleSmall,maxLines=3,overflow=TextOverflow.Ellipsis)
                              }
                          }
                      }
                  }
              }
          }
          ''')
          test=Path('app/src/test/java/iecxiv/meshfabric/ui/devices/NavigationCompletionTest.kt');assert not test.exists();test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.ui.devices
          import com.google.gson.JsonParser
          import iecxiv.meshfabric.data.remote.DeviceInventoryState
          import iecxiv.meshfabric.ui.management.accountInlineOption
          import org.junit.Assert.*
          import org.junit.Test
          class NavigationCompletionTest {
              @Test fun coreMatchesInventoryAndNeverUsesAgentVer() {
                  val packet=JsonParser.parseString("{\\"hardware\\":{\\"agent\\":{\\"core\\":\\"core-value\\"}},\\"node\\":{\\"agent\\":{\\"ver\\":999}}}").asJsonObject
                  assertEquals("core-value",agentCoreInventoryValue(DeviceInventoryState(packets=mapOf("getsysinfo" to packet))))
                  val missing=JsonParser.parseString("{\\"node\\":{\\"agent\\":{\\"ver\\":999}}}").asJsonObject
                  assertNull(agentCoreInventoryValue(DeviceInventoryState(packets=mapOf("getsysinfo" to missing))))
              }
              @Test fun accountHistoryIsInline() {assertTrue(accountInlineOption(3))}
          }
          ''');changed.add(str(test))
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines());assert actual==changed
          assert 'readAgentConsoleVersion(' not in (root/'devices/DeviceAgentConsoleScreen.kt').read_text()
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-completion-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated navigation and agent fixes and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/navigation-completion.yml';Path(workflow).unlink()
          root='app/src/main/java/iecxiv/meshfabric/ui/'
          paths=[root+n for n in ['management/UserAdministration.kt','management/ProfileScreen.kt','management/CompactProfileGroups.kt','management/UserGroupCreateDialog.kt','management/UserGroupsDirectoryPane.kt','management/UserMessageDialog.kt','management/NoticeCenterScreen.kt','management/MeshFabricHome.kt','management/OperationFormDialog.kt','devices/DeviceAgentConsoleScreen.kt','devices/AgentCoreInventoryVersion.kt','management/NavigationCompletionComponents.kt']]+['app/src/test/java/iecxiv/meshfabric/ui/devices/NavigationCompletionTest.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True);assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(navigation): integrate message and group views and match agent Core'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
