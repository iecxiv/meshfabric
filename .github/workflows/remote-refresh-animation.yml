name: Validate remote refresh animations
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/remote-refresh-animation.yml']
permissions:
  contents: write
concurrency:
  group: remote-refresh-animation-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reuse shared animation without changing refresh callbacks
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui')
          shared=root/'components/AppRefreshIconButton.kt'
          assert git('hash-object',str(shared))=='c32d24f23096510976526c22576b93f692c02f83'
          changes=[
              ('desktop/RemoteDesktopScreen.kt','2ab5fd7fb3eff2123c609173dbfdb0bddd235708',
               '                        IconButton(onClick = { viewModel.refreshDisplay(nodeId) }, modifier = Modifier.size(38.dp)) {\n                            RemoteHeaderIcon(Icons.Default.Refresh, contentDescription = stringResource(R.string.refresh))\n                        }',
               '                        iecxiv.meshfabric.ui.components.AppRefreshIconButton(onRefresh={viewModel.refreshDisplay(nodeId)},contentDescription=stringResource(R.string.refresh))'),
              ('files/FileManagerScreen.kt','ee246e71b7be28fd3d08bfce4f2312ad9cb01a9e',
               '                        IconButton(\n                            onClick = { viewModel.refresh(nodeId) },\n                            modifier = Modifier.size(38.dp)\n                        ) {\n                            RemoteHeaderIcon(Icons.Default.Refresh, contentDescription = stringResource(R.string.refresh))\n                        }',
               '                        iecxiv.meshfabric.ui.components.AppRefreshIconButton(onRefresh={viewModel.refresh(nodeId)},contentDescription=stringResource(R.string.refresh))')
          ]
          for name,sha,old,new in changes:
              p=root/name
              assert git('hash-object',str(p))==sha
              original=p.read_text()
              assert original.count(old)==1,name
              updated=original.replace(old,new,1)
              assert updated.replace(new,old,1)==original
              p.write_text(updated)
          assert set(git('diff','--name-only').splitlines())=={str(root/item[0]) for item in changes}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-refresh-animation-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated animation and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/remote-refresh-animation.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(remote): reuse blue rotating refresh icons for desktop and files'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
