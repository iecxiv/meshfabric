name: Verify desktop native keyboard on dev
on:
  push:
    branches: [dev]
    paths: [.github/workflows/dev-desktop-keyboard.yml]
permissions:
  contents: write
concurrency:
  group: dev-desktop-keyboard
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dev base from main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          git merge-base --is-ancestor 2f61dbf44793420eb0f4e1618a2c58e0c5a3d9d7 HEAD
          git diff --exit-code 2f61dbf44793420eb0f4e1618a2c58e0c5a3d9d7 HEAD -- . ':(exclude).github/workflows/dev-desktop-keyboard.yml'
      - name: Apply reviewed desktop input patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = 'app/src/main/java/iecxiv/meshfabric/ui/desktop/'
          state = '''    val desktopKeyboard = remember(nodeId, viewModel) {
                  DesktopKeyboardRouter { key, down -> viewModel.sendDesktopKeyEvent(nodeId, key, down) }
              }
              val desktopLifecycle by androidx.lifecycle.compose.LocalLifecycleOwner.current.lifecycle.currentStateFlow.collectAsState()
              val desktopKeyboardActive = isConnected && !showKeyboardDialog && !showClipboardDialog && !showSettingsDialog &&
                  desktopLifecycle.isAtLeast(androidx.lifecycle.Lifecycle.State.RESUMED)
              LaunchedEffect(desktopKeyboard, desktopKeyboardActive) {
                  desktopKeyboard.setActive(desktopKeyboardActive)
                  if (desktopKeyboardActive) focusRequester.requestFocus()
              }
              DisposableEffect(desktopKeyboard) { onDispose { desktopKeyboard.setActive(false) } }

          '''
          vm = '''    fun sendDesktopKeyEvent(nodeId: String, keyCode: Int, isDown: Boolean) {
                  if (keyCode !in 1..255) return
                  desktopClient.getSession(meshClient, nodeId).sendKeyEvent(keyCode, isDown)
              }

          '''
          edits = {
              root + 'RemoteDesktopViewModel.kt': [('    fun sendSingleKey(nodeId: String, keyCode: Int) {', vm + '    fun sendSingleKey(nodeId: String, keyCode: Int) {')],
              root + 'RemoteDesktopScreen.kt': [
                  ('    LaunchedEffect(isImeVisible) {', state + '    LaunchedEffect(isImeVisible) {'),
                  ('            BasicTextField(\n                value = softKeyboardTextFieldValue,', '            BasicTextField(\n                enabled = desktopKeyboardActive,\n                value = softKeyboardTextFieldValue,'),
                  ('                    .alpha(0.01f)\n                    .focusRequester(focusRequester),', '                    .alpha(0.01f)\n                    .desktopKeyEvents(desktopKeyboard)\n                    .focusRequester(focusRequester),'),
                  ('                    imeAction = ImeAction.Send,\n                    autoCorrectEnabled = false', '                    imeAction = ImeAction.Send,\n                    showKeyboardOnFocus = false,\n                    autoCorrectEnabled = false')
              ]
          }
          newfiles = {}
          newfiles[root + 'DesktopKeyboardRouter.kt'] = '''package iecxiv.meshfabric.ui.desktop

          internal object DesktopAndroidKeyMap {
              private val special = mapOf(
                  19 to 0x26, 20 to 0x28, 21 to 0x25, 22 to 0x27, 23 to 0x0D,
                  28 to 0x0C, 55 to 0xBC, 56 to 0xBE, 57 to 0x12, 58 to 0x12,
                  59 to 0x10, 60 to 0x10, 61 to 0x09, 62 to 0x20, 66 to 0x0D,
                  67 to 0x08, 68 to 0xC0, 69 to 0xBD, 70 to 0xBB, 71 to 0xDB,
                  72 to 0xDD, 73 to 0xDC, 74 to 0xBA, 75 to 0xDE, 76 to 0xBF,
                  82 to 0x5D, 92 to 0x21, 93 to 0x22, 111 to 0x1B, 112 to 0x2E,
                  113 to 0x11, 114 to 0x11, 115 to 0x14, 116 to 0x91,
                  117 to 0x5B, 118 to 0x5B, 120 to 0x2C, 121 to 0x13,
                  122 to 0x24, 123 to 0x23, 124 to 0x2D, 143 to 0x90,
                  154 to 0x6F, 155 to 0x6A, 156 to 0x6D, 157 to 0x6B,
                  158 to 0x6E, 159 to 0x6C, 160 to 0x0D
              )
              fun virtualKey(code: Int): Int? = when (code) {
                  in 29..54 -> 0x41 + code - 29
                  in 7..16 -> 0x30 + code - 7
                  in 131..142 -> 0x70 + code - 131
                  in 144..153 -> 0x60 + code - 144
                  else -> special[code]
              }
              fun modifier(code: Int): Boolean = code in listOf(57,58,59,60,113,114,117,118)
              fun noRepeat(code: Int): Boolean = modifier(code) || code in listOf(115,116,143)
              fun modifiers(meta: Int): List<Int> = buildList {
                  if (meta and 1 != 0) add(0x10)
                  if (meta and 0x1000 != 0) add(0x11)
                  if (meta and 2 != 0) add(0x12)
                  if (meta and 0x10000 != 0) add(0x5B)
              }
          }

          internal class DesktopKeyboardRouter(private val emit: (Int, Boolean) -> Unit) {
              private data class Identity(val device: Int, val code: Int)
              private data class Stroke(val vk: Int, val extras: List<Int>, val modifier: Boolean)
              private val held = linkedMapOf<Identity, Stroke>()
              private val references = mutableMapOf<Int, Int>()
              private val physicalModifiers = mutableMapOf<Int, Int>()
              private var active = false
              fun setActive(value: Boolean) { if (!value) releaseAll(); active = value }
              private fun press(vk: Int) {
                  val count = references[vk] ?: 0
                  references[vk] = count + 1
                  if (count == 0) emit(vk, true)
              }
              private fun release(vk: Int) {
                  val count = references[vk] ?: return
                  if (count <= 1) { references.remove(vk); emit(vk, false) }
                  else references[vk] = count - 1
              }
              private fun finish(stroke: Stroke) {
                  if (stroke.modifier) {
                      val count = physicalModifiers[stroke.vk] ?: 0
                      if (count <= 1) physicalModifiers.remove(stroke.vk) else physicalModifiers[stroke.vk] = count - 1
                  }
                  release(stroke.vk)
                  stroke.extras.asReversed().forEach(::release)
              }
              fun handle(action: Int, code: Int, repeat: Int = 0, meta: Int = 0, device: Int = 0): Boolean {
                  if (!active || action !in 0..1) return false
                  val identity = Identity(device, code)
                  if (action == 1) {
                      val stroke = held.remove(identity) ?: return false
                      finish(stroke)
                      return true
                  }
                  val vk = DesktopAndroidKeyMap.virtualKey(code) ?: return false
                  if (held.containsKey(identity)) {
                      if (repeat > 0 && !DesktopAndroidKeyMap.noRepeat(code)) emit(vk, true)
                      return true
                  }
                  val modifier = DesktopAndroidKeyMap.modifier(code)
                  val extras = if (modifier) emptyList() else DesktopAndroidKeyMap.modifiers(meta)
                      .filter { it != vk && (physicalModifiers[it] ?: 0) == 0 }
                  extras.forEach(::press)
                  if (modifier) physicalModifiers[vk] = (physicalModifiers[vk] ?: 0) + 1
                  press(vk)
                  held[identity] = Stroke(vk, extras, modifier)
                  return true
              }
              fun releaseAll() {
                  held.values.toList().asReversed().forEach(::finish)
                  held.clear()
                  references.clear()
                  physicalModifiers.clear()
              }
          }
          '''
          newfiles[root + 'DesktopKeyboardInput.kt'] = '''package iecxiv.meshfabric.ui.desktop

          import android.view.KeyEvent
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.focus.onFocusChanged
          import androidx.compose.ui.input.key.onPreviewKeyEvent

          internal fun Modifier.desktopKeyEvents(router: DesktopKeyboardRouter): Modifier =
              onFocusChanged { if (!it.isFocused) router.releaseAll() }.onPreviewKeyEvent {
                  val event = it.nativeKeyEvent
                  router.handle(event.action, event.keyCode, event.repeatCount,
                      KeyEvent.normalizeMetaState(event.metaState), event.deviceId)
              }
          '''
          newfiles['app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardRouterTest.kt'] = '''package iecxiv.meshfabric.ui.desktop

          import org.junit.Assert.*
          import org.junit.Test

          class DesktopKeyboardRouterTest {
              private val events = mutableListOf<Pair<Int, Boolean>>()
              private fun router() = DesktopKeyboardRouter { key, down -> events.add(key to down) }.apply { setActive(true) }
              @Test fun arrowsAreKeyEventsNotTextEdits() {
                  val router = router()
                  for ((code, vk) in mapOf(19 to 38,20 to 40,21 to 37,22 to 39)) {
                      assertTrue(router.handle(0,code)); assertTrue(router.handle(1,code))
                      assertEquals(listOf(vk to true,vk to false),events); events.clear()
                  }
              }
              @Test fun navigationAndFunctionKeysMapped() {
                  for ((code,vk) in mapOf(61 to 9,66 to 13,67 to 8,111 to 27,112 to 46,122 to 36,123 to 35,124 to 45,92 to 33,93 to 34))
                      assertEquals(vk,DesktopAndroidKeyMap.virtualKey(code))
                  for (n in 0..11) assertEquals(112+n,DesktopAndroidKeyMap.virtualKey(131+n))
              }
              @Test fun lettersDigitsAndNumpadMapped() {
                  for (n in 0..25) assertEquals(65+n,DesktopAndroidKeyMap.virtualKey(29+n))
                  for (n in 0..9) {
                      assertEquals(48+n,DesktopAndroidKeyMap.virtualKey(7+n))
                      assertEquals(96+n,DesktopAndroidKeyMap.virtualKey(144+n))
                  }
              }
              @Test fun physicalCtrlChordBalancedOnce() {
                  val router=router();router.handle(0,113);router.handle(0,29,meta=0x1000)
                  router.handle(1,29);router.handle(1,113)
                  assertEquals(listOf(17 to true,65 to true,65 to false,17 to false),events)
              }
              @Test fun imeChordWithoutModifierEventsBalanced() {
                  val router=router();router.handle(0,29,meta=0x1000);router.handle(1,29)
                  assertEquals(listOf(17 to true,65 to true,65 to false,17 to false),events)
              }
              @Test fun repeatsDoNotCreateExtraReleaseDebt() {
                  val router=router();router.handle(0,19);router.handle(0,19,repeat=1);router.handle(1,19)
                  assertEquals(listOf(38 to true,38 to true,38 to false),events)
                  router.releaseAll();assertEquals(3,events.size)
              }
              @Test fun modifiersDoNotRepeat() {
                  val router=router();router.handle(0,113);router.handle(0,113,repeat=1);router.handle(1,113)
                  assertEquals(listOf(17 to true,17 to false),events)
              }
              @Test fun shiftSidesShareAReleaseReference() {
                  val router=router();router.handle(0,59);router.handle(0,60);router.handle(1,59)
                  assertEquals(listOf(16 to true),events);router.handle(1,60)
                  assertEquals(listOf(16 to true,16 to false),events)
              }
              @Test fun lostFocusReleasesInReverseOrderAndNeverReplays() {
                  val router=router();router.handle(0,113);router.handle(0,29,meta=0x1000);router.setActive(false)
                  assertEquals(listOf(17 to true,65 to true,65 to false,17 to false),events)
                  router.setActive(true);assertFalse(router.handle(1,29));assertEquals(4,events.size)
              }
              @Test fun reservedAndUnknownKeysPassThrough() {
                  val router=router()
                  for (code in listOf(3,4,24,25,26,999)) assertFalse(router.handle(0,code))
                  assertFalse(router.handle(2,19));assertTrue(events.isEmpty())
              }
              @Test fun inactiveDoesNotSend() {
                  val router=router();router.setActive(false);assertFalse(router.handle(0,19));assertTrue(events.isEmpty())
              }
              @Test fun releasingPhysicalShiftDoesNotRetainItForAnArrow() {
                  val router=router();router.handle(0,59);router.handle(0,19,meta=1);router.handle(1,59)
                  assertEquals(listOf(16 to true,38 to true,16 to false),events)
                  router.handle(1,19);assertEquals(38 to false,events.last())
              }
          }
          '''
          newfiles['app/src/androidTest/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardInputTest.kt'] = '''package iecxiv.meshfabric.ui.desktop

          import android.view.InputDevice
          import android.view.KeyEvent
          import androidx.activity.ComponentActivity
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.focus.FocusRequester
          import androidx.compose.ui.focus.focusRequester
          import androidx.compose.ui.test.junit4.createAndroidComposeRule
          import androidx.compose.ui.unit.dp
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test

          class DesktopKeyboardInputTest {
              @get:Rule val compose = createAndroidComposeRule<ComponentActivity>()
              private val events = mutableListOf<Pair<Int, Boolean>>()
              private lateinit var router: DesktopKeyboardRouter
              private fun install() {
                  router = DesktopKeyboardRouter { key, down -> events.add(key to down) }.apply { setActive(true) }
                  compose.setContent {
                      val focus = remember { FocusRequester() }
                      var text by remember { mutableStateOf("") }
                      BasicTextField(value=text,onValueChange={ text=it },
                          modifier=Modifier.size(1.dp).desktopKeyEvents(router).focusRequester(focus),
                          keyboardOptions=KeyboardOptions(showKeyboardOnFocus=false))
                      LaunchedEffect(Unit) { focus.requestFocus() }
                  }
                  compose.waitForIdle()
              }
              private fun send(action: Int, code: Int, meta: Int=0, soft: Boolean=false) {
                  compose.runOnIdle {
                      val now=android.os.SystemClock.uptimeMillis()
                      val event=KeyEvent(now,now,action,code,0,meta,if(soft) -1 else 1,0,
                          if(soft) KeyEvent.FLAG_SOFT_KEYBOARD else 0,InputDevice.SOURCE_KEYBOARD)
                      assertTrue(compose.activity.dispatchKeyEvent(event))
                  }
              }
              @Test fun softKeyboardArrowEventsReachRemoteRouter() {
                  install();send(0,KeyEvent.KEYCODE_DPAD_UP,soft=true);send(1,KeyEvent.KEYCODE_DPAD_UP,soft=true)
                  compose.runOnIdle { assertEquals(listOf(38 to true,38 to false),events) }
              }
              @Test fun hardwareCtrlArrowAndFunctionKeysReachRouter() {
                  install();send(0,KeyEvent.KEYCODE_CTRL_LEFT);send(0,KeyEvent.KEYCODE_DPAD_RIGHT,KeyEvent.META_CTRL_ON)
                  send(1,KeyEvent.KEYCODE_DPAD_RIGHT);send(1,KeyEvent.KEYCODE_CTRL_LEFT)
                  send(0,KeyEvent.KEYCODE_F12);send(1,KeyEvent.KEYCODE_F12)
                  compose.runOnIdle { assertEquals(listOf(17 to true,39 to true,39 to false,17 to false,123 to true,123 to false),events) }
              }
              @Test fun disablingInputReleasesHeldKeys() {
                  install();send(0,KeyEvent.KEYCODE_ALT_LEFT);send(0,KeyEvent.KEYCODE_TAB,KeyEvent.META_ALT_ON)
                  compose.runOnIdle {
                      router.setActive(false)
                      assertEquals(listOf(18 to true,9 to true,9 to false,18 to false),events)
                  }
              }
          }
          '''
          newfiles['docs/desktop-keyboard-input.md'] = '''# Desktop native keyboard events

          Desktop only, based on dev/main 2f61dbf. The existing hidden text field now intercepts mapped Android key down/up before default caret/focus processing; consumed keys are not also sent by text edits. Hardware focus does not require opening the soft keyboard. IME text callbacks and existing Unicode transport are preserved, not rewritten. Tests dispatch soft-keyboard-flagged arrow events as well as physical Ctrl/arrows/F12; this is not a test of the actual Hacker's Keyboard APK.

          Mapping covers letters, digits, OEM punctuation, arrows, Tab/Enter/Escape, Backspace/Delete, Insert, Home/End, PageUp/PageDown, F1-F12, keypad, locks, PrintScreen/Break, modifiers and context menu when delivered by Android. Left/right modifiers normalize to generic remote VKs. Pressed keys are reference-counted, repeats generate repeated downs without extra ups, implicit meta modifiers are balanced, and losing focus/activity/connection/dialog ownership releases tracked keys best-effort without replay. Android system Home/Back/power/volume and unknown codes pass through. Unsupported ACTION_MULTIPLE is left to the existing input path.

          Limitations: remote layout, AltGr, lock/numpad state, sided modifiers, Unicode/composition behavior, mixed toolbar input, games/raw scan-code consumers, secure OS chords and Android-intercepted shortcuts are not universally guaranteed. Existing single-key/combo/text senders remain unchanged. No protocol redesign, clipboard, mouse, terminal or version changes. Releasing during an already-broken transport cannot guarantee the remote OS receives key-up.

          CI compiles app/tests, runs JVM mapping/state tests, native Compose dispatch tests and existing terminal regressions. Device validation remains required with Hacker's Keyboard, a physical keyboard and Windows/Linux hosts, especially locale/accents, IME text, held modifiers, repeats and focus/disconnect recovery. No key content logging is added.
          '''
          prepared = {}
          for name, replacements in edits.items():
              content = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if content.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  content = content.replace(old, new, 1)
              prepared[name] = content
          for name, content in newfiles.items():
              if Path(name).exists():
                  raise RuntimeError('New target already exists: ' + name)
              prepared[name] = content
          for content in prepared.values():
              content.encode('utf-8')
          for name, content in prepared.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing terminal JavaScript regressions
        run: |
          node app/src/test/js/terminal-keys.test.js
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Desktop keyboard and terminal interaction regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.desktop.DesktopKeyboardInputTest,iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalFocusWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalKeyBarTest --no-daemon --stacktrace
      - name: Publish verified desktop input on dev only
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/dev | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/dev-desktop-keyboard.yml
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardRouter.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardInput.kt app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardRouterTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/desktop/DesktopKeyboardInputTest.kt docs/desktop-keyboard-input.md .github/workflows/dev-desktop-keyboard.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: handle native IME and hardware desktop key events'
          git push origin HEAD:refs/heads/dev
      - name: Upload reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-desktop-keyboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
