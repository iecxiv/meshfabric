name: Validate remote resume and device card gestures
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/validate-resume-card.yml']
permissions:
  contents: write
concurrency:
  group: validate-resume-card-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare scoped application corrections and regression tests
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='6a846f227f9521e5734fe4cf176501bb6da911ed','Base advanced'
          expected={'app/src/main/java/iecxiv/meshfabric/MainActivity.kt':'9de893f0e6e13351db591e1c07b16d770d53f99d','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt':'f31e895a07f8976353474b10e46765df50ebe776','app/src/main/AndroidManifest.xml':'1c26a636f73a36965cb94f5e2becd65cd716464c'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          p=Path('app/src/main/java/iecxiv/meshfabric/MainActivity.kt');s=p.read_text()
          s=s.replace('class MainActivity : ComponentActivity() {','class MainActivity : ComponentActivity() {\n    private val remoteRuntime by lazy { androidx.lifecycle.ViewModelProvider(this)[RemoteSessionRuntime::class.java] }\n    private var runtimeReady = false',1)
          s,count=re.subn(r'    private lateinit var (sessionManager|meshClient|desktopClient|terminalClient|fileClient|loginViewModel|deviceListViewModel|desktopViewModel|terminalViewModel|fileManagerViewModel|settingsViewModel): [A-Za-z]+',lambda m:'    private val '+m[1]+' get() = remoteRuntime.'+m[1],s)
          assert count==11,count
          s=s.replace('::desktopViewModel.isInitialized','runtimeReady')
          s=s.replace('!::terminalClient.isInitialized ||\n            !::desktopClient.isInitialized || !::fileClient.isInitialized','!runtimeReady')
          a=s.index('        sessionManager = SessionManager(applicationContext)');b=s.index('        DeviceChatKeepAlive.onChanged = chatSessionsChanged',a)
          s=s[:a]+'        remoteRuntime\n        runtimeReady = true\n'+s[b:]
          a=s.index('        val isSaveBuffersEnabled = sessionManager.isSaveTerminalBuffersEnabled()');b=s.index('        KeepAliveService.onTaskRemovedListener =',a)
          s=s[:a]+s[b:]
          assert s.count('val navController = rememberNavController()')==1
          s=s.replace('val navController = rememberNavController()','val navController = rememberSessionNavController(remoteRuntime)',1)
          assert '::terminalClient' not in s and '::desktopClient' not in s
          p.write_text(s)
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt');s=p.read_text()
          old='    Card(Modifier.fillMaxWidth().padding(vertical=4.dp).combinedClickable(\n        enabled = onStartSelection != null || selectionMode,\n        onClick = { onToggleSelection?.invoke() }, onLongClick = { onStartSelection?.invoke() }),'
          new='    Card(Modifier.fillMaxWidth().padding(vertical=4.dp).testTag("device_card_${node.id}").combinedClickable(\n        onClick = { if (selectionMode) onToggleSelection?.invoke() else otherExpanded = !otherExpanded },\n        onLongClick = onStartSelection),'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='Surface(Modifier.size(40.dp),shape=CircleShape'
          assert s.count(old)==1;s=s.replace(old,'Surface(Modifier.size(40.dp).testTag("device_icon_${node.id}"),shape=CircleShape',1)
          old='modifier=Modifier.weight(1f,fill=false),'
          assert s.count(old)==1;s=s.replace(old,'modifier=Modifier.weight(1f,fill=false).testTag("device_title_${node.id}"),',1)
          p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml');s=p.read_text();old='android:name=".MainActivity"'
          assert s.count(old)==1;s=s.replace(old,old+'\n            android:launchMode="singleTop"',1);p.write_text(s)
          files={}
          files['app/src/main/java/iecxiv/meshfabric/RemoteSessionRuntime.kt']='''package iecxiv.meshfabric
          import android.app.Application
          import android.os.Bundle
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.ViewModelStore
          import iecxiv.meshfabric.data.local.SessionManager
          import iecxiv.meshfabric.data.remote.*
          import iecxiv.meshfabric.ui.desktop.RemoteDesktopViewModel
          import iecxiv.meshfabric.ui.devices.DeviceListViewModel
          import iecxiv.meshfabric.ui.files.FileManagerViewModel
          import iecxiv.meshfabric.ui.login.LoginViewModel
          import iecxiv.meshfabric.ui.settings.SettingsViewModel
          import iecxiv.meshfabric.ui.terminal.TerminalViewModel
          internal class RemoteSessionRuntime(application: Application) : AndroidViewModel(application) {
              private val children = ViewModelStore()
              val sessionManager = SessionManager(application)
              val meshClient = MeshCentralClient()
              val desktopClient = DesktopRelayClient()
              val terminalClient = TerminalRelayClient().also {
                  it.configureHistory(application, meshClient, sessionManager)
                  it.initBuffersFromDisk(application, meshClient, sessionManager.isSaveTerminalBuffersEnabled())
              }
              val fileClient = FileRelayClient()
              private fun <T : ViewModel> owned(type: Class<T>, factory: () -> T): T =
                  ViewModelProvider(children, object : ViewModelProvider.Factory {
                      @Suppress("UNCHECKED_CAST")
                      override fun <V : ViewModel> create(modelClass: Class<V>): V = factory() as V
                  })[type]
              val loginViewModel = owned(LoginViewModel::class.java) { LoginViewModel(application, meshClient, sessionManager) }
              val deviceListViewModel = owned(DeviceListViewModel::class.java) { DeviceListViewModel(meshClient, desktopClient, terminalClient, fileClient, sessionManager) }
              val desktopViewModel = owned(RemoteDesktopViewModel::class.java) { RemoteDesktopViewModel(meshClient, desktopClient, sessionManager) }
              val terminalViewModel = owned(TerminalViewModel::class.java) { TerminalViewModel(meshClient, terminalClient) }
              val fileManagerViewModel = owned(FileManagerViewModel::class.java) { FileManagerViewModel(meshClient, fileClient) }
              val settingsViewModel = owned(SettingsViewModel::class.java) { SettingsViewModel(sessionManager) }
              var navigationState: Bundle? = null
                  private set
              fun rememberNavigation(state: Bundle?) { if (state != null) navigationState = Bundle(state) }
              override fun onCleared() {
                  terminalClient.saveAllBuffersAndClose(getApplication(), sessionManager.isSaveTerminalBuffersEnabled())
                  children.clear()
                  meshClient.disconnect()
                  desktopClient.disconnectAll()
                  fileClient.disconnectAll()
                  navigationState = null
                  super.onCleared()
              }
          }
          '''
          files['app/src/main/java/iecxiv/meshfabric/SessionNavigation.kt']='''package iecxiv.meshfabric
          import androidx.compose.runtime.*
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import androidx.navigation.NavController
          import androidx.navigation.NavHostController
          import androidx.navigation.compose.rememberNavController
          @Composable
          internal fun rememberSessionNavController(runtime: RemoteSessionRuntime): NavHostController {
              val controller = rememberNavController()
              remember(controller, runtime) {
                  runtime.navigationState?.let { controller.restoreState(it) }
                  true
              }
              val owner = LocalLifecycleOwner.current
              DisposableEffect(controller, runtime, owner) {
                  val listener = NavController.OnDestinationChangedListener { _, _, _ ->
                      runtime.rememberNavigation(controller.saveState())
                  }
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_STOP) runtime.rememberNavigation(controller.saveState())
                  }
                  controller.addOnDestinationChangedListener(listener)
                  owner.lifecycle.addObserver(observer)
                  onDispose {
                      runtime.rememberNavigation(controller.saveState())
                      controller.removeOnDestinationChangedListener(listener)
                      owner.lifecycle.removeObserver(observer)
                  }
              }
              return controller
          }
          '''
          files['app/src/androidTest/java/iecxiv/meshfabric/SessionResumeAndDeviceCardTest.kt']='''package iecxiv.meshfabric
          import android.app.Application
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.ViewModelProvider
          import androidx.navigation.NavHostController
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.test.core.app.ActivityScenario
          import androidx.test.core.app.ApplicationProvider
          import iecxiv.meshfabric.data.model.MeshNode
          import iecxiv.meshfabric.ui.devices.DeviceCard
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          class SessionResumeAndDeviceCardTest {
              @get:Rule val rule = createComposeRule()
              private val node = MeshNode(id="node//resume",name="Resume device",conn=1)
              private fun icon() = rule.onNodeWithTag("device_icon_${node.id}",useUnmergedTree=true)
              private fun title() = rule.onNodeWithTag("device_title_${node.id}",useUnmergedTree=true)
              private fun card() = rule.onNodeWithTag("device_card_${node.id}",useUnmergedTree=true)
              private fun options() = rule.onNodeWithTag("device_options_row",useUnmergedTree=true)
              @Test fun cardTapTargetsToggleButButtonsDoNotToggle() {
                  var opened=0
                  rule.setContent { MaterialTheme { DeviceCard(node,onOpenDesktop={opened++},onOpenTerminal={opened++},onOpenFiles={opened++}) } }
                  options().assertDoesNotExist()
                  icon().performTouchInput { click() }; options().assertIsDisplayed()
                  title().performTouchInput { click() }; options().assertDoesNotExist()
                  card().performTouchInput { click(Offset(2f,center.y)) }; options().assertIsDisplayed()
                  card().performTouchInput { click(Offset(2f,center.y)) }; options().assertDoesNotExist()
                  val context=ApplicationProvider.getApplicationContext<Application>()
                  listOf(R.string.desktop,R.string.terminal,R.string.files).forEach { label ->
                      rule.onNodeWithText(context.getString(label)).performClick(); options().assertDoesNotExist()
                  }
                  rule.runOnIdle { assertEquals(3,opened) }
                  rule.onNodeWithTag("device_options_toggle").performClick(); options().assertIsDisplayed()
                  rule.onNodeWithTag("device_options_toggle").performClick(); options().assertDoesNotExist()
              }
              @Test fun scrollingDoesNotToggleAndSelectionRemainsAvailable() {
                  val selecting=mutableStateOf(false)
                  var selections=0
                  rule.setContent { MaterialTheme { Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                      Spacer(Modifier.height(200.dp))
                      DeviceCard(node,onOpenDesktop={},onOpenTerminal={},onOpenFiles={},selectionMode=selecting.value,
                          onToggleSelection={selections++},onStartSelection={selecting.value=true})
                      Spacer(Modifier.height(1400.dp))
                  } } }
                  icon().performTouchInput { down(center); moveBy(Offset(0f,-120f),delayMillis=180); up() }
                  options().assertDoesNotExist()
                  card().performScrollTo()
                  title().performTouchInput { longClick() }
                  rule.runOnIdle { assertTrue(selecting.value) }
                  icon().performTouchInput { click() }
                  rule.runOnIdle { assertEquals(1,selections) }; options().assertDoesNotExist()
              }
              @Test fun scrollingExpandedCardDoesNotCollapseIt() {
                  lateinit var scroll: androidx.compose.foundation.ScrollState
                  rule.setContent { MaterialTheme {
                      scroll=rememberScrollState()
                      Column(Modifier.fillMaxSize().verticalScroll(scroll)) {
                          Spacer(Modifier.height(200.dp))
                          DeviceCard(node,onOpenDesktop={},onOpenTerminal={},onOpenFiles={})
                          Spacer(Modifier.height(1400.dp))
                      }
                  } }
                  icon().performTouchInput { click() }; options().assertIsDisplayed()
                  icon().performTouchInput { down(center); moveBy(Offset(0f,-120f),delayMillis=180); up() }
                  rule.runOnIdle { assertTrue(scroll.value>0) }
                  options().assertExists()
              }
              @Test fun allRemoteDestinationsSurviveNavigationStateRestoration() {
                  val runtime=RemoteSessionRuntime(ApplicationProvider.getApplicationContext())
                  val showing=mutableStateOf(true)
                  lateinit var controller: NavHostController
                  rule.setContent { if(showing.value) {
                      controller=rememberSessionNavController(runtime)
                      NavHost(controller,startDestination="devices") {
                          composable("devices") { Text("Home fixture") }
                          listOf("desktop","terminal","files").forEach { screen ->
                              composable("$screen/remote") { Text("$screen fixture") }
                          }
                      }
                  } }
                  listOf("desktop","terminal","files").forEach { screen ->
                      rule.runOnIdle { controller.navigate("$screen/remote") }
                      rule.runOnIdle { showing.value=false }
                      rule.waitForIdle()
                      rule.runOnIdle { showing.value=true }
                      rule.onNodeWithText("$screen fixture").assertIsDisplayed()
                      rule.runOnIdle {
                          assertEquals("$screen/remote",controller.currentDestination?.route)
                          controller.navigate("devices") { popUpTo("devices") { inclusive=true } }
                      }
                  }
              }
              @Test fun actualActivityRecreationRetainsClientsAndViewModels() {
                  lateinit var before: RemoteSessionRuntime
                  ActivityScenario.launch(MainActivity::class.java).use { scenario ->
                      scenario.onActivity { before=ViewModelProvider(it)[RemoteSessionRuntime::class.java] }
                      scenario.recreate()
                      scenario.onActivity {
                          val after=ViewModelProvider(it)[RemoteSessionRuntime::class.java]
                          assertSame(before,after)
                          assertSame(before.meshClient,after.meshClient)
                          assertSame(before.desktopClient,after.desktopClient)
                          assertSame(before.terminalClient,after.terminalClient)
                          assertSame(before.fileClient,after.fileClient)
                          assertSame(before.desktopViewModel,after.desktopViewModel)
                          assertSame(before.terminalViewModel,after.terminalViewModel)
                          assertSame(before.fileManagerViewModel,after.fileManagerViewModel)
                      }
                  }
              }
          }
          '''
          for path,content in files.items():
              p=Path(path);assert not p.exists(),path
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and tests and run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run new regressions and existing UI and storage regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.SessionResumeAndDeviceCardTest,iecxiv.meshfabric.data.local.SessionStorageSafetyTest,iecxiv.meshfabric.ui.management.DeviceGroupSearchTest,iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest,iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest --no-daemon --stacktrace
      - name: Require execution and success of all selected regressions
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={'iecxiv.meshfabric.SessionResumeAndDeviceCardTest','iecxiv.meshfabric.data.local.SessionStorageSafetyTest','iecxiv.meshfabric.ui.management.DeviceGroupSearchTest','iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest','iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest'}
          reports=list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          assert reports,'No instrumentation reports'
          cases=[case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
          assert expected <= {case.get('classname') for case in cases},'Missing expected test classes'
          assert sum(case.get('classname')=='iecxiv.meshfabric.SessionResumeAndDeviceCardTest' for case in cases)>=5,'New regressions did not all execute'
          assert all(case.find('failure') is None and case.find('error') is None and case.find('skipped') is None for case in cases),'Failed or skipped regressions'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-card-validation-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish validated corrections only on unchanged dev and retire this workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; do not publish'
          modified={'app/src/main/java/iecxiv/meshfabric/MainActivity.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt','app/src/main/AndroidManifest.xml'}
          added={'app/src/main/java/iecxiv/meshfabric/RemoteSessionRuntime.kt','app/src/main/java/iecxiv/meshfabric/SessionNavigation.kt','app/src/androidTest/java/iecxiv/meshfabric/SessionResumeAndDeviceCardTest.kt'}
          assert set(git('diff','--name-only').splitlines())==modified
          assert set(git('ls-files','--others','--exclude-standard').splitlines())==added
          temporary='.github/workflows/validate-resume-card.yml'
          Path(temporary).unlink()
          allowed=modified|added|{temporary}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: retain remote session navigation and toggle device cards without scroll activation'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
