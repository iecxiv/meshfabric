name: Validate consistent search toggles
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/search-toggles.yml']
permissions:
  contents: write
concurrency:
  group: search-toggles-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 5B only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui')
          expected={'components/MeshFabricAppBar.kt':'cd3127d602df77baaf74550b87f2333877e282d2','management/EventsHeaderPresentation.kt':'8f3c20e3c88f26e449fdc717a9c7cf64415cd9dd','management/NoticeHeaderSearch.kt':'8aea88edfdd77183848f619346523d0e71255a49','files/FileManagerScreen.kt':'9ecc9cfb46ea7f5e8a5b29b063af890904762ff4'}
          def replace(old,new):
              global s
              assert s.count(old)==1,(str(p),old)
              s=s.replace(old,new,1)
          for name,sha in expected.items():
              p=root/name
              assert git('hash-object',str(p))==sha
              s=p.read_text()
              if name.startswith('components/'):
                  replace('Icon(if(showSearch) Icons.Default.Close else Icons.Default.Search,contentDescription=stringResource(R.string.search),modifier=Modifier.size(20.dp))','Icon(if(showSearch) Icons.Default.Close else Icons.Default.Search,contentDescription=stringResource(R.string.search),modifier=Modifier.size(20.dp),tint=if(showSearch) Color(0xFF2196F3) else LocalContentColor.current)')
              elif 'EventsHeader' in name:
                  replace('Icon(if(expanded) Icons.Default.Close else Icons.Default.Search,stringResource(R.string.search),Modifier.size(20.dp))','Icon(if(expanded) Icons.Default.Close else Icons.Default.Search,stringResource(R.string.search),Modifier.size(20.dp),tint=if(expanded) androidx.compose.ui.graphics.Color(0xFF2196F3) else LocalContentColor.current)')
              elif 'NoticeHeader' in name:
                  replace('import androidx.compose.runtime.Composable','import androidx.compose.runtime.*\nimport androidx.compose.ui.focus.focusRequester')
                  replace('    IconButton(onClick={if(state.open) keyboard?.hide();onToggle()},','    val focus=androidx.compose.ui.platform.LocalFocusManager.current\n    IconButton(onClick={if(state.open) {focus.clearFocus(force=true);keyboard?.hide()};onToggle()},')
                  replace('Icon(if(state.open) Icons.Default.Close else Icons.Default.Search,','Icon(if(state.open) Icons.Default.Close else Icons.Default.Search,tint=if(state.open) androidx.compose.ui.graphics.Color(0xFF2196F3) else LocalContentColor.current,')
                  old='    if(state.open) OutlinedTextField(state.query,onQuery,label={Text(if(es) "Buscar destinatario" else "Search recipients")},singleLine=true,modifier=Modifier.fillMaxWidth().testTag("notice-search-input"))'
                  new='''    if(state.open) {
                      val requester=remember {androidx.compose.ui.focus.FocusRequester()}
                      val keyboard=LocalSoftwareKeyboardController.current
                      LaunchedEffect(Unit) {withFrameNanos {};requester.requestFocus();keyboard?.show()}
                      OutlinedTextField(state.query,onQuery,label={Text(if(es) "Buscar destinatario" else "Search recipients")},singleLine=true,modifier=Modifier.fillMaxWidth().focusRequester(requester).testTag("notice-search-input"))
                      }'''
                  replace(old,new)
              else:
                  replace('import androidx.compose.ui.Modifier','import androidx.compose.ui.Modifier\nimport androidx.compose.ui.focus.focusRequester')
                  anchor='    var isSearchActive by remember { mutableStateOf(false) }'
                  replace(anchor,anchor+'''
                      val fileSearchFocus=remember {androidx.compose.ui.focus.FocusRequester()}
                      val fileFocus=androidx.compose.ui.platform.LocalFocusManager.current
                      val fileKeyboard=androidx.compose.ui.platform.LocalSoftwareKeyboardController.current
                      val closeFileSearch:()->Unit={isSearchActive=false;searchQuery="";fileFocus.clearFocus(force=true);fileKeyboard?.hide()}
                      LaunchedEffect(isSearchActive) {if(isSearchActive) {withFrameNanos {};fileSearchFocus.requestFocus();fileKeyboard?.show()}}
                  ''')
                  replace('''                            isSearchActive = false
                                      searchQuery = ""'''.replace('                                      searchQuery','                            searchQuery'),'                            closeFileSearch()')
                  replace('onClick = { isSearchActive = !isSearchActive }','onClick = { if(isSearchActive) closeFileSearch() else isSearchActive=true }')
                  replace('if (isSearchActive) Icons.Default.Clear else Icons.Default.Search','if (isSearchActive) Icons.Default.Close else Icons.Default.Search')
                  replace('''                            singleLine = true,
                                      modifier = Modifier.fillMaxWidth()
                                  )'''.replace('                                      modifier','                            modifier').replace('                                  )','                        )'),'''                            singleLine = true,
                                      modifier = Modifier.fillMaxWidth().focusRequester(fileSearchFocus)
                                  )'''.replace('                                      modifier','                            modifier').replace('                                  )','                        )'))
                  replace('''                                contentDescription = stringResource(R.string.search)
                                      )'''.replace('                                      )','                            )'),'''                                contentDescription = stringResource(R.string.search),
                                          tint = if(isSearchActive) Color(0xFF2196F3) else MaterialTheme.colorScheme.onSurfaceVariant
                                      )'''.replace('                                          tint','                                tint').replace('                                      )','                            )'))
              p.write_text(s)
          assert set(git('diff','--name-only').splitlines())=={str(root/name) for name in expected}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-toggles-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 5B and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/search-toggles.yml'
          Path(workflow).unlink()
          root='app/src/main/java/iecxiv/meshfabric/ui/'
          paths=[root+p for p in ['components/MeshFabricAppBar.kt','management/EventsHeaderPresentation.kt','management/NoticeHeaderSearch.kt','files/FileManagerScreen.kt']]+[workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(search): use blue close icons and clear focus when closing searches'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
