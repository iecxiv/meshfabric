name: Publish device-card interface IPv4
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-device-interface-ipv4.yml]
permissions:
  contents: write
concurrency:
  group: publish-device-interface-ipv4-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = bad255e49dcc475dab0b156670e13bee5418bcc5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved per-node interface IPv4 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == 'a7ee84e4a7f2d1f0336e719ebb8c85549ab73ee5db3219bd03bfa21168adff87'
          exec(compile(source, 'approved_device_interface_ipv4', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Compile APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/data/model/Models.kt app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/DeviceNetworkIpv4.kt app/src/main/java/iecxiv/meshfabric/data/remote/DeviceNetworkInfoCache.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt app/src/test/java/iecxiv/meshfabric/data/remote/DeviceNetworkIpv4Test.kt docs/device-card-interface-ipv4.md
          git rm .github/workflows/publish-device-interface-ipv4.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(devices): display per-node network interface IPv4 addresses'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-interface-ipv4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
