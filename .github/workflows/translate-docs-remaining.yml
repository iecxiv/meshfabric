name: Publish remaining Spanish technical guides
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/translate-docs-remaining.yml']
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Translate remaining guides and validate local links
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/remaining-docs-base"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          translations = {
              'terminal-selection-copy.md': '''# Mejora de interacción 1: selección y copia

          Añade un menú de herramientas del terminal y un diálogo nativo de captura de solo lectura. La selección mediante pulsación larga usa SelectionContainer de Compose, no selección DOM sobre el lienzo del terminal. La selección parcial se copia mediante la barra nativa; Copiar todo copia exactamente la captura. La copia siempre la inicia el usuario y nunca envía entrada al shell remoto. Es una captura independiente, no selección directa sobre el terminal activo.

          La extracción usa únicamente las API públicas de líneas del búfer activo de xterm. Une los ajustes visuales de línea y conserva los saltos reales. Omite el relleno vacío del área visible. Los límites son 2000 filas recientes y 200000 unidades UTF-16; el truncamiento se indica y no corta pares sustitutos. No se captura el búfer normal oculto mientras nano usa el alternativo.

          La lectura nativa se puede cancelar y vence a los tres segundos. Cerrar el diálogo cancela su corrutina: los callbacks tardíos no pueden reabrirlo ni rellenarlo. El texto solo permanece transitoriamente en memoria de interfaz, sin logs ni persistencia. Seleccionar no pausa el terminal ni altera el cursor de entrega, el redimensionado o el protocolo.

          Tanto la copia parcial como la completa usan un ClipboardManager local al diálogo que marca el contenido como sensible para ocultar la vista previa de Android. Esto no cifra el portapapeles ni impide leer el texto a otras aplicaciones autorizadas. Android 13 y posteriores aportan su propia confirmación de copia; solo las versiones anteriores muestran un Toast.

          Verificación: nuevas pruebas JavaScript puras de capturas y pruebas existentes del runtime. Los casos Android WebView también comprueban el texto capturado; un caso con colores ANSI comprueba que se copian caracteres renderizados y no secuencias de escape. Otra prueba instrumentada verifica el texto de ClipData y sus metadatos sensibles. CI debe compilar app/pruebas y ejecutar JVM, Node y las pruebas Android específicas antes de publicar. Sigue siendo necesaria la verificación física de tiradores de selección, desplazamiento al seleccionar, orientación horizontal, barra del portapapeles y estado retenido del terminal.

          Este commit excluye deliberadamente el pegado, el comportamiento IME/foco y el rediseño de teclas especiales/desplazamiento.
          ''',
              'terminal-paste.md': '''# Pegado explícito en el terminal

          Menú → Pegar desde Android → vista previa completa desplazable → confirmar. El portapapeles se lee únicamente mediante esa acción, como texto plano y sin conversión de URI. No se añade Intro; los saltos de línea existentes pueden ejecutar comandos y requieren aceptación expresa. Límite: 16384 unidades UTF-16, rechazando el exceso en lugar de truncarlo. Se rechazan controles no admitidos, incrustaciones/aislamientos bidireccionales y pares sustitutos malformados. La entrada usa la API pública de pegado de xterm incluido y su comportamiento de pegado entre delimitadores/finales de línea.

          Un envío por vista previa, sin reintentos automáticos, logs ni persistencia. El callback de envío no confirma recepción remota; un tiempo de espera deja el resultado desconocido y solicita revisar el terminal antes de otro intento. Cancelar no deshace entrada enviada. No cambian el editor de comandos, foco, IME, teclas, entrega de salida, redimensionado ni recuperación existentes.

          CI: pruebas Node/JVM existentes, pruebas de políticas y casos con xterm real en WebView de una línea sin Intro extra, CRLF, texto multilínea entre delimitadores e inyección de escapes; compilar app y APK de pruebas, ejecutar emulador y después publicar. Quedan comprobaciones en dispositivo: vista previa/desplazamiento, aceptación/cancelación, portapapeles vacío y desconexión. No se garantiza que el contenido del portapapeles ni los comandos sean seguros.
          ''',
              'terminal-paste-edit.md': '''# Pegado con edición

          El menú de herramientas conserva Seleccionar y copiar y Pegar desde Android, y añade Pegar con edición como tercera entrada. Solo lee el portapapeles mediante esa acción explícita y precarga la captura de texto plano aceptada en un editor multilínea. Un portapapeles vacío o rechazado inicia el editor vacío y muestra el motivo.

          Solo Enviar texto envía el borrador editado por la ruta de pegado existente, sin añadir Intro. Intro dentro del editor inserta un salto de línea; no envía. La aceptación de texto multilínea se vincula al texto actual: modificar un texto aceptado la restablece. Las ediciones inválidas se rechazan completas, conservando el último borrador y mostrando un error; confirmar permanece desactivado hasta una edición válida. No hay truncamiento silencioso. Cerrar descarta el borrador, sin sobrescribir el portapapeles ni registrar o persistir su contenido.

          Se reutilizan límites de pegado, validación de controles/Unicode, protección de intento único, comprobaciones del renderizador, pegado entre delimitadores y resultado desconocido sin reintento. El pegado de solo lectura y la salida/transporte del terminal no cambian. CI compila app y APK de pruebas, ejecuta todas las pruebas JVM/Node y regresiones WebView existentes de eco/copia/pegado. Sigue siendo necesaria la verificación en dispositivo de editor/IME, contenido editado enviado, cancelación, restablecimiento de aceptación y disposición del diálogo con teclado.
          ''',
              'terminal-special-keys.md': '''# Teclas especiales y comodidad del historial

          Fila inicial: Esc, Tab, Ctrl+C, Intro y Retroceso. Se pueden expandir las teclas de navegación/edición, el selector Ctrl A–Z, Ctrl+Z/X/O/W y el control fijo de última salida. Los botones reservan al menos 48 dp por dimensión; las filas se desplazan horizontalmente. El selector Ctrl envía un atajo elegido, no activa un modificador persistente del IME. Sin conexión, la entrada se desactiva, pero el historial retenido sano sigue disponible.

          Se usa la API pública de entrada de xterm incluido y el puente onData/nativo existente. Flechas/Inicio/Fin respetan applicationCursorKeysMode. Se conserva el byte 8 para Retroceso y CR para Intro. No hay repetición al mantener pulsado ni reintentos. RePág/AvPág/Inicio/Fin son teclas remotas. Última salida hace scrollToBottom local solo en el búfer normal, sin enviar entrada; el búfer alternativo muestra información localizada. El foco del desplegable usa el control de superposiciones existente; se permite el envío deliberado del atajo mientras se cierra. No cambian CSS, física/sensibilidad de desplazamiento, seguimiento de salida, máquina de foco, flags IME, editor de comandos ni versión (1.1.1/código 1).

          CI: comprobaciones de codificación, pruebas Compose de tamaño/expansión/desactivación/envío único, secuencias normales/de aplicación con xterm real y pruebas de historial sin entrada; regresiones existentes de foco, eco, copia, pegado y tacto. Quedan pruebas en dispositivo de escalado de fuente, espacio horizontal/IME, editores remotos y disposición percibida. Enviar no confirma ejecución remota.
          ''',
              'terminal-touch-scroll.md': '''# Solo enrutamiento del desplazamiento táctil

          Con un puntero principal grueso, la pantalla renderizada deja pasar las pruebas de impacto al área nativa existente de xterm solo en el búfer normal y con mouseTrackingMode público igual a none. La clase se actualiza después de abrir y después de cada lote de salida procesado, y se elimina al fallar o liberar la vista. Si faltan las API de modo, el paso no se habilita. Los dispositivos de puntero fino y los modos alternativo/con informes de ratón conservan el comportamiento existente. No se añaden eventos sintéticos de rueda, física personalizada, cambios de sensibilidad, reenvío de entrada, cambios de foco/IME, redimensionado ni transporte.

          Contrapartida: mientras está activo este paso móvil, no se conservan la selección directa ni los toques de enlaces sobre el lienzo. Para seleccionar texto usa el menú probado Seleccionar y copiar. Los diálogos nativos de copia/pegado están fuera del selector CSS y no cambian.

          CI reutiliza xterm incluido real y la misma hoja de estilos de producción. Una prueba Android inyecta deslizamientos táctiles sobre texto y columnas vacías, exige que ambos desplacen al menos tres filas, comprueba que las pruebas de impacto alcancen el área visible y verifica la restauración del enrutamiento de ratón y búfer alternativo. También se ejecutan las pruebas existentes de eco/copia/pegado, Node y JVM. Sigue siendo necesaria la confirmación en dispositivo de suavidad percibida, inercia, toques/teclado y posición durante la llegada de salida.
          ''',
              'terminal-renderer-retention.md': '''# Renderizador del terminal retenido tras 40479b0

          ## Alcance

          Cada sesión puede conservar WebView, instancia xterm, cursor de salida, ACK pendiente, desplazamiento/búfer alternativo y tamaño de fuente durante la navegación. Compose crea solo un host FrameLayout. Separar no detiene la carga ni reinicia la entrega; volver a adjuntar no reproduce historial. No cambian la programación del redimensionado, el protocolo PTY ni el runtime JavaScript.

          El puente de la página captura el renderizador/sesión, no un composable ya liberado. Los permisos de asociación impiden que una liberación tardía del host anterior quite la vista de un host nuevo. La salida sigue controlada por el registro acotado y las confirmaciones del parser. No se garantiza salida oculta sin pérdidas si JavaScript se ralentiza tanto que se supera el registro.

          ## Propiedad y memoria

          El ViewModel mantiene en el hilo principal un almacén LRU con límite normal de cuatro renderizadores. Los adjuntos nunca se expulsan; una transición puede superar temporalmente el límite hasta liberar un host. Solo se expulsan los separados. Expulsar destruye el WebView sin desconectar el PTY remoto. Reabrir usa la reproducción del registro existente, con sus limitaciones para pantallas alternativas y flujos truncados. No es retención ilimitada.

          MutableContextWrapper usa el contexto del host actual solo mientras está adjunto y vuelve al contexto de aplicación al separarse/destruirse. No se retienen intencionadamente Activities antiguas tras liberarlas. Detener sesión, cerrar sesión de cuenta y limpiar el ViewModel liberan los renderizadores. El renderizador elimina su padre, cancela el trabajo de salida, invalida tokens, elimina el puente y destruye el WebView exactamente una vez. Nunca se llama a pauseTimers porque afectaría a otros WebView.

          Perder el proceso del renderizador libera la vista inutilizable y muestra un error localizado, sin reconectar automáticamente el shell remoto. Reabrir crea otro renderizador, no restaura una instantánea VT. Se bloquea la navegación incrustada para mantener el puente JavaScript en la página local del terminal.

          ## Verificación

          Once pruebas JVM nuevas cubren reutilización, aislamiento, reemplazo, eliminación, limpieza, LRU, protección de vistas adjuntas y liberaciones obsoletas. CI debe ejecutar también JavaScript, pipeline y preparación existentes y compilar el APK debug antes de publicar. Estas pruebas unitarias no ejercitan un WebView ni un IME reales.

          Sigue siendo necesaria la aceptación en dispositivo: ejecutar nano, ir a Dispositivos y volver repetidamente, comprobar que no se reproduce historial ni se abre otro shell, cambiar fuente y volver, alternar dos terminales, girar y mostrar/ocultar teclado, desconectar una sesión, cerrar sesión de cuenta y probar un quinto terminal para observar el límite de caché. La retención ante cambios de configuración depende de que sobreviva el ámbito existente del ViewModel; la muerte del proceso no conserva el WebView.
          ''',
              'terminal-output-step.md': '''# Entrega de salida del terminal tras 32a5aaf

          ## Alcance

          No cambian la programación del redimensionado, mensajes de tamaño PTY, negociación, codificación de entrada, atajos ni retención WebView. Es un paso de entrega sobre la fase 1 validada y el control de preparación.

          Un registro por sesión almacena como máximo 1048576 unidades UTF-16, aproximadamente 2 MiB de caracteres más sobrecarga del runtime. Cada lectura tiene una época del flujo y un cursor absoluto. Las revisiones StateFlow solo despiertan al lector; agrupar notificaciones no omite por sí mismo salida almacenada. SharedFlow antiguo permanece por compatibilidad de API, pero la vista ya no lo consume.

          Un WebView envía como máximo un lote de 16384 unidades hasta que el callback de xterm.write confirma su token. Terminar evaluateJavascript no equivale a terminar el parser. Las confirmaciones de vistas antiguas, incorrectas o duplicadas no avanzan el cursor. Las lecturas no dividen pares sustitutos UTF-16.

          Si el registro acotado ya no contiene un intervalo necesario o se ha borrado el historial, la entrega se detiene de forma visible. No avanza silenciosamente ni desconecta/reinicia el shell remoto. El error pide desconectar y crear otra sesión si no puede restaurarse la continuidad. Es entrega acotada con detección de huecos, no contrapresión ilimitada ni de red.

          ## Pendiente en esta fase

          - Retener emulador/WebView durante navegación y cambios de configuración.
          - Instantáneas VT exactas: el historial en disco sigue siendo ANSI sin procesar y puede estar truncado. Este cambio no hace correcta la reproducción con otra geometría.
          - Recuperación del proceso del renderizador y tiempo límite ACK consciente del primer plano. Un ACK ausente deja un lote pendiente; el registro sigue acotado y una reanudación posterior puede detectar un hueco.
          - La decodificación incremental UTF-8 del transporte y los cambios de protocolo siguen excluidos deliberadamente tras la regresión anterior.

          ## Verificación

          Catorce casos Kotlin/JUnit nuevos del pipeline, seis de preparación existentes y 21 JavaScript (14 existentes y siete nuevos). GitHub Actions debe superar Node, assembleDebug y testDebugUnitTest antes de publicar el commit funcional. Esto no sustituye pruebas físicas.

          Comprobaciones en dispositivo: historial seguido de salida continua al abrir, navegación rápida de ida/vuelta, varias sesiones, salida rápida, teclado con nano, giro, fuente, lectura de historial y atajos. No afirmar entrega sin pérdidas tras la muerte del proceso ni al reconectar un PTY remoto.
          ''',
              'terminal-readiness-step.md': '''# Terminal: preparación tras la fase 1 validada

          Este paso no reintroduce la fase 2 rechazada del protocolo de transporte.

          ## Cambios

          - Kotlin ya no inicializa el historial ni inicia el colector en directo 150 ms después de onPageFinished.
          - Solo la señal onHtmlReady del runtime puede inicializar la vista.
          - Un control de generación de página y la comprobación exacta de identidad WebView rechazan callbacks tardíos de vistas liberadas o reemplazadas.
          - Las señales repetidas inicializan una página como máximo una vez.
          - Liberar invalida el token de página sin cambiar la política existente de retención de sesiones.

          ## Sin cambios

          Se mantienen el runtime JavaScript de fase 1, su coordinador de redimensionado de 120 ms, comportamiento Kotlin de relay/protocolo/UTF-8, atajos y diálogo de comandos.

          ## Limitaciones

          Refuerza la inicialización, no completa la refactorización del ciclo de vida. Quedan sin resolver retención WebView, recuperación del proceso del renderizador, reproducción ANSI sin procesar y traspaso atómico entre historial y flujo en directo. No corrige la saturación SharedFlow. No afirma salida sin pérdidas ni estabilidad de nano más allá de la validación de fase 1 del usuario.

          ## Validación

          Se aportan seis casos JUnit para el control de generación. Requieren ejecutarse en el proyecto Android; el entorno generador no tiene compilador Kotlin/JVM. El aplicador Python se prueba por separado con repositorios Git locales desechables. Esas comprobaciones no compilan Kotlin ni ejercitan Android WebView.

          En dispositivo: abrir en frío, navegar fuera/dentro rápidamente, repetir con nano, mostrar/ocultar teclado, girar, cambiar fuente y comprobar atajos/diálogo de comandos. Este paso no introduce reconexión forzada del terminal.
          ''',
              'terminal-refactor.md': '''# Refactorización del terminal: fase 1

          ## Alcance

          Mantener las versiones incluidas de xterm.js y FitAddon y la API del puente Android existente. Sustituir JavaScript en línea por un runtime y un coordinador de redimensionado comprobable independientemente. No cambiar escritorio, archivos, autenticación ni enrutamiento de sockets.

          - Un único coordinador con ejecución 120 ms después del último cambio de contenedor, orientación, área visual o fuente.
          - Medir mediante FitAddon.proposeDimensions(), sin campos privados de xterm ni métricas de caracteres estimadas en el código de aplicación.
          - Una geometría inválida u oculta nunca sustituye la última cuadrícula válida.
          - Esperar a la escritura activa del parser antes de redimensionar.
          - Serializar escrituras con el callback de finalización de xterm; preservar el búfer alternativo y la posición del historial del usuario.
          - Restaurar el CSS nativo del área visible de xterm en vez de forzar scrollTop o desactivar dicha área.
          - Conservar finales de línea del terminal (convertEol=false).
          - Limitar la salida JavaScript pendiente a 2 Mi unidades UTF-16, incluida la escritura en curso. El desbordamiento muestra un error explícito en vez de corromper silenciosamente el flujo. No es contrapresión de extremo a extremo.
          - Los errores de inicialización no envían la señal JavaScript de preparación.

          ## Pruebas automatizadas

          Ejecutar desde la raíz con Node.js:

          ```bash
          node app/src/test/js/terminal-runtime.test.js
          ```

          Usan objetos simulados de terminal/puente. No validan renderizado xterm real, disposición WebView, IME Android ni PTY remoto.

          ## Trabajo pendiente conocido en esta fase

          Este commit no completa la refactorización. TerminalScreen conserva la alternativa de preparación onPageFinished y la reproducción de historial sin procesar. No cambian tryEmit de SharedFlow en Kotlin, decodificación UTF-8 por paquete, propiedad WebView/sesión ni las tres variantes de mensajes remotos de tamaño. Investigar el protocolo de tamaño admitido por el agente MeshCentral antes de sustituirlas. El orden JavaScript no garantiza ausencia de pérdidas anteriores en la cadena.

          ## Matriz de aceptación en dispositivo, todavía no ejecutada

          Probar shell y nano mostrando/ocultando teclado, ida/vuelta vertical/horizontal, cambios de fuente, navegación, salida rápida, selección/pegado y lectura de historial. Verificar `stty size` remoto frente a la cuadrícula mostrada. Una pantalla estática no debe reconectar. Inspeccionar barra de estado y cursor de nano tras cada redimensionado. Cubrir varias sesiones y pérdida de red sin asumir que un PTY antiguo sobrevive a otro túnel.
          ''',
              'terminal-typed-receive.md': '''# Recepción tipada del terminal y pruebas de eco con WebView real

          La salida binaria WebSocket se entrega directamente a handleTerminalOutput y nunca se interpreta como negociación c/cr/1. Se conserva la compatibilidad de negociación mediante tramas de texto antes de conectar; el texto ya conectado usa el mismo publicador de salida. No cambian paquetes de tamaño, retención del renderizador, codificación de entrada ni eco local.

          Cuatro casos instrumentados Android ejercitan los manejadores de recepción TerminalSession de producción, el registro y la entrega con ACK del parser; después inspeccionan el búfer xterm incluido real en un WebView Android. Cubren ac1b y cc11 como caracteres binarios/de texto aislados. El socket es simulado y no se usan comandos remotos ni credenciales. La página de pruebas envuelve el constructor Terminal incluido únicamente en su HTML sintético; no se añade un punto de inspección a los recursos de producción. No reproducen una conexión de red MeshCentral completa ni entrada de teclado Android.

          Los builds debug registran como máximo 64 metadatos de tramas por sesión y sus longitudes/revisiones de salida bajo TerminalEcho. Los logs contienen tipo, longitudes e indicadores de conexión, nunca texto del terminal ni pulsaciones. Si persiste el síntoma en dispositivo, hacen falta estas trazas para localizar la pérdida restante; este cambio no establece por sí solo la causa anterior en el runtime.

          La Activity auxiliar y su entrada de manifiesto no exportada solo existen en debug. CI ejecuta JavaScript/unitarias existentes, compila app y APK instrumentado y ejecuta los cuatro casos WebView en un emulador API 35 antes de publicar. Sigue siendo necesaria la validación física.
          ''',
              'windows-file-drives.md': '''# Navegación por unidades Windows

          Los nodos Windows identificados por su descripción del sistema solicitan el selector virtual con ls y path "". La interfaz mantiene "/" como ubicación lógica del selector; Linux sigue solicitando "/" sin cambios. Solo aparecen las unidades realmente devueltas por el agente.

          Las respuestas usan t=1 y n/name, con metadatos dt/s/f opcionales. Se aceptan variantes normales y recovery-core y los alias dir/files/list. Las rutas son absolutas, con separadores Windows normalizados, y nunca se prefijan con la raíz virtual. Unidades, discos extraíbles y unidades ópticas tienen filas solo de navegación; se omiten capacidades desconocidas. Subir desde una unidad, punto de montaje de volumen en caché o recurso UNC vuelve al selector. El botón Unidades de cabecera vuelve directamente.

          Se conservan identificadores de solicitudes de navegación, épocas de socket, solicitudes en cola y reconexión existentes. Las respuestas antiguas de raíz no sobrescriben una selección de carpeta posterior. Se bloquean creación, subida y pegado en el selector, y las acciones de modificación sobre raíces de unidades. No cambian las operaciones de carpetas normales ni las transferencias en segundo plano.

          Las pruebas JVM cubren rutas solicitadas, metadatos modernos/de recuperación, tamaños desconocidos, entradas inseguras/duplicadas, volúmenes montados, raíces UNC, rutas Linux y respuestas obsoletas. Se requiere todavía validación con agentes Windows reales, cambios de unidades, permisos, unidades de red desconectadas o mapeadas, reconexión y transferencias dentro de unidades. Los nodos sin descripción Windows no se consideran Windows. Los volúmenes de inventario no se usan para inventar unidades navegables.
          ''',
              'i18n/README.md': '''# Inventario de localización de interfaz: no es una localización completada

          El nombre de versión es 1.1.1; el código permanece en 1. Cuatro módulos revisados de recursos del terminal, con inglés predeterminado, son ahora recursos explícitos values-en. Las claves traducibles predeterminadas tienen cobertura inglesa explícita y se comprueban los marcadores de posición. Esto verifica la estructura de recursos, no el significado de las traducciones.

          Sigue habiendo texto de interfaz escrito directamente en código, especialmente estados de gestión, etiquetas de operaciones, errores y etiquetas del terminal. [candidates.csv](../../i18n/candidates.csv) inventaría literales de Kotlin/Java principales, JS/HTML no vendorizados y atributos XML de interfaz literales. Es heurístico: puede incluir comentarios, claves de protocolo, datos técnicos y cadenas ajenas a la interfaz; el texto interpolado/compuesto y los errores de ejecución/servidor requieren revisión manual. El contenido/contexto de candidatos está acotado. Nunca sustituir a ciegas cadenas de protocolo, comandos o datos del backend. No se leen portapapeles en ejecución, historiales del terminal, credenciales ni contenido de red.

          Este inventario no demuestra que se hayan localizado o traducido todas las frases. all_ui_externalized es deliberadamente false. La migración restante necesita correspondencias de recursos revisadas y resolución segura respecto al ciclo de vida fuera de composables. No se introduce detección automática de idioma ni español como alternativa al inglés.

          La compilación y comprobaciones JVM/Node condicionan la publicación. Lint se recoge por separado y su resultado se registra debajo; un fallo no se considera limpio. Deben revisarse disposición y accesibilidad en inglés/español sobre dispositivo. No cambian foco, teclado, teclas especiales, desplazamiento ni red.

          Resultado de lint: correcto.
          '''
          }
          root = Path('docs')
          out = root / 'es'
          assert out.is_dir()
          readme = Path('README_ES.md')
          r = readme.read_text()
          changed = [readme]
          for name, text in translations.items():
              source = root / name
              target = out / name
              assert source.is_file() and not target.exists(), name
              target.parent.mkdir(parents=True, exist_ok=True)
              english = source.read_text()
              title, rest = english.split('\n', 1)
              en_link = os.path.relpath(target, source.parent).replace(os.sep, '/')
              es_link = os.path.relpath(source, target.parent).replace(os.sep, '/')
              navigation = f'English | [Español]({en_link})'
              assert navigation not in english
              source.write_text(title + '\n\n' + navigation + '\n' + rest)
              es_title, es_rest = text.split('\n', 1)
              target.write_text(es_title + '\n\n' + f'[English]({es_link}) | Español' + '\n' + es_rest)
              assert source.read_text().replace('\n' + navigation + '\n', '', 1) == english
              r = r.replace(f'(docs/{name})', f'(docs/es/{name})')
              changed.extend([source, target])
          r = r.replace('Los documentos técnicos enlazados pueden estar en inglés.', 'La documentación técnica dispone de versiones en inglés y español.')
          index = out / 'README.md'
          assert not index.exists()
          names = sorted([p.name for p in root.glob('*.md')] + ['i18n/README.md'])
          assert len(names) == 17
          assert all((out / name).is_file() for name in names)
          entries = [f'- [{(out / name).read_text().splitlines()[0].removeprefix("# ")}]({name})' for name in names]
          index.write_text('# Documentación técnica en español\n\n[English README](../../README.md) | [README en español](../../README_ES.md)\n\n' + '\n'.join(entries) + '\n\nEstas guías incluyen notas históricas de implementación. Sus referencias a fases, commits, versiones y trabajo pendiente se conservan del documento original y deben interpretarse en ese contexto. Los inventarios técnicos CSV/JSON no se han traducido.\n')
          r += '\n## Índice de documentación técnica\n\nConsulta las [17 guías en español](docs/es/README.md).\n'
          readme.write_text(r)
          changed.append(index)
          for p in changed:
              text = p.read_text()
              assert all(line == line.rstrip() for line in text.splitlines()), str(p)
              for link in re.findall(r'\[[^\]]*\]\(([^\s)]+)\)', text):
                  if '://' in link or link.startswith(('#', 'mailto:')):
                      continue
                  path = link.split('#', 1)[0]
                  assert not path or (p.parent / path).exists(), (str(p), link)
          PY
          git diff --check
      - name: Publish documentation only
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/remaining-docs-base")"
          git add README_ES.md docs/
          git rm .github/workflows/translate-docs-remaining.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: complete Spanish technical guides and language navigation'
          git push origin HEAD:dev
