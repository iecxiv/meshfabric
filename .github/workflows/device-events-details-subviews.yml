name: Validate device Events and Details subviews
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/device-events-details-subviews.yml']
permissions:
  contents: write
concurrency:
  group: device-events-details-subviews-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare guarded device subview navigation
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='252baee6367c68ab786ef8aebd83993610b0bfe3','Base advanced; review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui')
          def edit(name,old,new):
              p=root/name;s=p.read_text();assert s.count(old)==1,(name,old,s.count(old));p.write_text(s.replace(old,new,1))
          edit('devices/DeviceOtherOptions.kt','    val openGeneral=LocalDeviceGeneralOpen.current','    val openGeneral=LocalDeviceGeneralOpen.current\n    val openEvents=LocalDeviceEventsSubviewOpen.current\n    val openDetails=LocalDeviceDetailsSubviewOpen.current')
          edit('devices/DeviceOtherOptions.kt','{ events=true }','{ if(openEvents!=null) openEvents(node) else events=true }')
          edit('devices/DeviceOtherOptions.kt','{ details=true }','{ if(openDetails!=null) openDetails(node) else details=true }')
          edit('devices/DeviceEventsDialog.kt','    val source=LocalDeviceDetailsClient.current','    val inline=LocalDeviceEventsSubviewInline.current\n    val source=LocalDeviceDetailsClient.current')
          edit('devices/DeviceEventsDialog.kt','DeviceGeneralFrame(node,onDismiss,','DeviceGeneralFrame(node,onDismiss,inline=inline,')
          edit('devices/DeviceEventsDialog.kt','TextButton(onClick=onDismiss) {Text(text("Cerrar","Close"))}','TextButton(onClick=onDismiss) {Text(if(inline) text("Volver","Back") else text("Cerrar","Close"))}')
          edit('devices/DeviceDetailsDialog.kt','    var visible by rememberSaveable(node.id) { mutableStateOf(false) }','    val openDetails=LocalDeviceDetailsSubviewOpen.current\n    val embedded=LocalDeviceDetailsInline.current\n    var visible by rememberSaveable(node.id) { mutableStateOf(false) }')
          edit('devices/DeviceDetailsDialog.kt','IconButton(onClick = { visible = true }, modifier','IconButton(onClick = { if(openDetails!=null && !embedded) openDetails(node) else visible=true }, modifier')
          edit('management/MeshFabricHome.kt','iecxiv.meshfabric.ui.devices.LocalDeviceSharingOpen provides {node->generalFocus.clearFocus(force=true);generalKeyboard?.hide();generalNode=node;generalStep=1})','iecxiv.meshfabric.ui.devices.LocalDeviceSharingOpen provides {node->generalFocus.clearFocus(force=true);generalKeyboard?.hide();generalNode=node;generalStep=1},\n        iecxiv.meshfabric.ui.devices.LocalDeviceEventsSubviewOpen provides {node->generalFocus.clearFocus(force=true);generalKeyboard?.hide();generalNode=node;generalStep=3},\n        iecxiv.meshfabric.ui.devices.LocalDeviceDetailsSubviewOpen provides {node->generalFocus.clearFocus(force=true);generalKeyboard?.hide();generalNode=node;generalStep=4})')
          edit('management/MeshFabricHome.kt','                            else->iecxiv.meshfabric.ui.devices.DeviceSharingCreateScreen(target,sharingRights,onBack={generalStep=1},onCreated={})','                            2->iecxiv.meshfabric.ui.devices.DeviceSharingCreateScreen(target,sharingRights,onBack={generalStep=1},onCreated={})\n                            3->iecxiv.meshfabric.ui.devices.DeviceReadSubview(target,events=true,onDismiss={generalNode=null})\n                            else->iecxiv.meshfabric.ui.devices.DeviceReadSubview(target,events=false,onDismiss={generalNode=null})')
          component='''package iecxiv.meshfabric.ui.devices
          import androidx.compose.runtime.*
          import iecxiv.meshfabric.data.model.MeshNode
          internal val LocalDeviceEventsSubviewInline=staticCompositionLocalOf {false}
          internal val LocalDeviceEventsSubviewOpen=staticCompositionLocalOf<((MeshNode)->Unit)?> {null}
          internal val LocalDeviceDetailsSubviewOpen=staticCompositionLocalOf<((MeshNode)->Unit)?> {null}
          @Composable internal fun DeviceReadSubview(node:MeshNode,events:Boolean,onDismiss:()->Unit) {
              key(node.id,events) {
                  if(events) CompositionLocalProvider(LocalDeviceEventsSubviewInline provides true) {DeviceEventsDialog(node,onDismiss=onDismiss)}
                  else CompositionLocalProvider(LocalDeviceDetailsInline provides true) {DeviceDetailsDialog(node,onDismiss=onDismiss)}
              }
          }
          '''
          tests='''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import iecxiv.meshfabric.data.model.MeshNode
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          class DeviceReadSubviewsTest {
              @get:Rule val rule=createComposeRule()
              private val node=MeshNode(id="node//read",name="Device",meshid="mesh//group")
              @Test fun eventsIsInlineAndBackUsesCallback() {
                  var backs=0
                  rule.setContent {MaterialTheme {DeviceReadSubview(node,events=true,onDismiss={backs++})}}
                  rule.onNode(isDialog()).assertDoesNotExist()
                  rule.onNodeWithTag("device_events_search").assertIsDisplayed()
                  rule.onNodeWithTag("device_events_refresh").assertIsNotEnabled()
                  rule.onAllNodesWithTag("subview-header").assertCountEquals(1)
                  rule.onNodeWithTag("device_events_close").performClick()
                  rule.runOnIdle {assertEquals(1,backs)}
              }
              @Test fun detailsIsInlineAndBackUsesCallback() {
                  var backs=0
                  rule.setContent {MaterialTheme {DeviceReadSubview(node,events=false,onDismiss={backs++})}}
                  rule.onNode(isDialog()).assertDoesNotExist()
                  rule.onAllNodesWithTag("subview-header").assertCountEquals(1)
                  rule.onNodeWithTag("subview-back").performClick()
                  rule.runOnIdle {assertEquals(1,backs)}
              }
              @Test fun deviceButtonsRouteWithoutOpeningFallbackDialogs() {
                  var events="";var details=""
                  rule.setContent {MaterialTheme {CompositionLocalProvider(LocalDeviceEventsSubviewOpen provides {events=it.id},LocalDeviceDetailsSubviewOpen provides {details=it.id}) {Column(Modifier.fillMaxWidth()) {DeviceOptionsRow(node)}}}}
                  rule.onNodeWithTag("device_option_events").performScrollTo().performClick()
                  rule.onNodeWithTag("device_option_details").performScrollTo().performClick()
                  rule.onNode(isDialog()).assertDoesNotExist()
                  rule.runOnIdle {assertEquals(node.id,events);assertEquals(node.id,details)}
              }
          }
          '''
          p=root/'devices/DeviceReadSubviews.kt';assert not p.exists();p.write_text(component)
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt');assert not p.exists();p.write_text(tests)
          assert 'nodeId=node.id' in (root/'devices/DeviceEventsDialog.kt').read_text()
          expected={'app/src/main/java/iecxiv/meshfabric/ui/'+p for p in ['devices/DeviceOtherOptions.kt','devices/DeviceEventsDialog.kt','devices/DeviceDetailsDialog.kt','devices/DeviceReadSubviews.kt','management/MeshFabricHome.kt']}|{'app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt'}
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==expected,(actual,expected)
          Path(os.environ['RUNNER_TEMP'],'device-read-subview-paths.json').write_text(json.dumps(sorted(actual)))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Focused inventory and navigation tests
        run: bash ./gradlew :app:testDebugUnitTest --tests 'iecxiv.meshfabric.ui.devices.DeviceInventory*Test' --tests 'iecxiv.meshfabric.ui.devices.NavigationCompletionTest' --no-daemon --stacktrace
      - name: Full validation before publishing
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-read-subview-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/device-read-subview-paths.json
          if-no-files-found: ignore
      - name: Publish only validated changes and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'device-read-subview-paths.json').read_text())
          expected={'app/src/main/java/iecxiv/meshfabric/ui/'+p for p in ['devices/DeviceOtherOptions.kt','devices/DeviceEventsDialog.kt','devices/DeviceDetailsDialog.kt','devices/DeviceReadSubviews.kt','management/MeshFabricHome.kt']}|{'app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt'}
          assert set(paths)==expected
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==expected
          workflow='.github/workflows/device-events-details-subviews.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(devices): integrate Events and Details as device subviews'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
