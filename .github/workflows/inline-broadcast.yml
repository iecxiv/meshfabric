name: Validate inline Broadcast composer
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/inline-broadcast.yml']
permissions:
  contents: write
concurrency:
  group: inline-broadcast-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate existing Broadcast form without changing send policy
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          def apply(name,sha,changes,append=''):
              p=root/name
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha
              original=p.read_text(); updated=original
              undo=[]
              for old,new in changes:
                  assert old and updated.count(old)==1,old
                  position=updated.index(old)
                  undo.append((position,old,new))
                  updated=updated[:position]+new+updated[position+len(old):]
              restored=updated
              for position,old,new in reversed(undo):
                  assert restored[position:position+len(new)]==new
                  restored=restored[:position]+old+restored[position+len(new):]
              assert restored==original
              p.write_text(updated+append)
          helper='''
          @Composable private fun ProfileBroadcastInlineLayout(modifier:Modifier,title:@Composable ()->Unit,text:@Composable ()->Unit,confirmButton:@Composable ()->Unit,dismissButton:@Composable ()->Unit) {
              val context=androidx.compose.ui.platform.LocalContext.current
              val window=remember(context) {
                  var owner:android.content.Context=context
                  while(owner is android.content.ContextWrapper && owner !is android.app.Activity) owner=owner.baseContext
                  requireNotNull((owner as? android.app.Activity)?.window)
              }
              DisposableEffect(window) {
                  val flag=android.view.WindowManager.LayoutParams.FLAG_SECURE
                  val previouslySecure=window.attributes.flags and flag != 0
                  window.addFlags(flag)
                  onDispose {if(!previouslySecure) window.clearFlags(flag)}
              }
              Column(modifier.imePadding().padding(16.dp),verticalArrangement=Arrangement.spacedBy(12.dp)) {
                  ProvideTextStyle(MaterialTheme.typography.headlineSmall) {title()}
                  Column(Modifier.weight(1f).fillMaxWidth().verticalScroll(rememberScrollState())) {text()}
                  androidx.compose.foundation.layout.FlowRow(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.End,verticalArrangement=Arrangement.spacedBy(4.dp)) {
                      dismissButton()
                      confirmButton()
                  }
              }
          }
          '''
          apply('ProfileBroadcastDialog.kt','e169d7e4ac71867739652017b7014b74ff21a27d',[
              ('import androidx.compose.ui.window.DialogProperties\n',''),
              ('import androidx.compose.ui.window.SecureFlagPolicy\n',''),
              ('@Composable internal fun ProfileBroadcastDialog(session:ProfileSession,s:ProfileState,onDismiss:()->Unit)',
               '@Composable internal fun ProfileBroadcastPane(session:ProfileSession,s:ProfileState,modifier:Modifier=Modifier,onDismiss:()->Unit)'),
              ('ManagementDialog(onDismissRequest=onDismiss,modifier=Modifier.widthIn(max=640.dp).fillMaxWidth(0.94f),properties=DialogProperties(securePolicy=SecureFlagPolicy.SecureOn,usePlatformDefaultWidth=false,dismissOnClickOutside=false),title=',
               'ProfileBroadcastInlineLayout(modifier=modifier,title='),
              ('Column(Modifier.fillMaxWidth().heightIn(max=(LocalConfiguration.current.screenHeightDp*0.68f).dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp))',
               'Column(Modifier.fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(8.dp))'),
              ('minLines=3,maxLines=6','minLines=6,maxLines=12')
          ],helper)
          apply('ProfileScreen.kt','f9c4ef1fcba1d629e1765aaeaf7ec97a0155dee7',[
              ('var broadcast by remember { mutableStateOf(false) }',
               'var broadcast by remember { mutableStateOf(false) }\nval directoryListState=androidx.compose.foundation.lazy.rememberLazyListState()\nandroidx.activity.compose.BackHandler(enabled=broadcast && form==null && groupDetails==null) {broadcast=false}'),
              ('else if(section=="userGroups") UserGroupsDirectoryPane',
               'else if(broadcast && section=="users") ProfileBroadcastPane(session,state,Modifier.weight(1f).fillMaxWidth()) {broadcast=false} else if(section=="userGroups") UserGroupsDirectoryPane'),
              ('LazyColumn(Modifier.weight(1f).fillMaxWidth(),contentPadding=managementConnectionContentPadding',
               'LazyColumn(Modifier.weight(1f).fillMaxWidth(),state=directoryListState,contentPadding=managementConnectionContentPadding'),
              ('if(broadcast && form==null && groupDetails==null) ProfileBroadcastDialog(session,state) {broadcast=false}\n','')
          ])
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={str(root/'ProfileScreen.kt'),str(root/'ProfileBroadcastDialog.kt')}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-broadcast-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated composer and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/inline-broadcast.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/management/ProfileBroadcastDialog.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(broadcast): integrate composer and review into Users view'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
