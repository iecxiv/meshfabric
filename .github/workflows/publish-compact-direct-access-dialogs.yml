name: Validate compact direct access dialogs
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-compact-direct-access-dialogs.yml]
permissions:
  contents: write
concurrency:
  group: compact-direct-access-dev
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate compact presentation only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8e3aa255dee8cdbcd96367aaa5aa82589a54ea65
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          files=[('UserMeshAssignmentReview.kt','3c119fc6b4c9a9fe545a8ee94eb60a524b5d4762','Text(beforeServer,','Text(t("Grupo de dispositivos: '),('UserMeshEditDialog.kt','a1470e6594c34508a6d867aff849a28fe5267939','Text(server,','Text(t("Grupo de dispositivos: ')]
          for name,sha,start,end in files:
              p=root/name
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha
              s=p.read_text();original=s
              lines=s.splitlines(keepends=True)
              a=[i for i,x in enumerate(lines) if x.strip().startswith(start)]
              b=[i for i,x in enumerate(lines) if x.strip().startswith(end)]
              assert len(a)==len(b)==1 and a[0]<b[0]
              context=''.join(lines[a[0]:b[0]+1])
              replacement='            Surface(Modifier.fillMaxWidth(),shape=MaterialTheme.shapes.small,color=MaterialTheme.colorScheme.surfaceVariant) {\n                Column(Modifier.padding(8.dp),verticalArrangement=Arrangement.spacedBy(2.dp)) {\n'+context+'                }\n            }\n'
              assert s.count(context)==1
              s=s.replace(context,replacement,1)
              anchor='verticalArrangement=Arrangement.spacedBy(8.dp)) {'
              assert s.count(anchor)==1
              s=s.replace(anchor,'verticalArrangement=Arrangement.spacedBy(6.dp)) {',1)
              if name=='UserMeshAssignmentReview.kt':
                  rows=[x for x in s.splitlines(keepends=True) if x.strip().startswith('Text(t("Enlace recibido') or x.strip().startswith('Text(t("Derechos directos del actor: ')]
                  assert len(rows)==3
                  block=''.join(rows)
                  assert block in s
                  compact='            ProfileDisclosure(t("Detalles técnicos de los enlaces","Technical link details")) {\n'+block+'            }\n'
                  s=s.replace(block,compact,1)
                  restored=s.replace(compact,block,1)
              else:
                  restored=s
              restored=restored.replace(replacement,context,1).replace('verticalArrangement=Arrangement.spacedBy(6.dp)) {',anchor,1)
              assert restored==original,'Unexpected nonpresentation modification'
              p.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build execute unit tests compile instrumentation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute complete Android and Compose regression suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-direct-access-validation-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish validated sources only if dev is unchanged
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = dev
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}"
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserMeshAssignmentReview.kt app/src/main/java/iecxiv/meshfabric/ui/management/UserMeshEditDialog.kt
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): compact direct access review and rights editor context'
          git push origin HEAD:dev
