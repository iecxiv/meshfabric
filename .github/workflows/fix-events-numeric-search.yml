name: Fix Events numeric search test and publish validated header changes
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/fix-events-numeric-search.yml
      - .github/scripts/prepare-events-numeric-search.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare unchanged header feature and only the missing test adaptation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 57c5caf03960716e4313d548dc210081220dfb1e
          mkdir -p validation
          python3 .github/scripts/prepare-events-numeric-search.py
          git diff --cached --check
      - name: Compile execute JVM lint and prepare all original Android methods
        run: |
          set -euo pipefail
          python3 -m venv /tmp/events-numeric-search-yaml
          /tmp/events-numeric-search-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/events-numeric-search-yaml/bin/python .github/scripts/prepare-events-numeric-search.py --build
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute all 33 Android methods without skips or reduced assertions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 validation/run-log-class-isolation.py
      - name: Verify exact execution and twelve-file source scope
        run: |
          set -euo pipefail
          /tmp/events-numeric-search-yaml/bin/python .github/scripts/prepare-events-numeric-search.py --verify
          git diff --cached --check
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-numeric-search-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish tested changes only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          expected=json.loads(Path('validation/events-header-expected.json').read_text())
          assert len(expected)==12 and set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(log): publish header search date bands and numeric search regression fix'
          git push origin HEAD:work/registro-server-events
