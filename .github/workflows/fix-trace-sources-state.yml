name: Validate and publish trace source null-state fix
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/fix-trace-sources-state.yml
      - .github/scripts/prepare-trace-sources-state.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare only guarded trace state decoding timeout and regression changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e1c866c3d60ca5bf151f61d25b20e1efeb23ef0b
          mkdir -p validation
          python3 .github/scripts/prepare-trace-sources-state.py
          git diff --cached --check
      - name: Compile execute JVM lint and prepare exact Android regressions
        run: |
          set -euo pipefail
          python3 -m venv /tmp/trace-sources-yaml
          /tmp/trace-sources-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/trace-sources-yaml/bin/python - <<'PY'
          from pathlib import Path
          import ast,subprocess,yaml
          yaml.safe_load(Path('.github/workflows/fix-trace-sources-state.yml').read_text())
          old=yaml.safe_load(subprocess.check_output(['git','show','e1c866c3d60ca5bf151f61d25b20e1efeb23ef0b:.github/workflows/publish-header-refresh.yml'],text=True))
          matches=[s for s in old['jobs']['validate']['steps'] if s.get('name')=='Compile execute JVM lint and prepare exact affected Android runner']
          assert len(matches)==1
          subprocess.run(['bash','-euo','pipefail','-c',matches[0]['run']],check=True)
          p=Path('validation/run-log-class-isolation.py');s=p.read_text();anchor='expected={\n'
          assert s.count(anchor)==1
          extra="    'TraceSourcesChannelTest':{'initialNullEnablesSelectionWithoutWritingGlobalSources','malformedStateIsNotAcceptedAsAnEmptySelection','missingStateTimesOutAndReconnectDoesNotWriteSources','nonAdminCannotUnlockOrChangeSources','userChangeWritesOnceAndOnlyReadbackConfirmsIt','staleSocketCannotUnlockANewConnection'},\n    'ServerConsoleWebViewTest':{'localWebViewConsumesInitialAndUpdatedSnapshotsWithoutServer'},\n"
          s=s.replace(anchor,anchor+extra).replace('Expected: 42 distinct methods across 13 independent class runs.','Expected: 49 distinct methods across 15 independent class runs.')
          ast.parse(s);p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute all 49 affected Android methods independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 validation/run-log-class-isolation.py
      - name: Require exact execution source scope and no automatic trace writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          cases=[]
          for p in Path('app/build/test-results/testDebugUnitTest').rglob('*.xml'): cases.extend(ET.parse(p).getroot().iter('testcase'))
          assert cases and all(all(c.find(t) is None for t in ('failure','error','skipped')) for c in cases)
          for name,count in {'TraceSourcesPolicyTest':8,'HeaderRefreshPolicyTest':6,'ServerEventDaysTest':5,'EventContentTest':10,'ServerEventDetailsPolicyTest':4,'ServerEventsQueryTest':8,'LogEventsReaderTest':12,'ServerEventsReadPolicyTest':9,'ServerEventsDiagnosticsTest':3,'LogNumericMessageTest':8}.items():
              found=[c for c in cases if c.get('classname','').split('.')[-1]==name]
              assert len(found)==count and len({c.get('name') for c in found})==count,name
          results=json.loads(Path('validation/class-isolation/summary.json').read_text())
          required={'TraceSourcesChannelTest':6,'ServerConsoleWebViewTest':1,'HeaderRefreshUiTest':6,'UserGroupsActionsCardTest':1,'UserGroupsSectionSpacingTest':2,'EventsHeaderDatesTest':5,'EventContentUiTest':4,'EventsSelectorWidthTest':5,'EventsPresentationTest':4,'ServerEventsControlsTest':3,'LogNumericMessageUiTest':2,'LogEventsDiagnosticsUiTest':2,'RegistroSectionTabsTest':2,'LogScreenTest':4,'ManagementNavigationLabelTest':2}
          assert len(results)==15 and {r['class'] for r in results}=={'iecxiv.meshfabric.ui.management.'+n for n in required}
          for r in results:
              assert r['passed'] is True and r['exit_code']==0,r
              assert len(r['cases'])==required[r['class'].split('.')[-1]],r
          expected=json.loads(Path('validation/trace-sources-expected.json').read_text())
          assert len(expected)==5 and set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          source=Path('app/src/main/java/iecxiv/meshfabric/ui/management/ServerAdminPanel.kt').read_text()
          assert source.count('put("action","traceinfo")')==1
          Path('validation/trace-sources-tests.json').write_text(json.dumps({'jvm_cases':len(cases),'android_cases':49,'synthetic_channel_verified':True,'live_server_verified':False,'physical_visual_review_verified':False},indent=2)+'\n')
          PY
          git diff --cached --check
          git diff --cached > validation/trace-sources-state.diff
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-sources-state-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish all tested sources only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          expected=json.loads(Path('validation/trace-sources-expected.json').read_text())
          assert len(expected)==5 and set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(server): accept explicit null trace sources and bound missing-state wait'
          git push origin HEAD:work/registro-server-events
