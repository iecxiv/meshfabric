name: Validate trace sources efficiently and publish tested fix
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/fix-trace-sources-state.yml
      - .github/scripts/prepare-trace-sources-state.py
      - .github/scripts/validate-trace-sources-focused.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare the identical approved application correction
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b00e5dc80a924c3d47f228ba900d5f681f3d1c9e
          mkdir -p validation
          python3 .github/scripts/prepare-trace-sources-state.py
          git diff --cached --check
      - name: Ensure required Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build both APKs once run only related JVM tests and lint
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest --tests iecxiv.meshfabric.ui.management.TraceSourcesPolicyTest --tests iecxiv.meshfabric.ui.management.ServerAdminPolicyTest --tests iecxiv.meshfabric.ui.management.ServerConsolePolicyTest --tests iecxiv.meshfabric.ui.management.ServerConsoleSubmissionGateTest --tests iecxiv.meshfabric.ui.management.ServerCsvTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
          python3 .github/scripts/validate-trace-sources-focused.py unit
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install APKs once and execute exactly seven Android methods
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/validate-trace-sources-focused.py android
      - name: Verify raw execution evidence and unchanged application scope
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-trace-sources-focused.py verify
          git diff --cached --check
          git diff --cached > validation/trace-sources-state.diff
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-sources-focused-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish the five tested source and documentation files only
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          python3 .github/scripts/validate-trace-sources-focused.py verify
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(server): accept explicit null trace sources and bound missing-state wait'
          git push origin HEAD:work/registro-server-events
