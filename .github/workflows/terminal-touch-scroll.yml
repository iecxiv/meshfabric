name: Verify native terminal touch scroll
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-touch-scroll.yml]
permissions:
  contents: write
concurrency:
  group: terminal-touch-scroll
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 473fe2c457d81386a05d0025300a74d75f7b0761 HEAD
          git diff --exit-code 473fe2c457d81386a05d0025300a74d75f7b0761 HEAD -- . ':(exclude).github/workflows/terminal-touch-scroll.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply touch-scroll-only patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          sync = r'''  function syncTouchScroll() {
            var container = document.getElementById('terminal-container');
            if (!container || !container.classList) return;
            var enabled = term && !failed && !disposed && term.buffer.active.type === 'normal' &&
              term.modes && term.modes.mouseTrackingMode === 'none';
            container.classList.toggle('mesh-native-touch-scroll', !!enabled);
          }

          '''
          android = r'''    @Test
              @SuppressLint("SetJavaScriptEnabled")
              fun touchScrollOverTextAndBlankUsesNativeViewport() {
                  val bridge = EchoBridge()
                  val gson = Gson()
                  var view: WebView? = null
                  val scenario = ActivityScenario.launch(TerminalEchoTestActivity::class.java)
                  fun evaluate(script: String): String {
                      val ready = CountDownLatch(1)
                      var result = ""
                      scenario.onActivity {
                          view!!.evaluateJavascript(script) { json -> result = json; ready.countDown() }
                      }
                      assertTrue("JavaScript callback timed out", ready.await(10, TimeUnit.SECONDS))
                      return result
                  }
                  fun write(token: String, data: String) {
                      assertEquals("true", evaluate("window.writeTerminalBatch(${gson.toJson(token)},${gson.toJson(data)});"))
                      assertEquals(token, bridge.acknowledgements.poll(10, TimeUnit.SECONDS))
                  }
                  fun classEnabled(): String = evaluate("document.getElementById('terminal-container').classList.contains('mesh-native-touch-scroll');")
                  fun swipe(xRatio: Float): Int {
                      evaluate("window.__echoTerm.scrollToBottom(); true;")
                      android.os.SystemClock.sleep(250)
                      val before = evaluate("window.__echoTerm.buffer.active.viewportY;").toInt()
                      val location = IntArray(2)
                      var width = 0
                      var height = 0
                      scenario.onActivity { view!!.getLocationOnScreen(location); width = view!!.width; height = view!!.height }
                      val down = android.os.SystemClock.uptimeMillis()
                      val automation = androidx.test.platform.app.InstrumentationRegistry.getInstrumentation().uiAutomation
                      fun inject(action: Int, progress: Float) {
                          val event = android.view.MotionEvent.obtain(down, android.os.SystemClock.uptimeMillis(), action,
                              location[0] + width * xRatio, location[1] + height * (0.25f + 0.45f * progress), 0)
                          event.source = android.view.InputDevice.SOURCE_TOUCHSCREEN
                          try { assertTrue(automation.injectInputEvent(event, true)) } finally { event.recycle() }
                      }
                      inject(android.view.MotionEvent.ACTION_DOWN, 0f)
                      for (step in 1..20) {
                          android.os.SystemClock.sleep(12)
                          inject(android.view.MotionEvent.ACTION_MOVE, step / 20f)
                      }
                      inject(android.view.MotionEvent.ACTION_UP, 1f)
                      android.os.SystemClock.sleep(1200)
                      return before - evaluate("window.__echoTerm.buffer.active.viewportY;").toInt()
                  }
                  try {
                      scenario.onActivity { activity ->
                          view = WebView(activity).also {
                              it.settings.javaScriptEnabled = true
                              it.settings.allowFileAccess = true
                              it.addJavascriptInterface(bridge, "AndroidTerminal")
                              activity.host.addView(it, FrameLayout.LayoutParams(-1, -1))
                              it.loadDataWithBaseURL("file:///android_asset/terminal/", HTML, "text/html", "UTF-8", null)
                          }
                      }
                      assertTrue(bridge.ready.await(20, TimeUnit.SECONDS))
                      assertEquals("true", evaluate("window.matchMedia('(pointer: coarse)').matches;"))
                      write("rows", (0..399).joinToString(13.toChar().toString() + 10.toChar()) { "row$it" })
                      assertEquals("true", classEnabled())
                      assertEquals("true", evaluate("getComputedStyle(document.querySelector('.xterm-screen')).pointerEvents === 'none';"))
                      assertEquals("true", evaluate("(function(){var r=document.querySelector('.xterm-screen').getBoundingClientRect();var e=document.elementFromPoint(r.left+5,r.top+5);return !!e && !!e.closest('.xterm-viewport');}());"))
                      assertTrue("Scroll starting over text moved fewer than three rows", swipe(0.02f) >= 3)
                      assertTrue("Scroll starting over blank area moved fewer than three rows", swipe(0.85f) >= 3)
                      val esc = 27.toChar().toString()
                      write("mouse-on", esc + "[?1000h")
                      assertEquals("false", classEnabled())
                      write("mouse-off", esc + "[?1000l")
                      assertEquals("true", classEnabled())
                      write("alternate-on", esc + "[?1049h")
                      assertEquals("false", classEnabled())
                      write("alternate-off", esc + "[?1049l")
                      assertEquals("true", classEnabled())
                  } finally {
                      scenario.onActivity {
                          view?.let { web -> it.host.removeView(web); web.removeJavascriptInterface("AndroidTerminal"); web.destroy() }
                      }
                      scenario.close()
                  }
              }

          '''
          runtime = 'app/src/main/assets/terminal/terminal-runtime.js'
          html = 'app/src/main/assets/terminal/terminal.html'
          test = 'app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt'
          link = '  <link rel="stylesheet" href="xterm.css" />'
          fixture = '          <link rel="stylesheet" href="xterm.css">'
          edits = {
              runtime: [
                  ('  function initialize() {', sync + '  function initialize() {'),
                  ('      term.open(container);', '      term.open(container);\n      syncTouchScroll();'),
                  ('          if (follow && term.buffer.active === buffer', '          syncTouchScroll();\n          if (follow && term.buffer.active === buffer'),
                  ('    failed = true;', '    failed = true;\n    syncTouchScroll();'),
                  ('    disposed = true;', '    disposed = true;\n    syncTouchScroll();')
              ],
              html: [(link, link + '\n  <link rel="stylesheet" href="terminal-touch-scroll.css" />')],
              test: [
                  (fixture, fixture + '\n          <link rel="stylesheet" href="terminal-touch-scroll.css">'),
                  ('    companion object {', android + '    companion object {')
              ]
          }
          newfiles = {
              'app/src/main/assets/terminal/terminal-touch-scroll.css': r'''/* Touch scroll uses the native viewport beneath the rendered rows. */
          @media (pointer: coarse) {
            #terminal-container.mesh-native-touch-scroll .xterm-screen {
              pointer-events: none;
            }
          }
          ''',
              'docs/terminal-touch-scroll.md': r'''# Touch scroll routing only

          On coarse primary pointers, the rendered screen passes hit testing to the existing native xterm viewport only in the normal buffer with public mouseTrackingMode equal to none. The class is updated after opening and after each parsed output batch, and removed on failure/disposal. Missing mode APIs fail closed. Fine-pointer devices and alternate/mouse-reporting modes retain existing hit testing. No synthetic wheel events, custom scrolling physics, sensitivity changes, input forwarding, focus/IME changes, resize or transport changes.

          Tradeoff: direct canvas selection and canvas link taps are not preserved while this mobile pass-through is active. Use the tested Select and copy menu for text selection. The native copy/paste dialogs are outside the CSS selector and unchanged.

          CI reuses the actual bundled xterm and the same stylesheet as production. An Android test injects touchscreen swipes starting on text and blank columns, requiring both to move at least three rows; checks hit testing reaches the viewport; checks restoring mouse and alternate-buffer routing. Existing echo/copy/paste, Node and JVM tests also run. Device confirmation remains necessary for perceived smoothness, inertia, taps/keyboard and scroll position during incoming output.
          '''
          }
          prepared = {}
          for name, replacements in edits.items():
              text = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  text = text.replace(old, new, 1)
              prepared[name] = text
          for name, text in newfiles.items():
              if Path(name).exists():
                  raise RuntimeError('New target already exists: ' + name)
              prepared[name] = text
          for text in prepared.values():
              text.encode('utf-8')
          for name, text in prepared.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          subprocess.run(['node', '--check', 'app/src/main/assets/terminal/terminal-runtime.js'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: JavaScript regressions
        run: |
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real WebView touchscreen and existing regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest --no-daemon --stacktrace
      - name: Publish verified scroll fix
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-touch-scroll.yml
          git add -- app/src/main/assets/terminal/terminal-runtime.js app/src/main/assets/terminal/terminal.html app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt app/src/main/assets/terminal/terminal-touch-scroll.css docs/terminal-touch-scroll.md .github/workflows/terminal-touch-scroll.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: route terminal touch scrolling through native viewport'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-touch-scroll-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
