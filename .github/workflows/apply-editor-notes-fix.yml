name: Apply editor and device notes fix (one shot)
on:
  push:
    branches: [feat/native-management]
    paths: [.github/workflows/apply-editor-notes-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/native-management'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply verified source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('app/src/main/java/iecxiv/meshfabric/ui')
          file = base / 'files/FileManagerScreen.kt'
          notes = base / 'management/MeshFabricDialogs.kt'
          editor = base / 'components/NumberedTextEditor.kt'
          def verify(path, expected):
              data = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Source changed; refusing to overwrite {path}: {actual}')
          verify(file, '8c74d6f40696731481fc0a78b0c1c314515bb1e1')
          verify(notes, '93a294663e811a36463ed0199c48dfd413f1476c')
          if editor.exists():
              raise SystemExit('Shared editor already exists; refusing to overwrite it')
          s = file.read_text()
          start = s.index('                        // Code Editor with Line Numbers and Scroll')
          end = s.index('                        Spacer(modifier = Modifier.height(12.dp))', start)
          s = s[:start] + '                        NumberedTextEditor(\n                            value = editingFileText,\n                            onValueChange = { editingFileText = it },\n                            wordWrap = isWordWrapEnabled,\n                            modifier = Modifier.fillMaxWidth().weight(1f)\n                        )\n\n' + s[end:]
          s = s.replace('import iecxiv.meshfabric.R\n', 'import iecxiv.meshfabric.R\nimport iecxiv.meshfabric.ui.components.NumberedTextEditor\n', 1)
          s = s.replace('            val verticalScrollState = rememberScrollState()\n            val horizontalScrollState = rememberScrollState()\n', '', 1)
          n = notes.read_text()
          n = n.replace('import iecxiv.meshfabric.R\n', 'import iecxiv.meshfabric.R\nimport iecxiv.meshfabric.ui.components.NumberedTextEditor\n', 1)
          n = n.replace('    val busy=notes.phase', '    var wordWrap by remember(notes.nodeId) { mutableStateOf(true) }\n    val busy=notes.phase', 1)
          old = '            if(notes.editable) OutlinedTextField(notes.draft,onChange,Modifier.fillMaxWidth(),label={ Text("Notas") },\n                enabled=!busy,minLines=6,maxLines=12,supportingText={ Text("Guardar el campo vacío elimina las notas existentes.") })'
          new = '            if(notes.editable) {\n                FilterChip(selected=wordWrap,onClick={ wordWrap=!wordWrap },\n                    label={ Text(stringResource(R.string.word_wrap)) })\n                NumberedTextEditor(value=notes.draft,onValueChange=onChange,wordWrap=wordWrap,\n                    enabled=!busy,modifier=Modifier.fillMaxWidth().height(240.dp))\n                Text("Guardar el campo vacío elimina las notas existentes.",style=MaterialTheme.typography.bodySmall)\n            }'
          assert old in n
          n = n.replace(old, new, 1)
          shared = r'''package iecxiv.meshfabric.ui.components

          import android.graphics.Paint
          import android.graphics.Typeface
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.TextLayoutResult
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          internal fun logicalLineStarts(text: String): List<Int> = buildList {
              add(0)
              text.forEachIndexed { index, char -> if (char == '\n') add(index + 1) }
          }

          /** Numbers logical lines, positioning each label at its first visual baseline. */
          @Composable
          internal fun NumberedTextEditor(
              value: String,
              onValueChange: (String) -> Unit,
              wordWrap: Boolean,
              modifier: Modifier = Modifier,
              enabled: Boolean = true
          ) {
              val verticalScroll = rememberScrollState()
              val horizontalScroll = rememberScrollState()
              val density = LocalDensity.current
              val starts = remember(value) { logicalLineStarts(value) }
              var layout by remember { mutableStateOf<TextLayoutResult?>(null) }
              val currentLayout = layout?.takeIf { it.layoutInput.text.text == value }
              val scheme = MaterialTheme.colorScheme
              val numberColor = scheme.onSurfaceVariant.copy(alpha = 0.6f)
              val fontPixels = with(density) { 13.sp.toPx() }
              val paint = remember(fontPixels, numberColor) {
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      textSize = fontPixels
                      typeface = Typeface.MONOSPACE
                      color = numberColor.toArgb()
                      textAlign = Paint.Align.RIGHT
                  }
              }
              val gutterWidth = with(density) {
                  paint.measureText(starts.size.toString()).toDp() + 16.dp
              }
              val contentHeight = with(density) {
                  (currentLayout?.size?.height ?: 0).toDp() + 16.dp
              }
              val shape = RoundedCornerShape(8.dp)
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                  Box(modifier.border(1.dp, scheme.outline, shape)
                      .background(scheme.surfaceVariant.copy(alpha = 0.3f), shape).clip(shape)) {
                      Row(Modifier.fillMaxSize().verticalScroll(verticalScroll)) {
                          Canvas(Modifier.width(gutterWidth).height(contentHeight)
                              .background(scheme.surfaceVariant.copy(alpha = 0.6f))) {
                              val result = currentLayout
                              if (result != null) {
                                  val padding = 8.dp.toPx()
                                  starts.forEachIndexed { index, offset ->
                                      val visualLine = result.getLineForOffset(offset)
                                      drawContext.canvas.nativeCanvas.drawText(
                                          (index + 1).toString(), size.width - padding,
                                          padding + result.getLineBaseline(visualLine), paint
                                      )
                                  }
                              }
                          }
                          Box(Modifier.weight(1f).padding(8.dp).then(
                              if (wordWrap) Modifier else Modifier.horizontalScroll(horizontalScroll)
                          )) {
                              BasicTextField(
                                  value = value,
                                  onValueChange = onValueChange,
                                  enabled = enabled,
                                  modifier = if (wordWrap) Modifier.fillMaxWidth()
                                      else Modifier.defaultMinSize(minWidth = 2000.dp),
                                  textStyle = TextStyle(fontFamily = FontFamily.Monospace,
                                      fontSize = 13.sp, lineHeight = 20.sp, color = scheme.onSurface),
                                  cursorBrush = SolidColor(scheme.primary),
                                  onTextLayout = { layout = it }
                              )
                          }
                      }
                  }
              }
          }
          '''
          file.write_text(s)
          notes.write_text(n)
          editor.write_text(shared)
          PY
          git diff --check
          git rm .github/workflows/apply-editor-notes-fix.yml
          git add app/src/main/java/iecxiv/meshfabric/ui/components/NumberedTextEditor.kt app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricDialogs.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align wrapped editor line numbers and reuse editor for device notes'
          git push origin HEAD:refs/heads/feat/native-management
