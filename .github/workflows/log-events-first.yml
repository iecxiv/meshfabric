name: Validate Events-first Log navigation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/log-events-first.yml']
permissions:
  contents: write
concurrency:
  group: log-events-first-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 4 only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          p=root/'LogScreen.kt'
          t=root/'RegistroSectionTabs.kt'
          assert git('hash-object',str(p))=='891c2b6cd8324bf16bd71951ecf0e183fcff2d4a'
          assert git('hash-object',str(t))=='b11f48827bf13888d9964dbc985254041acbe284'
          original=p.read_text()
          old='var tab by rememberSaveable {mutableIntStateOf(0)}'
          new='var tab by rememberSaveable {mutableIntStateOf(1)}'
          assert original.count(old)==1
          changed=original.replace(old,new,1)
          assert changed.replace(new,old,1)==original
          p.write_text(changed)
          original=t.read_text()
          old='ManagementSectionTabs(listOf(stringResource(R.string.registro_activity),stringResource(R.string.registro_events)),selected.coerceIn(0,1),onSelect)'
          new='ManagementSectionTabs(listOf(stringResource(R.string.registro_events),stringResource(R.string.registro_activity)),1-selected.coerceIn(0,1)) {onSelect(1-it)}'
          assert original.count(old)==1
          t.write_text(original.replace(old,new,1))
          assert set(git('diff','--name-only').splitlines())=={str(p),str(t)}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-events-first-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 4 and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/log-events-first.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/LogScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/management/RegistroSectionTabs.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(log): show Events first and select it by default'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
