name: Validate management header searches
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/profile-header-search.yml']
permissions:
  contents: write
concurrency:
  group: profile-header-search-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 5A only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          p=root/'ProfileScreen.kt'
          u=root/'UserGroupsDirectoryPane.kt'
          assert git('hash-object',str(p))=='4cff4dc7aaf46ff8aef24338c860c68c1eeb2540'
          assert git('hash-object',str(u))=='ff458d0adc74b0014827bc5085ede551043aa48e'
          s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          replace('import androidx.compose.material.icons.filled.Devices','import androidx.compose.material.icons.filled.*\nimport androidx.compose.ui.focus.focusRequester')
          anchor='var groupSearch by rememberSaveable { mutableStateOf("") }'
          replace(anchor,anchor+'''
          var directorySearchOpen by remember(section,agentIdentity) {mutableStateOf(false)}
          val directorySearchFocus=remember {androidx.compose.ui.focus.FocusRequester()}
          val directoryFocus=androidx.compose.ui.platform.LocalFocusManager.current
          val directoryKeyboard=androidx.compose.ui.platform.LocalSoftwareKeyboardController.current
          val closeDirectorySearch:()->Unit={directorySearchOpen=false;groupSearch="";directoryFocus.clearFocus(force=true);directoryKeyboard?.hide()}
          LaunchedEffect(section,agentIdentity) {closeDirectorySearch()}
          androidx.activity.compose.BackHandler(enabled=directorySearchOpen) {closeDirectorySearch()}
          ''')
          old='ProfileStableSectionHeader(header={ProfileRefreshHeader(tab,state,header) {performProfileHeaderRefresh(tab,session)}},tabs={'
          new='''ProfileStableSectionHeader(header={ProfileRefreshHeader(tab,state,header={refresh->header {
          Row(verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy((-6).dp)) {
          refresh()
          if(tab in 1..3) IconButton(onClick={if(directorySearchOpen) closeDirectorySearch() else directorySearchOpen=true},modifier=Modifier.size(38.dp).then(Modifier.testTag("profile-directory-search-toggle"))) {
          Icon(if(directorySearchOpen) Icons.Default.Close else Icons.Default.Search,if(directorySearchOpen) t("Cerrar búsqueda","Close search") else t("Buscar","Search"),Modifier.size(20.dp),tint=if(directorySearchOpen) androidx.compose.ui.graphics.Color(0xFF2196F3) else LocalContentColor.current)
          }
          }
          }}) {performProfileHeaderRefresh(tab,session)}},tabs={'''
          replace(old,new)
          replace('import androidx.compose.ui.platform.LocalConfiguration','import androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.testTag')
          replace('})\nif(tab!=0) ProfileManagementConnectionStatus','''})
          if(tab in 1..3 && directorySearchOpen) {
          LaunchedEffect(Unit) {withFrameNanos {};directorySearchFocus.requestFocus();directoryKeyboard?.show()}
          OutlinedTextField(groupSearch,{groupSearch=it.take(256)},singleLine=true,
          placeholder={Text(if(tab==2) t("Buscar usuarios","Search users") else t("Buscar grupos","Search groups"))},
          modifier=Modifier.fillMaxWidth().padding(horizontal=16.dp,vertical=8.dp).focusRequester(directorySearchFocus).testTag("profile-directory-search-input"))
          }
          if(tab!=0) ProfileManagementConnectionStatus''')
          replace('UserGroupsDirectoryPane(session,state,Modifier.weight(1f).fillMaxWidth(),onOpenUser=','UserGroupsDirectoryPane(session,state,Modifier.weight(1f).fillMaxWidth(),query=groupSearch,onOpenUser=')
          replace('val rows=if(users) state.users else state.groups.filter { deviceGroupMatches(groupSearch,it.optString("name"),it.optString("desc")) }','val rows=if(users) state.users.filter {user->groupSearch.isBlank() || listOf(profileReviewIdentity(user,state.users,es).label,user.optString("name"),user.optString("email")).any {it.contains(groupSearch,true)}} else state.groups.filter { deviceGroupMatches(groupSearch,it.optString("name"),it.optString("desc")) }')
          replace('if(!users) OutlinedTextField(groupSearch,{groupSearch=it.take(256)},label={Text(t("Buscar grupo","Search groups"))},singleLine=true,modifier=Modifier.fillMaxWidth())','')
          p.write_text(s)
          s=u.read_text()
          replace('onOpenDeviceGroup:(String)->Unit) {','onOpenDeviceGroup:(String)->Unit,query:String="") {')
          replace('    var query by rememberSaveable(s.id) { mutableStateOf("") }','')
          replace('OutlinedTextField(query,{query=it.take(256)},label={Text(t("Buscar grupo","Search groups"))},singleLine=true,modifier=Modifier.fillMaxWidth())','')
          u.write_text(s)
          assert set(git('diff','--name-only').splitlines())=={str(p),str(u)}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-header-search-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 5A and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/profile-header-search.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(management): move directory searches to header with blue close action'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
