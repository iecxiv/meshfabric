name: Completed transfer notification ticks
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-completed-transfer-ticks.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: completed-transfer-ticks
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply two targeted icon changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt')
          s = p.read_text()
          assert Path('app/src/main/res/drawable/ic_stat_transfer_success.xml').is_file()
          for title in ('Descarga completada', 'Subida completada'):
              old = '.setSmallIcon(R.drawable.ic_stat_remote)\n                .setContentTitle("' + title + '")'
              new = old.replace('R.drawable.ic_stat_remote', 'R.drawable.ic_stat_transfer_success')
              assert s.count(old) == 1, 'Completion notification changed: ' + title
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Compile and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt
          git rm .github/workflows/publish-completed-transfer-ticks.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: show success tick on completed download and upload notifications'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-transfer-ticks-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
