name: Publish 1.2.8 UI privacy and shortcut icons
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-ui-privacy-128.yml]
permissions:
  contents: write
concurrency:
  group: publish-ui-privacy-128-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 99809978e156600b917821752fbfe6ebe461e714
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved UI and version changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == '18fb8a9b18addb1f4f27836ca6394fd2a7c4e8ba299d56ca221903a9d2edff69'
          exec(compile(source, 'approved_ui_privacy_128', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Build APKs and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify APK version without changing versionCode
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          tool = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '35.0.0', 'aapt')
          package = subprocess.check_output([tool, 'dump', 'badging', 'app/build/outputs/apk/debug/app-debug.apk'], text=True).splitlines()[0]
          assert "versionName='1.2.8'" in package, package
          assert "versionCode='1'" in package, package
          PY
      - name: Publish verified implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/build.gradle.kts app/src/main/java/iecxiv/meshfabric/data/local/SessionManager.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceNetworkDisplay.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopShortcutSections.kt app/src/test/java/iecxiv/meshfabric/ui/devices/DeviceNetworkDisplayTest.kt app/src/androidTest/java/iecxiv/meshfabric/data/local/DeviceNetworkVisibilityPersistenceTest.kt docs/device-card-interface-ipv4.md
          git rm .github/workflows/publish-ui-privacy-128.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): add persistent network privacy toggle and shortcut icons for 1.2.8'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-privacy-1.2.8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
