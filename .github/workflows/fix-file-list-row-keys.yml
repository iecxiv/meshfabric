name: Fix duplicate file browser row keys
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-file-list-row-keys.yml']
permissions:
  contents: write
concurrency:
  group: fix-file-list-row-keys
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded duplicate-safe row identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          root = Path('app/src/main/java/iecxiv/meshfabric/ui/files')
          p = root/'FileManagerScreen.kt'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == 'ee27b4df4a170508f24d69b566f9364f12d16649', 'File screen changed; review required'
          s = p.read_text()
          anchor = '    val filteredList = remember(fileList, searchQuery) {'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '''    val filteredRows = remember(fileList, searchQuery) {
                  fileListRows(fileList).filter { row ->
                      searchQuery.isBlank() || row.item.name.contains(searchQuery, ignoreCase = true)
                  }
              }

          ''' + anchor, 1)
          pattern = r'items\(\s*filteredList\s*,\s*key\s*=\s*\{[^\n]*?\}\s*\)\s*\{\s*(\w+)\s*->'
          matches = list(re.finditer(pattern,s))
          assert len(matches) == 1, 'Unexpected file list layout; review required'
          m = matches[0]
          replacement = 'items(filteredRows, key = { it.key }) { fileRow ->\n                        val ' + m.group(1) + ' = fileRow.item'
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          helper = root/'FileListRows.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.ui.files

          import iecxiv.meshfabric.data.model.FileItem

          internal data class FileListRow(val key: String, val item: FileItem)

          internal fun fileListRows(items: List<FileItem>): List<FileListRow> {
              val occurrences = mutableMapOf<FileItem, Int>()
              return items.map { item ->
                  val ordinal = occurrences[item] ?: 0
                  occurrences[item] = ordinal + 1
                  val identity = listOf(item.path, item.name, item.isDir.toString(),
                      item.size.toString(), item.modifiedTime.toString())
                      .joinToString("") { value -> "${value.length}:$value" }
                  FileListRow("file:$identity#$ordinal", item)
              }
          }
          ''')
          test = Path('app/src/test/java/iecxiv/meshfabric/ui/files/FileListRowsTest.kt')
          assert not test.exists()
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.ui.files

          import iecxiv.meshfabric.data.model.FileItem
          import org.junit.Assert.*
          import org.junit.Test

          class FileListRowsTest {
              private val first = FileItem(name="recording.mp4", path="/Videos/recording.mp4", size=124630927L, modifiedTime=1792525816L)
              private val second = first.copy(size=2589962L, modifiedTime=1792526121L)

              @Test fun homonymousVideosKeepBothRowsAndTheirOriginalObjects() {
                  val rows = fileListRows(listOf(first,second))
                  assertEquals(2,rows.size)
                  assertEquals(2,rows.map { it.key }.toSet().size)
                  assertSame(first,rows[0].item)
                  assertSame(second,rows[1].item)
              }
              @Test fun identicalMetadataStillHasUniqueKeysWithoutDroppingEntries() {
                  val input = List(36) { first.copy() }
                  val rows = fileListRows(input)
                  assertEquals(input,rows.map { it.item })
                  assertEquals(36,rows.map { it.key }.toSet().size)
              }
              @Test fun keysAreDeterministicAndStableWhenDistinctRowsAreReordered() {
                  val forward = fileListRows(listOf(first,second))
                  val reverse = fileListRows(listOf(second,first))
                  assertEquals(forward,fileListRows(listOf(first,second)))
                  assertEquals(forward[0].key,reverse[1].key)
                  assertEquals(forward[1].key,reverse[0].key)
              }
              @Test fun filteringAfterKeyAssignmentRetainsDuplicateIdentity() {
                  val rows = fileListRows(listOf(first,first.copy()))
                  assertEquals(rows.map { it.key },rows.filter { it.item.name.contains("record") }.map { it.key })
              }
              @Test fun windowsAndLinuxPathsAndEmptyListsAreUnchanged() {
                  val input = listOf(FileItem(name="C:",isDir=true,path="C:/"),FileItem(name="log",path="/var/log"))
                  assertEquals(input,fileListRows(input).map { it.item })
                  assertTrue(fileListRows(emptyList()).isEmpty())
              }
              @Test fun delimiterCharactersCannotCreateIdentityCollisions() {
                  val input = listOf(first.copy(path="a|b",name="c"),first.copy(path="a",name="b|c"))
                  assertEquals(2,fileListRows(input).map { it.key }.toSet().size)
              }
          }
          ''')
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated row key fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt app/src/main/java/iecxiv/meshfabric/ui/files/FileListRows.kt app/src/test/java/iecxiv/meshfabric/ui/files/FileListRowsTest.kt
          git rm .github/workflows/fix-file-list-row-keys.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve duplicate media entries with unique file browser row keys'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-list-row-keys-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
