name: Validate section alignment and versionName 1.4.2
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/section-alignment-version142.yml']
permissions:
  contents: write
concurrency:
  group: section-alignment-version142-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate embedded Python syntax
        shell: python
        run: |
          import ast,textwrap
          from pathlib import Path
          lines=Path('.github/workflows/section-alignment-version142.yml').read_text().splitlines();checked=0
          for i,line in enumerate(lines):
              if line!='        run: |': continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '): break
                  body.append(following)
              ast.parse(textwrap.dedent('\n'.join(body))+'\n');checked+=1
          assert checked==4,checked
      - name: Prepare only section alignment tests and versionName
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='54d7a7d3cd3308d6aacf4220c14adb191236e55f','Base advanced; review required'
          changed=set()
          def edit(path,old,new):
              p=Path(path);text=p.read_text();assert text.count(old)==1,(path,old,text.count(old));p.write_text(text.replace(old,new,1));changed.add(path)
          activity='app/src/main/java/iecxiv/meshfabric/ui/components/MeshFabricAppBar.kt'
          old='Column(Modifier.fillMaxSize().padding(padding).consumeWindowInsets(padding).padding(iecxiv.meshfabric.ui.management.registrationBottomFlushPadding),\n            verticalArrangement=Arrangement.spacedBy(4.dp)) {'
          edit(activity,old,'Column(Modifier.fillMaxSize().padding(padding).consumeWindowInsets(padding)) {')
          old='iecxiv.meshfabric.ui.management.ManagementConnectionStatus(ready=actionsReady,connecting=iecxiv.meshfabric.ui.management.actionChannelConnecting(actionsStatus),reconnectEnabled=connected,onReconnect=onReconnect)'
          new='iecxiv.meshfabric.ui.management.ManagementConnectionStatus(ready=actionsReady,connecting=iecxiv.meshfabric.ui.management.actionChannelConnecting(actionsStatus),reconnectEnabled=connected,modifier=Modifier.padding(horizontal=16.dp),onReconnect=onReconnect)'
          edit(activity,old,new)
          edit(activity,'ActivityTimeline(journal,feedback,Modifier.weight(1f),query=search)','ActivityTimeline(journal,feedback,Modifier.weight(1f).padding(iecxiv.meshfabric.ui.management.registrationBottomFlushPadding),query=search)')
          spacing='app/src/main/java/iecxiv/meshfabric/ui/management/ManagementConnectionSpacing.kt'
          edit(spacing,'internal val noticeInboxBottomFlushPadding=PaddingValues(start=16.dp,top=16.dp,end=16.dp,bottom=0.dp)','internal val noticeInboxBottomFlushPadding=PaddingValues(start=16.dp,top=0.dp,end=16.dp,bottom=0.dp)')
          test='app/src/test/java/iecxiv/meshfabric/ui/management/BottomContentSpacingTest.kt'
          edit(test,'fun topAndSideMarginsRemainUnchanged()','fun sectionTopSpacingAndSideMarginsAreConsistent()')
          edit(test,'assertEquals(16.dp,noticeInboxBottomFlushPadding.calculateTopPadding())','assertEquals(0.dp,noticeInboxBottomFlushPadding.calculateTopPadding())')
          build='app/build.gradle.kts'
          before=Path(build).read_text()
          edit(build,'versionName = "1.4.1"','versionName = "1.4.2"')
          assert Path(build).read_text().replace('versionName = "1.4.2"','versionName = "1.4.1"',1)==before
          expected={activity,spacing,test,build}
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==expected and actual==expected
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests execute unit tests and lint
        shell: bash
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/section-alignment-build.log"
      - name: Verify actual APK versionName
        shell: python
        run: |
          import json
          from pathlib import Path
          data=json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert data.get('applicationId')=='iecxiv.meshfabric'
          assert data.get('variantName')=='debug'
          elements=data.get('elements',[])
          assert len(elements)==1 and elements[0].get('versionName')=='1.4.2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-alignment-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/output-metadata.json
            ${{ runner.temp }}/section-alignment-build.log
          if-no-files-found: ignore
      - name: Apply validated changes only to dev and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=['app/build.gradle.kts','app/src/main/java/iecxiv/meshfabric/ui/components/MeshFabricAppBar.kt','app/src/main/java/iecxiv/meshfabric/ui/management/ManagementConnectionSpacing.kt','app/src/test/java/iecxiv/meshfabric/ui/management/BottomContentSpacingTest.kt']
          workflow='.github/workflows/section-alignment-version142.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui: align activity and inbox spacing; bump versionName to 1.4.2'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
