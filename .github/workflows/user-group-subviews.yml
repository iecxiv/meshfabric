name: Validate user group action subviews
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/user-group-subviews.yml']
permissions:
  contents: write
concurrency:
  group: user-group-subviews-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check syntax of all embedded Python blocks
        shell: python
        run: |
          import ast,textwrap
          from pathlib import Path
          lines=Path('.github/workflows/user-group-subviews.yml').read_text().splitlines()
          checked=0
          for i,line in enumerate(lines):
              if line!='        run: |': continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '): break
                  body.append(following)
              ast.parse(textwrap.dedent('\n'.join(body))+'\n')
              checked+=1
          assert checked==3,checked
      - name: Prepare scoped UI migration without changing operations
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='3b2e5ced205c3ddc6171c89c6eb9e4346fd40c4d','Base advanced; review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          changed=set()
          def edit(name,old,new):
              p=root/name;t=p.read_text();assert t.count(old)==1,(name,old,t.count(old));p.write_text(t.replace(old,new,1));changed.add(str(p))
          actions=['UserGroupEditDialog.kt','UserGroupDeleteDialog.kt','UserGroupMemberAddDialog.kt','UserGroupMemberRemoveDialog.kt','GroupMeshGrantDialog.kt','GroupMeshEditDialog.kt','GroupMeshAssignmentReview.kt']
          for name in actions:
              edit(name,'ManagementDialog(onDismissRequest=','ProfileUserDetailSurface(inline=LocalUserGroupActionsInline.current,onDismissRequest=')
          edit('UserGroupsDirectoryPane.kt','    Box(modifier) {','    CompositionLocalProvider(LocalUserGroupActionsInline provides true) {\n    Box(modifier) {')
          edit('UserGroupsDirectoryPane.kt','.blockCoveredNavigation(creating && editing==null)','.blockCoveredNavigation(userGroupSubviewActive(creating,editing!=null,deleting!=null,removing!=null,adding!=null,grantingMesh!=null,reviewingMesh!=null,editingMesh!=null))')
          edit('UserGroupsDirectoryPane.kt','}\ngrantingMesh?.let {GroupMeshGrantDialog','grantingMesh?.let {GroupMeshGrantDialog')
          tail='editingMesh?.let {(gid,mid)->key(gid,mid) {GroupMeshEditDialog(session,s,gid,mid) {editingMesh=null}}}\n}'
          edit('UserGroupsDirectoryPane.kt',tail,tail[:-1]+'}\n}\n}')
          p=root/'UserGroupActionSubview.kt';assert not p.exists()
          p.write_text('package iecxiv.meshfabric.ui.management\nimport androidx.compose.runtime.staticCompositionLocalOf\ninternal val LocalUserGroupActionsInline=staticCompositionLocalOf {false}\ninternal fun userGroupSubviewActive(vararg states:Boolean)=states.any {it}\n');changed.add(str(p))
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupActionSubviewTest.kt');assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''package iecxiv.meshfabric.ui.management
          import org.junit.Assert.*
          import org.junit.Test
          class UserGroupActionSubviewTest {
              @Test fun directoryRemainsAvailableWithoutActions() {
                  assertFalse(userGroupSubviewActive(*BooleanArray(8)))
              }
              @Test fun everyActionCoversTheDirectory() {
                  for(index in 0 until 8) {
                      val states=BooleanArray(8);states[index]=true
                      assertTrue(userGroupSubviewActive(*states))
                  }
              }
              @Test fun closingOneActionDoesNotExposeDirectoryIfAnotherRemains() {
                  assertTrue(userGroupSubviewActive(false,true,false))
                  assertFalse(userGroupSubviewActive(false,false,false))
              }
          }
          ''');changed.add(str(p))
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==changed,(actual,changed)
          Path(os.environ['RUNNER_TEMP'],'user-group-subview-paths.json').write_text(json.dumps(sorted(changed)))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests execute unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-group-subview-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/user-group-subview-paths.json
          if-no-files-found: ignore
      - name: Apply only validated UI changes to dev and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/user-group-subviews.yml'
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'user-group-subview-paths.json').read_text())
          allowed={'UserGroupEditDialog.kt','UserGroupDeleteDialog.kt','UserGroupMemberAddDialog.kt','UserGroupMemberRemoveDialog.kt','GroupMeshGrantDialog.kt','GroupMeshEditDialog.kt','GroupMeshAssignmentReview.kt','UserGroupsDirectoryPane.kt','UserGroupActionSubview.kt'}
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/'+name for name in allowed}|{'app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupActionSubviewTest.kt'}
          assert set(paths)==expected
          Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(groups): present user-group actions as inline subviews'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
