name: Validate shared subview body layout
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/shared-subview-body-layout.yml']
permissions:
  contents: write
concurrency:
  group: shared-subview-body-layout-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare bounded shared subview bodies
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='eaa20fca9b1962324f205986a0b0ac7e5438c581','Base advanced; review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management');paths=[]
          old='Box(Modifier.weight(1f).fillMaxWidth()) {text()}'
          for name in ['ProfileUserDetailSurface.kt','AccountOptionSurface.kt','ServerReadSurface.kt']:
              p=root/name;s=p.read_text();assert s.count(old)==1,(name,s.count(old))
              s=s.replace(old,'iecxiv.meshfabric.ui.components.SubviewBodyViewport(Modifier.weight(1f).fillMaxWidth()) {text()}',1)
              if name=='ServerReadSurface.kt':
                  before='Column(Modifier.fillMaxSize().padding(managementConnectionContentPadding)'
                  assert s.count(before)==1;s=s.replace(before,'Column(Modifier.fillMaxSize().imePadding().padding(managementConnectionContentPadding)',1)
              p.write_text(s);paths.append(str(p))
          helper='''package iecxiv.meshfabric.ui.components
          import androidx.compose.foundation.layout.Box
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.testTag
          @Composable internal fun SubviewBodyViewport(modifier:Modifier=Modifier,content:@Composable ()->Unit) {
              Box(modifier.testTag("shared_subview_body"),contentAlignment=Alignment.CenterStart) {content()}
          }
          '''
          ui='''package iecxiv.meshfabric.ui.management
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.window.DialogProperties
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          @Composable private fun SharedLayoutExample(mode:Int,body:@Composable ()->Unit) {
              val title:@Composable ()->Unit={Text("Title")}
              val footer:@Composable ()->Unit={TextButton(onClick={}) {Text("Back",Modifier.testTag("footer"))}}
              when(mode) {
                  0->ProfileUserDetailSurface(inline=true,onDismissRequest={},title=title,text=body,confirmButton=footer,dismissButton={})
                  1->AccountOptionSurface(inline=true,onDismissRequest={},properties=DialogProperties(),title=title,text=body,confirmButton=footer)
                  else->CompositionLocalProvider(LocalServerReadInline provides true) {ServerReadSurface(onDismissRequest={},title=title,text=body,confirmButton=footer)}
              }
          }
          class SharedSubviewBodyLayoutTest {
              @get:Rule val rule=createComposeRule()
              @Test fun shortContentIsCenteredInAllThreeSurfaces() {
                  val mode=mutableIntStateOf(0)
                  rule.setContent {MaterialTheme {SharedLayoutExample(mode.intValue) {Text("Short",Modifier.testTag("body"))}}}
                  for(i in 0..2) {
                      rule.runOnIdle {mode.intValue=i}
                      val viewport=rule.onNodeWithTag("shared_subview_body").fetchSemanticsNode().boundsInRoot
                      val body=rule.onNodeWithTag("body").fetchSemanticsNode().boundsInRoot
                      assertEquals(viewport.center.y,body.center.y,2f)
                      rule.onNodeWithTag("footer").assertIsDisplayed()
                      rule.onNode(isDialog()).assertDoesNotExist()
                  }
              }
              @Test fun existingScrollWorksWithoutMovingFooters() {
                  val mode=mutableIntStateOf(0);val long=mutableStateOf(false)
                  rule.setContent {MaterialTheme {SharedLayoutExample(mode.intValue) {
                      Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState())) {repeat(if(long.value) 80 else 1) {Text("Line $it",Modifier.testTag("line_$it"))}}
                  }}}
                  for(i in 0..2) {
                      rule.runOnIdle {mode.intValue=i;long.value=false}
                      val top=rule.onNodeWithTag("footer").fetchSemanticsNode().boundsInRoot.top
                      rule.runOnIdle {long.value=true}
                      rule.onNodeWithTag("line_79").performScrollTo().assertIsDisplayed()
                      assertEquals(top,rule.onNodeWithTag("footer").fetchSemanticsNode().boundsInRoot.top,2f)
                      rule.onNodeWithTag("footer").assertIsDisplayed()
                  }
              }
              @Test fun lazyListsKeepFiniteFullSizeViewport() {
                  rule.setContent {MaterialTheme {SharedLayoutExample(0) {
                      LazyColumn(Modifier.fillMaxSize().testTag("list")) {items((0..79).toList()) {Text("Item $it",Modifier.testTag("item_$it"))}}
                  }}}
                  rule.onNodeWithTag("item_0").assertIsDisplayed()
                  rule.onNodeWithTag("list").performScrollToIndex(79)
                  rule.onNodeWithTag("item_79").assertIsDisplayed()
                  rule.onNodeWithTag("footer").assertIsDisplayed()
              }
          }
          '''
          new={'app/src/main/java/iecxiv/meshfabric/ui/components/SubviewBodyViewport.kt':helper,'app/src/androidTest/java/iecxiv/meshfabric/ui/management/SharedSubviewBodyLayoutTest.kt':ui}
          for name,content in new.items():
              p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content);paths.append(name)
          expected=set(paths)
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==expected,(actual,expected)
          Path(os.environ['RUNNER_TEMP'],'shared-subview-layout-paths.json').write_text(json.dumps(sorted(expected)))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Full validation before publishing
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-subview-body-layout-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/shared-subview-layout-paths.json
          if-no-files-found: ignore
      - name: Publish validated layouts and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'shared-subview-layout-paths.json').read_text())
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/'+p for p in ['ProfileUserDetailSurface.kt','AccountOptionSurface.kt','ServerReadSurface.kt']}|{'app/src/main/java/iecxiv/meshfabric/ui/components/SubviewBodyViewport.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/SharedSubviewBodyLayoutTest.kt'}
          assert set(paths)==expected
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==expected
          workflow='.github/workflows/shared-subview-body-layout.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui: center short bodies in shared profile account and server subviews'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
