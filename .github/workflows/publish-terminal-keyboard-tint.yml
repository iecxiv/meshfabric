name: Validate and publish stable terminal keyboard tint
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-terminal-keyboard-tint.yml]
permissions:
  contents: write
concurrency:
  group: publish-terminal-keyboard-tint-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep keyboard icon tint independent of clipboard overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt')
          if subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() != 'd2956bed3e2090e2289c18bf5e858c1b73d6f35a':
              raise RuntimeError('TerminalScreen base changed; review patch')
          s = p.read_text()
          old = 'Icon(Icons.Default.Keyboard, contentDescription = stringResource(R.string.terminal_keyboard_toggle))'
          new = '''Icon(
                                      Icons.Default.Keyboard,
                                      contentDescription = stringResource(R.string.terminal_keyboard_toggle),
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = if (inputEnabled) 1f else 0.38f)
                                  )'''
          if s.count(old) != 1:
              raise RuntimeError('Keyboard icon anchor is not unique')
          s = s.replace(old, new, 1)
          if 'enabled = inputEnabled && !inputOverlay' not in s:
              raise RuntimeError('Keyboard input guard changed')
          p.write_text(s)
          PY
          git diff --check
      - name: Unit tests and debug build
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-keyboard-tint-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Publish validated visual adjustment
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt
          git commit -m 'fix: keep terminal keyboard icon tint stable across clipboard menus'
          git push origin HEAD:dev
