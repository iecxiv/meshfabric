                      moveBy(Offset(0f, 30f))
                      moveBy(Offset(0f, 60f))
                      moveBy(Offset(0f, 90f))
                      moveBy(Offset(0f, 120f))
                      up()
                  }
                  compose.waitForIdle()
                  compose.onNodeWithTag("terminal-key-editor-save").performClick()
                  assertTrue(savedKeys().indexOf("esc") > 0)
              }

