name: Move logout to settings
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/move-logout-to-settings.yml']
permissions:
  contents: write
concurrency:
  group: move-logout-settings
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Move logout with guarded source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric/ui')
          expected = {'devices/DeviceListScreen.kt': '1c3287543cc48fa2f2129d6f370cc6ec55a75b44', 'settings/SettingsScreen.kt': '436971f2dfe154aad6d733942f4c1ddc76360c21', 'navigation/NavGraph.kt': 'bcc2769bb8b9cbaad0f979e6aacefec21741358b'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', str(root/path)], text=True).strip() == sha, 'Source changed: ' + path
          def replace(s, old, new):
              assert s.count(old) == 1, old
              return s.replace(old, new, 1)
          p = root/'devices/DeviceListScreen.kt'
          s = p.read_text()
          s = replace(s, 'import androidx.compose.material.icons.automirrored.filled.Logout\n', '')
          s = replace(s, '    var logout by remember { mutableStateOf(false) }\n', '')
          a = s.index('    if(logout) AlertDialog(')
          b = s.index('    if(closeSessions) AlertDialog(', a)
          s = s[:a] + s[b:]
          s = replace(s, '            ToolIcon(Icons.AutoMirrored.Filled.Logout,stringResource(R.string.logout)) { logout=true }\n', '')
          p.write_text(s)
          p = root/'settings/SettingsScreen.kt'
          s = p.read_text()
          s = replace(s, 'import androidx.compose.material.icons.automirrored.filled.ArrowBack', 'import androidx.compose.material.icons.automirrored.filled.Logout\nimport androidx.compose.material.icons.automirrored.filled.ArrowBack')
          s = replace(s, '    onBack: () -> Unit\n', '    onBack: () -> Unit,\n    onLogout: (() -> Unit)? = null\n')
          dialog = '\n'.join([
              '    var showLogout by remember { mutableStateOf(false) }',
              '    if (showLogout && onLogout != null) androidx.compose.material3.AlertDialog(',
              '        onDismissRequest = { showLogout = false },',
              '        title = { Text(stringResource(R.string.confirm_logout_title), fontWeight = FontWeight.Bold) },',
              '        text = { Text(stringResource(R.string.confirm_logout_msg_custom, currentAppName)) },',
              '        confirmButton = { androidx.compose.material3.TextButton(onClick = { showLogout = false; onLogout() }) {',
              '            Text(stringResource(R.string.logout), color = MaterialTheme.colorScheme.error)',
              '        } },',
              '        dismissButton = { androidx.compose.material3.TextButton(onClick = { showLogout = false }) {',
              '            Text(stringResource(R.string.cancel))',
              '        } }',
              '    )', ''])
          anchor = '    var editedName by remember(currentAppName) { mutableStateOf(currentAppName) }'
          s = replace(s, anchor, dialog + '\n' + anchor)
          card = '\n'.join([
              '            if (onLogout != null) {',
              '                Card(',
              '                    modifier = Modifier.fillMaxWidth().clickable { showLogout = true },',
              '                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)',
              '                ) {',
              '                    Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {',
              '                        Icon(Icons.AutoMirrored.Filled.Logout, contentDescription = null, tint = MaterialTheme.colorScheme.error)',
              '                        Spacer(Modifier.width(8.dp))',
              '                        Text(stringResource(R.string.logout), fontWeight = FontWeight.Bold, fontSize = 15.sp, color = MaterialTheme.colorScheme.error)',
              '                    }',
              '                }',
              '            }', ''])
          s = replace(s, '            // Info Card', card + '\n            // Info Card')
          p.write_text(s)
          p = root/'navigation/NavGraph.kt'
          s = p.read_text()
          new = '\n'.join([
              '            SettingsScreen(viewModel=settingsViewModel,onBack=back,',
              '                onLogout=if(recoveryRoute()=="devices") ({',
              '                    if(navController.acceptsNavigationFrom(entry)) {',
              '                        deviceListViewModel.closeAllActiveSessions()',
              '                        terminalViewModel.clearRendering()',
              '                        loginViewModel.logout()',
              '                        navController.navigateOnceFrom(entry,"login") {',
              '                            popUpTo(navController.graph.id) { inclusive=false }',
              '                        }',
              '                    }',
              '                }) else null)'])
          s = replace(s, '            SettingsScreen(viewModel=settingsViewModel,onBack=back)', new)
          p.write_text(s)
          PY
          git diff --check
      - name: Compile and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified change
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt app/src/main/java/iecxiv/meshfabric/ui/navigation/NavGraph.kt
          git rm .github/workflows/move-logout-to-settings.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: move logout into settings after terminal buffer preference'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logout-settings-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
