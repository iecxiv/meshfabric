name: Validate and publish content-sized Events selectors
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/publish-events-selector-width.yml
      - .github/scripts/prepare-events-selector-width.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Guard scope and generate content-sized selectors
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e710a450d1c73a83489f410284f805bd1e0c79d6
          mkdir -p validation
          python3 .github/scripts/prepare-events-selector-width.py
          git diff --cached --check
      - name: Build execute JVM lint and prepare independent Android classes
        run: |
          set -euo pipefail
          python3 -m venv /tmp/events-width-yaml
          /tmp/events-width-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/events-width-yaml/bin/python - <<'PY'
          from pathlib import Path
          import ast,subprocess,yaml
          yaml.safe_load(Path('.github/workflows/publish-events-selector-width.yml').read_text())
          old=yaml.safe_load(subprocess.check_output(['git','show','e710a450d1c73a83489f410284f805bd1e0c79d6:.github/workflows/publish-events-presentation.yml'],text=True))
          matches=[s for s in old['jobs']['validate']['steps'] if s.get('name')=='Reuse pinned compilation JVM lint and scoped Android setup']
          assert len(matches)==1
          subprocess.run(['bash','-euo','pipefail','-c',matches[0]['run']],check=True)
          p=Path('validation/run-log-class-isolation.py');s=p.read_text();anchor='expected={\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"    'EventsSelectorWidthTest':{'portraitSpanishOptionsHaveNoEllipsisAndMatchAnchor','enlargedFontKeepsEveryTypeReadable','selectionDoesNotResizeTypeAndCountMenuMatchesItsHeader'},\n")
          s=s.replace('Expected: 19 distinct methods across 7 independent class runs.','Expected: 22 distinct methods across 8 independent class runs.')
          ast.parse(s);p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute affected Android classes independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 validation/run-log-class-isolation.py
      - name: Require executed regressions and exact scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          cases=[]
          for p in Path('app/build/test-results/testDebugUnitTest').rglob('*.xml'): cases.extend(ET.parse(p).getroot().iter('testcase'))
          assert cases and all(all(c.find(t) is None for t in ('failure','error','skipped')) for c in cases)
          for name,count in {'ServerEventDetailsPolicyTest':4,'ServerEventsQueryTest':8,'LogEventsReaderTest':12,'ServerEventsReadPolicyTest':9,'ServerEventsDiagnosticsTest':3,'LogNumericMessageTest':8}.items():
              assert sum(c.get('classname','').split('.')[-1]==name for c in cases)==count,name
          results=json.loads(Path('validation/class-isolation/summary.json').read_text())
          required={'EventsSelectorWidthTest':3,'EventsPresentationTest':4,'ServerEventsControlsTest':3,'LogNumericMessageUiTest':2,'LogEventsDiagnosticsUiTest':2,'RegistroSectionTabsTest':2,'LogScreenTest':4,'ManagementNavigationLabelTest':2}
          assert len(results)==8 and {r['class'] for r in results}=={'iecxiv.meshfabric.ui.management.'+n for n in required}
          for r in results:
              assert r['passed'] is True and r['exit_code']==0,r
              assert len(r['cases'])==required[r['class'].split('.')[-1]],r
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/ServerEventsControls.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/EventsSelectorWidthTest.kt','docs/log.md'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          Path('validation/selector-width-tests.json').write_text(json.dumps({'jvm_cases':len(cases),'android_cases':22,'physical_visual_review_verified':False},indent=2)+'\n')
          PY
          git diff --cached --check
          git diff --cached > validation/selector-width.diff
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-selector-width-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(log): size type selector to localized options and fit count control'
          git push origin HEAD:work/registro-server-events
