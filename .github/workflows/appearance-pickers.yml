name: Theme analog clock and fit city selector to content
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/appearance-pickers.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: appearance-pickers-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare guarded picker changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='cba9c4e59fa0007fd11719696979fa825708417d'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/appearance-pickers.yml'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/theme')
          p=root/'AutomaticAppearance.kt'
          assert git('hash-object',str(p))=='6934b743fa8800633f4724d39b74782a18e7eb2c'
          old=p.read_text();s=old
          def once(a,b):
              global s
              assert s.count(a)==1,a
              s=s.replace(a,b,1)
          once('    var choosingCity by remember { mutableStateOf(false) }\n    var query by remember { mutableStateOf("") }','    var editingTime by remember { mutableStateOf<Boolean?>(null) }')
          start=s.index('                    OutlinedButton(onClick={\n                        TimePickerDialog(')
          end=s.index('\n                }\n                Text(stringResource(R.string.appearance_schedule_note)',start)
          s=s[:start]+'''                    OutlinedButton(onClick={editingTime=isLight},modifier=Modifier.fillMaxWidth().testTag(if(isLight) "appearance_light_time" else "appearance_dark_time")) {
                        Text(label+": "+String.format(Locale.ROOT,"%02d:%02d",minutes/60,minutes%60))
                    }'''+s[end:]
          once('                OutlinedButton(onClick={query="";choosingCity=true},modifier=Modifier.fillMaxWidth().testTag("appearance_city_selector")) { Text(city?.name ?: stringResource(R.string.appearance_choose_city)) }','                AppearanceCitySelector(city=city,maximumWidth=controlWidth,onSelect={chosen -> prefs.edit().putString("city",chosen.id).apply()})')
          start=s.index('            if(choosingCity) AppAlertDialog(')
          end=s.index('\n        }\n    }\n}',start)
          s=s[:start]+s[end:]
          end=s.rfind('\n}')
          s=s[:end]+'''
              if(selected==3) editingTime?.let { light ->
                  key(light) {
                      AppearanceAnalogTimeDialog(
                          title=stringResource(if(light) R.string.appearance_light_at else R.string.appearance_dark_at),
                          initialMinutes=if(light) options.light else options.dark,
                          otherMinutes=if(light) options.dark else options.light,
                          is24Hour=android.text.format.DateFormat.is24HourFormat(context),
                          onDismiss={editingTime=null},onSave={value ->
                              val current=readAppearance(prefs)
                              val other=if(light) current.dark else current.light
                              if(current.mode=="scheduled" && appearanceTimeCanSave(value/60,value%60,other)) {
                                  prefs.edit().putInt(if(light) "light" else "dark",value).apply();editingTime=null
                              }
                          })
                  }
              }
          '''+s[end:]
          once('private fun appearanceSearch(','internal fun appearanceSearch(')
          for imp in ['import android.app.TimePickerDialog\n','import androidx.compose.foundation.lazy.LazyColumn\n','import androidx.compose.foundation.lazy.items\n','import androidx.compose.ui.text.font.FontWeight\n','import androidx.compose.ui.unit.sp\n','import iecxiv.meshfabric.ui.components.AppAlertDialog\n']:
              assert s.count(imp)==1,imp
              s=s.replace(imp,'',1)
          before=old.split('internal data class SolarCity',1)[1].split('private fun appearanceSearch',1)[0]
          after=s.split('internal data class SolarCity',1)[1].split('internal fun appearanceSearch',1)[0]
          assert before==after,'Solar policy or preference handling changed'
          assert 'TimePickerDialog(' not in s and 'choosingCity' not in s
          p.write_text(s)
          def create(path,text):
              path=Path(path);assert not path.exists(),str(path)
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          create(root/'AppearancePickerPolicy.kt','''package iecxiv.meshfabric.ui.theme
          internal fun appearanceTimeCanSave(hour:Int,minute:Int,otherMinutes:Int):Boolean =
              hour in 0..23 && minute in 0..59 && otherMinutes in 0..1439 && hour*60+minute!=otherMinutes
          internal fun appearanceCityPopupWidth(contentWidth:Float,availableWidth:Float):Float {
              val available=when {
                  availableWidth==Float.POSITIVE_INFINITY->480f
                  !availableWidth.isFinite()->0f
                  else->availableWidth.coerceIn(0f,480f)
              }
              val desired=if(contentWidth.isFinite()) contentWidth.coerceAtLeast(0f)+32f else available
              return minOf(desired,available)
          }
          ''')
          create(root/'AppearancePickers.kt','''package iecxiv.meshfabric.ui.theme

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowDropDown
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.semantics.selected
          import androidx.compose.ui.semantics.semantics
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.rememberTextMeasurer
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import iecxiv.meshfabric.R
          import iecxiv.meshfabric.ui.components.AppDialogAppearance
          import iecxiv.meshfabric.ui.components.AppDialogSurface

          @Composable internal fun AppearanceCitySelector(city:SolarCity?,maximumWidth:Dp,onSelect:(SolarCity)->Unit) {
              var expanded by remember {mutableStateOf(false)}
              var query by remember {mutableStateOf("")}
              val searchLabel=stringResource(R.string.appearance_city_search)
              val label=city?.name ?: stringResource(R.string.appearance_choose_city)
              val measurer=rememberTextMeasurer()
              val style=MaterialTheme.typography.bodyLarge
              val pixels=(solarCities.map {it.name}+searchLabel).maxOf {measurer.measure(AnnotatedString(it),style=style,softWrap=false).size.width}
              val contentWidth=with(LocalDensity.current) {pixels.toDp().value}
              val menuWidth=appearanceCityPopupWidth(contentWidth,maximumWidth.value).dp
              val cities=solarCities.filter {appearanceSearch(it.name).contains(appearanceSearch(query))}
              Box {
                  OutlinedButton(onClick={query="";expanded=true},modifier=Modifier.widthIn(max=maximumWidth).testTag("appearance_city_selector"),
                      shape=MaterialTheme.shapes.medium,border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant),contentPadding=PaddingValues(horizontal=12.dp,vertical=8.dp)) {
                      Text(label,modifier=Modifier.weight(1f,fill=false),maxLines=2)
                      Spacer(Modifier.width(8.dp))
                      Icon(Icons.Default.ArrowDropDown,contentDescription=null,modifier=Modifier.size(20.dp))
                  }
                  DropdownMenu(expanded=expanded,onDismissRequest={expanded=false},modifier=Modifier.width(menuWidth).heightIn(max=320.dp).testTag("appearance_city_menu"),
                      shape=MaterialTheme.shapes.medium,containerColor=MaterialTheme.colorScheme.surfaceVariant,tonalElevation=2.dp,
                      border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {
                      OutlinedTextField(query,{query=it},singleLine=true,label={Text(searchLabel)},modifier=Modifier.fillMaxWidth().padding(horizontal=8.dp,vertical=4.dp).testTag("appearance_city_search"))
                      if(cities.isEmpty()) DropdownMenuItem(enabled=false,text={Text(stringResource(R.string.appearance_no_cities))},onClick={})
                      cities.forEach { option ->
                          val chosen=option.id==city?.id
                          DropdownMenuItem(text={Text(option.name)},modifier=Modifier.testTag("appearance_city_option_${option.id}").semantics {this.selected=chosen},onClick={onSelect(option);expanded=false})
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class,ExperimentalLayoutApi::class)
          @Composable internal fun AppearanceAnalogTimeDialog(title:String,initialMinutes:Int,otherMinutes:Int,is24Hour:Boolean,onDismiss:()->Unit,onSave:(Int)->Unit) {
              val initial=initialMinutes.coerceIn(0,1439)
              val state=rememberTimePickerState(initialHour=initial/60,initialMinute=initial%60,is24Hour=is24Hour)
              val canSave=appearanceTimeCanSave(state.hour,state.minute,otherMinutes)
              val scheme=MaterialTheme.colorScheme
              Dialog(onDismissRequest=onDismiss,properties=DialogProperties(usePlatformDefaultWidth=false,decorFitsSystemWindows=false)) {
                  BoxWithConstraints(Modifier.fillMaxWidth().safeDrawingPadding().imePadding().padding(12.dp),contentAlignment=Alignment.Center) {
                      val layout=if(maxWidth>=520.dp && maxWidth>maxHeight) TimePickerLayoutType.Horizontal else TimePickerLayoutType.Vertical
                      AppDialogSurface(modifier=Modifier.widthIn(max=560.dp).heightIn(max=maxHeight).testTag("appearance_time_dialog")) {
                          Column(Modifier.padding(20.dp),verticalArrangement=Arrangement.spacedBy(16.dp),horizontalAlignment=Alignment.CenterHorizontally) {
                              Text(title,modifier=Modifier.fillMaxWidth(),fontWeight=FontWeight.Bold,fontSize=18.sp)
                              Box(Modifier.weight(1f,fill=false).verticalScroll(rememberScrollState()),contentAlignment=Alignment.Center) {
                                  TimePicker(state=state,modifier=Modifier.testTag("appearance_analog_clock"),layoutType=layout,
                                      colors=TimePickerDefaults.colors(clockDialColor=scheme.surfaceVariant,selectorColor=scheme.primary,containerColor=AppDialogAppearance.containerColor()))
                              }
                              if(!canSave) Text(stringResource(R.string.appearance_schedule_note),style=MaterialTheme.typography.bodySmall,color=scheme.error)
                              FlowRow(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(8.dp,Alignment.End),verticalArrangement=Arrangement.spacedBy(4.dp)) {
                                  TextButton(onClick=onDismiss,modifier=Modifier.testTag("appearance_time_cancel")) {Text(stringResource(R.string.cancel))}
                                  TextButton(enabled=canSave,onClick={if(canSave) onSave(state.hour*60+state.minute)},modifier=Modifier.testTag("appearance_time_save")) {Text(stringResource(R.string.save))}
                              }
                          }
                      }
                  }
              }
          }
          ''')
          create('app/src/test/java/iecxiv/meshfabric/ui/theme/AppearancePickerPolicyTest.kt','''package iecxiv.meshfabric.ui.theme
          import org.junit.Assert.*
          import org.junit.Test
          class AppearancePickerPolicyTest {
              @Test fun validHourCanBeSaved() {assertTrue(appearanceTimeCanSave(7,0,1200))}
              @Test fun equalTimesAreRejected() {assertFalse(appearanceTimeCanSave(20,0,1200))}
              @Test fun invalidHourAndMinuteAreRejected() {assertFalse(appearanceTimeCanSave(24,0,0));assertFalse(appearanceTimeCanSave(0,60,0));assertFalse(appearanceTimeCanSave(-1,0,0))}
              @Test fun invalidOppositeTimeIsRejected() {assertFalse(appearanceTimeCanSave(7,0,1440));assertFalse(appearanceTimeCanSave(7,0,-1))}
              @Test fun shortMenuFitsContent() {assertEquals(112f,appearanceCityPopupWidth(80f,280f),0f)}
              @Test fun longMenuDoesNotOverflow() {assertEquals(280f,appearanceCityPopupWidth(800f,280f),0f)}
              @Test fun veryWideWindowIsBounded() {assertEquals(480f,appearanceCityPopupWidth(1000f,1000f),0f);assertEquals(480f,appearanceCityPopupWidth(1000f,Float.POSITIVE_INFINITY),0f)}
              @Test fun invalidDimensionsAreSafe() {assertEquals(0f,appearanceCityPopupWidth(80f,Float.NaN),0f);assertEquals(0f,appearanceCityPopupWidth(80f,-1f),0f);assertEquals(280f,appearanceCityPopupWidth(Float.NaN,280f),0f)}
          }
          ''')
          create('app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearancePickersTest.kt','''package iecxiv.meshfabric.ui.theme
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.unit.dp
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          class AppearancePickersTest {
              @get:Rule val compose=createComposeRule()
              @Test fun cityAnchorGrowsWithName() {
                  var city by mutableStateOf(solarCities.first {it.id=="lima"})
                  compose.setContent {MaterialTheme {Box(Modifier.fillMaxSize().testTag("picker_host")) {AppearanceCitySelector(city,280.dp,{city=it})}}}
                  compose.waitForIdle()
                  val small=compose.onNodeWithTag("appearance_city_selector").fetchSemanticsNode().boundsInRoot.width
                  compose.runOnIdle {city=solarCities.first {it.id=="canarias"}};compose.waitForIdle()
                  val large=compose.onNodeWithTag("appearance_city_selector").fetchSemanticsNode().boundsInRoot.width
                  assertTrue(large>small)
                  assertTrue(large<compose.onNodeWithTag("picker_host").fetchSemanticsNode().boundsInRoot.width)
              }
              @Test fun citySearchStillSelectsTheCorrectId() {
                  var selected:SolarCity?=null
                  compose.setContent {MaterialTheme {AppearanceCitySelector(null,280.dp,{selected=it})}}
                  compose.onNodeWithTag("appearance_city_selector").performClick()
                  compose.onNodeWithTag("appearance_city_search").performTextInput("Lima")
                  compose.onNodeWithTag("appearance_city_option_lima").performClick()
                  compose.runOnIdle {assertEquals("lima",selected?.id)}
              }
              @Test fun clockCancelDoesNotSave() {
                  var saved:Int?=null;var dismissed=false
                  compose.setContent {MaterialTheme {AppearanceAnalogTimeDialog("Test",420,1200,true,{dismissed=true},{saved=it})}}
                  compose.onNodeWithTag("appearance_analog_clock").assertExists()
                  compose.onNodeWithTag("appearance_time_cancel").performClick()
                  compose.runOnIdle {assertTrue(dismissed);assertNull(saved)}
              }
              @Test fun clockSaveReturnsMinutes() {
                  var saved:Int?=null
                  compose.setContent {MaterialTheme {AppearanceAnalogTimeDialog("Test",420,1200,true,{},{saved=it})}}
                  compose.onNodeWithTag("appearance_time_save").performClick()
                  compose.runOnIdle {assertEquals(420,saved)}
              }
              @Test fun equalHoursDisableSave() {
                  compose.setContent {MaterialTheme {AppearanceAnalogTimeDialog("Test",420,420,false,{},{})}}
                  compose.onNodeWithTag("appearance_time_save").assertIsNotEnabled()
              }
          }
          ''')
          assert git('diff','--name-only')==str(p)
          assert Path('app/build.gradle.kts').read_text()==subprocess.check_output(['git','show','HEAD:app/build.gradle.kts'],text=True)
      - name: Audit localization without changing the published inventory
        run: |
          set -euo pipefail
          python3 tools/i18n/audit.py --self-test
          python3 tools/i18n/audit.py
          mkdir -p "$RUNNER_TEMP/appearance-picker-audit"
          cp docs/i18n/summary.json docs/i18n/resource-issues.json docs/i18n/candidates.csv "$RUNNER_TEMP/appearance-picker-audit/"
          git restore -- docs/i18n/summary.json docs/i18n/resource-issues.json docs/i18n/candidates.csv
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build compile UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-picker-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/appearance-picker-audit/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated pickers and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          cases=[c for p in Path('app/build/test-results').rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase') if c.get('classname')=='iecxiv.meshfabric.ui.theme.AppearancePickerPolicyTest']
          assert len(cases)==8 and not any(c.find(x) is not None for c in cases for x in ['failure','error','skipped'])
          assert Path('app/build.gradle.kts').read_text()==subprocess.check_output(['git','show','HEAD:app/build.gradle.kts'],text=True)
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow=Path('.github/workflows/appearance-pickers.yml');workflow.unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/theme/AutomaticAppearance.kt','app/src/main/java/iecxiv/meshfabric/ui/theme/AppearancePickerPolicy.kt','app/src/main/java/iecxiv/meshfabric/ui/theme/AppearancePickers.kt','app/src/test/java/iecxiv/meshfabric/ui/theme/AppearancePickerPolicyTest.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearancePickersTest.kt',str(workflow)]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(settings): fit city selector and theme analog time dialogs'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
