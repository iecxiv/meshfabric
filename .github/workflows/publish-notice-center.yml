name: Validate and integrate notice center

on:
  workflow_dispatch:
  push:
    branches:
      - notifications-broadcast-messages
    paths:
      - .github/workflows/publish-notice-center.yml

permissions:
  contents: write

concurrency:
  group: notice-center-publication
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/notifications-broadcast-messages'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Integrate existing notice and messaging components
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt')
          text = p.read_text()
          old = 'NoticeInboxScreen(management.inbox,state.ready,Modifier.fillMaxSize())'
          new = '''NoticeCenterScreen(viewModel.meshClient,management.inbox,state.ready,nodes,Modifier.fillMaxSize(),onDeviceMessage={node->
                              operationNode=node.id
                              operation=Operation("Notificación remota · ${node.name}",listOf("title" to "Título","msg" to "Mensaje"),true,Icons.Default.Notifications) {values->
                                  val title=values.getValue("title")
                                  val message=values.getValue("msg")
                                  require(title.isNotBlank() && title.length<=160 && !title.contains('\\u0000')) { "Escribe un título válido (máximo 160 caracteres)" }
                                  require(userMessageValid(message)) { "Escribe un mensaje válido (máximo 512 caracteres)" }
                                  json("action" to "toast","nodeids" to JSONArray(listOf(node.id)),"title" to title,"msg" to message)
                              }
                          })'''
          if text.count(old) != 1:
              raise SystemExit('Integration anchor changed or already integrated; refusing to rewrite sources')
          p.write_text(text.replace(old,new))
          PY
      - name: Build, all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run all Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Publish validated integration only if branch is unchanged
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=notifications-broadcast-messages
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected changed files: '+repr(changed))
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          if untracked:
              raise SystemExit('Unexpected untracked files: '+untracked)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt
          git commit -m "Integrate validated Notices, Broadcast and Messages tabs"
          git push origin "HEAD:refs/heads/$branch"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-center-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
