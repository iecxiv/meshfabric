name: Review agent and invitation contracts
on:
  push:
    branches: [add-device-invite]
    paths: [.github/workflows/review-add-device-invite.yml]
permissions:
  contents: read
concurrency:
  group: review-add-device-invite
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check work branch and initial base
        env:
          EXPECTED_REF: add-device-invite
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD^)" = 1e65206f64cfcb7b6ae5907e048844ef9d75ffcc
          git fetch origin "$EXPECTED_REF"
          test "$(git rev-parse origin/$EXPECTED_REF)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain exact package without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/invite-contract"
          cd "$RUNNER_TEMP/invite-contract"
          npm pack meshcentral@1.3.1 --ignore-scripts --json > pack.json
      - name: Capture original sources, provenance and numbered excerpts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'invite-contract'
          pack=json.loads((root/'pack.json').read_text())
          assert len(pack)==1 and pack[0]['name']=='meshcentral' and pack[0]['version']=='1.3.1'
          filename=pack[0]['filename']
          assert Path(filename).name==filename
          archive=root/filename
          assert archive.stat().st_size<=100_000_000
          out=root/'evidence'
          out.mkdir()
          provenance={'package':'meshcentral','version':'1.3.1','npm_integrity':pack[0].get('integrity'),'npm_shasum':pack[0].get('shasum'),'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'repository_commit':os.environ['GITHUB_SHA'],'sources':{}}
          targets=['package/package.json','package/meshuser.js','package/webserver.js','package/views/default.handlebars']
          pattern=re.compile(r'invite|deviceshare|guestsharing|meshagents|meshsettings|meshagentdownload|installflags|magenturl|MESHRIGHT_MANAGECOMPUTERS|SITERIGHT_NONEWDEVICES',re.I)
          report=['# MeshCentral 1.3.1: agents and invitations','', 'Status: source audit evidence only. No native feature is implemented or validated by this workflow. No installer, server action or invitation is executed.','', 'Scope: add an agent to a device group; invite an agent into a device group; share temporary access to an existing device. These are separate operations.','', 'Original source files accompany the numbered excerpts. Excerpts are navigational evidence, not a complete or approved protocol contract. Read the complete handlers before implementation.','']
          with tarfile.open(archive,'r:gz') as tar:
              for name in targets:
                  member=tar.getmember(name)
                  assert member.isfile() and member.size<=25_000_000
                  stream=tar.extractfile(member)
                  assert stream is not None
                  data=stream.read()
                  text=data.decode('utf-8')
                  destination=out/name.removeprefix('package/')
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(data)
                  provenance['sources'][name]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
                  if name.endswith('package.json'):
                      package=json.loads(text)
                      assert package['name']=='meshcentral' and package['version']=='1.3.1'
                      continue
                  lines=text.splitlines()
                  hits=[i for i,line in enumerate(lines) if pattern.search(line)]
                  assert hits, name
                  intervals=[]
                  for i in hits:
                      start=max(0,i-16); end=min(len(lines),i+101)
                      if intervals and start<=intervals[-1][1]:
                          intervals[-1][1]=max(intervals[-1][1],end)
                      else:
                          intervals.append([start,end])
                  excerpts=['# '+name,'', 'Original source SHA-256: '+hashlib.sha256(data).hexdigest(),'']
                  for start,end in intervals:
                      excerpts += [f'## Lines {start+1}-{end}','```text']+[f'{j+1}: {lines[j]}' for j in range(start,end)]+['```','']
                  evidence_name=destination.name+'.excerpts.md'
                  (out/evidence_name).write_text('\n'.join(excerpts)+'\n')
                  report += ['## '+name,'',f'{len(hits)} matching lines; {len(intervals)} excerpt ranges. See {evidence_name} and the original source.','']
          report += ['## Required review before implementation','', '- Enumerate exact action names, request fields, response shapes and echoed correlation fields from the full source.', '- Check effective rights, administrator masks, domain restrictions, agent group type, server feature flags and guest-sharing maximum duration.', '- Distinguish direct agent downloads and installation commands from group invitation links or email delivery.', '- Record supported platforms, architecture identifiers, install modes, uninstall modes, assistant links, mobile connection payload and QR content from the official client.', '- Preserve domain paths, reverse-proxy prefixes and server-provided agent URLs. Never inject authentication cookies into public invitation links or shell commands.', '- For temporary sharing, verify allowed protocols, start/end time units, guest identity, view-only restrictions, consent, listing and revocation.', '- Use explicit user confirmation before issuing an invitation or creating temporary access. Do not create access on opening a dialog.', '- Correlate responses, bind requests and results to server/account/target, retire stale sockets, and never resend mutations automatically.', '- Treat timeout/disconnection after submission as an unknown outcome, not rejection or success. Clear sensitive links on identity change and avoid logging tokens or invitation contents.', '- Native integration requires Spanish/English UI, existing dialog styles and clear separation between group and device actions.', '- Execute unit tests and lint, compile app and Android tests, then execute relevant Compose/navigation regressions. Compilation is not test execution.', '- Check results on a real MeshCentral 1.3.1 server and review the APK visually. Do not claim the three features are complete based on this audit.','']
          (out/'README.md').write_text('\n'.join(report)+'\n')
          (out/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: add-device-invite-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/invite-contract/
          retention-days: 7
          if-no-files-found: error
