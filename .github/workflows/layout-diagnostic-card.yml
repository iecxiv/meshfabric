name: Layout diagnostic card
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/layout-diagnostic-card.yml']
permissions:
  contents: write
concurrency:
  group: layout-diagnostic-card
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Adjust layout preserving card background
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/layout-base"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric')
          p = root / 'ui/settings/SettingsScreen.kt'
          d = root / 'diagnostics/DiagnosticSettings.kt'
          for path, sha in [(p, 'e4d1fab465c73ec09bdc4ec7411b48cf6e9e7827'), (d, 'f0f708d46518bc5f6d79fededaeaaee8ca09bb7c')]:
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip() == sha, 'Source changed; review required'
          s = p.read_text()
          call = '            iecxiv.meshfabric.diagnostics.DiagnosticSettings()\n\n'
          target = '            if (onLogout != null) {\n'
          assert s.count(call) == s.count(target) == 1
          p.write_text(s.replace(call, '').replace(target, call + target, 1))
          s = d.read_text()
          s = s.replace('import androidx.compose.ui.unit.dp', 'import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.unit.sp\nimport androidx.compose.ui.unit.dp')
          a = s.index('    Card(Modifier.fillMaxWidth()) {')
          s = s[:a] + '''    Card(Modifier.fillMaxWidth()) {
                  Column(
                      modifier = Modifier.padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Filled.BugReport,
                              contentDescription = null,
                              modifier = Modifier.size(24.dp),
                              tint = MaterialTheme.colorScheme.primary
                          )
                          Spacer(Modifier.width(8.dp))
                          Text(
                              text = stringResource(R.string.diagnostic_switch_title),
                              modifier = Modifier.weight(1f).padding(end = 12.dp),
                              fontWeight = FontWeight.Bold,
                              fontSize = 15.sp
                          )
                          Switch(checked = active, onCheckedChange = AppDiagnostics::setEnabled)
                      }
                      Text(
                          text = stringResource(R.string.diagnostic_switch_description),
                          style = MaterialTheme.typography.bodySmall
                      )
                  }
              }
          }
          '''
          d.write_text(s)
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated layout
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/layout-base")" || { echo 'dev advanced; review required'; exit 1; }
          git add app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt app/src/main/java/iecxiv/meshfabric/diagnostics/DiagnosticSettings.kt
          git rm .github/workflows/layout-diagnostic-card.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: reorganize diagnostics before logout preserving background'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-card-layout-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
