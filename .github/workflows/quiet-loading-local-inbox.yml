name: Validate quiet loading local inbox and flush bottom content
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/quiet-loading-local-inbox.yml']
permissions:
  contents: write
concurrency:
  group: quiet-loading-local-inbox-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover previous candidate repair whitespace and add bottom layout fixes
        shell: python
        run: |
          import ast,os,subprocess,textwrap
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          workflow='.github/workflows/quiet-loading-local-inbox.yml'
          source=git('show','5fb293205cfa2e255ce6d7fdabd80b9e2aa6dec6:'+workflow)
          lines=source.splitlines();blocks=[]
          for i,line in enumerate(lines):
              if line!='        run: |': continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '): break
                  body.append(following)
              blocks.append(textwrap.dedent('\n'.join(body))+'\n')
          assert len(blocks)==3
          old="assert git('rev-parse','HEAD^')=='aaf9420b6313594133f9a098cde1fd733d6c93d9','Base advanced; review required'"
          guard="base='aaf9420b6313594133f9a098cde1fd733d6c93d9'\nsubprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)\nassert set(git('diff','--name-only',base,'HEAD').splitlines()) <= {'.github/workflows/quiet-loading-local-inbox.yml'},'Functional base changed; review required'"
          assert blocks[1].count(old)==1;blocks[1]=blocks[1].replace(old,guard,1)
          old="edit('AgentInviteLinks.kt',raw,'')"
          new="edit('AgentInviteLinks.kt','                '+raw+'\\n','')"
          assert blocks[1].count(old)==1;blocks[1]=blocks[1].replace(old,new,1)
          for i,body in enumerate(blocks): ast.parse(body,filename='historical-'+str(i)+'.py')
          exec(compile(blocks[1],'quiet-loading-prepare.py','exec'))
          ui=Path('app/src/main/java/iecxiv/meshfabric/ui')
          def patch(name,old,new):
              p=ui/name;t=p.read_text();assert t.count(old)==1,(name,old,t.count(old));p.write_text(t.replace(old,new,1));changed.add(str(p))
          patch('components/MeshFabricAppBar.kt','Scaffold(topBar={ Column {','Scaffold(contentWindowInsets=WindowInsets(0,0,0,0),topBar={ Column {')
          patch('components/MeshFabricAppBar.kt','.consumeWindowInsets(padding).padding(horizontal=12.dp,vertical=8.dp)','.consumeWindowInsets(padding).padding(iecxiv.meshfabric.ui.management.registrationBottomFlushPadding)')
          patch('management/LogScreen.kt','Scaffold(topBar={ServerEventsSearchHeader','Scaffold(contentWindowInsets=WindowInsets(0,0,0,0),topBar={ServerEventsSearchHeader')
          patch('management/LogScreen.kt','showDeviceLabel:Boolean=true)','showDeviceLabel:Boolean=true,flushBottom:Boolean=false)')
          patch('management/LogScreen.kt','inventory=inventory)','inventory=inventory,flushBottom=true)')
          patch('management/LogScreen.kt','Column(modifier.padding(horizontal=12.dp,vertical=8.dp),verticalArrangement=','Column(modifier.padding(if(flushBottom) registrationBottomFlushPadding else PaddingValues(horizontal=12.dp,vertical=8.dp)),verticalArrangement=')
          patch('management/NoticeInbox.kt','Column(modifier.padding(16.dp),verticalArrangement=','Column(modifier.padding(noticeInboxBottomFlushPadding),verticalArrangement=')
          patch('management/NoticeInbox.kt','LazyColumn(Modifier.weight(1f).fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(10.dp)) {','LazyColumn(Modifier.weight(1f).fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(10.dp),contentPadding=PaddingValues(bottom=16.dp)) {')
          patch('management/ProfileBroadcastDialog.kt','ProfileBroadcastInlineLayout(modifier=modifier,title=','ProfileBroadcastInlineLayout(modifier=modifier,flushBottom=embedded,title=')
          patch('management/ProfileBroadcastDialog.kt','ProfileBroadcastInlineLayout(modifier:Modifier,title:','ProfileBroadcastInlineLayout(modifier:Modifier,flushBottom:Boolean=false,title:')
          patch('management/ProfileBroadcastDialog.kt','Column(modifier.imePadding().padding(managementConnectionContentPadding),','Column(modifier.imePadding().padding(if(flushBottom) managementBottomFlushPadding else managementConnectionContentPadding),')
          old='Column(Modifier.weight(1f).fillMaxWidth().padding(if(padded) managementConnectionContentPadding else PaddingValues(0.dp)),verticalArrangement=Arrangement.spacedBy(10.dp),content=content)'
          new='CompositionLocalProvider(LocalNoticeComposeInline provides true) {\n            Column(Modifier.weight(1f).fillMaxWidth().padding(if(padded) managementBottomFlushPadding else PaddingValues(0.dp)),verticalArrangement=Arrangement.spacedBy(10.dp),content=content)\n        }'
          patch('management/NoticeCenterScreen.kt',old,new)
          patch('management/ProfileUserDetailSurface.kt','.imePadding().padding(managementConnectionContentPadding)','.imePadding().padding(if(LocalNoticeComposeInline.current) managementBottomFlushPadding else managementConnectionContentPadding)')
          p=ui/'management/ManagementConnectionSpacing.kt'
          p.write_text(p.read_text()+'\ninternal val managementBottomFlushPadding=PaddingValues(start=16.dp,top=0.dp,end=16.dp,bottom=0.dp)\ninternal val registrationBottomFlushPadding=PaddingValues(start=12.dp,top=8.dp,end=12.dp,bottom=0.dp)\ninternal val noticeInboxBottomFlushPadding=PaddingValues(start=16.dp,top=16.dp,end=16.dp,bottom=0.dp)\n');changed.add(str(p))
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/management/BottomContentSpacingTest.kt');assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import org.junit.Assert.*
          import org.junit.Test
          class BottomContentSpacingTest {
              @Test fun targetContainersHaveNoFixedBottomGap() {
                  assertEquals(0.dp,managementBottomFlushPadding.calculateBottomPadding())
                  assertEquals(0.dp,registrationBottomFlushPadding.calculateBottomPadding())
                  assertEquals(0.dp,noticeInboxBottomFlushPadding.calculateBottomPadding())
              }
              @Test fun topAndSideMarginsRemainUnchanged() {
                  assertEquals(8.dp,registrationBottomFlushPadding.calculateTopPadding())
                  assertEquals(12.dp,registrationBottomFlushPadding.calculateLeftPadding(LayoutDirection.Ltr))
                  assertEquals(16.dp,noticeInboxBottomFlushPadding.calculateTopPadding())
                  assertEquals(16.dp,noticeInboxBottomFlushPadding.calculateRightPadding(LayoutDirection.Ltr))
                  assertEquals(0.dp,managementBottomFlushPadding.calculateTopPadding())
              }
              @Test fun otherManagementViewsKeepTheirOriginalPadding() {
                  assertEquals(16.dp,managementConnectionContentPadding.calculateBottomPadding())
              }
          }
          ''');changed.add(str(p))
          extra=['app/src/main/java/iecxiv/meshfabric/ui/'+name for name in ['components/MeshFabricAppBar.kt','management/LogScreen.kt','management/ProfileBroadcastDialog.kt','management/ProfileUserDetailSurface.kt','management/ManagementConnectionSpacing.kt']]+[str(p)]
          marker="workflow='.github/workflows/quiet-loading-local-inbox.yml';Path(workflow).unlink();paths.append(workflow)"
          assert blocks[2].count(marker)==1
          publish=blocks[2].replace(marker,'paths += '+repr(extra)+'\n'+marker,1)
          publish=publish.replace('ui: clarify local inbox and hide transient agent diagnostics','ui: clarify inbox quiet agent loading and align bottom content')
          ast.parse(publish)
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'quiet-loading-publish.py').write_text(publish)
          (temp/'quiet-loading-paths.txt').write_text('\n'.join(sorted(changed))+'\n')
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines());assert actual==changed
          assert 'height(4.dp)' in (ui/'components/BottomViewLoading.kt').read_text()
      - name: Validate whitespace without suppressing checks
        run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests execute unit tests and lint
        shell: bash
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/quiet-loading-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-loading-layout-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/quiet-loading-build.log
            ${{ runner.temp }}/quiet-loading-publish.py
            ${{ runner.temp }}/quiet-loading-paths.txt
          if-no-files-found: ignore
      - name: Apply only validated changes to dev and retire workflow
        run: python "$RUNNER_TEMP/quiet-loading-publish.py"
