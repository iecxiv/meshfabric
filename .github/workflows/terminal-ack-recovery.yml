name: Verify and publish foreground terminal ACK recovery
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-ack-recovery.yml]
permissions:
  contents: write
concurrency:
  group: terminal-ack-recovery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 07aad548ce066b345af63764e3f2dd41d1075258 HEAD
          git diff --exit-code 07aad548ce066b345af63764e3f2dd41d1075258 HEAD -- . ':(exclude).github/workflows/terminal-ack-recovery.yml'
      - name: Prepare foreground watchdog and explicit view recovery
