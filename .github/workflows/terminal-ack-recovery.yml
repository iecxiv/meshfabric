))\n                            if (rendererError != TerminalRendererError.OUTPUT_CONTINUITY) {\n                                OutlinedButton(onClick = { showRecoveryDialog = true }) {\n                                    Text(stringResource(R.string.terminal_recreate_view))\n                                }\n                            }\n                        }'), ('        // Command Input Dialog\n', '        if (showRecoveryDialog) {\n            androidx.compose.material3.AlertDialog(\n                onDismissRequest = { showRecoveryDialog = false },\n                title = { Text(stringResource(R.string.terminal_recreate_title)) },\n                text = { Text(stringResource(R.string.terminal_recreate_warning)) },\n                confirmButton = {\n                    TextButton(onClick = {\n                        showRecoveryDialog = false\n                        if (viewModel.resetRenderer(renderer)) rendererVersion++\n                    }) { Text(stringResource(R.string.terminal_recreate_view)) }\n                },\n                dismissButton = {\n                    TextButton(onClick = { showRecoveryDialog = false }) {\n                        Text(stringResource(R.string.terminal_recovery_cancel))\n                    }\n                }\n            )\n        }\n\n        // Command Input Dialog\n')], 'app/src/main/res/values/terminal_rendering.xml': [('</resources>', '    <string name="terminal_view_unresponsive">The terminal view is not responding. The remote connection has not been restarted.</string>\n    <string name="terminal_recreate_view">Recreate view</string>\n    <string name="terminal_recreate_title">Recreate the terminal view?</string>\n    <string name="terminal_recreate_warning">Only the local view will be recreated. The remote shell stays open. Full-screen apps such as nano may need to redraw; their visual state cannot be guaranteed after rebuilding from history.</string>\n    <string name="terminal_recovery_cancel">Cancel</string>\n</resources>')], 'app/src/main/res/values-es/terminal_rendering.xml': [('</resources>', '    <string name="terminal_view_unresponsive">La vista de terminal no responde. La conexión remota no se ha reiniciado.</string>\n    <string name="terminal_recreate_view">Recrear vista</string>\n    <string name="terminal_recreate_title">¿Recrear la vista de terminal?</string>\n    <string name="terminal_recreate_warning">Solo se recreará la vista local. El shell remoto seguirá abierto. Las aplicaciones de pantalla completa como nano pueden necesitar redibujarse; no se garantiza su estado visual al reconstruirlo desde el historial.</string>\n    <string name="terminal_recovery_cancel">Cancelar</string>\n</resources>')], 'gradle/libs.versions.toml': [('lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }', 'lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }\nlifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }')], 'app/build.gradle.kts': [('    implementation(libs.lifecycle.runtime.ktx)\n', '    implementation(libs.lifecycle.runtime.ktx)\n    implementation(libs.lifecycle.runtime.compose)\n')]}
          newfiles = {'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalAckWatchdog.kt': 'package iecxiv.meshfabric.ui.terminal\n\n/** Monotonic-clock policy. Only a visible, resumed view spends its ACK deadline. */\ninternal class TerminalAckWatchdog(private val timeoutMs: Long = 20_000L) {\n    private var active = false\n    private var token: String? = null\n    private var deadline: Long? = null\n    private var expired = false\n    init { require(timeoutMs > 0) }\n\n    fun setActive(value: Boolean, now: Long) {\n        if (active == value) return\n        active = value\n        deadline = if (value && token != null && !expired) now + timeoutMs else null\n    }\n    fun sent(value: String, now: Long) {\n        token = value\n        expired = false\n        deadline = if (active) now + timeoutMs else null\n    }\n    fun acknowledge(value: String): Boolean {\n        if (expired || token != value) return false\n        token = null\n        deadline = null\n        return true\n    }\n    fun remaining(now: Long): Long? = if (active && !expired) deadline?.let { (it - now).coerceAtLeast(0L) } else null\n    fun poll(now: Long): Boolean {\n        val due = deadline ?: return false\n        if (!active || expired || token == null || now < due) return false\n        expired = true\n        deadline = null\n        return true\n    }\n    fun reset() {\n        active = false\n        token = null\n        deadline = null\n        expired = false\n    }\n}\n', 'app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalAckWatchdogTest.kt': 'package iecxiv.meshfabric.ui.terminal\n\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass TerminalAckWatchdogTest {\n    @Test fun idleViewNeverTimesOut() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); assertFalse(w.poll(999)) }\n    @Test fun visiblePendingBatchGetsFullDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 5); assertFalse(w.poll(24)); assertTrue(w.poll(25)) }\n    @Test fun backgroundSuspendsDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); w.setActive(false, 5); assertFalse(w.poll(999)); assertNull(w.remaining(999)) }\n    @Test fun resumeGetsFreshFullDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); w.setActive(false, 19); w.setActive(true, 1000); assertFalse(w.poll(1019)); assertTrue(w.poll(1020)) }\n    @Test fun matchingAckClearsDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); assertTrue(w.acknowledge("a")); assertNull(w.remaining(50)); assertFalse(w.poll(50)) }\n    @Test fun wrongAckDoesNotClearPendingBatch() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); assertFalse(w.acknowledge("old")); assertTrue(w.poll(20)) }\n    @Test fun timeoutIsReportedOnlyOnce() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); assertTrue(w.poll(20)); assertFalse(w.poll(30)) }\n    @Test fun lateAckCannotRecoverTimedOutView() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); assertTrue(w.poll(20)); assertFalse(w.acknowledge("a")) }\n    @Test fun duplicateActiveEventsDoNotExtendDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); w.setActive(true, 19); assertTrue(w.poll(20)) }\n    @Test fun hiddenBatchStartsDeadlineOnlyOnResume() { val w = TerminalAckWatchdog(20); w.sent("a", 0); assertFalse(w.poll(999)); w.setActive(true, 1000); assertEquals(20L, w.remaining(1000)); assertTrue(w.poll(1020)) }\n    @Test fun nextBatchGetsOwnDeadline() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); assertTrue(w.acknowledge("a")); w.sent("b", 10); assertFalse(w.poll(29)); assertTrue(w.poll(30)) }\n    @Test fun resetInvalidatesOldAck() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); w.reset(); assertFalse(w.acknowledge("a")); assertFalse(w.poll(999)) }\n    @Test fun sessionsHaveIndependentDeadlines() { val a = TerminalAckWatchdog(20); val b = TerminalAckWatchdog(20); a.setActive(true, 0); b.setActive(true, 0); a.sent("a", 0); b.sent("b", 10); assertTrue(a.poll(20)); assertFalse(b.poll(20)) }\n    @Test fun backgroundAckCanFinishWithoutFalseTimeout() { val w = TerminalAckWatchdog(20); w.setActive(true, 0); w.sent("a", 0); w.setActive(false, 5); assertTrue(w.acknowledge("a")); w.setActive(true, 1000); assertFalse(w.poll(2000)) }\n}\n', 'docs/terminal-ack-recovery.md': '# Foreground-only terminal ACK watchdog\n\nA pending parser acknowledgement has a 20-second deadline only while its renderer is attached and the current navigation lifecycle is RESUMED. Detach/background cancels the scheduled check without abandoning the pending output. Returning to RESUMED gives a fresh full deadline. Repeated RESUMED callbacks do not extend it. An idle/static terminal has no deadline.\n\nOn expiration the view shows ACK_TIMEOUT and stops advancing output. Late ACKs cannot silently clear that error. The socket, remote PTY and journal are not restarted. No Ctrl+L or other synthetic input is sent.\n\nACK_TIMEOUT and renderer loss offer an explicit, confirmed Recreate view action. It removes only the exact expected cached renderer, then constructs another renderer bound to the existing session. Starting the network session is keyed to node/navigation, not renderer replacement. OUTPUT_CONTINUITY gaps do not offer this button because replay cannot recover an already-truncated journal.\n\nRecreation is not a VT snapshot restore. The confirmation warns that nano and other full-screen programs may need a redraw. Existing replay/geometry limitations remain. No automatic retry loop or session-disconnect fallback is added. A watchdog is a conservative timeout heuristic, not proof of a renderer-process crash.\n\nVisibility bindings use tokens so a previous screen cannot pause a newer host. Recovery uses identity-checked removal so an obsolete button cannot destroy a replacement renderer. Observers are removed on disposal; Lifecycle/Activity objects are not stored by the renderer.\n\nFourteen new pure JVM watchdog tests and two store recovery tests are supplied. Existing JavaScript, pipeline, readiness, handshake and four real-WebView echo tests must pass in CI before publication. These do not yet exercise the recovery dialog or Android foreground/background transitions on a physical device. Check those manually, together with nano/keyboard/rotation and c/1 input.\n'}
