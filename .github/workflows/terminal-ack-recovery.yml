elease(token)) return\n        updateAckActivity()\n'), ('        failure.value = TerminalRendererError.OUTPUT_CONTINUITY\n', '        failure.value = TerminalRendererError.OUTPUT_CONTINUITY\n        ackWatchdog.reset()\n        ackJob?.cancel()\n        ackJob = null\n'), ('        val batch = delivery.prepare(page, slice) ?: return\n', '        val batch = delivery.prepare(page, slice) ?: return\n        ackWatchdog.sent(batch.token, nowMs())\n        scheduleAckCheck()\n'), ('        isDestroyed = true\n', '        isDestroyed = true\n        visibility.invalidate()\n        ackWatchdog.reset()\n        ackJob?.cancel()\n        ackJob = null\n'), ('            webView.post { if (!isDestroyed && delivery.acknowledge(page, token)) pump() }', '            webView.post {\n                if (!isDestroyed && failure.value == null && ackWatchdog.acknowledge(token) && delivery.acknowledge(page, token)) {\n                    scheduleAckCheck()\n                    pump()\n                }\n            }')], 'app/src/main/java/iecxiv/meshfabric/ui/terminal/RetainedTerminalStore.kt': [('    fun remove(key: K) { entries.remove(key)?.let(dispose) }', '    fun remove(key: K) { entries.remove(key)?.let(dispose) }\n    fun removeIf(key: K, expected: V): Boolean {\n        val current = entries[key] ?: return false\n        if (current !== expected) return false\n        entries.remove(key)\n        dispose(current)\n        return true\n    }')], 'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalViewModel.kt': [('    fun clearRendering() { renderers.clear() }', '    fun clearRendering() { renderers.clear() }\n    internal fun resetRenderer(expected: TerminalRenderSession): Boolean =\n        renderers.removeIf(expected.session.cleanNodeId, expected)')], 'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt': [('    val renderer = remember(nodeId, viewModel) { viewModel.renderTerminal(context, nodeId) }', '    var rendererVersion by remember(nodeId) { muta