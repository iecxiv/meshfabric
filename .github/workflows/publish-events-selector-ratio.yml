name: Validate and publish Events selectors 2 to 1
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/publish-events-selector-ratio.yml
      - .github/scripts/prepare-events-selector-ratio.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare guarded ratio layout and regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5ecbb9308f39635af1c7e71c94d2b4cfb0b0af29
          mkdir -p validation
          python3 .github/scripts/prepare-events-selector-ratio.py
          git diff --cached --check
      - name: Compile execute JVM lint and prepare exact Android runner
        run: |
          set -euo pipefail
          python3 -m venv /tmp/events-ratio-yaml
          /tmp/events-ratio-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/events-ratio-yaml/bin/python .github/scripts/prepare-events-selector-ratio.py --build
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute all 24 affected Android methods independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 validation/run-log-class-isolation.py
      - name: Verify exact executed methods and source scope
        run: |
          set -euo pipefail
          /tmp/events-ratio-yaml/bin/python .github/scripts/prepare-events-selector-ratio.py --verify
          git diff --cached --check
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-selector-ratio-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish tested sources only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(log): use capped 2 to 1 selectors with multiline menu rows'
          git push origin HEAD:work/registro-server-events
