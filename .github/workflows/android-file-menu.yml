name: Android file menu availability
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-file-menu.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disable unavailable Android menu actions
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/android-menu-base"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '09bbe1686eab7e2daf537085736ca4d91ca5bcb7', 'Source changed; review required'
          s = p.read_text()
          s = s.replace('import iecxiv.meshfabric.R', 'import iecxiv.meshfabric.data.model.DevicePlatform\nimport iecxiv.meshfabric.data.model.platform\nimport androidx.compose.runtime.CompositionLocalProvider\nimport androidx.compose.runtime.staticCompositionLocalOf\nimport iecxiv.meshfabric.R', 1)
          assert s.count('fun FileManagerScreen(') == 1
          s = s.replace('fun FileManagerScreen(', 'private fun FileManagerContent(', 1)
          def call_end(text, start):
              depth, quoted, escaped = 0, False, False
              for i in range(text.index('(', start), len(text)):
                  c = text[i]
                  if quoted:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == '"': quoted = False
                  elif c == '"': quoted = True
                  elif c == '(': depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0: return i + 1
              raise AssertionError('Unbalanced menu call')
          changes = []
          counts = {'create': 0, 'delete': 0, 'upload': 0}
          for m in re.finditer(r'\bDropdownMenuItem\s*\(', s):
              end = call_end(s, m.start())
              block = s[m.start():end]
              label = block.split('leadingIcon', 1)[0].split('onClick', 1)[0]
              if re.search(r'R\.string\.(new_folder|new_text_file|create_folder|create_file)\b', label):
                  condition, key = '!LocalAndroidFiles.current', 'create'
              elif re.search(r'R\.string\.delete\b', label):
                  condition, key = '!LocalAndroidFiles.current', 'delete'
              elif re.search(r'R\.string\.(upload_file|upload)\b', label):
                  condition, key = 'LocalFileUploads.current', 'upload'
              else: continue
              enabled = re.search(r'\benabled\s*=\s*([^,\n]+)', block)
              if enabled:
                  a, b = enabled.span(1)
                  block = block[:a] + '(' + enabled.group(1) + ') && (' + condition + ')' + block[b:]
              else:
                  pos = block.index('(') + 1
                  block = block[:pos] + '\n enabled = ' + condition + ',' + block[pos:]
              counts[key] += 1
              changes.append((m.start(), end, block))
          assert counts['create'] >= 2 and counts['delete'] >= 1 and counts['upload'] >= 1, counts
          for a, b, replacement in reversed(changes): s = s[:a] + replacement + s[b:]
          s += '''
          private val LocalAndroidFiles = staticCompositionLocalOf { false }
          private val LocalFileUploads = staticCompositionLocalOf { true }

          internal fun androidFileUploadAllowed(path: String): Boolean {
              val p = path.replace('\\\\', '/').trim('/').lowercase(Locale.ROOT)
              if (p.split('/').any { it == "." || it == ".." }) return false
              return listOf("sdcard", "storage/emulated/0", "mnt/sdcard", "storage/self/primary").any {
                  p.startsWith("$it/") && p.removePrefix("$it/").isNotBlank()
              }
          }

          @Composable
          fun FileManagerScreen(
              nodeId: String,
              nodeName: String,
              viewModel: FileManagerViewModel,
              onBack: () -> Unit
          ) {
              val groups by viewModel.meshClient.groupedDevices.collectAsState()
              val path by viewModel.currentPath(nodeId).collectAsState()
              val cleanId = nodeId.removePrefix("node//").removePrefix("node/").trim()
              val node = groups.asSequence().flatMap { it.second.asSequence() }.firstOrNull {
                  it.id.removePrefix("node//").removePrefix("node/").trim() == cleanId
              }
              val android = node?.platform == DevicePlatform.ANDROID
              CompositionLocalProvider(
                  LocalAndroidFiles provides android,
                  LocalFileUploads provides (!android || androidFileUploadAllowed(path))
              ) {
                  FileManagerContent(nodeId, nodeName, viewModel, onBack)
              }
          }
          '''
          p.write_text(s)
          t = Path('app/src/test/java/iecxiv/meshfabric/ui/files/AndroidFileMenuTest.kt')
          assert not t.exists()
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package iecxiv.meshfabric.ui.files
          import org.junit.Assert.*
          import org.junit.Test
          class AndroidFileMenuTest {
              @Test fun readOnlyLocations() {
                  listOf("", "/", "Audio", "Audio/a", "Images", "Videos", "Sdcard", "/sdcard/", "/storage/emulated/0", "Sdcard/../Audio", "sdcard-other/a").forEach {
                      assertFalse(it, androidFileUploadAllowed(it))
                  }
              }
              @Test fun uploadInsideSdcard() {
                  listOf("Sdcard/Download", "/sdcard/Documents/", "/storage/emulated/0/Download", "/mnt/sdcard/a").forEach {
                      assertTrue(it, androidFileUploadAllowed(it))
                  }
              }
          }
          ''')
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated availability rules
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/android-menu-base")"
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt app/src/test/java/iecxiv/meshfabric/ui/files/AndroidFileMenuTest.kt
          git rm .github/workflows/android-file-menu.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: disable unsupported Android file menu actions by location'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-file-menu-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
