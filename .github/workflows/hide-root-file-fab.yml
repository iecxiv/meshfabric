name: Hide root file FAB
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/hide-root-file-fab.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Hide both FAB variants in virtual roots
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/root-fab-base"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          s = p.read_text()
          assert 'LocalHideRootFileFab' not in s
          marker = 'LocalAndroidFiles provides android,'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '\n        LocalHideRootFileFab provides hideRootFileFab(android, viewModel.isWindowsFiles(nodeId), path),', 1)
          assert s.count('FloatingActionButton(') == 2
          s = s.replace('FloatingActionButton(', 'if (!LocalHideRootFileFab.current) FloatingActionButton(')
          assert s.count('expanded = fabMenuExpanded,') == 2
          s = s.replace('expanded = fabMenuExpanded,', 'expanded = fabMenuExpanded && !LocalHideRootFileFab.current,')
          s += '''
          private val LocalHideRootFileFab = staticCompositionLocalOf { false }

          internal fun hideRootFileFab(android: Boolean, windows: Boolean, path: String): Boolean =
              (android || windows) && iecxiv.meshfabric.data.remote.WindowsDriveSupport.selector(path)
          '''
          p.write_text(s)
          t = Path('app/src/test/java/iecxiv/meshfabric/ui/files/RootFileFabVisibilityTest.kt')
          assert not t.exists()
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package iecxiv.meshfabric.ui.files
          import org.junit.Assert.*
          import org.junit.Test
          class RootFileFabVisibilityTest {
              @Test fun hiddenOnlyInVirtualRoots() {
                  listOf("", "/").forEach {
                      assertTrue(hideRootFileFab(true, false, it))
                      assertTrue(hideRootFileFab(false, true, it))
                      assertFalse(hideRootFileFab(false, false, it))
                  }
              }
              @Test fun visibleInsideDrivesAndCategories() {
                  listOf("C:/", "D:/", "C:/Documents").forEach {
                      assertFalse(hideRootFileFab(false, true, it))
                  }
                  listOf("Audio", "Images", "Sdcard", "Videos", "/Sdcard/Download").forEach {
                      assertFalse(hideRootFileFab(true, false, it))
                  }
              }
          }
          ''')
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated change
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/root-fab-base")"
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt app/src/test/java/iecxiv/meshfabric/ui/files/RootFileFabVisibilityTest.kt
          git rm .github/workflows/hide-root-file-fab.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: hide file FAB in Android and Windows virtual roots'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-file-fab-visibility-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
