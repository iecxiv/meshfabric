name: Integrate device browsing on dev
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/integrate-device-browsing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-device-browsing-dev
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply bounded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('app/src/main/java/iecxiv/meshfabric')
          expected = {'data/model/Models.kt':'5e5a2147da395c5ac65142f6b4b2b50598483beb','ui/devices/DeviceListScreen.kt':'76ff168da4bb500622a680ca07c459dec79ec9ea','ui/devices/DeviceListViewModel.kt':'2780d84a5b82782ca2dfc82d45e3846caa4d420f'}
          for name, sha in expected.items():
              data = (root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha, 'Source changed: '+name
          def replace_once(text, old, new):
              assert text.count(old) == 1, 'Anchor mismatch: '+old[:90]
              return text.replace(old, new, 1)
          p = root/'data/model/Models.kt'
          s = replace_once(p.read_text(), '    @Transient val lastSeenConnected: Boolean = false\n', '    @Transient val lastSeenConnected: Boolean = false,\n    val rname: String? = null,\n    val intelamt: com.google.gson.JsonElement? = null,\n    val sessions: com.google.gson.JsonElement? = null\n')
          p.write_text(s)
          p = root/'ui/devices/DeviceListViewModel.kt'
          s = replace_once(p.read_text(), 'fun toggleAllGroups() {', 'fun toggleAllGroups(groupIds: Set<String>? = null) {')
          s = replace_once(s, 'val allGroupIds = groupedDevices.value.map { it.first.id }.toSet()', 'val allGroupIds = groupIds ?: groupedDevices.value.map { it.first.id }.toSet()')
          s = replace_once(s, '{ rawGroups, query, addresses, lastSeen ->', '{ rawGroups, _, addresses, lastSeen ->')
          start = s.index('        if (query.isBlank()) {')
          end = s.index('    }.stateIn(', start)
          s = s[:start] + '        groups\n' + s[end:]
          p.write_text(s)
          policy = r'''package iecxiv.meshfabric.ui.devices

          import com.google.gson.JsonElement
          import iecxiv.meshfabric.data.model.*
          import java.util.Locale

          internal enum class DeviceListFilter { ALL, ONLINE, OFFLINE, SESSIONS, STARRED, AMT, HELP, TAGGED, UNTAGGED }
          internal fun deviceListDisplayName(node: MeshNode, osName: Boolean): String =
              if (osName) node.rname?.takeIf { it.isNotBlank() && it.none { c -> c.isISOControl() } } ?: node.name else node.name
          internal fun deviceListPowerSection(value: Int?): Int = when (value) { 1 -> 1; 6, 8 -> 2; else -> 0 }
          internal fun deviceListUsesSections(sort: DeviceListSort) = sort in setOf(DeviceListSort.GROUP, DeviceListSort.POWER, DeviceListSort.TAGS, DeviceListSort.GROUP_TAGS)
          internal fun deviceListEffectiveShowDisconnected(saved: Boolean, filter: DeviceListFilter) = filter == DeviceListFilter.OFFLINE || saved
          private fun positive(value: JsonElement?, depth: Int = 0): Boolean {
              if (value == null || value.isJsonNull || depth > 12) return false
              return when {
                  value.isJsonObject -> value.asJsonObject.entrySet().any { positive(it.value, depth + 1) }
                  value.isJsonArray -> value.asJsonArray.any { positive(it, depth + 1) }
                  value.isJsonPrimitive && value.asJsonPrimitive.isBoolean -> value.asBoolean
                  value.isJsonPrimitive && value.asJsonPrimitive.isNumber -> runCatching { value.asBigDecimal.signum() > 0 }.getOrDefault(false)
                  else -> false
              }
          }
          internal fun deviceListMatchesFilter(node: MeshNode, filter: DeviceListFilter, stars: Set<String>, localSessions: Set<String>): Boolean {
              val sessions = node.sessions?.takeIf { it.isJsonObject }?.asJsonObject
              val tags = node.tags.orEmpty().filter { it.isNotBlank() }
              return when (filter) {
                  DeviceListFilter.ALL -> true
                  DeviceListFilter.ONLINE -> node.isOnline
                  DeviceListFilter.OFFLINE -> !node.isOnline
                  DeviceListFilter.STARRED -> node.id in stars
                  DeviceListFilter.AMT -> node.intelamt?.isJsonObject == true
                  DeviceListFilter.HELP -> positive(sessions?.get("help")) || sessions?.get("help")?.let { it.isJsonPrimitive && it.asJsonPrimitive.isString && it.asString.isNotBlank() } == true
                  DeviceListFilter.TAGGED -> tags.isNotEmpty()
                  DeviceListFilter.UNTAGGED -> tags.isEmpty()
                  DeviceListFilter.SESSIONS -> listOf("kvm", "terminal", "files", "registry", "tcp", "udp").any { positive(sessions?.get(it)) } ||
                      node.id in localSessions || node.id.removePrefix("node//").removePrefix("node/").trim() in localSessions
              }
          }
          internal fun deviceListFiltered(groups: List<Pair<MeshGroup, List<MeshNode>>>, filter: DeviceListFilter,
              showDisconnected: Boolean, query: String, osName: Boolean, stars: Set<String>, localSessions: Set<String>): List<Pair<MeshGroup, List<MeshNode>>> {
              val q = query.trim().lowercase(Locale.ROOT)
              val show = deviceListEffectiveShowDisconnected(showDisconnected, filter)
              return groups.mapNotNull { (group, nodes) ->
                  val kept = nodes.filter { n -> (show || n.isOnline) && deviceListMatchesFilter(n, filter, stars, localSessions) &&
                      (q.isEmpty() || (listOf(deviceListDisplayName(n, osName), n.name, n.rname.orEmpty(), n.osdesc.orEmpty(), group.name, n.ip.orEmpty()) +
                          n.tags.orEmpty() + n.networkIpv4.map { it.address }).any { it.lowercase(Locale.ROOT).contains(q) }) }
                  if (kept.isNotEmpty() || nodes.isEmpty() && q.isEmpty() && filter == DeviceListFilter.ALL && show) group to kept else null
              }
          }
          internal fun deviceListSections(groups: List<Pair<MeshGroup, List<MeshNode>>>, sort: DeviceListSort,
              reverse: Boolean, osName: Boolean, es: Boolean): List<Pair<MeshGroup, List<MeshNode>>> {
              val names = Comparator<MeshNode> { a, b ->
                  val c = deviceListDisplayName(a, osName).trim().compareTo(deviceListDisplayName(b, osName).trim(), true)
                  if (c != 0) c else a.id.compareTo(b.id)
              }
              if (sort == DeviceListSort.GROUP) {
                  val ordered = groups.sortedWith(compareBy<Pair<MeshGroup,List<MeshNode>>,String>(String.CASE_INSENSITIVE_ORDER) { it.first.name }.thenBy { it.first.id })
                  return (if (reverse) ordered.reversed() else ordered).map { (g, ns) -> g to ns.distinctBy { it.id }.sortedWith(Comparator { a, b ->
                      val status = b.isOnline.compareTo(a.isOnline); if (status != 0) status else names.compare(a,b)
                  }) }
              }
              val entries = groups.flatMap { (g, ns) -> ns.map { g to it } }.distinctBy { it.second.id }
              if (entries.isEmpty()) return emptyList()
              if (!deviceListUsesSections(sort)) {
                  val rows = entries.associate { (g,n) -> n.id to deviceListInventorySortRow(g,n).copy(name=deviceListDisplayName(n,osName)) }
                  val comparator = deviceListComparator(sort, reverse)
                  return listOf(MeshGroup(id="browse/flat/${sort.name}") to entries.map { it.second }.sortedWith(Comparator { a,b -> comparator.compare(rows.getValue(a.id),rows.getValue(b.id)) }))
              }
              if (sort == DeviceListSort.POWER) {
                  val order = (if (reverse) listOf(2,1) else listOf(1,2)) + 0
                  return order.mapNotNull { state ->
                      val ns = entries.map { it.second }.filter { deviceListPowerSection(it.pwr) == state }.sortedWith(names)
                      val title = when (state) { 1 -> if(es) "Encendido" else "Powered on"; 2 -> if(es) "Apagado" else "Powered off"; else -> if(es) "Desconocido" else "Unknown" }
                      if(ns.isEmpty()) null else MeshGroup(id="browse/power/$state",name=title) to ns
                  }
              }
              val buckets = linkedMapOf<String,Pair<String,MutableList<MeshNode>>>()
              fun add(key:String,title:String,node:MeshNode) { buckets.getOrPut(key) { title to mutableListOf() }.second.add(node) }
              entries.forEach { (g,n) ->
                  val tags = n.tags.orEmpty().map { it.trim() }.filter { it.isNotEmpty() }.distinct()
                  if(sort == DeviceListSort.TAGS) {
                      if(tags.isEmpty()) add("browse/tag/empty",if(es) "Sin etiqueta" else "Untagged",n)
                      else tags.forEach { tag -> add("browse/tag/${tag.length}:$tag",tag,n) }
                  } else {
                      if(tags.isEmpty()) add("browse/group/${g.id.length}:${g.id}/empty",g.name,n)
                      else tags.forEach { tag -> add("browse/group/${g.id.length}:${g.id}/${tag.length}:$tag",g.name+" - "+tag,n) }
                  }
              }
              val ordered = buckets.entries.sortedWith(compareBy<Map.Entry<String,Pair<String,MutableList<MeshNode>>>,String>(String.CASE_INSENSITIVE_ORDER) { it.value.first }.thenBy { it.key })
              return (if(reverse) ordered.reversed() else ordered).map { (key,value) -> MeshGroup(id=key,name=value.first) to value.second.distinctBy { it.id }.sortedWith(names) }
          }
          '''
          menus = r'''package iecxiv.meshfabric.ui.devices

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.semantics.selected
          import androidx.compose.ui.semantics.semantics
          import androidx.compose.ui.unit.dp

          internal data class DeviceBrowseMenuState(val sort:DeviceListSort,val reverse:Boolean,val filter:DeviceListFilter,
              val osName:Boolean,val selecting:Boolean,val onSort:(DeviceListSort)->Unit,val onReverse:()->Unit,
              val onFilter:(DeviceListFilter)->Unit,val onOsName:()->Unit,val onSelection:()->Unit)
          private val BrowseBlue=Color(0xFF2196F3)
          private fun sortLabel(s:DeviceListSort,es:Boolean)=when(s) {
              DeviceListSort.GROUP->if(es) "Grupo" else "Group"
              DeviceListSort.POWER->if(es) "Encendido" else "Power"
              DeviceListSort.DEVICE->if(es) "Dispositivo" else "Device"
              DeviceListSort.TAGS->if(es) "Etiqueta" else "Tags"
              DeviceListSort.GROUP_TAGS->if(es) "Etiquetas de grupo" else "Group tags"
              DeviceListSort.LAST_SEEN->if(es) "Última vez visto" else "Last seen"
              DeviceListSort.LAST_BOOT->if(es) "Último arranque" else "Last boot up time"
          }
          private fun filterLabel(f:DeviceListFilter,es:Boolean)=when(f) {
              DeviceListFilter.ALL->if(es) "Todos" else "All"
              DeviceListFilter.ONLINE->if(es) "En línea" else "Online"
              DeviceListFilter.OFFLINE->if(es) "Fuera de línea" else "Offline"
              DeviceListFilter.SESSIONS->if(es) "Sesiones" else "Sessions"
              DeviceListFilter.STARRED->if(es) "Destacado" else "Starred"
              DeviceListFilter.AMT->"Intel AMT"
              DeviceListFilter.HELP->if(es) "Ayuda" else "Help"
              DeviceListFilter.TAGGED->if(es) "Etiquetado" else "Tagged"
              DeviceListFilter.UNTAGGED->if(es) "Sin etiquetar" else "Untagged"
          }
          @Composable private fun ColumnScope.BrowseSortItems(menu:DeviceBrowseMenuState,es:Boolean,close:()->Unit) {
              DeviceListSort.entries.forEach { option ->
                  DropdownMenuItem(text={Text(sortLabel(option,es))},trailingIcon={RadioButton(selected=menu.sort==option,onClick=null)},
                      onClick={menu.onSort(option);close()})
              }
              HorizontalDivider()
              DropdownMenuItem(text={Text(if(es) "Invertir orden" else "Reverse order")},
                  trailingIcon={Checkbox(checked=menu.reverse,onCheckedChange=null)},onClick=menu.onReverse)
          }
          @Composable internal fun DeviceHeaderSort(menu:DeviceBrowseMenuState) {
              var expanded by remember {mutableStateOf(false)}
              val es=LocalConfiguration.current.locales[0].language=="es"
              Box {
                  IconButton(onClick={expanded=true},modifier=Modifier.size(38.dp).testTag("devices_header_sort")) {
                      Icon(Icons.Default.Sort,if(es) "Ordenar" else "Sort",Modifier.size(20.dp),tint=if(menu.sort!=DeviceListSort.GROUP || menu.reverse) BrowseBlue else LocalContentColor.current)
                  }
                  DropdownMenu(expanded=expanded,onDismissRequest={expanded=false},modifier=Modifier.heightIn(max=(LocalConfiguration.current.screenHeightDp.dp-96.dp).coerceAtLeast(96.dp)),
                      shape=MaterialTheme.shapes.medium,containerColor=MaterialTheme.colorScheme.surfaceVariant,tonalElevation=2.dp,
                      border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) { BrowseSortItems(menu,es) {expanded=false} }
              }
          }
          @Composable internal fun DeviceHeaderBrowseFilter(showIps:Boolean,showDisconnected:Boolean,onShowIps:(Boolean)->Unit,
              onShowDisconnected:(Boolean)->Unit,menu:DeviceBrowseMenuState) {
              var expanded by remember {mutableStateOf(false)}
              var page by remember {mutableStateOf(0)}
              val es=LocalConfiguration.current.locales[0].language=="es"
              fun close() {expanded=false;page=0}
              Box {
                  IconButton(onClick={page=0;expanded=true},modifier=Modifier.size(38.dp).testTag("devices_header_filter")) {
                      Icon(Icons.Default.FilterAlt,if(es) "Filtros de equipos" else "Device filters",Modifier.size(20.dp),
                          tint=if(showIps || showDisconnected || menu.filter!=DeviceListFilter.ALL || menu.osName || menu.selecting) BrowseBlue else LocalContentColor.current)
                  }
                  DropdownMenu(expanded=expanded,onDismissRequest={close()},modifier=Modifier.heightIn(max=(LocalConfiguration.current.screenHeightDp.dp-96.dp).coerceAtLeast(96.dp)).testTag("devices_header_filter_menu"),
                      shape=MaterialTheme.shapes.medium,containerColor=MaterialTheme.colorScheme.surfaceVariant,tonalElevation=2.dp,
                      border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {
                      if(page!=0) DropdownMenuItem(text={Text(if(es) "Volver" else "Back")},leadingIcon={Icon(Icons.Default.ArrowBack,null)},onClick={page=0})
                      when(page) {
                          1->BrowseSortItems(menu,es) {close()}
                          2->DeviceListFilter.entries.forEach { option -> DropdownMenuItem(text={Text(filterLabel(option,es))},
                              trailingIcon={RadioButton(selected=menu.filter==option,onClick=null)},onClick={menu.onFilter(option);close()}) }
                          else->{
                              DropdownMenuItem(text={Text(if(es) "Mostrar IPs" else "Show IPs")},leadingIcon={Icon(Icons.Default.Visibility,null)},
                                  trailingIcon={Checkbox(checked=showIps,onCheckedChange=null)},modifier=Modifier.testTag("devices_header_show_ips").semantics {selected=showIps},onClick={onShowIps(!showIps);close()})
                              DropdownMenuItem(enabled=menu.filter!=DeviceListFilter.OFFLINE,text={Text(if(es) "Mostrar desconectados" else "Show disconnected devices")},
                                  leadingIcon={Icon(Icons.Default.LinkOff,null)},trailingIcon={Checkbox(checked=showDisconnected,onCheckedChange=null)},
                                  modifier=Modifier.testTag("devices_header_show_disconnected").semantics {selected=showDisconnected},onClick={onShowDisconnected(!showDisconnected);close()})
                              DropdownMenuItem(text={Text(if(menu.selecting) {if(es) "Cancelar selección" else "Cancel selection"} else {if(es) "Seleccionar" else "Select"})},
                                  leadingIcon={Icon(Icons.Default.CheckBox,null)},onClick={menu.onSelection();close()})
                              DropdownMenuItem(text={Text(if(es) "Ordenar por" else "Sort by")},leadingIcon={Icon(Icons.Default.Sort,null)},trailingIcon={Icon(Icons.Default.ChevronRight,null)},onClick={page=1})
                              DropdownMenuItem(text={Text(if(es) "Filtrar" else "Filter")},leadingIcon={Icon(Icons.Default.FilterAlt,null)},trailingIcon={Icon(Icons.Default.ChevronRight,null)},onClick={page=2})
                              HorizontalDivider()
                              DropdownMenuItem(text={Text(if(es) "Nombre de sistema operativo" else "Show OS name")},trailingIcon={Checkbox(checked=menu.osName,onCheckedChange=null)},onClick={menu.onOsName();close()})
                          }
                      }
                  }
              }
          }
          '''
          for name, data in [('DeviceListPresentation.kt',policy),('DeviceListHeaderMenus.kt',menus)]:
              p=root/'ui/devices'/name
              assert not p.exists(), 'New file already exists: '+name
              p.write_text(data)
          p=root/'ui/devices/DeviceListScreen.kt'
          s=p.read_text()
          start=s.index('    val filteredGroups = remember(allGroups, onlyOnline) {')
          end=s.index('    val connection by',start)
          s=s[:start]+s[end:]
          sessions='    val desktop by viewModel.desktopSessionsStatus.collectAsState()\n    val terminal by viewModel.terminalSessionsStatus.collectAsState()\n    val files by viewModel.fileSessionsStatus.collectAsState()\n'
          s=replace_once(s,sessions,'')
          start=s.index('    var groupBy by rememberSaveable(scope)')
          end=s.index('    var selectionScope by rememberSaveable',start)
          state=r'''    val es=androidx.compose.ui.platform.LocalConfiguration.current.locales[0].language=="es"
              var filterName by rememberSaveable(scope) { mutableStateOf(preferences.getString("$preferenceKey.filter", "ALL") ?: "ALL") }
              val filter=DeviceListFilter.entries.firstOrNull {it.name==filterName} ?: DeviceListFilter.ALL
              var showOsName by rememberSaveable(scope) {mutableStateOf(preferences.getBoolean("$preferenceKey.osName",false))}
              var starredIds by rememberSaveable(scope) {mutableStateOf(preferences.getStringSet("$preferenceKey.stars",emptySet()).orEmpty().toList())}
              LaunchedEffect(scope,sort,reverse,filter,showOsName,starredIds) {
                  if(server.isNotBlank() && account.isNotBlank()) preferences.edit().putString("$preferenceKey.sort",sort.name)
                      .putBoolean("$preferenceKey.reverse",reverse).putString("$preferenceKey.filter",filter.name)
                      .putBoolean("$preferenceKey.osName",showOsName).putStringSet("$preferenceKey.stars",starredIds.toSet()).apply()
              }
              val desktop by viewModel.desktopSessionsStatus.collectAsState()
              val terminal by viewModel.terminalSessionsStatus.collectAsState()
              val files by viewModel.fileSessionsStatus.collectAsState()
              val localSessionIds=(desktop.filterValues {it==SessionStatus.CONNECTED}.keys+terminal.filterValues {it==SessionStatus.CONNECTED}.keys+files.filterValues {it==SessionStatus.CONNECTED}.keys).toSet()
              val filteredGroups=remember(allGroups,onlyOnline,filter,search,showOsName,starredIds,localSessionIds) {
                  deviceListFiltered(allGroups,filter,!onlyOnline,search,showOsName,starredIds.toSet(),localSessionIds)
              }
              val groupBy=deviceListUsesSections(sort)
              val groups=remember(filteredGroups,sort,reverse,showOsName,es) {deviceListSections(filteredGroups,sort,reverse,showOsName,es)}
              val visibleIds=remember(filteredGroups) {filteredGroups.flatMap {it.second}.map {it.id}.toSet()}
          '''
          s=s[:start]+state+s[end:]
          anchor='    val hasConnectedSessions ='
          at=s.index(anchor)
          menu=r'''    val browseMenu=DeviceBrowseMenuState(sort,reverse,filter,showOsName,selectionActive,
                  onSort={sortName=it.name},onReverse={reverse=!reverse},onFilter={filterName=it.name},
                  onOsName={showOsName=!showOsName},onSelection={selectionMode=!selectionActive;updateSelection(selection.clear())})
          '''
          s=s[:at]+menu+s[at:]
          s=replace_once(s,'{ viewModel.toggleAllGroups() }','{ viewModel.toggleAllGroups(groups.map {it.first.id}.toSet()) }')
          s=replace_once(s,'            DeviceHeaderFilter(showIps=!hideDeviceNetworkInfo,showDisconnected=!onlyOnline,','            DeviceHeaderSort(browseMenu)\n            DeviceHeaderBrowseFilter(showIps=!hideDeviceNetworkInfo,showDisconnected=deviceListEffectiveShowDisconnected(!onlyOnline,filter),\n                menu=browseMenu,')
          start=s.index('        DeviceListBrowseControls(')
          end=s.index('        AnimatedVisibility(showSearch)',start)
          context=r'''        if(selectionActive) Surface(modifier=Modifier.fillMaxWidth().padding(horizontal=12.dp,vertical=6.dp),
                  shape=MaterialTheme.shapes.medium,color=MaterialTheme.colorScheme.surfaceVariant,
                  border=androidx.compose.foundation.BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {
                  Row(Modifier.fillMaxWidth().padding(horizontal=4.dp,vertical=2.dp),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(4.dp)) {
                      IconButton(onClick={selectionMode=false;selectedIds=emptyList()}) {Icon(Icons.Default.Close,if(es) "Cancelar selección" else "Cancel selection")}
                      Checkbox(checked=visibleIds.isNotEmpty() && selection.ids.containsAll(visibleIds),enabled=visibleIds.isNotEmpty(),onCheckedChange={
                          updateSelection(if(selection.ids.containsAll(visibleIds)) selection.clear() else selection.selectVisible(scope,visibleIds))
                      })
                      Text(if(es) "Todos (${selection.ids.size})" else "All (${selection.ids.size})",style=MaterialTheme.typography.labelMedium)
                      Spacer(Modifier.weight(1f))
                      DeviceListExportButton(viewModel.meshClient,filteredGroups.flatMap {(g,ns)->ns.filter {it.id in selection.ids}.map {g to it}}.distinctBy {it.second.id})
                  }
              }
          '''
          s=s[:start]+context+s[end:]
          s=replace_once(s,'enabled = groupExpanded && nodes.isNotEmpty(),','enabled = nodes.isNotEmpty(),')
          s=replace_once(s,'items(nodes,key={ "node_${it.id}" })','items(nodes,key={ "node_${group.id.length}:${group.id}_${it.id}" })')
          old='onStartSelection = { selectionMode = true; updateSelection(selection.toggle(scope, node.id, visibleIds)) })'
          new='onStartSelection = { selectionMode = true; updateSelection(selection.toggle(scope, node.id, visibleIds)) },\n                        showOsName=showOsName,starred=node.id in starredIds,onToggleStar={starredIds=if(node.id in starredIds) starredIds-node.id else starredIds+node.id})'
          s=replace_once(s,old,new)
          s=replace_once(s,'onStartSelection:(()->Unit)?=null) {','onStartSelection:(()->Unit)?=null,showOsName:Boolean=false,starred:Boolean=false,onToggleStar:(()->Unit)?=null) {')
          s=replace_once(s,'Text(node.name.ifEmpty { stringResource(R.string.unknown_device) }','Text(deviceListDisplayName(node,showOsName).ifEmpty { stringResource(R.string.unknown_device) }')
          old='                    DeviceOptionsToggle(otherExpanded)'
          new='                    if(onToggleStar!=null) IconButton(onClick=onToggleStar,modifier=Modifier.size(38.dp)) {\n                        Icon(if(starred) Icons.Default.Star else Icons.Default.StarBorder,if(androidx.compose.ui.platform.LocalConfiguration.current.locales[0].language=="es") "Destacado local en MeshFabric" else "Local MeshFabric favorite",Modifier.size(20.dp),tint=if(starred) MaterialTheme.colorScheme.primary else LocalContentColor.current)\n                    }\n                    DeviceOptionsToggle(otherExpanded)'
          s=replace_once(s,old,new)
          p.write_text(s)
          tests=r'''package iecxiv.meshfabric.ui.devices

          import com.google.gson.Gson
          import com.google.gson.JsonParser
          import iecxiv.meshfabric.data.model.*
          import org.junit.Assert.*
          import org.junit.Test

          class DeviceListPresentationTest {
              private val group=MeshGroup(id="mesh//one",name="Group")
              private fun node(id:String,tags:List<String> = emptyList(),power:Int?=null)=MeshNode(id=id,name=id,meshid=group.id,tags=tags,pwr=power)
              private fun sections(nodes:List<MeshNode>,sort:DeviceListSort)=deviceListSections(listOf(group to nodes),sort,false,false,true)
              @Test fun flatCriteriaNeverCreateSeveralSections() {
                  for(sort in listOf(DeviceListSort.DEVICE,DeviceListSort.LAST_SEEN,DeviceListSort.LAST_BOOT)) {
                      assertFalse(deviceListUsesSections(sort));assertEquals(1,sections(listOf(node("b"),node("a")),sort).size)
                  }
                  assertEquals(listOf("a","b"),sections(listOf(node("b"),node("a")),DeviceListSort.DEVICE).single().second.map {it.id})
              }
              @Test fun tagsDuplicateAppearancesButSelectionUsesUniqueIds() {
                  val result=sections(listOf(node("a",listOf("x","y")),node("b",listOf("x"))),DeviceListSort.TAGS)
                  assertEquals(3,result.sumOf {it.second.size})
                  assertEquals(setOf("a","b"),DeviceListSelection("scope").selectVisible("scope",result.flatMap {it.second}.map {it.id}.toSet()).ids)
                  val keys=result.flatMap {(g,ns)->ns.map {g.id to it.id}}
                  assertEquals(keys.size,keys.distinct().size)
              }
              @Test fun groupTagsRetainUntaggedAndSeparateSameNameGroups() {
                  val result=sections(listOf(node("a"),node("b",listOf("tag"))),DeviceListSort.GROUP_TAGS)
                  assertEquals(setOf("Group","Group - tag"),result.map {it.first.name}.toSet())
                  val other=group.copy(id="mesh//other")
                  val sameNames=deviceListSections(listOf(group to listOf(node("a")),other to listOf(node("b").copy(meshid=other.id))),DeviceListSort.GROUP_TAGS,false,false,true)
                  assertEquals(2,sameNames.map {it.first.id}.distinct().size)
              }
              @Test fun offSectionRequiresExplicitReportedOffAndNonemptyRows() {
                  assertEquals(2,sections(listOf(node("on",power=1),node("unknown")),DeviceListSort.POWER).size)
                  assertEquals(setOf("Encendido","Apagado","Desconocido"),sections(listOf(node("on",power=1),node("off",power=8),node("unknown")),DeviceListSort.POWER).map {it.first.name}.toSet())
                  for(value in listOf(null,0,2,3,4,5,7,9)) assertEquals(0,deviceListPowerSection(value))
                  assertEquals(2,deviceListPowerSection(6))
                  assertEquals(2,deviceListPowerSection(8))
              }
              @Test fun connectivityNeverInventsPower() {
                  assertEquals("Desconocido",sections(listOf(node("a").copy(conn=1)),DeviceListSort.POWER).single().first.name)
              }
              @Test fun offlineTemporarilyOverridesSavedVisibilityWithoutChangingIt() {
                  for(saved in listOf(false,true)) {
                      assertTrue(deviceListEffectiveShowDisconnected(saved,DeviceListFilter.OFFLINE))
                      assertEquals(saved,deviceListEffectiveShowDisconnected(saved,DeviceListFilter.ALL))
                      val groups=listOf(group to listOf(node("on").copy(conn=1),node("off")))
                      val filtered=deviceListFiltered(groups,DeviceListFilter.OFFLINE,saved,"",false,emptySet(),emptySet())
                      assertEquals(listOf("off"),filtered.single().second.map {it.id})
                  }
              }
              @Test fun realNameIsNotOperatingSystemDescription() {
                  val n=node("alias").copy(rname="HOST",osdesc="Linux")
                  assertEquals("HOST",deviceListDisplayName(n,true));assertEquals("alias",deviceListDisplayName(n,false))
                  assertEquals("alias",deviceListDisplayName(n.copy(rname=null),true))
              }
              @Test fun metadataSurvivesInventoryDecodingAndCopies() {
                  val n=Gson().fromJson("""{"_id":"a","rname":"HOST","intelamt":{},"sessions":{"help":1,"kvm":{"user":1}}}""",MeshNode::class.java).copy(conn=1)
                  assertEquals("HOST",n.rname)
                  for(filter in listOf(DeviceListFilter.AMT,DeviceListFilter.HELP,DeviceListFilter.SESSIONS)) assertTrue(deviceListMatchesFilter(n,filter,emptySet(),emptySet()))
              }
              @Test fun missingMetadataDoesNotInventFilters() {
                  for(filter in listOf(DeviceListFilter.AMT,DeviceListFilter.HELP,DeviceListFilter.SESSIONS,DeviceListFilter.STARRED)) assertFalse(deviceListMatchesFilter(node("a"),filter,emptySet(),emptySet()))
                  assertTrue(deviceListMatchesFilter(node("a"),DeviceListFilter.STARRED,setOf("a"),emptySet()))
                  assertTrue(deviceListMatchesFilter(node("node//a"),DeviceListFilter.SESSIONS,emptySet(),setOf("a")))
                  assertFalse(deviceListMatchesFilter(node("a").copy(sessions=JsonParser.parseString("{\"kvm\":0,\"help\":false}")),DeviceListFilter.SESSIONS,emptySet(),emptySet()))
              }
