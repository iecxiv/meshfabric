      - name: Check patch whitespace
        run: git diff --check
      - name: Build and compile UI tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-browsing-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated change and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          rm .github/workflows/integrate-device-browsing.yml
          git add app/src/main/java/iecxiv/meshfabric/data/model/Models.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListPresentation.kt app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt app/src/test/java/iecxiv/meshfabric/ui/devices/DeviceListPresentationTest.kt .github/workflows/integrate-device-browsing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(devices): integrate header sorting filters and contextual selection'
          git push origin HEAD:dev
