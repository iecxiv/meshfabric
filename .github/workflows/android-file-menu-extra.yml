name: Extend Android file menu restrictions
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-file-menu-extra.yml']
permissions:
  contents: write
concurrency:
  group: android-file-menu-extra
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disable Android rename and ZIP and verify creation restrictions
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/android-extra-base"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == 'fa842c8efffd8bae5bebf0f9b1bb97106c04e707', 'Source changed; review required'
          s = p.read_text()
          def call_end(start):
              depth, quoted, escaped = 0, False, False
              for i in range(s.index('(', start), len(s)):
                  c = s[i]
                  if quoted:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == '"': quoted = False
                  elif c == '"': quoted = True
                  elif c == '(': depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0: return i + 1
              raise AssertionError('Unbalanced menu')
          changes = []
          counts = {'rename': 0, 'compress_zip': 0, 'create': 0, 'delete': 0}
          for m in re.finditer(r'\bDropdownMenuItem\s*\(', s):
              end = call_end(m.start())
              block = s[m.start():end]
              label = block.split('leadingIcon', 1)[0].split('onClick', 1)[0]
              match = re.search(r'R\.string\.(rename|compress_zip|new_folder|new_text_file|create_folder|create_file|delete)\b', label)
              if not match: continue
              key = match.group(1)
              if key not in ('rename', 'compress_zip', 'delete'): key = 'create'
              counts[key] += 1
              enabled = re.search(r'\benabled\s*=\s*([^,\n]+)', block)
              if enabled and '!LocalAndroidFiles.current' in enabled.group(1): continue
              if enabled:
                  a, b = enabled.span(1)
                  block = block[:a] + '(' + enabled.group(1) + ') && (!LocalAndroidFiles.current)' + block[b:]
              else:
                  pos = block.index('(') + 1
                  block = block[:pos] + '\n enabled = !LocalAndroidFiles.current,' + block[pos:]
              changes.append((m.start(), end, block))
          assert counts['rename'] >= 1 and counts['compress_zip'] >= 1 and counts['create'] >= 2 and counts['delete'] >= 1, counts
          assert changes, 'No changes to apply'
          for a, b, replacement in reversed(changes): s = s[:a] + replacement + s[b:]
          p.write_text(s)
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated restrictions
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/android-extra-base")"
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt
          git rm .github/workflows/android-file-menu-extra.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: disable Android rename and ZIP and enforce creation menu restrictions'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-file-menu-extra-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
