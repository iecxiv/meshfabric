name: Verify download toast main-thread dispatch

on:
  push:
    branches: [reconnection-tests]
    paths: ['.github/workflows/fix-download-toast-dispatch.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-download-toast-dispatch
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/reconnection-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconnection-tests
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded toast dispatch fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('app/src/main/java/iecxiv/meshfabric/data/remote')
          def checked(name, expected):
              p = root / name
              raw = p.read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == expected, f'Review changed source: {name}'
              return p, raw.decode()
          p, s = checked('DownloadNetworkAttempt.kt', 'e22592e0588a6f9a9a0da73eac58e8bd615661fa')
          old = '''    @Synchronized fun takeReconnectNotice(): Boolean {
                  if (notifiedGeneration == generation) return false
                  notifiedGeneration = generation
                  return true
              }'''
          new = '''    @Synchronized fun takeReconnectNotice(epoch: Long = current()): Boolean {
                  if (epoch != generation || notifiedGeneration == epoch) return false
                  notifiedGeneration = epoch
                  return true
              }

              @Synchronized fun releaseReconnectNotice(epoch: Long) {
                  if (generation == epoch && notifiedGeneration == epoch) notifiedGeneration = null
              }'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          p, s = checked('FileRelayClient.kt', '41c34cad6cd235650d9f63c8bcc196892e829651')
          needle = '    internal val networkAttempt = DownloadNetworkAttempt()'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n    @Volatile internal var completed = false', 1)
          needle = '                                    downloadSuccess = true\n                                    _activeTransfers.value'
          assert s.count(needle) == 1, 'Review HTTP completion marker'
          s = s.replace(needle, '                                    session.completed = true\n' + needle, 1)
          a = s.index('    @Synchronized\n    private fun showDownloadReconnectToast(')
          b = s.index('    private fun createDownloadOutputStream(', a)
          s = s[:a] + '''    @Synchronized
              private fun showDownloadReconnectToast(context: Context, source: String = "retry") {
                  val pending = activeDownloads.values.toList().filter {
                      !it.completed && it.downloadJob?.isActive != false
                  }.map { it to it.networkAttempt.current() }
                  Log.d("MeshDownloadToast", "REQUEST source=$source candidates=${pending.size}")
                  if (pending.isEmpty() || isUserDisconnect) {
                      Log.d("MeshDownloadToast", "DISCARDED source=$source reason=no-pending-work-or-closed")
                      return
                  }
                  val appContext = context.applicationContext
                  scope.launch(Dispatchers.Main.immediate) {
                      if (isUserDisconnect) {
                          Log.d("MeshDownloadToast", "DISCARDED source=$source reason=session-closed")
                          return@launch
                      }
                      val eligible = pending.filter { (download, epoch) ->
                          activeDownloads[download.filePath] === download && !download.completed &&
                              download.downloadJob?.isActive != false && download.networkAttempt.isCurrent(epoch)
                      }
                      if (eligible.isEmpty()) {
                          Log.d("MeshDownloadToast", "DISCARDED source=$source reason=work-cancelled-complete-or-retired")
                          return@launch
                      }
                      val toast = Toast.makeText(appContext,
                          appContext.getString(R.string.unstable_network_reconnecting_download), Toast.LENGTH_SHORT)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          toast.addCallback(object : Toast.Callback() {
                              override fun onToastShown() { Log.d("MeshDownloadToast", "SHOWN source=$source") }
                              override fun onToastHidden() { Log.d("MeshDownloadToast", "HIDDEN source=$source") }
                          })
                      }
                      val claimed = eligible.filter { (download, epoch) -> download.networkAttempt.takeReconnectNotice(epoch) }
                      if (claimed.isEmpty()) {
                          Log.d("MeshDownloadToast", "DISCARDED source=$source reason=duplicate-generation")
                          return@launch
                      }
                      try {
                          toast.show()
                          Log.d("MeshDownloadToast", "SHOW_REQUESTED source=$source count=${claimed.size}")
                      } catch (e: Exception) {
                          claimed.forEach { (download, epoch) -> download.networkAttempt.releaseReconnectNotice(epoch) }
                          Log.w("MeshDownloadToast", "SHOW_FAILED source=$source type=${e.javaClass.simpleName}")
                      }
                  }
              }

          ''' + s[b:]
          needle = 'activeDownloads.values.firstOrNull()?.context?.let { showDownloadReconnectToast(it) }'
          assert s.count(needle) == 1
          s = s.replace(needle, 'activeDownloads.values.firstOrNull()?.context?.let { showDownloadReconnectToast(it, "network-change") }', 1)
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines()).rstrip() + '\n')
          test = Path('app/src/test/java/iecxiv/meshfabric/data/remote/DownloadToastDispatchTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.data.remote

          import org.junit.Assert.*
          import org.junit.Test

          class DownloadToastDispatchTest {
              @Test fun staleQueuedNoticeDoesNotConsumeCurrentGeneration() {
                  val gate = DownloadNetworkAttempt()
                  val queued = gate.current()
                  gate.invalidate()
                  assertFalse(gate.takeReconnectNotice(queued))
                  assertTrue(gate.takeReconnectNotice(gate.current()))
              }
              @Test fun failedShowCanBeRetried() {
                  val gate = DownloadNetworkAttempt()
                  val epoch = gate.current()
                  assertTrue(gate.takeReconnectNotice(epoch))
                  gate.releaseReconnectNotice(epoch)
                  assertTrue(gate.takeReconnectNotice(epoch))
              }
              @Test fun oldFailureCannotReleaseNewNotice() {
                  val gate = DownloadNetworkAttempt()
                  val old = gate.current()
                  gate.takeReconnectNotice(old)
                  gate.invalidate()
                  assertTrue(gate.takeReconnectNotice())
                  gate.releaseReconnectNotice(old)
                  assertFalse(gate.takeReconnectNotice())
              }
              @Test fun callbackAndRetryStillDeduplicateOnMainDispatch() {
                  val gate = DownloadNetworkAttempt()
                  gate.invalidate()
                  val epoch = gate.current()
                  assertTrue(gate.takeReconnectNotice(epoch))
                  assertFalse(gate.takeReconnectNotice(epoch))
                  gate.invalidate()
                  assertTrue(gate.takeReconnectNotice())
              }
          }
          ''')
          PY
      - name: Build, test and lint
        run: |
          set -euo pipefail
          git diff --check
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Publish verified toast dispatch fix
        run: |
          set -euo pipefail
          git add app/src/main/java/iecxiv/meshfabric/data/remote/DownloadNetworkAttempt.kt app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/test/java/iecxiv/meshfabric/data/remote/DownloadToastDispatchTest.kt
          git rm .github/workflows/fix-download-toast-dispatch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(files): dispatch reconnect toast from pending download work on main'
          git push origin HEAD:refs/heads/reconnection-tests
      - name: Upload verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: download-toast-dispatch-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
