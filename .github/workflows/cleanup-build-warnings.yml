name: Validate first build warning cleanup
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/cleanup-build-warnings.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply narrowly scoped cleanup
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/warnings-base"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main/java/iecxiv/meshfabric')
          def rename_listener(path, start, end, old, count, qualify=False):
              p = root / path
              s = p.read_text()
              a = s.index(start) + len(start)
              b = s.index(end, a)
              block = s[a:b]
              assert len(re.findall(r'override fun on\w+\(', block)) == count
              assert len(re.findall(r'override fun on\w+\(\s*' + old + r'\s*:', block)) == count
              if qualify:
                  assert block.count('if(webSocket===socket') == 2
                  block = block.replace('if(webSocket===socket', 'if(this@MeshCentralClient.webSocket===socket')
              block = re.sub(r'\b' + old + r'\b', 'webSocket', block)
              assert 'if(webSocket===webSocket' not in block
              p.write_text(s[:a] + block + s[b:])
          rename_listener('data/remote/DesktopRelayClient.kt', 'object : WebSocketListener() {', '\n            })', 'socket', 6)
          rename_listener('data/remote/MeshCentralClient.kt', 'object:WebSocketListener() {', '\n                })', 'socket', 5, True)
          rename_listener('ui/management/MeshFabricHome.kt', 'object:WebSocketListener() {', '\n        })', 'ws', 5)
          for rel, icon in [('ui/management/MeshFabricHome.kt', 'OpenInNew'), ('ui/management/ActivityTimeline.kt', 'HelpOutline')]:
              p = root / rel
              s = p.read_text()
              pattern = r'Icons\.(?:Default|Filled)\.' + icon + r'\b'
              s, n = re.subn(pattern, 'Icons.AutoMirrored.Filled.' + icon, s)
              assert n == 1, (rel, n)
              s = s.replace('import androidx.compose.material.icons.filled.' + icon + '\n', '')
              anchor = 'import androidx.compose.material.icons.Icons\n'
              assert anchor in s
              imp = 'import androidx.compose.material.icons.automirrored.filled.' + icon + '\n'
              if imp not in s:
                  s = s.replace(anchor, anchor + imp, 1)
              p.write_text(s)
          p = root / 'service/KeepAliveService.kt'
          s = p.read_text()
          old = 'return notification.extras.getInt(Notification.EXTRA_SMALL_ICON, 0)'
          assert s.count(old) == 1
          s = s.replace(old, 'return legacySmallIconResourceId(notification)', 1)
          anchor = '    private fun currentStatusIcon(): Int {'
          assert s.count(anchor) == 1
          helper = '''    // API 26/27 compatibility: preserve the resource ID supplied by setSmallIcon(int).
              @Suppress("DEPRECATION")
              private fun legacySmallIconResourceId(notification: Notification): Int =
                  notification.extras.getInt(Notification.EXTRA_SMALL_ICON, 0)

          '''
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff
      - name: Clean build, unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew clean :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace --warning-mode=all 2>&1 | tee build-warning-cleanup.log
      - name: Verify remaining Kotlin warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('build-warning-cleanup.log').read_text().splitlines()
          warnings = [s for s in lines if s.startswith('w: ')]
          assert len(warnings) <= 2, warnings
          assert all("Condition is always 'true'" in s and any(f in s for f in ('FileRelayClient.kt', 'FileManagerScreen.kt')) for s in warnings), warnings
          PY
      - name: Publish validated cleanup
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/warnings-base")"
          git add app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/MeshCentralClient.kt app/src/main/java/iecxiv/meshfabric/ui/management/MeshFabricHome.kt app/src/main/java/iecxiv/meshfabric/ui/management/ActivityTimeline.kt app/src/main/java/iecxiv/meshfabric/service/KeepAliveService.kt
          git rm .github/workflows/cleanup-build-warnings.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align websocket callback names and clean deprecated UI references'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-warning-cleanup-verification
          path: |
            build-warning-cleanup.log
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
