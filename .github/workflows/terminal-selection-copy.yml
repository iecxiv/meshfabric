    branches: [terminal-improve]
    paths: [.github/workflows/terminal-selection-copy.yml]
permissions:
  contents: write
concurrency:
  group: terminal-selection-copy
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
