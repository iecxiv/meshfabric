ger provides clipboard) {\n                            SelectionContainer {\n                                Text(snapshot.text, modifier = Modifier.fillMaxWidth(), fontFamily = FontFamily.Monospace)\n                            }\n                        }\n                    }\n                }\n                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {\n                    OutlinedButton(\n                        enabled = snapshot != null && snapshot.text.isNotEmpty(),\n                        onClick = { snapshot?.let { clipboard.setText(AnnotatedString(it.text)) } }\n                    ) { Text(stringResource(R.string.terminal_copy_all)) }\n                    Spacer(Modifier.width(8.dp))\n                    TextButton(onClick = onDismiss) { Text(stringResource(R.string.close)) }\n                }\n            }\n        }\n    }\n}\n', 'app/src/main/res/values/terminal_selection.xml': '<resources>\n    <string name="terminal_tools">Terminal tools</string>\n    <string name="terminal_copy_title">Select and copy</string>\n    <string name="terminal_copy_help">Long-press to select a fragment and copy it. Copy all copies this snapshot. Live terminal output continues separately.</string>\n    <string name="terminal_copy_limited">Limited snapshot: at most 2,000 recent rows and 200,000 characters. This is not the complete terminal history.</string>\n    <string name="terminal_copy_failed">Could not read the terminal text. Close this dialog and try again.</string>\n    <string name="terminal_copy_empty">No text to copy.</string>\n    <string name="terminal_copy_all">Copy all</string>\n    <string name="terminal_copy_done">Text copied</string>\n</resources>\n', 'app/src/main/res/values-es/terminal_selection.xml': '<resources>\n    <string name="terminal_tools">Herramientas de terminal</string>\n    <string name="terminal_copy_title">Seleccionar y copiar</string>\n    <string name="terminal_copy_help">Mantén pulsado para seleccionar un fragmento y copiarlo. Copiar todo copia esta captura. La salida de la terminal continúa por separado.</string>\n    <string name="terminal_copy_limited">Captura limitada: hasta 2.000 filas recientes y 200.000 caracteres. No es todo el historial de la terminal.</string>\n    <string name="terminal_copy_failed">No se ha podido leer el texto. Cierra esta ventana y vuelve a intentarlo.</string>\n    <string name="terminal_copy_empty">No hay texto para copiar.</string>\n    <string name="terminal_copy_all">Copiar todo</string>\n    <string name="terminal_copy_done">Texto copiado</string>\n</resources>\n', 'docs/terminal-selection-copy.md': '# Interaction polish 1: selection and copy\n\nAdds a terminal tools menu and a native read-only snapshot dialog. Long-press selection uses Compose SelectionContainer, not DOM selection over the terminal canvas. Partial selection copies through the native selection toolbar; Copy all copies exactly the snapshot. Copying is always user-initiated and never sends input to the remote shell. This is a separate snapshot, not direct selection on the live terminal.\n\nSnapshot extraction uses only the active xterm buffer public line APIs. Physical soft wraps are joined; genuine line breaks remain. Blank viewport padding is omitted. Bounds are 2,000 recent rows and 200,000 UTF-16 code units; truncation is shown explicitly, and surrogate pairs are not cut. There is no capture from the hidden normal buffer while nano uses the alternate buffer.\n\nThe native read is cancellable and times out after three seconds. Closing the dialog cancels its coroutine, so late callbacks cannot reopen or repopulate it. The text is transient UI memory, never logged or persisted. Selection does not pause the terminal or alter its delivery cursor, resize or protocol.\n\nBoth partial and whole-snapshot copying use a dialog-local ClipboardManager that marks content sensitive to suppress the Android clipboard preview. This does not encrypt the clipboard or prevent other authorized applications from reading pasted text. Android 13+ provides its own copy feedback; only older versions get a Toast.\n\nVerification: new pure JavaScript snapshot tests plus existing runtime tests. The Android WebView cases also verify snapshot text; an ANSI-color case checks that copying returns rendered characters rather than escape sequences. Another instrumentation case checks ClipData text and sensitive metadata. CI must build app/tests and run JVM, Node and focused Android tests before publishing. Physical-device verification of long-press handles, selection scrolling, layout in landscape, clipboard toolbar and retained terminal state remains necessary.\n\nPaste, IME/focus behavior and special-key/scroll redesign are deliberately excluded from this commit.\n'}
          prepared = {}
          for filename, replacements in edits.items():
              source = Path(filename).read_text(encoding='utf-8')
              for old, new in replacements:
                  source = replace_once(source, old, new)
              prepared[filename] = source
          for filename, content in newfiles.items():
              if Path(filename).exists():
                  raise RuntimeError('New target already exists: ' + filename)
              prepared[filename] = content
          for filename, content in prepared.items():
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          subprocess.run(['git', 'diff', '--check'], check=True)
