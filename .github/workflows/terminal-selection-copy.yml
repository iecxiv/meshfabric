rminal/terminal-selection.js');\nlet count = 0;\nfunction test(name, body) {body(); count++; console.log('PASS ' + name);}\nfunction buffer(rows) {\n  const lines = rows.map(row => typeof row === 'string' ? {text: row, wrapped: false} : row);\n  return Object.freeze({length: lines.length, getLine: i => lines[i] && Object.freeze({\n    isWrapped: !!lines[i].wrapped,\n    translateToString: trim => trim ? lines[i].text.replace(/ +$/, '') : lines[i].text\n  })});\n}\ntest('keeps c and 1', () => assert.equal(capture(buffer(['ac1b','cc11'])).text, 'ac1b\ncc11'));\ntest('empty buffer is empty', () => assert.deepEqual(capture(buffer([])), {text:'',truncated:false}));\ntest('omits blank viewport padding', () => assert.equal(capture(buffer(['abc','','   '])).text, 'abc'));\ntest('preserves real blank lines inside output', () => assert.equal(capture(buffer(['a','','b'])).text, 'a\n\nb'));\ntest('soft wraps do not introduce newlines', () => assert.equal(capture(buffer(['abc',{text:'def',wrapped:true}])).text, 'abcdef'));\ntest('preserves spaces before wrapped continuation', () => assert.equal(capture(buffer(['a  ',{text:'b',wrapped:true}])).text, 'a  b'));\ntest('line bound reports truncation', () => assert.deepEqual(capture(buffer(['old','c','1']),2), {text:'c\n1',truncated:true}));\ntest('character bound reports truncation', () => assert.deepEqual(capture(buffer(['abcdef']),2000,3), {text:'abc',truncated:true}));\ntest('does not split a UTF16 pair', () => assert.deepEqual(capture(buffer(['a😀b']),2000,2), {text:'a',truncated:true}));\ntest('keeps complete UTF16 pairs', () => assert.equal(capture(buffer(['a😀b']),2000,3).text, 'a😀'));\ntest('captures only the supplied active buffer', () => assert.equal(capture(buffer(['nano'])).text, 'nano'));\ntest('invalid bounds are rejected', () => assert.throws(() => capture(buffer(['x']),0,2),RangeError));\nconsole.log(count + ' selection tests passed');\n", 'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalCopySnapshot.kt': 'package iecxiv.meshfabric.ui.terminal\n\ninternal data class TerminalCopySnapshot(val text: String, val truncated: Boolean)\n', 'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalCopyDialog.kt': 'package iecxiv.meshfabric.ui.terminal\n\nimport android.content.ClipData\nimport android.content.Context\nimport android.content.ClipboardManager as AndroidClipboardManager\nimport android.os.Build\nimport android.os.PersistableBundle\nimport android.widget.Toast\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.foundation.text.selection.SelectionContainer\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.CompositionLocalProvider\nimport androidx.compose.runtime.remember\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.ClipboardManager\nimport androidx.compose.ui.platform.LocalClipboardManager\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.stringResource\nimport androidx.compose.ui.text.AnnotatedString\nimport androidx.compose.ui.text.font.FontFamily\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.window.Dialog\nimport androidx.compose.ui.window.DialogProperties\nimport iecxiv.meshfabric.R\n\ninternal fun terminalCopyClip(text: String): ClipData = ClipData.newPlainText("Terminal", text).apply {\n    // Terminal output may contain secrets; hide the OS clipboard preview.\n    description.extras = PersistableBundle().apply { putBoolean("android.content.extra.IS_SENSITIVE", true) }\n}\n\n@Composable\ninternal fun TerminalCopyDialog(snapshot: TerminalCopySnapshot?, loading: Boolean, onDismiss: () -> Unit) {\n    val appContext = LocalContext.current.applicationContext\n    val fallback = LocalClipboardManager.current\n