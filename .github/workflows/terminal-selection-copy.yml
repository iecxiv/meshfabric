        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(source, old, new):
              if source.count(old) != 1:
                  raise RuntimeError('Reviewed source anchor mismatch; refusing to overwrite')
              return source.replace(old, new, 1)

