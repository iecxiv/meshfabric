          git merge-base --is-ancestor b74fa4e776dcbd3c2638bc344587f2a275a57bc0 HEAD
          git diff --exit-code b74fa4e776dcbd3c2638bc344587f2a275a57bc0 HEAD -- . ':(exclude).github/workflows/terminal-selection-copy.yml'
      - name: Prepare selection and copy only
