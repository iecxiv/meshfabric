name: Validate rounded agent console output
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/agent-console-rounded-output.yml']
permissions:
  contents: write
concurrency:
  group: agent-console-rounded-output-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Round output only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentConsoleScreen.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='8b96aa3572ce31a17b18dd142d1f275a3dc43507'
          original=p.read_text()
          old='SelectionContainer(Modifier.weight(1f).fillMaxWidth().background(androidx.compose.ui.graphics.Color.Black).verticalScroll(scroll).padding(8.dp))'
          new='SelectionContainer(Modifier.weight(1f).fillMaxWidth().clip(MaterialTheme.shapes.medium).background(androidx.compose.ui.graphics.Color.Black).verticalScroll(scroll).padding(8.dp))'
          anchor='import androidx.compose.ui.Modifier\n'
          assert original.count(old)==1 and original.count(anchor)==1
          assert 'import androidx.compose.ui.draw.clip' not in original
          updated=original.replace(anchor,anchor+'import androidx.compose.ui.draw.clip\n',1).replace(old,new,1)
          assert updated.replace(new,old,1).replace('import androidx.compose.ui.draw.clip\n','',1)==original
          p.write_text(updated)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()==str(p)
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-console-rounded-output-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated change and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/agent-console-rounded-output.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentConsoleScreen.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(agent-console): round black output panel to match server console'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
