name: Bump versionName to 1.3.3
on:
  push:
    branches: [add-device-invite]
    paths: [.github/workflows/bump-version-name-1-3-3.yml]
permissions:
  contents: write
concurrency:
  group: bump-version-name-1-3-3
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Change only versionName
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = add-device-invite
          test "$(git rev-parse HEAD^)" = 9c190c05c2f4574bf9b42220e60ed954c437c630
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('app/build.gradle.kts')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='2874b85c98634ec8c638aea9e6db09ba8602af70'
          s=p.read_text();assert s.count('versionName = "1.3.2"')==1 and s.count('versionCode = 1')==1
          p.write_text(s.replace('versionName = "1.3.2"','versionName = "1.3.3"',1))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean build; execute all unit tests and lint
        run: bash ./gradlew :app:clean :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Verify executed unit reports and APK version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,xml.etree.ElementTree as E
          reports=list(Path('app/build/test-results/testDebugUnitTest').rglob('TEST-*.xml'));assert reports
          cases=0
          for p in reports:
              root=E.parse(p).getroot();assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped'),str(p)
              cases+=len(list(root.iter('testcase')))
          assert cases>0
          apks=list(Path('app/build/outputs/apk/debug').glob('*.apk'));assert apks and all(p.stat().st_size>0 for p in apks)
          tools=sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt'));assert tools
          for apk in apks:
              badging=subprocess.check_output([str(tools[-1]),'dump','badging',str(apk)],text=True)
              package=next(line for line in badging.splitlines() if line.startswith('package:'))
              assert "versionName='1.3.3'" in package and "versionCode='1'" in package,package
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-1-3-3-validation-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: error
      - name: Publish only validated versionName change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin add-device-invite
          test "$(git rev-parse origin/add-device-invite)" = "$GITHUB_SHA"
          git add -- app/build.gradle.kts
          test "$(git diff --cached --name-only)" = app/build.gradle.kts
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: bump versionName to 1.3.3'
          git push origin HEAD:refs/heads/add-device-invite
      - uses: actions/upload-artifact@v4
        with:
          name: meshfabric-1.3.3-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
