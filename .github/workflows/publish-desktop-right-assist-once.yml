name: Publish desktop right-click assist once
'on':
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-right-assist-once.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-desktop-right-assist-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply SHA-verified reviewed publication script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest()=='7233facc6e794fb409bd42621412d570fde3672cdacf551d1451f46bd7329b6d'
          exec(compile(source.decode('utf-8'), '<reviewed-desktop-right-assist-publication>', 'exec'))
          PY
      - name: Publish only if dev has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): add persistent one-shot right-click assistant'
          git push origin HEAD:refs/heads/dev
          echo "Published $(git rev-parse HEAD); temporary workflow removed. Build and tests NOT run." >> "$GITHUB_STEP_SUMMARY"
