name: Validate device event search and footer spacing
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/device-events-search-spacing.yml']
permissions:
  contents: write
concurrency:
  group: device-events-search-spacing-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare shared search header and flush event list
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='b80b60d0b741c02e4719ec0e8c997f684b5dcccb','Base advanced; review required'
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsDialog.kt')
          s=p.read_text();old='        var query by rememberSaveable {mutableStateOf("")}';assert s.count(old)==1
          s=s.replace(old,old+'\n        var showSearch by rememberSaveable {mutableStateOf(false)}',1)
          a=s.index('        DeviceGeneralFrame(node,onDismiss,inline=inline,')
          b=s.index('tagPrefix="device_events",scrollBody=false)',a)+len('tagPrefix="device_events",scrollBody=false)')
          replacement='''        DeviceEventsContent(node=node,inline=inline,query=query,onQuery={query=it},searchOpen=showSearch,onSearchOpen={showSearch=it},
                      state=visible,enabled=enabled,selection=selection,onSelection={selectedType=it.type.name;selectedLimit=it.limit ?: 0},
                      inventory=inventory,onRefresh={reader.load(selection)},onDismiss=onDismiss)'''
          s=s[:a]+replacement+s[b:]
          assert 'nodeId=node.id' in s and 'OutlinedTextField(query' not in s
          old='    val es=LocalConfiguration.current.locales[0].language=="es"\n    fun text(a:String,b:String)=if(es) a else b\n';assert s.count(old)==1;s=s.replace(old,'',1)
          s=s.replace('import androidx.compose.ui.platform.LocalConfiguration\n','',1);p.write_text(s)
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt')
          s=p.read_text();old='        rule.onNodeWithTag("device_events_search").assertIsDisplayed()';assert s.count(old)==1
          new='        rule.onNodeWithTag("log-events-search").assertDoesNotExist()\n        rule.onNodeWithTag("log-events-search-toggle").performClick()\n        rule.onNodeWithTag("log-events-search").assertIsDisplayed()'
          p.write_text(s.replace(old,new,1))
          view='''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.Computer
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.unit.dp
          import iecxiv.meshfabric.R
          import iecxiv.meshfabric.data.model.MeshNode
          import iecxiv.meshfabric.ui.components.SubviewHeader
          import iecxiv.meshfabric.ui.management.*
          @Composable internal fun DeviceEventsContent(
              node:MeshNode,inline:Boolean,query:String,onQuery:(String)->Unit,searchOpen:Boolean,onSearchOpen:(Boolean)->Unit,
              state:ServerEventsSnapshot,enabled:Boolean,selection:ServerEventsQuery,onSelection:(ServerEventsQuery)->Unit,
              inventory:ServerEventInventory,onRefresh:()->Unit,onDismiss:()->Unit
          ) {
              val configuration=LocalConfiguration.current
              val es=configuration.locales[0].language=="es"
              fun text(a:String,b:String)=if(es) a else b
              DeviceDetailsFrame(inline=inline,onDismiss=onDismiss) {
                  val surface=if(inline) Modifier.fillMaxSize() else Modifier.padding(horizontal=16.dp,vertical=24.dp).widthIn(max=600.dp).fillMaxWidth().heightIn(max=(configuration.screenHeightDp*0.88f).dp)
                  DeviceDetailsContentSurface(inline=inline,modifier=surface.testTag("device_events_surface")) {
                      Column(Modifier.fillMaxSize()) {
                          ServerEventsSearchHeader(query,onQuery,searchOpen,onSearchOpen,header={actions->
                              Column(Modifier.padding(start=if(inline) 16.dp else 20.dp,end=if(inline) 16.dp else 12.dp,top=if(inline) 0.dp else 12.dp)) {
                                  val title:@Composable ()->Unit={Column {
                                      Text(node.name.ifBlank {stringResource(R.string.unknown_device)},style=MaterialTheme.typography.titleMedium)
                                      Text(text("Eventos","Events"),style=MaterialTheme.typography.labelSmall,modifier=Modifier.testTag("device_events_subtitle"))
                                  }}
                                  if(inline) SubviewHeader(onBack=onDismiss,title=title,backTag="device_events_close",actions={actions()})
                                  else Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                                      Icon(Icons.Default.Computer,null,Modifier.size(22.dp),tint=MaterialTheme.colorScheme.primary)
                                      Box(Modifier.weight(1f)) {title()};actions()
                                      IconButton(onClick=onDismiss,modifier=Modifier.testTag("device_events_close")) {Icon(Icons.Default.Close,stringResource(R.string.device_details_close))}
                                  }
                              }
                          },tabs={
                              Row(Modifier.fillMaxWidth().padding(start=16.dp,end=16.dp,bottom=12.dp),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(10.dp)) {
                                  Surface(shape=RoundedCornerShape(6.dp),color=if(node.isOnline) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant) {
                                      Text(stringResource(if(node.isOnline) R.string.device_details_online else R.string.device_details_offline),Modifier.padding(horizontal=8.dp,vertical=3.dp),style=MaterialTheme.typography.labelSmall)
                                  }
                                  if(!node.osdesc.isNullOrBlank()) Text(node.osdesc.orEmpty(),Modifier.weight(1f),style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              HorizontalDivider(color=MaterialTheme.colorScheme.outlineVariant)
                          })
                          ServerEventsPanel(state,query,onQuery,enabled,onRefresh,Modifier.weight(1f).fillMaxWidth(),selection=selection,onSelection=onSelection,inventory=inventory,
                              scopeLabel=text("Eventos de este dispositivo: ","Events for this device: ")+node.name,showDeviceLabel=false,flushBottom=true)
                          HorizontalDivider(Modifier.testTag("device_events_footer_divider"),color=MaterialTheme.colorScheme.outlineVariant)
                          Row(Modifier.fillMaxWidth().padding(horizontal=12.dp,vertical=6.dp),horizontalArrangement=Arrangement.End,verticalAlignment=Alignment.CenterVertically) {
                              TextButton(onClick=onRefresh,enabled=enabled && state.phase!=ServerEventsPhase.LOADING,modifier=Modifier.testTag("device_events_refresh")) {Text(text("Actualizar","Refresh"))}
                              TextButton(onClick=onDismiss) {Text(if(inline) text("Volver","Back") else text("Cerrar","Close"))}
                          }
                      }
                  }
              }
          }
          '''
          tests='''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import iecxiv.meshfabric.data.model.MeshNode
          import iecxiv.meshfabric.ui.management.*
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          import kotlin.math.abs
          class DeviceEventsPresentationTest {
              @get:Rule val rule=createComposeRule()
              private val node=MeshNode(id="node//events",name="Device")
              private val selection=ServerEventsQuery(nodeId=node.id)
              private val ready=ServerEventsSnapshot(ServerEventsPhase.READY,listOf(ServerEventRecord("manual","Event","user",node.id,node.name,1800000000000L)),selection=selection)
              @Composable private fun Content(query:String,onQuery:(String)->Unit,open:Boolean,onOpen:(Boolean)->Unit) {
                  DeviceEventsContent(node,true,query,onQuery,open,onOpen,ready,true,selection,{},ServerEventInventory(),{}, {})
              }
              @Test fun searchStartsClosedOpensAndCloseClearsQuery() {
                  val query=mutableStateOf("");val open=mutableStateOf(false)
                  rule.setContent {MaterialTheme {Content(query.value,{query.value=it},open.value,{open.value=it})}}
                  rule.onNodeWithTag("log-events-search").assertDoesNotExist()
                  rule.onNodeWithTag("log-events-search-toggle").performClick()
                  rule.onNodeWithTag("log-events-search").assertIsFocused().performTextInput("Event")
                  rule.onNodeWithTag("log-events-search-toggle").performClick()
                  rule.waitForIdle()
                  rule.onNodeWithTag("log-events-search").assertDoesNotExist()
                  rule.runOnIdle {assertFalse(open.value);assertEquals("",query.value)}
                  rule.onNode(isDialog()).assertDoesNotExist()
              }
              @Test fun eventListEndsAtFooterDividerWithoutExtraBottomPadding() {
                  rule.setContent {MaterialTheme {Content("",{},false,{})}}
                  val list=rule.onNodeWithTag("log-events-list").fetchSemanticsNode().boundsInRoot
                  val divider=rule.onNodeWithTag("device_events_footer_divider").fetchSemanticsNode().boundsInRoot
                  assertTrue("Extra gap above footer: ${divider.top-list.bottom}",abs(divider.top-list.bottom)<=1f)
              }
              @Test fun searchFieldDimensionsMatchGlobalSearchHeader() {
                  val device=mutableStateOf(false)
                  rule.setContent {MaterialTheme {if(device.value) Content("",{},true,{}) else Column(Modifier.fillMaxSize()) {ServerEventsSearchHeader("",{},true,{},header={actions->Row {actions()}})}}}
                  val reference=rule.onNodeWithTag("log-events-search").fetchSemanticsNode().boundsInRoot
                  rule.runOnIdle {device.value=true}
                  val actual=rule.onNodeWithTag("log-events-search").fetchSemanticsNode().boundsInRoot
                  assertEquals(reference.width,actual.width,1f);assertEquals(reference.height,actual.height,1f)
              }
          }
          '''
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentation.kt');assert not p.exists();p.write_text(view)
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentationTest.kt');assert not p.exists();p.write_text(tests)
          expected={'app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsDialog.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentation.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentationTest.kt'}
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==expected
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run full unit suite and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-events-search-spacing-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated presentation changes and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsDialog.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentation.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceReadSubviewsTest.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceEventsPresentationTest.kt']
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==set(paths)
          workflow='.github/workflows/device-events-search-spacing.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(events): reuse header search and flush device event list to footer'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
