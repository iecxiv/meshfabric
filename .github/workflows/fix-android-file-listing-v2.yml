name: Android agent file listing v2
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-android-file-listing-v2.yml']
permissions:
  contents: write
concurrency:
  group: android-file-listing-v2
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Android-only listing path adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric/data/remote')
          p = root/'FileRelayClient.kt'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '95e45228a36cdafdb6bd896b8d1944ccd8e34ae3', 'File relay changed; review required'
          s = p.read_text()
          def once(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old,new,1)
          once('import iecxiv.meshfabric.data.model.FileItem', 'import iecxiv.meshfabric.data.model.DevicePlatform\nimport iecxiv.meshfabric.data.model.platform\nimport iecxiv.meshfabric.data.model.FileItem')
          method = '\n'.join([
              '    private fun androidFileSystem(): Boolean = meshClient.groupedDevices.value.any { (_, nodes) ->',
              '        nodes.any { it.id.removePrefix("node//").removePrefix("node/").trim() == cleanNodeId && it.platform == DevicePlatform.ANDROID }',
              '    }', ''])
          anchor = '    internal fun driveStatus(message: String)'
          once(anchor, method + '\n' + anchor)
          once('WindowsDriveSupport.wire(request.path, windowsFileSystem())', 'FileListingPaths.wire(request.path, androidFileSystem(), windowsFileSystem())')
          once('navigation.request(if (windowsFileSystem()) WindowsDriveSupport.directory(path) else path)', 'navigation.request(FileListingPaths.browser(path, androidFileSystem(), windowsFileSystem()))')
          once('val responsePath = json.get("path")?.asString?.takeIf { it.isNotEmpty() }?.let { if (windowsFileSystem()) WindowsDriveSupport.directory(it) else it }', 'val responsePath = json.get("path")?.takeUnless { it.isJsonNull }?.asString?.takeIf { it.isNotEmpty() || androidFileSystem() }?.let { FileListingPaths.browser(it, androidFileSystem(), windowsFileSystem()) }')
          p.write_text(s)
          helper = root/'FileListingPaths.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.data.remote

          /** Adapt only the Android agent virtual roots; Windows and Linux keep their existing paths. */
          internal object FileListingPaths {
              fun wire(path: String, android: Boolean, windows: Boolean): String =
                  if (android) path.trim('/') else WindowsDriveSupport.wire(path, windows)

              fun browser(path: String, android: Boolean, windows: Boolean): String = when {
                  android -> "/" + path.trim('/')
                  windows -> WindowsDriveSupport.directory(path)
                  else -> path
              }
          }
          ''')
          test = Path('app/src/test/java/iecxiv/meshfabric/data/remote/FileListingPathsTest.kt')
          assert not test.exists()
          test.write_text('''package iecxiv.meshfabric.data.remote

          import org.junit.Assert.*
          import org.junit.Test

          class FileListingPathsTest {
              @Test fun androidRootUsesEmptyWirePath() {
                  assertEquals("",FileListingPaths.wire("/",true,false))
                  assertEquals("/",FileListingPaths.browser("",true,false))
              }
              @Test fun allFourVirtualRootsRoundTrip() {
                  for (root in listOf("Sdcard","Images","Audio","Videos")) {
                      assertEquals(root,FileListingPaths.wire("/"+root,true,false))
                      assertEquals("/"+root,FileListingPaths.browser(root,true,false))
                  }
              }
              @Test fun androidSubfolderRoundTrip() {
                  val path = "/Sdcard/Download/My folder"
                  assertEquals("Sdcard/Download/My folder",FileListingPaths.wire(path,true,false))
                  assertEquals(path,FileListingPaths.browser("Sdcard/Download/My folder",true,false))
              }
              @Test fun linuxPathsAreUnchanged() {
                  for (path in listOf("/","/home/user","/var/log")) {
                      assertEquals(path,FileListingPaths.wire(path,false,false))
                      assertEquals(path,FileListingPaths.browser(path,false,false))
                  }
              }
              @Test fun windowsPathsAreUnchanged() {
                  assertEquals("",FileListingPaths.wire("/",false,true))
                  assertEquals("C:/Users",FileListingPaths.wire("C:/Users",false,true))
                  assertEquals("C:/",FileListingPaths.browser("C:",false,true))
              }
          }
          ''')
          PY
          git diff --check
      - name: Compile and run tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified Android listing fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/FileListingPaths.kt app/src/test/java/iecxiv/meshfabric/data/remote/FileListingPathsTest.kt
          git rm .github/workflows/fix-android-file-listing-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: list Android agent virtual roots without changing Windows paths'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-file-listing-v2-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
