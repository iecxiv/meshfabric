          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 40479b0fb466b91c1a0f92d9011a242ffd5b02fe HEAD
          git diff --exit-code 40479b0fb466b91c1a0f92d9011a242ffd5b02fe HEAD -- . ':(exclude).github/workflows/terminal-renderer-retention.yml'
      - name: Prepare renderer retention
