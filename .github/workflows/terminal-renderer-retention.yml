      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript regression tests
        run: node app/src/test/js/terminal-runtime.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish only verified changes
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-renderer-retention.yml
          git add -- app/src/main/java/iecxiv/meshfabric/ui/terminal/RetainedTerminalStore.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalRenderSession.kt app/src/test/java/iecxiv/meshfabric/ui/terminal/RetainedTerminalStoreTest.kt app/src/main/res/values/terminal_rendering.xml app/src/main/res/values-es/terminal_rendering.xml docs/terminal-renderer-retention.md app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt app/src/main/java/iecxiv/meshfabric/ui/navigation/NavGraph.kt .github/workflows/terminal-renderer-retention.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain terminal renderer across navigation with scoped cleanup'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload unit-test reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-retention-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
