name: Verify and publish retained terminal renderer
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-renderer-retention.yml]
permissions:
  contents: write
concurrency:
  group: terminal-renderer-retention
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reviewed base
        shell: bash
