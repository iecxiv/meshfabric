name: Publish desktop shortcuts and held modifiers
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-shortcuts-hold.yml]
permissions:
  contents: write
concurrency:
  group: publish-desktop-shortcuts-hold-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 119f67c50b950eb941ab150181e6414c359a4e0a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply approved desktop keyboard changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          source = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(source).hexdigest() == 'dad71d0a2c2f6422f49a99fcea58a5fb0ab19e43b791c502add1aa256b9a4606'
          exec(compile(source, 'approved_desktop_shortcuts_hold', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Compile debug APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopHeldKeys.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopKeyActions.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopShortcuts.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/DesktopShortcutSections.kt app/src/test/java/iecxiv/meshfabric/ui/desktop/DesktopHoldKeysTest.kt docs/desktop-shortcuts-hold.md
          git rm .github/workflows/publish-desktop-shortcuts-hold.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): add custom shortcuts and held modifier controls'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shortcuts-hold-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
