name: Open completed downloads
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-download-open.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-download-open
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == 'a4534591287553bf3c5cc6f8dbf414e8383a9a52', 'File relay changed; review required'
          s = p.read_text()
          def once(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          once('internal val networkAttempt = DownloadNetworkAttempt()\n    @Volatile internal var completed = false', 'internal val networkAttempt = DownloadNetworkAttempt()\n    @Volatile internal var localUri: Uri? = null\n    @Volatile internal var completed = false')
          once('private fun createDownloadOutputStream(context: Context, fileName: String): OutputStream {', 'private fun createDownloadOutputStream(context: Context, fileName: String, session: ActiveDownloadSession): OutputStream {\n        session.localUri = null')
          assert s.count('createDownloadOutputStream(context, targetName)') == 2
          s = s.replace('createDownloadOutputStream(context, targetName)', 'createDownloadOutputStream(context, targetName, session)')
          once('if (os != null) return os', 'if (os != null) {\n                        session.localUri = uri\n                        return os\n                    }\n                    resolver.delete(uri, null, null)')
          once('return FileOutputStream(destFile)', 'val uri = androidx.core.content.FileProvider.getUriForFile(context, context.packageName + ".downloadfiles", destFile)\n        return FileOutputStream(destFile).also { session.localUri = uri }')
          once('showDownloadCompleteNotification(context, targetName, item.path, receivedBytes)', 'showDownloadCompleteNotification(context, targetName, item.path, receivedBytes, session.localUri)')
          once('showDownloadCompleteNotification(ctx, fileName, key, totalSize)', 'showDownloadCompleteNotification(ctx, fileName, key, totalSize, session.localUri)')
          once('private fun showDownloadCompleteNotification(context: Context, fileName: String, filePath: String, total: Long) {', 'private fun showDownloadCompleteNotification(context: Context, fileName: String, filePath: String, total: Long, localUri: Uri?) {')
          a = s.index('    private fun showDownloadCompleteNotification(')
          b = s.index('    private fun showUploadCompleteNotification(', a)
          part = s[a:b]
          anchor = '            notificationManager.notify(notificationId, builder.build())'
          assert part.count(anchor) == 1
          addition = '''            if (localUri != null) {
                          val openIntent = Intent(Intent.ACTION_VIEW).apply {
                              setDataAndType(localUri, getMimeType(fileName))
                              clipData = android.content.ClipData.newRawUri(fileName, localUri)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          val openPendingIntent = PendingIntent.getActivity(
                              context, notificationId, openIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          builder.setContentIntent(openPendingIntent)
                      }
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          part = part.replace(anchor, addition + '\n' + anchor)
          s = s[:a] + part + s[b:]
          p.write_text(s)
          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          assert '.downloadfiles' not in m
          provider = '<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.downloadfiles" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/download_file_paths" /></provider>'
          assert m.count('</application>') == 1
          manifest.write_text(m.replace('</application>', provider + '\n    </application>'))
          paths = Path('app/src/main/res/xml/download_file_paths.xml')
          assert not paths.exists()
          paths.write_text('<paths xmlns:android="http://schemas.android.com/apk/res/android"><external-files-path name="app_downloads" path="Download/" /><external-path name="public_downloads" path="Download/" /></paths>\n')
          PY
          git diff --check
      - name: Compile and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified change
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/AndroidManifest.xml app/src/main/res/xml/download_file_paths.xml
          git rm .github/workflows/publish-download-open.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: open exact downloaded file from completed notification'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-open-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
