name: Repair and apply agent documentation
on:
  push:
    branches: [dev]
    paths: [.github/workflows/repair-agent-documentation.yml]
permissions:
  contents: write
concurrency:
  group: repair-agent-documentation
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare YAML validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/docs-validator"
          "$RUNNER_TEMP/docs-validator/bin/python" -m pip install --disable-pip-version-check PyYAML
      - name: Repair, validate and apply documentation only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = dev
          test "$(git rev-parse HEAD^)" = 2cf9fc873baf56035e32a219b8bb64fe662d38de
          "$RUNNER_TEMP/docs-validator/bin/python" - <<'PY'
          from pathlib import Path
          import re,subprocess,yaml
          p=Path('.github/workflows/refresh-agent-documentation.yml')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='94c2489bd9e6436d9ccc5cc086597aac58a807dd'
          text=p.read_text()
          for anchor in ["          replace(en,'### Remote desktop','''","          replace(es,'### Escritorio remoto','''"]:
              assert text.count(anchor)==1
              start=text.index(anchor);end=text.index("''')",start)+4
              old=text[start:end];lines=old.splitlines(keepends=True)
              repaired=lines[0]+''.join(('          '+line if line.strip() and not line.startswith('          ') else line) for line in lines[1:])
              assert repaired!=old
              text=text[:start]+repaired+text[end:]
          replacements={
              'branches: [add-device-invite]':'branches: [dev]',
              'test "$GITHUB_REF_NAME" = add-device-invite':'test "$GITHUB_REF_NAME" = dev',
              'git fetch origin add-device-invite':'git fetch origin dev',
              'git rev-parse origin/add-device-invite':'git rev-parse origin/dev',
              'git push origin HEAD:refs/heads/add-device-invite':'git push origin HEAD:refs/heads/dev'
          }
          for old,new in replacements.items():
              assert text.count(old)==1,old
              text=text.replace(old,new,1)
          document=yaml.load(text,Loader=yaml.BaseLoader)
          assert document['on']['push']['branches']==['dev']
          steps=document['jobs']['docs']['steps']
          scripts=[step['run'] for step in steps if 'run' in step]
          assert len(scripts)==3
          for i,script in enumerate(scripts):
              subprocess.run(['bash','-n','-c',script],check=True)
              payloads=re.findall(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",script,re.S)
              assert len(payloads)==(0 if i==2 else 1),(i,len(payloads))
              for payload in payloads:compile(payload,'documentation-step-'+str(i),'exec')
          assert "git fetch origin dev" in scripts[2] and "HEAD:refs/heads/dev" in scripts[2]
          assert 'gradlew' not in '\n'.join(scripts)
          def execute(script):
              subprocess.run(['bash','-e','-u','-o','pipefail','-c',script],check=True)
          execute(scripts[0])
          execute(scripts[1])
          p.write_text(text)
          subprocess.run(['git','add','--',str(p)],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          required={'README.md','README_ES.md','docs/profile.md','docs/es/profile.md','docs/agent-installation.md','docs/es/agent-installation.md','docs/features/add-device-invite-scope.md','docs/features/add-device-invite-acceptance.md',str(p)}
          assert required.issubset(staged),(required-staged)
          assert all(name==str(p) or name in {'README.md','README_ES.md'} or (name.startswith('docs/') and name.endswith('.md')) for name in staged),staged
          subprocess.run(['git','diff','--cached','--check'],check=True)
          execute(scripts[2])
          final=yaml.load(p.read_text(),Loader=yaml.BaseLoader)
          assert final['on']['push']['branches']==['dev']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
