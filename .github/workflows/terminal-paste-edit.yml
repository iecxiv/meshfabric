name: Verify editable terminal paste
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-paste-edit.yml]
permissions:
  contents: write
concurrency:
  group: terminal-paste-edit
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 34f6248c15e4d663074c80266d896286bba4d92d HEAD
          git diff --exit-code 34f6248c15e4d663074c80266d896286bba4d92d HEAD -- . ':(exclude).github/workflows/terminal-paste-edit.yml'
      - name: Apply editable paste patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = 'app/src/main/java/iecxiv/meshfabric/ui/terminal/'
          old_item = r'''                            DropdownMenuItem(
                                          text = { Text(stringResource(R.string.terminal_paste_title)) },
                                          enabled = connectionStatus == TerminalConnectionStatus.CONNECTED,
                                          onClick = {
                                              showTerminalMenu = false
                                              pasteDraft = readTerminalPaste(context)
                                              pasteAttempted = false
                                              pasteBusy = false
                                              pasteResult = null
                                              showPasteDialog = true
                                          }
                                      )
          '''
          new_item = r'''                            DropdownMenuItem(
                                          text = { Text(stringResource(R.string.terminal_paste_title)) },
                                          enabled = connectionStatus == TerminalConnectionStatus.CONNECTED,
                                          onClick = { openPaste(false) }
                                      )
                                      DropdownMenuItem(
                                          text = { Text(stringResource(R.string.terminal_paste_edit_title)) },
                                          enabled = connectionStatus == TerminalConnectionStatus.CONNECTED,
                                          onClick = { openPaste(true) }
                                      )
          '''
          state = r'''    var pasteEditing by remember(renderer) { mutableStateOf(false) }
              fun openPaste(editing: Boolean) {
                  showTerminalMenu = false
                  pasteEditing = editing
                  pasteDraft = readTerminalPaste(context)
                  pasteAttempted = false
                  pasteBusy = false
                  pasteResult = null
                  showPasteDialog = true
              }
          '''
          old_text = r'''                if (text != null) {
                              Text(stringResource(R.string.terminal_paste_count, text.length))
                              Text(text, fontFamily = FontFamily.Monospace,
                                  modifier = Modifier.fillMaxWidth().heightIn(max = 240.dp).verticalScroll(rememberScrollState()))
                          }
          '''
          new_text = r'''                if (text != null || editing) {
                              Text(stringResource(R.string.terminal_paste_count, text?.length ?: 0))
                              if (editing) OutlinedTextField(
                                  value = text.orEmpty(), onValueChange = onEdit, enabled = !attempted,
                                  label = { Text(stringResource(R.string.terminal_paste_edit_label)) },
                                  textStyle = LocalTextStyle.current.copy(fontFamily = FontFamily.Monospace),
                                  isError = issue != null && issue != TerminalPasteIssue.EMPTY,
                                  minLines = 3, maxLines = 8, modifier = Modifier.fillMaxWidth()
                              ) else Text(text.orEmpty(), fontFamily = FontFamily.Monospace,
                                  modifier = Modifier.fillMaxWidth().heightIn(max = 240.dp).verticalScroll(rememberScrollState()))
                          }
          '''
          edits = {
              p + 'TerminalScreen.kt': [
                  ('    LaunchedEffect(pasteAttempted, renderer) {', state + '    LaunchedEffect(pasteAttempted, renderer) {'),
                  (old_item, new_item),
                  ('                attempted = pasteAttempted, busy = pasteBusy, result = pasteResult,\n', r'''                attempted = pasteAttempted, busy = pasteBusy, result = pasteResult,
                          editing = pasteEditing,
                          onEdit = { value -> if (!pasteAttempted) pasteDraft = editTerminalPaste(pasteDraft, value) },
          ''')
              ],
              p + 'TerminalPasteDialog.kt': [
                  ('    busy: Boolean, result: TerminalPasteResult?, onConfirm: () -> Unit, onDismiss: () -> Unit\n', r'''    busy: Boolean, result: TerminalPasteResult?, onConfirm: () -> Unit, onDismiss: () -> Unit,
              editing: Boolean = false, onEdit: (String) -> Unit = {}
          '''),
                  ('title = { Text(stringResource(R.string.terminal_paste_title)) }', 'title = { Text(stringResource(if (editing) R.string.terminal_paste_edit_title else R.string.terminal_paste_title)) }'),
                  (old_text, new_text),
                  ('Text(stringResource(R.string.terminal_paste_confirm))', 'Text(stringResource(if (editing) R.string.terminal_paste_edit_send else R.string.terminal_paste_confirm))')
              ]
          }
          newfiles = {}
          newfiles[p + 'TerminalPasteEdit.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          // Invalid edits are rejected atomically; never silently truncate or send them.
          internal fun editTerminalPaste(previous: TerminalPasteDraft?, value: String): TerminalPasteDraft {
              val issue = TerminalPastePolicy.issue(value)
              return if (issue == null || issue == TerminalPasteIssue.EMPTY) TerminalPasteDraft(value, issue)
              else TerminalPasteDraft(previous?.text.orEmpty(), issue)
          }
          '''
          newfiles['app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalPasteEditTest.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          import org.junit.Assert.*
          import org.junit.Test

          class TerminalPasteEditTest {
              private val original = TerminalPasteDraft("original", null)
              @Test fun editReplacesClipboardSnapshot() {
                  assertEquals(TerminalPasteDraft("edited", null), editTerminalPaste(original, "edited"))
                  assertEquals("original", original.text)
              }
              @Test fun preservesWhitespace() { assertEquals("  edited  ", editTerminalPaste(original, "  edited  ").text) }
              @Test fun canStartWithEmptyClipboard() { assertEquals(TerminalPasteDraft("new", null), editTerminalPaste(null, "new")) }
              @Test fun clearingDisablesSending() { assertEquals(TerminalPasteDraft("", TerminalPasteIssue.EMPTY), editTerminalPaste(original, "")) }
              @Test fun oversizeRejectsEntireEdit() {
                  assertEquals(TerminalPasteDraft("original", TerminalPasteIssue.TOO_LARGE), editTerminalPaste(original, "a".repeat(16385)))
              }
              @Test fun controlInjectionRejected() {
                  assertEquals(TerminalPasteDraft("original", TerminalPasteIssue.CONTROL), editTerminalPaste(original, 27.toChar().toString()))
              }
              @Test fun validEditClearsPreviousError() {
                  assertNull(editTerminalPaste(TerminalPasteDraft("original", TerminalPasteIssue.CONTROL), "fixed").issue)
              }
              @Test fun multilineTracksEditedText() {
                  val edited = editTerminalPaste(original, "one" + 10.toChar() + "two")
                  assertNull(edited.issue)
                  assertTrue(TerminalPastePolicy.multiline(edited.text!!))
                  assertFalse(TerminalPastePolicy.multiline(editTerminalPaste(edited, "one two").text!!))
              }
              @Test fun invalidSurrogateRejected() {
                  assertEquals(TerminalPasteIssue.UNICODE, editTerminalPaste(original, 0xD800.toChar().toString()).issue)
              }
          }
          '''
          for directory, values in [
              ('values', ['Paste with editing', 'Text to send', 'Send text']),
              ('values-es', ['Pegado con edición', 'Texto que se enviará', 'Enviar texto'])
          ]:
              keys = ['terminal_paste_edit_title', 'terminal_paste_edit_label', 'terminal_paste_edit_send']
              newfiles['app/src/main/res/' + directory + '/terminal_paste_edit.xml'] = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + ''.join('    <string name="' + key + '">' + value + '</string>\n' for key, value in zip(keys, values)) + '</resources>\n'
          newfiles['docs/terminal-paste-edit.md'] = r'''# Paste with editing

          The terminal tools menu keeps Select and copy and Paste from Android, adding Paste with editing as a third entry. It reads the clipboard only on that explicit action and preloads the accepted plain-text snapshot into a multiline editor. Empty or rejected clipboard input starts with an empty editor and a visible reason.

          Only Send text dispatches the current edited draft through the existing paste path, with no added Enter. Enter inside the editor inserts a line break; it is not a send action. Existing multiline acknowledgement is keyed to the current text, so changing accepted text resets it. Invalid edits are rejected as a whole, retaining the last draft and showing an error; confirmation stays disabled until a valid edit. There is no silent truncation. Closing discards the draft; no clipboard overwrite, logging or persistence.

          Existing paste bounds, control/Unicode validation, single-attempt guard, renderer checks, bracketed-paste handling and unknown-result/no-retry behavior are reused. The read-only paste flow and terminal output/transport are unchanged. CI builds app and test APK, runs all JVM/Node tests and existing WebView echo/copy/paste regressions. Device verification remains necessary for editor/IME, edited payload, cancel, acknowledgement reset and dialog layout with keyboard.
          '''
          prepared = {}
          for name, replacements in edits.items():
              text = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  text = text.replace(old, new, 1)
              prepared[name] = text
          for name, text in newfiles.items():
              if Path(name).exists():
                  raise RuntimeError('New target already exists: ' + name)
              prepared[name] = text
          for text in prepared.values():
              text.encode('utf-8')
          for name, text in prepared.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript regressions
        run: |
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Existing real WebView regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest --no-daemon --stacktrace
      - name: Publish verified edit option
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-paste-edit.yml
          git add -- app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalPasteDialog.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalPasteEdit.kt app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalPasteEditTest.kt docs/terminal-paste-edit.md app/src/main/res/values/terminal_paste_edit.xml app/src/main/res/values-es/terminal_paste_edit.xml .github/workflows/terminal-paste-edit.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add editable terminal paste option'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-paste-edit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
