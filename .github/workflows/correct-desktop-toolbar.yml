name: Correct desktop toolbar order and info spacing
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/correct-desktop-toolbar.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: correct-desktop-toolbar-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact presentation correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='2e44a40211b85629378578f2298dd3a7966f67fe'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/correct-desktop-toolbar.yml'
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt')
          s=p.read_text()
          call='                            DesktopRightClickAssistToolbar(rightClickAssist)\n'
          anchor='                            val clickMode = desktopRememberedClickMode(selectedMode, lastClickMode)'
          old='Icon(Icons.Default.Info, contentDescription = stringResource(R.string.desktop_gestures_title), modifier = Modifier.size(24.dp), tint = Color(0xFF9E9E9E))'
          new='Icon(Icons.Default.Info, contentDescription = stringResource(R.string.desktop_gestures_title), modifier = Modifier.size(18.dp).offset(x = (-3).dp), tint = Color(0xFF9E9E9E))'
          assert s.count(call)==s.count(anchor)==s.count(old)==1
          s=s.replace(call,'',1).replace(anchor,call+anchor,1).replace(old,new,1)
          assert s.index('IconButton(onClick = { isControlsBarCollapsed = true') < s.index(call) < s.index(anchor) < s.index('FilterChip(selected = selectedMode == MouseMode.SCROLL')
          assert 'IconButton(onClick = { showGestureHelp = true }, modifier = Modifier.size(32.dp))' in s
          assert s.count(new)==1 and old not in s
          p.write_text(s)
          assert git('diff','--name-only')==str(p)
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build, compile UI tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbar-correction-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish tested correction and retire workflow
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "$(git hash-object app/build.gradle.kts)" = "71466c471ee7dc9cea48ad2ffbed23185aa4076d"
          rm .github/workflows/correct-desktop-toolbar.yml
          git add app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt .github/workflows/correct-desktop-toolbar.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): place assist after collapse and restore small info spacing'
          git push origin HEAD:dev
