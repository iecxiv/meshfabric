name: Validate integrated native device details links from Profile
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-profile-device-navigation.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-profile-device-navigation-dev
  cancel-in-progress: false
jobs:
  validate-integrated-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found or not executable: $SDKMANAGER"
            exit 1
          fi
          echo "Using Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify integrated navigation sources and tests exist
        run: |
          set -euo pipefail
          # Navigation is already integrated. Do not replay preparation templates.
          for file in \
            app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt \
            app/src/main/java/iecxiv/meshfabric/ui/management/CompactProfileGroups.kt \
            app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt \
            app/src/main/java/iecxiv/meshfabric/ui/management/ProfileDeviceNavigation.kt \
            app/src/test/java/iecxiv/meshfabric/ui/management/ProfileDeviceNavigationPolicyTest.kt \
            app/src/androidTest/java/iecxiv/meshfabric/ui/management/ProfileReceivedDeviceNavigationTest.kt
          do
            test -s "$file" || { echo "::error::Missing integrated file: $file"; exit 1; }
          done
          git diff --check
      - name: Build, compile Android tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Verify validation did not modify tracked sources
        run: git diff --exit-code -- app/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-device-navigation-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
