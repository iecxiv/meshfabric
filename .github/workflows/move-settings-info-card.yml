name: Move settings information card
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/move-settings-info-card.yml']
permissions:
  contents: write
concurrency:
  group: move-settings-info-card
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Move the existing information card without changing it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '2cc391d53110c658bf562b1b7d7887770e7f2585', 'Settings changed; review required'
          s = p.read_text()
          start = '            // Info Card\n'
          end = '            // Footer with Version & GitHub Repo Link\n'
          target = '            // Section 3: Theme\n'
          assert all(s.count(marker) == 1 for marker in (start,end,target))
          a = s.index(start)
          b = s.index(end,a)
          card = s[a:b]
          assert card.count('R.string.settings_info_note') == 1
          s = s[:a] + s[b:]
          s = s.replace(target,card+target,1)
          assert s.index('// Section 2: App Icon') < s.index('// Info Card') < s.index('// Section 3: Theme')
          assert s.count('R.string.settings_info_note') == 1
          assert s.count('iecxiv.meshfabric.diagnostics.DiagnosticSettings()') == 1
          p.write_text(s)
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated information card move
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/settings/SettingsScreen.kt
          git rm .github/workflows/move-settings-info-card.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: place settings information between app icon and theme'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-info-card-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
