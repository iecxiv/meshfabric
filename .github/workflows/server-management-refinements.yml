name: Validate server and management refinements
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/server-management-refinements.yml']
permissions:
  contents: write
concurrency:
  group: server-management-refinements-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reapply approved immutable patch with corrected horizontal alignment
        shell: python
        run: |
          import subprocess,textwrap
          ref='13f91e15e32e0063f4452934f5c3ba237ac491ee:.github/workflows/server-management-refinements.yml'
          original=subprocess.check_output(['git','show',ref],text=True)
          section=original.split('      - name: Apply combined corrections with narrow guards\n',1)[1].split('      - run: git diff --check\n',1)[0]
          code=textwrap.dedent(section.split('        run: |\n',1)[1])
          guard="assert git('rev-parse','HEAD^')=='77c0cc39a5c9741a4be41b12fba5ca46553c5ad9','Base changed; re-review required'"
          replacement="assert git('diff','--name-only','77c0cc39a5c9741a4be41b12fba5ca46553c5ad9','HEAD')=='.github/workflows/server-management-refinements.yml','Application base changed; re-review required'"
          assert code.count(guard)==1
          code=code.replace(guard,replacement,1)
          old='Arrangement.spacedBy(6.dp,Alignment.Center)'
          new='Arrangement.spacedBy(6.dp,Alignment.CenterHorizontally)'
          assert code.count(old)==1
          code=code.replace(old,new,1)
          exec(compile(code,'approved-refinements-corrected.py','exec'),{})
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-management-refinements-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish all validated corrections and retire workflow
        shell: python
        run: |
          import subprocess,textwrap
          ref='13f91e15e32e0063f4452934f5c3ba237ac491ee:.github/workflows/server-management-refinements.yml'
          original=subprocess.check_output(['git','show',ref],text=True)
          section=original.split('      - name: Publish all validated corrections and retire workflow\n',1)[1]
          code=textwrap.dedent(section.split('        run: |\n',1)[1])
          exec(compile(code,'approved-refinements-publish.py','exec'),{})
