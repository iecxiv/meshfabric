name: Validate and publish readable access grants
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-readable-access-grants.yml]
permissions:
  contents: write
concurrency:
  group: readable-access-grants-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate guarded grant presentation changes and offline regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          expected={main/'UserMeshGrantDialog.kt':'618294a245e40457f8893c5be104b6e662877909',main/'GroupMeshGrantDialog.kt':'5cb489f723ae030c6a546c83f6db178324b0c941',tests/'UserMeshGrantDialogTest.kt':'1c2ef312e5bee7c44844717976e009392cbde65b'}
          for p,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha,'Source changed: '+str(p)
          assert (main/'ProfileReviewIdentity.kt').exists()
          regression=tests/'ReadableGrantDialogsTest.kt'
          assert not regression.exists()
          def replace(s,old,new):
              assert s.count(old)==1,'Missing/nonunique anchor: '+old[:100]
              return s.replace(old,new,1)
          for kind in ['User','Group']:
              is_user=kind=='User'
              target='uid' if is_user else 'gid'
              collection='s.users' if is_user else 's.listedUserGroups.orEmpty()'
              prefix='direct-grant-' if is_user else 'group-grant-'
              p=main/(kind+'MeshGrantDialog.kt');s=p.read_text()
              if not is_user:
                  s=replace(s,'import androidx.compose.ui.platform.LocalConfiguration','import androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.testTag')
              s=replace(s,'    var selectedLabel by remember {mutableStateOf("")}','    var selectedMesh by remember {mutableStateOf<JSONObject?>(null)}')
              anchor='    val bound=actor==s.id && server.isNotBlank() && server==session.broadcastServerLabel()'
              extra='\n    val subject=remember {'+collection+'.singleOrNull {it.optString("_id")=='+target+'}?.let {JSONObject(it.toString())}}\n    val subjectIdentity=profileReviewIdentity(subject,'+collection+',es)\n    val meshIdentity=profileReviewIdentity(selectedMesh,s.groups,es)\n    val identityReady=subjectIdentity.usable && meshIdentity.usable\n    var invalidated by remember {mutableStateOf(false)}'
              s=replace(s,anchor,anchor+extra)
              s=replace(s,'val draft=if(bound &&','val draft=if(bound && identityReady &&')
              s=replace(s,'val current=bound &&','val current=bound && identityReady && !invalidated &&')
              s=replace(s,'    val observed=','    LaunchedEffect(review,current) {if(review!=null && !current && !submitted) {approved=false;invalidated=true}}\n    val observed=')
              s=replace(s,'selectedLabel=profileGroupChoiceLabel(mesh,s.groups,es);','selectedMesh=JSONObject(mesh.toString());')
              s=replace(s,'enabled=profileGroupChoiceUsable(mesh,s.groups),','enabled=subjectIdentity.usable && profileGroupChoiceUsable(mesh,s.groups) && profileReviewIdentity(mesh,s.groups,es).usable,')
              s=replace(s,'+profileGroupChoiceLabel(mesh,s.groups,es))','+profileReviewIdentity(mesh,s.groups,es).label)')
              s=replace(s,'candidates.any {!profileGroupChoiceUsable(it,s.groups)}','candidates.any {!profileGroupChoiceUsable(it,s.groups) || !profileReviewIdentity(it,s.groups,es).usable}')
              label='t("Usuario: ","User: ")' if is_user else 't("Grupo de usuarios: ","User group: ")'
              anchor='            Text(server,style=MaterialTheme.typography.bodySmall);Text('+target+',style=MaterialTheme.typography.bodySmall)'
              replacement='            Text(server,style=MaterialTheme.typography.bodySmall);Text('+label+'+subjectIdentity.label,style=MaterialTheme.typography.bodySmall)\n            if(!subjectIdentity.usable || (selected.isNotBlank() && !meshIdentity.usable)) Text(t("No se puede confirmar: falta un nombre o los datos visibles no distinguen inequívocamente los destinos. Cierra y actualiza la ficha.","Cannot confirm: a name is missing or visible information does not uniquely identify the targets. Close and refresh the details."),color=MaterialTheme.colorScheme.error,style=MaterialTheme.typography.bodySmall)'
              s=replace(s,anchor,replacement)
              s=replace(s,'+selectedLabel)','+meshIdentity.label)')
              s=replace(s,'{frozen=null;approved=false;error=false;','{frozen=null;approved=false;invalidated=false;error=false;')
              s=replace(s,'else if(packet!=null && session.','else if(packet!=null && current && session.')
              if not is_user:
                  s=replace(s,'TextButton(enabled=subjectIdentity.usable','TextButton(modifier=Modifier.testTag("group-grant-candidate-"+mid),enabled=subjectIdentity.usable')
                  s=replace(s,'Checkbox(approved,{approved=it},enabled=current)','Checkbox(approved,{approved=it},enabled=current,modifier=Modifier.testTag("group-grant-consent"))')
                  s=replace(s,'isError=hex.isNotBlank() && rights==null,singleLine=true,modifier=Modifier.fillMaxWidth())','isError=hex.isNotBlank() && rights==null,singleLine=true,modifier=Modifier.fillMaxWidth().testTag("group-grant-hex"))')
                  s=replace(s,'Button(enabled=if(review==null) draft!=null','Button(modifier=Modifier.testTag(if(review==null) "group-grant-prepare" else "group-grant-send"),enabled=if(review==null) draft!=null')
              p.write_text(s)
          p=tests/'UserMeshGrantDialogTest.kt'
          p.write_text(replace(p.read_text(),'JSONObject().put("_id",uid)','JSONObject().put("_id",uid).put("name","Cuenta destino")'))
          regression.write_text('''package iecxiv.meshfabric.ui.management
          import android.content.res.Configuration
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.MutableStateFlow
          import org.json.JSONObject
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.util.Locale
          @RunWith(AndroidJUnit4::class) class ReadableGrantDialogsTest {
              @get:Rule val compose=createComposeRule()
              private val actor="user//admin";private val mid="mesh//office"
              private fun field(target:Any,name:String)=target.javaClass.getDeclaredField(name).apply {isAccessible=true}
              private inner class Fixture(val groups:Boolean,missingName:Boolean=false):AutoCloseable {
                  val uid=if(groups) "ugrp//target" else "user//target"
                  val prefix=if(groups) "group-grant-" else "direct-grant-"
                  val client=MeshCentralClient();val session=ProfileSession(client)
                  val subject=JSONObject().put("_id",uid).put("name",if(missingName) "" else "Equipo").put("desc","Madrid").put("siteadmin",0).put("links",JSONObject())
                  val mesh=JSONObject().put("_id",mid).put("name","Oficina").put("desc","Madrid").put("links",JSONObject().put(actor,JSONObject().put("rights",0xffffffffL)))
                  val baseline=ProfileState(ready=true,user=JSONObject().put("_id",actor).put("siteadmin",if(groups) 256L else 2L),users=if(groups) emptyList() else listOf(subject),groups=listOf(mesh),listedUserGroups=if(groups) listOf(subject) else emptyList(),userGroupPhase="ready")
                  val state=mutableStateOf(baseline)
                  init {
                      field(client,"serverUrl").set(client,"https://example.invalid/");field(client,"authCookie").set(client,"offline-grant-identity-test")
                      @Suppress("UNCHECKED_CAST") val connected=field(client,"_connectionState").get(client) as MutableStateFlow<Boolean>
                      connected.value=true
                      field(session,"binding").set(session,Triple(client.serverUrl,client.authCookie,false))
                      compose.setContent {
                          val config=Configuration(LocalConfiguration.current).apply {setLocale(Locale("es"))}
                          CompositionLocalProvider(LocalConfiguration provides config) {MaterialTheme {
                              if(groups) GroupMeshGrantDialog(session,state.value,uid) {} else UserMeshGrantDialog(session,state.value,uid) {}
                          }}
                      }
                  }
                  fun ambiguousSubject():ProfileState {
                      val other=JSONObject(subject.toString()).put("_id",if(groups) "ugrp//other" else "user//other")
                      return if(groups) baseline.copy(listedUserGroups=listOf(subject,other)) else baseline.copy(users=listOf(subject,other))
                  }
                  fun assertNoIds() {for(id in listOf(actor,uid,mid)) compose.onAllNodesWithText(id,substring=true).assertCountEquals(0)}
                  override fun close() {
                      assertNull(field(client,"webSocket").get(client));assertNull(field(session,"socket").get(session))
                      session.close();(field(client,"scope").get(client) as CoroutineScope).cancel()
                  }
              }
              private fun verifyGrant(groups:Boolean) {Fixture(groups).use {f->
                  f.assertNoIds()
                  compose.onNodeWithTag(f.prefix+"candidate-"+mid).performScrollTo().assertIsEnabled().performClick()
                  compose.onNodeWithTag(f.prefix+"prepare").assertIsNotEnabled()
                  compose.onNodeWithText("Avanzado: máscara hexadecimal").performScrollTo().performClick()
                  compose.onNodeWithTag(f.prefix+"hex").performScrollTo().performTextReplacement("8")
                  compose.onNodeWithTag(f.prefix+"prepare").assertIsEnabled()
                  val duplicate=JSONObject(f.mesh.toString()).put("_id","mesh//other")
                  compose.runOnIdle {f.state.value=f.baseline.copy(groups=listOf(f.mesh,duplicate))}
                  compose.onNodeWithTag(f.prefix+"prepare").assertIsNotEnabled()
                  compose.runOnIdle {f.state.value=f.baseline}
                  compose.onNodeWithTag(f.prefix+"prepare").assertIsEnabled().performClick()
                  f.assertNoIds()
                  compose.onNodeWithText("Grupo de dispositivos: Oficina · Madrid").assertExists()
                  compose.onNodeWithTag(f.prefix+"send").assertIsNotEnabled()
                  compose.onNodeWithTag(f.prefix+"consent").performScrollTo().performClick()
                  compose.onNodeWithTag(f.prefix+"send").assertIsEnabled()
                  compose.runOnIdle {f.state.value=f.ambiguousSubject()}
                  compose.onNodeWithTag(f.prefix+"send").assertIsNotEnabled()
                  compose.runOnIdle {f.state.value=f.baseline}
                  compose.onNodeWithTag(f.prefix+"send").assertIsNotEnabled()
                  compose.onNodeWithTag(f.prefix+"consent").assertIsNotEnabled()
              }}
              private fun verifyMissingName(groups:Boolean) {Fixture(groups,true).use {f->
                  f.assertNoIds()
                  compose.onNodeWithText("nombre no disponible",substring=true).assertExists()
                  compose.onNodeWithTag(f.prefix+"candidate-"+mid).performScrollTo().assertIsNotEnabled()
                  compose.onNodeWithTag(f.prefix+"prepare").assertIsNotEnabled()
              }}
              @Test fun userGrantUsesNamesAndPermanentlyInvalidatesAmbiguousReview()=verifyGrant(false)
              @Test fun groupGrantUsesNamesAndPermanentlyInvalidatesAmbiguousReview()=verifyGrant(true)
              @Test fun userGrantRejectsMissingNameWithoutIdFallback()=verifyMissingName(false)
              @Test fun groupGrantRejectsMissingNameWithoutIdFallback()=verifyMissingName(true)
          }
          ''')
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute offline grants, identity, authority and session regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.ReadableGrantDialogsTest,iecxiv.meshfabric.ui.management.UserMeshGrantDialogTest,iecxiv.meshfabric.ui.management.UserMeshGrantRequestTest,iecxiv.meshfabric.ui.management.UserMeshGrantSessionTest,iecxiv.meshfabric.ui.management.GroupMeshGrantRequestTest,iecxiv.meshfabric.ui.management.UserMeshEditDialogTest,iecxiv.meshfabric.ui.management.GroupMeshEditDialogTest,iecxiv.meshfabric.ui.management.ReadableAssignmentReviewsTest,iecxiv.meshfabric.ui.management.ReadableUserGroupDialogsTest,iecxiv.meshfabric.ui.management.ProfilePolishPresentationTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest,iecxiv.meshfabric.ui.management.ProfileAccessAssignmentNavigationTest,iecxiv.meshfabric.ui.management.UserGroupsSectionSpacingTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-access-grants-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only validated sources if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserMeshGrantDialog.kt app/src/main/java/iecxiv/meshfabric/ui/management/GroupMeshGrantDialog.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserMeshGrantDialogTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/ReadableGrantDialogsTest.kt
          python3 - <<'PY'
          import subprocess
          main='app/src/main/java/iecxiv/meshfabric/ui/management/'
          tests='app/src/androidTest/java/iecxiv/meshfabric/ui/management/'
          expected={main+n for n in ['UserMeshGrantDialog.kt','GroupMeshGrantDialog.kt']}|{tests+n for n in ['UserMeshGrantDialogTest.kt','ReadableGrantDialogsTest.kt']}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected,'Unexpected staged changes'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): readable grant reviews with permanent invalidation guards'
          git push origin HEAD:dev
