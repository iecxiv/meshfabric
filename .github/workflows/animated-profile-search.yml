name: Validate animated management searches
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/animated-profile-search.yml']
permissions:
  contents: write
concurrency:
  group: animated-profile-search-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare only search animation correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt')
          assert git('hash-object',str(p))=='dbfb1061d44b701d4e162fccbad4403776155cdb'
          original=p.read_text()
          s=original
          pairs=[
              ('import androidx.compose.foundation.layout.*','import androidx.compose.foundation.layout.*\nimport androidx.compose.animation.AnimatedVisibility'),
              ('if(tab in 1..3 && directorySearchOpen) {','AnimatedVisibility(visible=tab in 1..3 && directorySearchOpen) {'),
              ('LaunchedEffect(Unit) {withFrameNanos {};directorySearchFocus.requestFocus();directoryKeyboard?.show()}','LaunchedEffect(directorySearchOpen) {if(directorySearchOpen) {withFrameNanos {};directorySearchFocus.requestFocus();directoryKeyboard?.show()}}')
          ]
          for old,new in pairs:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          restored=s
          for old,new in reversed(pairs): restored=restored.replace(new,old,1)
          assert restored==original
          p.write_text(s)
          assert git('diff','--name-only')==str(p)
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-profile-search-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated animation correction and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/animated-profile-search.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(management): animate directory search expansion and collapse'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
