name: Update session documentation once
'on':
  push:
    branches: [dev]
    paths: [.github/workflows/update-session-docs-once.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-session-docs-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Update verified documentation and stage self-removal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess
          W='.github/workflows/update-session-docs-once.yml'
          def require(ok,message):
              if not ok: raise SystemExit(message)
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def safe(name):
              p=Path(name)
              require(Path.cwd().resolve() in p.resolve().parents and not p.is_symlink(),'Unsafe path: '+name)
              return p
          def read(name,expected):
              raw=safe(name).read_bytes()
              require(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==expected,'Source changed: '+name)
              return raw.decode('utf-8')
          def replace(text,old,new):
              require(text.count(old)==1,'Missing or ambiguous anchor: '+old)
              return text.replace(old,new,1)
          require(os.environ['GITHUB_REPOSITORY']=='iecxiv/meshfabric','Wrong repository')
          require(os.environ['GITHUB_REF']=='refs/heads/dev','Wrong branch')
          require(git('rev-parse','HEAD')==os.environ['GITHUB_SHA'],'Wrong checkout')
          require(not git('status','--porcelain'),'Dirty checkout')
          en=read('README.md','4452a92a692d1fbf19f882337c8a3aa720126d95')
          es=read('README_ES.md','1752ef74dcfb9ff0b08efb30bb628f2176029168')
          en=replace(en,'- Access desktop, terminal, file sessions, and device actions from each device card.','- Access desktop, terminal, file sessions, and device actions from each device card.\n- Expand the card options to open General, Events, Details and the agent Console. Details remains available there without a duplicate information icon beside ONLINE/OFFLINE.\n- Header filters control offline-device and network-address visibility.')
          es=replace(es,'- Acceso al escritorio, terminal, archivos y acciones desde cada tarjeta de dispositivo.','- Acceso al escritorio, terminal, archivos y acciones desde cada tarjeta de dispositivo.\n- Despliega las opciones de la tarjeta para abrir General, Eventos, Detalles y la Consola del agente. Detalles sigue disponible sin duplicar el icono de información junto a ONLINE/OFFLINE.\n- Los filtros de cabecera controlan la visibilidad de dispositivos desconectados y direcciones de red.')
          en=replace(en,'### Remote desktop\n\n','### Remote desktop\n\n- The connection label includes the server-reported viewer count when more than one viewer is present, for example Connected, 2 viewing. Multiple connections from the same account count separately; missing or invalid metadata does not invent a count.\n- The draggable control bar can reach both vertical edges and retains its relative position when expanded or collapsed. Viewport state is retained across automatic reconnects within the app session.\n- Resume and refresh use separate control packets; frame timing is sent with compression settings rather than through a periodic refresh loop. This does not guarantee compatibility with every server or agent.\n\n')
          es=replace(es,'### Escritorio remoto\n\n','### Escritorio remoto\n\n- El estado incluye el número de visores comunicado por el servidor cuando hay más de uno, por ejemplo Conectado, 2 viendo. Varias conexiones de la misma cuenta se cuentan por separado; no se inventa un contador si faltan metadatos válidos.\n- La barra arrastrable llega a ambos bordes verticales y conserva su posición relativa al expandirse o plegarse. El estado de la vista se conserva entre reconexiones automáticas dentro de la sesión de la app.\n- Reanudar y refrescar utilizan paquetes distintos; el intervalo de imágenes se envía con la compresión, sin un bucle de refrescos periódicos. No garantiza compatibilidad con todos los servidores o agentes.\n\n')
          en=replace(en,'### Activity\n','### Device General and chat\n\n- General provides device metadata editing and reviewed actions according to verified permissions. Notes, command execution, notifications, chat and agent-console tools remain subject to server and agent capabilities.\n- Device sharing is hidden while its implementation is incomplete.\n- Chat supports text messages and can be minimized into movable in-app bubbles. Starting a chat explicitly asks the selected device to open its remote browser.\n- Open chats are included in background keep-alive session accounting. Backgrounding alone no longer deliberately disconnects them; the existing active-sessions notification is used. Closing a chat, ending its authenticated context or removing the task still closes it.\n- Drafts and chat history remain in memory, with no delivery/read receipts or automatic message replay. Process death and network/permission loss can end the chat.\n\nGuide and acceptance checklist: [Device sessions and chat](docs/device-sessions.md).\n\n### Activity\n')
          es=replace(es,'### Actividad\n','### General del dispositivo y chat\n\n- General permite editar metadatos y revisar acciones según permisos verificados. Notas, ejecución de comandos, notificaciones, chat y herramientas de consola dependen del servidor y del agente.\n- Compartir permanece oculto mientras su implementación está incompleta.\n- El chat admite texto y puede minimizarse en burbujas móviles dentro de la app. Iniciarlo solicita explícitamente al equipo seleccionado abrir su navegador remoto.\n- Los chats abiertos se incluyen en el cómputo de sesiones del servicio keep-alive. Pasar a segundo plano ya no los desconecta deliberadamente y utiliza la notificación existente de sesiones activas. Cerrar el chat, terminar su contexto autenticado o retirar la tarea sigue cerrándolo.\n- El borrador y el historial permanecen en memoria, sin confirmaciones de entrega/lectura ni reenvío automático. La muerte del proceso y la pérdida de red o permisos pueden terminar el chat.\n\nGuía y lista de aceptación: [Sesiones y chat de dispositivos](docs/es/device-sessions.md).\n\n### Actividad\n')
          en=replace(en,'### Background sessions and notification\n\n','### Background sessions and notification\n\n- Open chats participate alongside desktop, terminal and file sessions, including when a chat is the only open session. Chat closures update the background service decision without dismissing other active sessions.\n')
          es=replace(es,'### Sesiones en segundo plano y notificación\n\n','### Sesiones en segundo plano y notificación\n\n- Los chats abiertos se cuentan junto al escritorio, terminal y archivos, incluso si solo queda un chat. Al cerrarlos se actualiza la decisión del servicio sin retirar otras sesiones activas.\n')
          en=replace(en,'- Localization is not complete: some native management, activity, desktop, and feedback messages remain hard-coded in Spanish. Resource-key coverage is not proof that every visible phrase has been externalized or translated.','- English and Spanish coverage includes desktop controls, shortcut labels, terminal navigation, file-transfer feedback and related management messages. Coverage is not a guarantee that every visible phrase is localized; remote output and server/agent messages can remain in their original language.')
          es=replace(es,'- La localización no está completa: algunos mensajes de gestión, actividad, escritorio y resultados siguen escritos directamente en español. La cobertura de claves no demuestra que todas las frases estén externalizadas o traducidas.','- La cobertura en inglés y español incluye controles y atajos del escritorio, navegación del terminal, mensajes de transferencias y acciones relacionadas de gestión. No garantiza que todas las frases estén localizadas; la salida remota y los mensajes del servidor o agente pueden conservar su idioma original.')
          guide_en='# Device sessions and chat\n\nEnglish | [Español](es/device-sessions.md)\n\n## Device cards\n\nUse the card chevron for General, Events, Details and the agent Console. Availability depends on the authenticated account, current permissions, inventory and remote capabilities. The redundant information icon beside the connection badge is removed; Details remains in the expanded options. Sharing is hidden until its implementation is complete.\n\n## Remote desktop\n\nThe connection subtitle shows Connected for one viewer or an unknown count, and Connected, 2 viewing or Connected, 3 viewing for multiple viewers. The total sums the connection counts in server metadata, not just distinct accounts. Disconnecting clears the previous count. Metadata updates do not request a screen refresh.\n\nDesktop resume and refresh are distinct protocol operations. Compression settings carry the frame interval, and changing frame rate updates those settings. There is no periodic refresh loop acting as a heartbeat. Toolbar movement, collapse/expand, physical mouse dragging and viewport retention require validation on the intended Android and remote devices.\n\n## Chat and background behavior\n\nOpening General and choosing Chat creates a local chat window. Start chat is explicit and asks the selected device to open its browser; it does not prove human presence. Minimize retains the local draft and history in a movable in-app bubble. The bubble can be restored or dragged to the close target. These are in-app bubbles, not overlays over other apps.\n\nOpen chat sessions are counted by the existing keep-alive foreground service alongside desktop, terminal and files. Backgrounding alone does not deliberately close the chat. The active-sessions notification can remain when only a chat is open and requests a return to the app when tapped. Closing the last eligible session allows the service to stop; other eligible sessions keep it active.\n\nClosing a chat, disposing its authenticated host, losing verified authority or removing the app task can close the session. There is no automatic reopening of the remote browser or replay of chat messages. A foreground service is not persistence after process death. Drafts and chat history are not saved to disk. Chat is text-only, with bounded local history and no delivery or read receipts.\n\n## Appearance\n\nStatus-bar icon contrast is selected from the app background and reapplied after configuration layout, on resume and on focus restoration. Rotation behavior must be checked in both light and dark themes without opening the notification shade as a workaround.\n\n## Acceptance checklist\n\n- Open desktop in the app, add a browser viewer, then repeat in the reverse order; verify image delivery and live counts when either viewer leaves.\n- Repeat with multiple connections from the same account and with three viewers.\n- Rotate, drag and collapse/expand the desktop toolbar; verify viewport and pointer alignment.\n- Keep only a chat open, background the app, receive a remote message and return through the active-sessions notification. Verify the draft and in-memory history.\n- Repeat with minimized chats and with other active session types; close chats and check notification lifetime.\n- Check explicit closure, logout, permission/network loss and task removal without automatic message replay.\n\nThese are acceptance checks, not a claim that they have all passed. Publication, compilation, unit tests, instrumentation and physical-device/live-server validation are separate evidence.\n'
          guide_es='# Sesiones y chat de dispositivos\n\n[English](../device-sessions.md) | Español\n\n## Tarjetas de dispositivos\n\nEl chevrón de la tarjeta muestra General, Eventos, Detalles y la Consola del agente. La disponibilidad depende de la cuenta autenticada, permisos actuales, inventario y capacidades remotas. Se elimina el icono de información duplicado junto al indicador de conexión; Detalles permanece entre las opciones desplegadas. Compartir está oculto hasta completar su implementación.\n\n## Escritorio remoto\n\nEl subtítulo muestra Conectado con un visor o un contador desconocido, y Conectado, 2 viendo o Conectado, 3 viendo cuando hay varios. Suma las conexiones comunicadas en los metadatos del servidor, no solo las cuentas distintas. Desconectar limpia el contador anterior. Recibir metadatos no solicita un refresco de pantalla.\n\nReanudar y refrescar son operaciones distintas del protocolo. La compresión incluye el intervalo de fotogramas y cambiar la velocidad actualiza ese ajuste. No hay un bucle de refrescos usado como heartbeat. El arrastre y plegado de la barra, el ratón físico y la conservación de la vista requieren validación en los dispositivos Android y remotos previstos.\n\n## Chat y segundo plano\n\nChat, desde General, abre una ventana local. Iniciar chat es explícito y solicita al equipo seleccionado abrir su navegador; no confirma presencia humana. Minimizar conserva borrador e historial en una burbuja móvil dentro de la app. Puede restaurarse o arrastrarse al destino de cierre. No son burbujas superpuestas sobre otras aplicaciones.\n\nLas sesiones de chat abiertas se cuentan en el servicio keep-alive existente junto a escritorio, terminal y archivos. Pasar a segundo plano no cierra deliberadamente el chat. La notificación de sesiones activas puede mantenerse aunque solo haya un chat y solicita volver a la app al pulsarla. Cerrar la última sesión elegible permite detener el servicio; otras sesiones elegibles lo mantienen.\n\nCerrar un chat, liberar su host autenticado, perder la autorización verificada o retirar la tarea puede cerrar la sesión. No se reabre automáticamente el navegador remoto ni se reenvían mensajes. El servicio en primer plano no restaura sesiones después de morir el proceso. El borrador y el historial del chat no se guardan en disco. Solo admite texto, con historial local limitado y sin confirmaciones de entrega o lectura.\n\n## Apariencia\n\nEl contraste de los iconos de la barra de estado se elige según el fondo y se reaplica tras el diseño de configuración, al reanudar y al recuperar el foco. Debe comprobarse la rotación con tema claro y oscuro sin usar el panel de notificaciones como solución temporal.\n\n## Lista de aceptación\n\n- Abrir el escritorio en la app, añadir un visor web y repetir en orden inverso; comprobar imagen y contador al salir cualquiera.\n- Repetir con varias conexiones de la misma cuenta y con tres visores.\n- Girar, arrastrar y plegar/desplegar la barra; comprobar posición de vista y puntero.\n- Dejar solo un chat, pasar a segundo plano, recibir un mensaje remoto y volver con la notificación. Verificar borrador e historial en memoria.\n- Repetir con chats minimizados y otras sesiones activas; cerrar chats y comprobar la duración de la notificación.\n- Revisar cierre explícito, logout, pérdida de permisos/red y retirada de tarea sin reenvío automático de mensajes.\n\nSon comprobaciones de aceptación, no una afirmación de que todas hayan pasado. Publicación, compilación, tests unitarios, instrumentación y validación física contra un servidor real son evidencias distintas.\n'
          for name in ['docs/device-sessions.md','docs/es/device-sessions.md']:
              require(not safe(name).exists(),'New guide already exists: '+name)
          require('1.3.' not in guide_en+guide_es,'Unexpected app version reference')
          planned={'README.md':en,'README_ES.md':es,'docs/device-sessions.md':guide_en,'docs/es/device-sessions.md':guide_es}
          for name,content in planned.items():
              p=safe(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content.encode('utf-8'))
          safe(W).unlink()
          subprocess.run(['git','add','--',*planned,W],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(planned)|{W},'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Publish documentation only if dev has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: describe device sessions, chat and desktop behavior'
          git push origin HEAD:refs/heads/dev
          echo "Published documentation $(git rev-parse HEAD); temporary workflow removed. No build or tests run." >> "$GITHUB_STEP_SUMMARY"
