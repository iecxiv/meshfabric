name: Final Kotlin warning cleanup
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/final-build-warning-cleanup.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove only proven redundant null checks
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/final-warnings-base"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/iecxiv/meshfabric')
          p = root / 'data/remote/FileRelayClient.kt'
          s = p.read_text()
          assert 'val context: Context\n' in s
          a = s.index('    private fun finishDownload(')
          b = s.index('    private fun startFileCopyStream(', a)
          block = s[a:b]
          assert 'val ctx = session.context' in block
          lines = block.splitlines(keepends=True)
          indices = [i for i, line in enumerate(lines) if line == '            if (ctx != null) {\n']
          assert len(indices) == 1
          start = indices[0]
          end = next(i for i in range(start+1, len(lines)) if lines[i] == '            }\n')
          body = lines[start+1:end]
          assert body[0].strip() == 'showDownloadCompleteNotification(ctx, fileName, key, totalSize, session.localUri)'
          assert any('Toast.makeText(' in line for line in body)
          assert lines[end+1].lstrip().startswith('} catch')
          assert all(line.startswith('    ') or not line.strip() for line in body)
          lines[start:end+1] = [line[4:] if line.startswith('    ') else line for line in body]
          p.write_text(s[:a] + ''.join(lines) + s[b:])
          p = root / 'ui/files/FileManagerScreen.kt'
          s = p.read_text()
          assert 'val isCompressing = activeZipTransfer != null' in s
          old = 'if (activeZipTransfer != null && activeZipTransfer.percentage > 0f) {'
          assert s.count(old) == 1
          s = s.replace(old, 'if (activeZipTransfer.percentage > 0f) {', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff
      - name: Clean build, unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew clean :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace --warning-mode=all 2>&1 | tee final-warning-cleanup.log
      - name: Verify zero Kotlin warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          warnings = [line for line in Path('final-warning-cleanup.log').read_text().splitlines() if line.startswith('w: ')]
          assert not warnings, warnings
          PY
      - name: Publish validated fixes and remove temporary report
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/final-warnings-base")"
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt
          git rm docs/build-warning-context.txt .github/workflows/final-build-warning-cleanup.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove redundant download and ZIP progress null checks'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-warning-cleanup-verification
          path: |
            final-warning-cleanup.log
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
