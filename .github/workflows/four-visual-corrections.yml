name: Validate four visual corrections
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/four-visual-corrections.yml']
permissions:
  contents: write
concurrency:
  group: four-visual-corrections-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare only the four requested visual corrections
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='1314095c805ef3c440062c811931a7c8742ccac7','Base advanced; review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui');paths=[]
          def edit(name,old,new):
              p=root/name;s=p.read_text();assert s.count(old)==1,(name,old,s.count(old));p.write_text(s.replace(old,new,1));paths.append(str(p))
          edit('management/ProfileUserDetailSurface.kt','internal val LocalProfileUserInline=staticCompositionLocalOf {false}','internal val LocalProfileUserInline=staticCompositionLocalOf {false}\ninternal val LocalPinnedSubviewHeader=staticCompositionLocalOf<(@Composable ()->Unit)?> {null}')
          edit('management/ProfileUserDetailSurface.kt','    if(!inline) {','    val pinnedHeader=LocalPinnedSubviewHeader.current\n    if(!inline) {')
          edit('management/ProfileUserDetailSurface.kt','        ManagementDialog(onDismissRequest=onDismissRequest,modifier=modifier,properties=properties,title=title,text=text,confirmButton=confirmButton,dismissButton=dismissButton)','        CompositionLocalProvider(LocalPinnedSubviewHeader provides null) {\n            ManagementDialog(onDismissRequest=onDismissRequest,modifier=modifier,properties=properties,title={if(pinnedHeader==null) title() else Column(verticalArrangement=Arrangement.spacedBy(10.dp)) {title();pinnedHeader()}},text=text,confirmButton=confirmButton,dismissButton=dismissButton)\n        }')
          edit('management/ProfileUserDetailSurface.kt','        Column(Modifier.fillMaxSize().imePadding()','        CompositionLocalProvider(LocalPinnedSubviewHeader provides null) {\n        Column(Modifier.fillMaxSize().imePadding()')
          edit('management/ProfileUserDetailSurface.kt','            iecxiv.meshfabric.ui.components.SubviewHeader(onBack=onDismissRequest,title=title,backTag="user-action-back")','            iecxiv.meshfabric.ui.components.SubviewHeader(onBack=onDismissRequest,title=title,backTag="user-action-back")\n            pinnedHeader?.invoke()')
          p=root/'management/ProfileUserDetailSurface.kt';s=p.read_text();assert s.endswith('        }\n    }\n}\n');p.write_text(s[:-len('        }\n    }\n}\n')]+'        }\n        }\n    }\n}\n')
          tabs='''@Composable internal fun DeviceGroupDetailsTabs(tab:Int,onSelect:(Int)->Unit) {
              val es=LocalConfiguration.current.locales[0].language=="es"
              ManagementSectionTabs(listOf(if(es) "Resumen" else "Summary",if(es) "Dispositivos" else "Devices",if(es) "Accesos" else "Access"),tab) {onSelect(it)}
          }
          '''
          edit('management/CompactProfileGroups.kt','@Composable internal fun DeviceGroupDetailsDialog(',tabs+'@Composable internal fun DeviceGroupDetailsDialog(')
          edit('management/CompactProfileGroups.kt','    UserActionSurface(inline=LocalDeviceGroupInline.current,','    CompositionLocalProvider(LocalPinnedSubviewHeader provides {if(group!=null) DeviceGroupDetailsTabs(tab) {tab=it;onTabChanged(it)}}) {\n    UserActionSurface(inline=LocalDeviceGroupInline.current,')
          edit('management/CompactProfileGroups.kt','                ManagementSectionTabs(listOf(t("Resumen","Summary"),t("Dispositivos","Devices"),t("Accesos","Access")),tab) {tab=it;onTabChanged(it)}\n','')
          p=root/'management/CompactProfileGroups.kt';s=p.read_text();assert s.endswith('\n}\n');p.write_text(s[:-3]+'\n    }\n}\n')
          edit('management/ServerEventDetails.kt','            ServerEventIcon(row.action)\n','')
          edit('management/ServerEventDetails.kt','title={Text(stringResource(R.string.log_detail_title),modifier=Modifier.fillMaxWidth(),style=MaterialTheme.typography.titleMedium.copy(fontSize=18.sp,lineHeight=24.sp,fontWeight=androidx.compose.ui.text.font.FontWeight.Bold))}','title={Row(Modifier.fillMaxWidth().testTag("event_details_title"),verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(10.dp)) {Box(Modifier.size(24.dp).testTag("event_details_title_icon")) {ServerEventIcon(row.action)};Box(Modifier.weight(1f).testTag("event_details_title_text")) {iecxiv.meshfabric.ui.devices.DeviceBatchDialogTitle(stringResource(R.string.log_detail_title))}}}')
          p=root/'devices/DeviceAgentConsoleScreen.kt';s=p.read_text()
          a=s.index('            Row(Modifier.fillMaxWidth().heightIn(min=48.dp).testTag("agent_console_status_row")')
          b=s.index('            if(state.phase=="closed" && state.code.isNotBlank())',a)
          old=s[a:b];assert 'Modifier.alpha(0f).clearAndSetSemantics {}' in old
          s=s[:a]+'            DeviceConsoleChannelStatus(state.phase,connected) {if(state.phase=="closed") session.connect()}\n'+s[b:]
          s=s.replace('import androidx.compose.ui.draw.alpha\n','').replace('import androidx.compose.ui.semantics.clearAndSetSemantics\n','')
          p.write_text(s);paths.append(str(p))
          caption='                    Text(if (es) "Toca para copiar · Mantén pulsado para copiar el original" else "Tap to copy · Hold to copy the original",\n                        style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n'
          edit('devices/DeviceDetailsDialog.kt',caption,'')
          edit('devices/DeviceDetailsDialog.kt','import androidx.compose.ui.platform.LocalContext','import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.testTag')
          edit('devices/DeviceDetailsDialog.kt','                HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant)\n                LazyColumn(','                HorizontalDivider(Modifier.testTag("device_details_header_divider"),color = MaterialTheme.colorScheme.outlineVariant)\n                LazyColumn(')
          edit('devices/DeviceDetailsDialog.kt','                    item(key = "inventory_notice") {','                    item(key = "copy_hint") {\n                        Text(if(es) "Toca para copiar · Mantén pulsado para copiar el original" else "Tap to copy · Hold to copy the original",Modifier.fillMaxWidth().padding(horizontal=8.dp,vertical=4.dp).testTag("device_details_copy_hint"),style=MaterialTheme.typography.labelSmall,color=MaterialTheme.colorScheme.onSurfaceVariant)\n                    }\n                    item(key = "inventory_notice") {')
          channel='''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.unit.dp
          @Composable internal fun DeviceConsoleChannelStatus(phase:String,connected:Boolean,onReconnect:()->Unit) {
              val es=LocalConfiguration.current.locales[0].language=="es"
              fun t(a:String,b:String)=if(es) a else b
              Row(Modifier.fillMaxWidth().testTag("agent_console_status_row"),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                  Text(when(phase) {
                      "connecting","checking"->t("Verificando canal, agente y permiso de consola…","Verifying channel, agent and console permission…")
                      "checking_send"->t("Reverificando antes de enviar…","Rechecking before sending…")
                      "ready"->t("Canal verificado","Channel verified")
                      else->t("Consola desconectada","Console disconnected")
                  },style=MaterialTheme.typography.bodySmall,modifier=Modifier.weight(1f).testTag("agent_console_status"))
                  if(phase=="closed") TextButton(enabled=connected,onClick=onReconnect,modifier=Modifier.heightIn(min=48.dp).testTag("agent_console_reconnect")) {Text(t("Reconectar","Reconnect"))}
              }
          }
          '''
          ui='''package iecxiv.meshfabric.ui.management
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.semantics.SemanticsActions
          import androidx.compose.ui.text.TextLayoutResult
          import androidx.compose.ui.text.font.FontWeight
          import androidx.test.platform.app.InstrumentationRegistry
          import iecxiv.meshfabric.R
          import iecxiv.meshfabric.data.model.MeshNode
          import iecxiv.meshfabric.ui.devices.*
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          class FourVisualCorrectionsTest {
              @get:Rule val rule=createComposeRule()
              @Test fun groupTabsRemainPinnedWhileSwitchingAndScrolling() {
                  val tab=mutableIntStateOf(0)
                  rule.setContent {MaterialTheme {CompositionLocalProvider(LocalPinnedSubviewHeader provides {
                      Box(Modifier.fillMaxWidth().testTag("group_tabs")) {DeviceGroupDetailsTabs(tab.intValue) {tab.intValue=it}}
                  }) {ProfileUserDetailSurface(true,{},title={Text("Group")},text={
                      assertNull(LocalPinnedSubviewHeader.current)
                      Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState())) {repeat(if(tab.intValue==1) 80 else 1) {Text("Line $it",Modifier.testTag("group_line_$it"))}}
                  },confirmButton={TextButton(onClick={},modifier=Modifier.testTag("group_footer")) {Text("Refresh")}},dismissButton={})}}}
                  val top=rule.onNodeWithTag("group_tabs").fetchSemanticsNode().boundsInRoot.top
                  val footer=rule.onNodeWithTag("group_footer").fetchSemanticsNode().boundsInRoot.top
                  rule.onNode(hasText("Devices") or hasText("Dispositivos")).performClick()
                  rule.onNodeWithTag("group_line_79").performScrollTo().assertIsDisplayed()
                  assertEquals(top,rule.onNodeWithTag("group_tabs").fetchSemanticsNode().boundsInRoot.top,2f)
                  rule.onNode(hasText("Access") or hasText("Accesos")).performClick()
                  assertEquals(top,rule.onNodeWithTag("group_tabs").fetchSemanticsNode().boundsInRoot.top,2f)
                  rule.onNode(hasText("Summary") or hasText("Resumen")).performClick()
                  assertEquals(top,rule.onNodeWithTag("group_tabs").fetchSemanticsNode().boundsInRoot.top,2f)
                  assertEquals(footer,rule.onNodeWithTag("group_footer").fetchSemanticsNode().boundsInRoot.top,2f)
              }
              @Test fun eventTitleAndIconShareOneRowWithStandardTypography() {
                  val event=ServerEventRecord("manual","Event","user","node//a","Device",1800000000000L)
                  rule.setContent {MaterialTheme {ServerEventDetailsDialog(event) {}}}
                  rule.onNode(isDialog()).assertExists()
                  val icon=rule.onNodeWithTag("event_details_title_icon").fetchSemanticsNode().boundsInRoot
                  val title=rule.onNodeWithTag("event_details_title_text").fetchSemanticsNode().boundsInRoot
                  assertEquals(icon.center.y,title.center.y,2f)
                  assertTrue(icon.right<=title.left)
                  val label=InstrumentationRegistry.getInstrumentation().targetContext.getString(R.string.log_detail_title)
                  val layouts=mutableListOf<TextLayoutResult>()
                  rule.onNodeWithText(label).performSemanticsAction(SemanticsActions.GetTextLayoutResult) {it(layouts)}
                  assertEquals(18f,layouts.single().layoutInput.style.fontSize.value,0.01f)
                  assertEquals(FontWeight.Bold,layouts.single().layoutInput.style.fontWeight)
              }
              @Test fun connectedConsoleHasNoInvisibleButtonOrReservedRowHeight() {
                  val phase=mutableStateOf("ready");var reconnect=0
                  rule.setContent {MaterialTheme {DeviceConsoleChannelStatus(phase.value,true) {reconnect++}}}
                  val row=rule.onNodeWithTag("agent_console_status_row").fetchSemanticsNode().boundsInRoot
                  val text=rule.onNodeWithTag("agent_console_status").fetchSemanticsNode().boundsInRoot
                  assertEquals(text.height,row.height,2f)
                  rule.onNodeWithTag("agent_console_reconnect").assertDoesNotExist()
                  rule.runOnIdle {phase.value="closed"}
                  rule.onNodeWithTag("agent_console_reconnect").assertIsDisplayed().performClick()
                  rule.runOnIdle {assertEquals(1,reconnect)}
              }
              @Test fun copyHintAppearsBelowDeviceDetailsDivider() {
                  rule.setContent {MaterialTheme {CompositionLocalProvider(LocalDeviceDetailsInline provides true) {DeviceDetailsDialog(MeshNode(id="node//a",name="Device")) {}}}}
                  val divider=rule.onNodeWithTag("device_details_header_divider").fetchSemanticsNode().boundsInRoot
                  val hint=rule.onNodeWithTag("device_details_copy_hint").fetchSemanticsNode().boundsInRoot
                  assertTrue(hint.top>=divider.bottom)
                  rule.onNodeWithTag("device_details_copy_hint").assertIsDisplayed()
              }
          }
          '''
          new={'app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceConsoleChannelStatus.kt':channel,'app/src/androidTest/java/iecxiv/meshfabric/ui/management/FourVisualCorrectionsTest.kt':ui}
          for name,content in new.items():
              p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content);paths.append(name)
          expected=set(paths)
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert actual==expected,(actual,expected)
          Path(os.environ['RUNNER_TEMP'],'four-visual-corrections-paths.json').write_text(json.dumps(sorted(expected)))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Full build unit and lint validation
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute visual corrections and unified layout regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.FourVisualCorrectionsTest,iecxiv.meshfabric.ui.management.UnifiedSubviewLayoutTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-visual-corrections-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/four-visual-corrections-paths.json
          if-no-files-found: ignore
      - name: Publish fully validated corrections and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'four-visual-corrections-paths.json').read_text())
          names=['management/ProfileUserDetailSurface.kt','management/CompactProfileGroups.kt','management/ServerEventDetails.kt','devices/DeviceAgentConsoleScreen.kt','devices/DeviceDetailsDialog.kt','devices/DeviceConsoleChannelStatus.kt']
          expected={'app/src/main/java/iecxiv/meshfabric/ui/'+name for name in names}|{'app/src/androidTest/java/iecxiv/meshfabric/ui/management/FourVisualCorrectionsTest.kt'}
          assert set(paths)==expected
          assert set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())==expected
          workflow='.github/workflows/four-visual-corrections.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(ui): pin group tabs align event title compact console status and move copy hint'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
