name: Extract MeshCentral 1.3.1 device-group protocol reference
on:
  push:
    branches: [dev]
    paths: [.github/workflows/review-meshcentral-device-groups.yml]
permissions:
  contents: write
concurrency:
  group: review-meshcentral-device-groups-dev
  cancel-in-progress: false
jobs:
  extract-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ylianst/MeshCentral
          ref: f436143527458d56da0336ea3047c006703fb4e4
          path: .meshcentral-reference
          persist-credentials: false
      - name: Extract pinned server, web and CLI group references
        run: |
          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          UPSTREAM='f436143527458d56da0336ea3047c006703fb4e4'
          root=Path('.meshcentral-reference')
          out=Path('docs/reference/meshcentral-1.3.1-device-groups')
          if out.exists():raise RuntimeError('Reference directory already exists')
          if subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()!=UPSTREAM:raise RuntimeError('Wrong upstream commit')
          if json.loads((root/'package.json').read_text())['version']!='1.3.1':raise RuntimeError('Wrong upstream version')
          expected={'meshuser.js':'62d82550e2fa7ee66ffc55e4613cb57e8f9c2197','views/default.handlebars':'e0f9cfa2cf5bb5d9b760ec33903c8ab97db283d7','meshctrl.js':'e8b08ef66a251e03bece3bf40b12edf4474507dd'}
          sources={}
          for name,blob in expected.items():
              path=root/name
              if subprocess.check_output(['git','hash-object',str(path)],text=True).strip()!=blob:raise RuntimeError('Source hash mismatch: '+name)
              sources[name]=path.read_text().splitlines(keepends=True)
          def merge(ranges):
              result=[]
              for a,b in sorted(ranges):
                  if result and a<=result[-1][1]:result[-1]=(result[-1][0],max(b,result[-1][1]))
                  else:result.append((a,b))
              return result
          def cases(lines,wanted):
              found=[]
              for i,line in enumerate(lines):
                  if line.lstrip().startswith(('//','/*','*')):continue
                  indent=re.match(r'[ \t]*',line).group(0)
                  for match in re.finditer(r"""\bcase\s+(['"])([^'"]+)\1\s*:""",line):
                      name=match.group(2)
                      if name not in wanted:continue
                      sibling=re.compile('^'+re.escape(indent)+r'(?:case\s|default\s*:)')
                      end=next((j for j in range(i+1,len(lines)) if sibling.match(lines[j])),len(lines))
                      found.append((name,i,end))
              return found
          wanted={'addmeshuser','removemeshuser','editmesh','createmesh','deletemesh','usergroups','addusertousergroup','removeuserfromusergroup'}
          server=sources['meshuser.js']
          handlers=cases(server,wanted)
          blocks=[('server-constants','meshuser.js',0,min(130,len(server)))]
          blocks += [('server-'+name+'-'+str(a+1),'meshuser.js',a,b) for name,a,b in handlers]
          missing=wanted-{x[0] for x in handlers}
          fallback=[i for i,line in enumerate(server) if any(re.search(r'\b'+re.escape(name)+r'\b',line) for name in missing)]
          blocks += [('server-context-'+str(k+1),'meshuser.js',a,b) for k,(a,b) in enumerate(merge([(max(0,i-70),min(len(server),i+120)) for i in fallback]))]
          web=sources['views/default.handlebars']
          web_pattern=re.compile(r"""\baction\s*:\s*['"](?:addmeshuser|removemeshuser|editmesh)['"]|\bfunction\s+(?:p20showAddMeshUserDialog\w*|p20editmeshfeatures\w*|p20editmeshconsent\w*|p30removeMeshFromUser\w*|makeDeviceGroupRightsString)\b""")
          web_hits=[i for i,line in enumerate(web) if web_pattern.search(line)]
          blocks += [('web-context-'+str(k+1),'views/default.handlebars',a,b) for k,(a,b) in enumerate(merge([(max(0,i-160),min(len(web),i+180)) for i in web_hits]))]
          cli=sources['meshctrl.js']
          cli_hits=[i for i,line in enumerate(cli) if re.search(r"""\bcase\s+['"](?:addusertodevicegroup|removeuserfromdevicegroup|editdevicegroup)['"]""",line)]
          blocks += [('cli-context-'+str(k+1),'meshctrl.js',a,b) for k,(a,b) in enumerate(merge([(max(0,i-10),min(len(cli),i+130)) for i in cli_hits]))]
          if not web_hits or not cli_hits:raise RuntimeError('Required client anchors not found')
          outputs={};index=[]
          for label,name,a,b in blocks:
              text=''.join(str(i+1)+': '+sources[name][i].rstrip('\r\n')+'\n' for i in range(a,b))
              chunks=[text[i:i+5000] for i in range(0,len(text),5000)]
              files=[]
              for i,chunk in enumerate(chunks):
                  filename=label+'-'+str(i+1).zfill(2)+'.txt'
                  header='MeshCentral 1.3.1 | Apache-2.0 | Ylian Saint-Hilaire and contributors\nSource: '+name+' @ '+UPSTREAM+'\nSource lines: '+str(a+1)+'-'+str(b)+' | part '+str(i+1)+'/'+str(len(chunks))+' (may continue a source line)\n\n'
                  content=header+chunk
                  if len(content.encode())>24000:raise RuntimeError('Chunk exceeds reading budget')
                  outputs[filename]=content;files.append(filename)
              index.append({'label':label,'source':name,'first_line':a+1,'last_line':b,'parts':files})
          if sum(len(v.encode()) for v in outputs.values())>1200000:raise RuntimeError('Reference extraction too large')
          manifest={'repository':'Ylianst/MeshCentral','tag':'1.3.1','commit':UPSTREAM,'source_blobs':expected,'source_sha256':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in expected},'matched_case_labels':sorted({x[0] for x in handlers}),'case_labels_not_matched':sorted(missing),'server_fallback_anchor_lines':[i+1 for i in fallback],'web_anchor_lines':[i+1 for i in web_hits],'cli_anchor_lines':[i+1 for i in cli_hits],'blocks':index,'scope':'Static source excerpts for pending manual review. Unmatched labels do not establish absence of an endpoint. Context ranges may not include complete functions. No upstream code execution, server requests, membership changes or Android changes.'}
          license_path=root/'LICENSE'
          if not license_path.is_file():raise RuntimeError('Upstream LICENSE missing')
          outputs['LICENSE']=license_path.read_text()
          outputs['index.json']=json.dumps(manifest,indent=2,ensure_ascii=False)+'\n'
          outputs['README.md']='# MeshCentral 1.3.1 device-group protocol reference\n\nRead index.json for source hashes, line ranges and ordered parts. Manual review is still required before implementing writes. This extraction does not validate membership editing or any Android feature. Apache-2.0; see LICENSE. Original source: https://github.com/Ylianst/MeshCentral/tree/'+UPSTREAM+'\n'
          out.mkdir(parents=True)
          for name,content in outputs.items():(out/name).write_text(content)
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: meshcentral-1.3.1-device-group-reference
          path: docs/reference/meshcentral-1.3.1-device-groups/
          if-no-files-found: error
          retention-days: 7
      - name: Publish reference documents only
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- docs/reference/meshcentral-1.3.1-device-groups/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: extract pinned MeshCentral 1.3.1 device-group protocol reference'
          git push origin HEAD:dev
