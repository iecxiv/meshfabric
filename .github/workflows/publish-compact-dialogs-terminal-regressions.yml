name: Validate compact dialogs and terminal regressions
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-compact-dialogs-terminal-regressions.yml]
permissions:
  contents: write
concurrency:
  group: compact-direct-access-dev
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate guarded compact dialogs and terminal fixes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 51987f30cc168a3209a240f96a2122b337b567ea
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def checked(path,sha):
              p=Path(path)
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha,str(p)
              return p,p.read_text()
          def replace(s,old,new):
              assert s.count(old)==1,old
              return s.replace(old,new,1)
          _,workflow=checked('.github/workflows/publish-compact-direct-access-dialogs.yml','327699109cdd717db1abf13b1f939040976566cb')
          generator=workflow.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          generator='\n'.join(line[10:] for line in generator.splitlines())
          exec(compile(generator,'original-compact-generator','exec'),{})
          p,s=checked('app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBar.kt','2179deb0488da003bca04aab26f59c3deca61be0')
          s=replace(s,'maxOf(36.dp, with(LocalDensity.current) { 24.sp.toDp() } + 8.dp)','maxOf(48.dp, with(LocalDensity.current) { 24.sp.toDp() } + 24.dp)')
          s=replace(s,'.minimumInteractiveComponentSize().height(keyHeight).widthIn(min = 48.dp)','.minimumInteractiveComponentSize().heightIn(min = keyHeight).widthIn(min = 48.dp)')
          p.write_text(s)
          p,s=checked('app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalFocusWebViewTest.kt','1284c8213da82fcde743d51cb89a103edc491445')
          s=replace(s,'        lateinit var renderer: TerminalRenderSession','        lateinit var session: TerminalSession\n        lateinit var renderer: TerminalRenderSession')
          s=replace(s,'                val session = TerminalSession("synthetic-focus", MeshCentralClient(), scope)','                session = TerminalSession("synthetic-focus", MeshCentralClient(), scope)')
          anchor='            scenario.onActivity { assertTrue(renderer.requestTerminalFocus(false)) }'
          setup='''            scenario.onActivity {
                          assertFalse(session.connectionState.value)
                          assertFalse(renderer.requestTerminalFocus(false))
                          assertFalse(renderer.requestTerminalFocus(true))
                          val socket = object : okhttp3.WebSocket {
                              override fun request() = okhttp3.Request.Builder().url("https://example.invalid/").build()
                              override fun queueSize(): Long = 0L
                              override fun send(text: String): Boolean = true
                              override fun send(bytes: okio.ByteString): Boolean = true
                              override fun close(code: Int, reason: String?): Boolean = true
                              override fun cancel() {}
                          }
                          session.activeSocket = socket
                          TerminalSession::class.java.getDeclaredMethod("handleIncomingData", java.lang.Long.TYPE, okhttp3.WebSocket::class.java, String::class.java).apply { isAccessible = true }.invoke(session, 0L, socket, "c")
                          assertTrue(session.connectionState.value)
                      }
                      await("Connected renderer did not enable input") { state {
                          view.onCreateInputConnection(EditorInfo()) != null
                      } }
          '''
          setup='\n'.join(line[10:] if line.startswith('          ') else line for line in setup.splitlines())+'\n'
          s=replace(s,anchor,setup+anchor)
          s=replace(s,'scenario.onActivity { dialog?.dismiss(); if (created) renderer.destroy() }','scenario.onActivity { dialog?.dismiss(); if (created) { renderer.destroy(); session.closeSocketOnly() } }')
          p.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build execute unit tests compile instrumentation and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute targeted then complete Android Compose suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalFocusWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalKeyBarTest --no-daemon --stacktrace
            bash ./gradlew :app:connectedDebugAndroidTest --rerun-tasks --no-daemon --stacktrace
      - name: Print concrete failing test cases
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for folder in ['app/build/outputs/androidTest-results','app/build/test-results']:
              for report in Path(folder).rglob('*.xml'):
                  try: root=ET.parse(report).getroot()
                  except ET.ParseError: continue
                  for case in root.iter('testcase'):
                      for kind in ['failure','error']:
                          for failure in case.findall(kind):
                              print(case.get('classname'),case.get('name'),failure.get('message',''),(failure.text or '')[:12000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-terminal-validation-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish only validated sources to unchanged dev
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = dev
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}"
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/UserMeshAssignmentReview.kt','app/src/main/java/iecxiv/meshfabric/ui/management/UserMeshEditDialog.kt','app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyBar.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalFocusWebViewTest.kt'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==expected
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): compact direct dialogs and repair terminal layout and focus regressions'
          git push origin HEAD:dev
