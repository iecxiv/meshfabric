name: Repair compact appearance semantics and publish validated layout
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/repair-compact-appearance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compact-appearance-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover exact candidate and correct semantics receiver
        shell: python
        run: |
          from pathlib import Path
          import subprocess,textwrap
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          failed=Path('.github/workflows/compact-appearance.yml')
          repair='.github/workflows/repair-compact-appearance.yml'
          assert git('rev-parse','HEAD^')=='9e4c666b0eed44ac9dc659d3c8b9ee901c2ce6fd'
          assert git('diff','--name-only','HEAD^','HEAD')==repair
          assert git('hash-object',str(failed))=='d5ae7d3cc52215cae7ad72fdaf345b39867859a4'
          source=failed.read_text()
          marker='      - name: Prepare exact appearance layout candidate\n        shell: python\n        run: |\n'
          ending='      - run: git diff --check\n'
          assert source.count(marker)==source.count(ending)==1
          program=textwrap.dedent(source.split(marker,1)[1].split(ending,1)[0])
          replacements={
              "assert git('rev-parse','HEAD^')=='6936b035db7d15d4d2723540e99c274cb14d4885'":"assert git('rev-parse','HEAD^')=='9e4c666b0eed44ac9dc659d3c8b9ee901c2ce6fd'",
              "assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/compact-appearance.yml'":"assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/repair-compact-appearance.yml'",
              '.semantics { selected=chosen }':'.semantics { this.selected=chosen }'
          }
          for before,after in replacements.items():
              assert program.count(before)==1,before
              program=program.replace(before,after,1)
          exec(compile(program,str(failed)+' (corrected candidate)','exec'))
          generated=Path('app/src/main/java/iecxiv/meshfabric/ui/theme/AutomaticAppearance.kt').read_text()
          assert generated.count('.semantics { this.selected=chosen }')==1
          assert '.semantics { selected=chosen }' not in generated
          test=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearanceSelectorLayoutTest.kt')
          tests=test.read_text()
          index=tests.rfind('\n}')
          assert index>0 and tests[index:].strip()=='}'
          regression='''
              @Test fun menuReportsSelectedModeWithoutChangingIndex() {
                  render();choose(3)
                  compose.onNodeWithTag("appearance_mode_selector").performClick()
                  compose.onNodeWithTag("appearance_mode_option_3").assertIsSelected()
                  compose.onNodeWithTag("appearance_mode_option_0").assertIsNotSelected()
              }
          '''
          test.write_text(tests[:index]+regression+tests[index:])
          assert test.read_text().count('@Test fun ')==5
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build, compile UI tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-appearance-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish tested layout and retire both temporary workflows
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          code='app/src/main/java/iecxiv/meshfabric/ui/theme/AutomaticAppearance.kt'
          test='app/src/androidTest/java/iecxiv/meshfabric/ui/theme/AppearanceSelectorLayoutTest.kt'
          assert git('diff','--name-only')==code
          workflows=['.github/workflows/compact-appearance.yml','.github/workflows/repair-compact-appearance.yml']
          for path in workflows: Path(path).unlink()
          paths=[code,test]+workflows
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(settings): publish compact aligned appearance controls with correct semantics'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
