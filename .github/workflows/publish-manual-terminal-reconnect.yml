name: Validate and publish manual terminal reconnect
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-manual-terminal-reconnect.yml]
permissions:
  contents: write
concurrency:
  group: publish-manual-terminal-reconnect-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply reviewed patch with base guards
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          patch = gzip.decompress(base64.b64decode('')).decode()
          exec(compile(patch, '<reviewed-manual-terminal-reconnect-patch>', 'exec'))
          PY
      - name: Unit tests and debug build
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-terminal-reconnect-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Publish functional commit only on unchanged dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to overwrite newer work"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/TerminalOutputJournal.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalViewModel.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalRenderSession.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalManualReconnect.kt app/src/main/res/values/terminal_manual_reconnect.xml app/src/main/res/values-es/terminal_manual_reconnect.xml app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalReconnectGateTest.kt docs/terminal-manual-reconnect.md
          git commit -m 'fix: preserve terminal history and add isolated manual reconnect'
          git push origin HEAD:dev
