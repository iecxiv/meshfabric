name: Validate agent console menus
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/agent-console-menus.yml']
permissions:
  contents: write
concurrency:
  group: agent-console-menus-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare UI-only changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/devices')
          p=root/'DeviceAgentConsoleScreen.kt'
          u=root/'DeviceAgentCoreUploadAction.kt'
          assert git('hash-object',str(p))=='81a692030768db67ca385c3a462b33c20d0e97b8'
          assert git('hash-object',str(u))=='83a69d06493c777ef0f7746895c7dcc477674710'
          s=p.read_text()
          protected=s[s.index('        review?.let'):]
          def replace(old,new):
              global s
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          replace('import androidx.compose.material.icons.filled.MoreVert','import androidx.compose.material.icons.filled.*')
          replace('        var actions by remember {mutableStateOf(false)}','        var actions by remember {mutableStateOf(false)}\n        var coreUpload by remember {mutableStateOf(false)}')
          replace('IconButton(onClick={menu=true},','IconButton(onClick={actions=false;menu=true},')
          start=s.index('        if(actions) iecxiv.meshfabric.ui.components.AppAlertDialog')
          end=s.index('        review?.let',start)
          s=s[:start]+'        if(coreUpload) DeviceAgentCoreUploadDialog(source,nodeId,nodeName,es) {coreUpload=false}\n'+s[end:]
          submenu='''
                      if(actions) {
                          AgentConsoleAction.values().forEach {action->
                              val icon=when(action) {
                                  AgentConsoleAction.DEFAULT_CORE->Icons.Default.CloudUpload
                                  AgentConsoleAction.CLEAR_CORE->Icons.Default.Delete
                                  AgentConsoleAction.RECOVERY_CORE->Icons.Default.Build
                                  AgentConsoleAction.TINY_CORE->Icons.Default.Memory
                                  AgentConsoleAction.SOFT_DISCONNECT,AgentConsoleAction.HARD_DISCONNECT->Icons.Default.LinkOff
                                  AgentConsoleAction.RESTART_SERVICE->Icons.Default.Refresh
                                  AgentConsoleAction.FORCE_UPDATE->Icons.Default.SystemUpdateAlt
                              }
                              DropdownMenuItem(text={Text(agentActionLabel(action,es))},leadingIcon={Icon(icon,null,Modifier.size(20.dp))},enabled=actionEnabled(action),onClick={review=action;actions=false;menu=false},modifier=Modifier.testTag("agent_action_"+action.name.lowercase()))
                          }
                          DropdownMenuItem(text={Text(t("Cargar archivo de núcleo…","Upload a core file…"))},leadingIcon={Icon(Icons.Default.UploadFile,null,Modifier.size(20.dp))},enabled=connected && state.phase=="ready" && rights!=null && agentActionFullRights(rights) && agentCoreMainDomain(nodeId,actor),onClick={coreUpload=true;actions=false;menu=false},modifier=Modifier.testTag("agent_action_upload_core_file"))
                      } else {
          '''
          replace('                DropdownMenu(menu,{menu=false}) {','''                DropdownMenu(expanded=menu,onDismissRequest={menu=false;actions=false},
                      modifier=Modifier.heightIn(max=(LocalConfiguration.current.screenHeightDp.dp-96.dp).coerceAtLeast(48.dp)).testTag("agent_console_tools_popup"),
                      shape=MaterialTheme.shapes.medium,containerColor=MaterialTheme.colorScheme.surfaceVariant,
                      tonalElevation=2.dp,border=androidx.compose.foundation.BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {'''+submenu)
          replace('onClick={actions=true;menu=false}','onClick={actions=true}')
          pairs=[('Acciones del agente…','Agent actions…','Settings'),('Filtrar salida local','Filter local output','FilterList'),('Copiar salida visible','Copy visible output','ContentCopy'),('Limpiar salida local','Clear local output','DeleteSweep'),('Reconectar consola','Reconnect console','Refresh'),('Desconectar consola local','Disconnect local console','LinkOff')]
          for es,en,icon in pairs:
              old=f'DropdownMenuItem(text={{Text(t("{es}","{en}"))}},'
              extra='trailingIcon={Icon(Icons.Default.ChevronRight,null,Modifier.size(20.dp))},' if icon=='Settings' else ''
              replace(old,old+f'leadingIcon={{Icon(Icons.Default.{icon},null,Modifier.size(20.dp))}},'+extra)
          replace('                }\n            }})}) {padding','                    }\n                }\n            }})}) {padding')
          replace('Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(6.dp)) {','Row(Modifier.fillMaxWidth(),verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(6.dp)) {')
          replace('TextButton(onClick={history=true},enabled=state.history.isNotEmpty())','TextButton(onClick={history=true},enabled=state.history.isNotEmpty(),modifier=Modifier.heightIn(min=48.dp).testTag("agent_console_history"))')
          replace('modifier=Modifier.testTag("agent_console_send")','modifier=Modifier.heightIn(min=48.dp).testTag("agent_console_send")')
          assert s[s.index('        review?.let'):]==protected
          assert 'if(actions) iecxiv.meshfabric.ui.components.AppAlertDialog' not in s
          p.write_text(s)
          text=u.read_text()
          old='@Composable private fun DeviceAgentCoreUploadDialog('
          assert text.count(old)==1
          u.write_text(text.replace(old,'@Composable internal fun DeviceAgentCoreUploadDialog(',1))
          assert set(git('diff','--name-only').splitlines())=={str(p),str(u)}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-console-menu-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated UI and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/agent-console-menus.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentConsoleScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentCoreUploadAction.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(agent-console): theme menus add action submenu and center input controls'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
