name: Verify and publish terminal echo fix
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-echo-fix.yml]
permissions:
  contents: write
concurrency:
  group: terminal-echo-fix
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 618474803666456a20a664038076e0c0748fdb21 HEAD
          git diff --exit-code 618474803666456a20a664038076e0c0748fdb21 HEAD -- . ':(exclude).github/workflows/terminal-echo-fix.yml'
      - name: Restrict handshake classification to initial connection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          relay = Path('app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt')
          old = '        if (data == "c" || data == "cr" || data == "1") {'
          new = '        if (TerminalHandshakePolicy.shouldHandle(data, handshakeComplete)) {'
          source = relay.read_text(encoding='utf-8')
          if source.count(old) != 1:
              raise RuntimeError('Reviewed handshake condition changed; refusing to overwrite')
          policy = Path('app/src/main/java/iecxiv/meshfabric/data/remote/TerminalHandshakePolicy.kt')
          tests = Path('app/src/test/java/iecxiv/meshfabric/data/remote/TerminalHandshakePolicyTest.kt')
          if policy.exists() or tests.exists():
              raise RuntimeError('New target already exists')
          policy.write_text('package iecxiv.meshfabric.data.remote\n\ninternal object TerminalHandshakePolicy {\n    fun shouldHandle(data: String, completed: Boolean): Boolean =\n        !completed && (data == "c" || data == "cr" || data == "1")\n}\n', encoding='utf-8')
          tests.parent.mkdir(parents=True, exist_ok=True)
          tests.write_text('package iecxiv.meshfabric.data.remote\n\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass TerminalHandshakePolicyTest {\n    @Test fun initialCStartsHandshake() { assertTrue(TerminalHandshakePolicy.shouldHandle("c", false)) }\n    @Test fun initialCrStartsHandshake() { assertTrue(TerminalHandshakePolicy.shouldHandle("cr", false)) }\n    @Test fun initialOneKeepsExistingCompatibility() { assertTrue(TerminalHandshakePolicy.shouldHandle("1", false)) }\n    @Test fun connectedCIsOutput() { assertFalse(TerminalHandshakePolicy.shouldHandle("c", true)) }\n    @Test fun connectedCrIsOutput() { assertFalse(TerminalHandshakePolicy.shouldHandle("cr", true)) }\n    @Test fun connectedOneIsOutput() { assertFalse(TerminalHandshakePolicy.shouldHandle("1", true)) }\n    @Test fun normalTextIsNotHandshake() {\n        for (text in listOf("", "cat", "C", "crx", "11")) {\n            assertFalse(TerminalHandshakePolicy.shouldHandle(text, false))\n            assertFalse(TerminalHandshakePolicy.shouldHandle(text, true))\n        }\n    }\n    @Test fun markersAreOnlyRecognizedBeforeCompletion() {\n        for (text in listOf("c", "cr", "1")) {\n            assertTrue(TerminalHandshakePolicy.shouldHandle(text, false))\n            assertFalse(TerminalHandshakePolicy.shouldHandle(text, true))\n        }\n    }\n}\n', encoding='utf-8')
          relay.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing JavaScript regression tests
        run: node app/src/test/js/terminal-runtime.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run all unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified echo fix
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-echo-fix.yml
          git add -- app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/TerminalHandshakePolicy.kt app/src/test/java/iecxiv/meshfabric/data/remote/TerminalHandshakePolicyTest.kt .github/workflows/terminal-echo-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve c cr and 1 output after terminal handshake'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload tests and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-echo-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
