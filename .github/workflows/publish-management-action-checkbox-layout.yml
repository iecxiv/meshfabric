name: Validate compact management actions and checkbox alignment
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-management-action-checkbox-layout.yml]
permissions:
  contents: write
concurrency:
  group: management-action-checkbox-layout
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate presentation-only changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f778d15c66696627912324b904c8d01078dc4821
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path
          import re,json,subprocess
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          changed=[];audit=[]
          pattern=re.compile(r'\bRow\s*\{(?=\s*Checkbox\s*\()')
          for p in sorted(root.glob('*.kt')):
              old=p.read_text()
              new,count=pattern.subn('ProfileAlignedCheckboxRow {',old)
              if count:
                  p.write_text(new);changed.append(str(p));audit.append(f'{p.name}: {count} checkbox rows aligned')
          required={'GroupMeshGrantDialog.kt','GroupMeshEditDialog.kt','UserMeshGrantDialog.kt','UserMeshEditDialog.kt','DeviceGroupAdvancedEditor.kt','UserMeshAssignmentReview.kt'}
          assert required<={Path(p).name for p in changed},audit
          p=root/'UserAdministration.kt';s=p.read_text()
          for anchor in ['for(g in directGroups) ManagementCard {','for(group in common) ManagementCard {','for(node in common.take(100)) ManagementCard {']:
              assert s.count(anchor)==1,anchor
              s=s.replace(anchor,anchor.replace('ManagementCard','ProfileActionCard'),1)
          runs=re.compile(r'(?m)(?:^ProfileGroupActionButton[^\n]*\n){2,}')
          s,count=runs.subn(lambda m:'ProfileActionGroup {\n'+m.group(0)+'}\n',s)
          assert count>=2,count
          for label in ['Revisar acceso directo','Editar derechos directos','Abrir ficha','Cambiar contraseña','Restablecer MFA']:
              assert label in s,label
          p.write_text(s)
          if str(p) not in changed: changed.append(str(p))
          p=root/'ProfileCompactActionLayout.kt';assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          @Composable internal fun ProfileAlignedCheckboxRow(content:@Composable RowScope.()->Unit) {
              Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,content=content)
          }
          @Composable internal fun ProfileActionGroup(content:@Composable ColumnScope.()->Unit) {
              Column(Modifier.fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(0.dp),content=content)
          }
          @Composable internal fun ProfileActionCard(content:@Composable ColumnScope.()->Unit) {
              Surface(Modifier.fillMaxWidth(),shape=MaterialTheme.shapes.medium,color=MaterialTheme.colorScheme.surface,border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant)) {
                  Column(Modifier.padding(horizontal=12.dp,vertical=8.dp),verticalArrangement=Arrangement.spacedBy(0.dp),content=content)
              }
          }
          ''');changed.append(str(p))
          p=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management/ProfileCompactActionLayoutTest.kt');assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Security
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.compose.ui.unit.Density
          import androidx.compose.ui.unit.dp
          import org.junit.Assert.assertEquals
          import org.junit.Rule
          import org.junit.Test
          class ProfileCompactActionLayoutTest {
              @get:Rule val compose=createComposeRule()
              private fun alignment(scale:Float) {
                  val checked=mutableStateOf(false)
                  compose.setContent {val density=LocalDensity.current
                      CompositionLocalProvider(LocalDensity provides Density(density.density,scale)) {MaterialTheme {
                          Column(Modifier.width(240.dp)) {ProfileAlignedCheckboxRow {
                              Checkbox(checked.value,{checked.value=it},modifier=Modifier.testTag("check"))
                              Text("Permission and restriction description with several lines",Modifier.weight(1f).testTag("label"))
                          }}
                      }}
                  }
                  val control=compose.onNodeWithTag("check").fetchSemanticsNode().boundsInRoot
                  val text=compose.onNodeWithTag("label").fetchSemanticsNode().boundsInRoot
                  assertEquals(text.center.y,control.center.y,1f)
                  compose.onNodeWithTag("check").assertHeightIsAtLeast(48.dp).performClick().assertIsOn()
              }
              @Test fun normalTextCheckboxAlignment()=alignment(1f)
              @Test fun enlargedMultilineCheckboxAlignment()=alignment(1.8f)
              @Test fun actionsHaveNoExtraGapsAndKeepTouchTargets() {
                  var clicks=0
                  compose.setContent {MaterialTheme {Column(Modifier.width(300.dp)) {ProfileActionCard {
                      Text("Device group",Modifier.testTag("identity"))
                      ProfileActionGroup {
                          ProfileGroupActionButton("Review direct access",Icons.Default.Security,true,onClick={clicks++})
                          ProfileGroupActionButton("Edit direct rights",Icons.Default.Security,false,onClick={error("Disabled action")})
                      }
                  }}}}
                  val actions=compose.onAllNodesWithTag("profile-group-action")
                  actions[0].assertHeightIsAtLeast(48.dp)
                  actions[1].assertHeightIsAtLeast(48.dp).assertIsNotEnabled()
                  val identity=compose.onNodeWithTag("identity").fetchSemanticsNode().boundsInRoot
                  val first=actions[0].fetchSemanticsNode().boundsInRoot
                  val second=actions[1].fetchSemanticsNode().boundsInRoot
                  assertEquals(identity.bottom,first.top,1f)
                  assertEquals(first.bottom,second.top,1f)
                  actions[0].performClick()
                  compose.runOnIdle {assertEquals(1,clicks)}
              }
          }
          ''');changed.append(str(p))
          Path('validation/expected.json').write_text(json.dumps(sorted(changed)))
          Path('validation/layout-audit.txt').write_text('\n'.join(audit)+f'\nCompact consecutive action groups: {count}\n')
          print('\n'.join(audit))
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build execute unit tests compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute all Android Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Require complete Android test evidence
        if: always()
        run: |
          mkdir -p validation
          git diff > validation/presentation.diff
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[];failures=[];skipped=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  name=case.get('classname','')+'.'+case.get('name','');cases.append(name)
                  if case.find('skipped') is not None: skipped.append(name)
                  for kind in ['failure','error']:
                      for error in case.findall(kind): failures.append(name+'\n'+error.get('message','')+'\n'+(error.text or ''))
          required={'ProfileCompactActionLayoutTest','ManagementConnectionSpacingTest','UserMeshAssignmentReviewTest','UserMeshEditDialogTest','TerminalFocusWebViewTest','TerminalKeyBarTest'}
          missing=required-{n.rsplit('.',2)[-2] for n in cases}
          text=f'Cases: {len(cases)}; failures: {len(failures)}; skipped: {len(skipped)}; missing: {sorted(missing)}\n'+'\n\n'.join(failures)
          Path('validation/results.txt').write_text(text);print(text)
          assert cases and not failures and not skipped and not missing
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-layout-evidence-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: management-layout-validated-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish only on unchanged dev
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = dev
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected=json.loads(Path('validation/expected.json').read_text())
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(management): compact user action cards and align checkbox labels'
          git push origin HEAD:dev
