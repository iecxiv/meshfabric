name: Verify terminal focus and IME
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-focus-ime.yml]
permissions:
  contents: write
concurrency:
  group: terminal-focus-ime
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 8d3e345fb23c459cc2d57b46c52035d13c4d8777 HEAD
          git diff --exit-code 8d3e345fb23c459cc2d57b46c52035d13c4d8777 HEAD -- . ':(exclude).github/workflows/terminal-focus-ime.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focus-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = 'app/src/main/java/iecxiv/meshfabric/ui/terminal/'
          view = r'''    private val focusRequests = TerminalFocusRequests()
              private var focusBlocked = false
              private val webView = object : WebView(wrapper) {
                  override fun onWindowFocusChanged(hasWindowFocus: Boolean) {
                      super.onWindowFocusChanged(hasWindowFocus)
                      if (!hasWindowFocus) focusRequests.cancel()
                      else post { applyPendingFocus() }
                  }
                  override fun onCreateInputConnection(info: android.view.inputmethod.EditorInfo): android.view.inputmethod.InputConnection? {
                      val connection = super.onCreateInputConnection(info)
                      info.imeOptions = info.imeOptions or android.view.inputmethod.EditorInfo.IME_FLAG_NO_EXTRACT_UI or
                          android.view.inputmethod.EditorInfo.IME_FLAG_NO_FULLSCREEN or
                          android.view.inputmethod.EditorInfo.IME_FLAG_NO_PERSONALIZED_LEARNING
                      return connection
                  }
              }'''
          methods = r'''    private fun focusAllowed(): Boolean = !isDestroyed && ready && isAttached && resumed &&
                  !focusBlocked && failure.value == null

              private fun hideIme() {
                  val token = webView.windowToken ?: return
                  val manager = appContext.getSystemService(Context.INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager
                  manager.hideSoftInputFromWindow(token, 0)
              }
              fun setFocusBlocked(value: Boolean) {
                  checkMainThread()
                  if (isDestroyed || focusBlocked == value) return
                  focusBlocked = value
                  if (value) {
                      focusRequests.cancel()
                      if (isAttached && resumed) {
                          hideIme()
                          webView.clearFocus()
                          if (ready) webView.evaluateJavascript("window.blurTerminal();", null)
                      }
                  }
              }
              fun requestTerminalFocus(showKeyboard: Boolean): Boolean {
                  checkMainThread()
                  if (!focusAllowed()) { focusRequests.cancel(); return false }
                  focusRequests.request(showKeyboard)
                  applyPendingFocus()
                  return true
              }
              private fun applyPendingFocus() {
                  if (!focusAllowed() || !webView.hasWindowFocus()) return
                  val ticket = focusRequests.take() ?: return
                  if (!webView.requestFocus()) return
                  webView.evaluateJavascript("window.focusTerminal();") { result ->
                      if (result != "true") return@evaluateJavascript
                      webView.post {
                          if (!focusRequests.isCurrent(ticket) || !focusAllowed() || !webView.hasWindowFocus()) return@post
                          if (ticket.showKeyboard) {
                              val manager = appContext.getSystemService(Context.INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager
                              manager.showSoftInput(webView, 0)
                          } else hideIme()
                      }
                  }
              }
              fun toggleKeyboard() {
                  checkMainThread()
                  if (!focusAllowed()) return
                  val visible = androidx.core.view.ViewCompat.getRootWindowInsets(webView)
                      ?.isVisible(androidx.core.view.WindowInsetsCompat.Type.ime()) == true
                  if (visible) { focusRequests.cancel(); hideIme() }
                  else requestTerminalFocus(true)
              }
              private fun fitView() {
                  if (isDestroyed || !isAttached || failure.value != null) return
                  webView.evaluateJavascript("window.fitTerminal();", null)
              }
          '''
          old_fit = r'''    private fun fitAndFocus() {
                  if (isDestroyed || !isAttached || failure.value != null) return
                  webView.requestFocus()
                  webView.evaluateJavascript("window.fitTerminal(); window.focusTerminal();", null)
              }
          '''
          focus_js = r'''  window.focusTerminal = function () {
              if (!term || failed || disposed) return false;
              term.focus();
              return true;
            };
            window.blurTerminal = function () { if (term && !failed && !disposed) term.blur(); };'''
          effects = r'''    var keyboardRequest by remember(renderer) { mutableStateOf(0) }
              var previousOverlay by remember(renderer) { mutableStateOf(false) }
              val inputOverlay = showTerminalMenu || showCopyDialog || showPasteDialog || showCommandDialog || showRecoveryDialog
              LaunchedEffect(renderer, inputOverlay) {
                  renderer.setFocusBlocked(inputOverlay)
                  if (!inputOverlay && previousOverlay) renderer.requestTerminalFocus(false)
                  previousOverlay = inputOverlay
              }
              LaunchedEffect(renderer, keyboardRequest) {
                  if (keyboardRequest > 0 && !inputOverlay) renderer.toggleKeyboard()
              }
              DisposableEffect(renderer) {
                  onDispose { renderer.setFocusBlocked(true) }
              }

          '''
          menu_anchor = r'''                            DropdownMenuItem(
                                          text = { Text(stringResource(R.string.terminal_paste_edit_title)) },
                                          enabled = connectionStatus == TerminalConnectionStatus.CONNECTED,
                                          onClick = { openPaste(true) }
                                      )
          '''
          menu = r'''                            DropdownMenuItem(
                                          text = { Text(stringResource(R.string.send_command)) },
                                          onClick = { showTerminalMenu = false; showCommandDialog = true }
                                      )
          '''
          edits = {
              p + 'TerminalRenderSession.kt': [
                  ('    private val webView = WebView(wrapper)', view),
                  ('        val token = visibility.attach()\n        resumed = false\n        updateAckActivity()', '        val token = visibility.attach()\n        resumed = false\n        focusRequests.cancel()\n        updateAckActivity()'),
                  ('        resumed = value\n', '        resumed = value\n        if (!value) focusRequests.cancel()\n'),
                  ('        if (!visibility.release(token)) return\n        resumed = false\n', '        if (!visibility.release(token)) return\n        resumed = false\n        focusRequests.cancel()\n'),
                  ('        if (ready) fitAndFocus()', '        if (ready) fitView()'),
                  ('                    fitAndFocus()', '                    fitView()'),
                  ('        if (!lease.release(token)) return\n', r'''        if (!lease.release(token)) return
                  focusRequests.cancel()
                  if (webView.hasFocus()) hideIme()
                  webView.clearFocus()
                  if (!isDestroyed && ready) webView.evaluateJavascript("window.blurTerminal();", null)
          '''),
                  (old_fit, methods),
                  ('        isDestroyed = true\n', '        focusRequests.cancel()\n        if (isAttached && webView.hasFocus()) hideIme()\n        isDestroyed = true\n')
              ],
              'app/src/main/assets/terminal/terminal-runtime.js': [
                  ('  window.focusTerminal = function () { if (term && !failed && !disposed) term.focus(); };', focus_js)
              ],
              p + 'TerminalScreen.kt': [
                  ('    fun changeFontSize(delta: Int) { renderer.changeFontSize(delta) }\n', effects + '    fun changeFontSize(delta: Int) { renderer.changeFontSize(delta) }\n'),
                  ('                        onClick = { showCommandDialog = true },\n                        modifier = Modifier.size(36.dp)\n', '                        onClick = { keyboardRequest++ },\n                        enabled = rendererError == null && connectionStatus == TerminalConnectionStatus.CONNECTED && !inputOverlay,\n                        modifier = Modifier.size(36.dp)\n'),
                  ('Icon(Icons.Default.Keyboard, contentDescription = "Enviar Comando")', 'Icon(Icons.Default.Keyboard, contentDescription = stringResource(R.string.terminal_keyboard_toggle))'),
                  (menu_anchor, menu_anchor + menu)
              ]
          }
          newfiles = {}
          newfiles[p + 'TerminalFocusRequests.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          internal class TerminalFocusRequests {
              data class Ticket(val generation: Long, val showKeyboard: Boolean)
              private var generation = 0L
              private var pending: Ticket? = null
              fun request(showKeyboard: Boolean) { pending = Ticket(++generation, showKeyboard) }
              fun cancel() { generation++; pending = null }
              fun take(): Ticket? = pending.also { pending = null }
              fun isCurrent(ticket: Ticket): Boolean = ticket.generation == generation
          }
          '''
          newfiles['app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalFocusRequestsTest.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          import org.junit.Assert.*
          import org.junit.Test

          class TerminalFocusRequestsTest {
              @Test fun noAutomaticInitialRequest() { assertNull(TerminalFocusRequests().take()) }
              @Test fun restoreDoesNotRequestKeyboard() {
                  val requests = TerminalFocusRequests(); requests.request(false)
                  assertFalse(requests.take()!!.showKeyboard)
              }
              @Test fun explicitRequestCanShowKeyboard() {
                  val requests = TerminalFocusRequests(); requests.request(true)
                  assertTrue(requests.take()!!.showKeyboard)
              }
              @Test fun consumedOnce() {
                  val requests = TerminalFocusRequests(); requests.request(true)
                  assertNotNull(requests.take()); assertNull(requests.take())
              }
              @Test fun cancelDropsPending() {
                  val requests = TerminalFocusRequests(); requests.request(true); requests.cancel()
                  assertNull(requests.take())
              }
              @Test fun cancelInvalidatesCallback() {
                  val requests = TerminalFocusRequests(); requests.request(true); val ticket = requests.take()!!
                  requests.cancel(); assertFalse(requests.isCurrent(ticket))
              }
              @Test fun newerRequestInvalidatesCallback() {
                  val requests = TerminalFocusRequests(); requests.request(true); val old = requests.take()!!
                  requests.request(false); val current = requests.take()!!
                  assertFalse(requests.isCurrent(old)); assertTrue(requests.isCurrent(current)); assertFalse(current.showKeyboard)
              }
          }
          '''
          newfiles['app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalFocusWebViewTest.kt'] = r'''package iecxiv.meshfabric.ui.terminal

          import android.app.Dialog
          import android.view.inputmethod.EditorInfo
          import android.webkit.WebView
          import android.widget.TextView
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.test.core.app.ActivityScenario
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import iecxiv.meshfabric.data.remote.TerminalSession
          import kotlinx.coroutines.*
          import org.junit.Assert.*
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          @RunWith(AndroidJUnit4::class)
          class TerminalFocusWebViewTest {
              @Test fun explicitKeyboardAndDialogFocusAreLifecycleSafe() {
                  val scenario = ActivityScenario.launch(TerminalEchoTestActivity::class.java)
                  val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)
                  lateinit var renderer: TerminalRenderSession
                  lateinit var view: WebView
                  var attachment = -1L
                  var visibility = -1L
                  var dialog: Dialog? = null
                  var created = false
                  fun state(check: () -> Boolean): Boolean {
                      var value = false
                      scenario.onActivity { value = check() }
                      return value
                  }
                  fun await(message: String, check: () -> Boolean) {
                      val until = android.os.SystemClock.uptimeMillis() + 20000
                      while (android.os.SystemClock.uptimeMillis() < until) {
                          if (check()) return
                          android.os.SystemClock.sleep(50)
                      }
                      fail(message)
                  }
                  fun domFocused(): Boolean {
                      val latch = CountDownLatch(1)
                      var focused = false
                      scenario.onActivity {
                          view.evaluateJavascript("!!document.activeElement && document.activeElement.classList.contains('xterm-helper-textarea');") {
                              focused = it == "true"; latch.countDown()
                          }
                      }
                      assertTrue(latch.await(10, TimeUnit.SECONDS))
                      return focused
                  }
                  fun imeVisible(): Boolean = state { ViewCompat.getRootWindowInsets(view)?.isVisible(WindowInsetsCompat.Type.ime()) == true }
                  try {
                      scenario.onActivity {
                          val session = TerminalSession("synthetic-focus", MeshCentralClient(), scope)
                          renderer = TerminalRenderSession(it, session, scope)
                          created = true
                          visibility = renderer.bindVisibility()
                          renderer.setResumed(visibility, true)
                          attachment = renderer.attach(it, it.host)
                          view = TerminalRenderSession::class.java.getDeclaredField("webView").apply { isAccessible = true }.get(renderer) as WebView
                      }
                      await("Renderer did not become ready") { state {
                          TerminalRenderSession::class.java.getDeclaredField("ready").apply { isAccessible = true }.getBoolean(renderer) && view.hasWindowFocus()
                      } }
                      assertFalse("Startup must not request terminal DOM focus", domFocused())
                      assertFalse("Startup must not open IME", imeVisible())
                      scenario.onActivity { assertTrue(renderer.requestTerminalFocus(false)) }
                      await("Restore failed") { domFocused() && !imeVisible() }
                      scenario.onActivity {
                          val info = EditorInfo()
                          assertNotNull(view.onCreateInputConnection(info))
                          assertTrue(info.imeOptions and EditorInfo.IME_FLAG_NO_EXTRACT_UI != 0)
                          assertTrue(info.imeOptions and EditorInfo.IME_FLAG_NO_FULLSCREEN != 0)
                          assertTrue(info.imeOptions and EditorInfo.IME_FLAG_NO_PERSONALIZED_LEARNING != 0)
                          renderer.setFocusBlocked(true)
                          dialog = Dialog(it).apply { setContentView(TextView(it).apply { text = "synthetic dialog" }); show() }
                      }
                      await("Dialog did not acquire window focus") { state { !view.hasWindowFocus() } }
                      scenario.onActivity { assertFalse(renderer.requestTerminalFocus(true)) }
                      scenario.onActivity {
                          renderer.setFocusBlocked(false)
                          assertTrue(renderer.requestTerminalFocus(false))
                          dialog!!.dismiss()
                          dialog = null
                      }
                      await("Focus did not return after dialog dismissal") { domFocused() && !imeVisible() }
                      scenario.onActivity { renderer.toggleKeyboard() }
                      await("Explicit keyboard request failed") { imeVisible() }
                      scenario.onActivity { renderer.toggleKeyboard() }
                      await("Keyboard did not hide") { !imeVisible() }
                      scenario.onActivity { renderer.changeFontSize(1); renderer.setResumed(visibility, false); renderer.setResumed(visibility, true) }
                      android.os.SystemClock.sleep(500)
                      assertFalse("Resize/resume reopened hidden keyboard", imeVisible())
                      scenario.onActivity {
                          renderer.setResumed(visibility, false)
                          assertFalse(renderer.requestTerminalFocus(true))
                          renderer.setResumed(visibility, true)
                          renderer.setFocusBlocked(true)
                          assertFalse(renderer.requestTerminalFocus(true))
                          renderer.setFocusBlocked(false)
                          renderer.detach(attachment)
                          assertFalse(renderer.requestTerminalFocus(true))
                      }
                  } finally {
                      scenario.onActivity { dialog?.dismiss(); if (created) renderer.destroy() }
                      scope.cancel()
                      scenario.close()
                  }
              }
          }
          '''
          for directory, value in [('values', 'Show/hide keyboard'), ('values-en', 'Show/hide keyboard'), ('values-es', 'Mostrar/ocultar teclado')]:
              newfiles['app/src/main/res/' + directory + '/terminal_focus.xml'] = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="terminal_keyboard_toggle">' + value + '</string>\n</resources>\n'
          newfiles['docs/terminal-focus-ime.md'] = r'''# Focus and keyboard only

          The top keyboard icon now explicitly shows/hides the terminal IME; the command editor remains available as a fourth tools-menu item. No terminal focus or IME request is issued by HTML readiness or WebView reattachment. Tapping the terminal retains existing xterm behavior. After closing menus/dialogs, restore terminal focus once without reopening the IME. Overlay windows block app-originated terminal focus requests, not paste transport.

          Focus requests are generation-tagged and consumed once. Window focus, attachment, readiness, resumed state and renderer health are checked again before asynchronous IME work. Blocking, backgrounding, window-focus loss, detach and destruction cancel stale requests. A request issued while another window is closing waits for window focus; there are no delayed polling/retry loops or automatic show-on-resume. Soft-keyboard visibility uses window insets, not a remembered toggle flag. No SHOW_FORCED.

          The native WebView InputConnection is preserved; only EditorInfo flags request no fullscreen/extract UI and no personalized learning. Providers may ignore flags. No text/key remapping, input echo, clipboard reads or input forwarding changes. No changes to scroll CSS, special-key layout, resize algorithm, versionName 1.1.1 or versionCode 1.

          CI adds seven JVM request-gate tests and a native renderer/WebView test covering initial no-auto-focus/IME, focus restore, real dialog window handoff, explicit show/hide, hidden IME after font update/resume, blocked/background/detached rejection and EditorInfo flags. Existing echo/copy/paste and touchscreen regressions also run. Device checks remain necessary for real copy/paste/command dialogs, Back dismissal, rotation, different IMEs, hardware keyboard, accents/emoji/composition and perceived layout. This does not claim universal IME compatibility.
          '''
          prepared = {}
          for name, replacements in edits.items():
              text = Path(name).read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Reviewed anchor mismatch: ' + name)
                  text = text.replace(old, new, 1)
              prepared[name] = text
          for name, text in newfiles.items():
              if Path(name).exists():
                  raise RuntimeError('New target already exists: ' + name)
              prepared[name] = text
          for text in prepared.values():
              text.encode('utf-8')
          for name, text in prepared.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          subprocess.run(['node', '--check', 'app/src/main/assets/terminal/terminal-runtime.js'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: JavaScript regressions
        run: |
          node app/src/test/js/terminal-runtime.test.js
          node app/src/test/js/terminal-selection.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native focus IME and existing WebView regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest,iecxiv.meshfabric.ui.terminal.TerminalFocusWebViewTest --no-daemon --stacktrace
      - name: Publish verified focus polish
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-focus-ime.yml
          git add -- app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalRenderSession.kt app/src/main/assets/terminal/terminal-runtime.js app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalScreen.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalFocusRequests.kt app/src/test/java/iecxiv/meshfabric/ui/terminal/TerminalFocusRequestsTest.kt app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalFocusWebViewTest.kt app/src/main/res/values/terminal_focus.xml app/src/main/res/values-en/terminal_focus.xml app/src/main/res/values-es/terminal_focus.xml docs/terminal-focus-ime.md .github/workflows/terminal-focus-ime.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: control terminal focus and soft keyboard explicitly'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload reports and debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-focus-ime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
