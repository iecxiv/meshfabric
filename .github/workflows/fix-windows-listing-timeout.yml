name: Windows listing transport fallback
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-windows-listing-timeout.yml']
permissions:
  contents: write
concurrency:
  group: windows-listing-transport
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add bounded read-only Windows listing retry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('app/src/main/java/iecxiv/meshfabric/data/remote')
          p = root/'FileRelayClient.kt'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '0cf333b6b7f995328e9229afbd5846c18dbb5d4b', 'File relay changed; review required'
          s = p.read_text()
          def once(old,new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old,new,1)
          once('    private val navigation = FileNavigationState()', '    private val navigation = FileNavigationState()\n    private val listingTextFallback = ListingTextFallback()')
          anchor = '                        if (isConnected() && navigation.pending != null && nowMs() - listingStarted >= 15_000L) {'
          once(anchor, '                        retryWindowsListingAsText()\n' + anchor)
          method = '\n'.join([
              '    private fun retryWindowsListingAsText() {',
              '        if (!isConnected() || !meshClient.connectionState.value || isUserDisconnect) return',
              '        val request = navigation.pending ?: return',
              '        val socket = webSocket ?: return',
              '        if (!listingTextFallback.claim(windowsFileSystem(), socketEpoch, request.id, nowMs() - listingStarted)) return',
              '        val packet = JsonObject().apply {',
              '            addProperty("action", "ls")',
              '            addProperty("path", WindowsDriveSupport.wire(request.path, true))',
              '            addProperty("reqid", request.id)',
              '        }',
              '        val queued = socket.send(packet.toString())',
              '        Log.d("MeshFilesDiag", "ls-text-fallback epoch=$socketEpoch reqid=${request.id} queued=$queued")',
              '        if (!queued) retireSocket()',
              '    }', '', ''])
          once('    private fun pumpListing() {', method + '    private fun pumpListing() {')
          p.write_text(s)
          helper = root/'ListingTextFallback.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.data.remote
          
          /** One read-only compatibility retry per pending listing and socket generation. */
          internal class ListingTextFallback {
              private var attempted: Pair<Long, Long>? = null
              fun claim(windows: Boolean, epoch: Long, requestId: Long, elapsedMs: Long): Boolean {
                  if (!windows || elapsedMs < 3000L) return false
                  val key = epoch to requestId
                  if (attempted == key) return false
                  attempted = key
                  return true
              }
          }
          ''')
          test = Path('app/src/test/java/iecxiv/meshfabric/data/remote/ListingTextFallbackTest.kt')
          assert not test.exists()
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.data.remote
          
          import org.junit.Assert.*
          import org.junit.Test
          
          class ListingTextFallbackTest {
              @Test fun waitsThreeSeconds() {
                  val retry = ListingTextFallback()
                  assertFalse(retry.claim(true,1L,1L,2999L))
                  assertTrue(retry.claim(true,1L,1L,3000L))
              }
              @Test fun neverRetriesOtherPlatforms() {
                  assertFalse(ListingTextFallback().claim(false,1L,1L,14000L))
              }
              @Test fun onlyOneRetryForPendingRequest() {
                  val retry = ListingTextFallback()
                  assertTrue(retry.claim(true,1L,1L,3000L))
                  assertFalse(retry.claim(true,1L,1L,8000L))
                  assertFalse(retry.claim(true,1L,1L,14000L))
              }
              @Test fun nextRequestCanRetryAfterItsOwnDelay() {
                  val retry = ListingTextFallback()
                  assertTrue(retry.claim(true,1L,1L,3000L))
                  assertFalse(retry.claim(true,1L,2L,200L))
                  assertTrue(retry.claim(true,1L,2L,3000L))
              }
              @Test fun newSocketGenerationIsIndependent() {
                  val retry = ListingTextFallback()
                  assertTrue(retry.claim(true,1L,1L,3000L))
                  assertTrue(retry.claim(true,3L,1L,3000L))
              }
              @Test fun duplicateListingCannotCompleteAnotherRequest() {
                  val navigation = FileNavigationState()
                  val first = navigation.next()!!
                  assertEquals("/",navigation.accept(first.id.toString(),"/"))
                  assertNull(navigation.accept(first.id.toString(),"/"))
                  navigation.request("C:/")
                  val next = navigation.next()!!
                  assertNull(navigation.accept(first.id.toString(),"/"))
                  assertEquals(next,navigation.pending)
                  assertEquals("C:/",navigation.accept(next.id.toString(),"C:/"))
              }
          }
          ''')
          PY
          git diff --check
      - name: Compile and run tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified compatibility change
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/ListingTextFallback.kt app/src/test/java/iecxiv/meshfabric/data/remote/ListingTextFallbackTest.kt
          git rm .github/workflows/fix-windows-listing-timeout.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retry stalled Windows file listing once as text on the same tunnel'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-listing-transport-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
