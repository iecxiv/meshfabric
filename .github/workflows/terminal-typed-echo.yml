name: Verify terminal receive path and real WebView echo
on:
  push:
    branches: [terminal-improve]
    paths: [.github/workflows/terminal-typed-echo.yml]
permissions:
  contents: write
concurrency:
  group: terminal-typed-echo
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/terminal-improve
          git merge-base --is-ancestor 3624e702ad63798b97d0d6f5fa4efc23d38569f9 HEAD
          git diff --exit-code 3624e702ad63798b97d0d6f5fa4efc23d38569f9 HEAD -- . ':(exclude).github/workflows/terminal-typed-echo.yml'
      - name: Separate binary output and add real WebView tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(source, old, new):
              if source.count(old) != 1:
                  raise RuntimeError('Reviewed receive path changed; refusing to overwrite')
              return source.replace(old, new, 1)

          newfiles = {'app/src/debug/java/iecxiv/meshfabric/ui/terminal/TerminalEchoTestActivity.kt': 'package iecxiv.meshfabric.ui.terminal\n\nimport android.app.Activity\nimport android.os.Bundle\nimport android.widget.FrameLayout\n\n/** Debug-only, unexported host for synthetic WebView echo tests. */\nclass TerminalEchoTestActivity : Activity() {\n    lateinit var host: FrameLayout\n        private set\n    override fun onCreate(state: Bundle?) {\n        super.onCreate(state)\n        host = FrameLayout(this)\n        setContentView(host)\n    }\n}\n', 'app/src/debug/AndroidManifest.xml': '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application>\n        <activity android:name="iecxiv.meshfabric.ui.terminal.TerminalEchoTestActivity" android:exported="false" android:windowSoftInputMode="stateAlwaysHidden|adjustResize" />\n    </application>\n</manifest>\n', 'app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt': 'package iecxiv.meshfabric.ui.terminal\n\nimport android.annotation.SuppressLint\nimport android.webkit.ConsoleMessage\nimport android.webkit.JavascriptInterface\nimport android.webkit.WebChromeClient\nimport android.webkit.WebView\nimport android.widget.FrameLayout\nimport androidx.test.core.app.ActivityScenario\nimport androidx.test.ext.junit.runners.AndroidJUnit4\nimport com.google.gson.Gson\nimport iecxiv.meshfabric.data.remote.MeshCentralClient\nimport iecxiv.meshfabric.data.remote.TerminalSession\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport okhttp3.Request\nimport okhttp3.WebSocket\nimport okio.ByteString\nimport org.junit.Assert.*\nimport org.junit.Test\nimport org.junit.runner.RunWith\nimport java.util.concurrent.ConcurrentLinkedQueue\nimport java.util.concurrent.CountDownLatch\nimport java.util.concurrent.LinkedBlockingQueue\nimport java.util.concurrent.TimeUnit\n\n@RunWith(AndroidJUnit4::class)\nclass TerminalEchoWebViewTest {\n    class EchoBridge {\n        val ready = CountDownLatch(1)\n        val acknowledgements = LinkedBlockingQueue<String>()\n        @JavascriptInterface fun onHtmlReady() { ready.countDown() }\n        @JavascriptInterface fun onTerminalResize(cols: Int, rows: Int) {}\n        @JavascriptInterface fun sendInput(text: String) {}\n        @JavascriptInterface fun onOutputConsumed(token: String) { acknowledgements.offer(token) }\n    }\n    private class FakeSocket : WebSocket {\n        override fun request(): Request = Request.Builder().url("https://example.invalid/").build()\n        override fun queueSize(): Long = 0L\n        override fun send(text: String): Boolean = true\n        override fun send(bytes: ByteString): Boolean = true\n        override fun close(code: Int, reason: String?): Boolean = true\n        override fun cancel() {}\n    }\n\n    @Test fun binaryFramesRenderAc1b() { verify("ac1b", true) }\n    @Test fun textFramesRenderAc1b() { verify("ac1b", false) }\n    @Test fun binaryFramesRenderTwoCsAndTwoOnes() { verify("cc11", true) }\n    @Test fun textFramesRenderTwoCsAndTwoOnes() { verify("cc11", false) }\n\n    @SuppressLint("SetJavaScriptEnabled")\n    private fun verify(expected: String, binary: Boolean) {\n        val bridge = EchoBridge()\n        val errors = ConcurrentLinkedQueue<String>()\n        val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)\n        val session = TerminalSession("synthetic-echo", MeshCentralClient(), scope)\n        val socket = FakeSocket()\n        session.activeSocket = socket\n        val textReceiver = TerminalSession::class.java.getDeclaredMethod(\n            "handleIncomingData", java.lang.Long.TYPE, WebSocket::class.java, String::class.java\n        ).apply { isAccessible = true }\n        val binaryReceiver = TerminalSession::class.java.getDeclaredMethod(\n            "handleTerminalOutput", String::class.java\n        ).apply { isAccessible = true }\n        val delivery = TerminalOutputDelivery().apply { attach(1L) }\n        val gson = Gson()\n        var webView: WebView? = null\n        val scenario = ActivityScenario.launch(TerminalEchoTestActivity::class.java)\n        try {\n            scenario.onActivity { activity ->\n                textReceiver.invoke(session, 0L, socket, "c")\n                assertTrue(session.connectionState.value)\n                webView = WebView(activity).also { view ->\n                    view.settings.javaScriptEnabled = true\n                    view.settings.allowFileAccess = true\n                    view.webChromeClient = object : WebChromeClient() {\n                        override fun onConsoleMessage(message: ConsoleMessage?): Boolean {\n                            message?.let { errors.add(it.message()) }\n                            return true\n                        }\n                    }\n                    view.addJavascriptInterface(bridge, "AndroidTerminal")\n                    activity.host.addView(view, FrameLayout.LayoutParams(-1, -1))\n                    view.loadDataWithBaseURL("file:///android_asset/terminal/", HTML, "text/html", "UTF-8", null)\n                }\n            }\n            assertTrue("Runtime did not initialize: $errors", bridge.ready.await(20, TimeUnit.SECONDS))\n            for (character in expected) {\n                var token = ""\n                scenario.onActivity {\n                    if (binary) binaryReceiver.invoke(session, character.toString())\n                    else textReceiver.invoke(session, 0L, socket, character.toString())\n                    val slice = session.readOutput(delivery.cursor)\n                    assertFalse(slice.gap)\n                    assertEquals(character.toString(), slice.text)\n                    val batch = delivery.prepare(1L, slice)!!\n                    token = batch.token\n                    webView!!.evaluateJavascript(\n                        "window.writeTerminalBatch(${gson.toJson(batch.token)},${gson.toJson(batch.text)});", null\n                    )\n                }\n                val acknowledged = bridge.acknowledgements.poll(10, TimeUnit.SECONDS)\n                assertEquals("Parser ACK missing: $errors", token, acknowledged)\n                scenario.onActivity { assertTrue(delivery.acknowledge(1L, token)) }\n            }\n            val resultReady = CountDownLatch(1)\n            var actual = ""\n            scenario.onActivity {\n                webView!!.evaluateJavascript("window.__echoTerm.buffer.active.getLine(0).translateToString(true);") { json ->\n                    actual = gson.fromJson(json, String::class.java)\n                    resultReady.countDown()\n                }\n            }\n            assertTrue(resultReady.await(10, TimeUnit.SECONDS))\n            assertEquals("Actual bundled xterm buffer differs", expected, actual)\n        } finally {\n            scenario.onActivity {\n                session.closeSocketOnly()\n                webView?.let { view ->\n                    it.host.removeView(view)\n                    view.removeJavascriptInterface("AndroidTerminal")\n                    view.destroy()\n                }\n            }\n            scope.cancel()\n            scenario.close()\n        }\n    }\n\n    companion object {\n        private val HTML = """<!doctype html><html><head>\n          <meta name="viewport" content="width=device-width,initial-scale=1">\n          <link rel="stylesheet" href="xterm.css">\n          <style>html,body{width:100%;height:100%;margin:0}#terminal-container{width:100%;height:100%}</style>\n          <script src="xterm.js"></script>\n          <script>\n            const OriginalTerminal = window.Terminal;\n            window.Terminal = function(options) {\n              const instance = new OriginalTerminal(options);\n              window.__echoTerm = instance;\n              return instance;\n            };\n          </script>\n          <script src="xterm-fit.js"></script><script src="terminal-resize.js"></script>\n          </head><body><div id="terminal-container"></div><div id="terminal-error" hidden></div>\n          <script src="terminal-runtime.js"></script></body></html>"""\n    }\n}\n', 'docs/terminal-typed-receive.md': '# Typed terminal receive path and real WebView echo checks\n\nBinary WebSocket output is delivered directly to handleTerminalOutput and never interpreted as c/cr/1 handshake. Text-frame handshake compatibility is retained before connection; connected text uses the same output publisher. No change to resize packets, renderer retention, input encoding or local echo.\n\nFour Android instrumentation cases drive the production TerminalSession receive handlers, the journal and parser ACK delivery, then inspect the real bundled xterm buffer inside an Android WebView. They cover ac1b and cc11 as isolated binary/text characters. The socket is fake and no remote commands or credentials are used. The test page wraps the bundled Terminal constructor only in its synthetic HTML; no inspection hook is added to production assets. These cases do not reproduce a full MeshCentral network connection or Android keyboard input.\n\nDebug builds log at most 64 frame records per session and corresponding output lengths/revisions under TerminalEcho. Logs contain frame kind, lengths and connection flags, never terminal text or keystrokes. If the real-device symptom persists, these metadata traces are needed to locate the remaining loss; this change alone does not establish the previous runtime cause.\n\nThe helper Activity and its unexported manifest entry exist only in the debug build. CI runs existing JavaScript/unit tests, assembles app and instrumentation APKs, and runs the four WebView cases on an API-35 emulator before publishing. Physical-device validation remains required.\n'}
          edits = [('if (activeSocket === webSocket && !isUserDisconnect) handleIncomingData(epoch, webSocket, bytes.utf8())', 'if (activeSocket === webSocket && !isUserDisconnect) {\n                                traceTerminalFrame("binary", bytes.size)\n                                handleTerminalOutput(bytes.utf8())\n                            }'), ('    private fun handleIncomingData(epoch: Long, webSocket: WebSocket, data: String) {', '    private var tracedFrames = 0\n    private val traceEnabled: Boolean get() = try {\n        (iecxiv.meshfabric.MeshFabricApp.instance.applicationInfo.flags and\n            android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE) != 0\n    } catch (_: Exception) { false }\n\n    private fun traceTerminalFrame(kind: String, size: Int) {\n        if (traceEnabled && tracedFrames < 64) {\n            tracedFrames++\n            Log.d("TerminalEcho", "rx=$tracedFrames kind=$kind size=$size connected=${_connectionState.value} handshake=$handshakeComplete")\n        }\n    }\n\n    private fun handleIncomingData(epoch: Long, webSocket: WebSocket, data: String) {\n        traceTerminalFrame("text", data.length)'), ('        if (_connectionState.value) {\n            synchronized(sessionHistory) {\n                sessionHistory.append(data)\n                outputJournal.append(data)\n                if (sessionHistory.length > 200000) sessionHistory.delete(0, 50000)\n            }\n            _incomingDataFlow.tryEmit(data)\n        }\n    }\n\n    fun onNetworkChanged()', '        handleTerminalOutput(data)\n    }\n\n    private fun handleTerminalOutput(data: String) {\n        if (_connectionState.value) {\n            synchronized(sessionHistory) {\n                sessionHistory.append(data)\n                outputJournal.append(data)\n                if (sessionHistory.length > 200000) sessionHistory.delete(0, 50000)\n            }\n            _incomingDataFlow.tryEmit(data)\n            if (traceEnabled && tracedFrames in 1..63) {\n                Log.d("TerminalEcho", "published chars=${data.length} revision=${outputRevision.value}")\n            }\n        }\n    }\n\n    fun onNetworkChanged()')]
          relay = Path('app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt')
          source = relay.read_text(encoding='utf-8')
          for old, new in edits:
              source = replace_once(source, old, new)
          for filename in newfiles:
              if Path(filename).exists():
                  raise RuntimeError('New target already exists: ' + filename)
          relay.write_text(source, encoding='utf-8')
          for filename, content in newfiles.items():
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript regression tests
        run: node app/src/test/js/terminal-runtime.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and tests and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real WebView isolated-character tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.terminal.TerminalEchoWebViewTest --no-daemon --stacktrace
      - name: Publish only verified candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/terminal-improve | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/terminal-typed-echo.yml
          git add -- app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt app/src/debug/java/iecxiv/meshfabric/ui/terminal/TerminalEchoTestActivity.kt app/src/debug/AndroidManifest.xml app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalEchoWebViewTest.kt docs/terminal-typed-receive.md .github/workflows/terminal-typed-echo.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate binary terminal output and verify real WebView echo'
          git push origin HEAD:refs/heads/terminal-improve
      - name: Upload JVM and WebView reports and APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-typed-echo-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
