name: Fix active download network handover

on:
  push:
    branches: [reconnection-tests]
    paths: ['.github/workflows/fix-download-handover.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-download-handover
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/reconnection-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconnection-tests
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded active download fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('app/src/main/java/iecxiv/meshfabric/data/remote')
          p = root / 'FileRelayClient.kt'
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '63d5c7fd9cc6d09f3bbed95e7f5e421a4e08a41e', 'File relay base changed; review required'
          s = raw.decode()
          def once(old, new):
              global s
              assert s.count(old) == 1, old[:140]
              s = s.replace(old, new, 1)
          once('''    val context: Context
          )

          class ActiveUploadSession''', '''    val context: Context
          ) {
              internal val networkAttempt = DownloadNetworkAttempt()
          }

          class ActiveUploadSession''')
          start = s.index('    fun downloadFileToDownloads(')
          end = s.index('    fun cancelCopyMove(', start)
          prefix, d, suffix = s[:start], s[start:end], s[end:]
          credentials_start = d.index('        val meshId = meshClient.getNodeMeshId(nodeId)')
          credentials_end = d.index('        Toast.makeText(', credentials_start)
          credentials = d[credentials_start:credentials_end]
          d = d[:credentials_start] + d[credentials_end:]
          anchor = '                    session.receivedBytes = 0L\n                    _activeTransfers.value'
          assert d.count(anchor) == 1
          credentials = '\n'.join('            ' + line if line else '' for line in credentials.splitlines())
          d = d.replace(anchor, '''                    val attemptEpoch = session.networkAttempt.current()
          ''' + credentials + '\n\n' + anchor, 1)
          old = '                    // 1. Attempt HTTP Download\n                    try {'
          assert d.count(old) == 1
          d = d.replace(old, '''                    // 1. Attempt HTTP Download, owned by this network generation.
                              var httpResponse: Response? = null
                              var activeHttpCall: okhttp3.Call? = null
                              try {''', 1)
          old = '                        val client = OkHttpHelper.createDownloadClient(meshClient.ignoreSsl)'
          assert d.count(old) == 1
          d = d.replace(old, old + '''
                                  fun executeOnCurrentNetwork(request: Request): Response {
                                      val call = client.newCall(request)
                                      activeHttpCall = call
                                      if (!session.networkAttempt.bind(attemptEpoch, call) { call.cancel() }) {
                                          throw java.io.IOException("Download network changed before request")
                                      }
                                      return call.execute().also { httpResponse = it }
                                  }
          ''', 1)
          assert d.count('client.newCall(reqBuilder.build()).execute()') == 2
          d = d.replace('client.newCall(reqBuilder.build()).execute()', 'executeOnCurrentNetwork(reqBuilder.build())')
          old = '                        if (!response.isSuccessful) {\n'
          assert d.count(old) == 1
          d = d.replace(old, old + '''                            response.close()
                                      if (!session.networkAttempt.isCurrent(attemptEpoch)) {
                                          throw java.io.IOException("Download network changed during HTTP response")
                                      }
          ''', 1)
          old = '''                                        output.write(buffer, 0, bytesRead)
                                                  receivedBytes += bytesRead
                                                  session.receivedBytes = receivedBytes'''
          assert d.count(old) == 1
          d = d.replace(old, '''                                        val accepted = session.networkAttempt.runIfCurrent(attemptEpoch) {
                                                      output.write(buffer, 0, bytesRead)
                                                      receivedBytes += bytesRead
                                                      session.receivedBytes = receivedBytes
                                                  }
                                                  if (!accepted) throw java.io.IOException("Download network changed during read")''', 1)
          old = '                    } catch (e: Exception) {\n                        if (e is CancellationException) throw e\n                        Log.w("MeshFilesDownload", "HTTP download attempt failed: ${e.localizedMessage}")'
          assert d.count(old) == 1
          d = d.replace(old, '''                    } catch (e: Exception) {
                                  if (e is CancellationException) throw e
                                  if (!session.networkAttempt.isCurrent(attemptEpoch)) {
                                      throw java.io.IOException("Download network changed; restarting on the current network", e)
                                  }
                                  Log.w("MeshFilesDownload", "HTTP download attempt failed: ${e.localizedMessage}")''', 1)
          old = '''                    } finally {
                                  try {
                                      session.outputStream?.close()'''
          assert d.count(old) == 1
          d = d.replace(old, '''                    } finally {
                                  httpResponse?.close()
                                  activeHttpCall?.let { session.networkAttempt.release(attemptEpoch, it) }
                                  try {
                                      session.outputStream?.close()''', 1)
          old = '                    // 2. Attempt WebSocket readfile download if HTTP did not complete'
          assert d.count(old) == 1
          d = d.replace(old, '''                    if (!session.networkAttempt.isCurrent(attemptEpoch)) {
                                  throw java.io.IOException("Download network changed before WebSocket fallback")
                              }

          ''' + old, 1)
          old = 'while (activeDownloads.containsKey(item.path) && coroutineContext.isActive && isConnected())'
          assert d.count(old) == 1
          d = d.replace(old, 'while (activeDownloads.containsKey(item.path) && coroutineContext.isActive && isConnected() && session.networkAttempt.isCurrent(attemptEpoch))', 1)
          s = prefix + d + suffix
          once('            session?.downloadJob?.cancel()', '''            session?.downloadJob?.cancel()
                      session?.networkAttempt?.invalidate()''')
          once('''    fun onNetworkChanged() {
                  if (isUserDisconnect) return
                  retireSocket()''', '''    fun onNetworkChanged() {
                  if (isUserDisconnect) return
                  activeDownloads.values.toList().forEach { it.networkAttempt.invalidate() }
                  retireSocket()''')
          once('''    fun disconnect(resetPath: Boolean = false) {
                  isUserDisconnect = true''', '''    fun disconnect(resetPath: Boolean = false) {
                  isUserDisconnect = true
                  activeDownloads.keys.toList().forEach { cancelDownload(it) }''')
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines()).rstrip() + '\n')
          (root / 'DownloadNetworkAttempt.kt').write_text('''package iecxiv.meshfabric.data.remote

          /** Owns the cancellable HTTP call for one download network generation. */
          internal class DownloadNetworkAttempt {
              private var generation = 0L
              private var resource: Any? = null
              private var cancelAction: (() -> Unit)? = null

              @Synchronized fun current(): Long = generation
              @Synchronized fun isCurrent(epoch: Long): Boolean = epoch == generation

              fun bind(epoch: Long, identity: Any, cancel: () -> Unit): Boolean {
                  var previous: (() -> Unit)? = null
                  val accepted = synchronized(this) {
                      if (epoch != generation) false else {
                          previous = cancelAction
                          resource = identity
                          cancelAction = cancel
                          true
                      }
                  }
                  previous?.invoke()
                  if (!accepted) cancel()
                  return accepted
              }

              @Synchronized fun release(epoch: Long, identity: Any) {
                  if (epoch == generation && resource === identity) {
                      resource = null
                      cancelAction = null
                  }
              }

              fun invalidate() {
                  val cancel = synchronized(this) {
                      generation++
                      val action = cancelAction
                      resource = null
                      cancelAction = null
                      action
                  }
                  cancel?.invoke()
              }

              @Synchronized fun runIfCurrent(epoch: Long, block: () -> Unit): Boolean {
                  if (epoch != generation) return false
                  block()
                  return true
              }
          }
          ''')
          test = Path('app/src/test/java/iecxiv/meshfabric/data/remote/DownloadNetworkAttemptTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package iecxiv.meshfabric.data.remote

          import org.junit.Assert.*
          import org.junit.Test

          class DownloadNetworkAttemptTest {
              @Test fun networkChangeCancelsBoundHttpRequest() {
                  val gate = DownloadNetworkAttempt()
                  var cancelled = 0
                  val epoch = gate.current()
                  assertTrue(gate.bind(epoch, Any()) { cancelled++ })
                  gate.invalidate()
                  assertEquals(1, cancelled)
                  assertFalse(gate.isCurrent(epoch))
              }

              @Test fun newNetworkCanBindFreshRequest() {
                  val gate = DownloadNetworkAttempt()
                  gate.invalidate()
                  var cancelled = false
                  assertTrue(gate.bind(gate.current(), Any()) { cancelled = true })
                  assertFalse(cancelled)
              }

              @Test fun lateOldRequestIsCancelledWithoutReplacingFreshOne() {
                  val gate = DownloadNetworkAttempt()
                  val old = gate.current()
                  gate.invalidate()
                  var freshCancelled = 0
                  var oldCancelled = 0
                  gate.bind(gate.current(), Any()) { freshCancelled++ }
                  assertFalse(gate.bind(old, Any()) { oldCancelled++ })
                  assertEquals(1, oldCancelled)
                  assertEquals(0, freshCancelled)
                  gate.invalidate()
                  assertEquals(1, freshCancelled)
              }

              @Test fun oldCleanupCannotDetachNewRequest() {
                  val gate = DownloadNetworkAttempt()
                  val oldEpoch = gate.current()
                  val old = Any()
                  gate.bind(oldEpoch, old) { }
                  gate.invalidate()
                  var cancelled = false
                  gate.bind(gate.current(), Any()) { cancelled = true }
                  gate.release(oldEpoch, old)
                  gate.invalidate()
                  assertTrue(cancelled)
              }

              @Test fun staleAttemptCannotWriteDownloadedBytes() {
                  val gate = DownloadNetworkAttempt()
                  val old = gate.current()
                  gate.invalidate()
                  var written = false
                  assertFalse(gate.runIfCurrent(old) { written = true })
                  assertFalse(written)
                  assertTrue(gate.runIfCurrent(gate.current()) { written = true })
                  assertTrue(written)
              }

              @Test fun releasedRequestIsNotCancelledAgain() {
                  val gate = DownloadNetworkAttempt()
                  val epoch = gate.current()
                  val request = Any()
                  var cancelled = false
                  gate.bind(epoch, request) { cancelled = true }
                  gate.release(epoch, request)
                  gate.invalidate()
                  assertFalse(cancelled)
              }
          }
          ''')
          PY
      - name: Build, test and lint
        run: |
          set -euo pipefail
          git diff --check
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Publish verified fix
        run: |
          set -euo pipefail
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/DownloadNetworkAttempt.kt app/src/test/java/iecxiv/meshfabric/data/remote/DownloadNetworkAttemptTest.kt
          git rm .github/workflows/fix-download-handover.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(files): restart active downloads on network handover'
          git push origin HEAD:refs/heads/reconnection-tests
      - name: Upload verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: download-handover-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
