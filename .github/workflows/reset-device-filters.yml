name: Validate device filter reset
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/reset-device-filters.yml']
permissions:
  contents: write
concurrency:
  group: reset-device-filters-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 7 only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt')
          assert git('hash-object',str(p))=='25a1c2ed2438b0e31ac53d5ebddad0ef02f2b9fd'
          s=p.read_text()
          anchor='                    DropdownMenuItem(text={Text(if(es) "Nombre de sistema operativo" else "Show OS name")},trailingIcon={Checkbox(checked=menu.osName,onCheckedChange=null)},onClick={menu.onOsName();close()})'
          assert s.count(anchor)==1
          addition='\n'.join([
              '                    HorizontalDivider()',
              '                    DropdownMenuItem(text={Text(if(es) "Restablecer filtros" else "Reset filters")},',
              '                        leadingIcon={Icon(Icons.Default.FilterAltOff,null,Modifier.size(20.dp))},',
              '                        modifier=Modifier.testTag("devices_header_reset_filters"),',
              '                        onClick={menu.onFilter(DeviceListFilter.ALL);onShowIps(false);onShowDisconnected(false);close()})'
          ])
          assert 'onOsName' not in addition and 'onSort' not in addition and 'onSelection' not in addition
          updated=s.replace(anchor,anchor+'\n'+addition,1)
          assert updated.replace(anchor+'\n'+addition,anchor,1)==s
          p.write_text(updated)
          test=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceFilterResetUiTest.kt')
          assert not test.exists()
          test.write_text(textwrap.dedent('''\
          package iecxiv.meshfabric.ui.devices
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          class DeviceFilterResetUiTest {
              @get:Rule val compose=createComposeRule()
              @Test fun resetPreservesEnabledOsName()=checkReset(true)
              @Test fun resetPreservesDisabledOsName()=checkReset(false)
              private fun checkReset(initialOs:Boolean) {
                  var ips by mutableStateOf(true)
                  var disconnected by mutableStateOf(true)
                  var filter by mutableStateOf(DeviceListFilter.STARRED)
                  var os by mutableStateOf(initialOs)
                  var sort by mutableStateOf(DeviceListSort.DEVICE)
                  var reverse by mutableStateOf(true)
                  var selecting by mutableStateOf(true)
                  compose.setContent {MaterialTheme {
                      val menu=DeviceBrowseMenuState(sort,reverse,filter,os,selecting,
                          onSort={sort=it},onReverse={reverse=!reverse},onFilter={filter=it},
                          onOsName={os=!os},onSelection={selecting=!selecting})
                      DeviceHeaderBrowseFilter(ips,disconnected,{ips=it},{disconnected=it},menu)
                  }}
                  compose.onNodeWithTag("devices_header_filter").performClick()
                  compose.onNodeWithTag("devices_header_reset_filters").performScrollTo().performClick()
                  compose.onNodeWithTag("devices_header_filter_menu").assertDoesNotExist()
                  compose.runOnIdle {
                      assertEquals(DeviceListFilter.ALL,filter)
                      assertFalse(ips)
                      assertFalse(disconnected)
                      assertEquals(initialOs,os)
                      assertEquals(DeviceListSort.DEVICE,sort)
                      assertTrue(reverse)
                      assertTrue(selecting)
                  }
              }
          }
          '''))
          subprocess.run(['git','add','-N','--',str(test)],check=True)
          assert set(git('diff','--name-only').splitlines())=={str(p),str(test)}
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-device-filters-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 7 and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/reset-device-filters.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListHeaderMenus.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/devices/DeviceFilterResetUiTest.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(devices): add filter reset preserving OS name preference'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
