name: Validate readable account lock context
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-readable-user-lock-context.yml]
permissions:
  contents: write
concurrency:
  group: profile-readable-user-lock-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate presentation and repair stable test selectors
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4621d3e22e14163c37fbc002a32e6bd899f30bde
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          ref='4621d3e22e14163c37fbc002a32e6bd899f30bde:.github/workflows/publish-readable-user-lock-context.yml'
          assert subprocess.check_output(['git','rev-parse',ref],text=True).strip()=='d87cc0ca27001eb530bbdb8ab85ada8863f8b602'
          workflow=subprocess.check_output(['git','show',ref],text=True)
          start=workflow.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=workflow.index('\n          PY',start)
          generator=textwrap.dedent(workflow[start:end])
          exec(compile(generator,'pinned-user-lock-generator','exec'))
          def replace_once(s,a,b):
              assert s.count(a)==1,'Missing or nonunique anchor: '+a[:100]
              return s.replace(a,b,1)
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          p=main/'UserAdministration.kt';before_tags=p.read_text()
          old_import='import androidx.compose.ui.platform.LocalConfiguration'
          new_import=old_import+'\nimport androidx.compose.ui.platform.testTag'
          old_button='},confirmButton={ if(mode!="history") TextButton(enabled=allowed && valid,'
          new_button='},confirmButton={ if(mode!="history") TextButton(modifier=Modifier.testTag("user-admin-confirm"),enabled=allowed && valid,'
          s=replace_once(before_tags,old_import,new_import)
          s=replace_once(s,old_button,new_button)
          assert s.replace(new_import,old_import,1).replace(new_button,old_button,1)==before_tags
          p.write_text(s)
          p=main/'ProfileUserListIdentity.kt';before_tag=p.read_text()
          old='ProfileDisclosure(if(es) "Identificador" else "Identifier") {Text(account.optString("_id"),style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant)}'
          new='Box(Modifier.testTag("profile-user-identifier")) { '+old+' }'
          s=replace_once(before_tag,old,new)
          assert s.replace(new,old,1)==before_tag
          p.write_text(s)
          p=tests/'UserLockPresentationTest.kt';s=p.read_text()
          count=s.count('compose.onNodeWithText("Enviar")')
          assert count>=8
          s=s.replace('compose.onNodeWithText("Enviar")','compose.onNodeWithTag("user-admin-confirm").assertHasClickAction()')
          old='compose.onNodeWithText("Identificador").performClick()'
          new='compose.onNode(hasClickAction() and hasAnyAncestor(hasTestTag("profile-user-identifier")),useUnmergedTree=true).performScrollTo().performClick()'
          s=replace_once(s,old,new)
          assert s.count('@Test fun ')==6,'All six tests must remain'
          p.write_text(s)
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute lock presentation and profile regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.UserLockPresentationTest,iecxiv.meshfabric.ui.management.ProfileUserListIdentityTest,iecxiv.meshfabric.ui.management.UserDetailPresentationTest,iecxiv.meshfabric.ui.management.ProfileDetailReadsRegressionTest,iecxiv.meshfabric.ui.management.ProfileReceivedDeviceNavigationTest,iecxiv.meshfabric.ui.management.UserMessageDialogTest,iecxiv.meshfabric.ui.management.UserMfaResetDialogTest,iecxiv.meshfabric.ui.management.UserDeleteDialogTest,iecxiv.meshfabric.ui.management.UserDeviceGrantDialogTest,iecxiv.meshfabric.ui.management.ReadableUserEditorsTest,iecxiv.meshfabric.ui.management.UserAdvancedRequestTest,iecxiv.meshfabric.ui.management.ReadableGrantDialogsTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest --no-daemon --stacktrace
      - name: Show concrete test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for directory in [Path('app/build/outputs/androidTest-results'),Path('app/build/test-results')]:
              for report in sorted(directory.rglob('*.xml')):
                  try:
                      root=ET.parse(report).getroot()
                  except ET.ParseError:
                      continue
                  for case in root.iter('testcase'):
                      for kind in ('failure','error'):
                          failure=case.find(kind)
                          if failure is not None:
                              print(case.get('classname','')+'.'+case.get('name',''))
                              print(failure.get('message',''));print((failure.text or '')[:10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-user-lock-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish validated sources to unchanged dev
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = dev
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt app/src/main/java/iecxiv/meshfabric/ui/management/ProfileUserListIdentity.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserLockPresentationTest.kt
          python3 - <<'PY'
          import subprocess
          main='app/src/main/java/iecxiv/meshfabric/ui/management/'
          expected={main+'UserAdministration.kt',main+'ProfileUserListIdentity.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserLockPresentationTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): readable lock context with stable UI regression selectors'
          git push origin HEAD:dev
