name: Validate readable account lock context
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-readable-user-lock-context.yml]
permissions:
  contents: write
concurrency:
  group: profile-readable-user-lock-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate header-only change and offline regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 05ac3060190c5c6689a0a3119a2775b6b17c8e8f
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          p=main/'UserAdministration.kt';test=tests/'UserLockPresentationTest.kt'
          assert not test.exists()
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='2fbd972c197614e87e02177f232567c05fd2c17d'
          original=p.read_text()
          old='if(!creating) { Text(user?.optString("name").orEmpty().ifBlank { form.name },style=MaterialTheme.typography.titleSmall); if(deleting || locking) Text(form.id,style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant) else ProfileDisclosure(t("Identificador","Identifier")) { Text(form.id,style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant) } }'
          new='if(!creating) { if(locking && user!=null) ProfileUserListIdentity(user,s.users) else { Text(user?.optString("name").orEmpty().ifBlank { form.name },style=MaterialTheme.typography.titleSmall); if(deleting) Text(form.id,style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant) else ProfileDisclosure(t("Identificador","Identifier")) { Text(form.id,style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant) } } }'
          assert original.count(old)==1
          changed=original.replace(old,new,1)
          assert changed.replace(new,old,1)==original,'Only the identity header may change'
          p.write_text(changed)
          test.write_text('''package iecxiv.meshfabric.ui.management
          import android.content.res.Configuration
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.MutableStateFlow
          import org.json.JSONObject
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.util.Locale
          @RunWith(AndroidJUnit4::class) class UserLockPresentationTest {
              @get:Rule val compose=createComposeRule()
              private val uid="user//alice"
              private fun field(o:Any,n:String)=o.javaClass.getDeclaredField(n).apply {isAccessible=true}
              private inner class Fixture(unlocking:Boolean=false,fullTarget:Boolean=false,selfAccount:Boolean=false):AutoCloseable {
                  val client=MeshCentralClient();val session=ProfileSession(client)
                  val target=JSONObject().put("_id",uid).put("name","Alicia").put("realname","Alicia García").put("email","alice@example.invalid").put("siteadmin",if(fullTarget) 0xffffffffL else if(unlocking) 32L else 0L)
                  val baseline=ProfileState(ready=true,user=JSONObject().put("_id",if(selfAccount) uid else "user//admin").put("siteadmin",2L),users=listOf(target))
                  val state=mutableStateOf(baseline)
                  init {
                      field(client,"serverUrl").set(client,"https://example.invalid/");field(client,"authCookie").set(client,"offline-lock-presentation")
                      @Suppress("UNCHECKED_CAST") val connected=field(client,"_connectionState").get(client) as MutableStateFlow<Boolean>;connected.value=true
                      field(session,"binding").set(session,Triple(client.serverUrl,client.authCookie,false))
                      compose.setContent {
                          val config=Configuration(LocalConfiguration.current).apply {setLocale(Locale("es"))}
                          CompositionLocalProvider(LocalConfiguration provides config) {MaterialTheme {
                              UserAdministrationDialog(session,state.value,ProfileForm(true,if(unlocking) "unlock" else "lock",uid,"Alicia","alice@example.invalid"),onDismiss={})
                          }}
                      }
                  }
                  fun noIds() {for(id in listOf(uid,"user//admin")) compose.onAllNodesWithText(id,substring=true).assertCountEquals(0)}
                  override fun close() {assertNull(field(client,"webSocket").get(client));assertNull(field(session,"socket").get(session));session.close();(field(client,"scope").get(client) as CoroutineScope).cancel()}
              }
              @Test fun lockUsesReadableContextAndRetainsExistingConsentGate() {Fixture().use {f->
                  compose.onNodeWithText("Bloquear usuario").assertExists()
                  compose.onNodeWithText("Alicia · Alicia García · alice@example.invalid").assertExists()
                  compose.onAllNodesWithTag("profile-user-list-icon",useUnmergedTree=true).assertCountEquals(1)
                  compose.onNodeWithText("Enviar").assertIsNotEnabled()
                  compose.onNode(isToggleable()).performClick()
                  compose.onNodeWithText("Enviar").assertIsEnabled();f.noIds()
              }}
              @Test fun unlockUsesTheSameReadableContextAndConsent() {Fixture(unlocking=true).use {f->
                  compose.onNodeWithText("Desbloquear usuario").assertExists()
                  compose.onNodeWithText("Alicia · Alicia García · alice@example.invalid").assertExists()
                  compose.onNodeWithText("Enviar").assertIsNotEnabled()
                  compose.onNode(isToggleable()).performClick()
                  compose.onNodeWithText("Enviar").assertIsEnabled();f.noIds()
              }}
              @Test fun identifierIsVisibleOnlyAfterExplicitExpansion() {Fixture().use {f->
                  f.noIds();compose.onNodeWithText("Identificador").performClick();compose.onNodeWithText(uid).assertExists()
              }}
              @Test fun ownAccountRemainsBlocked() {Fixture(selfAccount=true).use {f->
                  compose.onNode(isToggleable()).performClick();compose.onNodeWithText("Enviar").assertIsNotEnabled();f.noIds()
              }}
              @Test fun fullAdministratorRemainsBlocked() {Fixture(fullTarget=true).use {f->
                  compose.onNode(isToggleable()).performClick();compose.onNodeWithText("Enviar").assertIsNotEnabled();f.noIds()
              }}
              @Test fun changedLockStateCannotBeSubmittedUnderTheOldOperation() {Fixture().use {f->
                  compose.onNode(isToggleable()).performClick();compose.onNodeWithText("Enviar").assertIsEnabled()
                  compose.runOnIdle {f.state.value=f.baseline.copy(users=listOf(JSONObject(f.target.toString()).put("siteadmin",32L)))}
                  compose.waitForIdle();compose.onNodeWithText("Enviar").assertIsNotEnabled();f.noIds()
              }}
          }
          ''')
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute lock presentation and profile regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.UserLockPresentationTest,iecxiv.meshfabric.ui.management.ProfileUserListIdentityTest,iecxiv.meshfabric.ui.management.UserDetailPresentationTest,iecxiv.meshfabric.ui.management.ProfileDetailReadsRegressionTest,iecxiv.meshfabric.ui.management.ProfileReceivedDeviceNavigationTest,iecxiv.meshfabric.ui.management.UserMessageDialogTest,iecxiv.meshfabric.ui.management.UserMfaResetDialogTest,iecxiv.meshfabric.ui.management.UserDeleteDialogTest,iecxiv.meshfabric.ui.management.UserDeviceGrantDialogTest,iecxiv.meshfabric.ui.management.ReadableUserEditorsTest,iecxiv.meshfabric.ui.management.UserAdvancedRequestTest,iecxiv.meshfabric.ui.management.ReadableGrantDialogsTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest --no-daemon --stacktrace
      - name: Show concrete test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for directory in [Path('app/build/outputs/androidTest-results'),Path('app/build/test-results')]:
              for report in sorted(directory.rglob('*.xml')):
                  try:
                      root=ET.parse(report).getroot()
                  except ET.ParseError:
                      continue
                  for case in root.iter('testcase'):
                      for kind in ('failure','error'):
                          failure=case.find(kind)
                          if failure is not None:
                              print(case.get('classname','')+'.'+case.get('name',''))
                              print(failure.get('message',''));print((failure.text or '')[:10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-user-lock-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish validated sources to unchanged dev
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = dev
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserLockPresentationTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/UserAdministration.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserLockPresentationTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): readable user context in lock and unlock dialogs'
          git push origin HEAD:dev
