name: Publish desktop displays once on dev
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-desktop-displays-once.yml']
permissions:
  contents: write
concurrency:
  group: publish-desktop-displays-once-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify base and apply exact candidate
        shell: python
        run: |
          import os,subprocess,base64,lzma,hashlib,json
          from pathlib import Path
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          base='4b9fb17d9a274b92221428188e01bf7111e1d0ae'
          workflow='.github/workflows/publish-desktop-displays-once.yml'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==base
          assert git('diff','--name-only',base,'HEAD').splitlines()==[workflow]
          assert not git('status','--porcelain')
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          patch=lzma.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='5ad40c36eb15376d0a253d0263f9de7185e12fd005e4686647e8b4e820d0a2ac'
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()]
          assert len(paths)==len(set(paths))==14
          assert all(p.startswith(('app/src/main/java/','app/src/main/res/','app/src/test/java/')) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','apply','--check','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error-all','-'],input=patch,check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'desktop-candidate.json').write_text(json.dumps({'paths':paths,'tree':git('write-tree')}))
          (tmp/'desktop-candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install project SDK using existing tools version
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          sdk=Path(os.environ['ANDROID_HOME']).resolve();tools=[]
          for p in (sdk/'cmdline-tools').glob('*/source.properties'):
              props=dict((k.strip(),v.strip()) for line in p.read_text().splitlines() if '=' in line for k,v in [line.split('=',1)])
              if props.get('Pkg.Revision')=='23.0' and os.access(p.parent/'bin/sdkmanager',os.X_OK): tools.append(p.parent)
          assert tools,'Verified command-line tools 23.0 missing'
          subprocess.run([str(sorted(tools)[0]/'bin/sdkmanager'),'--sdk_root='+str(sdk),'--channel=0','platforms;android-37.2','platforms;android-35','build-tools;37.0.0','platform-tools'],check=True)
      - name: Build compile instrumentation run all JVM tests and lint
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:clean :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/desktop-displays-build.txt"
      - name: Verify tested candidate then publish and remove this workflow
        shell: python
        run: |
          import os,json,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          tmp=Path(os.environ['RUNNER_TEMP']);state=json.loads((tmp/'desktop-candidate.json').read_text())
          cases=[c for p in Path('app/build/test-results').rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
          assert cases and not any(c.find(t) is not None for c in cases for t in ['failure','error'])
          own=[c for c in cases if c.get('classname')=='iecxiv.meshfabric.data.remote.DesktopDisplayProtocolTest']
          assert len(own)==15 and not any(c.find('skipped') is not None for c in own)
          assert git('write-tree')==state['tree']
          assert subprocess.check_output(['git','diff','--cached','--binary'])==(tmp/'desktop-candidate.patch').read_bytes()
          subprocess.run(['git','diff','--exit-code'],check=True)
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          assert git('ls-remote','origin','refs/heads/dev').split()[0]==os.environ['GITHUB_SHA'],'dev advanced; no force push'
          workflow='.github/workflows/publish-desktop-displays-once.yml'
          subprocess.run(['git','rm','--',workflow],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(state['paths']+[workflow])
          assert subprocess.check_output(['git','diff','--cached','--binary','--',*state['paths']])==(tmp/'desktop-candidate.patch').read_bytes()
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(desktop): add display selector and align remote headers'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/dev'],check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('Published '+git('rev-parse','HEAD')+' to dev after build, unit tests and lint. Temporary workflow removed. Physical-device and multi-monitor validation remain pending.\n')
      - name: Upload validation reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-displays-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-displays-build.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
