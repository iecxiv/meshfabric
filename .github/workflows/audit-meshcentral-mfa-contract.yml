name: Audit MeshCentral 1.3.1 MFA reset contract
on:
  push:
    branches: [dev]
    paths: [.github/workflows/audit-meshcentral-mfa-contract.yml]
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect integrity-checked upstream package without executing it
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,re,tarfile,urllib.request
          from pathlib import Path
          registry='https://registry.npmjs.org/meshcentral/1.3.1'
          with urllib.request.urlopen(registry,timeout=60) as response:
              metadata=json.load(response)
          assert metadata['name']=='meshcentral' and metadata['version']=='1.3.1'
          url=metadata['dist']['tarball']
          assert url=='https://registry.npmjs.org/meshcentral/-/meshcentral-1.3.1.tgz'
          with urllib.request.urlopen(url,timeout=60) as response:
              archive=response.read(100_000_001)
          assert len(archive)<=100_000_000,'Package exceeds audit size limit'
          integrity=metadata['dist']['integrity']
          assert integrity.startswith('sha512-')
          assert base64.b64encode(hashlib.sha512(archive).digest()).decode()==integrity.split('-',1)[1],'Package integrity mismatch'
          out=Path('audit');out.mkdir()
          sections=['MeshCentral MFA contract audit','Version: '+metadata['version'],'Registry: '+registry,'Tarball: '+url,'Verified integrity: '+integrity,'No package code was executed. No server or account was contacted.']
          required=['package/meshuser.js','package/webserver.js','package/views/default.handlebars']
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as package:
              version_file=package.extractfile('package/package.json')
              assert version_file is not None
              assert json.load(version_file)['version']=='1.3.1'
              for name in required:
                  member=package.getmember(name)
                  assert member.isfile() and member.size<10_000_000
                  content=package.extractfile(member).read().decode('utf-8-sig')
                  (out/Path(name).name).write_text(content,encoding='utf-8')
                  lines=content.splitlines()
                  patterns=['changeuserpass','removeMultiFactor','lock2factor','CloneSafeUser']
                  ranges=[]
                  for pattern in patterns:
                      hits=[i for i,line in enumerate(lines) if pattern.lower() in line.lower()]
                      sections.append('\n'+name+' :: '+pattern+' :: '+str(len(hits))+' matches')
                      for i in hits[:3]:
                          ranges.append((max(0,i-12),min(len(lines),i+150)))
                  merged=[]
                  for start,end in sorted(ranges):
                      if merged and start<=merged[-1][1]:
                          merged[-1]=(merged[-1][0],max(merged[-1][1],end))
                      else:
                          merged.append((start,end))
                  for start,end in merged:
                      sections.append('\n--- '+name+' lines '+str(start+1)+'-'+str(end)+' ---')
                      sections.extend(str(i+1)+': '+lines[i] for i in range(start,end))
                  if name=='package/meshuser.js':
                      assert 'changeuserpass' in content,'Expected account command missing'
          report='\n'.join(sections)+'\n'
          (out/'mfa-contract-report.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meshcentral-1.3.1-mfa-contract-${{ github.run_id }}
          path: audit/
          if-no-files-found: error
          retention-days: 7
