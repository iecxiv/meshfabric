name: Repair and validate search toggles
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/search-toggles-repair.yml']
permissions:
  contents: write
concurrency:
  group: search-toggles-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair preparation script and apply original block 5B scope
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          old=Path('.github/workflows/search-toggles.yml')
          assert git('hash-object',str(old))=='98bfb8847ae8e7c24b85be8402be4e8fb44a34ae'
          workflow=old.read_text()
          start=workflow.index('        run: |\n')+len('        run: |\n')
          end=workflow.index('      - run: git diff --check',start)
          script=textwrap.dedent(workflow[start:end])
          lines=script.splitlines()
          matches=[i for i,line in enumerate(lines) if line.startswith("        replace('''                            singleLine = true,")]
          assert len(matches)==1,matches
          begin=matches[0]
          ends=[i for i,line in enumerate(lines) if i>begin and line=='    p.write_text(s)']
          assert len(ends)==1,ends
          replacement=r'''
          begin=s.index('                    if (isSearchActive) {')
          end=s.index('                    } else {',begin)
          field=s[begin:end]
          old_modifier='modifier = Modifier.fillMaxWidth()'
          assert field.count(old_modifier)==1
          s=s[:begin]+field.replace(old_modifier,'modifier = Modifier.fillMaxWidth().focusRequester(fileSearchFocus)',1)+s[end:]
          old_icon='if (isSearchActive) Icons.Default.Close else Icons.Default.Search,\n                                contentDescription = stringResource(R.string.search)'
          new_icon=old_icon+',\n                                tint = if(isSearchActive) Color(0xFF2196F3) else MaterialTheme.colorScheme.onSurfaceVariant'
          replace(old_icon,new_icon)
          replace('import androidx.compose.runtime.LaunchedEffect','import androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.withFrameNanos')
          '''
          replacement=textwrap.indent(textwrap.dedent(replacement).strip(),'        ').splitlines()
          script='\n'.join(lines[:begin]+replacement+lines[ends[0]:])+'\n'
          compile(script,'repaired-search-preparation','exec')
          exec(compile(script,'repaired-search-preparation','exec'),{})
          file_path=Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          files=file_path.read_text()
          cleaned='\n'.join('' if not line.strip() else line for line in files.split('\n'))
          assert ''.join(files.split())==''.join(cleaned.split())
          file_path.write_text(cleaned)
          files=cleaned
          assert files.count('.focusRequester(fileSearchFocus)')==1
          assert 'import androidx.compose.runtime.withFrameNanos' in files
          assert 'onClick = { if(isSearchActive) closeFileSearch() else isSearchActive=true }' in files
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-toggles-repair-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish validated block 5B and retire both workflows
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflows=['.github/workflows/search-toggles.yml','.github/workflows/search-toggles-repair.yml']
          for path in workflows: Path(path).unlink()
          root='app/src/main/java/iecxiv/meshfabric/ui/'
          paths=[root+p for p in ['components/MeshFabricAppBar.kt','management/EventsHeaderPresentation.kt','management/NoticeHeaderSearch.kt','files/FileManagerScreen.kt']]+workflows
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui(search): unify blue close icons and clean search dismissal'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
