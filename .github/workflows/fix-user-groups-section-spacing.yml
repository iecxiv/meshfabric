name: Validate consistent user groups section spacing
on:
  push:
    branches: [dev]
    paths: [.github/workflows/fix-user-groups-section-spacing.yml]
permissions:
  contents: write
concurrency:
  group: fix-user-groups-section-spacing-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded spacing and results heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt')
          test=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserGroupsSectionSpacingTest.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='4f5d685fcf4dcbe97fe48db87fd72fe17476cbbc','User groups pane changed'
          assert not test.exists()
          def replace(s,old,new):
              assert s.count(old)==1,'Missing/nonunique anchor: '+old[:100]
              return s.replace(old,new,1)
          s=p.read_text()
          s=replace(s,'LazyColumn(modifier,contentPadding=PaddingValues(16.dp),verticalArrangement=Arrangement.spacedBy(8.dp))','LazyColumn(modifier,contentPadding=PaddingValues(16.dp),verticalArrangement=Arrangement.spacedBy(10.dp))')
          s=replace(s,'        item {\n            if(feedback.isNotBlank())','        item {\n            Column(Modifier.fillMaxWidth(),verticalArrangement=Arrangement.spacedBy(10.dp)) {\n            if(feedback.isNotBlank())')
          s=replace(s,'        }\n        items(rows,key={it.optString("_id")})','            }\n        }\n        if(rows.isNotEmpty()) item {Text(t("Grupos","Groups"),style=MaterialTheme.typography.titleMedium,modifier=Modifier.testTag("user-groups-list-heading"))}\n        items(rows,key={it.optString("_id")})')
          p.write_text(s)
          test.write_text('''package iecxiv.meshfabric.ui.management
          import android.content.res.Configuration
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.compose.ui.unit.dp
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.cancel
          import org.json.JSONObject
          import org.junit.Assert.assertTrue
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.util.Locale
          @RunWith(AndroidJUnit4::class) class UserGroupsSectionSpacingTest {
              @get:Rule val compose=createComposeRule()
              private class Fixture:AutoCloseable {
                  val client=MeshCentralClient();val session=ProfileSession(client)
                  override fun close() {session.close();val f=client.javaClass.getDeclaredField("scope").apply {isAccessible=true};(f.get(client) as CoroutineScope).cancel()}
              }
              @Test fun actionHeadingGapMatchesUsersColumnLayout() {Fixture().use {f->
                  compose.setContent {MaterialTheme {Row(Modifier.fillMaxWidth()) {
                      Box(Modifier.weight(1f).testTag("actual-groups")) {UserGroupsDirectoryPane(f.session,ProfileState(),onOpenUser={},onOpenDeviceGroup={})}
                      Column(Modifier.weight(1f).padding(16.dp).testTag("users-reference"),verticalArrangement=Arrangement.spacedBy(10.dp)) {
                          ServerGeneralActions {Column(Modifier.testTag("reference-action-controls")) {TextButton(onClick={}) {Text("Refresh reference")};TextButton(onClick={},enabled=false) {Text("Create reference")}}}
                      }
                  }}}
                  val heading=androidx.test.platform.app.InstrumentationRegistry.getInstrumentation().targetContext.getString(iecxiv.meshfabric.R.string.my_server_actions)
                  val actualHeading=compose.onNode(hasText(heading) and hasAnyAncestor(hasTestTag("actual-groups"))).fetchSemanticsNode().boundsInRoot
                  val referenceHeading=compose.onNode(hasText(heading) and hasAnyAncestor(hasTestTag("users-reference"))).fetchSemanticsNode().boundsInRoot
                  val actualControls=compose.onNodeWithTag("user-groups-server-actions").fetchSemanticsNode().boundsInRoot
                  val referenceControls=compose.onNodeWithTag("reference-action-controls").fetchSemanticsNode().boundsInRoot
                  val actualGap=actualControls.top-actualHeading.bottom
                  val referenceGap=referenceControls.top-referenceHeading.bottom
                  assertTrue("Action heading must precede controls",actualGap>=0f)
                  assertTrue("Group spacing must match the Users reference",kotlin.math.abs(actualGap-referenceGap)<=1f)
              }}
              @Test fun resultsHeadingPrecedesGroupsAndIsAbsentWhenNoGroupsExist() {Fixture().use {f->
                  val state=androidx.compose.runtime.mutableStateOf(ProfileState(listedUserGroups=listOf(JSONObject().put("_id","ugrp//one").put("name","Oficina")),userGroupPhase="ready"))
                  compose.setContent {
                      val config=Configuration(LocalConfiguration.current).apply {setLocale(Locale("es"))}
                      CompositionLocalProvider(LocalConfiguration provides config) {MaterialTheme {UserGroupsDirectoryPane(f.session,state.value,onOpenUser={},onOpenDeviceGroup={})}}
                  }
                  compose.onNodeWithTag("user-groups-list-heading").performScrollTo().assertTextEquals("Grupos")
                  val title=compose.onNodeWithTag("user-groups-list-heading").fetchSemanticsNode().boundsInRoot
                  compose.onNodeWithText("Oficina").performScrollTo().assertExists()
                  compose.runOnIdle {state.value=state.value.copy(listedUserGroups=emptyList())}
                  compose.onNodeWithTag("user-groups-list-heading").assertDoesNotExist()
                  assertTrue(title.height>0f)
              }}
          }
          ''')
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, compile Android tests, execute unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute offline spacing, heading and navigation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.UserGroupsSectionSpacingTest,iecxiv.meshfabric.ui.management.UserGroupsActionsCardTest,iecxiv.meshfabric.ui.management.ProfilePolishPresentationTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest,iecxiv.meshfabric.ui.management.ProfileAccessAssignmentNavigationTest,iecxiv.meshfabric.ui.management.ReceivedUserGroupNavigationTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-groups-section-spacing-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only after validation and if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserGroupsSectionSpacingTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/management/UserGroupsSectionSpacingTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected,'Unexpected staged files'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): align group action spacing and add results heading'
          git push origin HEAD:dev
