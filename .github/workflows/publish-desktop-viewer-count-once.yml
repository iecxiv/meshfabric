name: Publish desktop viewer count once
'on':
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-viewer-count-once.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-desktop-viewer-count-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply verified changes and stage self-removal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess, xml.etree.ElementTree as ET
          B='app/src/main/java/iecxiv/meshfabric/'
          W='.github/workflows/publish-desktop-viewer-count-once.yml'
          def require(ok,message):
              if not ok: raise SystemExit(message)
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def path(name):
              p=Path(name)
              require(Path.cwd().resolve() in p.resolve().parents and not p.is_symlink(),'Unsafe path: '+name)
              return p
          def source(name,expected):
              data=path(name).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              require(digest==expected,'Source changed: '+name)
              return data.decode('utf-8')
          def replace(text,old,new):
              require(text.count(old)==1,'Missing or ambiguous anchor: '+old)
              return text.replace(old,new,1)
          require(os.environ['GITHUB_REPOSITORY']=='iecxiv/meshfabric','Wrong repository')
          require(os.environ['GITHUB_REF']=='refs/heads/dev','Wrong branch')
          require(git('rev-parse','HEAD')==os.environ['GITHUB_SHA'],'Wrong checkout')
          require(not git('status','--porcelain'),'Dirty checkout')
          relay=B+'data/remote/DesktopRelayClient.kt'
          screen=B+'ui/desktop/RemoteDesktopScreen.kt'
          r=source(relay,'5855a8e0d4a5370b83192f06c12416c10cadfc2c')
          s=source(screen,'3d300d202c1e6f367406d9760f274b93a3356f23')
          r=replace(r,'    val connectionState: StateFlow<Boolean> = _connectionState.asStateFlow()\n','    val connectionState: StateFlow<Boolean> = _connectionState.asStateFlow()\n    private val _viewerCount = MutableStateFlow<Int?>(null)\n    val viewerCount: StateFlow<Int?> = _viewerCount.asStateFlow()\n')
          r=replace(r,'    private fun retireSocket() {\n','    private fun retireSocket() {\n        _viewerCount.value = null\n')
          r=replace(r,'                "metadata" -> Unit // Viewer metadata must not trigger a stream refresh.\n','                "metadata" -> {\n                    _viewerCount.value = desktopViewerCount(json)\n                }\n')
          s=replace(s,'text = if (isConnected) stringResource(R.string.status_connected) else stringResource(R.string.status_connecting),','text = desktopConnectionStatusText(viewModel, nodeId, isConnected),')
          planned={relay:r,screen:s}
          new={
              B+'data/remote/DesktopViewerMetadata.kt': 'package iecxiv.meshfabric.data.remote\n\nimport com.google.gson.JsonObject\n\ninternal fun desktopViewerCount(metadata: JsonObject): Int? {\n    val users = metadata.get("users")?.takeIf { it.isJsonObject }?.asJsonObject ?: return null\n    var total = 0L\n    for ((_, value) in users.entrySet()) {\n        if (!value.isJsonPrimitive || !value.asJsonPrimitive.isNumber) return null\n        val count = value.asString.toLongOrNull() ?: return null\n        if (count !in 1L..Int.MAX_VALUE.toLong()) return null\n        total += count\n        if (total > Int.MAX_VALUE) return null\n    }\n    return total.takeIf { it > 0L }?.toInt()\n}\n',
              B+'ui/desktop/DesktopConnectionStatus.kt': 'package iecxiv.meshfabric.ui.desktop\n\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.collectAsState\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.remember\nimport androidx.compose.ui.res.stringResource\nimport iecxiv.meshfabric.R\n\n@Composable internal fun desktopConnectionStatusText(\n    viewModel: RemoteDesktopViewModel,\n    nodeId: String,\n    connected: Boolean\n): String {\n    val session = remember(viewModel, nodeId) {\n        viewModel.desktopClient.getSession(viewModel.meshClient, nodeId)\n    }\n    val viewerCount by session.viewerCount.collectAsState()\n    if (!connected) return stringResource(R.string.status_connecting)\n    val connectedText = stringResource(R.string.status_connected)\n    val count = viewerCount\n    return if (count != null && count > 1) {\n        stringResource(R.string.desktop_connected_viewers, connectedText, count)\n    } else connectedText\n}\n',
              'app/src/test/java/iecxiv/meshfabric/data/remote/DesktopViewerMetadataTest.kt': 'package iecxiv.meshfabric.data.remote\n\nimport com.google.gson.JsonParser\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass DesktopViewerMetadataTest {\n    private fun count(json: String) = desktopViewerCount(JsonParser.parseString(json).asJsonObject)\n    @Test fun oneViewer() { assertEquals(1, count("""{"users":{"user//a":1}}""")) }\n    @Test fun twoAccounts() { assertEquals(2, count("""{"users":{"user//a":1,"user//b":1}}""")) }\n    @Test fun sameAccountCountsAllViewers() { assertEquals(3, count("""{"users":{"user//a":3}}""")) }\n    @Test fun mixedAccountsSumConnections() { assertEquals(3, count("""{"users":{"user//a":2,"user//b":1}}""")) }\n    @Test fun missingAndEmptyAreUnknown() {\n        for (json in listOf("{}", """{"users":null}""", """{"users":{}}""", """{"users":[]}""")) assertNull(count(json))\n    }\n    @Test fun malformedValuesAreRejected() {\n        for (json in listOf("""{"users":{"a":0}}""", """{"users":{"a":-1}}""", """{"users":{"a":1.5}}""", """{"users":{"a":true}}""", """{"users":{"a":"2"}}""", """{"users":{"a":null}}""", """{"users":{"a":{}}}""", """{"users":{"a":[]}}""")) assertNull(count(json))\n    }\n    @Test fun overflowIsRejected() {\n        assertNull(count("""{"users":{"a":2147483648}}"""))\n        assertNull(count("""{"users":{"a":2147483647,"b":1}}"""))\n    }\n}\n'
          }
          for folder,label in [('values','viewing'),('values-en','viewing'),('values-es','viendo')]:
              for existing in Path('app/src/main/res/'+folder).glob('*.xml'):
                  require(all(n.attrib.get('name')!='desktop_connected_viewers' for n in ET.parse(existing).getroot()),'Resource name collision')
              content='<resources>\n    <string name="desktop_connected_viewers">%1$s, %2$d '+label+'</string>\n</resources>\n'
              ET.fromstring(content)
              new['app/src/main/res/'+folder+'/desktop_viewers.xml']=content
          require(len(planned)==2 and len(new)==6,'Wrong change count')
          for name in new: require(not path(name).exists(),'New file already exists: '+name)
          planned.update(new)
          for name,content in planned.items():
              p=path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(content.encode('utf-8'))
          path(W).unlink()
          subprocess.run(['git','add','--',*planned,W],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(planned)|{W},'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit and push only if dev has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): show live viewer count in English and Spanish'
          git push origin HEAD:refs/heads/dev
          echo "Published $(git rev-parse HEAD); temporary workflow removed. Build, lint and tests were NOT run." >> "$GITHUB_STEP_SUMMARY"
