name: Stable file bottom bar height
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/stable-file-bottom-bar.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve FAB height without rendering a hidden button
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/bar-base"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt')
          s = p.read_text()
          assert 'import androidx.compose.foundation.layout.heightIn' in s
          pattern = r'Box \{(\s+if \(!LocalHideRootFileFab.current\) FloatingActionButton\()'
          matches = list(re.finditer(pattern, s))
          assert len(matches) == 2, len(matches)
          for m in reversed(matches):
              tail = s[m.end():]
              end = tail.index(') {')
              args = tail[:end]
              size = re.search(r'modifier\s*=\s*Modifier\.size\((\d+)\.dp\)', args)
              assert size, args
              replacement = 'Box(modifier = Modifier.heightIn(min = ' + size.group(1) + '.dp)) {' + m.group(1)
              s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated height adjustment
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$(cat "$RUNNER_TEMP/bar-base")"
          git add app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerScreen.kt
          git rm .github/workflows/stable-file-bottom-bar.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: preserve file bottom bar height when root FAB is hidden'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-file-bottom-bar-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
