name: Apply verified file navigation recovery

on:
  push:
    branches: [reconnection-tests]
    paths: ['.github/workflows/apply-file-navigation.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-file-navigation
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/reconnection-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconnection-tests
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded session and navigation patch
        run: python3 .github/scripts/apply-file-navigation.py
      - name: Build, test and lint
        run: |
          set -euo pipefail
          git diff --check
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Publish verified navigation fix
        run: |
          set -euo pipefail
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/FileNavigationState.kt app/src/main/java/iecxiv/meshfabric/ui/files/FileManagerViewModel.kt app/src/test/java/iecxiv/meshfabric/data/remote/FileNavigationStateTest.kt
          git rm .github/scripts/apply-file-navigation.py .github/workflows/apply-file-navigation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(files): reconnect sessions while preserving navigation path'
          git push origin HEAD:refs/heads/reconnection-tests
      - name: Upload verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: file-navigation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
