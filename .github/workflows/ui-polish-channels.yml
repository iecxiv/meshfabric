name: Validate UI polish loading and channel presentation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ui-polish-channels.yml']
permissions:
  contents: write
concurrency:
  group: ui-polish-channels-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check Python syntax
        shell: python
        run: |
          import ast,textwrap
          from pathlib import Path
          lines=Path('.github/workflows/ui-polish-channels.yml').read_text().splitlines();checked=0
          for i,line in enumerate(lines):
              if line!='        run: |': continue
              body=[]
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '): break
                  body.append(following)
              ast.parse(textwrap.dedent('\n'.join(body))+'\n');checked+=1
          assert checked==3,checked
      - name: Prepare presentation fixes and audit remaining dialogs
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os,re
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='d6cb03092ba391095af3e27bc3a39d982c0150e7','Base advanced; review required'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui');changed=set()
          def edit(name,old,new,count=1):
              p=root/name;t=p.read_text();assert t.count(old)==count,(name,old,t.count(old));p.write_text(t.replace(old,new,count));changed.add(str(p))
          old='''    Column(modifier.fillMaxWidth().background(colors.first),verticalArrangement=Arrangement.spacedBy(10.dp)) {
                  Text(date,style=MaterialTheme.typography.titleSmall,color=colors.second)
                  Text(loginHistoryLabel(item.opt("m"),es)+" · "+details,style=MaterialTheme.typography.bodySmall,color=colors.second)
                  HorizontalDivider(color=scheme.outlineVariant)
              }'''
          new='''    Surface(modifier.fillMaxWidth(),shape=MaterialTheme.shapes.medium,color=colors.first,contentColor=colors.second,border=androidx.compose.foundation.BorderStroke(1.dp,colors.second.copy(alpha=0.20f))) {
                  Row(Modifier.padding(12.dp),horizontalArrangement=Arrangement.spacedBy(10.dp),verticalAlignment=androidx.compose.ui.Alignment.Top) {
                      Icon(when(accountLoginOutcome(item.opt("m"))) {true->androidx.compose.material.icons.Icons.Default.VerifiedUser;false->androidx.compose.material.icons.Icons.Default.ErrorOutline;null->androidx.compose.material.icons.Icons.Default.Info},null,Modifier.size(20.dp))
                      Column(Modifier.weight(1f),verticalArrangement=Arrangement.spacedBy(6.dp)) {
                          Text(date,style=MaterialTheme.typography.titleSmall)
                          Text(loginHistoryLabel(item.opt("m"),es),style=MaterialTheme.typography.bodyMedium)
                          if(details.isNotBlank()) Text(details,style=MaterialTheme.typography.bodySmall)
                      }
                  }
              }'''
          edit('management/PreviousLoginPresentation.kt',old,new)
          edit('management/PreviousLoginPresentation.kt','import androidx.compose.material3.*','import androidx.compose.material3.*\nimport androidx.compose.material.icons.filled.*')
          edit('management/MeshFabricDialogs.kt','Text(title,fontWeight=FontWeight.Bold,fontSize=18.sp)','Text(title)')
          menu='devices/DeviceListHeaderMenus.kt'
          edit(menu,'DropdownMenuItem(text={Text(sortLabel(option,es))},trailingIcon=','DropdownMenuItem(text={Text(sortLabel(option,es))},leadingIcon={Icon(browseSortImage(option),null,Modifier.size(20.dp))},trailingIcon=')
          edit(menu,'DropdownMenuItem(text={Text(if(es) "Invertir orden" else "Reverse order")},','DropdownMenuItem(text={Text(if(es) "Invertir orden" else "Reverse order")},leadingIcon={Icon(Icons.Default.SwapVert,null,Modifier.size(20.dp))},')
          edit(menu,'DropdownMenuItem(text={Text(filterLabel(option,es))},','DropdownMenuItem(text={Text(filterLabel(option,es))},leadingIcon={Icon(browseFilterImage(option),null,Modifier.size(20.dp))},')
          edit(menu,'DropdownMenuItem(text={Text(if(es) "Nombre de sistema operativo" else "Show OS name")},trailingIcon=','DropdownMenuItem(text={Text(if(es) "Nombre de sistema operativo" else "Show OS name")},leadingIcon={Icon(Icons.Default.Computer,null,Modifier.size(20.dp))},trailingIcon=')
          p=root/menu
          p.write_text(p.read_text()+'''\nprivate fun browseSortImage(value:DeviceListSort)=when(value) {
              DeviceListSort.GROUP->Icons.Default.Folder
              DeviceListSort.POWER->Icons.Default.PowerSettingsNew
              DeviceListSort.DEVICE->Icons.Default.Computer
              DeviceListSort.TAGS->Icons.Default.Label
              DeviceListSort.GROUP_TAGS->Icons.Default.FolderShared
              DeviceListSort.LAST_SEEN->Icons.Default.History
              DeviceListSort.LAST_BOOT->Icons.Default.RestartAlt
          }
          private fun browseFilterImage(value:DeviceListFilter)=when(value) {
              DeviceListFilter.ALL->Icons.Default.Devices
              DeviceListFilter.ONLINE->Icons.Default.Link
              DeviceListFilter.OFFLINE->Icons.Default.LinkOff
              DeviceListFilter.SESSIONS->Icons.Default.DesktopWindows
              DeviceListFilter.STARRED->Icons.Default.Star
              DeviceListFilter.AMT->Icons.Default.Memory
              DeviceListFilter.HELP->Icons.Default.LiveHelp
              DeviceListFilter.TAGGED->Icons.Default.Label
              DeviceListFilter.UNTAGGED->Icons.Default.LabelOff
          }
          ''')
          edit('management/ServerEventsControls.kt','EventFilterButton(label,"log-event-count",enabled)','EventFilterButton(label,"log-event-count",enabled,if(selection.limit==null) Icons.Default.AllInclusive else Icons.Default.History)')
          edit('management/ServerEventsControls.kt','EventFilterOption(label,"log-event-limit-$value","log-event-limit-text-$value")','EventFilterOption(label,"log-event-limit-$value","log-event-limit-text-$value",if(value==0) Icons.Default.AllInclusive else Icons.Default.History)')
          edit('management/ServerEventsControls.kt','testTag(tag.replace("log-event-type-","log-event-type-icon-"))','testTag(if(tag.startsWith("log-event-type-")) tag.replace("log-event-type-","log-event-type-icon-") else tag+"-icon")')
          loading='components/BottomViewLoading.kt'
          p=root/loading;p.write_text(p.read_text()+'\n@Composable internal fun ReportViewLoading(active:Boolean) {if(active) RoutedViewLoadingIndicator()}\n');changed.add(str(p))
          bare=re.compile(r'(?<![\w.])LinearProgressIndicator\(\s*\)');routed=[]
          for p in root.rglob('*.kt'):
              if str(p)==str(root/loading): continue
              t=p.read_text();updated,count=bare.subn('iecxiv.meshfabric.ui.components.RoutedViewLoadingIndicator()',t)
              if count: p.write_text(updated);changed.add(str(p));routed.append([str(p),count])
          edit('management/ProfileScreen.kt','val state=rememberProfileDialogPresentation(liveState,agentIdentity,agentActor?.id.orEmpty())','val state=rememberProfileDialogPresentation(liveState,agentIdentity,agentActor?.id.orEmpty())\niecxiv.meshfabric.ui.components.ReportViewLoading(liveState.loading || liveState.busy || liveState.detailsBusy || liveState.historyBusy || liveState.userGroupPhase=="loading")')
          edit('management/NoticeCenterScreen.kt','val state by session.state.collectAsState()','val state by session.state.collectAsState()\n    iecxiv.meshfabric.ui.components.ReportViewLoading(state.loading || state.busy || state.detailsBusy || state.historyBusy)')
          edit('management/NoticeInbox.kt','val s by inbox.state.collectAsState()','val s by inbox.state.collectAsState()\niecxiv.meshfabric.ui.components.ReportViewLoading(s.storageLoading || s.storageSaving)')
          edit('management/MyServerScreen.kt','val resultDialog=rememberServerReadDialog(state.result,state.resultKind,readIdentity)','iecxiv.meshfabric.ui.components.ReportViewLoading(state.pending.isNotEmpty() || (!state.ready && !state.failed))\n    val resultDialog=rememberServerReadDialog(state.result,state.resultKind,readIdentity)')
          edit('devices/DeviceListScreen.kt','val connection by viewModel.connectionStatus.collectAsState()','val connection by viewModel.connectionStatus.collectAsState()\n    iecxiv.meshfabric.ui.components.ReportViewLoading(connection==ConnectionStatus.CONNECTING)')
          edit('devices/DeviceDetailsDialog.kt','val identityTitle = if (es) "Identificación" else "Identification"','if(inline) iecxiv.meshfabric.ui.components.ReportViewLoading(inventory.pending.isNotEmpty())\n    val identityTitle = if (es) "Identificación" else "Identification"')
          edit('management/LogEventsReader.kt','val state=mutable.asStateFlow()','val state=mutable.asStateFlow()\n    private val channel=MutableStateFlow(false)\n    val channelReady=channel.asStateFlow()')
          edit('management/LogEventsReader.kt','val scope=ServerEventsScope(b.server,b.actor,epoch,authority);queryScope=scope','val scope=ServerEventsScope(b.server,b.actor,epoch,authority);queryScope=scope;channel.value=true')
          edit('management/LogEventsReader.kt','epoch++;timer?.cancel();timer=null;binding=null;queryScope=null;gate.invalidate()','channel.value=false;epoch++;timer?.cancel();timer=null;binding=null;queryScope=null;gate.invalidate()')
          edit('management/LogScreen.kt','val state by reader.state.collectAsState()','val state by reader.state.collectAsState()\n    val channelReady by reader.channelReady.collectAsState()')
          panel='ServerEventsPanel(visible,query,{query=it},connected && !actor?.id.isNullOrBlank(),{reader.load(selection)},Modifier.fillMaxSize().padding(padding).consumeWindowInsets(padding),selection=selection,onSelection={selectedType=it.type.name;selectedLimit=it.limit ?: 0},inventory=inventory)'
          replacement='Column(Modifier.fillMaxSize().padding(padding).consumeWindowInsets(padding)) {\n            ManagementConnectionStatus(ready=channelReady,connecting=visible.phase==ServerEventsPhase.LOADING && !channelReady,reconnectEnabled=connected && !actor?.id.isNullOrBlank(),modifier=Modifier.padding(horizontal=16.dp),onReconnect={reader.load(selection)})\n            ServerEventsPanel(visible,query,{query=it},connected && !actor?.id.isNullOrBlank(),{reader.load(selection)},Modifier.weight(1f).fillMaxWidth(),selection=selection,onSelection={selectedType=it.type.name;selectedLimit=it.limit ?: 0},inventory=inventory)\n        }'
          edit('management/LogScreen.kt',panel,replacement)
          edit('components/MeshFabricAppBar.kt','if(!actionsReady) Text(actionsStatus,style=MaterialTheme.typography.labelMedium,color=MaterialTheme.colorScheme.onSurfaceVariant)','iecxiv.meshfabric.ui.components.ReportViewLoading(!actionsReady && iecxiv.meshfabric.ui.management.actionChannelConnecting(actionsStatus))\n            iecxiv.meshfabric.ui.management.ManagementConnectionStatus(ready=actionsReady,connecting=iecxiv.meshfabric.ui.management.actionChannelConnecting(actionsStatus),reconnectEnabled=connected,onReconnect=onReconnect)')
          title='Text(t("Avisos","Notices"),style=MaterialTheme.typography.titleMedium)'
          edit('management/NoticeInbox.kt',title,'Text(t("Avisos recibidos en la app","Notices received in the app"),style=MaterialTheme.typography.titleMedium)')
          disconnected='if(!connected) Text(t("Canal de avisos desconectado. Se conserva lo ya recibido en esta sesión.","Notice channel disconnected. Already received session entries are retained."),style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.error)'
          edit('management/NoticeInbox.kt',disconnected,'Text(noticeChannelLabel(es,connected),style=MaterialTheme.typography.bodySmall,color=if(connected) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.error)')
          p=root/'management/UiPolishPolicy.kt';assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          internal fun actionChannelConnecting(status:String)=status in setOf("Conectando acciones…","Connecting action channel…")
          internal fun noticeChannelLabel(es:Boolean,connected:Boolean)=if(connected) {
              if(es) "Canal de gestión conectado. La recepción depende de los permisos y preferencias de la cuenta." else "Management channel connected. Reception depends on account permissions and preferences."
          } else {
              if(es) "Canal de gestión desconectado. Los avisos guardados siguen disponibles." else "Management channel disconnected. Saved notices remain available."
          }
          ''');changed.add(str(p))
          p=Path('app/src/test/java/iecxiv/meshfabric/ui/management/UiPolishPolicyTest.kt');assert not p.exists()
          p.write_text('''package iecxiv.meshfabric.ui.management
          import org.junit.Assert.*
          import org.junit.Test
          class UiPolishPolicyTest {
              @Test fun channelConnectingOnlyMatchesActualConnectingStates() {
                  assertTrue(actionChannelConnecting("Conectando acciones…"))
                  assertTrue(actionChannelConnecting("Connecting action channel…"))
                  assertFalse(actionChannelConnecting("Acciones conectadas"))
                  assertFalse(actionChannelConnecting("Action channel disconnected; remote sessions have not been closed"))
                  assertFalse(actionChannelConnecting(""))
              }
              @Test fun disconnectedInboxDoesNotClaimSavedDataWasLost() {
                  assertTrue(noticeChannelLabel(true,false).contains("guardados siguen disponibles"))
                  assertTrue(noticeChannelLabel(false,false).contains("Saved notices remain available"))
                  assertTrue(noticeChannelLabel(true,true).contains("permisos"))
                  assertTrue(noticeChannelLabel(false,true).contains("preferences"))
              }
          }
          ''');changed.add(str(p))
          audit=[]
          for p in root.rglob('*.kt'):
              for number,line in enumerate(p.read_text().splitlines(),1):
                  if re.search(r'(?<![\w.])(?:AlertDialog|Dialog)\s*\(',line) or ('dialog' in p.name.lower() and 'fontSize' in line):
                      audit.append({'path':str(p),'line':number,'candidate':line.strip()[:400]})
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'dialog-style-audit.json').write_text(json.dumps({'scope':'Source candidates only; not a completed visual review. Intentional wrappers and dialogs outside Management may remain.','candidates':audit,'additionalRoutedIndicators':routed},ensure_ascii=False,indent=2))
          actual=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines());assert actual==changed
          (temp/'ui-polish-paths.json').write_text(json.dumps(sorted(changed)))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests execute unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/dialog-style-audit.json
            ${{ runner.temp }}/ui-polish-paths.json
          if-no-files-found: ignore
      - name: Apply validated changes and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'ui-polish-paths.json').read_text())
          assert all((p.startswith('app/src/main/java/iecxiv/meshfabric/ui/') and p.endswith('.kt')) or p=='app/src/test/java/iecxiv/meshfabric/ui/management/UiPolishPolicyTest.kt' for p in paths)
          workflow='.github/workflows/ui-polish-channels.yml';Path(workflow).unlink();paths.append(workflow)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','ui: polish login history menus loading and management channel status'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
