name: Fix keepalive API 26 icon compatibility
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-keepalive-api26.yml']
permissions:
  contents: write
concurrency:
  group: fix-keepalive-api26
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded notification icon compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/iecxiv/meshfabric/service/KeepAliveService.kt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == 'ef707f7d42cd1a1b15cf70936998fc46f50856b6', 'KeepAliveService changed; review required'
          s = p.read_text()
          def once(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old,new,1)
          once('previous.smallIcon?.resId != icon', 'smallIconResourceId(previous) != icon')
          once('val icons = active.mapNotNull { it.smallIcon }.filter { it.type == android.graphics.drawable.Icon.TYPE_RESOURCE }.map { it.resId }', 'val icons = active.map { smallIconResourceId(it) }.filter { it != 0 }')
          helper = '''    private fun smallIconResourceId(notification: Notification): Int {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      val icon = notification.smallIcon ?: return 0
                      return if (icon.type == android.graphics.drawable.Icon.TYPE_RESOURCE) icon.resId else 0
                  }
                  // Resource ID supplied by setSmallIcon(int), available on API 26 and 27.
                  return notification.extras.getInt(Notification.EXTRA_SMALL_ICON, 0)
              }

          '''
          once('    private fun currentStatusIcon(): Int {', helper + '    private fun currentStatusIcon(): Int {')
          p.write_text(s)
          PY
          git diff --check
      - name: Build, test and lint with the main quality gate
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish only the validated service fix
        run: |
          git add app/src/main/java/iecxiv/meshfabric/service/KeepAliveService.kt
          git rm .github/workflows/fix-keepalive-api26.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: read keepalive notification icons safely on Android API 26 and 27'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keepalive-api26-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
