name: Validate right-click cleanup (fast)
on:
  push:
    branches: [dev]
    paths: [.github/workflows/desktop-right-click-cleanup.yml]
permissions:
  contents: write
concurrency:
  group: desktop-right-click-cleanup-publication
  cancel-in-progress: false
env:
  EMULATOR_CLASSES: iecxiv.meshfabric.ui.desktop.DesktopRightClickOnceToggleTest,iecxiv.meshfabric.ui.desktop.DesktopMouseWindowCallbackTest
jobs:
  static:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 .github/scripts/prepare_desktop_right_click_cleanup.py
          python3 .github/scripts/prepare_desktop_right_click_en_strings.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Assemble, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --parallel --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
  emulator:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 .github/scripts/prepare_desktop_right_click_cleanup.py
          python3 .github/scripts/prepare_desktop_right_click_en_strings.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=${{ env.EMULATOR_CLASSES }}" --stacktrace
      - name: Show failing instrumentation tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              root = ET.parse(f).getroot()
              for tc in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for n in tc.findall(kind):
                          print('FAILED', tc.get('classname'), tc.get('name'))
                          print((n.get('message') or '')[:800])
                          print((n.text or '')[:2000])
          PY
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [static, emulator]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish validated candidate only on unchanged dev
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 .github/scripts/prepare_desktop_right_click_cleanup.py
          python3 .github/scripts/prepare_desktop_right_click_en_strings.py
          git add -A app
          python3 - <<'PY'
          import subprocess
          m = 'app/src/main/java/iecxiv/meshfabric/ui/desktop/'
          t = 'app/src/test/java/iecxiv/meshfabric/ui/desktop/'
          a = 'app/src/androidTest/java/iecxiv/meshfabric/ui/desktop/'
          r = 'app/src/main/res/'
          allowed = {
              m + 'DesktopMouseCapture.kt', m + 'RemoteDesktopScreen.kt', m + 'DesktopRightClickOnce.kt',
              m + 'DesktopRightClickAssist.kt', m + 'DesktopRightClickAssistPolicy.kt',
              t + 'DesktopRightClickOnceTest.kt', t + 'DesktopRightClickAssistPolicyTest.kt',
              a + 'DesktopRightClickOnceToggleTest.kt',
              r + 'values/desktop_gestures.xml', r + 'values-en/desktop_gestures.xml', r + 'values-es/desktop_gestures.xml',
              r + 'values/desktop_right_assist.xml', r + 'values-en/desktop_right_assist.xml', r + 'values-es/desktop_right_assist.xml',
              r + 'values/desktop_right_click_once.xml', r + 'values-en/desktop_right_click_once.xml', r + 'values-es/desktop_right_click_once.xml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not changed or not changed <= allowed:
              raise SystemExit('Unexpected changed files: ' + repr(sorted(changed - allowed)))
          PY
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor(desktop): remove dead floating right-click code; badge uses theme primary; fix gesture help"
          git push origin HEAD:refs/heads/dev
