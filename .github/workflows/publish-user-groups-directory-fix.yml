name: Fix user groups tab order regression and publish
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-user-groups-directory-fix.yml]
permissions:
  contents: write
concurrency:
  group: publish-user-groups-directory-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ylianst/MeshCentral
          ref: f436143527458d56da0336ea3047c006703fb4e4
          path: .meshcentral-reference
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply pinned original scripts and update only the tab-order expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          workflow=Path('.github/workflows/publish-user-groups-directory.yml')
          test=Path('app/src/test/java/iecxiv/meshfabric/ui/management/ProfileAccountPolicyTest.kt')
          expected={workflow:'6991a4005a9a3f1e559632cc345f99e797cdac52',test:'d02d2f99a6c25d0e687a41e6b518b5bf07784db0'}
          for path,sha in expected.items():
              if subprocess.check_output(['git','hash-object',str(path)],text=True).strip()!=sha:raise RuntimeError('Base changed: '+str(path))
          def python_blocks(text):
              lines=text.splitlines();blocks=[];i=0
              while i<len(lines):
                  line=lines[i]
                  if line.strip()!="python3 - <<'PY'":i+=1;continue
                  prefix=line[:len(line)-len(line.lstrip())];body=[];i+=1
                  while i<len(lines) and lines[i]!=prefix+'PY':
                      current=lines[i]
                      if not current.strip():body.append('')
                      elif current.startswith(prefix):body.append(current[len(prefix):])
                      else:raise RuntimeError('Unexpected heredoc indentation')
                      i+=1
                  if i==len(lines):raise RuntimeError('Unclosed heredoc')
                  code='\n'.join(body)+'\n';compile(code,'reviewed-original-script','exec');blocks.append(code);i+=1
              if len(blocks)!=2:raise RuntimeError('Expected exactly two reviewed scripts')
              return blocks
          blocks=python_blocks(workflow.read_text())
          old='@Test fun sectionOrderUsesStableKeys() { assertEquals(listOf("account","groups","users"),profileSectionKeys) }'
          new='@Test fun sectionOrderUsesStableKeys() { assertEquals(listOf("account","groups","users","userGroups"),profileSectionKeys) }'
          original=test.read_text()
          if original.count(old)!=1:raise RuntimeError('Test anchor changed')
          updated=original.replace(old,new,1)
          if updated.replace(new,old,1)!=original:raise RuntimeError('Unexpected test modifications')
          for code in blocks:exec(compile(code,'reviewed-original-script','exec'),{'__name__':'__main__'})
          test.write_text(updated)
          PY
          git diff --check
          git diff --stat
      - name: Build, compile Android tests, run all unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-groups-directory-fix-${{ github.run_id }}
          path: |
            docs/reference/meshcentral-1.3.1-user-groups-broadcast/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish tab, references and corrected regression test together
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt app/src/main/java/iecxiv/meshfabric/ui/management/ProfileSession.kt app/src/main/java/iecxiv/meshfabric/ui/management/ProfileAccountPolicy.kt app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryTest.kt app/src/test/java/iecxiv/meshfabric/ui/management/ProfileAccountPolicyTest.kt docs/reference/meshcentral-1.3.1-user-groups-broadcast/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): publish user groups tab with updated stable-key regression test'
          git push origin HEAD:dev
