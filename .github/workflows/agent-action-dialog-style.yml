name: Validate agent action dialog styling
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/agent-action-dialog-style.yml']
permissions:
  contents: write
concurrency:
  group: agent-action-dialog-style-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare block 1 only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='59faa642e1700b8ca5cd325050c9ed27bdd5c1f2'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/agent-action-dialog-style.yml'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/devices')
          paths=[root/'DeviceAgentConsoleScreen.kt',root/'DeviceAgentCoreUploadAction.kt']
          for p in paths:
              s=p.read_text()
              original=s
              def replace(old,new):
                  global s
                  assert s.count(old)==1,(str(p),old)
                  s=s.replace(old,new,1)
              target='Text(t("Dispositivo: ","Device: ")+nodeName);Text(nodeId,style=MaterialTheme.typography.labelSmall)'
              replace(target,'iecxiv.meshfabric.ui.components.AppDialogCard(Modifier.fillMaxWidth()) { Column(Modifier.padding(12.dp),verticalArrangement=Arrangement.spacedBy(4.dp)) { '+target+' } }')
              if p.name=='DeviceAgentConsoleScreen.kt':
                  marker='}},confirmButton={TextButton(enabled=actionEnabled(action)'
                  protected=original[original.index(marker):]
                  replace('title={Text(agentActionLabel(action,es))}','title={Row(verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(10.dp)) { Icon(Icons.Default.Settings,null,Modifier.size(20.dp),tint=MaterialTheme.colorScheme.primary);Box(Modifier.weight(1f)) {DeviceBatchDialogTitle(agentActionLabel(action,es))} }}')
                  replace('text={Column(verticalArrangement=Arrangement.spacedBy(4.dp)) {','text={Column(Modifier.verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(12.dp)) {')
                  replace('Text(agentActionDetail(action,es))','iecxiv.meshfabric.ui.components.AppDialogCard(Modifier.fillMaxWidth()) {Text(agentActionDetail(action,es),modifier=Modifier.padding(12.dp),style=MaterialTheme.typography.bodyMedium)}')
                  assert s[s.index(marker):]==protected
              else:
                  marker='}},confirmButton={TextButton(enabled=state.phase=="ready" && file!=null'
                  protected=original[original.index(marker):]
                  replace('import androidx.compose.material3.*','import androidx.compose.material3.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.UploadFile')
                  replace('title={Text(t("Cargar archivo de núcleo","Upload a core file"))}','title={Row(verticalAlignment=androidx.compose.ui.Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(10.dp)) {Icon(Icons.Default.UploadFile,null,Modifier.size(20.dp),tint=MaterialTheme.colorScheme.primary);Box(Modifier.weight(1f)) {DeviceBatchDialogTitle(t("Cargar archivo de núcleo","Upload a core file"))} }}')
                  replace('verticalArrangement=Arrangement.spacedBy(6.dp)','verticalArrangement=Arrangement.spacedBy(12.dp)')
                  assert s[s.index(marker):]==protected
                  replace('title={Text(t("Cerrar carga","Close upload"))}','title={DeviceBatchDialogTitle(t("Cerrar carga","Close upload"))}')
              p.write_text(s)
          assert set(git('diff','--name-only').splitlines())==set(map(str,paths))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Compile app and UI tests run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-action-dialog-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish block 1 and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow='.github/workflows/agent-action-dialog-style.yml'
          Path(workflow).unlink()
          paths=['app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentConsoleScreen.kt','app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceAgentCoreUploadAction.kt',workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(agent-console): unify agent action dialog titles and layout'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
