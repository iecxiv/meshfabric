name: Validate and publish agent invitation replies
on:
  push:
    branches: [add-device-invite]
    paths: [.github/workflows/publish-agent-invitation-replies.yml]
permissions:
  contents: write
concurrency:
  group: publish-agent-invitation-replies
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check approved base
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = add-device-invite
          test "$(git rev-parse HEAD^)" = 1823254b747ed0dcb5af21566fc0cd422e9a66a0
          test -f app/src/main/java/iecxiv/meshfabric/data/remote/AgentInvitationContract.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare validated reply handling and regression tests
        run: |
          set -euo pipefail
          production=app/src/main/java/iecxiv/meshfabric/data/remote/AgentInvitationReplies.kt
          tests=app/src/test/java/iecxiv/meshfabric/data/remote/AgentInvitationRepliesTest.kt
          test ! -e "$production"
          test ! -e "$tests"
          cat > "$production" <<'KOTLIN'
          package iecxiv.meshfabric.data.remote

          import com.google.gson.JsonObject
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull

          internal sealed class AgentInvitationOutcome {
              data class GroupLink(val url:String,val hours:Int):AgentInvitationOutcome()
              data class ShareCreated(val publicId:String,val url:String):AgentInvitationOutcome()
              data class Rejected(val reason:String):AgentInvitationOutcome()
              object EmailAccepted:AgentInvitationOutcome()
              object ShareRemoved:AgentInvitationOutcome()
              object Unknown:AgentInvitationOutcome()
              object Malformed:AgentInvitationOutcome()
          }

          internal class AgentInvitationExchange(val action:String,val target:String,val responseId:String) {
              private var finished=false
              @Synchronized fun receive(reply:JsonObject):AgentInvitationOutcome? {
                  if(finished) return null
                  val outcome=AgentInvitationReplies.parse(action,target,responseId,reply) ?: return null
                  finished=true
                  return outcome
              }
              @Synchronized fun expire():AgentInvitationOutcome? {
                  if(finished) return null
                  finished=true
                  return AgentInvitationOutcome.Unknown
              }
          }

          internal object AgentInvitationReplies {
              private fun text(o:JsonObject,key:String):String? = o.get(key)?.takeIf { it.isJsonPrimitive && it.asJsonPrimitive.isString }?.asString
              private fun whole(o:JsonObject,key:String):Int? {
                  val e=o.get(key) ?: return null
                  if(!e.isJsonPrimitive || !e.asJsonPrimitive.isNumber) return null
                  val d=e.asDouble
                  return if(d>=0.0 && d<=99999.0 && d%1.0==0.0) d.toInt() else null
              }
              private fun safeUrl(value:String,leaf:String):String? {
                  if(value.length>4096 || value.any { it.isISOControl() || it.isWhitespace() }) return null
                  val url=value.toHttpUrlOrNull() ?: return null
                  if(url.scheme!="https" || url.username.isNotEmpty() || url.password.isNotEmpty()) return null
                  if(!url.encodedPath.endsWith("/"+leaf) || url.queryParameter("c").isNullOrBlank()) return null
                  return value
              }
              fun parse(expected:String,target:String,responseId:String,reply:JsonObject):AgentInvitationOutcome? {
                  if(responseId.isBlank() || text(reply,"responseid")!=responseId) return null
                  val action=text(reply,"action") ?: return null
                  val aliased=expected in setOf("createDeviceShareLink","removeDeviceShare") && action=="deviceShares"
                  if(action!=expected && !aliased) return null
                  val result=text(reply,"result")
                  if(reply.has("result") && result==null) return AgentInvitationOutcome.Malformed
                  if(result!=null && !result.equals("ok",true)) return AgentInvitationOutcome.Rejected(result.take(200))
                  if(aliased) return AgentInvitationOutcome.Malformed
                  return when(expected) {
                      "createInviteLink"->{
                          val hours=whole(reply,"expire")
                          val url=text(reply,"url")?.let { safeUrl(it,"agentinvite") }
                          if(text(reply,"meshid")==target && hours!=null && url!=null) AgentInvitationOutcome.GroupLink(url,hours) else AgentInvitationOutcome.Malformed
                      }
                      "inviteAgent"->if(result!=null) AgentInvitationOutcome.EmailAccepted else AgentInvitationOutcome.Malformed
                      "createDeviceShareLink"->{
                          val publicId=text(reply,"publicid")
                          val url=text(reply,"url")?.let { safeUrl(it,"sharing") }
                          if(result!=null && text(reply,"nodeid")==target && publicId!=null && publicId.length in 1..128 && publicId.none { it.isISOControl() } && url!=null) AgentInvitationOutcome.ShareCreated(publicId,url) else AgentInvitationOutcome.Malformed
                      }
                      "removeDeviceShare"->if(result!=null) AgentInvitationOutcome.ShareRemoved else null
                      else->AgentInvitationOutcome.Malformed
                  }
              }
          }
          KOTLIN
          cat > "$tests" <<'KOTLIN'
          package iecxiv.meshfabric.data.remote

          import com.google.gson.JsonObject
          import com.google.gson.JsonParser
          import org.junit.Assert.*
          import org.junit.Test

          class AgentInvitationRepliesTest {
              private fun j(text:String):JsonObject=JsonParser.parseString(text).asJsonObject
              private fun parse(action:String,target:String,id:String,reply:JsonObject)=AgentInvitationReplies.parse(action,target,id,reply)
              private val mesh="mesh//abc"
              private val node="node//n"
              private val link=j("""{"action":"createInviteLink","meshid":"mesh//abc","url":"https://example.test/proxy/agentinvite?c=secret","expire":24,"cookie":"secret","responseid":"r"}""")
              private val ok=j("""{"action":"inviteAgent","responseid":"r","result":"ok"}""")
              private val share=j("""{"action":"createDeviceShareLink","nodeid":"node//n","guestname":"Guest","p":2,"expire":1760000000000,"consent":65,"viewOnly":false,"responseid":"r","result":"OK","url":"https://example.test/sharing?c=secret","publicid":"public-id"}""")
              private fun linkWith(url:String):JsonObject=link.deepCopy().apply { addProperty("url",url) }
              @Test fun groupLinkNeedsExactGroupAndCorrelation() {
                  assertEquals(AgentInvitationOutcome.GroupLink("https://example.test/proxy/agentinvite?c=secret",24),parse("createInviteLink",mesh,"r",link))
                  assertEquals(AgentInvitationOutcome.Malformed,parse("createInviteLink","mesh//other","r",link))
              }
              @Test fun emailOkOnlyMeansServerAcceptedRequest() { assertEquals(AgentInvitationOutcome.EmailAccepted,parse("inviteAgent",mesh,"r",ok)) }
              @Test fun shareCreatedKeepsPublicIdentifierAndHttpsLink() {
                  assertEquals(AgentInvitationOutcome.ShareCreated("public-id","https://example.test/sharing?c=secret"),parse("createDeviceShareLink",node,"r",share))
                  assertEquals(AgentInvitationOutcome.Malformed,parse("createDeviceShareLink","node//other","r",share))
              }
              @Test fun deniedAliasIsRejectedOnlyForShareOperations() {
                  val denied=j("""{"action":"deviceShares","responseid":"r","result":"Access denied"}""")
                  val rejected=AgentInvitationOutcome.Rejected("Access denied")
                  assertEquals(rejected,parse("createDeviceShareLink",node,"r",denied))
                  assertEquals(rejected,parse("removeDeviceShare",node,"r",denied))
                  assertNull(parse("createInviteLink",mesh,"r",denied))
              }
              @Test fun removalWaitsForFinalResultAndKeepsRejection() {
                  val first=j("""{"action":"removeDeviceShare","responseid":"r","nodeid":"node//n","publicid":"p","removed":{"publicid":"p"}}""")
                  val done=j("""{"action":"removeDeviceShare","responseid":"r","result":"OK"}""")
                  val missing=j("""{"action":"removeDeviceShare","responseid":"r","result":"Invalid device share identifier."}""")
                  assertNull(parse("removeDeviceShare",node,"r",first))
                  assertEquals(AgentInvitationOutcome.ShareRemoved,parse("removeDeviceShare",node,"r",done))
                  assertEquals(AgentInvitationOutcome.Rejected("Invalid device share identifier."),parse("removeDeviceShare",node,"r",missing))
              }
              @Test fun staleOrUncorrelatedRepliesAreIgnored() {
                  assertNull(parse("inviteAgent",mesh,"new",ok))
                  assertNull(parse("createInviteLink",mesh,"r",ok))
                  assertNull(parse("inviteAgent",mesh,"r",j("""{"action":"inviteAgent","result":"ok"}""")))
              }
              @Test fun exchangeCompletesOnceAndIgnoresLateReplies() {
                  val exchange=AgentInvitationExchange("inviteAgent",mesh,"r")
                  assertEquals(AgentInvitationOutcome.EmailAccepted,exchange.receive(ok))
                  assertNull(exchange.receive(ok))
                  assertNull(exchange.expire())
              }
              @Test fun timeoutIsUnknownNotRejection() {
                  val exchange=AgentInvitationExchange("inviteAgent",mesh,"r")
                  assertEquals(AgentInvitationOutcome.Unknown,exchange.expire())
                  assertNull(exchange.receive(ok))
              }
              @Test fun unsafeOrIncompleteLinksAreMalformed() {
                  listOf("http://example.test/agentinvite?c=x","https://user:pw@example.test/agentinvite?c=x","https://example.test/other?c=x","https://example.test/agentinvite","https://example.test/agentinvite?c=x y").forEach {
                      assertEquals(it,AgentInvitationOutcome.Malformed,parse("createInviteLink",mesh,"r",linkWith(it)))
                  }
              }
              @Test fun nonTextResultIsMalformed() { assertEquals(AgentInvitationOutcome.Malformed,parse("inviteAgent",mesh,"r",j("""{"action":"inviteAgent","responseid":"r","result":1}"""))) }
          }
          KOTLIN
      - name: Compile application and Android tests; execute unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Verify exact new and existing contract tests ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          expected={
            'iecxiv.meshfabric.data.remote.AgentInvitationRepliesTest':{'groupLinkNeedsExactGroupAndCorrelation','emailOkOnlyMeansServerAcceptedRequest','shareCreatedKeepsPublicIdentifierAndHttpsLink','deniedAliasIsRejectedOnlyForShareOperations','removalWaitsForFinalResultAndKeepsRejection','staleOrUncorrelatedRepliesAreIgnored','exchangeCompletesOnceAndIgnoresLateReplies','timeoutIsUnknownNotRejection','unsafeOrIncompleteLinksAreMalformed','nonTextResultIsMalformed'},
            'iecxiv.meshfabric.data.remote.AgentInvitationContractTest':{'groupAndDeviceUseDifferentUnits','temporaryAccessCannotBeUnlimited','serverDurationLimitIsNotSilentlyChanged','permissionsRespectRestrictionsAndFullMask','fileSharingUsesBitFourNotTunnelProtocolFive','restrictedDesktopForcesViewOnly','groupPolicySeparatesLanInvitesAndAgentTypes','aliasFailureNeedsExactRequestIdentity','downloadsPreserveDomainPathAndParameterValues','assistantAndBinaryHaveSeparateSelectors','mobilePayloadHasServerCertificateAndGroup','rejectsInjectedIdentifiers','emailPacketIsDistinctFromLinkPacket','revokeTargetsExactPublicIdentifier'}
          }
          found={name:[] for name in expected}
          for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=E.parse(path).getroot()
              assert not root.findall('.//failure') and not root.findall('.//error'),str(path)
              for case in root.iter('testcase'):
                  if case.get('classname') in found:
                      assert case.find('skipped') is None,case.get('name')
                      found[case.get('classname')].append(case.get('name'))
          for name,tests in expected.items():
              assert len(found[name])==len(tests) and set(found[name])==tests,(name,found[name])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-invitation-replies-validation-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 7
      - name: Publish only validated reply sources on unchanged branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = add-device-invite
          git fetch origin add-device-invite
          test "$(git rev-parse origin/add-device-invite)" = "$GITHUB_SHA"
          git add -- app/src/main/java/iecxiv/meshfabric/data/remote/AgentInvitationReplies.kt app/src/test/java/iecxiv/meshfabric/data/remote/AgentInvitationRepliesTest.kt
          python3 - <<'PY'
          import subprocess
          expected={'app/src/main/java/iecxiv/meshfabric/data/remote/AgentInvitationReplies.kt','app/src/test/java/iecxiv/meshfabric/data/remote/AgentInvitationRepliesTest.kt'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,actual
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add validated agent invitation reply handling'
          git push origin HEAD:refs/heads/add-device-invite
