name: Integrate protected batch agent actions on dev
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/integrate-managed-batch-actions.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-managed-batch-actions-dev
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply protected batch action integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/devices')
          p=root/'DeviceListBatchPower.kt'
          data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='c47c3c210b917dc6370d05e164499849c8c0a6d2','Menu changed'
          editor=r'''package iecxiv.meshfabric.ui.devices

          import com.google.gson.JsonArray
          import com.google.gson.JsonObject
          import com.google.gson.JsonParser
          import iecxiv.meshfabric.data.model.*
          import iecxiv.meshfabric.data.remote.*
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import okhttp3.*
          import java.util.UUID

          internal enum class ManagedBatchAction(val wire:String) {
              CLEAR_CORE("uploadagentcore"), DEFAULT_CORE("uploadagentcore"), UNINSTALL("uninstallagent"), REMOVE("removedevices")
          }
          internal data class ManagedBatchDraft(val action:ManagedBatchAction,val actor:String,val node:String,val mesh:String,val os:String)
          internal data class ManagedBatchState(val phase:String="loading",val draft:ManagedBatchDraft?=null,val code:String="")
          internal fun managedBatchAvailable(node:String,meta:GeneralMeta,inventory:List<Pair<MeshGroup,List<MeshNode>>>,action:ManagedBatchAction):Boolean {
              if(meta.rights !in -1L..0xffffffffL || (meta.rights and 0xffffffffL)!=0xffffffffL) return false
              val group=inventory.singleOrNull {it.first.id==meta.mesh} ?: return false
              val current=inventory.flatMap {it.second}.singleOrNull {it.id==node} ?: return false
              if(current.meshid!=meta.mesh || group.second.count {it.id==node}!=1 || group.first.mtype !in 1..4) return false
              return action==ManagedBatchAction.REMOVE || group.first.mtype==2 && (current.conn and 1)!=0
          }
          internal fun managedBatchPacket(draft:ManagedBatchDraft,actor:String,node:String,meta:GeneralMeta,
              inventory:List<Pair<MeshGroup,List<MeshNode>>>,id:String):JsonObject {
              require(deviceBatchAgentUpdateIdentity(actor,node) && draft.actor==actor && draft.node==node && draft.mesh==meta.mesh && draft.os==meta.os)
              val mesh=meta.mesh.split('/')
              require(mesh.size==3 && mesh[0]=="mesh" && mesh[1]==actor.split('/')[1] && mesh[2].isNotBlank() && meta.mesh.none {it.isISOControl()})
              require(id.isNotBlank() && id.length<=128 && id.none {it.isISOControl()})
              require(managedBatchAvailable(node,meta,inventory,draft.action))
              return JsonObject().apply {
                  addProperty("action",draft.action.wire);add("nodeids",JsonArray().apply {add(node)});addProperty("responseid",id)
                  when(draft.action) {ManagedBatchAction.CLEAR_CORE->addProperty("type","clear");ManagedBatchAction.DEFAULT_CORE->addProperty("type","default");else->Unit}
              }
          }
          internal fun managedBatchAck(p:JsonObject,draft:ManagedBatchDraft,id:String):String?=runCatching {
              if(id.isBlank() || p.get("responseid")?.asString!=id || p.get("action")?.asString!=draft.action.wire) return@runCatching null
              p.get("nodeid")?.let {if(it.asString!=draft.node) return@runCatching null}
              p.get("nodeids")?.let {if(!it.isJsonArray || it.asJsonArray.size()!=1 || it.asJsonArray[0].asString!=draft.node) return@runCatching null}
              if(p.has("error") || p.has("err")) return@runCatching "rejected"
              val result=p.get("result") ?: return@runCatching null
              if(!result.isJsonPrimitive || !result.asJsonPrimitive.isString) return@runCatching null
              when(result.asString.lowercase(java.util.Locale.ROOT)) {"ok"->"accepted";"denied","forbidden","error","access denied"->"rejected";else->null}
          }.getOrNull()
          internal fun managedBatchRemovalEvent(p:JsonObject,node:String):Boolean=runCatching {
              require(p.get("action")?.asString=="event")
              val event=p.getAsJsonObject("event")
              require(event.get("action")?.asString=="removenode")
              val raw=event.get("nodeid") ?: event.get("node") ?: return@runCatching false
              val id=if(raw.isJsonObject) raw.asJsonObject.get("_id")?.asString else raw.asString
              id==node
          }.getOrDefault(false)
          internal fun managedBatchRemovalObserved(accepted:Boolean,event:Boolean)=accepted && event

          internal class DeviceManagedBatchEditor(private val source:MeshCentralClient,private val original:MeshNode,private val action:ManagedBatchAction) {
              private val mutable=MutableStateFlow(ManagedBatchState())
              val state=mutable.asStateFlow()
              private val identity=deviceBatchPowerIdentity(source)
              private val jobs=CoroutineScope(SupervisorJob()+Dispatchers.IO)
              private var socket:WebSocket?=null
              private var closed=false;private var started=false;private var requested=false;private var attempted=false
              private var accepted=false;private var removed=false;private var tag=""
              private var reviewed:ManagedBatchDraft?=null
              private val requestId=UUID.randomUUID().toString()
              private var timer:Job?=null
              private fun same()=deviceBatchPowerSame(source,identity)
              private fun packet(name:String)=JsonObject().apply {addProperty("action",name)}
              private fun send(p:JsonObject)=!closed && same() && socket?.send(p.toString())==true
              @Synchronized private fun finish(phase:String,code:String="") {
                  if(closed) return
                  closed=true;timer?.cancel();tag=""
                  val previous=socket;socket=null
                  if(phase=="queued") previous?.close(1000,"") else previous?.cancel()
                  jobs.cancel();mutable.value=mutable.value.copy(phase=phase,code=code)
              }
              private fun fail(code:String)=finish("error",if(attempted) "unconfirmed" else code)
              private fun deadline(afterSend:Boolean=false) {
                  timer?.cancel();timer=jobs.launch {delay(if(afterSend) 10000L else 25000L);synchronized(this@DeviceManagedBatchEditor) {
                      if(!closed) {if(afterSend && action!=ManagedBatchAction.REMOVE) finish("queued","effect_unverified") else fail("timeout")}
                  }}
              }
              private fun read():Boolean {
                  tag=UUID.randomUUID().toString();deadline()
                  return send(packet("getsysinfo").apply {addProperty("nodeid",original.id);addProperty("tag",tag);addProperty("nodeinfo",true);addProperty("cache",true)})
              }
              @Synchronized fun start() {
                  if(started || closed) return
                  started=true
                  if(!same() || identity.cookie.isBlank() || !deviceBatchAgentUpdateIdentity(identity.actor,original.id)) {fail("identity");return}
                  deadline()
                  jobs.launch {while(isActive) {delay(100L);synchronized(this@DeviceManagedBatchEditor) {if(!closed && !same()) fail("identity")}}}
                  try {socket=OkHttpHelper.createClient(identity.tls).newBuilder().followRedirects(false).followSslRedirects(false).build()
                      .newWebSocket(Request.Builder().url(OkHttpHelper.toWebSocketUrl(identity.url,"/control.ashx?moreargs=1")).header("Cookie",identity.cookie).build(),object:WebSocketListener() {
                          override fun onOpen(webSocket:WebSocket,response:Response) {synchronized(this@DeviceManagedBatchEditor) {
                              if(closed || !same()) {webSocket.cancel();return}
                              val auth=packet("urlargs").apply {add("args",JsonObject().apply {addProperty("auth",source.extractRawToken(identity.cookie))})}
                              if(!webSocket.send(auth.toString()) || !webSocket.send(packet("userinfo").toString())) fail("connection")
                          }}
                          override fun onMessage(webSocket:WebSocket,text:String) {synchronized(this@DeviceManagedBatchEditor) {
                              if(closed) return
                              if(!same() || text.length>2000000) {fail("invalid");return}
                              runCatching {receive(JsonParser.parseString(text).asJsonObject)}.onFailure {fail("invalid")}
                          }}
                          override fun onFailure(webSocket:WebSocket,t:Throwable,response:Response?) {synchronized(this@DeviceManagedBatchEditor) {if(!closed) fail("connection")}}
                          override fun onClosing(webSocket:WebSocket,code:Int,reason:String) {synchronized(this@DeviceManagedBatchEditor) {if(!closed) fail("connection");webSocket.close(code,"")}}
                          override fun onClosed(webSocket:WebSocket,code:Int,reason:String) {synchronized(this@DeviceManagedBatchEditor) {if(!closed) fail("connection")}}
                      })} catch(_:Exception) {fail("connection")}
              }
              private fun receive(p:JsonObject) {
                  val wire=p.get("action")?.asString
                  when(wire) {
                      "ping"->send(packet("pong"))
                      "close","stopped"->fail("denied")
                      "userinfo"->{
                          if(p.getAsJsonObject("userinfo")?.get("_id")?.asString!=identity.actor) {fail("identity");return}
                          if(mutable.value.phase=="loading" && tag.isBlank() && !read()) fail("connection")
                      }
                      "getsysinfo"->{
                          if(tag.isBlank() || p.get("tag")?.asString!=tag || p.get("nodeid")?.asString!=original.id) return
                          val meta=generalMeta(p,original.id,tag) ?: run {fail("unverified");return}
                          tag="";timer?.cancel()
                          if(meta.mesh!=original.meshid || !managedBatchAvailable(original.id,meta,source.groupedDevices.value,action)) {finish("skipped","unavailable");return}
                          val draft=ManagedBatchDraft(action,identity.actor,original.id,meta.mesh,meta.os)
                          if(!requested) {mutable.value=ManagedBatchState("ready",draft);return}
                          if(draft!=reviewed) {fail("changed");return}
                          val change=managedBatchPacket(draft,identity.actor,original.id,meta,source.groupedDevices.value,requestId)
                          attempted=true
                          if(!send(change)) {fail("connection");return}
                          mutable.value=mutable.value.copy(phase="sent");deadline(true)
                      }
                      "event"->if(attempted && action==ManagedBatchAction.REMOVE && managedBatchRemovalEvent(p,original.id)) {
                          removed=true;if(managedBatchRemovalObserved(accepted,removed)) {finish("removed");source.requestServerData()}
                      }
                      else->if(attempted && wire==action.wire) {
                          val draft=reviewed ?: return
                          when(managedBatchAck(p,draft,requestId)) {
                              "rejected"->finish("rejected","denied")
                              "accepted"->{
                                  accepted=true
                                  if(action!=ManagedBatchAction.REMOVE) finish("accepted","effect_unverified")
                                  else if(managedBatchRemovalObserved(accepted,removed)) {finish("removed");source.requestServerData()}
                              }
                          }
                      }
                  }
              }
              @Synchronized fun submit(draft:ManagedBatchDraft):Boolean {
                  if(closed || requested || attempted || !same() || mutable.value.phase!="ready" || mutable.value.draft!=draft) return false
                  requested=true;reviewed=draft;mutable.value=mutable.value.copy(phase="checking")
                  if(!read()) {fail("connection");return false}
                  return true
              }
              @Synchronized fun close() {if(!closed) fail("closed")}
          }
          '''
          ui=r'''package iecxiv.meshfabric.ui.devices

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.dp
          import iecxiv.meshfabric.data.model.*
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit

          private data class ManagedRow(val group:MeshGroup,val node:MeshNode,val draft:ManagedBatchDraft?=null,val phase:String="loading",val code:String="")
          private data class ManagedRequest(val action:ManagedBatchAction,val rows:List<ManagedRow>,val identity:DeviceBatchPowerIdentity)
          private val managedTerminal=setOf("queued","accepted","removed","rejected","skipped","error")
          private fun managedLabel(a:ManagedBatchAction,es:Boolean)=when(a) {
              ManagedBatchAction.CLEAR_CORE->if(es) "Eliminar el núcleo del agente" else "Clear agent core"
              ManagedBatchAction.DEFAULT_CORE->if(es) "Cargar núcleo predeterminado" else "Load default agent core"
              ManagedBatchAction.UNINSTALL->if(es) "Desinstalar el agente" else "Uninstall agent"
              ManagedBatchAction.REMOVE->if(es) "Eliminar dispositivos de MeshCentral" else "Remove devices from MeshCentral"
          }
          private fun managedToken(a:ManagedBatchAction,es:Boolean)=when(a) {
              ManagedBatchAction.CLEAR_CORE->if(es) "BORRAR" else "CLEAR"
              ManagedBatchAction.DEFAULT_CORE->if(es) "CARGAR" else "LOAD"
              ManagedBatchAction.UNINSTALL->if(es) "DESINSTALAR" else "UNINSTALL"
              ManagedBatchAction.REMOVE->if(es) "ELIMINAR" else "REMOVE"
          }
          @Composable internal fun deviceManagedBatchTitle(action:ManagedBatchAction)=managedLabel(action,LocalConfiguration.current.locales[0].language=="es")
          private suspend fun managedCheck(source:MeshCentralClient,request:ManagedRequest,row:ManagedRow):ManagedRow {
              if(!deviceBatchPowerSame(source,request.identity) || row.node.meshid!=row.group.id) return row.copy(phase="skipped")
              val editor=DeviceManagedBatchEditor(source,row.node,request.action)
              try {
                  editor.start()
                  val state=withTimeoutOrNull(30000L) {editor.state.first {it.phase=="ready" || it.phase in managedTerminal}}
                  return if(state?.phase=="ready" && state.draft!=null && deviceBatchPowerSame(source,request.identity)) row.copy(draft=state.draft,phase="ready") else row.copy(phase="skipped")
              } finally {editor.close()}
          }
          private suspend fun managedSend(source:MeshCentralClient,request:ManagedRequest,row:ManagedRow):ManagedRow {
              val draft=row.draft ?: return row.copy(phase="not_sent")
              if(!deviceBatchPowerSame(source,request.identity)) return row.copy(phase="not_sent")
              val editor=DeviceManagedBatchEditor(source,row.node,request.action)
              try {
                  editor.start()
                  val ready=withTimeoutOrNull(30000L) {editor.state.first {it.phase=="ready" || it.phase in managedTerminal}}
                  if(ready?.phase!="ready" || ready.draft!=draft || !deviceBatchPowerSame(source,request.identity)) return row.copy(phase="not_sent")
                  currentCoroutineContext().ensureActive()
                  if(!editor.submit(draft)) return row.copy(phase="not_sent")
                  val result=withTimeoutOrNull(40000L) {editor.state.first {it.phase in managedTerminal}}
                  return if(result==null) row.copy(phase="unknown") else row.copy(phase=result.phase,code=result.code)
              } finally {editor.close()}
          }
          @Composable internal fun rememberDeviceManagedBatchAction(source:MeshCentralClient,entries:List<Pair<MeshGroup,MeshNode>>):(ManagedBatchAction)->Unit {
              var request by remember(source) {mutableStateOf<ManagedRequest?>(null)}
              request?.let {current->ManagedDialog(source,current) {request=null}}
              return {action->
                  val rows=deviceBatchPowerTargets(entries).map {ManagedRow(it.group,it.node)}
                  if(rows.isNotEmpty() && source.connectionState.value && !source.isUserLogout) request=ManagedRequest(action,rows,deviceBatchPowerIdentity(source))
              }
          }
          @Composable private fun ManagedDialog(source:MeshCentralClient,request:ManagedRequest,onClose:()->Unit) {
              val es=LocalConfiguration.current.locales[0].language=="es"
              fun t(a:String,b:String)=if(es) a else b
              val scope=rememberCoroutineScope()
              var rows by remember(request) {mutableStateOf(request.rows)}
              var checking by remember(request) {mutableStateOf(true)}
              var running by remember(request) {mutableStateOf(false)}
              var finished by remember(request) {mutableStateOf(false)}
              var acknowledged by remember(request) {mutableStateOf(false)}
              var typed by remember(request) {mutableStateOf("")}
              var job by remember(request) {mutableStateOf<Job?>(null)}
              fun update(row:ManagedRow) {rows=rows.map {if(it.node.id==row.node.id) row else it}}
              LaunchedEffect(request) {
                  try {val gate=Semaphore(4);coroutineScope {request.rows.map {row->async {gate.withPermit {update(managedCheck(source,request,row))}}}.awaitAll()}}
                  finally {checking=false}
              }
              LaunchedEffect(request) {while(isActive) {if(!deviceBatchPowerSame(source,request.identity)) {job?.cancel();onClose();break};delay(100L)}}
              val eligible=rows.count {it.phase=="ready"}
              val token=managedToken(request.action,es)
              AlertDialog(onDismissRequest={if(!running) onClose()},title={Text(managedLabel(request.action,es)+" (${rows.size})")},text={
                  Column(Modifier.heightIn(max=420.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp)) {
                      val detail=when(request.action) {
                          ManagedBatchAction.CLEAR_CORE->agentActionDetail(AgentConsoleAction.CLEAR_CORE,es)
                          ManagedBatchAction.DEFAULT_CORE->agentActionDetail(AgentConsoleAction.DEFAULT_CORE,es)
                          ManagedBatchAction.UNINSTALL->t("Solicita desinstalar el agente. Puede perderse el acceso y requerir reinstalación. Una desconexión no confirma desinstalación.","Requests agent uninstallation. Access may be lost and reinstallation may be required. Disconnection does not confirm uninstallation.")
                          ManagedBatchAction.REMOVE->t("Elimina dispositivos mediante MeshCentral. Puede perderse el acceso y aplicarse el comportamiento asociado del servidor/agente. No equivale a verificar la desinstalación del software.","Removes devices through MeshCentral. Access may be lost and associated server/agent behavior may apply. This does not verify software uninstallation.")
                      }
                      Text(detail)
                      Text(t("Esta integración exige derechos completos. Núcleos y desinstalación requieren un agente conectado. Un intento por equipo, sin reenvío automático. Detener no deshace lo enviado.","This integration requires full rights. Core operations and uninstallation require a connected agent. One attempt per device, no automatic resend. Stopping does not undo requests already sent."))
                      if(checking || running) LinearProgressIndicator(Modifier.fillMaxWidth())
                      rows.forEach {row->
                          HorizontalDivider();Text(row.node.name.ifBlank {row.node.id},style=MaterialTheme.typography.titleSmall);Text(row.group.name)
                          val label=when(row.phase) {
                              "loading"->t("Comprobando","Checking")
                              "ready"->t("Elegible","Eligible")
                              "sending"->t("Revalidando y solicitando","Rechecking and requesting")
                              "queued"->t("Encolada localmente; aceptación y efecto no verificados","Queued locally; acceptance and effect not verified")
                              "accepted"->t("Solicitud aceptada; efecto no verificado","Request accepted; effect not verified")
                              "removed"->t("Servidor aceptó y se observó el evento de eliminación del registro","Server accepted and a record-removal event was observed")
                              "rejected"->t("Rechazada","Rejected")
                              "skipped"->t("Omitida: requisitos no verificados o contexto cambiado","Skipped: requirements not verified or context changed")
                              "not_sent"->t("No enviada","Not sent")
                              "error"->if(row.code=="unconfirmed") t("Sin confirmar; puede haberse ejecutado","Unconfirmed; may have executed") else t("No enviada","Not sent")
                              else->t("Sin confirmar; puede haberse ejecutado","Unconfirmed; may have executed")
                          };Text(label,style=MaterialTheme.typography.bodySmall)
                      }
                      if(!finished && !running) {
                          Row {Checkbox(checked=acknowledged,enabled=!checking,onCheckedChange={acknowledged=it});Text(t("He revisado los equipos y entiendo el riesgo de perder acceso.","I reviewed the devices and understand the risk of losing access."),Modifier.weight(1f))}
                          OutlinedTextField(value=typed,onValueChange={typed=it},enabled=!checking,singleLine=true,label={Text(t("Escribe ","Type ")+token)},modifier=Modifier.fillMaxWidth())
                      }
                      if(finished) Text(t("Registros con eliminación observada: ","Records with observed removal: ")+rows.count {it.phase=="removed"}+t(" · Aceptadas (efecto no verificado): "," · Accepted (effect not verified): ")+rows.count {it.phase=="accepted"}+t(" · Encoladas localmente: "," · Locally queued: ")+rows.count {it.phase=="queued"})
                  }
              },confirmButton={
                  if(!finished) TextButton(enabled=!checking && !running && eligible>0 && acknowledged && typed.trim().equals(token,true),onClick={
                      if(!checking && !running && !finished && acknowledged && typed.trim().equals(token,true) && deviceBatchPowerSame(source,request.identity)) {
                          val approved=rows.filter {it.phase=="ready"};running=true
                          job=scope.launch {try {
                              val gate=Semaphore(4)
                              coroutineScope {approved.map {row->async {gate.withPermit {
                                  currentCoroutineContext().ensureActive();update(row.copy(phase="sending"));update(managedSend(source,request,row))
                              }}}.awaitAll()};finished=true
                          } finally {running=false}}
                      }
                  }) {Text(t("Solicitar una vez: ","Request once: ")+eligible)}
              },dismissButton={TextButton(onClick={
                  if(running) {job?.cancel();rows=rows.map {when(it.phase) {"sending"->it.copy(phase="unknown");"ready"->it.copy(phase="not_sent");else->it}};running=false;finished=true}
                  else onClose()
              }) {Text(if(running) t("Detener pendientes","Stop pending requests") else t("Cerrar","Close"))}})
          }
          '''
          tests=r'''package iecxiv.meshfabric.ui.devices

          import com.google.gson.JsonParser
          import iecxiv.meshfabric.data.model.*
          import org.junit.Assert.*
          import org.junit.Test

          class DeviceManagedBatchPolicyTest {
              private val node=MeshNode(id="node//one",meshid="mesh//one",conn=1)
              private val meta=GeneralMeta("Device",emptyList(),0xffffffffL,"Linux",node.meshid)
              private fun inventory(conn:Int=1,type:Int=2)=listOf(MeshGroup(id=node.meshid,mtype=type) to listOf(node.copy(conn=conn)))
              private fun draft(action:ManagedBatchAction)=ManagedBatchDraft(action,"user//operator",node.id,meta.mesh,meta.os)
              @Test fun allFourActionsAreExplicitAndTargetExactlyOneId() {
                  for(action in ManagedBatchAction.entries) {
                      val p=managedBatchPacket(draft(action),"user//operator",node.id,meta,inventory(),"request")
                      assertEquals(action.wire,p.get("action").asString)
                      assertEquals(listOf(node.id),p.getAsJsonArray("nodeids").map {it.asString})
                      assertEquals("request",p.get("responseid").asString)
                      assertFalse(p.has("cmds"))
                      when(action) {ManagedBatchAction.CLEAR_CORE->assertEquals("clear",p.get("type").asString);ManagedBatchAction.DEFAULT_CORE->assertEquals("default",p.get("type").asString);else->assertFalse(p.has("type"))}
                  }
              }
              @Test fun delegatedOrUnknownRightsAreExcludedByThisConservativeIntegration() {
                  for(action in ManagedBatchAction.entries) {
                      for(rights in listOf(0L,4L,16L,32768L)) assertFalse(managedBatchAvailable(node.id,meta.copy(rights=rights),inventory(),action))
                      assertTrue(managedBatchAvailable(node.id,meta.copy(rights=-1L),inventory(),action))
                  }
              }
              @Test fun removalDoesNotRequireAnOnlineAgent() {
                  assertTrue(managedBatchAvailable(node.id,meta,inventory(0),ManagedBatchAction.REMOVE))
                  for(action in ManagedBatchAction.entries.filter {it!=ManagedBatchAction.REMOVE}) for(conn in listOf(0,2,4)) assertFalse(managedBatchAvailable(node.id,meta,inventory(conn),action))
              }
              @Test fun nonAgentGroupsCannotReceiveCoreOrUninstallRequests() {
                  for(action in ManagedBatchAction.entries.filter {it!=ManagedBatchAction.REMOVE}) assertFalse(managedBatchAvailable(node.id,meta,inventory(type=1),action))
              }
              @Test fun changedIdentityGroupAndOsCannotReuseReview() {
                  val d=draft(ManagedBatchAction.REMOVE)
                  assertTrue(runCatching {managedBatchPacket(d,"user//other",node.id,meta,inventory(),"request")}.isFailure)
                  assertTrue(runCatching {managedBatchPacket(d,"user/other/operator",node.id,meta,inventory(),"request")}.isFailure)
                  assertTrue(runCatching {managedBatchPacket(d,"user//operator",node.id,meta.copy(mesh="mesh//other"),inventory(),"request")}.isFailure)
                  assertTrue(runCatching {managedBatchPacket(d,"user//operator",node.id,meta.copy(os="Windows"),inventory(),"request")}.isFailure)
              }
              @Test fun ackMustMatchActionRequestAndNode() {
                  val d=draft(ManagedBatchAction.REMOVE)
                  val p=JsonParser.parseString("""{"action":"removedevices","responseid":"request","nodeid":"node//one","result":"ok"}""").asJsonObject
                  assertEquals("accepted",managedBatchAck(p,d,"request"))
                  assertNull(managedBatchAck(p,d,"other"))
                  p.addProperty("nodeid","node//other");assertNull(managedBatchAck(p,d,"request"))
              }
              @Test fun removalRequiresBothAcknowledgementAndTheExactRemovalEvent() {
                  assertFalse(managedBatchRemovalObserved(true,false));assertFalse(managedBatchRemovalObserved(false,true));assertTrue(managedBatchRemovalObserved(true,true))
                  val p=JsonParser.parseString("""{"action":"event","event":{"action":"removenode","nodeid":"node//one"}}""").asJsonObject
                  assertTrue(managedBatchRemovalEvent(p,node.id));assertFalse(managedBatchRemovalEvent(p,"node//other"))
                  p.getAsJsonObject("event").addProperty("action","changenode");assertFalse(managedBatchRemovalEvent(p,node.id))
              }
              @Test fun duplicateInventoryTargetsAreRejected() {
                  assertFalse(managedBatchAvailable(node.id,meta,listOf(MeshGroup(id=node.meshid,mtype=2) to listOf(node,node)),ManagedBatchAction.REMOVE))
              }
          }
