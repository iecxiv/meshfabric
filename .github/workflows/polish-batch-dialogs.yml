name: Polish batch dialog visual hierarchy
'on':
  push:
    branches: [dev]
    paths: ['.github/workflows/polish-batch-dialogs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polish-batch-dialogs-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare guarded UI-only changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess,re
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='36613ab4ffaec13a13a85ecf5e059c03a4605aa7'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/polish-batch-dialogs.yml'
          root=Path('app/src/main/java/iecxiv/meshfabric/ui/devices')
          spec={
            'Power':('power','Text(stringResource(batchPowerPhaseLabel(target.phase)), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(stringResource(batchPowerPhaseLabel(target.phase)), deviceBatchVisualKind("power", target.phase.name))'),
            'Tags':('tags','Text(stringResource(batchTagPhaseLabel(target.phase)), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(stringResource(batchTagPhaseLabel(target.phase)), deviceBatchVisualKind("tags", target.phase.name))'),
            'Notifications':('notifications','Text(stringResource(notificationPhaseLabel(target.phase)), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(stringResource(notificationPhaseLabel(target.phase)), deviceBatchVisualKind("notifications", target.phase.name))'),
            'Run':('run','Text(stringResource(batchRunPhaseLabel(target.phase)), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(stringResource(batchRunPhaseLabel(target.phase)), deviceBatchVisualKind("run", target.phase.name))'),
            'Move':('move','Text(movePhaseText(row.phase, es), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(movePhaseText(row.phase, es), deviceBatchVisualKind("move", row.phase.name))'),
            'AgentUpdate':('agent','Text(agentUpdatePhaseText(row.phase, es), style = MaterialTheme.typography.bodySmall)','DeviceBatchStatus(agentUpdatePhaseText(row.phase, es), deviceBatchVisualKind("agent", row.phase.name))'),
            'Upload':('upload','Text(status)','DeviceBatchStatus(status, deviceBatchVisualKind("upload", row.phase.name))'),
            'Managed':('managed','Text(label,style=MaterialTheme.typography.bodySmall)','DeviceBatchStatus(label,deviceBatchVisualKind("managed",row.phase,row.code))')
          }
          changed=[]
          for name,(domain,old,new) in spec.items():
              p=root/('DeviceListManagedBatchActions.kt' if name=='Managed' else 'DeviceListBatch'+name+'.kt')
              s=p.read_text()
              component='iecxiv.meshfabric.ui.components.AppAlertDialog('
              assert s.count(component)==s.count(old)==1,str(p)
              s=s.replace(component,'DeviceBatchAlertDialog(',1).replace(old,new,1)
              dialog=s.index('DeviceBatchAlertDialog(')
              slot=re.search(r'\btext\s*=\s*\{',s[dialog:]);assert slot,str(p)
              start=dialog+slot.end()
              notice=re.search(r'\bText\(',s[start:]);assert notice,str(p)
              pos=start+notice.start()
              s=s[:pos]+'DeviceBatchNotice('+s[pos+5:]
              s=re.sub(r'(,\s*style\s*=\s*MaterialTheme\.typography\.titleSmall)(\s*\))',r'\1, color = MaterialTheme.colorScheme.onSurface, fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold\2',s)
              for item in ['row','target']:
                  for prop in ['group.name','node.id']:
                      s=s.replace('Text('+item+'.'+prop+', style = MaterialTheme.typography.bodySmall)','DeviceBatchSecondary('+item+'.'+prop+')')
              s=s.replace('Text(row.group.name + "\\n" + row.group.id, style = MaterialTheme.typography.bodySmall)','DeviceBatchSecondary(row.group.name + "\\n" + row.group.id)')
              s=s.replace('Text(row.group.name)','DeviceBatchSecondary(row.group.name)')
              s=re.sub(r'(if\s*\(\s*finished\s*\)\s*)Text\(',r'\1DeviceBatchSummary(',s)
              s=re.sub(r'(?m)^(\s*)Text\(t\("(Verificados: |Omitidos/no enviados: |Rechazados: |Sin confirmar: |Encoladas localmente \(no instaladas/verificadas\): |Omitidas/no enviadas: )',r'\1DeviceBatchSummary(t("\2',s)
              assert s.count('DeviceBatchStatus(')==1 and s.count('DeviceBatchNotice(')==1,str(p)
              assert 'DeviceBatchSummary(' in s,str(p)
              p.write_text(s);changed.append(str(p))
          policy=root/'DeviceBatchVisualPolicy.kt'
          assert not policy.exists()
          policy.write_text('''package iecxiv.meshfabric.ui.devices
          import java.util.Locale
          internal enum class DeviceBatchVisualKind { PROGRESS, VERIFIED, WARNING, ERROR, NEUTRAL }
          internal fun deviceBatchVisualKind(domain:String,phase:String,code:String=""):DeviceBatchVisualKind {
              val d=domain.lowercase(Locale.ROOT)
              val p=phase.uppercase(Locale.ROOT)
              if(d=="managed" && p=="ERROR") return if(code=="unconfirmed") DeviceBatchVisualKind.WARNING else DeviceBatchVisualKind.NEUTRAL
              if(p=="REJECTED") return DeviceBatchVisualKind.ERROR
              if(p in setOf("UNCONFIRMED","UNKNOWN","CONFLICT")) return DeviceBatchVisualKind.WARNING
              if(d in setOf("tags","move") && p=="VERIFIED" || d=="managed" && p=="REMOVED") return DeviceBatchVisualKind.VERIFIED
              if(p in setOf("CHECKING","LOADING","ELIGIBLE","READY","SENDING","SAVING","MOVING","RUNNING","ACCEPTED","QUEUED","LOCAL_QUEUED","OUTPUT","OBSERVED")) return DeviceBatchVisualKind.PROGRESS
              if(p in setOf("SKIPPED","NOT_SENT","UNCHANGED")) return DeviceBatchVisualKind.NEUTRAL
              return DeviceBatchVisualKind.WARNING
          }
          ''')
          helper=root/'DeviceBatchDialogAppearance.kt'
          assert not helper.exists()
          helper.write_text('''package iecxiv.meshfabric.ui.devices
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import iecxiv.meshfabric.ui.components.AppAlertDialog
          import iecxiv.meshfabric.ui.theme.LocalAppDarkTheme

          @Composable internal fun DeviceBatchAlertDialog(onDismissRequest:()->Unit,title:@Composable ()->Unit,
              text:@Composable ()->Unit,confirmButton:@Composable ()->Unit,dismissButton:@Composable ()->Unit) {
              AppAlertDialog(onDismissRequest=onDismissRequest,
                  title={Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                      Icon(Icons.Default.Devices,contentDescription=null,tint=MaterialTheme.colorScheme.primary,modifier=Modifier.size(22.dp))
                      Box(Modifier.weight(1f)) { title() }
                  }},text=text,textContentColor=MaterialTheme.colorScheme.onSurface,
                  confirmButton=confirmButton,dismissButton=dismissButton)
          }
          @Composable internal fun DeviceBatchNotice(text:String) {
              Surface(modifier=Modifier.fillMaxWidth(),shape=MaterialTheme.shapes.small,
                  color=MaterialTheme.colorScheme.primaryContainer,contentColor=MaterialTheme.colorScheme.onPrimaryContainer) {
                  Row(Modifier.padding(10.dp),horizontalArrangement=Arrangement.spacedBy(8.dp),verticalAlignment=Alignment.Top) {
                      Icon(Icons.Default.Info,contentDescription=null,modifier=Modifier.size(18.dp))
                      Text(text,modifier=Modifier.weight(1f),style=MaterialTheme.typography.bodyMedium)
                  }
              }
          }
          @Composable internal fun DeviceBatchSecondary(text:String) {
              Text(text,style=MaterialTheme.typography.bodySmall,color=MaterialTheme.colorScheme.onSurfaceVariant)
          }
          @Composable internal fun DeviceBatchSummary(text:String) {
              Text(text,style=MaterialTheme.typography.bodyMedium,color=MaterialTheme.colorScheme.primary,fontWeight=FontWeight.SemiBold)
          }
          @Composable internal fun DeviceBatchStatus(text:String,kind:DeviceBatchVisualKind) {
              val scheme=MaterialTheme.colorScheme
              val dark=LocalAppDarkTheme.current
              val color=when(kind) {
                  DeviceBatchVisualKind.PROGRESS->scheme.primary
                  DeviceBatchVisualKind.VERIFIED->if(dark) Color(0xFF81C784) else Color(0xFF1B5E20)
                  DeviceBatchVisualKind.WARNING->if(dark) Color(0xFFFFE082) else Color(0xFF8A4B00)
                  DeviceBatchVisualKind.ERROR->scheme.error
                  DeviceBatchVisualKind.NEUTRAL->scheme.onSurfaceVariant
              }
              val icon=when(kind) {
                  DeviceBatchVisualKind.PROGRESS->Icons.Default.Info
                  DeviceBatchVisualKind.VERIFIED->Icons.Default.CheckCircle
                  DeviceBatchVisualKind.WARNING->Icons.Default.Warning
                  DeviceBatchVisualKind.ERROR->Icons.Default.ErrorOutline
                  DeviceBatchVisualKind.NEUTRAL->Icons.Default.RemoveCircleOutline
              }
              Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(6.dp),verticalAlignment=Alignment.Top) {
                  Icon(icon,contentDescription=null,tint=color,modifier=Modifier.size(16.dp))
                  Text(text,modifier=Modifier.weight(1f),color=color,style=MaterialTheme.typography.bodySmall,fontWeight=FontWeight.Medium)
              }
          }
          ''')
          test=Path('app/src/test/java/iecxiv/meshfabric/ui/devices/DeviceBatchVisualPolicyTest.kt')
          assert not test.exists()
          test.write_text('''package iecxiv.meshfabric.ui.devices
          import org.junit.Assert.*
          import org.junit.Test
          class DeviceBatchVisualPolicyTest {
              @Test fun onlyExplicitlyVerifiedDomainsAreGreen() {
                  for(domain in listOf("tags","move")) assertEquals(DeviceBatchVisualKind.VERIFIED,deviceBatchVisualKind(domain,"VERIFIED"))
                  assertEquals(DeviceBatchVisualKind.VERIFIED,deviceBatchVisualKind("managed","removed"))
              }
              @Test fun verificationCannotLeakAcrossDomains() {
                  for(domain in listOf("run","upload","power","agent","notifications","other")) assertNotEquals(DeviceBatchVisualKind.VERIFIED,deviceBatchVisualKind(domain,"VERIFIED"))
              }
              @Test fun acceptedAndQueuedDoNotClaimSuccess() {
                  for(phase in listOf("ACCEPTED","QUEUED","LOCAL_QUEUED")) assertEquals(DeviceBatchVisualKind.PROGRESS,deviceBatchVisualKind("agent",phase))
              }
              @Test fun outputAndLimitedFileObservationAreNotGreen() {
                  assertEquals(DeviceBatchVisualKind.PROGRESS,deviceBatchVisualKind("run","OUTPUT"))
                  assertEquals(DeviceBatchVisualKind.PROGRESS,deviceBatchVisualKind("upload","OBSERVED"))
              }
              @Test fun unconfirmedAndConflictsAreWarnings() {
                  for(phase in listOf("UNKNOWN","UNCONFIRMED","CONFLICT")) assertEquals(DeviceBatchVisualKind.WARNING,deviceBatchVisualKind("move",phase))
              }
              @Test fun rejectedAndUnsentAreDifferent() {
                  assertEquals(DeviceBatchVisualKind.ERROR,deviceBatchVisualKind("power","REJECTED"))
                  for(phase in listOf("SKIPPED","NOT_SENT","UNCHANGED")) assertEquals(DeviceBatchVisualKind.NEUTRAL,deviceBatchVisualKind("tags",phase))
              }
              @Test fun managedErrorPreservesUncertainty() {
                  assertEquals(DeviceBatchVisualKind.WARNING,deviceBatchVisualKind("managed","error","unconfirmed"))
                  assertEquals(DeviceBatchVisualKind.NEUTRAL,deviceBatchVisualKind("managed","error","connection"))
              }
              @Test fun unknownStatesAreConservative() {
                  assertEquals(DeviceBatchVisualKind.WARNING,deviceBatchVisualKind("other","new_state"))
                  assertEquals(DeviceBatchVisualKind.PROGRESS,deviceBatchVisualKind("managed","loading"))
              }
          }
          ''')
          changed += [str(policy),str(helper),str(test)]
          Path('/tmp/batch-style-paths.txt').write_text('\n'.join(changed))
          actual=set(git('diff','--name-only').splitlines())
          assert actual==set(changed[:8])
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - name: Build, compile UI tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-style-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Publish tested UI and retire workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          cases=[c for p in Path('app/build/test-results').rglob('*.xml') for c in ET.parse(p).getroot().iter('testcase') if c.get('classname')=='iecxiv.meshfabric.ui.devices.DeviceBatchVisualPolicyTest']
          assert len(cases)==8 and not any(c.find(t) is not None for c in cases for t in ['failure','error','skipped'])
          assert git('hash-object','app/build.gradle.kts')=='71466c471ee7dc9cea48ad2ffbed23185aa4076d'
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no force push'
          workflow=Path('.github/workflows/polish-batch-dialogs.yml');workflow.unlink()
          paths=Path('/tmp/batch-style-paths.txt').read_text().splitlines()+[str(workflow)]
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','style(devices): improve batch dialog contrast and semantic status hierarchy'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
