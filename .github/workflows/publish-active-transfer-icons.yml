name: Validate and publish active transfer icons
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-active-transfer-icons.yml]
permissions:
  contents: write
concurrency:
  group: publish-active-transfer-icons-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore only in-progress icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt')
          s = p.read_text()
          for title, icon in [('Descargando $fileName', 'stat_sys_download'), ('Subiendo $fileName', 'stat_sys_upload')]:
              old = '.setSmallIcon(R.drawable.ic_stat_remote)\n                .setContentTitle("' + title + '")'
              new = '.setSmallIcon(android.R.drawable.' + icon + ')\n                .setContentTitle("' + title + '")'
              if s.count(old) != 1:
                  raise RuntimeError('Active notification anchor changed: ' + title)
              s = s.replace(old, new, 1)
          for title in ['Descarga completada', 'Subida completada']:
              anchor = '.setSmallIcon(R.drawable.ic_stat_remote)\n                .setContentTitle("' + title + '")'
              if s.count(anchor) != 1:
                  raise RuntimeError('Completed notification icon changed: ' + title)
          p.write_text(s)
          PY
          git diff --check
      - name: Unit tests and debug build
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-transfer-icons-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Publish validated change
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/iecxiv/meshfabric/data/remote/FileRelayClient.kt
          git commit -m 'fix: restore active download and upload icons while retaining completed status icon'
          git push origin HEAD:dev
