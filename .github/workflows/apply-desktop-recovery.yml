name: Apply verified desktop recovery fix

on:
  push:
    branches: [reconnection-tests]
    paths: ['.github/workflows/apply-desktop-recovery.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-desktop-recovery
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/reconnection-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconnection-tests
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded desktop patch and include English translation
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-desktop-recovery.py
          mkdir -p app/src/main/res/values-en
          cp app/src/main/res/values/desktop_notifications.xml app/src/main/res/values-en/desktop_notifications.xml
      - name: Check, build, test and lint before publishing
        run: |
          set -euo pipefail
          git diff --check
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Publish verified fix and remove temporary tooling
        run: |
          set -euo pipefail
          git add app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRecoveryPolicy.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt app/src/main/java/iecxiv/meshfabric/MainActivity.kt app/src/main/java/iecxiv/meshfabric/service/KeepAliveService.kt app/src/main/res/values/desktop_notifications.xml app/src/main/res/values-es/desktop_notifications.xml app/src/main/res/values-en/desktop_notifications.xml app/src/test/java/iecxiv/meshfabric/data/remote/DesktopRecoveryPolicyTest.kt
          git rm .github/scripts/apply-desktop-recovery.py .github/workflows/apply-desktop-recovery.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): recover retained sessions automatically after transport loss'
          git push origin HEAD:refs/heads/reconnection-tests
      - name: Upload verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-recovery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
