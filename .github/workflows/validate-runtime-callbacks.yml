name: Validate runtime-owned session callbacks
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/validate-runtime-callbacks.yml']
permissions:
  contents: write
concurrency:
  group: runtime-callbacks-dev
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare scoped callback ownership changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess, hashlib, json, os
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='ffb22a1c099f0aef6e23147fd892b7215ff105ff','Base advanced'
          expected={'app/src/main/java/iecxiv/meshfabric/MainActivity.kt':'b018ef254baf947b08ce18bf0497c2705d6236cd','app/src/main/java/iecxiv/meshfabric/RemoteSessionRuntime.kt':'0fe1c940ecd1b353083fbbe9a8b4ef896f28be18','.github/scripts/run-emulator-regressions.py':'76a7fc3a07e6e35eb8684a25afd270b1a572ddd5'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          p=Path('app/src/main/java/iecxiv/meshfabric/MainActivity.kt');s=p.read_text()
          a=s.index('    private var appInForeground = true');b=s.index('    override fun onCreate(',a)
          s=s[:a]+s[b:]
          a=s.index('        DeviceChatKeepAlive.onChanged = chatSessionsChanged');b=s.index('        setContent {',a)
          s=s[:a]+s[b:]
          s=s.replace('        appInForeground = true\n','').replace('        KeepAliveService.stopService(applicationContext)','        remoteRuntime.onForeground()')
          a=s.index('        val session = sessionManager.getSession()',s.index('    override fun onResume()'))
          b=s.index('    override fun onStop()',a)
          s=s[:a]+'        remoteRuntime.resumeControlConnection()\n    }\n\n'+s[b:]
          s=s.replace('        appInForeground = false\n','')
          s=s.replace('        terminalClient.checkpointHistory()\n        updateBackgroundSessionService()','        remoteRuntime.onBackground()')
          s=s.replace('        if (DeviceChatKeepAlive.onChanged === chatSessionsChanged) DeviceChatKeepAlive.onChanged = null\n','')
          assert 'onNetworkChangedListener' not in s and 'onTaskRemovedListener' not in s and 'chatSessionsChanged' not in s
          p.write_text(s)
          p=Path('app/src/main/java/iecxiv/meshfabric/RemoteSessionRuntime.kt');s=p.read_text()
          a=s.index('    override fun onCleared()')
          s=s[:a]+'''    private var appInForeground = true
              private var closingSessions = false
              private val networkCallback = OwnedSessionCallback(
                  { MeshFabricApp.onNetworkChangedListener }, { MeshFabricApp.onNetworkChangedListener = it }
              ) {
                  if (!closingSessions) {
                      meshClient.onNetworkChanged()
                      terminalClient.onNetworkChanged()
                      desktopClient.onNetworkChanged()
                      fileClient.onNetworkChanged()
                      updateBackgroundSessionService()
                  }
              }
              private val taskCallback = OwnedSessionCallback(
                  { iecxiv.meshfabric.service.KeepAliveService.onTaskRemovedListener },
                  { iecxiv.meshfabric.service.KeepAliveService.onTaskRemovedListener = it }
              ) { onTaskRemoved() }
              private val chatCallback = OwnedSessionCallback(
                  { iecxiv.meshfabric.ui.devices.DeviceChatKeepAlive.onChanged },
                  { iecxiv.meshfabric.ui.devices.DeviceChatKeepAlive.onChanged = it }
              ) { updateBackgroundSessionService() }
              private fun onTaskRemoved() { closeSessions(chatCallback.ownsSlot) }
              fun onForeground() {
                  appInForeground = true
                  if (!closingSessions && taskCallback.ownsSlot)
                      iecxiv.meshfabric.service.KeepAliveService.stopService(getApplication())
              }
              fun onBackground() {
                  appInForeground = false
                  if (!closingSessions) {
                      terminalClient.checkpointHistory()
                      updateBackgroundSessionService()
                  }
              }
              fun resumeControlConnection() {
                  if (closingSessions || !networkCallback.ownsSlot) return
                  val session = sessionManager.getSession()
                  if (session != null && session.serverUrl.isNotBlank() && session.authCookie.isNotBlank() && !meshClient.connectionState.value) {
                      meshClient.connectControlSocket(rawServerUrl=session.serverUrl, cookie=session.authCookie, ignoreSslCert=session.ignoreSsl)
                  }
              }
              private fun updateBackgroundSessionService() {
                  if (appInForeground || closingSessions || !taskCallback.ownsSlot) return
                  val chatCount = iecxiv.meshfabric.ui.devices.DeviceChatKeepAlive.activeCount()
                  val total = terminalClient.getSessionCount() + desktopClient.getSessionCount() + fileClient.getSessionCount() + chatCount
                  val connected = terminalClient.hasActiveSessions() || desktopClient.hasActiveSessions() || fileClient.hasActiveSessions() || chatCount > 0
                  val disconnected = terminalClient.hasDisconnectedWithBuffer() || desktopClient.hasDisconnectedWithBuffer() || fileClient.hasDisconnectedWithBuffer()
                  if (total > 0) iecxiv.meshfabric.service.KeepAliveService.startService(getApplication(), connected, disconnected, desktopClient.hasActiveSessions() && chatCount == 0)
                  else iecxiv.meshfabric.service.KeepAliveService.stopService(getApplication())
              }
              private fun closeSessions(closeChats: Boolean) {
                  if (closingSessions) return
                  closingSessions = true
                  if (closeChats) iecxiv.meshfabric.ui.devices.DeviceChatKeepAlive.closeAll()
                  terminalViewModel.cancelPendingReconnections()
                  meshClient.disconnect()
                  terminalClient.saveAllBuffersAndClose(getApplication(), sessionManager.isSaveTerminalBuffersEnabled())
                  desktopClient.disconnectAll()
                  fileClient.disconnectAll()
              }
              override fun onCleared() {
                  val ownsService = taskCallback.ownsSlot
                  val ownsChats = chatCallback.ownsSlot
                  networkCallback.release(); taskCallback.release(); chatCallback.release()
                  try { closeSessions(ownsChats) } finally {
                      children.clear()
                      navigationState = null
                      if (ownsService) iecxiv.meshfabric.service.KeepAliveService.stopService(getApplication())
                      super.onCleared()
                  }
              }
          }
          '''
          p.write_text(s)
          p=Path('.github/scripts/run-emulator-regressions.py');s=p.read_text()
          assert s.count('classes=[')==1
          s=s.replace('classes=[',"classes=['iecxiv.meshfabric.SessionRuntimeCallbacksTest',",1);p.write_text(s)
          files={}
          files['app/src/main/java/iecxiv/meshfabric/OwnedSessionCallback.kt']='''package iecxiv.meshfabric
          internal class OwnedSessionCallback(
              private val read: () -> (() -> Unit)?,
              private val write: ((() -> Unit)?) -> Unit,
              action: () -> Unit
          ) {
              private var released = false
              val callback: () -> Unit = { if (ownsSlot) action() }
              val ownsSlot: Boolean get() = !released && read() === callback
              init { write(callback) }
              fun release() {
                  if (released) return
                  val owned = read() === callback
                  released = true
                  if (owned) write(null)
              }
          }
          '''
          files['app/src/test/java/iecxiv/meshfabric/OwnedSessionCallbackTest.kt']='''package iecxiv.meshfabric
          import org.junit.Assert.*
          import org.junit.Test
          class OwnedSessionCallbackTest {
              @Test fun releasesOwnedSlot() {
                  var slot: (() -> Unit)? = null
                  val owner=OwnedSessionCallback({slot},{slot=it}) {}
                  assertTrue(owner.ownsSlot); owner.release(); assertNull(slot)
              }
              @Test fun releaseCannotRemoveReplacement() {
                  var slot: (() -> Unit)? = null
                  val first=OwnedSessionCallback({slot},{slot=it}) {}
                  val second=OwnedSessionCallback({slot},{slot=it}) {}
                  first.release(); assertSame(second.callback,slot); assertTrue(second.ownsSlot)
              }
              @Test fun staleAndReleasedCallbacksCannotExecute() {
                  var slot: (() -> Unit)? = null; var firstCalls=0; var secondCalls=0
                  val first=OwnedSessionCallback({slot},{slot=it}) {firstCalls++}
                  val second=OwnedSessionCallback({slot},{slot=it}) {secondCalls++}
                  first.callback(); second.callback()
                  assertEquals(0,firstCalls); assertEquals(1,secondCalls)
                  second.release(); second.callback(); assertEquals(1,secondCalls)
              }
              @Test fun repeatedReleasePreservesSubsequentOwner() {
                  var slot: (() -> Unit)? = null
                  val first=OwnedSessionCallback({slot},{slot=it}) {}
                  first.release()
                  val second=OwnedSessionCallback({slot},{slot=it}) {}
                  first.release(); assertSame(second.callback,slot)
              }
          }
          '''
          files['app/src/androidTest/java/iecxiv/meshfabric/SessionRuntimeCallbacksTest.kt']='''package iecxiv.meshfabric
          import android.app.Application
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.ViewModelStore
          import androidx.test.core.app.ActivityScenario
          import androidx.test.core.app.ApplicationProvider
          import androidx.test.platform.app.InstrumentationRegistry
          import iecxiv.meshfabric.service.KeepAliveService
          import iecxiv.meshfabric.ui.devices.DeviceChatKeepAlive
          import org.junit.Assert.*
          import org.junit.Test
          class SessionRuntimeCallbacksTest {
              @Test fun callbacksSurviveRecreationAndBackgroundWithoutReplacement() {
                  lateinit var network: () -> Unit
                  lateinit var task: () -> Unit
                  lateinit var chat: () -> Unit
                  ActivityScenario.launch(MainActivity::class.java).use { scenario ->
                      scenario.onActivity {
                          network=requireNotNull(MeshFabricApp.onNetworkChangedListener)
                          task=requireNotNull(KeepAliveService.onTaskRemovedListener)
                          chat=requireNotNull(DeviceChatKeepAlive.onChanged)
                      }
                      scenario.recreate()
                      scenario.moveToState(Lifecycle.State.CREATED)
                      scenario.moveToState(Lifecycle.State.RESUMED)
                      scenario.onActivity {
                          assertSame(network,MeshFabricApp.onNetworkChangedListener)
                          assertSame(task,KeepAliveService.onTaskRemovedListener)
                          assertSame(chat,DeviceChatKeepAlive.onChanged)
                      }
                  }
              }
              @Test fun finishingActivityReleasesAllOwnedCallbacks() {
                  ActivityScenario.launch(MainActivity::class.java).use { scenario ->
                      scenario.onActivity {
                          assertNotNull(MeshFabricApp.onNetworkChangedListener)
                          assertNotNull(KeepAliveService.onTaskRemovedListener)
                          assertNotNull(DeviceChatKeepAlive.onChanged)
                      }
                  }
                  InstrumentationRegistry.getInstrumentation().waitForIdleSync()
                  assertNull(MeshFabricApp.onNetworkChangedListener)
                  assertNull(KeepAliveService.onTaskRemovedListener)
                  assertNull(DeviceChatKeepAlive.onChanged)
              }
              @Test fun clearingOldRuntimeDoesNotDetachNewRuntimeCallbacks() {
                  InstrumentationRegistry.getInstrumentation().runOnMainSync {
                      val first=ViewModelStore(); val second=ViewModelStore()
                      val app=ApplicationProvider.getApplicationContext<Application>()
                      val factory=ViewModelProvider.AndroidViewModelFactory(app)
                      try {
                          ViewModelProvider(first,factory)[RemoteSessionRuntime::class.java]
                          ViewModelProvider(second,factory)[RemoteSessionRuntime::class.java]
                          val network=MeshFabricApp.onNetworkChangedListener
                          val task=KeepAliveService.onTaskRemovedListener
                          val chat=DeviceChatKeepAlive.onChanged
                          assertNotNull(network); assertNotNull(task); assertNotNull(chat)
                          first.clear()
                          assertSame(network,MeshFabricApp.onNetworkChangedListener)
                          assertSame(task,KeepAliveService.onTaskRemovedListener)
                          assertSame(chat,DeviceChatKeepAlive.onChanged)
                      } finally { first.clear(); second.clear() }
                      assertNull(MeshFabricApp.onNetworkChangedListener)
                      assertNull(KeepAliveService.onTaskRemovedListener)
                      assertNull(DeviceChatKeepAlive.onChanged)
                  }
              }
          }
          '''
          for path,content in files.items():
              p=Path(path);assert not p.exists(),path
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert modified==set(expected)
          assert added==set(files)
          Path(os.environ['RUNNER_TEMP'],'callback-candidate.json').write_text(json.dumps({path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in modified|added}))
      - run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and test sources and run full unit suite and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --rerun-tasks --continue --no-daemon --stacktrace
      - name: Require all four new unit tests to pass
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[case for path in Path('app/build/test-results/testDebugUnitTest').glob('*.xml') for case in ET.parse(path).getroot().iter('testcase') if case.get('classname')=='iecxiv.meshfabric.OwnedSessionCallbackTest']
          assert len({case.get('name') for case in cases})==4,'Missing new unit tests'
          assert all(case.find(key) is None for case in cases for key in ('failure','error','skipped'))
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the new callback tests and all previous selected regressions individually
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 .github/scripts/run-emulator-regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-callback-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/resume-regressions/
            ${{ runner.temp }}/callback-candidate.json
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish only tested unchanged candidates on unchanged dev and retire this workflow
        shell: python
        run: |
          from pathlib import Path
          import ast, hashlib, json, os, subprocess
          root=Path(os.environ['RUNNER_TEMP'])
          summary=json.loads((root/'resume-regressions/summary.json').read_text())
          tree=ast.parse(Path('.github/scripts/run-emulator-regressions.py').read_text())
          classes=next(ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='classes' for target in node.targets))
          assert len(classes)==6 and set(summary)==set(classes)
          assert summary['iecxiv.meshfabric.SessionRuntimeCallbacksTest']['expected']==3
          assert all(value['passed']>=value['expected']>0 for value in summary.values())
          hashes=json.loads((root/'callback-candidate.json').read_text())
          assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==value for path,value in hashes.items()),'Candidate changed after preparation'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','fetch','origin','dev'],check=True)
          assert git('rev-parse','HEAD')==git('rev-parse','FETCH_HEAD'),'dev advanced; no publication'
          changed=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==set(hashes)
          temporary='.github/workflows/validate-runtime-callbacks.yml'
          Path(temporary).unlink()
          allowed=set(hashes)|{temporary}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: bind session callbacks to retained runtime and release only owned handlers'],check=True)
          subprocess.run(['git','push','origin','HEAD:dev'],check=True)
