name: Remove online filter dot
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/remove-filter-dot.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove only the green dot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt')
          s = p.read_text()
          line = '                    if(onlyOnline) Surface(Modifier.size(5.dp).align(Alignment.TopEnd),shape=CircleShape,color=OnlineGreen) { }\n'
          assert s.count(line) == 1, 'Filter dot changed; review required'
          s = s.replace(line, '', 1)
          assert 'tint=if(onlyOnline) MaterialTheme.colorScheme.primary else LocalContentColor.current' in s
          p.write_text(s)
          PY
          git diff --check
      - run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified change
        run: |
          git add app/src/main/java/iecxiv/meshfabric/ui/devices/DeviceListScreen.kt
          git rm .github/workflows/remove-filter-dot.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: remove green dot from online devices filter'
          git push origin HEAD:dev
