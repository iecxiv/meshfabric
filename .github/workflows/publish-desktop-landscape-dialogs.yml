name: Publish wider landscape desktop dialogs
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-desktop-landscape-dialogs.yml]
permissions:
  contents: write
concurrency:
  group: publish-desktop-landscape-dialogs-dev
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'iecxiv/meshfabric' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify approved base
        run: test "$(git rev-parse HEAD^)" = 1ac9137b5beda44936edba34b517070840da8df9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Widen only the two requested landscape dialogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt')
          data = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == 'db99180241cc7d0dcfbfaf9fc15f740e73f7754c', 'Desktop source changed; refusing to overwrite'
          source = data.decode()
          needle = '    val settings by viewModel.settings(nodeId).collectAsState()'
          assert source.count(needle) == 1
          result = source.replace(needle, needle + '\n    val desktopDialogsLandscape = androidx.compose.ui.platform.LocalConfiguration.current.orientation ==\n        android.content.res.Configuration.ORIENTATION_LANDSCAPE', 1)
          for flag in ['showKeyboardDialog', 'showSettingsDialog']:
              old = '            androidx.compose.ui.window.Dialog(\n                onDismissRequest = { ' + flag + ' = false }'
              new = '            androidx.compose.ui.window.Dialog(\n                properties = androidx.compose.ui.window.DialogProperties(\n                    usePlatformDefaultWidth = !desktopDialogsLandscape\n                ),\n                onDismissRequest = { ' + flag + ' = false }'
              assert result.count(old) == 1, 'Unexpected dialog header: ' + flag
              result = result.replace(old, new, 1)
              start = result.index(new)
              surface = result.index('                Surface(', start)
              column = result.index('                    Column(', surface)
              block = result[surface:column]
              assert block.count('.fillMaxWidth()') == 1
              wider = block.replace('.fillMaxWidth()', '.fillMaxWidth(if (desktopDialogsLandscape) 0.92f else 1f)', 1)
              result = result[:surface] + wider + result[column:]
          clipboard = '        if (showClipboardDialog) {\n            androidx.compose.ui.window.Dialog('
          original_clipboard_start = source.index(clipboard)
          original_clipboard_end = source.index('        // Desktop Options / Settings Dialog', original_clipboard_start)
          new_clipboard_start = result.index(clipboard)
          new_clipboard_end = result.index('        // Desktop Options / Settings Dialog', new_clipboard_start)
          assert source[original_clipboard_start:original_clipboard_end] == result[new_clipboard_start:new_clipboard_end]
          assert result.count('usePlatformDefaultWidth = !desktopDialogsLandscape') == 2
          assert result.count('.fillMaxWidth(if (desktopDialogsLandscape) 0.92f else 1f)') == 2
          path.write_text(result)
          PY
          git diff --check
      - name: Build APK and run JVM tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish verified layout change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt
          git rm .github/workflows/publish-desktop-landscape-dialogs.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(desktop): widen keyboard and settings dialogs in landscape'
          git push origin HEAD:refs/heads/dev
      - name: Upload APK and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-landscape-dialogs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
