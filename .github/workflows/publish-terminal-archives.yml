name: Validate and publish terminal archives on close
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-terminal-archives.yml]
permissions:
  contents: write
concurrency:
  group: publish-terminal-archives-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply archival lifecycle and persistence patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          patch = gzip.decompress(base64.b64decode('')).decode()
          if hashlib.sha256(patch.encode()).hexdigest() != '9ad9584a4383c8a1d7eece16cf36529c99e86dea9db8b68473d09752a6f3e034':
              raise RuntimeError('Reviewed archive patch digest mismatch')
          exec(compile(patch, '<reviewed-terminal-archive-patch>', 'exec'))
          PY
      - name: Unit tests and debug build
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-archives-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Publish only if dev is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to overwrite newer work"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/iecxiv/meshfabric/MainActivity.kt app/src/main/java/iecxiv/meshfabric/data/local/SessionManager.kt app/src/main/java/iecxiv/meshfabric/data/remote/TerminalRelayClient.kt app/src/main/java/iecxiv/meshfabric/data/remote/TerminalHistoryDiskStore.kt app/src/main/java/iecxiv/meshfabric/data/remote/TerminalHistoryRepository.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalManualReconnect.kt app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalViewModel.kt app/src/test/java/iecxiv/meshfabric/data/remote/TerminalHistoryDiskStoreTest.kt docs/terminal-archive-persistence.md README.md
          git commit -m 'feat: archive closed terminal sessions and persist history when enabled'
          git push origin HEAD:dev

