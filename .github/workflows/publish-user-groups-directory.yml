name: Validate user groups tab and extract Broadcast reference
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-user-groups-directory.yml]
permissions:
  contents: write
concurrency:
  group: publish-user-groups-directory-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ylianst/MeshCentral
          ref: f436143527458d56da0336ea3047c006703fb4e4
          path: .meshcentral-reference
          persist-credentials: false
      - name: Extract user-group and Broadcast references without executing upstream code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,subprocess
          root=Path('.meshcentral-reference');out=Path('docs/reference/meshcentral-1.3.1-user-groups-broadcast')
          commit='f436143527458d56da0336ea3047c006703fb4e4'
          if out.exists():raise RuntimeError('Reference directory already exists')
          if subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()!=commit:raise RuntimeError('Upstream commit changed')
          if json.loads((root/'package.json').read_text())['version']!='1.3.1':raise RuntimeError('Upstream version changed')
          expected={'meshuser.js':'62d82550e2fa7ee66ffc55e4613cb57e8f9c2197','views/default.handlebars':'e0f9cfa2cf5bb5d9b760ec33903c8ab97db283d7'}
          wanted={'createusergroup','editusergroup','deleteusergroup','userbroadcast'}
          outputs={};index=[];matched=set()
          for name,sha in expected.items():
              path=root/name
              if subprocess.check_output(['git','hash-object',str(path)],text=True).strip()!=sha:raise RuntimeError('Upstream blob changed: '+name)
              lines=path.read_text().splitlines()
              ranges=[]
              if name=='meshuser.js':
                  for i,line in enumerate(lines):
                      m=re.match(r"""^([ \t]*)case\s+(['"])([^'"]+)\2\s*:""",line)
                      if m and m.group(3) in wanted:
                          matched.add(m.group(3));sibling=re.compile('^'+re.escape(m.group(1))+r'(?:case\s|default\s*:)')
                          end=next((j for j in range(i+1,len(lines)) if sibling.match(lines[j])),len(lines))
                          ranges.append((m.group(3),i,end))
                  for fname in ['serverCommandAddUserToUserGroup','serverCommandRemoveUserFromUserGroup']:
                      for i,line in enumerate(lines):
                          m=re.match(r'^([ \t]*)function\s+'+fname+r'\s*\(',line)
                          if m:
                              end=next((j for j in range(i+1,len(lines)) if re.match('^'+re.escape(m.group(1))+r'(?:async\s+)?function\s',lines[j])),len(lines))
                              ranges.append((fname,i,end))
              else:
                  hits=[i for i,line in enumerate(lines) if any(re.search(r'\b'+key+r'\b',line) for key in wanted)]
                  merged=[]
                  for i in hits:
                      a,b=max(0,i-100),min(len(lines),i+130)
                      if merged and a<=merged[-1][1]:merged[-1]=(merged[-1][0],max(b,merged[-1][1]))
                      else:merged.append((a,b))
                  ranges=[('web-'+str(k+1),a,b) for k,(a,b) in enumerate(merged)]
              for label,a,b in ranges:
                  text=''.join(str(i+1)+': '+lines[i]+'\n' for i in range(a,b));parts=[]
                  for k,start in enumerate(range(0,len(text),5000)):
                      filename=label+'-'+str(k+1).zfill(2)+'.txt'
                      outputs[filename]='MeshCentral 1.3.1 | Apache-2.0 | Ylian Saint-Hilaire and contributors\n'+name+' @ '+commit+' | lines '+str(a+1)+'-'+str(b)+'\n\n'+text[start:start+5000];parts.append(filename)
                  index.append({'label':label,'source':name,'first_line':a+1,'last_line':b,'parts':parts})
          if 'userbroadcast' not in matched:raise RuntimeError('Broadcast handler not found; review needed')
          if sum(len(v.encode()) for v in outputs.values())>1000000:raise RuntimeError('Reference extraction too large')
          outputs['LICENSE']=(root/'LICENSE').read_text()
          outputs['index.json']=json.dumps({'commit':commit,'source_blobs':expected,'matched_cases':sorted(matched),'unmatched_cases':sorted(wanted-matched),'blocks':index,'scope':'Static source excerpts only, pending manual review. No broadcast, membership writes or upstream code execution.'},indent=2)+'\n'
          out.mkdir(parents=True)
          for name,text in outputs.items():(out/name).write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Add read-only user groups tab and linked entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          base=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          expected={'ProfileScreen.kt':'8cbe6fa7eeb9545d892331479181cfd52f089da8','ProfileSession.kt':'2cf2e72bbae741480a32ac9e903e163318cb4025','ProfileAccountPolicy.kt':'6f7a34033c76c5bb5150282e8b3bbbc2c29e87a0'}
          sources={}
          for name,sha in expected.items():
              if subprocess.check_output(['git','hash-object',str(base/name)],text=True).strip()!=sha:raise RuntimeError('Source changed: '+name)
              sources[name]=(base/name).read_text()
          def change(name,old,new):
              if sources[name].count(old)!=1:raise RuntimeError('Missing/nonunique anchor: '+name)
              sources[name]=sources[name].replace(old,new,1)
          change('ProfileAccountPolicy.kt','profileSectionKeys=listOf("account","groups","users")','profileSectionKeys=listOf("account","groups","users","userGroups")')
          change('ProfileScreen.kt','t("Grupos de dispositivos","Device groups"),t("Usuarios","Users")),tab)','t("Grupos de dispositivos","Device groups"),t("Usuarios","Users"),t("Grupos","Groups")),tab)')
          anchor='if(tab==0) NativeAccountPane(source,state.id,Modifier.weight(1f).fillMaxWidth()) else {'
          change('ProfileScreen.kt',anchor,'if(tab==0) NativeAccountPane(source,state.id,Modifier.weight(1f).fillMaxWidth()) else if(section=="userGroups") UserGroupsDirectoryPane(session,state,Modifier.weight(1f).fillMaxWidth(),onOpenUser={id->state.users.firstOrNull {it.optString("_id")==id && canAdministerUser(state,it)}?.let {u->form=ProfileForm(true,"edit",id,u.optString("name"),u.optString("email"))}},onOpenDeviceGroup={id->if(state.ready && state.groups.any {it.optString("_id")==id}) {groupDetails=id;returnUser=null;form=null}}) else {')
          change('ProfileSession.kt','val historyFailed:Boolean=false\n) {','val historyFailed:Boolean=false,\nval listedUserGroups:List<JSONObject>?=null,val userGroupPhase:String="idle"\n) {')
          change('ProfileSession.kt','private var historyId=""','private var historyId=""\nprivate var directoryId=""\nprivate var directoryTimer:Job?=null')
          change('ProfileSession.kt','listOf(timer,readTimer,detailsTimer,historyTimer).forEach','listOf(timer,readTimer,detailsTimer,historyTimer,directoryTimer).forEach')
          change('ProfileSession.kt','expected=JSONObject(); historyId=""','expected=JSONObject(); historyId=""; directoryId=""')
          anchor='@Synchronized fun clearHistory()'
          method="""@Synchronized fun loadUserGroupDirectory() {
          if(!state.value.ready || !valid() || state.value.busy) return
          directoryTimer?.cancel(); directoryId="profile-user-groups:"+UUID.randomUUID().toString()
          val request=directoryId; val epoch=generation
          state.update {it.copy(listedUserGroups=null,userGroupPhase="loading")}
          if(!send("usergroups",JSONObject().put("tag",request))) { directoryId=""; state.update {it.copy(userGroupPhase="failed")};return }
          directoryTimer=scope.launch {delay(20_000);synchronized(this@ProfileSession) {if(epoch==generation && directoryId==request && state.value.userGroupPhase=="loading") {directoryId="";state.update {it.copy(listedUserGroups=null,userGroupPhase="failed")}}}}
          }
          """
          change('ProfileSession.kt',anchor,method+anchor)
          anchor='val action=p.optString("action")\nwhen(action) {'
          handler="""val action=p.optString("action")
          if(action=="usergroups" && p.optString("tag").startsWith("profile-user-groups:")) {
          if(directoryId.isBlank() || p.optString("tag")!=directoryId || state.value.userGroupPhase!="loading") return
          directoryTimer?.cancel();directoryId=""
          val raw=if(p.has("ugroups") && p.isNull("ugroups")) emptyList<JSONObject>() else records(p.opt("ugroups"))
          val list=raw?.takeIf {all->all.all {it.optString("_id").startsWith("ugrp/") && it.optString("_id").split('/').size==3}}?.filter {profileUserGroupDomainAllowed(state.value.id,it.optString("_id"))}
          state.update {it.copy(listedUserGroups=list,userGroupPhase=if(list==null) "failed" else "ready")}
          return
          }
          when(action) {"""
          change('ProfileSession.kt',anchor,handler)
          change('ProfileSession.kt','val first=!state.value.ready\nstate.update { it.copy(ready=true,user=JSONObject(u.toString()),notice=if(first) "ready" else it.notice) }','val first=!state.value.ready\ndirectoryTimer?.cancel();directoryId=""\nstate.update { it.copy(ready=true,user=JSONObject(u.toString()),listedUserGroups=null,userGroupPhase="idle",notice=if(first) "ready" else it.notice) }')
          hashes={'.github/patches/user-groups-directory/UserGroupsDirectoryPane.kt.txt': '9be63dc5774f45a0ac721f57c0fb7abb857d9a3024767791c785362c52c739c2', '.github/patches/user-groups-directory/UserGroupsDirectoryTest.kt.txt': '9c18273e5d6073890fa85188fce8f2193b15209591f693c76de6e5d8bb486587'}
          targets={'.github/patches/user-groups-directory/UserGroupsDirectoryPane.kt.txt': 'app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt', '.github/patches/user-groups-directory/UserGroupsDirectoryTest.kt.txt': 'app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryTest.kt'}
          updates={}
          for name,dest in targets.items():
              data=Path(name).read_bytes();path=Path(dest)
              if hashlib.sha256(data).hexdigest()!=hashes[name]:raise RuntimeError('Template changed: '+name)
              if path.exists():raise RuntimeError('New file already exists: '+dest)
              updates[path]=data.decode()
          for name,text in sources.items():updates[base/name]=text
          for path,text in updates.items():
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          PY
          git diff --check
          git diff --stat
      - name: Build, compile Android tests, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-groups-directory-${{ github.run_id }}
          path: |
            docs/reference/meshcentral-1.3.1-user-groups-broadcast/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish validated directory and reference documents
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo "dev moved; refusing to publish"; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/ProfileScreen.kt app/src/main/java/iecxiv/meshfabric/ui/management/ProfileSession.kt app/src/main/java/iecxiv/meshfabric/ui/management/ProfileAccountPolicy.kt app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryPane.kt app/src/test/java/iecxiv/meshfabric/ui/management/UserGroupsDirectoryTest.kt docs/reference/meshcentral-1.3.1-user-groups-broadcast/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(profile): add user groups directory and pinned Broadcast reference'
          git push origin HEAD:dev
