name: Validate and publish complete Events command and device details
on:
  push:
    branches: [work/registro-server-events]
    paths:
      - .github/workflows/publish-event-content.yml
      - .github/scripts/prepare-event-content.py
permissions:
  contents: write
concurrency:
  group: log-complete
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare guarded command content and scoped device identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 79b429d0bc80f879917f263aee51240e929c2cf7
          mkdir -p validation
          python3 .github/scripts/prepare-event-content.py
          git diff --cached --check
      - name: Compile execute JVM lint and prepare exact Android runner
        run: |
          set -euo pipefail
          python3 -m venv /tmp/event-content-yaml
          /tmp/event-content-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/event-content-yaml/bin/python - <<'PY'
          from pathlib import Path
          import ast,subprocess,yaml
          yaml.safe_load(Path('.github/workflows/publish-event-content.yml').read_text())
          prior=subprocess.check_output(['git','show','79b429d0bc80f879917f263aee51240e929c2cf7:.github/scripts/prepare-events-selector-ratio.py'],text=True)
          ast.parse(prior);p=Path('validation/pinned-ratio-runner.py');p.write_text(prior)
          subprocess.run(['/tmp/event-content-yaml/bin/python',str(p),'--build'],check=True)
          p=Path('validation/run-log-class-isolation.py');s=p.read_text();anchor='expected={\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"    'EventContentUiTest':{'cardAndDetailsShareDeviceGroupAndBothIdentifiers','longCommandIsNotTruncatedInReadOnlyDetails','groupAndCommandAreSearchable','inventoryChangeRemovesOpenResolvedDetails'},\n")
          s=s.replace('Expected: 24 distinct methods across 8 independent class runs.','Expected: 28 distinct methods across 9 independent class runs.')
          ast.parse(s);p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute all 28 affected Android methods independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 validation/run-log-class-isolation.py
      - name: Verify exact executed regressions and publication scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          cases=[]
          for p in Path('app/build/test-results/testDebugUnitTest').rglob('*.xml'): cases.extend(ET.parse(p).getroot().iter('testcase'))
          assert cases and all(all(c.find(t) is None for t in ('failure','error','skipped')) for c in cases)
          for name,count in {'EventContentTest':10,'ServerEventDetailsPolicyTest':4,'ServerEventsQueryTest':8,'LogEventsReaderTest':12,'ServerEventsReadPolicyTest':9,'ServerEventsDiagnosticsTest':3,'LogNumericMessageTest':8}.items():
              found=[c for c in cases if c.get('classname','').split('.')[-1]==name]
              assert len(found)==count and len({c.get('name') for c in found})==count,name
          results=json.loads(Path('validation/class-isolation/summary.json').read_text())
          required={'EventContentUiTest':4,'EventsSelectorWidthTest':5,'EventsPresentationTest':4,'ServerEventsControlsTest':3,'LogNumericMessageUiTest':2,'LogEventsDiagnosticsUiTest':2,'RegistroSectionTabsTest':2,'LogScreenTest':4,'ManagementNavigationLabelTest':2}
          assert len(results)==9 and {r['class'] for r in results}=={'iecxiv.meshfabric.ui.management.'+name for name in required}
          for r in results:
              assert r['passed'] is True and r['exit_code']==0,r
              assert len(r['cases'])==required[r['class'].split('.')[-1]],r
          expected=json.loads(Path('validation/event-content-expected.json').read_text())
          assert len(expected)==10 and set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          Path('validation/event-content-tests.json').write_text(json.dumps({'jvm_cases':len(cases),'android_cases':28,'live_server_verified':False,'physical_visual_review_verified':False},indent=2)+'\n')
          PY
          git diff --cached --check
          git diff --cached > validation/event-content.diff
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-content-validation-${{ github.run_id }}
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish tested sources only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          expected=json.loads(Path('validation/event-content-expected.json').read_text())
          assert len(expected)==10 and set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(log): show command payload and scoped device group identity in events'
          git push origin HEAD:work/registro-server-events
