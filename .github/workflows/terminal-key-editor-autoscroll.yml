name: Validate terminal key editor autoscroll
on:
  push:
    branches: [dev]
    paths: [.github/workflows/terminal-key-editor-autoscroll.yml]
permissions:
  contents: write
concurrency:
  group: terminal-key-editor-autoscroll-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.2" "platforms;android-35" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare candidate and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          dialog=Path('app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyEditorDialog.kt')
          test=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyEditorTest.kt')
          if subprocess.check_output(['git','hash-object',str(dialog)],text=True).strip()!='f5e67fdaf8b60560330a124f5294840b613ca410': raise SystemExit('TerminalKeyEditorDialog.kt changed; review required')
          def rep(s, old, new):
              if s.count(old)!=1: raise SystemExit('anchor not unique: '+old[:60])
              return s.replace(old,new,1)
          s=dialog.read_text(encoding='utf-8')
          s,n=re.subn(r"val from = keys\.indexOf\(id\)\n\s+if \(from >= 0\) \{\n.*?dragOffset -= \(target - from\) \* rowPx\n\s+\}\n\s+\}", "reorder(id)", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('onDrag block not found')
          s=rep(s,'import androidx.compose.foundation.gestures.detectDragGestures\n','import androidx.compose.foundation.gestures.detectDragGestures\nimport androidx.compose.foundation.gestures.scrollBy\n')
          s=rep(s,'import androidx.compose.runtime.Composable\n','import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\n')
          s=rep(s,'import androidx.compose.runtime.mutableFloatStateOf\n','import androidx.compose.runtime.mutableFloatStateOf\nimport androidx.compose.runtime.mutableIntStateOf\n')
          s=rep(s,'import androidx.compose.runtime.setValue\n','import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\n')
          s=rep(s,'import androidx.compose.ui.input.pointer.pointerInput\n','import androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.layout.onGloballyPositioned\nimport androidx.compose.ui.layout.onSizeChanged\nimport androidx.compose.ui.layout.positionInParent\n')
          state='''    val density = LocalDensity.current
              val rowPx = with(density) { rowHeight.toPx() }
              val edgePx = with(density) { 72.dp.toPx() }
              val maxStepPx = rowPx * 0.35f
              val scrollState = rememberScrollState()
              var viewportPx by remember { mutableIntStateOf(0) }
              var listTopPx by remember { mutableFloatStateOf(0f) }
              fun reorder(id: String) {
                  val from = keys.indexOf(id)
                  if (from < 0) return
                  val target = (from + (dragOffset / rowPx).roundToInt()).coerceIn(0, keys.lastIndex)
                  if (target != from) {
                      keys.add(target, keys.removeAt(from))
                      dragOffset -= (target - from) * rowPx
                  }
              }
              LaunchedEffect(dragging) {
                  val id = dragging ?: return@LaunchedEffect
                  while (true) {
                      withFrameNanos { }
                      val from = keys.indexOf(id)
                      if (from < 0) break
                      val top = listTopPx + from * rowPx + dragOffset - scrollState.value
                      val bottom = top + rowPx
                      val lower = viewportPx - edgePx
                      val step = when {
                          top < edgePx -> -((edgePx - top) / edgePx).coerceIn(0f, 1f) * maxStepPx
                          bottom > lower -> ((bottom - lower) / edgePx).coerceIn(0f, 1f) * maxStepPx
                          else -> 0f
                      }
                      if (step != 0f) {
                          val consumed = scrollState.scrollBy(step)
                          if (consumed != 0f) {
                              dragOffset += consumed
                              reorder(id)
                          }
                      }
                  }
              }
          '''
          s=rep(s,'    val rowPx = with(LocalDensity.current) { rowHeight.toPx() }\n', state)
          s=rep(s,'Modifier.heightIn(max = 480.dp).verticalScroll(rememberScrollState()),','Modifier.heightIn(max = 480.dp).onSizeChanged { viewportPx = it.height }.verticalScroll(scrollState),')
          s=rep(s,'Column(Modifier.fillMaxWidth()) {','Column(Modifier.fillMaxWidth().onGloballyPositioned { listTopPx = it.positionInParent().y }) {')
          dialog.write_text(s, encoding='utf-8')
          t=test.read_text(encoding='utf-8')
          newTest='''    @Test fun draggingNearTheEdgeAutoScrollsTheList() {
                  showBar()
                  openEditor()
                  compose.mainClock.autoAdvance = false
                  compose.onNodeWithTag("terminal-key-handle-esc").performTouchInput {
                      down(center)
                      moveBy(Offset(0f, 1200f))
                  }
                  compose.mainClock.advanceTimeBy(3000)
                  compose.onNodeWithTag("terminal-key-handle-esc").performTouchInput { up() }
                  compose.mainClock.autoAdvance = true
                  compose.waitForIdle()
                  compose.onNodeWithTag("terminal-key-editor-save").performClick()
                  assertTrue(savedKeys().indexOf("esc") > 12)
              }

          '''
          t=rep(t,'    @Test fun cancelKeepsStoredKeysUntouched()', newTest+'    @Test fun cancelKeepsStoredKeysUntouched()')
          test.write_text(t, encoding='utf-8')
          PY
          git diff --check
      - name: Build, compile instrumentation, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute permanent emulator regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 .github/scripts/run-emulator-regressions.py
      - name: Show failing instrumentation tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files=glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          print('result files:', files)
          for f in files:
              try:
                  root=ET.parse(f).getroot()
              except Exception as e:
                  print('unreadable', f, e)
                  continue
              for tc in root.iter('testcase'):
                  for kind in ('failure','error'):
                      for n in tc.findall(kind):
                          print('FAILED', tc.get('classname'), tc.get('name'))
                          print((n.get('message') or '')[:800])
                          print((n.text or '')[:2000])
          PY
      - name: Publish validated candidate only on unchanged dev
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'app/src/main/java/iecxiv/meshfabric/ui/terminal/TerminalKeyEditorDialog.kt','app/src/androidTest/java/iecxiv/meshfabric/ui/terminal/TerminalKeyEditorTest.kt'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if changed!=allowed: raise SystemExit('Unexpected changed files: '+repr(changed))
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          PY
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(terminal): auto-scroll key editor list while dragging"
          git push origin HEAD:refs/heads/dev
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-key-editor-autoscroll-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ${{ runner.temp }}/resume-regressions/
          if-no-files-found: warn
          retention-days: 14
