name: Diagnose desktop frame pipeline
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/diagnose-desktop-frames.yml']
permissions:
  contents: write
concurrency:
  group: diagnose-desktop-frames
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add metadata-only frame diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          relay = Path('app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRelayClient.kt')
          screen = Path('app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt')
          for p, sha in [(relay,'6c3c48e2d0e7db2d4d73266a1030b67b7dd3fbf1'),(screen,'6339e341ccf25628d493e998df46da4cca2f5663')]:
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == sha, 'Desktop source changed; review required'
          s = relay.read_text()
          def once(old,new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old,new,1)
          diagnostics = '''    private var diagPackets = 0L
              private var diagBytes = 0L
              private var diagImagePackets = 0L
              private var diagJumboPackets = 0L
              private var diagDecoded = 0L
              private var diagDecodeFailures = 0L
              private var diagPublished = 0L
              private var diagLastCmd = -1
              private var diagLastLog = 0L

              private fun logFrameDiagnostics(stage: String, force: Boolean = false) {
                  val now = nowMs()
                  if (!force && now - diagLastLog < 1000L) return
                  diagLastLog = now
                  Log.d("MeshDesktopDiag", "epoch=$epoch stage=$stage connected=${_connectionState.value} visible=$visible rx=$diagPackets bytes=$diagBytes lastCmd=$diagLastCmd images=$diagImagePackets jumbo=$diagJumboPackets decoded=$diagDecoded decodeFailed=$diagDecodeFailures published=$diagPublished version=${_frameVersion.value}")
              }

          '''
          once('    private val _settings = MutableStateFlow(DesktopSettings())', diagnostics + '    private val _settings = MutableStateFlow(DesktopSettings())')
          once('if (current(socket, generation)) handleBinaryFrame(bytes.toByteArray())', '''if (current(socket, generation)) {
                                      diagPackets++
                                      diagBytes += bytes.size
                                      handleBinaryFrame(bytes.toByteArray())
                                      logFrameDiagnostics("receive", diagPackets <= 3L)
                                  }''')
          once('if (current(socket, generation) && visible && isConnected()) sendUnPause()', '''if (current(socket, generation) && visible && isConnected()) {
                                      sendUnPause()
                                      logFrameDiagnostics("heartbeat")
                                  }''')
          once('        when (cmd) {', '''        diagLastCmd = cmd
                  if (cmd == 3) diagImagePackets++
                  if (cmd == 27) diagJumboPackets++
                  when (cmd) {''')
          once('                        if (tileBitmap != null) {', '''                        if (tileBitmap == null) diagDecodeFailures++ else diagDecoded++
                                  if (tileBitmap != null) {''')
          once('Log.e("DesktopSession", "Error decoding tile at $x, $y: ${e.message}")', '''diagDecodeFailures++
                                  Log.e("MeshDesktopDiag", "decode-error type=${e.javaClass.simpleName} bytes=${imgData.size}")
                                  Log.e("DesktopSession", "Error decoding tile at $x, $y: ${e.message}")''')
          once('            _frameVersion.value = System.currentTimeMillis()', '''            _frameVersion.value = System.currentTimeMillis()
                      diagPublished++''')
          once('    private fun retireSocket() {', '''    private fun retireSocket() {
                  logFrameDiagnostics("retire", true)''')
          relay.write_text(s)
          s = screen.read_text()
          once('    val settings by viewModel.settings(nodeId).collectAsState()', '''    val drawDiagnostics = remember(nodeId) { longArrayOf(0L, 0L) }
              val settings by viewModel.settings(nodeId).collectAsState()''')
          old = '''                                        canvas.nativeCanvas.drawBitmap(
                                                      bitmap,
                                                      null,
                                                      android.graphics.RectF(0f, 0f, size.width, size.height),
                                                      null
                                                  )'''
          old = '\n'.join(line[10:] if index > 0 else line for index,line in enumerate(old.splitlines()))
          assert s.count(old) == 1, 'Unexpected bitmap drawing block; review required'
          extra = '''
                                                  drawDiagnostics[0]++
                                                  val diagnosticNow = android.os.SystemClock.elapsedRealtime()
                                                  if (diagnosticNow - drawDiagnostics[1] >= 1000L) {
                                                      drawDiagnostics[1] = diagnosticNow
                                                      android.util.Log.d("MeshDesktopDraw", "draws=${drawDiagnostics[0]} version=$currentFrameVersion bitmap=${bitmap.width}x${bitmap.height}")
                                                  }'''
          extra = '\n'.join(line[10:] if index > 0 else line for index,line in enumerate(extra.splitlines()))
          once(old,old + extra)
          screen.write_text(s)
          PY
          git diff --check
      - name: Build, unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --no-daemon --stacktrace
      - name: Publish validated diagnostics
        run: |
          git add app/src/main/java/iecxiv/meshfabric/data/remote/DesktopRelayClient.kt app/src/main/java/iecxiv/meshfabric/ui/desktop/RemoteDesktopScreen.kt
          git rm .github/workflows/diagnose-desktop-frames.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'diag: trace desktop receive decode publish and drawing counters'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-frame-diagnostics-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
