name: Validate and publish readable user group dialogs
on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-readable-user-group-dialogs.yml]
permissions:
  contents: write
concurrency:
  group: readable-user-group-dialogs-dev
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate guarded dialog changes and offline tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=Path('app/src/main/java/iecxiv/meshfabric/ui/management')
          tests=Path('app/src/androidTest/java/iecxiv/meshfabric/ui/management')
          expected={'UserGroupDeleteDialog.kt':'a8ced15d06e1989ea34a84fe9fea12582d1ca109','UserGroupEditDialog.kt':'2e89b8a92396bc865d9f72f5c614d74caff890f3','UserGroupMemberRemoveDialog.kt':'17b5154534169a5905c4b6e26dffddb43ebfde81'}
          for name,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(main/name)],text=True).strip()==sha,'Source changed: '+name
          assert (main/'ProfileReviewIdentity.kt').exists()
          regression=tests/'ReadableUserGroupDialogsTest.kt'
          assert not regression.exists()
          def replace(s,old,new):
              assert s.count(old)==1,'Missing/nonunique anchor: '+old[:100]
              return s.replace(old,new,1)
          warning='            if(!identityReady || identityInvalidated) Text(t("No se puede confirmar: falta un nombre o los datos visibles no distinguen inequívocamente el destino. Cierra y actualiza la ficha.","Cannot confirm: a name is missing or visible information does not uniquely identify the target. Close and refresh the details."),color=MaterialTheme.colorScheme.error,style=MaterialTheme.typography.bodySmall)'
          for file,mode in [('UserGroupDeleteDialog.kt','delete'),('UserGroupEditDialog.kt','edit'),('UserGroupMemberRemoveDialog.kt','member')]:
              p=main/file;s=p.read_text()
              s=replace(s,'import androidx.compose.ui.platform.LocalConfiguration','import androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.testTag')
              record='group' if mode=='member' else 'original'
              setup='    val identity=profileReviewIdentity('+record+',s.listedUserGroups.orEmpty(),es)\n'
              if mode=='member':
                  setup+='    val originalUser=remember(id) {s.users.singleOrNull {it.optString("_id")==id}?.let {JSONObject(it.toString())}}\n    val memberIdentity=profileReviewIdentity(originalUser,s.users,es)\n    val identityReady=identity.usable && memberIdentity.usable\n'
              else:
                  setup+='    val identityReady=identity.usable\n'
              setup+='    var identityInvalidated by remember {mutableStateOf(false)}\n    LaunchedEffect(review,identityReady) {if(review && !identityReady) {identityInvalidated=true;approved=false}}\n'
              s=replace(s,'    val context=',setup+'    val context=identityReady && !identityInvalidated && ')
              if mode=='delete':
                  s=replace(s,'val canReview=profileUserGroupDeleteAllowed','val canReview=context && profileUserGroupDeleteAllowed')
                  s=replace(s,'            Text(original.getString("name"),style=MaterialTheme.typography.titleSmall)','            Text(identity.label,style=MaterialTheme.typography.titleSmall)')
                  s=replace(s,'            Text(original.getString("_id"),style=MaterialTheme.typography.bodySmall)',warning)
                  anchor='    val ids=remember {original.getJSONObject("links").keys().asSequence().sorted().toList()}'
                  extra='\n    val linkNames=remember(original) {ProfileDisplayNames()}\n    val linkRecords=remember(original) {ids.map {id->JSONObject().put("_id",id).put("name",original.getJSONObject("links").optJSONObject(id)?.opt("name"))}}\n    linkNames.observe(linkRecords+s.users+s.groups+s.listedUserGroups.orEmpty()+s.userGroups.orEmpty())'
                  s=replace(s,anchor,anchor+extra)
                  s=replace(s,'{Text(it,style=MaterialTheme.typography.bodySmall)}','{Text((if(it.startsWith("user/")) t("Usuario: ","User: ") else t("Grupo de dispositivos: ","Device group: "))+linkNames.label(it,es),style=MaterialTheme.typography.bodySmall)}')
                  s=replace(s,'Checkbox(approved,{approved=it},enabled=context)','Checkbox(approved,{approved=it},enabled=context,modifier=Modifier.testTag("ug-delete-consent"))')
                  s=replace(s,'modifier=Modifier.fillMaxWidth())\n            Text(t("Se vuelve','modifier=Modifier.fillMaxWidth().testTag("ug-delete-name"))\n            Text(t("Se vuelve')
                  s=replace(s,'Button(enabled=if(review) profileUserGroupDeleteAllowed(s,packet,server) else canReview,','Button(modifier=Modifier.testTag(if(review) "ug-delete-send" else "ug-delete-prepare"),enabled=if(review) context && profileUserGroupDeleteAllowed(s,packet,server) else canReview,')
              elif mode=='edit':
                  s=replace(s,'val canReview=profileUserGroupEditAllowed','val canReview=context && profileUserGroupEditAllowed')
                  s=replace(s,'val canSend=profileUserGroupEditAllowed','val canSend=context && profileUserGroupEditAllowed')
                  s=replace(s,'            Text(original.getString("name"),style=MaterialTheme.typography.titleSmall)','            Text(identity.label,style=MaterialTheme.typography.titleSmall)')
                  s=replace(s,'            Text(id,style=MaterialTheme.typography.bodySmall)',warning)
                  s=replace(s,'Checkbox(approved,{approved=it},enabled=context)','Checkbox(approved,{approved=it},enabled=context,modifier=Modifier.testTag("ug-edit-consent"))')
                  s=replace(s,'isError=original.isNull("membershipType") && !profileUserGroupNameValid(name),modifier=Modifier.fillMaxWidth())','isError=original.isNull("membershipType") && !profileUserGroupNameValid(name),modifier=Modifier.fillMaxWidth().testTag("ug-edit-name"))')
                  s=replace(s,'Button(enabled=if(review) canSend else canReview,','Button(modifier=Modifier.testTag(if(review) "ug-edit-send" else "ug-edit-prepare"),enabled=if(review) canSend else canReview,')
              else:
                  s=replace(s,'            Text(group.optString("name"),style=MaterialTheme.typography.titleSmall)','            Text(identity.label,style=MaterialTheme.typography.titleSmall)')
                  s=replace(s,'            Text(t("Grupo: ","Group: ")+group.getString("_id"),style=MaterialTheme.typography.bodySmall)',warning)
                  s=replace(s,'Text(t("Usuario: ","User: ")+id,style=MaterialTheme.typography.bodySmall)','Text(t("Usuario: ","User: ")+memberIdentity.label,style=MaterialTheme.typography.bodySmall)')
                  s=replace(s,'Checkbox(approved,{approved=it},enabled=context)','Checkbox(approved,{approved=it},enabled=context,modifier=Modifier.testTag("ug-member-consent"))')
                  s=replace(s,'Button(enabled=if(review) profileUserGroupMemberRemoveAllowed(s,packet,server) else context,','Button(modifier=Modifier.testTag(if(review) "ug-member-send" else "ug-member-prepare"),enabled=if(review) context && profileUserGroupMemberRemoveAllowed(s,packet,server) else context,')
              p.write_text(s)
          regression.write_text('''package iecxiv.meshfabric.ui.management
          import android.content.res.Configuration
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.test.*
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import iecxiv.meshfabric.data.remote.MeshCentralClient
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.MutableStateFlow
          import org.json.JSONObject
          import org.junit.Assert.*
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.util.Locale
          @RunWith(AndroidJUnit4::class) class ReadableUserGroupDialogsTest {
              @get:Rule val compose=createComposeRule()
              private val gid="ugrp//one";private val uid="user//person";private val mid="mesh//office"
              private fun field(target:Any,name:String)=target.javaClass.getDeclaredField(name).apply {isAccessible=true}
              private inner class Fixture(val mode:String):AutoCloseable {
                  val client=MeshCentralClient();val session=ProfileSession(client)
                  val group=JSONObject().put("_id",gid).put("name","Equipo").put("desc","Madrid").put("links",JSONObject().put(uid,JSONObject()).put(mid,JSONObject()))
                  val member=JSONObject().put("_id",uid).put("name","Ana").put("email","ana@example.invalid")
                  val mesh=JSONObject().put("_id",mid).put("name","Oficina")
                  val baseline=ProfileState(ready=true,user=JSONObject().put("_id","user//admin").put("siteadmin",256L),users=listOf(member),groups=listOf(mesh),listedUserGroups=listOf(group),userGroupPhase="ready")
                  val state=mutableStateOf(baseline)
                  init {
                      field(client,"serverUrl").set(client,"https://example.invalid/");field(client,"authCookie").set(client,"offline-user-group-test")
                      @Suppress("UNCHECKED_CAST") val connected=field(client,"_connectionState").get(client) as MutableStateFlow<Boolean>
                      connected.value=true
                      field(session,"binding").set(session,Triple(client.serverUrl,client.authCookie,false))
                      compose.setContent {
                          val config=Configuration(LocalConfiguration.current).apply {setLocale(Locale("es"))}
                          CompositionLocalProvider(LocalConfiguration provides config) {MaterialTheme {
                              when(mode) {
                                  "delete"->UserGroupDeleteDialog(session,state.value,group) {}
                                  "edit"->UserGroupEditDialog(session,state.value,group) {}
                                  else->UserGroupMemberRemoveDialog(session,state.value,group,uid) {}
                              }
                          }}
                      }
                  }
                  fun assertNoIds() {for(id in listOf(gid,uid,mid)) compose.onAllNodesWithText(id,substring=true).assertCountEquals(0)}
                  fun ambiguous()=baseline.copy(listedUserGroups=listOf(group,JSONObject(group.toString()).put("_id","ugrp//duplicate")))
                  override fun close() {
                      assertNull(field(client,"webSocket").get(client));assertNull(field(session,"socket").get(session))
                      session.close();(field(client,"scope").get(client) as CoroutineScope).cancel()
                  }
              }
              @Test fun deleteStillRequiresExactNameReviewAndSeparateConsent() {Fixture("delete").use {f->
                  f.assertNoIds()
                  compose.onNodeWithTag("ug-delete-prepare").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-delete-name").performScrollTo().performTextInput("equipo")
                  compose.onNodeWithTag("ug-delete-prepare").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-delete-name").performTextReplacement("Equipo ")
                  compose.onNodeWithTag("ug-delete-prepare").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-delete-name").performTextReplacement("Equipo")
                  compose.onNodeWithTag("ug-delete-prepare").assertIsEnabled().performClick()
                  compose.onNodeWithTag("ug-delete-send").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-delete-consent").performScrollTo().performClick()
                  compose.onNodeWithTag("ug-delete-send").assertIsEnabled()
                  compose.runOnIdle {f.state.value=f.ambiguous()}
                  compose.onNodeWithTag("ug-delete-send").assertIsNotEnabled()
                  compose.runOnIdle {f.state.value=f.baseline}
                  compose.onNodeWithTag("ug-delete-send").assertIsNotEnabled()
              }}
              @Test fun deletionImpactUsesNamesWithoutRawIdentifiers() {Fixture("delete").use {f->
                  compose.onNodeWithText("Ver todos los enlaces recibidos").performScrollTo().performClick()
                  compose.onNodeWithText("Usuario: «Ana»").assertExists()
                  compose.onNodeWithText("Grupo de dispositivos: «Oficina»").assertExists()
                  f.assertNoIds()
              }}
              @Test fun editingKeepsReviewAndRejectsAmbiguousTarget() {Fixture("edit").use {f->
                  f.assertNoIds()
                  compose.onNodeWithTag("ug-edit-name").performScrollTo().performTextReplacement("Equipo nuevo")
                  compose.onNodeWithTag("ug-edit-prepare").assertIsEnabled().performClick()
                  compose.onNodeWithTag("ug-edit-send").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-edit-consent").performScrollTo().performClick()
                  compose.onNodeWithTag("ug-edit-send").assertIsEnabled()
                  compose.runOnIdle {f.state.value=f.ambiguous()}
                  compose.onNodeWithTag("ug-edit-send").assertIsNotEnabled()
                  compose.runOnIdle {f.state.value=f.baseline}
                  compose.onNodeWithTag("ug-edit-send").assertIsNotEnabled()
              }}
              @Test fun memberRemovalUsesFrozenReadableIdentityAndBlocksMissingName() {Fixture("member").use {f->
                  f.assertNoIds()
                  compose.onNodeWithText("Usuario: Ana · ana@example.invalid").assertExists()
                  compose.onNodeWithTag("ug-member-prepare").assertIsEnabled().performClick()
                  compose.onNodeWithTag("ug-member-send").assertIsNotEnabled()
                  compose.onNodeWithTag("ug-member-consent").performScrollTo().performClick()
                  compose.onNodeWithTag("ug-member-send").assertIsEnabled()
                  compose.runOnIdle {f.state.value=f.baseline.copy(users=listOf(JSONObject(f.member.toString()).apply {remove("name")}))}
                  compose.onNodeWithTag("ug-member-send").assertIsNotEnabled()
                  compose.runOnIdle {f.state.value=f.baseline}
                  compose.onNodeWithTag("ug-member-send").assertIsNotEnabled()
              }}
          }
          ''')
          PY
          git diff --check
      - name: Install compile SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build, execute unit tests, compile Android tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute offline dialog, wire, authority and navigation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=iecxiv.meshfabric.ui.management.ReadableUserGroupDialogsTest,iecxiv.meshfabric.ui.management.UserGroupDeleteRequestTest,iecxiv.meshfabric.ui.management.UserGroupEditRequestTest,iecxiv.meshfabric.ui.management.UserGroupMemberRemoveRequestTest,iecxiv.meshfabric.ui.management.ReadableAssignmentReviewsTest,iecxiv.meshfabric.ui.management.ProfileDisplayNamesTest,iecxiv.meshfabric.ui.management.UserGroupsActionsCardTest,iecxiv.meshfabric.ui.management.UserGroupsSectionSpacingTest,iecxiv.meshfabric.ui.management.ReceivedUserGroupNavigationTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-user-group-dialog-validation-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only validated sources if dev is unchanged
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ github.sha }}" || { echo 'dev moved; refusing publication'; exit 1; }
          git add -- app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupDeleteDialog.kt app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupEditDialog.kt app/src/main/java/iecxiv/meshfabric/ui/management/UserGroupMemberRemoveDialog.kt app/src/androidTest/java/iecxiv/meshfabric/ui/management/ReadableUserGroupDialogsTest.kt
          python3 - <<'PY'
          import subprocess
          main='app/src/main/java/iecxiv/meshfabric/ui/management/'
          expected={main+n for n in ['UserGroupDeleteDialog.kt','UserGroupEditDialog.kt','UserGroupMemberRemoveDialog.kt']}|{'app/src/androidTest/java/iecxiv/meshfabric/ui/management/ReadableUserGroupDialogsTest.kt'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected,'Unexpected staged changes'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(profile): readable user group dialogs without weakening confirmations'
          git push origin HEAD:dev
