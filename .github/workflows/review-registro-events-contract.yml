name: Review MeshCentral 1.3.1 events contract
on:
  push:
    branches: [work/registro-server-events]
    paths: [.github/workflows/review-registro-events-contract.yml]
permissions:
  contents: write
concurrency:
  group: registro-events-contract
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain exact upstream package without lifecycle scripts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ee873325bafb864db729491fef4c973517c91065
          mkdir -p /tmp/registro-contract
          cd /tmp/registro-contract
          npm pack meshcentral@1.3.1 --ignore-scripts --json > pack.json
      - name: Extract bounded protocol evidence and provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,tarfile
          root=Path('/tmp/registro-contract')
          pack=json.loads((root/'pack.json').read_text())
          assert len(pack)==1 and pack[0]['version']=='1.3.1'
          archive=root/pack[0]['filename']
          out=Path('docs/reference/meshcentral-1.3.1-registro-events')
          assert not out.exists()
          out.mkdir(parents=True)
          metadata={'package':'meshcentral','version':'1.3.1','npm_integrity':pack[0].get('integrity'),'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':{}}
          headings=['# MeshCentral 1.3.1: server events protocol evidence','', 'This is a protocol audit, not an implemented or validated Android feature. The existing local Activity journal is not a server-history query. No app sources are changed by this audit.','', 'Evidence is extracted from the exact npm package without running package lifecycle scripts. Review request fields, response correlation, ordering, limits, permission checks and live-event behavior before implementing the native client.','']
          targets={'package/meshuser.js':r"case\s+['\"](?:events|clearevents|geteventcount|eventcount)['\"]|Get(?:All|User|Node|Mesh).*Events|GetEvents|responseid|eventfilter",'package/views/default.handlebars':r'(?i)events|eventfilter','package/db.js':r'Get(?:All|User|Node|Mesh).*Events|GetEvents|GetFailedLoginCount'}
          with tarfile.open(archive) as tar:
              for name,pattern in targets.items():
                  member=tar.getmember(name)
                  assert member.isfile() and member.size<25000000
                  data=tar.extractfile(member).read()
                  text=data.decode('utf-8')
                  metadata['files'][name]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
                  (root/Path(name).name).write_text(text)
                  lines=text.splitlines()
                  if name.endswith('meshuser.js'):
                      hits=[i for i,line in enumerate(lines) if re.search(r"case\s+['\"]events['\"]",line)]
                      assert hits,'No events action found in meshuser.js; stop instead of inventing a contract'
                      hits+= [i for i,line in enumerate(lines) if re.search(r"case\s+['\"](?:clearevents|geteventcount|eventcount)['\"]",line)]
                      radius=120
                  else:
                      hits=[i for i,line in enumerate(lines) if re.search(pattern,line)][:12]
                      radius=35
                  assert hits,name
                  intervals=[]
                  for i in sorted(set(hits)):
                      start=max(0,i-radius);end=min(len(lines),i+radius+1)
                      if intervals and start<=intervals[-1][1]:intervals[-1][1]=max(intervals[-1][1],end)
                      else:intervals.append([start,end])
                  headings += ['## '+name,'']
                  for start,end in intervals:
                      headings += [f'Lines {start+1}-{end}:','```javascript']+[f'{i+1}: {lines[i]}' for i in range(start,end)]+['```','']
          headings += ['## Implementation review checklist','', '- Match the server history request and response fields exactly; do not infer a contract from live event packets.', '- Determine what constitutes all visible events for the authenticated user; never claim a complete server audit log without evidence.', '- Confirm server-side authorization and distinguish explicit denial, unsupported requests, malformed responses, timeout and empty history.', '- Verify bounded queries, pagination or continuation support and ordering before exposing older-event controls.', '- Verify request correlation. If legacy replies lack a correlation field, isolate one request per channel and retire the channel before reuse after timeout.', '- Bind data to server and actor, reject stale callbacks, and clear history on identity or authority changes.', '- Keep Activity behavior and command output intact; do not turn observed events into action-success receipts.', '- Keep the first integration read-only; do not expose clear-events or server-log deletion.', '- Implement Spanish/English resources and reuse ManagementSectionTabs.', '- Before publishing application sources: execute JVM tests, lint, debug and Android-test compilation, and emulator Compose/instrumentation regressions. Automated UI checks are not a real-device visual review.','']
          (out/'README.md').write_text('\n'.join(headings))
          (out/'provenance.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-events-contract-${{ github.run_id }}
          path: |
            /tmp/registro-contract/
            docs/reference/meshcentral-1.3.1-registro-events/
          retention-days: 7
          if-no-files-found: error
      - name: Publish protocol evidence only on unchanged work branch
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = work/registro-server-events
          git fetch origin work/registro-server-events
          test "$(git rev-parse origin/work/registro-server-events)" = "${{ github.sha }}"
          git add -- docs/reference/meshcentral-1.3.1-registro-events/README.md docs/reference/meshcentral-1.3.1-registro-events/provenance.json
          python3 - <<'PY'
          import subprocess
          expected={'docs/reference/meshcentral-1.3.1-registro-events/README.md','docs/reference/meshcentral-1.3.1-registro-events/provenance.json'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,actual
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture MeshCentral 1.3.1 server events protocol evidence'
          git push origin HEAD:work/registro-server-events
