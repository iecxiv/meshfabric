<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MeshCentral Terminal</title>
    <link rel="stylesheet" href="xterm.css" />
    <script src="xterm.js"></script>
    <script src="xterm-fit.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            overflow: hidden !important;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #0d1117;
            overflow: hidden !important;
        }
        .xterm {
            width: 100% !important;
            height: 100% !important;
            padding: 0px !important;
            overflow: hidden !important;
        }
        .xterm-viewport {
            width: 100% !important;
            height: 100% !important;
            background-color: #0d1117 !important;
            overflow-y: hidden !important;
            overflow-x: hidden !important;
            touch-action: none !important;
        }
        .xterm-screen {
            width: 100% !important;
            overflow: hidden !important;
        }
        .xterm-text-layer, .xterm-selection-layer, .xterm-rows {
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        var term = null;
        var fitAddon = null;

        function notifyHtmlReady() {
            try {
                if (window.AndroidTerminal && window.AndroidTerminal.onHtmlReady) {
                    window.AndroidTerminal.onHtmlReady();
                    return true;
                }
            } catch (e) {
                console.error('notifyHtmlReady error:', e);
            }
            return false;
        }

        function ensureNotifyReady() {
            if (notifyHtmlReady()) return;
            var attempts = 0;
            var timer = setInterval(function() {
                attempts++;
                if (notifyHtmlReady() || attempts > 50) {
                    clearInterval(timer);
                }
            }, 50);
        }

        function scrollToBottom() {
            try {
                if (!term) return;
                if (term.buffer && term.buffer.active && term.buffer.active.type === 'alternate') {
                    term.scrollToTop();
                    var vp = document.querySelector('.xterm-viewport');
                    if (vp) vp.scrollTop = 0;
                    var screen = document.querySelector('.xterm-screen');
                    if (screen) screen.scrollTop = 0;
                    return;
                }
                term.scrollToBottom();
                var vp = document.querySelector('.xterm-viewport');
                if (vp) vp.scrollTop = vp.scrollHeight;
            } catch(e) {}
        }

        window.writeTerminalData = function(data) {
            try {
                if (term) {
                    term.write(data);
                    if (term.buffer && term.buffer.active && term.buffer.active.type === 'alternate') {
                        term.scrollToTop();
                        var vp = document.querySelector('.xterm-viewport');
                        if (vp) vp.scrollTop = 0;
                        var screen = document.querySelector('.xterm-screen');
                        if (screen) screen.scrollTop = 0;
                    } else {
                        scrollToBottom();
                    }
                }
            } catch (e) {
                console.error('Terminal write error:', e);
            }
        };

        window.setFontSize = function(size) {
            try {
                if (term) {
                    term.options.fontSize = size;
                    fitTerminal();
                }
            } catch (e) {
                console.error('setFontSize error:', e);
            }
        };

        window.getFontSize = function() {
            return (term && term.options.fontSize) ? term.options.fontSize : 11;
        };

        window.clearTerminal = function() {
            try {
                if (term) {
                    term.clear();
                }
            } catch (e) {}
        };

        window.focusTerminal = function() {
            try {
                if (term) {
                    term.focus();
                    if (term.buffer && term.buffer.active && term.buffer.active.type === 'alternate') {
                        term.scrollToTop();
                        var vp = document.querySelector('.xterm-viewport');
                        if (vp) vp.scrollTop = 0;
                    } else {
                        scrollToBottom();
                    }
                }
            } catch (e) {}
        };

        var lastCols = 0, lastRows = 0;

        function getRealCellDimensions() {
            try {
                if (term && term._core) {
                    if (term._core._renderService && term._core._renderService.dimensions) {
                        var d = term._core._renderService.dimensions;
                        var w = (d.css && d.css.cell && d.css.cell.width) || (d.actualCell && d.actualCell.width);
                        var h = (d.css && d.css.cell && d.css.cell.height) || (d.actualCell && d.actualCell.height);
                        if (w > 0 && h > 0) {
                            return { width: w, height: h };
                        }
                    }
                    if (term._core._charSizeService && term._core._charSizeService.width > 0) {
                        return {
                            width: term._core._charSizeService.width,
                            height: term._core._charSizeService.height
                        };
                    }
                }
            } catch(e) {}

            var fs = (term ? term.options.fontSize : 11);
            return {
                width: fs * 0.601,
                height: fs * 1.35
            };
        }

        function calculateColsRows() {
            var container = document.getElementById('terminal-container');
            if (!container) return null;
            var w = container.clientWidth || window.innerWidth;
            var h = container.clientHeight || window.innerHeight;
            if (w < 30 || h < 30) return null;

            var cell = getRealCellDimensions();

            var cols = Math.floor(w / cell.width);
            var rows = Math.floor(h / cell.height);

            return {
                cols: Math.max(5, cols),
                rows: Math.max(2, rows)
            };
        }

        var remoteResizeTimer = null;

        function fitTerminal() {
            try {
                if (!term) return;

                if (fitAddon && typeof fitAddon.fit === 'function') {
                    try { fitAddon.fit(); } catch(e){}
                } else {
                    var dims = calculateColsRows();
                    if (dims && dims.cols >= 5 && dims.rows >= 2) {
                        term.resize(dims.cols, dims.rows);
                    }
                }

                if (term.buffer && term.buffer.active && term.buffer.active.type === 'alternate') {
                    term.scrollToTop();
                    var vp = document.querySelector('.xterm-viewport');
                    if (vp) vp.scrollTop = 0;
                    var screen = document.querySelector('.xterm-screen');
                    if (screen) screen.scrollTop = 0;
                } else {
                    scrollToBottom();
                }
            } catch(e) {
                console.error('fitTerminal error:', e);
            }
        }
        window.fitTerminal = fitTerminal;

        function handleResize() {
            fitTerminal();
        }

        window.onload = function() {
            try {
                var TerminalClass = window.Terminal || (typeof Terminal !== 'undefined' ? Terminal : null);
                if (!TerminalClass) {
                    console.error('TerminalClass is null on window.onload');
                    ensureNotifyReady();
                    return;
                }

                term = new TerminalClass({
                    cols: 80,
                    rows: 25,
                    cursorBlink: true,
                    cursorStyle: 'block',
                    fontSize: 11,
                    fontFamily: 'monospace, "Courier New", Courier, Menlo, Monaco',
                    convertEol: true,
                    scrollback: 5000,
                    scrollSensitivity: 5,
                    fastScrollSensitivity: 15,
                    theme: {
                        background: '#0d1117',
                        foreground: '#c9d1d9',
                        cursor: '#58a6ff',
                        cursorAccent: '#0d1117',
                        selectionBackground: '#1f6beb',
                        black: '#484f58',
                        red: '#ff7b72',
                        green: '#3fb950',
                        yellow: '#d29922',
                        blue: '#58a6ff',
                        magenta: '#bc8cff',
                        cyan: '#39c5cf',
                        white: '#b1bac4',
                        brightBlack: '#6e7681',
                        brightRed: '#ffa198',
                        brightGreen: '#56d364',
                        brightYellow: '#e3b341',
                        brightBlue: '#79c0ff',
                        brightMagenta: '#d2a8ff',
                        brightCyan: '#56d4dd',
                        brightWhite: '#f0f6fc'
                    }
                });

                term.open(document.getElementById('terminal-container'));

                try {
                    var FitClass = window.FitAddon;
                    if (FitClass) {
                        if (typeof FitClass === 'function') {
                            fitAddon = new FitClass();
                        } else if (typeof FitClass.FitAddon === 'function') {
                            fitAddon = new FitClass.FitAddon();
                        }
                    }
                    if (fitAddon && term.loadAddon) {
                        term.loadAddon(fitAddon);
                    }
                } catch(e) {
                    console.error('FitAddon init error:', e);
                }

                term.onResize(function(evt) {
                    if (window.AndroidTerminal && evt.cols >= 5 && evt.rows >= 2) {
                        window.AndroidTerminal.onTerminalResize(evt.cols, evt.rows);
                    }
                });

                fitTerminal();
                term.focus();
                ensureNotifyReady();

                if (typeof ResizeObserver !== 'undefined') {
                    var ro = new ResizeObserver(function() {
                        handleResize();
                    });
                    ro.observe(document.getElementById('terminal-container'));
                }

                term.onData(function(data) {
                    if (window.AndroidTerminal) {
                        window.AndroidTerminal.sendInput(data);
                    }
                });

                window.addEventListener('resize', handleResize);
                window.addEventListener('orientationchange', handleResize);

                var touchStartY = 0;
                var touchAccumulator = 0;
                var termElem = document.getElementById('terminal-container');
                if (termElem) {
                    termElem.addEventListener('touchstart', function(e) {
                        if (e.touches && e.touches.length === 1) {
                            touchStartY = e.touches[0].clientY;
                            touchAccumulator = 0;
                        }
                    }, { passive: true });

                    termElem.addEventListener('touchmove', function(e) {
                        if (e.touches && e.touches.length === 1 && term) {
                            if (term.buffer && term.buffer.active && term.buffer.active.type === 'alternate') {
                                return;
                            }
                            var currentY = e.touches[0].clientY;
                            var deltaY = touchStartY - currentY;
                            touchAccumulator += deltaY;
                            touchStartY = currentY;

                            var lineHeight = 18;
                            var linesToScroll = Math.trunc(touchAccumulator / lineHeight);
                            if (linesToScroll !== 0) {
                                term.scrollLines(linesToScroll);
                                touchAccumulator -= (linesToScroll * lineHeight);
                            }
                        }
                    }, { passive: true });
                }
            } catch(err) {
                console.error('Fatal terminal init error on window.onload:', err);
                ensureNotifyReady();
            }
        };
    </script>
</body>
</html>
