<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MeshFabric Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <link rel="stylesheet" href="terminal-touch-scroll.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #0d1117; overflow: hidden; }
    #terminal-container { width: 100%; height: 100%; overflow: hidden; }
    #terminal-error { position: absolute; inset: 0; padding: 16px; background: #0d1117; color: #ff7b72; font: 14px monospace; white-space: pre-wrap; }
  </style>
  <script defer src="xterm.js"></script>
  <script defer src="xterm-fit.js"></script>
  <script defer src="terminal-resize.js"></script>
  <script defer src="terminal-selection.js"></script>
  <script defer src="terminal-runtime.js"></script>
</head>
<body>
  <div id="terminal-container"></div>
  <div id="terminal-error" role="alert" hidden></div>
</body>
</html>
